    vessel_card: () => ({ alt: 'MV ECADEMY particulars.', svg: `<table class="v"><tr><td>Vessel</td><td>MV ECADEMY</td></tr><tr><td>Type</td><td>Handymax bulk carrier</td></tr><tr><td>Deadweight</td><td>37,163 MT</td></tr><tr><td>Length overall</td><td>189.99 m</td></tr><tr><td>Beam</td><td>28.50 m</td></tr><tr><td>Summer draft</td><td>10.40 m</td></tr><tr><td>Service speed</td><td>12 kn</td></tr><tr><td>Holds / cranes</td><td>5 / 4</td></tr><tr><td>Voyage</td><td>TR-001, Alpha Port berth A2 to Bravo Port</td></tr></table><div class="cap">Synthetic training data. Not a real vessel, port or chart.</div>` })

  /* ---------- course map ---------- */
  function renderSide(){
    const side = $('side'); const nodes = MAP.nodes;
    let h = '';
    const intro = MAP.lessons.find(l => l.code === 'INTRO');
    if (intro) h += `<button class="item${current === 'INTRO' ? ' on' : ''}" data-open="INTRO"><span class="cid">INTRO</span> ${esc(intro.title)}</button>`;
    if (!nodes.length) { side.innerHTML = h + '<p class="note">The new APEM course is in development. Lessons will appear here as they are released.</p>'; bind(); return; }
    for (const [st, name] of STAGES) {
      const parents = nodes.filter(n => n.kind === 'parent' && n.stage === st).sort((a, b) => a.display_order - b.display_order);
      if (!parents.length) continue;
      const done = parents.filter(p => p.status === 'passed').length;
      h += `<details class="stg" data-k="S:${st}"${OPEN.has('S:' + st) ? ' open' : ''}><summary><span class="ttl sname">${esc(name)}</span><span class="st">${done} / ${parents.length}</span></summary><div class="stgbody">`;
      const sIntro = MAP.lessons.find(l => l.code === st + '.INTRO');
      if (sIntro) h += `<button class="item${current === sIntro.code ? ' on' : ''}" data-open="${esc(sIntro.code)}">${esc(name)}: introduction video</button>`;
      for (const p of parents) {
        const subs = nodes.filter(n => n.parent_id === p.id).sort((a, b) => a.display_order - b.display_order);
        const PLs = MAP.lessons.filter(l => l.competency_id === p.id || (l.kind === 'exercise' && (l.competency_id || '').startsWith(p.id + '.')))
          .sort((a, b) => (a.kind === 'exercise') - (b.kind === 'exercise') || a.code.localeCompare(b.code));
        const kup = l => l.kind === 'narrated' ? 'Knowledge: narrated lesson' : l.kind !== 'exercise' ? 'Knowledge: explanation' : (l.code.endsWith('.G') ? 'Understanding: guided exercise' : 'Proficiency: independent exercise');
        const lstat = l => (nodes.find(n => n.id === l.competency_id) || {}).status;
        h += `<details data-k="${esc(p.id)}"${OPEN.has(p.id) ? ' open' : ''}><summary><span class="cid">${esc(p.id)}</span><span class="ttl">${esc(p.title || '')}</span><span class="st ${esc(p.status)}">${esc(LABEL[p.status] || p.status)}</span></summary>${PLs.length ? `<div class="plk">${PLs.map(l => lstat(l) === 'locked' ? `<button class="lk" disabled>${kup(l)} (locked)</button>` : `<button class="lk${current === l.code ? ' cur' : ''}" data-open="${esc(l.code)}">${kup(l)}</button>`).join('')}${RECORDS[p.id] && PLs.some(l => l.code === p.id + '.G') && lstat({ competency_id: p.id + '.01' }) !== 'locked' ? `<button class="lk${current === 'REC:' + p.id ? ' cur' : ''}" data-rec="${esc(p.id)}">${esc(RECORDS[p.id])}</button>` : ''}</div>` : ''}<ul class="sub">` +
          subs.map(s => { const L = MAP.lessons.find(l => l.competency_id === s.id && l.kind !== 'exercise'); return `<li${current === s.id ? ' class="on"' : ''}><span class="cid">${esc(s.id.slice(-3))}</span><span class="ttl">${esc(s.title || '')}${L && s.status !== 'locked' ? ` <button class="lk" data-open="${esc(L.code)}">Open explanation</button>` : ''}</span><span class="st ${esc(s.status)}">${esc(LABEL[s.status] || s.status)}</span></li>`; }).join('') + '</ul></details>';

  function bind(){ document.querySelectorAll('#side [data-open]').forEach(b => b.onclick = () => openLesson(b.dataset.open));

    document.querySelectorAll('#side details[data-k]').forEach(d => d.addEventListener('toggle', () => { d.open ? OPEN.add(d.dataset.k) : OPEN.delete(d.dataset.k); })); }

  function renderOverview(){
    stopMedia(); current = null;
    const n = MAP.nodes, par = n.filter(x => x.kind === 'parent'), sub = n.filter(x => x.kind === 'subskill');
    const built = MAP.lessons.filter(l => l.competency_id && l.kind !== 'exercise').length, exb = MAP.lessons.filter(l => l.kind === 'exercise').length;
    $('main').innerHTML = `<img class="hero" src="media/apem/apem-bg.jpg" alt="Voyage planning on the bridge: chart with the planned route, and the appraisal checklist"><h1>APEM course map</h1><p class="note">Appraisal, Planning, Execution and Monitoring on one voyage: MV ECADEMY, TR-001.</p>
      <div class="sum"><div><b>${par.length}</b><span>Competencies</span></div><div><b>${sub.length}</b><span>Subskills</span></div><div><b>${built}</b><span>Explanations built</span></div><div><b>${exb}</b><span>Exercises built</span></div><div><b>${par.filter(x => x.status === 'passed').length}</b><span>Passed</span></div></div>
      <div class="card"><p>The map on the left shows every competency and its status for your account. The status comes from the server, from the prerequisite rules and your recorded results.</p>
      <p>${MAP.lessons.some(l => l.code === 'INTRO') ? 'Start with the Introduction.' : ''} Lessons for the competencies are built and released one at a time. A competency with no lesson built yet cannot be opened, whatever its status.</p><p class="note">Lessons built so far: ${MAP.lessons.map(l => esc(l.code)).join(', ') || 'none'}.</p></div>`;
    renderSide();
  }

  /* ---------- lesson viewer (Introduction: no assessment) ---------- */
  // when a lesson has more than one version, the map lists only the newest (the server serves the newest too)
  const latestOnly = m => { const top = {}; for (const l of m.lessons) top[l.code] = Math.max(top[l.code] || 0, l.version || 1); m.lessons = m.lessons.filter(l => (l.version || 1) === top[l.code]); return m; };
  const stopMedia = () => { if (window.APEM_NARRATED) window.APEM_NARRATED.stop(); };
  // downloads a lesson; an encrypted lesson file is opened with a key the server releases only if the lesson is open for this account
  async function loadLesson(code){
    const d = await call({ action: 'lesson', code });
    const L = d.lesson;
    if (L.content.enc) {
      const r = await fetch('apem-content/' + L.content.file, { cache: 'no-cache' });
      if (!r.ok) throw new Error('The lesson file could not be downloaded. Check your connection and try again.');
      const buf = new Uint8Array(await r.arrayBuffer());
      if (new TextDecoder().decode(buf.slice(0, 5)) !== 'APEM1') throw new Error('The lesson file is not valid.');
      let bin = ''; buf.slice(5, 261).forEach(b => bin += String.fromCharCode(b));
      const k = await call({ action: 'lesson_key', code, wk: btoa(bin) });
      const key = await crypto.subtle.importKey('raw', Uint8Array.from(atob(k.key), c => c.charCodeAt(0)), 'AES-GCM', false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(261, 273) }, key, buf.slice(273));
      L.content = JSON.parse(new TextDecoder().decode(plain));
    }
    return d;
  }
  // section progress of narrated lessons, saved to the student's account by a separate small server function
  // OFF until the owner approves the new table (apem_lesson_progress) and server function (apem-progress): progress is then kept on the device only.
  const ACCOUNT_PROGRESS = false;
  async function progressCall(body){ const r = await sb.functions.invoke('apem-progress', { body }); if (r.error) throw new Error('progress'); return r.data; }
  async function openLesson(code){
    stopMedia();
    const main = $('main'); main.innerHTML = '<p class="note">Loading…</p>';
    try {
      const d = await loadLesson(code);
      current = code; renderSide();
      const L = d.lesson;
      if (L.content.kind === 'narrated') return window.APEM_NARRATED.render({ main, esc, lesson: L, admin: !!d.admin, open: openLesson, record: renderRecord, overview: renderOverview,
        loadProgress: ACCOUNT_PROGRESS ? (c => progressCall({ action: 'get', code: c }).then(x => x.state)) : null, saveProgress: ACCOUNT_PROGRESS ? ((c, state) => progressCall({ action: 'set', code: c, state })) : null });
      if (L.content.kind === 'exercise') { current = code; renderSide(); return renderExercise(L); }
      const S = L.content.screens || [], media = Object.fromEntries((d.media || []).map(m => [m.asset_code, m]));
      let i = 0;
      const draw = () => {
        const s = S[i]; let vis = '';
        if (s.visual && s.visual.diagram && DIAGRAM[s.visual.diagram]) { const g = DIAGRAM[s.visual.diagram](); vis = `<figure class="vis" style="margin-left:0;margin-right:0">${g.svg}<figcaption>${esc(g.alt)}</figcaption></figure>`; }
        else if (s.visual && s.visual.video) vis = `<figure class="vis" style="margin-left:0;margin-right:0"><video controls preload="metadata" playsinline style="width:100%;border-radius:8px;background:#000" src="${esc(s.visual.src)}"></video>${s.visual.plain ? '' : `<figcaption>${esc(s.visual.label || '')} (${esc(s.visual.video)}). ${esc(s.visual.note || 'Captions are shown in the picture. Silent draft animation: narration and realistic footage will replace it.')}</figcaption>`}</figure>`;
        else if (s.visual && s.visual.pending) { const m = media[s.visual.pending]; vis = `<div class="pending" role="note">${esc(s.visual.label || 'Media')}<br>Pending production (${esc(s.visual.pending)}${m ? ', status: ' + esc(m.status.replace('_', ' ')) : ''}). Not yet available.</div>`; }
        main.innerHTML = `<h1>${esc(L.content.title)}</h1>${S.length > 1 ? `<p class="note">Screen ${i + 1} of ${S.length}. ${L.content.kind === 'knowledge' ? 'Knowledge section. The guided exercise and the proficiency check for this topic are not built yet.' : 'This introduction has no assessment.'}</p>` : ''}
          <div class="card">${s.h ? `<h2>${esc(s.h)}</h2>` : ''}${(s.p || []).map(p => `<p>${esc(p)}</p>`).join('')}${vis}${(s.points || []).length ? `<ul class="pts">${s.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}</div>
          <div class="nav"><button class="b ghost" id="prev" ${i === 0 ? 'disabled' : ''}>Previous</button><span class="count">${i + 1} / ${S.length}</span>${i < S.length - 1 ? '<button class="b" id="next">Next</button>' : '<button class="b" id="done">Back to course map</button>'}</div>
          ${d.admin ? `<p class="note" style="margin-top:16px">Owner preview. Content status: ${esc(L.review_status.replace('_', ' '))}. ${esc(L.content.notice || '')}</p>` : ''}`;
        if ($('prev')) $('prev').onclick = () => { i--; draw(); main.focus(); };
        if ($('next')) $('next').onclick = () => { i++; draw(); main.focus(); };
        if ($('done')) $('done').onclick = renderOverview;
      };
      draw();
    } catch (e) { main.innerHTML = `<div class="card"><p class="err">${esc(e.message)}</p><button class="b ghost" id="bk">Back to course map</button></div>`; $('bk').onclick = renderOverview; }
  }

  /* ---------- exercises: documents on the left, structured form on the right; every answer is checked by the server ---------- */
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'k-' + Date.now() + '-' + Math.random().toString(36).slice(2, 12));
  const draftGet = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (_) { return null; } };
  const draftSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };

  async function renderExercise(L) {
    stopMedia();
    const X = L.content, comp = L.code.split('.')[0], main = $('main');
    let work = {};
    try { work = (await call({ action: 'my_work', code: comp })).steps || {}; } catch (_) {}
    const state = {};                      // per step: { values, sources }
    for (const s of X.steps) {
      const saved = work[s.key] && work[s.key].input, d = draftGet('apem:draft:' + s.key);
      state[s.key] = (d && d.values) ? d : (saved && saved.values ? { values: saved.values, sources: saved.sources || {} } : { values: {}, sources: {} });
    }
    const passed = k => !!(work[k] && work[k].passed);
    const stStatus = k => { const n = MAP.nodes.find(x => x.id === k); return n ? n.status : 'locked'; };
    let si = X.steps.findIndex(s => !passed(s.key)); if (si < 0) si = X.steps.length - 1;
    let docId = X.docs[0].id, last = null;

    const opt = (name, val, blank) => (blank ? '<option value=""></option>' : '') + X.options[name].map(([v, t]) => `<option value="${esc(v)}"${v === val ? ' selected' : ''}>${esc(t)}</option>`).join('');
    const docOpt = val => '<option value=""></option>' + X.docs.map(d => `<option value="${esc(d.id)}"${d.id === val ? ' selected' : ''}>${esc(d.id)}</option>`).join('');

    function control(f, def, v) {
      switch (def.type) {
        case 'doc': return `<select data-f="${f}">${docOpt(v)}</select>`;
        case 'select': return `<select data-f="${f}">${opt(def.opts, v, true)}</select>`;
        case 'text': return `<input type="text" data-f="${f}" value="${esc(v || '')}" autocomplete="off">`;
        case 'num': return `<input type="number" step="any" inputmode="decimal" data-f="${f}" value="${esc(v ?? '')}">`;
        case 'multi': return `<div class="chk">` + X.options[def.opts].map(([c, t]) => `<label><input type="checkbox" data-f="${f}" data-m="${esc(c)}"${(v || []).includes(c) ? ' checked' : ''}> ${esc(t)}</label>`).join('') + `</div>`;
        case 'qty': return `<span class="row2"><input type="number" step="any" inputmode="decimal" data-f="${f}" data-p="v" value="${esc(v && v.v !== undefined ? v.v : '')}"><select data-f="${f}" data-p="u">${opt('units', (v && v.u) || 'MT', false)}</select></span>`;
        case 'dt': return `<span class="row3"><input type="date" data-f="${f}" data-p="d" value="${esc((v && v.d) || '')}"><input type="text" class="hm" inputmode="numeric" placeholder="HH:MM" maxlength="5" aria-label="Time, 24-hour" data-f="${f}" data-p="t" value="${esc((v && v.t) || '')}"><select data-f="${f}" data-p="off" aria-label="UTC offset"><option value=""></option>${opt('offsets', v && v.off, false)}</select></span>`;
        case 'dtutc': return `<span class="row3"><input type="date" data-f="${f}" data-p="d" value="${esc((v && v.d) || '')}"><input type="text" class="hm" inputmode="numeric" placeholder="HH:MM" maxlength="5" aria-label="Time, 24-hour" data-f="${f}" data-p="t" value="${esc((v && v.t) || '')}"><span class="utc">UTC</span></span>`;
      }
      return '';
    }
    function registerHtml(step, rows, res) {
      const full = step.register_mode === 'full';
      const rr = (res && res.rows) || [];
      let h = `<div class="reg"><div class="regh">Action register${full ? '' : ' (issue, source and status)'}</div>`;
      rows.forEach((r, i) => {
        const fb = rr.find(x => x.issue === r.issue && !x.missing);
        h += `<div class="regrow${fb ? (fb.ok ? ' good' : ' bad') : ''}" data-i="${i}">
          <label>Issue<select data-r="issue">${opt('issues', r.issue, true)}</select></label>
          <label>Source<select data-r="src">${docOpt(r.src)}</select></label>
          <label>Status<select data-r="status">${opt('issue_status', r.status, true)}</select></label>
          ${full ? `<label class="wide">Action<select data-r="action">${opt('actions', r.action, true)}</select></label><label>Responsible<select data-r="owner">${opt('owners', r.owner, true)}</select></label>` : ''}
          <button type="button" class="b ghost sm" data-del="${i}">Remove</button>
          ${fb && !fb.ok ? `<div class="fb bad">${esc(fb.msg)}</div>` : ''}${fb && fb.ok ? '<div class="fb good">Correct</div>' : ''}</div>`;
      });
      const miss = rr.filter(x => x.missing);
      if (miss.length) h += `<div class="fb bad">${miss.length} required issue${miss.length > 1 ? 's are' : ' is'} not recorded${miss.some(m => m.issue) ? ': ' + miss.map(m => esc((X.options.issues.find(o => o[0] === m.issue) || [0, m.issue])[1])).join('; ') : ''}. ${esc(miss[0].msg)}</div>`;
      return h + `<button type="button" class="b ghost sm" id="addrow">Add issue</button></div>`;
    }

    function draw() {
      const step = X.steps[si], st = state[step.key], res = last && last.step === step.key ? last.res : null;
      if (step.fields.includes('register') && !Array.isArray(st.values.register)) {
        const prev = X.steps[si - 1];                       // carry the register forward from the previous step
        st.values.register = prev && Array.isArray(state[prev.key].values.register) ? JSON.parse(JSON.stringify(state[prev.key].values.register)) : [];
      }
      const doc = X.docs.find(d => d.id === docId);
      const chips = X.steps.length > 1 ? `<div class="steps">` + X.steps.map((s, i) => { const lock = stStatus(s.key) === 'locked' && !passed(s.key); return `<button class="chip${i === si ? ' on' : ''}${passed(s.key) ? ' done' : ''}" data-step="${i}"${lock ? ' disabled' : ''} title="${esc(s.title)}">${esc(s.key.slice(-2))}${passed(s.key) ? ' passed' : ''}</button>`; }).join('') + `</div>` : '';
      const fieldsHtml = step.fields.map(f => {
        if (f === 'register') return registerHtml(step, st.values.register, res && res.fields.register);
        const def = X.fields[f], r = res && res.fields[f];
        return `<div class="fld${r ? (r.ok ? ' good' : ' bad') : ''}"><label class="fl">${esc(def.label)}</label>${def.help ? `<div class="help">${esc(def.help)}</div>` : ''}
          <div class="ctl">${control(f, def, st.values[f])}${def.src ? `<label class="src">Source <select data-s="${f}">${docOpt(st.sources[f])}</select></label>` : ''}</div>
          ${r ? (r.ok ? '<div class="fb good">Correct</div>' : `<div class="fb bad">${esc(r.msg)}</div>`) : ''}</div>`;
      }).join('');

            (X.mode === 'practice' ? (res.parent_passed ? ' ' + esc(comp) + ' is complete.' : '') + (res.unlocked.length ? ' Now open: ' + res.unlocked.map(esc).join(', ') + '.' : '')
              : (lastStep ? ' The guided exercise is complete. Open the proficiency exercise from the course map.' : '')) +
            (!lastStep ? ` <button class="b" id="nextstep">Next step</button>` : ` <button class="b ghost" id="tomap">Back to course map</button>`) + `</div>`;
        } else outcome = `<div class="out bad"><b>Not yet correct.</b> ${res.good} of ${res.total} items correct. Attempt ${res.attempt_no}. ` +
          (X.mode === 'practice' ? 'The items marked need attention. Correct them and submit again.' : (res.level === 1 ? 'Each error is marked. Correct and submit again.' : res.level === 2 ? 'The principle for each error is shown.' : 'The method for each error is shown.')) + `</div>`;
      } else if (passed(step.key)) outcome = `<div class="out good">You have already passed this step. Your saved answers are shown.</div>`;
      main.innerHTML = `<h1>${esc(X.title)}</h1><p class="note">${esc(X.intro)}</p>${X.mode === 'guided' && RECORDS[comp] ? `<p><button class="b ghost sm" id="torec">${esc(RECORDS[comp])}</button></p>` : ''}${chips}
        <div class="ex"><section class="docs" aria-label="Voyage documents">
          <div class="tabs">${X.docs.map(d => `<button class="tab${d.id === docId ? ' on' : ''}" data-doc="${esc(d.id)}">${esc(d.id)}</button>`).join('')}</div>
          <article class="paper"><header><div class="pt">${esc(doc.title)}${doc.rev ? ' · ' + esc(doc.rev) : ''}</div><div class="pm">Reference ${esc(doc.id)} · Issued ${esc(doc.issued)}</div></header>
            <ol>${doc.lines.map(l => `<li>${esc(l)}</li>`).join('')}</ol><footer>Signed: ${esc(doc.issuer)}<span>SYNTHETIC TRAINING DOCUMENT · NOT FOR NAVIGATION</span></footer></article></section>
        <section class="form" aria-label="Your findings"><h2>${esc(step.key)} ${esc(step.title)}</h2><p>${esc(step.instruction)}</p>${fieldsHtml}
          <div class="nav"><button class="b" id="submit">Submit for checking</button><span class="count" id="busy"></span></div>${outcome}</section></div>
        ${MAP.admin ? `<p class="note" style="margin-top:16px">Owner preview. ${esc(X.notice || '')}</p>` : ''}`;
      wire(step, st);
    }

    function wire(step, st) {
      const save = () => draftSet('apem:draft:' + step.key, st);
      main.querySelectorAll('[data-doc]').forEach(b => b.onclick = () => { docId = b.dataset.doc; draw(); });
      main.querySelectorAll('[data-step]').forEach(b => b.onclick = () => { si = +b.dataset.step; draw(); main.focus(); });
      main.querySelectorAll('[data-f]').forEach(el => el.oninput = el.onchange = () => {
        const f = el.dataset.f, def = X.fields[f];
        if (def.type === 'multi') st.values[f] = [...main.querySelectorAll(`[data-f="${f}"]`)].filter(c => c.checked).map(c => c.dataset.m);
        else if (el.dataset.p) { const o = Object.assign({}, st.values[f] || (def.type === 'qty' ? { u: 'MT' } : {})); let val = el.value;
          if (el.dataset.p === 't') { const m = val.trim().match(/^(\d{1,2})[:.]?(\d{2})$/); if (m && +m[1] < 24 && +m[2] < 60) val = m[1].padStart(2, '0') + ':' + m[2]; }
          o[el.dataset.p] = val; st.values[f] = o; }
        else st.values[f] = def.type === 'num' ? (el.value === '' ? '' : Number(el.value)) : el.value;
        save();
      });
      main.querySelectorAll('[data-s]').forEach(el => el.onchange = () => { st.sources[el.dataset.s] = el.value; save(); });
      main.querySelectorAll('.regrow').forEach(row => row.querySelectorAll('[data-r]').forEach(el => el.onchange = () => { st.values.register[+row.dataset.i][el.dataset.r] = el.value; save(); }));
      main.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { st.values.register.splice(+b.dataset.del, 1); save(); draw(); });
      if ($('addrow')) $('addrow').onclick = () => { st.values.register.push({ issue: '', src: '', status: '', action: '', owner: '' }); save(); draw(); };
      if ($('nextstep')) $('nextstep').onclick = () => { si++; last = null; draw(); main.focus(); };
      if ($('tomap')) $('tomap').onclick = renderOverview;
      if ($('torec')) $('torec').onclick = () => renderRecord(comp);
      $('submit').onclick = async () => {
        const btn = $('submit'); btn.disabled = true; $('busy').textContent = 'Checking…';
        try {
          const values = {}; for (const f of step.fields) values[f] = st.values[f];
          if (X.fields.cargo_qty && step.fields.includes('cargo_qty') && values.cargo_qty && !values.cargo_qty.u) values.cargo_qty.u = 'MT';
          const sources = {}; for (const f of step.fields) if (X.fields[f].src) sources[f] = st.sources[f] || '';
          const res = await call({ action: 'submit', code: comp, step: step.key, mode: X.mode, key: uuid(), values, sources });
          last = { step: step.key, res };
          if (res.passed) { work[step.key] = { passed: true, input: { values, sources } }; try { localStorage.removeItem('apem:draft:' + step.key); } catch (_) {} }
          try { MAP = latestOnly(await call({ action: 'map' })); if (MAP.locks_off) LABEL.available = 'Open'; renderSide(); } catch (_) {}
          draw(); main.focus();
        } catch (e) { btn.disabled = false; $('busy').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
      };
    }
    draw();
  }

  /* ---------- the student's record: built from the answers the server has checked in the guided exercise ---------- */
  async function renderRecord(comp){
    stopMedia();
    const main = $('main'); main.innerHTML = '<p class="note">Loading…</p>';
    try {
      const X = (await loadLesson(comp + '.G')).lesson.content;
      const work = (await call({ action: 'my_work', code: comp })).steps || {};
      current = 'REC:' + comp; renderSide();
      const lab = (name, v) => { const o = (X.options[name] || []).find(x => x[0] === v); return o ? o[1] : v; };
      const show = (def, v) => {
        if (v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length)) return '';
        switch (def.type) {
          case 'select': return lab(def.opts, v);
          case 'multi': return v.map(x => lab(def.opts, x)).join(', ');
          case 'qty': return v.v === undefined || v.v === '' ? '' : v.v + ' ' + (v.u || '');
          case 'dt': return v.d && v.t ? `${v.d} ${v.t} local (UTC${v.off || ''})` : '';
          case 'dtutc': return v.d && v.t ? `${v.d} ${v.t} UTC` : '';
          default: return String(v);
        }
      };
      let rows = '', reg = null, done = 0;
      for (const st of X.steps) {
        const w = work[st.key], inp = (w && w.input) || { values: {}, sources: {} }, ok = !!(w && w.passed); if (ok) done++;
        rows += `<tr class="sec"><th colspan="3">${esc(st.key)} ${esc(st.title)}</th><td>${ok ? '<span class="st passed">Checked correct</span>' : w ? '<span class="st requires_correction">Requires correction</span>' : '<span class="st">Not yet done</span>'}</td></tr>`;
        for (const f of st.fields) {
          if (f === 'register') { if (Array.isArray(inp.values.register) && (ok || !reg)) reg = { rows: inp.values.register, ok, step: st.key }; continue; }
          const def = X.fields[f], val = show(def, inp.values[f]);
          rows += `<tr><td>${esc(def.label)}</td><td>${val ? esc(val) : '<span class="note">Not recorded</span>'}</td><td>${esc((inp.sources || {})[f] || '')}</td><td></td></tr>`;
        }
      }
      const regHtml = reg && reg.rows.length ? `<table class="rec"><tr class="sec"><th>Issue</th><th>Source</th><th>Status</th><th>Action</th><th>Responsible</th></tr>` + reg.rows.map(r =>
        `<tr><td>${esc(lab('issues', r.issue))}</td><td>${esc(r.src || '')}</td><td>${esc(lab('issue_status', r.status))}</td><td>${esc(r.action ? lab('actions', r.action) : '')}</td><td>${esc(r.owner ? lab('owners', r.owner) : '')}</td></tr>`).join('') + `</table>` : '<p class="note">No issues recorded yet.</p>';
      main.innerHTML = `<h1>${esc(RECORDS[comp])}</h1><p class="note">MV ECADEMY, voyage TR-001. Built from your answers in the guided exercise. ${done} of ${X.steps.length} steps checked correct by the server.</p>
        <div class="card" style="max-width:1000px"><table class="rec"><tr class="sec"><th>Item</th><th>Finding</th><th>Source document</th><th>Status</th></tr>${rows}</table>
        <h2 style="margin-top:18px">Action register</h2>${regHtml}
        <p class="note" style="margin-top:14px">This record is the first part of your voyage appraisal report. It is kept with your account and carried forward into the remaining Appraisal modules. Open items stay open until they are verified. It is not a passage plan and not permission to sail.</p></div>
        <div class="nav"><button class="b" id="recex">${done === X.steps.length ? 'Review the guided exercise' : 'Continue the guided exercise'}</button><button class="b ghost" id="recpr">Print</button><span class="count"></span><button class="b ghost" id="recmap">Back to course map</button></div>`;
      $('recex').onclick = () => openLesson(comp + '.G'); $('recpr').onclick = () => window.print(); $('recmap').onclick = renderOverview;
    } catch (e) { main.innerHTML = `<div class="card"><p class="err">${esc(e.message)}</p><button class="b ghost" id="bk">Back to course map</button></div>`; $('bk').onclick = renderOverview; }
  }

  async function init(){
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { $('side').innerHTML = ''; $('main').innerHTML = '<div class="card"><h2>Sign in required</h2><p>Sign in to ECADEMY first, then open APEM again from the Second Officer menu.</p><p><a href="index.html">Go to ECADEMY</a></p></div>'; return; }
    try {
      MAP = latestOnly(await call({ action: 'map' }));
      if (MAP.admin) { $('ownerBar').hidden = false; $('ownerBar').textContent = 'Owner preview: visible to admin accounts only until each lesson is released.' + (MAP.locks_off ? ' Locks are OFF for your admin account during development. Students remain locked.' : ''); if (MAP.locks_off) LABEL.available = 'Open'; }
      renderOverview();
    } catch (e) { $('side').innerHTML = ''; $('main').innerHTML = `<div class="card"><p class="err">${esc(e.message)}</p><p><a href="index.html">Back to ECADEMY</a></p></div>`; }
  }
  init();
})();
</script>
