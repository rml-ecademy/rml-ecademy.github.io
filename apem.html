<!doctype html>
<html lang="en">
<head>
<script>if(location.protocol==="http:"&&!/^(localhost|127\.|0\.0\.0\.0)/.test(location.hostname))location.replace("https://"+location.host+location.pathname+location.search+location.hash);</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1b2733">
<title>ECADEMY · APEM Voyage Planning and Navigation Simulator</title>
<style>
:root{--bg:#1b2733;--panel:#223242;--panel2:#283b4e;--rule:#34495d;--ink:#e6edf3;--mute:#9db1c3;--accent:#7fbfe6;--ok:#6fd0a8;--warn:#e6b85c;--lock:#7f93a6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Albert Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:#16212c;border-bottom:1px solid var(--rule)}
header b{letter-spacing:.06em}header .t{flex:1;min-width:0}header .t small{display:block;color:var(--mute);font-size:.8rem}
header a.back{color:var(--ink);text-decoration:none;border:1px solid var(--rule);border-radius:8px;padding:7px 12px;font-size:.88rem}
.disc{background:#3a2f16;color:#f3dfae;border-bottom:1px solid #5a4a22;padding:6px 18px;font-size:.78rem;font-weight:600;letter-spacing:.03em;text-align:center}
.owner{background:#1f3a4d;color:#cfe7f7;border-bottom:1px solid var(--rule);padding:6px 18px;font-size:.8rem;text-align:center}
.shell{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:calc(100vh - 120px)}
aside{border-right:1px solid var(--rule);background:var(--panel);padding:14px 12px;overflow:auto}
main{padding:22px 26px 60px;min-width:0}
@media (max-width:860px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--rule);max-height:46vh}main{padding:16px 14px 50px}}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.25rem;margin:0 0 12px}
.stage{margin:14px 0 6px;font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);display:flex;justify-content:space-between}
.item{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;color:var(--ink);font:inherit;padding:7px 9px;cursor:pointer}
.item:hover,.item:focus-visible{background:var(--panel2);outline:0;border-color:var(--rule)}
.item.on{background:var(--panel2);border-color:var(--accent)}
details{border-radius:8px}details>summary{list-style:none;cursor:pointer;padding:7px 9px;border-radius:8px;display:flex;gap:8px;align-items:baseline}
details>summary::-webkit-details-marker{display:none}details>summary:hover,details>summary:focus-visible{background:var(--panel2);outline:0}
details.stg{margin-top:8px;border:1px solid var(--rule);border-radius:10px;background:#1f2d3c}details.stg>summary{padding:10px 12px;font-weight:700;letter-spacing:.04em}details.stg>summary .sname::before{content:'\25B8';display:inline-block;width:1.1em;color:var(--accent)}details.stg[open]>summary .sname::before{content:'\25BE'}.stgbody{padding:2px 6px 8px}
.cid{font:600 .8rem ui-monospace,Consolas,monospace;color:var(--accent);min-width:44px}
.ttl{flex:1;min-width:0}.st{font-size:.72rem;white-space:nowrap;border:1px solid var(--rule);border-radius:999px;padding:1px 8px;color:var(--lock)}
.st.available{color:var(--accent);border-color:var(--accent)}.st.passed{color:var(--ok);border-color:var(--ok)}.st.in_progress,.st.requires_correction{color:var(--warn);border-color:var(--warn)}
ul.sub{list-style:none;margin:2px 0 8px;padding:0 0 0 12px;border-left:1px solid var(--rule)}
.plk{padding:2px 9px 6px 61px}button.lk{display:block;margin-top:3px;background:none;border:1px solid var(--accent);color:var(--accent);border-radius:7px;padding:3px 9px;font:600 .78rem inherit;cursor:pointer}button.lk:hover,button.lk:focus-visible{background:var(--accent);color:#0f1a24;outline:0}ul.sub li.on .ttl{color:var(--ink)}
ul.sub li{display:flex;gap:8px;align-items:baseline;padding:3px 8px;font-size:.88rem;color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:20px 22px;max-width:920px}
.card p{margin:0 0 12px}.pts{margin:14px 0 4px;padding:12px 16px 12px 34px;background:var(--panel2);border-radius:10px}.pts li{margin:3px 0}
.vis{margin:16px 0 4px;border:1px solid var(--rule);border-radius:10px;padding:14px;background:#1d2b39;overflow:auto}
.vis svg{display:block;max-width:100%;height:auto}.vis figcaption,.cap{color:var(--mute);font-size:.8rem;margin-top:8px}
.pending{border:1px dashed var(--warn);color:var(--warn);border-radius:10px;padding:18px;text-align:center;font-size:.92rem}
.nav{display:flex;align-items:center;gap:12px;margin-top:18px;max-width:920px}
button.b{background:var(--accent);color:#0f1a24;border:0;border-radius:9px;padding:10px 18px;font:600 .95rem inherit;cursor:pointer}
button.b.ghost{background:none;color:var(--ink);border:1px solid var(--rule)}button.b:disabled{opacity:.4;cursor:default}
.count{color:var(--mute);font-size:.88rem;flex:1;text-align:center}
table.v{border-collapse:collapse;width:100%;max-width:520px}table.v td{padding:5px 10px;border-bottom:1px solid var(--rule)}table.v td:first-child{color:var(--mute)}
.note{color:var(--mute);font-size:.88rem}.err{color:#ffb4a8}
.sum{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.sum div{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:10px 14px;min-width:120px}.sum b{display:block;font-size:1.4rem}
.sum span{color:var(--mute);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em}
</style>
</head>
<body>
<header>
  <div class="t"><b>ECADEMY</b> · APEM<small>Integrated Voyage Planning and Navigation Simulator</small></div>
  <a class="back" href="index.html">Back to ECADEMY</a>
</header>
<div class="disc">FOR TRAINING AND EDUCATIONAL PURPOSES ONLY. NOT FOR ACTUAL SHIP NAVIGATION.</div>
<div class="owner" id="ownerBar" hidden></div>
<div class="shell">
  <aside aria-label="Course map"><div id="side"><p class="note">Loading…</p></div></aside>
  <main id="main" tabindex="-1"><p class="note">Loading…</p></main>
</div>
<script src="assets/supabase-2.117.2.js"></script>
<script>
(() => {
  const SB_URL = 'https://eazrfhrbhftskcrffjun.supabase.co';
  const SB_KEY = 'sb_publishable_i1yPRozADgoCxDsU676f_A_bISeo-4I';   // publishable key: safe in the browser
  const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const STAGES = [['A','Appraisal'],['P','Planning'],['E','Execution'],['M','Monitoring'],['FINAL','Final assessment']];
  const LABEL = { locked:'Locked', available:'Available', in_progress:'In progress', passed:'Passed', requires_correction:'Requires correction', completed:'Completed', failed:'Failed', revalidation_required:'Revalidation required' };
  let MAP = null, current = null; const OPEN = new Set();   // which dropdowns are open (kept when the list redraws)

  async function call(body){
    const r = await sb.functions.invoke('apem', { body });
    if (r.error) { let m = 'The APEM server could not be reached. Check your connection and try again.', code = '';
      try { const j = await r.error.context.json(); if (j.message) m = j.message; code = j.error || ''; } catch (_) {}
      const e = new Error(m); e.code = code; throw e; }
    return r.data;
  }

  /* ---------- diagrams: drawn from fixed, verified values (no generated text) ---------- */
  const box = (x, y, w, h, t1, t2) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="#283b4e" stroke="#7fbfe6"/><text x="${x + w / 2}" y="${y + (t2 ? h / 2 - 3 : h / 2 + 5)}" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">${t1}</text>${t2 ? `<text x="${x + w / 2}" y="${y + h / 2 + 15}" text-anchor="middle" fill="#9db1c3" font-size="11">${t2}</text>` : ''}`;
  const arrow = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#9db1c3" stroke-width="2" marker-end="url(#ah)"/>`;
  const defs = '<defs><marker id="ah" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#9db1c3"/></marker></defs>';
  const DIAGRAM = {
    berth_to_berth: () => ({ alt: 'Berth-to-berth schematic: Alpha Port berth A2, pilot disembarks, sea passage, pilot boards, Bravo Port berth to be confirmed.',
      svg: `<svg viewBox="0 0 860 150" role="img" aria-label="Berth-to-berth schematic">${defs}<line x1="60" y1="60" x2="800" y2="60" stroke="#7fbfe6" stroke-width="3"/>` +
        [[60,'Alpha Port','Berth A2'],[245,'Pilot','disembarks'],[430,'Sea passage',''],[615,'Pilot','boards'],[800,'Bravo Port','berth to be confirmed']].map(([x, a, b]) =>
          `<circle cx="${x}" cy="60" r="9" fill="#1b2733" stroke="#7fbfe6" stroke-width="3"/><text x="${x}" y="98" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">${a}</text><text x="${x}" y="116" text-anchor="middle" fill="#9db1c3" font-size="12">${b}</text>`).join('') +
        `<text x="430" y="30" text-anchor="middle" fill="#9db1c3" font-size="12">One plan covers the whole voyage. Schematic only, not a chart.</text></svg>` }),
    apem_cycle: () => ({ alt: 'The four stages: Appraisal leads to Planning, which leads to Execution and Monitoring running together.',
      svg: `<svg viewBox="0 0 860 190" role="img" aria-label="The four APEM stages">${defs}${box(20,60,180,64,'Appraisal','gather and assess')}${arrow(200,92,238,92)}${box(240,60,180,64,'Planning','construct and check')}${arrow(420,92,468,92)}` +
        `<rect x="470" y="20" width="370" height="150" rx="10" fill="none" stroke="#e6b85c" stroke-dasharray="6 5"/><text x="655" y="42" text-anchor="middle" fill="#e6b85c" font-size="12">run at the same time</text>${box(490,56,160,64,'Execution','carry out the plan')}${box(662,56,160,64,'Monitoring','check progress')}<text x="655" y="150" text-anchor="middle" fill="#9db1c3" font-size="12">Amendments update both</text></svg>` }),
    kup: () => ({ alt: 'Each topic: Knowledge, then Understanding, then Proficiency. The next topic unlocks only on a correct result.',
      svg: `<svg viewBox="0 0 860 120" role="img" aria-label="How each topic works">${defs}${box(20,26,180,64,'Knowledge','explained step by step')}${arrow(200,58,228,58)}${box(230,26,180,64,'Understanding','video, slides, guided')}${arrow(410,58,438,58)}${box(440,26,180,64,'Proficiency','you do it yourself')}${arrow(620,58,648,58)}<rect x="650" y="26" width="190" height="64" rx="8" fill="#1f3a34" stroke="#6fd0a8"/><text x="745" y="54" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Next topic opens</text><text x="745" y="72" text-anchor="middle" fill="#9db1c3" font-size="11">only if done correctly</text></svg>` }),
    abort_pnr: () => ({ alt: 'Schematic approach, not to scale: the abort point lies in open water where the ship can still turn; the point of no return is where the channel becomes too narrow to turn back.',
      svg: `<svg viewBox="0 0 860 280" role="img" aria-label="Abort point and point of no return on an approach">${defs}<rect x="0" y="0" width="860" height="280" fill="#1d2b39"/>` +
        `<path d="M0,0 L860,0 L860,96 L560,96 C470,96 430,40 330,28 L0,20 Z" fill="#3a3f37" stroke="#8a8f7c"/><path d="M0,280 L860,280 L860,176 L560,176 C470,176 430,236 330,250 L0,262 Z" fill="#3a3f37" stroke="#8a8f7c"/>` +
        `<text x="640" y="60" text-anchor="middle" fill="#c9cdb9" font-size="12">Shoal water / land</text><text x="640" y="232" text-anchor="middle" fill="#c9cdb9" font-size="12">Shoal water / land</text>` +
        `<line x1="20" y1="136" x2="800" y2="136" stroke="#7fbfe6" stroke-width="2.5" marker-end="url(#ah)"/><rect x="808" y="112" width="40" height="48" fill="#283b4e" stroke="#7fbfe6"/><text x="828" y="141" text-anchor="middle" fill="#e6edf3" font-size="11">Berth</text>` +
        `<circle cx="300" cy="136" r="62" fill="none" stroke="#e6b85c" stroke-dasharray="5 5"/><text x="300" y="68" text-anchor="middle" fill="#e6b85c" font-size="11">room to turn, stop or anchor</text>` +
        `<circle cx="300" cy="136" r="8" fill="#e6b85c"/><text x="300" y="218" text-anchor="middle" fill="#e6b85c" font-size="14" font-weight="700">Abort point</text><text x="300" y="234" text-anchor="middle" fill="#9db1c3" font-size="11">last safe decision</text>` +
        `<path d="M292,128 C250,90 170,92 120,112" fill="none" stroke="#6fd0a8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><text x="150" y="88" text-anchor="middle" fill="#6fd0a8" font-size="11">escape route to safe water</text>` +
        `<circle cx="150" cy="196" r="20" fill="none" stroke="#6fd0a8"/><text x="150" y="200" text-anchor="middle" fill="#6fd0a8" font-size="10">anchor</text><text x="150" y="232" text-anchor="middle" fill="#6fd0a8" font-size="11">emergency anchorage</text>` +
        `<line x1="540" y1="100" x2="540" y2="172" stroke="#ff9d8a" stroke-width="3"/><text x="540" y="92" text-anchor="middle" fill="#ff9d8a" font-size="14" font-weight="700">Point of no return</text><text x="660" y="128" text-anchor="middle" fill="#9db1c3" font-size="11">committed: too narrow to turn back</text>` +
        `<text x="40" y="128" fill="#9db1c3" font-size="11">Open water</text><text x="430" y="272" text-anchor="middle" fill="#9db1c3" font-size="11">Schematic only. Not to scale. Not a chart.</text></svg>` }),
    abort_checks: () => ({ alt: 'Decision at the abort point: if all conditions are satisfied, proceed and log it; if any is not satisfied or in doubt, abort to the escape route, hold or anchor, and inform the Master, pilot and VTS.',
      svg: `<svg viewBox="0 0 860 210" role="img" aria-label="Decision at the abort point">${defs}${box(20,74,180,62,'At the abort point','check every condition')}${arrow(200,105,248,105)}<path d="M250,105 L360,50 L470,105 L360,160 Z" fill="#283b4e" stroke="#e6b85c"/><text x="360" y="101" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">All conditions</text><text x="360" y="118" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">satisfied?</text>` +
        `${arrow(440,82,548,48)}<text x="494" y="52" text-anchor="middle" fill="#6fd0a8" font-size="12">Yes</text><rect x="550" y="14" width="290" height="62" rx="8" fill="#1f3a34" stroke="#6fd0a8"/><text x="695" y="41" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Proceed</text><text x="695" y="60" text-anchor="middle" fill="#9db1c3" font-size="11">log time and position</text>` +
        `${arrow(440,128,548,162)}<text x="452" y="178" text-anchor="middle" fill="#ff9d8a" font-size="12">No, or in doubt</text><rect x="550" y="134" width="290" height="62" rx="8" fill="#3d2622" stroke="#ff9d8a"/><text x="695" y="161" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Abort</text><text x="695" y="178" text-anchor="middle" fill="#9db1c3" font-size="10">escape route, hold or anchor; inform Master, pilot and VTS</text></svg>` }),
    vessel_card: () => ({ alt: 'MV ECADEMY particulars.', svg: `<table class="v"><tr><td>Vessel</td><td>MV ECADEMY</td></tr><tr><td>Type</td><td>Handymax bulk carrier</td></tr><tr><td>Deadweight</td><td>37,163 MT</td></tr><tr><td>Length overall</td><td>189.99 m</td></tr><tr><td>Beam</td><td>28.50 m</td></tr><tr><td>Summer draft</td><td>10.40 m</td></tr><tr><td>Service speed</td><td>12 kn</td></tr><tr><td>Holds / cranes</td><td>5 / 4</td></tr><tr><td>Voyage</td><td>TR-001, Alpha Port berth A2 to Bravo Port</td></tr></table><div class="cap">Synthetic training data. Not a real vessel, port or chart.</div>` })
  };

  /* ---------- course map ---------- */
  function renderSide(){
    const side = $('side'); const nodes = MAP.nodes;
    let h = '';
    const intro = MAP.lessons.find(l => l.code === 'INTRO');
    if (intro) h += `<button class="item${current === 'INTRO' ? ' on' : ''}" data-open="INTRO"><span class="cid">INTRO</span> ${esc(intro.title)}</button>`;
    if (!nodes.length) { side.innerHTML = h + '<p class="note">The new APEM course is in development. Lessons will appear here as they are released.</p>'; bind(); return; }
    for (const [st, name] of STAGES) {
      const parents = nodes.filter(n => n.kind === 'parent' && n.stage === st).sort((a, b) => a.display_order - b.display_order);
      if (!parents.length) continue;
      const done = parents.filter(p => p.status === 'passed').length;
      h += `<details class="stg" data-k="S:${st}"${OPEN.has('S:' + st) ? ' open' : ''}><summary><span class="ttl sname">${esc(name)}</span><span class="st">${done} / ${parents.length}</span></summary><div class="stgbody">`;
      for (const p of parents) {
        const subs = nodes.filter(n => n.parent_id === p.id).sort((a, b) => a.display_order - b.display_order);
        const PL = MAP.lessons.find(l => l.competency_id === p.id);
        h += `<details data-k="${esc(p.id)}"${OPEN.has(p.id) ? ' open' : ''}><summary><span class="cid">${esc(p.id)}</span><span class="ttl">${esc(p.title || '')}</span><span class="st ${esc(p.status)}">${esc(LABEL[p.status] || p.status)}</span></summary>${PL && p.status !== 'locked' ? `<div class="plk"><button class="lk" data-open="${esc(PL.code)}">Open explanation</button></div>` : ''}<ul class="sub">` +
          subs.map(s => { const L = MAP.lessons.find(l => l.competency_id === s.id); return `<li${current === s.id ? ' class="on"' : ''}><span class="cid">${esc(s.id.slice(-3))}</span><span class="ttl">${esc(s.title || '')}${L && s.status !== 'locked' ? ` <button class="lk" data-open="${esc(L.code)}">Open explanation</button>` : ''}</span><span class="st ${esc(s.status)}">${esc(LABEL[s.status] || s.status)}</span></li>`; }).join('') + '</ul></details>';
      }
      h += '</div></details>';
    }
    side.innerHTML = h; bind();
  }
  function bind(){ document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openLesson(b.dataset.open));
    document.querySelectorAll('#side details[data-k]').forEach(d => d.addEventListener('toggle', () => { d.open ? OPEN.add(d.dataset.k) : OPEN.delete(d.dataset.k); })); }

  function renderOverview(){
    current = null;
    const n = MAP.nodes, par = n.filter(x => x.kind === 'parent'), sub = n.filter(x => x.kind === 'subskill');
    const built = MAP.lessons.filter(l => l.competency_id).length;
    $('main').innerHTML = `<h1>APEM course map</h1><p class="note">Appraisal, Planning, Execution and Monitoring on one voyage: MV ECADEMY, TR-001.</p>
      <div class="sum"><div><b>${par.length}</b><span>Competencies</span></div><div><b>${sub.length}</b><span>Subskills</span></div><div><b>${built}</b><span>Explanations built</span></div><div><b>${par.filter(x => x.status === 'passed').length}</b><span>Passed</span></div></div>
      <div class="card"><p>The map on the left shows every competency and its status for your account. The status comes from the server, from the prerequisite rules and your recorded results.</p>
      <p>${MAP.lessons.some(l => l.code === 'INTRO') ? 'Start with the Introduction.' : ''} Lessons for the competencies are built and released one at a time. A competency with no lesson built yet cannot be opened, whatever its status.</p><p class="note">Lessons built so far: ${MAP.lessons.map(l => esc(l.code)).join(', ') || 'none'}.</p></div>`;
    renderSide();
  }

  /* ---------- lesson viewer (Introduction: no assessment) ---------- */
  async function openLesson(code){
    const main = $('main'); main.innerHTML = '<p class="note">Loading…</p>';
    try {
      const d = await call({ action: 'lesson', code });
      current = code; renderSide();
      const L = d.lesson;
      if (L.content.enc) {   // encrypted lesson file: the server releases its key only if this lesson is open for this account
        const r = await fetch('apem-content/' + L.content.file, { cache: 'no-cache' });
        if (!r.ok) throw new Error('The lesson file could not be downloaded. Check your connection and try again.');
        const buf = new Uint8Array(await r.arrayBuffer());
        if (new TextDecoder().decode(buf.slice(0, 5)) !== 'APEM1') throw new Error('The lesson file is not valid.');
        let bin = ''; buf.slice(5, 261).forEach(b => bin += String.fromCharCode(b));
        const k = await call({ action: 'lesson_key', code, wk: btoa(bin) });
        const key = await crypto.subtle.importKey('raw', Uint8Array.from(atob(k.key), c => c.charCodeAt(0)), 'AES-GCM', false, ['decrypt']);
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(261, 273) }, key, buf.slice(273));
        L.content = JSON.parse(new TextDecoder().decode(plain));
      }
      const S = L.content.screens || [], media = Object.fromEntries((d.media || []).map(m => [m.asset_code, m]));
      let i = 0;
      const draw = () => {
        const s = S[i]; let vis = '';
        if (s.visual && s.visual.diagram && DIAGRAM[s.visual.diagram]) { const g = DIAGRAM[s.visual.diagram](); vis = `<figure class="vis" style="margin-left:0;margin-right:0">${g.svg}<figcaption>${esc(g.alt)}</figcaption></figure>`; }
        else if (s.visual && s.visual.pending) { const m = media[s.visual.pending]; vis = `<div class="pending" role="note">${esc(s.visual.label || 'Media')}<br>Pending production (${esc(s.visual.pending)}${m ? ', status: ' + esc(m.status.replace('_', ' ')) : ''}). Not yet available.</div>`; }
        main.innerHTML = `<h1>${esc(L.content.title)}</h1><p class="note">Screen ${i + 1} of ${S.length}. ${L.content.kind === 'knowledge' ? 'Knowledge section. The guided exercise and the proficiency check for this topic are not built yet.' : 'This introduction has no assessment.'}</p>
          <div class="card"><h2>${esc(s.h)}</h2>${(s.p || []).map(p => `<p>${esc(p)}</p>`).join('')}${vis}${(s.points || []).length ? `<ul class="pts">${s.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}</div>
          <div class="nav"><button class="b ghost" id="prev" ${i === 0 ? 'disabled' : ''}>Previous</button><span class="count">${i + 1} / ${S.length}</span>${i < S.length - 1 ? '<button class="b" id="next">Next</button>' : '<button class="b" id="done">Back to course map</button>'}</div>
          ${d.admin ? `<p class="note" style="margin-top:16px">Owner preview. Content status: ${esc(L.review_status.replace('_', ' '))}. ${esc(L.content.notice || '')}</p>` : ''}`;
        if ($('prev')) $('prev').onclick = () => { i--; draw(); main.focus(); };
        if ($('next')) $('next').onclick = () => { i++; draw(); main.focus(); };
        if ($('done')) $('done').onclick = renderOverview;
      };
      draw();
    } catch (e) { main.innerHTML = `<div class="card"><p class="err">${esc(e.message)}</p><button class="b ghost" id="bk">Back to course map</button></div>`; $('bk').onclick = renderOverview; }
  }

  async function init(){
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { $('side').innerHTML = ''; $('main').innerHTML = '<div class="card"><h2>Sign in required</h2><p>Sign in to ECADEMY first, then open APEM again from the Second Officer menu.</p><p><a href="index.html">Go to ECADEMY</a></p></div>'; return; }
    try {
      MAP = await call({ action: 'map' });
      if (MAP.admin) { $('ownerBar').hidden = false; $('ownerBar').textContent = 'Owner preview: visible to admin accounts only until each lesson is released.' + (MAP.locks_off ? ' Locks are OFF for your admin account during development. Students remain locked.' : ''); if (MAP.locks_off) LABEL.available = 'Open'; }
      renderOverview();
    } catch (e) { $('side').innerHTML = ''; $('main').innerHTML = `<div class="card"><p class="err">${esc(e.message)}</p><p><a href="index.html">Back to ECADEMY</a></p></div>`; }
  }
  init();
})();
</script>
</body>
</html>
