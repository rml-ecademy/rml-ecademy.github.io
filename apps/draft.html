<style>

@media print{header,.stepbar,.disc,.lesson,.sheet .btns,.noprint{display:none!important}body{background:#fff;color:#000}.card{border:1px solid #999;background:#fff}td,th{color:#000!important}main{display:block}}
</style>

<body>
<header>
  <div class="brand"><b>ECADEMY</b> · MANUAL DRAFT SURVEY<small>Chief Officer · Draft Survey · Grade-5 friendly + officer level</small></div>
  <button class="tab" id="t_intro">START HERE</button>
  <button class="tab" id="t_init">1 · INITIAL SURVEY</button>
  <button class="tab" id="t_fin">2 · FINAL SURVEY</button>
  <button class="tab" id="t_res">3 · CARGO RESULT</button>
  <button class="tab alt" id="t_new" title="New draft readings, water density and tank figures">NEW NUMBERS</button>
</header>
<main id="main"></main>
<div class="disc">EDUCATIONAL PURPOSES ONLY — training model ship and figures. Always use your own ship's approved booklets and the surveyor's agreed procedure.</div>
<div class="stepbar" id="stepbar"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const F = (v, d = 2) => (v == null || !isFinite(v)) ? "—" : (Math.abs(v) < 0.5 * Math.pow(10, -d) ? 0 : v).toFixed(d);
const S = (v, d = 3) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(d);
const T1 = v => v.toLocaleString("en-US", {maximumFractionDigits:0});
let seed = 20260928;
function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
const R = (a, b) => a + (b - a) * rnd();
const q = (v, s) => Math.round(v / s) * s;

/* ================= TRAINING SHIP (fictional) ================= */
const SHIP = {name:"MV ECADEMY PIONEER", type:"Handymax bulk carrier (training model)", LBP:182.00, B:30.50, D:16.50, summer:10.80, light:9650,
  dF:2.40, dM:0.60, dA:6.20};  // fwd marks 2.40 m AFT of FP · mid marks 0.60 m AFT of midships · aft marks 6.20 m FWD of AP
SHIP.LBM = SHIP.LBP - SHIP.dF - SHIP.dA;
const MEDIA = (() => { try { if (location.protocol === "blob:" || location.protocol === "about:") { const ref = window.parent !== window ? window.parent.location.href : document.referrer; return ref ? new URL("./", ref).href : ""; } if (/\/apps\/[^/]*$/.test(location.pathname)) return "../"; return ""; } catch (e) { return ""; } })();
const VIDMETA = {ds1:["Part 1 · Reading the draft marks","3:11"], ds2:["Part 2 · Corrections to the perpendiculars","3:25"], ds3:["Part 3 · Mean of means · hog and sag","1:54"], ds4:["Part 4 · Hydrostatic table and trim corrections","2:24"], ds5:["Part 5 · Density and the hydrometer","3:03"], ds6:["Part 6 · Tank soundings and deductibles","2:52"], ds7:["Part 7 · Net displacement, constant and cargo","2:05"]};
function vidBlock(k) { if (!VID[k]) return ""; const m = VIDMETA[k] || [k, ""]; return `<div class="vid"><video controls preload="metadata" src="${VID[k]}"></video><div class="vcap">VIDEO · ${m[0]} (${m[1]})</div></div>`; }
const VID = Object.fromEntries(Object.entries({"ds1": "media/ds1.mp4", "ds2": "media/ds2.mp4", "ds3": "media/ds3.mp4", "ds4": "media/ds4.mp4", "ds5": "media/ds5.mp4", "ds6": "media/ds6.mp4", "ds7": "media/ds7.mp4"}).map(([k, v]) => [k, v.startsWith("data:") ? v : MEDIA + v]));
const R3D = {ship:{"W": 2178, "H": 550, "ppm": 11.0, "cx": 0, "cz": 19.0, "wm": 198.0, "hm": 50.0, "L": 182.0, "D": 16.5, "T": 7.0, "stern_x": -91.0}, marks:{"W": 840, "H": 600, "ppm": 600.0, "cx": 0, "cz": 7.5, "wm": 1.4, "hm": 1.0}, meta:{"hy_jar": {"W": 480, "H": 1080, "ppm": 3000.0, "cx": 0, "cz": 0.16, "wm": 0.16, "hm": 0.36, "WL": 0.24, "R": 0.055}, "hy_float": {"W": 630, "H": 3060, "ppm": 9000.0, "cx": 0, "cz": 0.07, "wm": 0.07, "hm": 0.34, "z_lo": 0.01513672922252011, "z_hi": 0.18886327077747989, "lo": 1.0, "hi": 1.04, "note": "z_lo = 1.000 mark?? see build: value increases DOWN the stem: top mark = 1.000, bottom mark = 1.040"}, "hy_stem": {"W": 480, "H": 6000, "ppm": 30000.0, "cx": 0, "cz": 0.102, "wm": 0.016, "hm": 0.2, "z_lo": 0.01513672922252011, "z_hi": 0.18886327077747989, "lo": 1.0, "hi": 1.04}, "snd_bob": {"W": 240, "H": 1500, "ppm": 6000.0, "cx": 0, "cz": -0.095, "wm": 0.04, "hm": 0.25}}, src:{"ship": "../assets/draft_1.webp", "hy_jar": "../assets/draft_2.webp", "hy_float": "../assets/draft_3.webp", "hy_stem": "../assets/draft_4.webp", "snd_bob": "../assets/draft_5.webp", "hy_hero": "../assets/draft_6.webp", "snd_hero": "../assets/draft_7.webp", "marks_10": "../assets/draft_8.webp", "marks_11": "../assets/draft_9.webp", "marks_12": "../assets/draft_10.webp", "marks_3": "../assets/draft_11.webp", "marks_4": "../assets/draft_12.webp", "marks_5": "../assets/draft_13.webp", "marks_6": "../assets/draft_14.webp", "marks_7": "../assets/draft_15.webp", "marks_8": "../assets/draft_16.webp", "marks_9": "../assets/draft_17.webp"}, _c:{}, img(k) { if (!this.src[k]) return null; let i = this._c[k]; if (!i) { i = this._c[k] = new Image(); i.onload = () => { try { if ($("prof")) drawProfile($("prof"), curV(), "read"); if ($("hycv")) drawHydroCanvas($("hycv"), curV().rho[hySel]); } catch (e) {} }; i.src = this.src[k]; } return i; }};
Object.keys(R3D.src).forEach(k => R3D.img(k));

/* hydrostatic particulars in sea water 1.025 t/m³ (training model) */
const HF = {disp:T => 100 * (44 * T + 0.275 * T * T), tpc:T => 44 + 0.55 * T, lcf:T => 1.20 - 0.42 * T, mtc:T => 480 + 30 * T + 0.4 * T * T};
const TABLE = [];
for (let i = 0; i <= 90; i++) { const T = +(3 + i * 0.1).toFixed(2); TABLE.push({T, D:Math.round(HF.disp(T)), TPC:+HF.tpc(T).toFixed(2), LCF:+HF.lcf(T).toFixed(3), MTC:+HF.mtc(T).toFixed(1)}); }
function hydro(T) {
  const i = Math.min(TABLE.length - 2, Math.max(0, Math.floor((T - 3) / 0.1 + 1e-9))), a = TABLE[i], b = TABLE[i + 1], f = (T - a.T) / (b.T - a.T);
  const L = k => a[k] + (b[k] - a[k]) * f;
  return {i, a, b, f, D:L("D"), TPC:L("TPC"), LCF:L("LCF"), MTC:L("MTC")};
}

/* ================= THE CALCULATION (one survey) ================= */
function calc(inp) {
  const s = SHIP, o = inp.obs, t = {};
  t.Fm = (o.FP + o.FS) / 2; t.Mm = (o.MP + o.MS) / 2; t.Am = (o.AP + o.AS) / 2; t.trimApp = t.Am - t.Fm;
  t.LBM = s.LBM;
  t.cF = -t.trimApp * s.dF / t.LBM; t.cM = -t.trimApp * s.dM / t.LBM; t.cA = t.trimApp * s.dA / t.LBM;
  t.Fc = t.Fm + t.cF; t.Mc = t.Mm + t.cM; t.Ac = t.Am + t.cA;
  t.trim = t.Ac - t.Fc; t.mfa = (t.Fc + t.Ac) / 2; t.defl = t.mfa - t.Mc; t.QM = (t.Fc + 6 * t.Mc + t.Ac) / 8;
  const h = hydro(t.QM); t.h = h; t.D = h.D; t.TPC = h.TPC; t.LCF = h.LCF; t.MTC = h.MTC;
  t.hp = hydro(t.QM + 0.5); t.hm = hydro(t.QM - 0.5); t.MTCp = t.hp.MTC; t.MTCm = t.hm.MTC; t.dMdZ = t.MTCp - t.MTCm;
  t.FTC = -t.trim * t.LCF * t.TPC * 100 / s.LBP; t.STC = 50 * t.trim * t.trim * t.dMdZ / s.LBP; t.Dc = t.D + t.FTC + t.STC;
  t.rho = Math.round(inp.rho.reduce((a, b) => a + b, 0) / inp.rho.length * 10000) / 10000;
  t.Dd = t.Dc * t.rho / 1.025;
  inp.ded.forEach(r => r.w = r.vol * r.dens); t.ded = inp.ded.reduce((a, r) => a + r.w, 0);
  t.net = t.Dd - t.ded; t.constant = t.net - s.light;
  return t;
}
function mkObs(b, trimApp, defl, list) {
  const s = SHIP, xF = s.LBP - s.dF, xM = s.LBP / 2 - s.dM, xA = s.dA, Fm = b, Am = b + trimApp;
  const Mm = Am + (Fm - Am) * (xM - xA) / (xF - xA) - defl;
  return {FP:Fm + list, FS:Fm - list, MP:Mm + list, MS:Mm - list, AP:Am + list, AS:Am - list};
}
function solve(inp, target, trimApp, defl, list) {
  let lo = 3.6, hi = 11.2;
  for (let k = 0; k < 50; k++) { const m = (lo + hi) / 2; inp.obs = mkObs(m, trimApp, defl, list); if (calc(inp).net < target) lo = m; else hi = m; }
  Object.keys(inp.obs).forEach(k => inp.obs[k] = +q(inp.obs[k], 0.01).toFixed(2));
}
let SV;   // the two surveys + result
function newNumbers(first) {
  if (!first) seed = (Date.now() % 100000) * 7919 + 13;
  const rhoB = +q(R(1.021, 1.025), 0.001).toFixed(3);
  const base = +q(R(1.0140, 1.0215), 0.0005).toFixed(4);
  const smp = b => [0, 1, 2].map(() => +(b + q(R(-0.0006, 0.0006), 0.0005)).toFixed(4));
  const hfo = R(1050, 1350), mdo = R(90, 160), lo = R(25, 40), fw = R(220, 320), bil = R(15, 35);
  const I = {kind:"init", wave:R(0.025, 0.05), rho:smp(base), ded:[
    {t:"Fore peak tank (FPT)", g:"Ballast", vol:R(1800, 2300), dens:rhoB, snd:0},
    {t:"No.1 WB tanks P+S", g:"Ballast", vol:R(2600, 3200), dens:rhoB},
    {t:"No.2 WB tanks P+S", g:"Ballast", vol:R(2800, 3400), dens:rhoB},
    {t:"No.3 WB tanks P+S", g:"Ballast", vol:R(2800, 3400), dens:rhoB},
    {t:"Topside WB tanks P+S", g:"Ballast", vol:R(3600, 4400), dens:rhoB},
    {t:"Aft peak tank (APT)", g:"Ballast", vol:R(900, 1200), dens:rhoB},
    {t:"Fresh water tanks", g:"Fresh water", vol:fw, dens:1.000},
    {t:"Heavy fuel oil (HFO)", g:"Fuel", vol:hfo, dens:0.975},
    {t:"Marine diesel oil (MDO)", g:"Fuel", vol:mdo, dens:0.855},
    {t:"Lube oil", g:"Lube oil", vol:lo, dens:0.900},
    {t:"Bilges & sludge", g:"Other", vol:bil, dens:0.950}]};
  I.ded.forEach(r => r.vol = +r.vol.toFixed(1));
  const constT = R(180, 420);
  solve(I, SHIP.light + constT, R(2.0, 2.9), R(0.02, 0.06), q(R(-0.02, 0.02), 0.005));
  I.t = calc(I);
  const Fn = {kind:"fin", wave:R(0.02, 0.045), rho:smp(+(base + q(R(-0.0015, 0.0015), 0.0005)).toFixed(4)), ded:[
    {t:"Fore peak tank (FPT)", g:"Ballast", vol:R(8, 20), dens:rhoB},
    {t:"No.1 WB tanks P+S", g:"Ballast", vol:R(15, 40), dens:rhoB},
    {t:"No.2 WB tanks P+S", g:"Ballast", vol:R(15, 40), dens:rhoB},
    {t:"No.3 WB tanks P+S", g:"Ballast", vol:R(15, 40), dens:rhoB},
    {t:"Topside WB tanks P+S", g:"Ballast", vol:R(10, 30), dens:rhoB},
    {t:"Aft peak tank (APT)", g:"Ballast", vol:R(150, 400), dens:rhoB},
    {t:"Fresh water tanks", g:"Fresh water", vol:fw - R(15, 45), dens:1.000},
    {t:"Heavy fuel oil (HFO)", g:"Fuel", vol:hfo - R(4, 14), dens:0.975},
    {t:"Marine diesel oil (MDO)", g:"Fuel", vol:mdo - R(1, 4), dens:0.855},
    {t:"Lube oil", g:"Lube oil", vol:lo - R(0, 1), dens:0.900},
    {t:"Bilges & sludge", g:"Other", vol:bil + R(0, 5), dens:0.950}]};
  Fn.ded.forEach(r => r.vol = +r.vol.toFixed(1));
  let cargoT = R(36500, 38300);
  solve(Fn, I.t.net + cargoT, R(0.05, 0.35), -R(0.02, 0.06), q(R(-0.015, 0.015), 0.005));
  Fn.t = calc(Fn);
  const cargo = Fn.t.net - I.t.net;
  SV = {init:I, fin:Fn, cargo, bl:Math.round(cargo * (1 + R(-0.0045, 0.0045))), ans:{init:{}, fin:{}, res:{}}, ok:{init:{}, fin:{}, res:{}}, tries:{init:{}, fin:{}, res:{}}};
  SV.diff = (cargo - SV.bl) / SV.bl * 100;
}

/* FPT sounding (m) that corresponds to the tank volume in the training tank table: 900 m³ per metre around 3 m */
const fptSnd = v => +(3 + v.ded[0].vol / 900).toFixed(3);
/* ================= STEPS: explanation + worksheet ================= */
const PORT = k => ({FP:"FWD Port", FS:"FWD Stbd", MP:"MID Port", MS:"MID Stbd", AP:"AFT Port", AS:"AFT Stbd"})[k];
let STEPS = [
  {id:"read", name:"Read drafts", title:"Read the 6 drafts",
   fields:[["FP", "FWD · Port", "m", 2, 0.02], ["FS", "FWD · Starboard", "m", 2, 0.02], ["MP", "MID · Port", "m", 2, 0.02], ["MS", "MID · Starboard", "m", 2, 0.02], ["AP", "AFT · Port", "m", 2, 0.02], ["AS", "AFT · Starboard", "m", 2, 0.02]],
   truth:(k, v) => v.obs[k],
   hint:(k, v, t, n) => n < 2 ? "Look at the BOTTOM of the number just above the water. Each number is 10 cm tall and the gap is 10 cm. Read the MIDDLE of the waves. Turn on the HELP RULER if you need it." : `Agreed reading: ${F(v.obs[k], 2)} m`,
   lesson:v => `
    ${vidBlock("ds1")}
    <div class="sec"><h4>What is it?</h4><p><b>Draft</b> (draught) = how deep the <b>bottom of the ship (the keel)</b> is under the water. We read it at <b>6 places</b>: forward, midship and aft, on the <b>port</b> and <b>starboard</b> side.</p></div>
    <div class="sec"><h4>Why do we need it?</h4><p>Everything in the survey starts from these 6 numbers. On this ship <b>1 cm of draft ≈ ${F(v.t.TPC, 0)} tonnes</b> (TPC). A 1 cm mistake = about ${F(v.t.TPC, 0)} t of cargo wrong!</p></div>
    <div class="sec"><h4>Where do we get it?</h4><p>From the <b>draft marks</b> welded and painted on the hull, near the bow, at midship and near the stern, on <b>both sides</b>. Read from a boat or launch close to the water (fwd and aft) and from the quay or pilot ladder (midship). The offshore side needs a boat.</p></div>
    <div class="sec"><h4>What do you do?</h4><ol><li>Go down <b>close to the water</b>, eyes level with the waterline (no looking from the deck).</li><li>Watch several waves. Note the <b>highest and lowest</b> point, then take the <b>middle</b>.</li><li>Read all 6 marks in a short time, and write down the time.</li><li>Take the water samples (Part 5) at the same time.</li><li>Compare port and starboard. A difference means the ship is <b>listing</b>.</li></ol></div>
    <div class="sec"><h4>How to read metric marks</h4><div class="formula">Number height = <span class="v">10 cm</span> · gap between numbers = <span class="v">10 cm</span><br>BOTTOM of a number = that draft · TOP of the number = +0.10 m<br>"7M" = 7.00 m · "2" above it = 7.20 m · "4" = 7.40 m …</div></div>
    <div class="easy sec"><h4>Easy words (Grade 5)</h4><p>Imagine a <b>giant ruler painted on the ship</b>. The water touches the ruler at the ship's depth. Waves make the water jump up and down, so we find the <b>middle</b>, like the middle of a see-saw.</p></div>
    <div class="warn sec"><h4>Watch out</h4><ul><li>Reading from high up (parallax) gives the wrong number.</li><li>Don't read only the top of the waves. Read the middle.</li><li>Some ships use feet marks (6-inch figures). Don't mix metres and feet.</li><li>Damaged or unclear marks: note it in the report.</li></ul></div>`},
  {id:"mean", name:"Means", title:"Mean drafts & apparent trim",
   fields:[["Fm", "FWD mean", "m", 3, 0.003], ["Mm", "MID mean", "m", 3, 0.003], ["Am", "AFT mean", "m", 3, 0.003], ["trimApp", "Apparent trim (AFT − FWD)", "m", 3, 0.003]],
   truth:(k, v) => v.t[k],
   hint:(k, v, t, n) => n < 2 ? ({Fm:`(${F(v.obs.FP)} + ${F(v.obs.FS)}) ÷ 2`, Mm:`(${F(v.obs.MP)} + ${F(v.obs.MS)}) ÷ 2`, Am:`(${F(v.obs.AP)} + ${F(v.obs.AS)}) ÷ 2`, trimApp:`AFT mean − FWD mean = ${F(t.Am, 3)} − ${F(t.Fm, 3)}`})[k] : `Answer: ${F(t[k], 3)} m`,
   lesson:v => `
    <div class="sec"><h4>What is it?</h4><p>At each place (FWD, MID, AFT) we take the <b>average of port and starboard</b>. Then the <b>apparent trim</b> = AFT mean − FWD mean.</p></div>
    <div class="sec"><h4>Why?</h4><p>Averaging P and S removes the <b>list</b> (the lean to one side). Trim tells us how the ship tilts fore and aft. <b>+ trim = by the stern</b> (stern deeper), <b>− trim = by the head</b>.</p></div>
    <div class="sec"><h4>Where from?</h4><p>Your 6 readings above.</p></div>
    <div class="sec"><h4>Formula</h4><div class="formula">FWD mean = (FWD P + FWD S) ÷ 2<br>MID mean = (MID P + MID S) ÷ 2<br>AFT mean = (AFT P + AFT S) ÷ 2<br>Apparent trim = AFT mean − FWD mean</div><p class="small muted">It is "apparent" because the marks are not at the perpendiculars. We fix that in Part 2.</p></div>
    <div class="easy sec"><h4>Easy words</h4><p>If the ship leans a little, one side is deeper and the other is shallower. The <b>middle of the two</b> is the real depth.</p></div>
    <div class="warn sec"><h4>Watch out</h4><ul><li>Keep 3 decimals.</li><li>Don't lose the <b>sign</b> of the trim.</li><li>A big list makes readings less accurate. Ask to bring the ship upright before the survey.</li></ul></div>`},
  {id:"perp", name:"Perp. corr.", title:"Correct the drafts to the perpendiculars",
   fields:[["LBM", "LBM: length between the marks", "m", 2, 0.01], ["Fc", "FWD draft at the FP", "m", 3, 0.004], ["Mc", "MID draft at midships ⊗", "m", 3, 0.004], ["Ac", "AFT draft at the AP", "m", 3, 0.004]],
   truth:(k, v) => v.t[k],
   hint:(k, v, t, n) => n < 2 ? ({LBM:`LBP − dF − dA = ${F(SHIP.LBP)} − ${F(SHIP.dF)} − ${F(SHIP.dA)}`, Fc:`FP is on the ${t.trimApp >= 0 ? "SHALLOW" : "DEEP"} side → ${F(t.Fm, 3)} ${t.trimApp >= 0 ? "−" : "+"} (${F(Math.abs(t.trimApp), 3)} × ${F(SHIP.dF)} ÷ ${F(SHIP.LBM)})`, Mc:`⊗ is FORWARD of the mid mark → ${F(t.Mm, 3)} ${t.trimApp >= 0 ? "−" : "+"} (${F(Math.abs(t.trimApp), 3)} × ${F(SHIP.dM)} ÷ ${F(SHIP.LBM)})`, Ac:`AP is on the ${t.trimApp >= 0 ? "DEEP" : "SHALLOW"} side → ${F(t.Am, 3)} ${t.trimApp >= 0 ? "+" : "−"} (${F(Math.abs(t.trimApp), 3)} × ${F(SHIP.dA)} ÷ ${F(SHIP.LBM)})`})[k] : `Answer: ${F(t[k], k === "LBM" ? 2 : 3)} m`,
   lesson:v => `
    ${vidBlock("ds2")}
    <div class="sec"><h4>What is it?</h4><p>The hydrostatic table (Part 4) is made for drafts at the <b>Forward Perpendicular (FP)</b>, <b>midships (⊗)</b> and <b>Aft Perpendicular (AP)</b>. The draft marks are not exactly there, because of the bow shape, rudder and propeller. So we <b>move each reading</b> to the right place.</p></div>
    <div class="sec"><h4>Why?</h4><p>When the ship has trim, the waterline is a slope. A mark a few metres away from the perpendicular reads a <b>different</b> draft.</p></div>
    <div class="sec"><h4>Where from?</h4><p>The <b>distances of the marks</b> from the perpendiculars (dF, dM, dA) come from the ship's <b>Trim &amp; Stability Booklet / hydrostatic tables</b> ("position of draft marks") and the ship's plans. <b>LBP</b> comes from the ship's particulars.</p><table class="part"><tr><td>LBP</td><td>${F(SHIP.LBP)} m</td></tr><tr><td>dF: fwd marks AFT of FP</td><td>${F(SHIP.dF)} m</td></tr><tr><td>dM: mid marks AFT of ⊗</td><td>${F(SHIP.dM)} m</td></tr><tr><td>dA: aft marks FWD of AP</td><td>${F(SHIP.dA)} m</td></tr></table></div>
    <div class="sec"><h4>Formula</h4><div class="formula">LBM = LBP − dF − dA<br>Correction = apparent trim × d ÷ LBM</div><p><b>+ or −? Ask one question:</b> is the perpendicular on the <b>DEEP</b> side or the <b>SHALLOW</b> side of the mark?<br>Deep side → <b>ADD</b> · Shallow side → <b>SUBTRACT</b>.</p><p class="small muted">Trim by the stern: FP is shallower (−), ⊗ is forward of the mid mark (−), AP is deeper (+). Trim by the head: the signs reverse.</p></div>
    <div class="easy sec"><h4>Easy words</h4><p>The waterline is like a <b>slide</b>. If you walk toward the high end, you are less deep. Walk toward the low end, you are deeper. We just walk from the mark to the real measuring place.</p></div>
    <div class="warn sec"><h4>Watch out</h4><ul><li><b>Sign mistakes</b> are the most common error!</li><li>Use <b>LBM</b>, not LBP, in this formula.</li><li>Don't forget the midship correction.</li><li>Some booklets give ready-made correction tables. Use them if provided.</li></ul></div>`},
  {id:"qm", name:"Quarter mean", title:"True trim, hog/sag & quarter mean draft",
   fields:[["trim", "True trim (AFT − FWD)", "m", 3, 0.004], ["defl", "Deflection (+hog / −sag)", "m", 3, 0.004], ["QM", "Quarter mean draft (QM)", "m", 3, 0.003]],
   truth:(k, v) => v.t[k],
   hint:(k, v, t, n) => n < 2 ? ({trim:`${F(t.Ac, 3)} − ${F(t.Fc, 3)}`, defl:`(FWD + AFT) ÷ 2 − MID = (${F(t.Fc, 3)} + ${F(t.Ac, 3)}) ÷ 2 − ${F(t.Mc, 3)}`, QM:`(${F(t.Fc, 3)} + 6 × ${F(t.Mc, 3)} + ${F(t.Ac, 3)}) ÷ 8`})[k] : `Answer: ${F(t[k], 3)} m`,
   lesson:v => `
    ${vidBlock("ds3")}
    <div class="sec"><h4>What is it?</h4><p>A long ship <b>bends</b> a little.<br><b>Hogging</b> ∩: the middle is up and the ends are down. Midship draft is <i>less</i>.<br><b>Sagging</b> ∪: the middle is down. Midship draft is <i>more</i>.<br>The <b>Quarter Mean draft</b> (mean of mean of means) takes the bending into account.</p></div>
    <div class="sec"><h4>Why?</h4><p>The real waterline is a <b>curve</b>, not a straight line. The 1-6-1 formula gives the draft that matches the true underwater volume of the bent hull (the deflection is taken as a parabola).</p></div>
    <div class="sec"><h4>Where from?</h4><p>The <b>corrected</b> drafts from Part 2.</p></div>
    <div class="sec"><h4>Formula</h4><div class="formula">True trim = AFT(AP) − FWD(FP)<br>Mean F/A = (FWD + AFT) ÷ 2<br>Deflection = Mean F/A − MID   (+ hog, − sag)<br>QM = (FWD + 6 × MID + AFT) ÷ 8</div></div>
    <div class="easy sec"><h4>Easy words</h4><p>A long ship is like a <b>long ruler resting on two fingers</b>: it bends a little. We give the middle <b>6 votes</b> and each end <b>1 vote</b>, then divide by 8.</p></div>
    <div class="warn sec"><h4>Watch out</h4><ul><li>Use the <b>corrected</b> drafts, not the observed ones.</li><li>A large hog or sag (more than about 10–15 cm): check your readings and the loading sequence.</li></ul></div>`},
  {id:"hydro", name:"Hydrostatics", title:"Hydrostatic table: displacement, TPC, LCF, MTC",
   fields:[["D", "Displacement (SW 1.025)", "t", 0, 3], ["TPC", "TPC", "t/cm", 2, 0.02], ["LCF", "LCF from ⊗ (− = aft)", "m", 3, 0.01], ["MTC", "MTC at QM", "t·m/cm", 1, 0.5], ["MTCp", "MTC at QM + 0.50 m", "t·m/cm", 1, 0.6], ["MTCm", "MTC at QM − 0.50 m", "t·m/cm", 1, 0.6]],
   truth:(k, v) => v.t[k],
   hint:(k, v, t, n) => { const h = k === "MTCp" ? t.hp : k === "MTCm" ? t.hm : t.h, kk = k.startsWith("MTC") ? "MTC" : k, dp = {D:0, TPC:2, LCF:3, MTC:1}[kk];
     const Tq = k === "MTCp" ? t.QM + 0.5 : k === "MTCm" ? t.QM - 0.5 : t.QM;
     return n < 2 ? `Between ${F(h.a.T)} m (${F(h.a[kk], dp)}) and ${F(h.b.T)} m (${F(h.b[kk], dp)}): ${F(h.a[kk], dp)} + (${F(h.b[kk], dp)} − ${F(h.a[kk], dp)}) × (${F(Tq, 3)} − ${F(h.a.T)}) ÷ 0.10` : `Answer: ${F(t[k], dp)}`; },
   lesson:v => `
    ${vidBlock("ds4")}
    <div class="sec"><h4>What is it?</h4><p>The <b>hydrostatic table</b> is the ship's "weight book". Enter it with the <b>QM draft</b> and read:</p><ul><li><b>Displacement</b>: the total weight of the ship at that draft (sea water, level ship).</li><li><b>TPC</b>: tonnes to sink the ship 1 cm.</li><li><b>LCF</b>: where the ship pivots when it trims (from midships).</li><li><b>MTC</b>: the moment to change trim by 1 cm. Also read it at <b>QM + 0.50</b> and <b>QM − 0.50</b> for the 2nd trim correction below.</li></ul></div>
    <div class="sec"><h4>Where from?</h4><p>The ship's approved <b>Trim &amp; Stability Booklet</b> (hydrostatic particulars), made by the shipyard or naval architect and approved by Class. Check the density basis (<b>1.025</b>), whether the draft is from the <b>keel</b> (extreme) or <b>moulded</b>, and where LCF is measured from.</p><p class="small muted">In this training table, drafts are from the underside of the keel (same as the marks), and LCF is from midships, − = aft.</p></div>
    <div class="sec"><h4>Interpolation</h4><div class="formula">Value = lower + (upper − lower) × (QM − lower draft) ÷ 0.10</div></div>
    <div class="easy sec"><h4>Easy words</h4><p>It's like a <b>price list</b>: at 6.0 m deep the ship weighs this much, at 6.1 m it weighs that much. Our draft is in between, so we take the in-between weight.</p></div>
    <div class="warn sec"><h4>Watch out</h4><ul><li>Interpolation mistakes (check the direction: values go up or down?).</li><li>Using the fresh-water table by mistake.</li><li>Moulded vs extreme draft: the keel plate thickness matters.</li><li>The LCF sign convention changes from booklet to booklet.</li></ul></div>`},
  {id:"trimc", name:"Trim corr.", title:"1st and 2nd trim corrections",
   fields:[["FTC", "1st trim correction (FTC)", "t", 0, 3], ["STC", "2nd trim correction (STC)", "t", 1, 1], ["Dc", "Displacement corrected for trim", "t", 0, 6]],
   truth:(k, v) => v.t[k],
   hint:(k, v, t, n) => n < 2 ? ({FTC:`${F(Math.abs(t.trim), 3)} × ${F(Math.abs(t.LCF), 3)} × ${F(t.TPC, 2)} × 100 ÷ ${F(SHIP.LBP)}; sign ${t.FTC >= 0 ? "+" : "−"} (LCF is ${t.LCF < 0 ? "AFT" : "FWD"} of ⊗, the ${t.trim >= 0 ? "STERN" : "BOW"} is deeper → ${t.FTC >= 0 ? "same side → +" : "opposite side → −"})`, STC:`50 × ${F(t.trim, 3)}² × (${F(t.MTCp, 1)} − ${F(t.MTCm, 1)}) ÷ ${F(SHIP.LBP)}`, Dc:`${F(t.D, 0)} ${t.FTC >= 0 ? "+" : "−"} ${F(Math.abs(t.FTC), 0)} + ${F(t.STC, 1)}`})[k] : `Answer: ${F(t[k], k === "STC" ? 1 : 0)} t`,
   lesson:v => `
    ${vidBlock("ds4")}
    <div class="sec"><h4>What is it?</h4><p>The table assumes the ship floats <b>level</b> (even keel). Our ship is trimmed, and it trims around the <b>LCF</b>, not around midships. So the displacement from the table is a little wrong.</p><ul><li><b>1st trim correction (FTC)</b> corrects for the LCF not being at midships.</li><li><b>2nd trim correction (STC, Nemoto)</b> corrects for the LCF moving as the ship trims. It is always <b>+</b>.</li></ul></div>
    <div class="sec"><h4>Where from?</h4><p>True trim (Part 2), TPC, LCF and the MTCs (above), and LBP (ship's particulars).</p></div>
    <div class="sec"><h4>Formula</h4><div class="formula">FTC = Trim(m) × LCF(m) × TPC × 100 ÷ LBP<br>STC = 50 × Trim(m)² × (MTC₊ − MTC₋) ÷ LBP<br>Corrected displ. = Displ. + FTC + STC</div><p><b>Sign of FTC:</b> <b>+</b> when LCF is on the <b>same side</b> of midships as the deeper end. <b>−</b> when it is on the opposite side.</p></div>
    <div class="easy sec"><h4>Easy words</h4><p>The ship is a <b>see-saw</b>. The table measured it when it was flat. When it tilts, the pivot is <b>not in the middle</b>, so our middle reading is a little off. We fix it.</p></div>
    <div class="warn sec"><h4>Watch out</h4><ul><li>The <b>sign of FTC</b> is the classic error.</li><li>Trim in metres here. (If you use trim in cm, don't multiply by 100.)</li><li>STC uses trim <b>squared</b>.</li><li>Large trim means larger corrections: surveyors prefer a small trim.</li></ul></div>`},
  {id:"dens", name:"Density", title:"Dock water density correction",
   fields:[["r1", "FWD sample · hydrometer reading", "t/m³", 4, 0.0003], ["r2", "MID sample · hydrometer reading", "t/m³", 4, 0.0003], ["r3", "AFT sample · hydrometer reading", "t/m³", 4, 0.0003], ["rho", "Average dock water density", "t/m³", 4, 0.0002], ["Dd", "Displacement in dock water", "t", 0, 8]],
   truth:(k, v) => k === "r1" ? v.rho[0] : k === "r2" ? v.rho[1] : k === "r3" ? v.rho[2] : v.t[k],
   hint:(k, v, t, n) => n < 2 ? ({r1:"Read where the FLAT water surface cuts the scale (zoom box). Numbers get bigger going DOWN. Small lines = 0.0005.", r2:"Same as the first jar: flat surface, numbers increase downward.", r3:"Same method. Each line is 0.0005; estimate the half-way between lines.", rho:`(${v.rho.map(r => F(r, 4)).join(" + ")}) ÷ 3`, Dd:`${F(t.Dc, 0)} × ${F(t.rho, 4)} ÷ 1.025`})[k] : `Answer: ${k === "Dd" ? F(t.Dd, 0) : k === "rho" ? F(t.rho, 4) : F(v.rho[+k[1] - 1], 4)}`,
   lesson:v => `
    ${vidBlock("ds5")}
    <div class="sec"><h4>What is it?</h4><p>The table is for <b>sea water 1.025 t/m³</b>. Port water is often lighter (river water mixes in). In lighter water the ship sinks deeper for the same weight, so we <b>correct</b>.</p></div>
    <div class="sec"><h4>Where from?</h4><p>Dock water <b>samples</b> taken with a sampling can at about <b>half the draft depth</b>, fwd, mid and aft (and on the offshore side), at the <b>same time</b> as the draft reading. Read them with a certified <b>draft-survey hydrometer</b>.</p></div>
    <div class="sec"><h4>What do you do?</h4><ol><li>Fill the jar and let the hydrometer float freely, not touching the glass.</li><li>Read at <b>eye level</b> where the water surface cuts the stem.</li><li>The numbers get <b>bigger going DOWN</b> the stem.</li><li>Average the samples.</li></ol></div>
    <div class="sec"><h4>Formula</h4><div class="formula">Displ. in dock water = Corrected displ. × dock density ÷ 1.025</div></div>
    <div class="easy sec"><h4>Easy words</h4><p>It's easier to float in the <b>sea</b> than in a swimming pool, because salty water pushes up harder. Our table was made for sea water, so we adjust it for the port's water.</p></div>
    <div class="warn sec"><h4>Watch out</h4><ul><li>Surface-only samples can be too fresh (rain, river layer).</li><li>A dirty or oily hydrometer reads wrong.</li><li>Use the hydrometer type the surveyors agreed on (apparent density "in air").</li></ul></div>`},
  {id:"ded", name:"Deductibles", title:"Deductibles: ballast, fresh water, fuel, oil",
   fields:[["snd", "Fore peak tank · sounding (tape)", "m", 3, 0.006], ["volF", "Fore peak tank · volume (tank table)", "m³", 1, 2.5], ["wF", "Fore peak tank · weight", "t", 1, 3], ["ded", "Total deductibles (all tanks)", "t", 1, 3]],
   truth:(k, v) => k === "snd" ? fptSnd(v) : k === "volF" ? v.ded[0].vol : k === "wF" ? v.ded[0].vol * v.ded[0].dens : v.t.ded,
   hint:(k, v, t, n) => { const bal = v.ded.filter(r => r.g === "Ballast").reduce((a, r) => a + r.w, 0); return n < 2 ? ({snd:"Read the tape where the paste turned RED (the wet line). The tape reads metres and centimetres; estimate to the half-centimetre.", volF:`Enter the FPT table (below) with your sounding ${F(fptSnd(v), 3)} m and interpolate between the two rows.`, wF:`volume × ballast density = ${F(v.ded[0].vol, 1)} × ${F(v.ded[0].dens, 3)}`, ded:`Weight of each tank = volume × density. Ballast alone = ${F(bal, 1)} t. Add fresh water, fuels, lube oil and bilges.`})[k] : `Answer: ${k === "snd" ? F(fptSnd(v), 3) + " m" : k === "volF" ? F(v.ded[0].vol, 1) + " m³" : k === "wF" ? F(v.ded[0].vol * v.ded[0].dens, 1) + " t" : F(t.ded, 1) + " t"}`; },
   lesson:v => `
    ${vidBlock("ds6")}
    <div class="sec"><h4>What is it?</h4><p><b>Deductibles</b> are everything on board that is <b>not cargo</b> and not the empty ship: ballast water, fresh water, fuel oil, diesel, lube oil, bilges and sludge.</p></div>
    <div class="sec"><h4>Why?</h4><p>We want <b>only the cargo</b>. These weights change between the two surveys: ballast is pumped out while loading, and fuel and water are used.</p></div>
    <div class="sec"><h4>Where from?</h4><p><b>Sound</b> every tank (sounding tape / ullage), <b>correct</b> the sounding for trim and list, then read the <b>volume</b> from the ship's <b>tank calibration (sounding) tables</b>. Ballast density comes from a sample of the tank; fuel figures come from the Chief Engineer.</p></div>
    <div class="sec"><h4>Formula</h4><div class="formula">Weight (t) = Volume (m³) × Density (t/m³)<br>Total deductibles = sum of all tanks</div></div>
    <div class="easy sec"><h4>Easy words</h4><p>If you want to know your own weight, you <b>take off your backpack</b> before you step on the scale. Ballast and fuel are the ship's backpack.</p></div>
    <div class="warn sec"><h4>Watch out</h4><ul><li>Forgetting a tank (duct keel, cofferdams, void spaces!).</li><li>"Empty" tanks are not always empty. <b>Sound them</b>.</li><li>A blocked sounding pipe or no trim correction gives a wrong volume.</li><li>Use the ballast density, not 1.000 or 1.025.</li></ul></div>`},
  {id:"net", name:"Net displ.", title:"Net displacement & the ship's constant",
   fields:[["net", "Net displacement", "t", 0, 10], ["constant", "Constant (initial survey only)", "t", 0, 12]],
   truth:(k, v) => v.t[k],
   hint:(k, v, t, n) => n < 2 ? ({net:`${F(t.Dd, 0)} − ${F(t.ded, 1)}`, constant:`Net − Lightship = ${F(t.net, 0)} − ${T1(SHIP.light)}`})[k] : `Answer: ${F(t[k], 0)} t`,
   lesson:v => `
    ${vidBlock("ds7")}
    <div class="sec"><h4>What is it?</h4><p><b>Net displacement</b> = displacement in dock water − deductibles. It is the ship + its "constant" + cargo.</p><p>In the <b>initial</b> survey (before loading): <b>Constant = Net − Lightship</b>.</p></div>
    <div class="sec"><h4>Why the constant?</h4><p>The constant is the <b>unknown weights</b>: stores, spare parts, paint, mud in the tanks, crew and effects, small errors. Tracking it from voyage to voyage shows whether the survey is good. A <b>negative</b> or very strange constant means: recheck!</p></div>
    <div class="sec"><h4>Where from?</h4><p><b>Lightship weight</b>: the ship's Trim &amp; Stability Booklet (${T1(SHIP.light)} t for our ship).</p></div>

    x.fillStyle = "#061622"; x.font = "800 12px ui-monospace,monospace"; x.textAlign = "center"; x.fillText(lab, px, ty + 3);
    x.strokeStyle = "rgba(255,255,255,.35)"; x.setLineDash([3, 3]); x.lineWidth = 1; x.beginPath(); x.moveTo(px, ty + 9); x.lineTo(px, Y(wl(u) + 2.2)); x.stroke(); x.setLineDash([]);
    cv.hot.push({k, x:px});
    if (mode === "mean") { const mk = {F:"Fm", M:"Mm", A:"Am"}[k]; x.fillStyle = "#ffd84d"; x.font = "700 12px ui-monospace,monospace"; x.fillText(SV.ok[view][mk] ? F(v.t[mk], 3) + " m" : "? m", px, Y(wl(u)) + 18); }
  });

}

function reportHTML(kind, partial) {
  const v = SV[kind], t = v.t, OK = SV.ok[kind], sh = k => !partial || OK[k];
  const r = (lab, val, k, cls = "") => `<tr class="${cls}"><td>${lab}</td><td>${sh(k) ? val : "?"}</td></tr>`;
  return `<table class="report">
   ${r("Observed F (P/S)", `${F(v.obs.FP)} / ${F(v.obs.FS)}`, "FS")}${r("Observed M (P/S)", `${F(v.obs.MP)} / ${F(v.obs.MS)}`, "MS")}${r("Observed A (P/S)", `${F(v.obs.AP)} / ${F(v.obs.AS)}`, "AS")}
   ${r("Corrected F / M / A", `${F(t.Fc, 3)} / ${F(t.Mc, 3)} / ${F(t.Ac, 3)}`, "Ac")}${r("True trim", S(t.trim) + " m", "trim")}${r("Hog (+) / sag (−)", S(t.defl) + " m", "defl")}${r("Quarter mean draft", F(t.QM, 3) + " m", "QM")}
   ${r("Displacement (table)", T1(t.D) + " t", "D")}${r("1st trim corr.", S(t.FTC, 1) + " t", "FTC")}${r("2nd trim corr.", S(t.STC, 1) + " t", "STC")}
   ${r("Corrected displacement", T1(t.Dc) + " t", "Dc")}${r("Dock water density", F(t.rho, 4), "rho")}${r("Displ. in dock water", T1(t.Dd) + " t", "Dd")}
   ${r("Deductibles", F(t.ded, 1) + " t", "ded")}${r("NET DISPLACEMENT", T1(t.net) + " t", "net", "tot")}
   ${kind === "init" ? r("Lightship", T1(SHIP.light) + " t", "net") + r("CONSTANT", T1(t.constant) + " t", "constant", "tot") : ""}</table>`;
}

/* ================= INTRO ================= */
function introHTML() {
  return `<div class="intro">
  <section class="card hero"><div class="heroimg"><img id="heroship" src="../assets/draft_18.webp" alt="Training ship: Handymax bulk carrier"></div><div><h1>Manual Draft Survey: weighing a ship with water</h1>
   <p>A <b>draft survey</b> finds out <b>how much cargo</b> was loaded (or discharged) by reading how deep the ship floats <b>before</b> and <b>after</b> cargo work. Here you do it <b>by hand</b>, step by step, the same way the Chief Officer and the independent surveyor do it on board.</p>
   <div class="startbtns"><button class="btn next" id="go_init">▶ START THE INITIAL SURVEY</button><button class="btn show" id="go_fin">Go to the final survey</button></div></div></section>
  <section class="card"><p class="kick">In easy words (Grade 5)</p><p class="big">A ship is like a toy boat in a bathtub.</p><p>Put coins in the boat and it goes <b>deeper</b>. If we know <b>how deep</b> it sits, we know <b>how heavy</b> it is.</p><p>So we "weigh" the ship <b>before loading</b> and <b>after loading</b>.<br><b>Heavy after − heavy before = the cargo!</b></p><p class="muted small">This is Archimedes' principle: a floating ship pushes away water that weighs exactly as much as the ship.</p></section>
  <section class="card"><p class="kick">Why do we do it?</p><ul><li>To know the <b>cargo quantity</b> for bulk cargoes (coal, iron ore, grain, fertiliser…) when there is no shore scale, or to <b>check</b> the shore figure.</li><li>The figure can go into the <b>Bill of Lading</b>, and it protects the ship in <b>cargo claims</b> (shortage disputes).</li><li>Owners, charterers, shippers and receivers all want a fair and independent figure.</li></ul><p class="small muted">A careful survey is usually accurate to about ±0.5% (reference: UNECE Code of Uniform Standards and Procedures for the Performance of Draught Surveys of Coal Cargoes).</p></section>
  <section class="card"><p class="kick">Who, when, with what?</p><ul><li><b>Who:</b> the Chief Officer, with the independent surveyor(s) for the shipper, receiver or charterer.</li><li><b>When:</b> <b>Initial</b> survey before cargo work starts, and <b>Final</b> survey after completion (sometimes intermediate ones too).</li><li><b>Tools:</b> a boat or launch for the draft marks, torch, sampling can and <b>hydrometer</b>, <b>sounding tape</b> and water-finding paste, tank <b>calibration tables</b>, the <b>Trim &amp; Stability Booklet</b> (hydrostatic tables), a calculator and the survey form.</li></ul></section>
  <section class="card"><p class="kick">The 7 parts (for each survey) · each part has its video</p><ol class="stepslist">
   <li><b>Draft readings</b>: the 6 marks, means, list and apparent trim.</li><li><b>Corrections to the perpendiculars</b>: FP, ⊗, AP and the true trim.</li><li><b>Mean of means</b>: the ship bends (hog/sag), the 6-sided formula.</li><li><b>Hydrostatic table and trim corrections</b>: displacement, TPC, LCF, MTC; 1st and 2nd trim correction.</li><li><b>Density</b>: hydrometer, sea water vs dock water.</li><li><b>Tank soundings</b>: ballast, fresh water, fuel, lube oil; the deductibles.</li><li><b>Net displacement</b>: and the ship's constant.</li></ol><p><b>Then:</b> Cargo = Final net − Initial net.</p></section>
  <section class="card"><p class="kick">Our training ship</p><table class="part"><tr><td>Name</td><td>${SHIP.name}</td></tr><tr><td>Type</td><td>${SHIP.type}</td></tr><tr><td>LBP</td><td>${F(SHIP.LBP)} m</td></tr><tr><td>Breadth</td><td>${F(SHIP.B)} m</td></tr><tr><td>Summer draft</td><td>${F(SHIP.summer)} m</td></tr><tr><td>Lightship</td><td>${T1(SHIP.light)} t</td></tr><tr><td>Fwd marks</td><td>${F(SHIP.dF)} m aft of FP</td></tr><tr><td>Mid marks</td><td>${F(SHIP.dM)} m aft of ⊗</td></tr><tr><td>Aft marks</td><td>${F(SHIP.dA)} m fwd of AP</td></tr></table><p class="small muted">Fictional training figures. The method is the real one.</p></section>
  </div>`;
}
function bindIntro() { $("go_init").onclick = () => setView("init", 0); $("go_fin").onclick = () => setView("fin", 0); }

/* ================= RESULT ================= */
function resultHTML() {
  const I = SV.init.t, Fn = SV.fin.t, OK = SV.ok.res, A = SV.ans.res, iDone = surveyDone("init"), fDone = surveyDone("fin");
  return `<section class="card lesson"><p class="kick">Cargo result</p><h2>Cargo = Final net − Initial net</h2>
   <div class="sec"><h4>What is it?</h4><p>At the <b>load port</b>: cargo loaded = <b>Final</b> net displacement − <b>Initial</b> net displacement.<br>At the <b>discharge port</b> it is the other way: cargo discharged = Initial − Final.</p></div>
   <div class="sec"><h4>Why does it work?</h4><p>The ship itself and its constant are in <b>both</b> surveys, so they cancel out. Only the cargo is left.</p></div>
   <div class="sec"><h4>Compare with the shore figure</h4><p>The shipper's figure (<b>Bill of Lading</b>, from the shore scale) is compared with the ship's figure:<br><span class="formula" style="display:inline-block">Difference % = (Ship − B/L) ÷ B/L × 100</span></p><p>Within about <b>±0.5%</b> is normally accepted. A bigger difference: recheck everything, then the Master may issue a <b>Letter of Protest</b>.</p></div>
   <div class="easy sec"><h4>Easy words</h4><p>You weigh yourself holding an empty bag, then holding the bag full of books. The difference is the <b>weight of the books</b>.</p></div></section>
   <section class="card vis"><p class="kick">Initial vs final</p>
   <table class="report"><tr><th></th><th>Initial</th><th>Final</th></tr>
    <tr><td>Quarter mean draft</td><td>${F(I.QM, 3)} m</td><td>${F(Fn.QM, 3)} m</td></tr>
    <tr><td>Displ. in dock water</td><td>${T1(I.Dd)} t</td><td>${T1(Fn.Dd)} t</td></tr>
    <tr><td>Deductibles</td><td>${F(I.ded, 1)} t</td><td>${F(Fn.ded, 1)} t</td></tr>
    <tr class="tot"><td>Net displacement</td><td>${T1(I.net)} t</td><td>${T1(Fn.net)} t</td></tr></table>
   ${!(iDone && fDone) ? `<p class="fb">ℹ️ You have not finished ${!iDone ? "the INITIAL" : ""}${!iDone && !fDone ? " and " : ""}${!fDone ? "the FINAL" : ""} survey yet. The numbers above are the answers, so you can still practise this page.</p>` : ""}
   <svg viewBox="0 0 600 170" style="margin-top:12px" role="img" aria-label="Cargo bar"><rect width="600" height="170" rx="10" fill="#0a2a3e"/>
    ${(() => { const mx = Fn.net * 1.05, w = n => n / mx * 520; return `<rect x="40" y="30" width="${w(I.net)}" height="34" fill="#64ddff"/><text x="${48 + w(I.net)}" y="52" font-size="13" fill="#64ddff" font-weight="800" font-family="ui-monospace,monospace">INITIAL net ${T1(I.net)} t (ship + constant)</text>
     <rect x="40" y="90" width="${w(I.net)}" height="34" fill="#64ddff"/><rect x="${40 + w(I.net)}" y="90" width="${w(Fn.net) - w(I.net)}" height="34" fill="#ffd84d"/><text x="${46 + w(I.net)}" y="112" font-size="13" fill="#111" font-weight="800" font-family="ui-monospace,monospace">CARGO ${OK.cargo ? T1(SV.cargo) + " t" : "?"}</text>
     <text x="40" y="150" font-size="12" fill="#cfe3ee" font-family="ui-monospace,monospace">FINAL net ${T1(Fn.net)} t = ship + constant + CARGO</text>`; })()}</svg>
   <p class="kick" style="margin-top:10px">Shipper's figure</p><table><tr><td>Bill of Lading (shore scale)</td><td>${T1(SV.bl)} t</td></tr></table>
   <div class="btns noprint"><button class="btn show" onclick="window.print()">PRINT REPORT</button></div></section>
   <section class="card sheet"><p class="kick">Worksheet</p><h3>Cargo &amp; difference</h3>
    <div class="field ${OK.cargo ? "ok" : ""}" id="f_cargo"><label for="i_cargo">Cargo loaded<small>t · 0 decimals</small></label><input id="i_cargo" inputmode="decimal" value="${A.cargo ?? ""}"><span class="mk">${OK.cargo ? "OK" : ""}</span></div><div class="hint" id="h_cargo"></div>
    <div class="field ${OK.diff ? "ok" : ""}" id="f_diff"><label for="i_diff">Difference vs B/L<small>% · 2 decimals (+ = ship more)</small></label><input id="i_diff" inputmode="decimal" value="${A.diff ?? ""}"><span class="mk">${OK.diff ? "OK" : ""}</span></div><div class="hint" id="h_diff"></div>
    <div class="btns"><button class="btn go" id="r_check">CHECK ✓</button><button class="btn show" id="r_show">SHOW ME</button></div>
    <div class="fb ${OK.cargo && OK.diff ? "good" : ""}" id="r_fb">${OK.cargo && OK.diff ? verdict() : "Final net − Initial net = cargo. Then compare with the B/L."}</div></section>`;
}
function verdict() { const d = SV.diff; return `Survey complete! Ship's figure <b>${T1(SV.cargo)} t</b> vs B/L <b>${T1(SV.bl)} t</b> → <b>${S(d, 2)}%</b>. ${Math.abs(d) <= 0.5 ? '<span class="good">Within ±0.5%: normally accepted. Sign the survey report.</span>' : '<span class="badv">More than ±0.5%: recheck the readings, density and soundings, then report to the Master (Letter of Protest).</span>'}`; }
function bindResult() {
  const A = SV.ans.res, OK = SV.ok.res, TR = SV.tries.res;
  ["cargo", "diff"].forEach(k => { const i = $("i_" + k); i.oninput = () => A[k] = i.value; i.onkeydown = e => { if (e.key === "Enter") $("r_check").click(); }; });
  const truth = {cargo:SV.cargo, diff:SV.diff}, tol = {cargo:15, diff:0.05};
  $("r_check").onclick = () => {
    ["cargo", "diff"].forEach(k => { if (OK[k]) return; const x = num(A[k]); if (!isFinite(x)) return;
      if (Math.abs(x - truth[k]) <= tol[k]) OK[k] = true; else { TR[k] = (TR[k] || 0) + 1; const h = $("h_" + k); $("f_" + k).className = "field bad";
        h.textContent = "Hint: " + (TR[k] < 2 ? (k === "cargo" ? `${T1(SV.fin.t.net)} − ${T1(SV.init.t.net)}` : `(${T1(SV.cargo)} − ${T1(SV.bl)}) ÷ ${T1(SV.bl)} × 100`) : `Answer: ${k === "cargo" ? T1(SV.cargo) : F(SV.diff, 2)}`); } });
    if (OK.cargo && OK.diff) setView("res"); else if (OK.cargo || OK.diff) { const keep = {...A}; setView("res"); Object.assign(A, keep); }
  };
  $("r_show").onclick = () => { A.cargo = F(SV.cargo, 0); A.diff = F(SV.diff, 2); OK.cargo = OK.diff = true; setView("res"); };
}

/* ================= BOOT ================= */
$("t_intro").onclick = () => setView("intro");
$("t_init").onclick = () => setView("init", view === "init" ? step : 0);
$("t_fin").onclick = () => setView("fin", view === "fin" ? step : 0);
$("t_res").onclick = () => setView("res");
$("t_new").onclick = () => { if (confirm("Make NEW draft readings, water density and tank figures? Your answers will be cleared.")) { newNumbers(false); setView(view === "res" ? "init" : view, 0); } };
addEventListener("resize", () => { if (view !== "intro" && view !== "res") renderVisual(); });
newNumbers(true);
(function start() {
  const want = (window.ECADEMY_START || location.hash.slice(1) || "").split(":");
  const map = {intro:"intro", init:"init", fin:"fin", res:"res"};
  if (map[want[0]]) setView(map[want[0]], +want[1] || 0); else setView("intro");
})();

/* ---- rendered 3D assets (Blender) ---- */
</script>
</body>
</html>
