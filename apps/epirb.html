<!doctype html>
<html lang="en"><head><script>window.ECADEMY_START = window.ECADEMY_START || (location.hash.slice(1) || undefined);</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECADEMY EPIRB Training</title>
<style>
:root{--bg:#0d1417;--panel:#121b1f;--line:#2a3a41;--tx:#e6eef0;--mut:#9fb2b8;--acc:#5ee6a8;--hi:#f2c14e}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#0a1013;color:var(--tx);font:16px/1.55 "Segoe UI",Arial,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#070b0d;border-bottom:1px solid var(--line);flex-wrap:wrap}header b{letter-spacing:.14em;color:#ff5a6a}header .sub{color:var(--mut);font-size:13px}header .sp{flex:1}
.btn{background:#1a252a;color:#e8f0f2;border:1px solid #3e535c;border-radius:4px;padding:7px 14px;cursor:pointer;font:600 13.5px "Segoe UI",Arial;letter-spacing:.02em}.btn:hover{border-color:#8fb3bf}.btn.on{background:#21404a;border-color:#7fd6ee;color:#fff}
.btn.big{font-size:15px;padding:9px 22px}.btn.go{background:#1f5a3f;border-color:#3f9a6f}.btn:disabled{opacity:.4;cursor:default}
.steps{display:flex;gap:4px;padding:8px 14px;overflow-x:auto;background:#0c1316;border-bottom:1px solid var(--line)}
.steps button{flex:0 0 auto;background:transparent;border:1px solid #2a3a41;color:#b9c8cc;border-radius:3px;padding:5px 11px;font:600 12.5px "Segoe UI",Arial;cursor:pointer;white-space:nowrap;position:relative}
.steps button.on{background:#e8eef0;color:#0b1215;border-color:#e8eef0}.steps button.ok{border-color:#3f9a6f}.steps button.ok::after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:#5ee6a8}
main{flex:1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(340px,1fr);gap:12px;padding:12px;min-height:0}
@media(max-width:980px){main{grid-template-columns:1fr}}
.stage{background:#05090b;border:1px solid var(--line);border-radius:6px;position:relative;overflow:hidden;min-height:440px;display:flex;align-items:center;justify-content:center}
.stage svg,.stage canvas{max-width:100%;max-height:100%;display:block}
.text{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 20px;overflow-y:auto}
.text h2{margin:0 0 2px;font-size:24px;color:#fff;font-weight:700}.text .kick{color:var(--mut);font-size:13.5px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.text p{margin:8px 0}.text b{color:var(--hi);font-weight:700}
.lead{font-size:19px;font-weight:600;color:#fff;line-height:1.45}
.key{border-left:4px solid var(--hi);background:#1a1a12;padding:9px 12px;margin:12px 0;font-size:15px}.key::before{content:"KEY POINT";display:block;font:800 11px Arial;letter-spacing:.14em;color:var(--hi);margin-bottom:3px}
.warn{border-left:4px solid #e0533f;background:#211112;padding:9px 12px;margin:12px 0;font-size:15px}.warn::before{content:"CAUTION";display:block;font:800 11px Arial;letter-spacing:.14em;color:#ff7a66;margin-bottom:3px}
.note{border-left:4px solid #4fa3c7;background:#0f1d24;padding:9px 12px;margin:12px 0;font-size:14.5px}
table.cmp{width:100%;border-collapse:collapse;font-size:14.5px;margin:8px 0}table.cmp th,table.cmp td{border:1px solid #2a3a41;padding:6px 8px;text-align:left;vertical-align:top}table.cmp th{background:#18242a;color:#dfe8ea;font-weight:700}table.cmp td:first-child{color:var(--mut);width:28%}
.part{display:flex;gap:10px;align-items:flex-start;padding:6px 4px;border-bottom:1px solid #22313a;cursor:pointer;font-size:14.5px}.part i{font:700 12px Arial;font-style:normal;border:1.5px solid #9fb2b8;color:#dfe8ea;border-radius:50%;width:22px;height:22px;flex:0 0 22px;display:grid;place-items:center}.part.on{background:#18262c}.part.seen i{background:#2f7a55;border-color:#5ee6a8}
.ctrl{position:absolute;left:10px;right:10px;bottom:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;background:rgba(5,9,11,.92);border:1px solid #2a3a41;border-radius:4px;padding:7px;font-size:14px}
.ctrl input[type=range]{width:220px}
.chk{list-style:none;margin:8px 0;padding:0;counter-reset:c}.chk li{padding:8px 10px 8px 40px;position:relative;border:1px solid #2a3a41;border-radius:4px;margin:5px 0;font-size:14.5px;cursor:pointer}
.chk li::before{counter-increment:c;content:counter(c);position:absolute;left:9px;top:8px;width:21px;height:21px;border-radius:50%;border:1.5px solid #6f8790;color:#dfe8ea;font:700 11px Arial;display:grid;place-items:center}
.chk li.done{border-color:#2f7a55;background:#0e2219;color:#bfe8d2}.chk li.done::before{background:#2f7a55;border-color:#5ee6a8}.chk li.now{border-color:var(--hi);background:#1e1a0c}
.q{border:1px solid #2a3a41;border-radius:4px;padding:10px;margin:10px 0}.q h4{margin:0 0 6px;font-size:15px}.q label{display:block;padding:6px 8px;border-radius:3px;cursor:pointer;font-size:14.5px;border:1px solid transparent}.q label:hover{border-color:#3e535c}
.q label.right{background:#0e2219;border-color:#2f7a55}.q label.wrong{background:#2a1214;border-color:#a33}.q .why{display:none;font-size:13.5px;color:#cfe;margin-top:6px}
nav{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:9px 14px;background:#070b0d;border-top:1px solid var(--line)}
.foot{text-align:center;padding:5px;color:#c9b27a;font-size:11px;background:#070b0d}
.prog{flex:1;height:5px;background:#1d2a30;border-radius:3px;overflow:hidden;max-width:420px}.prog i{display:block;height:100%;background:#5ee6a8}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#0f2a1f;border:1px solid #3f9a6f;color:#d9ffe9;padding:8px 16px;border-radius:4px;font-weight:600;z-index:60;display:none;font-size:14px}
.cap{position:absolute;left:12px;top:10px;font:600 12px Arial;color:#8fa6ad;letter-spacing:.06em}
</style></head><body>
<header><b>ECADEMY</b><span>EPIRB TRAINING</span><span class="sub">Emergency Position-Indicating Radio Beacon · basic course</span><span class="sp"></span><span class="sub" id="pct"></span><button class="btn" id="reset">START AGAIN</button></header>
<div class="steps" id="steps"></div>
<main><div class="stage" id="stage"></div><div class="text" id="text"></div></main>

  HEX ID      3E4B6D2A1B000C1<br>BEACON      EPIRB, float-free, Cat I<br>CODED WITH  MMSI 548000123<br>VESSEL      MV ECADEMY TRAINER<br>CALL SIGN   4DTR9<br>IMO         9999991<br>EMERGENCY   +63 2 0000 0000 (owner)<br>VALID TO    2028-12-31</div></div>`,

 <p>Every EPIRB has a unique <b>15-character HEX ID</b>. On ships it is normally <b>coded with the MMSI</b>.</p>
 <p>The EPIRB must be <b>registered</b> with the flag state administration. The registration holds the ship's name, call sign, owner and emergency contacts. The RCC uses it to <b>confirm</b> the alert and start the rescue faster.</p>
 <p>Check that the <b>label on the EPIRB</b> matches the ship and the registration certificate.</p>
 <div class="warn">If the ship changes name, flag, MMSI or owner, the EPIRB must be <b>re-coded and re-registered</b>. A wrong registration delays the rescue.</div>`});
const TST = [["Check the EPIRB is in its bracket, switch READY, cover closed, no damage, strobe lens clean.", null], ["Check the battery expiry date and the HRU expiry date.", null], ["Check the lanyard is neatly stowed and NOT tied to the ship.", null], ["Check the identity label matches the ship (MMSI / HEX ID).", null], ["Self-test: switch to TEST and release (as per the maker's manual).", "test"], ["Observe the result: indicator shows PASS. Return the switch to READY.", "pass"], ["Record the test in the GMDSS radio log.", null]];
L.push({t:"8  Monthly check and test", stage:() => `<div style="display:flex;gap:26px;align-items:center">${epirbSVG({w:240, h:480, sw:ST.tst === "run" ? "TEST" : "READY", led:ST.tst === "run" ? "amber" : ST.tst === "pass" ? "green" : "off", strobe:ST.tst === "run"})}<div style="font:600 15px Arial;color:#dfe8ea;max-width:250px;border-left:3px solid #f2c14e;padding-left:12px">${ST.tst === "run" ? "SELF-TEST RUNNING. The EPIRB checks battery, transmitter and GNSS. It does not send a real alert." : ST.tst === "pass" ? "SELF-TEST PASSED (green). Switch back to READY." : "Switch in READY."}</div></div>
  <div class="ctrl"><button class="btn" data-x="test">SWITCH TO TEST</button></div>`,
 text:() => `<h2>The monthly check and test</h2><div class="kick">Select each step in order.</div><ul class="chk">${TST.map((s, i) => `<li data-t="${i}" class="${ST.test > i ? "done" : ST.test === i ? "now" : ""}">${s[0]}</li>`).join("")}</ul>
 <div class="note">Also: <b>annual test</b> by an approved person (radio survey) and <b>shore-based maintenance</b> at intervals of not more than <b>5 years</b>, when the battery is normally renewed.</div>`,
 bind:() => { const bt = document.querySelector("[data-x]"); if (bt) bt.onclick = () => { if (ST.test !== 4) return toast("Do the checks in order first."); ST.tst = "run"; show(); setTimeout(() => { ST.tst = "pass"; if (ST.i === 7) show(); }, 2500); };
  document.querySelectorAll("[data-t]").forEach(li => li.onclick = () => { const i = +li.dataset.t; if (i !== ST.test) return toast("Follow the steps in order."); const need = TST[i][1];
    if (need === "test" && !ST.tst) return toast("Use SWITCH TO TEST first."); if (need === "pass" && ST.tst !== "pass") return toast("Wait for the test result.");
    if (need === "pass") ST.tst = null; ST.test++; if (ST.test === TST.length) { mark(); toast("Monthly check complete and recorded."); } show(); }); }});
L.push({t:"9  False alert", stage:() => `<div style="display:flex;gap:26px;align-items:center">${epirbSVG({w:220, h:440, strobe:!ST.fa, led:ST.fa ? "off" : "red"})}<div style="font:14px/1.6 Consolas,monospace;color:#dfe8ea;background:#060a0d;border:1px solid ${ST.fa >= 2 ? "#3f9a6f" : "#e0533f"};padding:12px;max-width:300px">${ST.fa >= 2 ? "TO: MRCC (via coast station / any means)<br>MV ECADEMY TRAINER, MMSI 548000123<br>EPIRB ACTIVATED IN ERROR AT 0915 UTC<br>POS 14°35'N 120°55'E<br>NO DISTRESS. PLEASE CANCEL ALERT." : "EPIRB ACTIVATED BY MISTAKE<br>(e.g. during maintenance or washed out of the bracket)"}</div></div>
  <div class="ctrl"><button class="btn" data-fa="1">1  SWITCH OFF</button><button class="btn" data-fa="2">2  INFORM RCC / COAST STATION</button><button class="btn" data-fa="3">3  LOG ENTRY</button></div>`,
 text:() => `<h2>If it starts by mistake</h2><div class="kick">False alerts waste rescue resources. Act at once.</div>
 <ul class="chk"><li class="${ST.fa >= 1 ? "done" : "now"}">Switch the EPIRB off (or return it to READY in the bracket, as per the manual).</li><li class="${ST.fa >= 2 ? "done" : ST.fa === 1 ? "now" : ""}">Immediately inform the nearest RCC or coast station by any means (VHF, MF/HF, SAT-C, phone): ship name, MMSI, HEX ID, time and position, "no distress".</li><li class="${ST.fa >= 3 ? "done" : ST.fa === 2 ? "now" : ""}">Record it in the GMDSS radio log.</li></ul>
 <div class="key">There is no penalty for reporting a false alert honestly. The danger is <b>not</b> reporting it.</div>`,
 bind:() => document.querySelectorAll("[data-fa]").forEach(b => b.onclick = () => { const n = +b.dataset.fa; if (n !== (ST.fa || 0) + 1) return toast("Follow the steps in order."); ST.fa = n; if (n === 3) mark(); show(); })});
const QZ = [["What is the main job of an EPIRB?", ["To show rescuers the survival craft on their radar", "To send a distress alert to shore through satellites", "To talk to other ships"], 1, "EPIRB = alerting via COSPAS-SARSAT. The SART is for locating on radar."],
 ["On which frequency is the distress alert sent to the satellites?", ["121.5 MHz", "406 MHz", "9 GHz"], 1, "406 MHz carries the digital alert. 121.5 MHz is for homing."],
 ["How often does the EPIRB send its 406 MHz burst?", ["Every 50 seconds", "Once only", "Every hour"], 0, "A short burst about every 50 seconds."],
 ["What makes a float-free EPIRB release when the ship sinks?", ["The master presses a button", "The Hydrostatic Release Unit (HRU) at about 1.5 to 4 m depth", "The battery"], 1, "Water pressure triggers the HRU, which cuts the rope."],
 ["Where must the lanyard be tied?", ["To the ship's rail", "To the survival craft", "It must never be used"], 1, "Tied to the ship, the EPIRB would sink with it."],
 ["In the bracket, the switch should be in...", ["OFF", "READY (armed)", "TEST"], 1, "READY so it starts automatically when it floats in sea water."],
 ["What is the 121.5 MHz signal used for?", ["Homing by SAR aircraft and ships", "Sending the GNSS position to the satellite", "Testing"], 0, "SAR units use a direction finder on 121.5 MHz."],
 ["The ship's name and MMSI change. What must be done with the EPIRB?", ["Nothing", "Re-code and re-register it", "Replace the battery"], 1, "The identity must match the registration."],
 ["The EPIRB is activated by mistake. What do you do?", ["Switch it off and say nothing", "Switch it off and inform the RCC / coast station at once, then log it", "Throw it overboard"], 1, "Always cancel the false alert with the RCC."],
 ["How often is a disposable HRU usually replaced?", ["Every 2 years", "Every 10 years", "Never"], 0, "Check the HRU expiry date during the monthly check."]];
L.push({t:"10  Quiz", stage:() => `<div style="text-align:center">${epirbSVG({w:190, h:380, led:Object.keys(ST.quiz).length === QZ.length ? "green" : "off"})}<div style="font:700 22px Arial;color:#fff;margin-top:6px" id="qs"></div></div>`,
 text:() => `<h2>Check your understanding</h2><div class="kick">Select one answer for each question.</div>${QZ.map((q, i) => `<div class="q"><h4>${i + 1}. ${q[0]}</h4>${q[1].map((o, j) => `<label data-q="${i}" data-o="${j}" class="${ST.quiz[i] != null ? (j === q[2] ? "right" : ST.quiz[i] === j ? "wrong" : "") : ""}">${String.fromCharCode(65 + j)}. ${o}</label>`).join("")}<div class="why" style="${ST.quiz[i] != null ? "display:block" : ""}">${q[3]}</div></div>`).join("")}`,
 bind:() => { document.querySelectorAll("[data-q]").forEach(l => l.onclick = () => { const i = +l.dataset.q; if (ST.quiz[i] != null) return; ST.quiz[i] = +l.dataset.o; if (Object.keys(ST.quiz).length === QZ.length) mark(); show(); }); qscore(); }});
L.push({t:"Real and simplified", stage:() => `<div style="text-align:center">${epirbSVG({w:230, h:460})}</div>`,
 text:() => `<h2>What is real in this training</h2><p><b>Real (SOLAS Chapter IV, IMO performance standards, COSPAS-SARSAT):</b> 406 MHz alert bursts about every 50 s with beacon identity (15-character HEX ID, coded with the MMSI) and GNSS position; 121.5 MHz homing; AIS on second-generation units (identity 974...); strobe light; float-free bracket with HRU releasing at about 1.5 to 4 m; automatic activation by sea-water contacts with the switch in READY / armed; at least 48 hours operation; registration with the flag administration; monthly check (MSC/Circ.1040), annual test and shore-based maintenance at intervals not exceeding 5 years; cancelling a false alert with the RCC.</p>
 <p><b>Simplified:</b> the ECADEMY E-1 is a <b>generic training model</b>, not a real product. Switch names, test procedures and indicator patterns differ between makers. The flow animation is simplified. Always follow the <b>maker's manual</b>, SOLAS and your <b>company SMS</b>.</p>`});
function qscore() { const n = Object.keys(ST.quiz).length, ok = Object.entries(ST.quiz).filter(([i, o]) => QZ[i][2] === o).length; const e = $("qs"); if (e) e.textContent = n ? `Score ${ok} / ${QZ.length}${n === QZ.length ? (ok >= 8 ? "  Passed" : "  Review the lessons and try again") : ""}` : "Answer the questions"; }
function mark() { if (!ST.seen[ST.i]) { ST.seen[ST.i] = true; toast(L[ST.i].t.replace(/^\d+\s+/, "") + ": completed"); } steps(); }
function steps() { $("steps").innerHTML = L.map((l, i) => `<button class="${i === ST.i ? "on" : ""} ${ST.seen[i] ? "ok" : ""}" data-s="${i}">${l.t}</button>`).join(""); document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => go(+b.dataset.s));
  const n = Object.keys(ST.seen).length; $("pbar").style.width = (n / L.length * 100) + "%"; $("pct").textContent = `${n} of ${L.length} lessons completed`; }
function show() { const l = L[ST.i]; $("stage").innerHTML = l.stage(); $("text").innerHTML = l.text(); if (l.bind) l.bind(); steps(); $("back").disabled = ST.i === 0; $("next").innerHTML = ST.i === L.length - 1 ? "FINISH" : "NEXT &#9654;"; }
function go(i) { if (![1, 2, 3, 4, 7, 8, 9].includes(ST.i)) ST.seen[ST.i] = true; ST.i = Math.max(0, Math.min(L.length - 1, i)); ST.f2t = 0; show(); }
$("next").onclick = () => { if (ST.i === L.length - 1) { ST.seen[ST.i] = true; steps(); return toast("EPIRB training completed."); } go(ST.i + 1); };
$("back").onclick = () => go(ST.i - 1);
$("reset").onclick = () => { Object.assign(ST, {i:0, seen:{}, parts:{}, test:0, quiz:{}, sw:"READY", pin:true, act:false, hl:0, tst:null, fa:0, f2t:0}); show(); };
function anim(now) { const c = $("cv");
  if (c) { if (!ST.f2t) ST.f2t = now;
    if (ST.i === 1) { const t = ((now - ST.f2t) / 1000) % ALERT_T; drawAlert(c, t); const k = flowStep(ALERT, t); document.querySelectorAll("#flow li").forEach((li, i) => { const c2 = i < k ? "done" : i === k ? "now" : ""; if (c2 === "now" && li.className !== "now") li.scrollIntoView({block:"nearest", behavior:"smooth"}); li.className = c2; }); if (t > 30) mark(); }
    else if (ST.i === 3) { const t = ((now - ST.f2t) / 1000) % 16; floatFree(c, t); if (t > 11) mark(); }
    else if (ST.i === 5) { signals(c, (now - ST.f2t) / 1000); } }
  requestAnimationFrame(anim); }
show(); requestAnimationFrame(anim);
window.EPT = {ST, go, L};

</script></body></html>
