ou how hard a Port State Control inspection of your ship is likely to be?", "o": ["The target factor and the inspection history of the ship", "The age of the ship and the flag she is registered under", "The number of port calls made in the region that year", "The last internal audit report held by the company ashore"], "a": 0, "why": "The target factor and the history of the ship decide how hard the inspection will be; the Ship Risk Profile is published by the Paris MOU and the Tokyo MOU."}, {"q": "How is the ship prepared before each port call under a sound PSC strategy?", "o": ["The crew is briefed on the answers the inspector is likely to want", "The deficiency list from the last inspection is removed from the file", "The agent is asked to find out which inspector is likely to attend", "A self-assessment is carried out using the checklist of the regional MOU"], "a": 3, "why": "Self-assessment before every port using the regional MOU checklist is the basis of preparation, under SOLAS I/19, MARPOL and the procedures of the Paris MOU and Tokyo MOU."}, {"q": "Why must the Port State Control inspector always be escorted on board?", "o": ["Because the ISPS Code forbids an unescorted visitor in any ship space", "Because the inspector may not open any equipment without a crew member", "Because a finding made with nobody present has nobody there to explain it", "Because the Master must witness every remark before it is written down"], "a": 2, "why": "Always escort the inspector and never let him walk around alone; left alone in the engine room he found something with nobody there to explain it."}], "flaginsp": [{"q": "Who may carry out a Flag State Inspection?", "o": ["The Port State Control officer of the region the ship is trading in", "A classification society surveyor acting under the IACS unified rules", "A Flag State Inspector or a Recognised Organization on their behalf", "The company's internal auditor appointed under the ISM Code"], "a": 2, "why": "The inspection is normally carried out by a Flag State Inspector or by a Recognised Organization on their behalf, under SOLAS I/19 and the IMO Instruments Implementation Code (III Code)."}, {"q": "Against which document are manning and crew certificates checked at a Flag State Inspection?", "o": ["The Minimum Safe Manning Document", "The Document of Compliance of the company", "The Safety Management Certificate of the ship", "The crew list endorsed by the agent on arrival"], "a": 0, "why": "Manning and crew certificates are checked against the Minimum Safe Manning Document."}, {"q": "Why does a Flag State remark carry more weight than a Port State Control remark?", "o": ["Because the Flag inspects the ship more often than the Port State does", "Because the Flag can withdraw the certificate it issued to the ship", "Because Flag findings are published on the regional MOU website", "Because only the Flag State can detain the ship in a foreign port"], "a": 1, "why": "The Flag State issued the ship's certificates and can withdraw them, which is why a Flag remark carries more weight than a PSC remark."}], "classsur": [{"q": "How often is the class renewal or special survey carried out?", "o": ["Every 3 years, with an annual survey in the years between", "Every 4 years, with a docking survey carried out each year", "Every 5 years, with annual and intermediate surveys between", "Every 2 years, with a continuous survey cycle running throughout"], "a": 2, "why": "The annual survey is every year, the intermediate at the second or third, and the renewal or special survey every 5 years, under SOLAS I/6 and I/10 and the rules of the Classification Society."}, {"q": "How many docking surveys must be carried out within a 5-year class period?", "o": ["One, at the end of the period, before the renewal survey", "Two, with a maximum interval laid down between them", "Three, one every 2 years, with the last in the final year", "Four, one in each year of the period except the last"], "a": 1, "why": "A docking survey is required twice within 5 years, with a maximum interval laid down."}, {"q": "What is the consequence of letting a Condition of Class due date pass?", "o": ["The surveyor grants an extension of 3 months on written request", "The next annual survey is advanced to the following port of call", "The remark is converted into a Recommendation with a fresh date", "Class is suspended, and the insurance and employment go with it"], "a": 3, "why": "Conditions of Class and Recommendations carry a due date and overrunning it suspends class; lose class and you lose the insurance and the employment."}], "statcert": [{"q": "For how long is a statutory certificate valid, and what is the window for the annual survey?", "o": ["5 years, with a window of 3 months before and after the anniversary date", "5 years, with a window of 1 month before and after the anniversary date", "4 years, with a window of 3 months before the anniversary date only", "5 years, with a window of 6 months on either side of the expiry date"], "a": 0, "why": "SOLAS I/12 and I/14 — certificates are valid for no more than 5 years, with a window of 3 months before and after the anniversary date for the annual survey."}, {"q": "Which three safety certificates does a cargo ship hold, each with its own survey?", "o": ["Safety Construction, Load Line and Safety Management", "Safety Equipment, Safety Radio and Ship Security", "Safety Equipment, Load Line and Maritime Labour", "Safety Construction, Safety Equipment and Safety Radio"], "a": 3, "why": "A cargo ship holds the Safety Construction, Safety Equipment and Safety Radio Certificates, each with its own survey."}, {"q": "The certificate runs to next year but the annual endorsement fell outside the window; what is the position?", "o": ["The certificate stands until the printed expiry date is reached", "The endorsement may be made at the next convenient port of call", "The certificate is treated as invalid, and that is detainable", "A letter from the company covers the ship until the next survey"], "a": 2, "why": "Many certificates need an annual endorsement and one without it is treated as invalid; at PSC that is detainable. The anniversary date is the key, not the expiry alone."}], "ismoversee": [{"q": "Where is the Master's overriding authority for safety and pollution prevention set out?", "o": ["ISPS Code Part A, together with the ship security plan", "MLC 2006 Title 5 on compliance and enforcement", "SOLAS Chapter IX, with the Document of Compliance", "ISM Code Element 5, and it is written into the SMS"], "a": 3, "why": "ISM Code Element 5 covers the Master's responsibility and authority, including the overriding authority, and it is written into the SMS."}, {"q": "When is a Declaration of Security completed?", "o": ["When the security level of the ship and the facility differ", "When the ship enters a port outside her usual trading area", "Whenever the SSO is relieved during a crew change in port", "When security level 1 is set for both the ship and the facility"], "a": 0, "why": "A Declaration of Security is made when the security level of the ship and of the facility differ; ISPS Code Part A."}, {"q": "What happens at audit when the Master's review of the SMS has been signed without being carried out?", "o": ["It is noted as an observation to be closed before the next port", "It becomes a major non-conformity against the safety system", "The company is required to repeat the internal audit within 3 months", "The review is returned to the ship to be completed while at sea"], "a": 1, "why": "The Master's review must be carried out and reported to the company at set intervals; an empty review signed without reading becomes a major non-conformity at audit."}], "deficresp": [{"q": "What is the difference between corrective and preventive action?", "o": ["Corrective action is done by the ship, preventive action by the company", "Corrective action closes the remark, preventive action satisfies the Flag", "Corrective action repairs the fault, preventive action stops it recurring", "Corrective action is the interim measure, preventive the permanent repair"], "a": 2, "why": "Corrective action names who repairs the fault and by when; preventive action is what keeps it from happening again. ISM Code Elements 9 and 10."}, {"q": "What is your first step on being given a Port State Control deficiency?", "o": ["Carry out the repair before the inspector has left the ship", "Send the remark to the company for a corrective action plan", "Put interim measures in place to keep the ship safe meanwhile", "Understand the remark and its code, and ask where it is unclear"], "a": 3, "why": "Understand the remark and its code first, asking where it is unclear, before you answer; interim measures follow to keep the ship safe while the repair is pending."}, {"q": "Why is repairing a broken light and recording only that an inadequate response?", "o": ["Because class must verify the repair before the record can be closed", "Because the root cause, why the monthly inspection missed it, is untouched", "Because the invoice and the photographs were not attached to the report", "Because no interim measure was recorded while the repair was pending"], "a": 1, "why": "The response must reach the root of the problem, not only what was seen; nobody asked why the ship's own monthly inspection had missed the light. ISM Code Elements 9 and 10."}], "auditprep": [{"q": "When is the intermediate verification of the Safety Management Certificate carried out?", "o": ["Between the first and the second anniversary of the certificate", "In the final year of validity, before the certificate expires", "Between the second and the third anniversary of the certificate", "At any point in the 5 years, at the choice of the company"], "a": 2, "why": "Intermediate verification of the SMC falls between the second and third anniversary, and the SMC is valid for 5 years. ISM Code Elements 12 and 13."}, {"q": "How should the crew be briefed before an external audit?", "o": ["To know where to find the procedure rather than to memorise answers", "To answer only the questions put by their own head of department", "To learn the likely questions and the agreed answer to each of them", "To refer every technical question to the Master or Chief Engineer"], "a": 0, "why": "Brief the crew to know where to find the procedure, not to give memorised answers; crew coached on answers were noticed and the examination went deeper."}, {"q": "What does an auditor's trail of evidence follow?", "o": ["The deficiency list of the last external audit through to its closeout", "One task from the policy right through to the record of the work", "The non-conformities raised by the ship over the preceding year", "The certificate of each officer against the Safe Manning Document"], "a": 1, "why": "The trail of evidence is the auditor following one task from the policy right through to the record; an audit examines the system, not the person."}], "smsreview": [{"q": "How often is the Master's review of the SMS carried out?", "o": ["At every crew change, and again at each change of trading area", "At the interval set by the SMS, normally yearly or on a major change", "Only when an internal audit has raised a non-conformity on board", "Every 6 months, with a copy sent to the Flag State administration"], "a": 1, "why": "It is carried out at the interval set by the SMS, normally yearly or whenever there is a major change. ISM Code Element 5.1.5."}, {"q": "What makes the Master's review of the SMS worth something at audit?", "o": ["A statement that the system is adequate and effective, signed and dated", "The written response of the company attached to the ship's own copy", "Specific deficiencies backed by evidence, data and proposed changes", "The signature of every officer who took part in making the review"], "a": 2, "why": "The review must be specific and backed by evidence, with the data from near misses, non-conformities, defects and drills, and it must propose the change rather than only complain. ISM Code Element 5.1.5."}, {"q": "Why does crew trust break down when the company never answers the Master's review?", "o": ["Because the Flag State requires the response to be kept on board", "Because the SMS cannot be amended without a shore-side reply", "Because the internal audit will raise it as a non-conformity", "Because a review with no answer breaks the reporting cycle"], "a": 3, "why": "The review is sent to the company and a response asked for, because a review with no answer breaks the cycle and the crew are never told what changed from their reports. ISM Code Element 12 covers the company's duty to respond."}], "collground": [{"q": "What is your first action after a collision?", "o": ["Sound every tank and hold to establish the extent of the damage", "Take a head count and see to the injured and the safety of the crew", "Report the position to the coastal State, the company and the Flag", "Secure the data of the VDR before it can be overwritten"], "a": 1, "why": "People come first: head count, injured and the safety of the crew before any survey of the damage."}, {"q": "Why should you not pull clear immediately after a collision?", "o": ["Because the other ship may be the only thing holding back the flooding", "Because the coastal State must give permission before manoeuvring", "Because the engines may not be used until every tank is sounded", "Because the record of the VDR would be lost once the ship moves"], "a": 0, "why": "Do not pull clear straight after a collision while the other ship is plugging the hole; she could be the only thing holding back the flooding."}, {"q": "What must be done with the VDR after a collision or grounding?", "o": ["Download it only when the investigator comes on board the ship", "Leave it running so that the whole incident is captured on it", "Secure the data immediately, before it can be overwritten", "Switch it off at once so that the record cannot be altered"], "a": 2, "why": "The VDR data must be secured immediately before it is overwritten; where nobody saved it, the best evidence for the ship herself was lost."}], "fireexp": [{"q": "What comes before any attack on a fire?", "o": ["Release of the fixed gas system into the affected space", "Boundary cooling on every side, above and below the space", "Altering course and speed to put the fire on the lee side", "Alarm, head count and the setting of the boundary"], "a": 3, "why": "Alarm, head count and boundary come before any attack, and the first thing to establish is whether anyone is missing. SOLAS Chapter II-2 and the muster list in SOLAS III/8."}, {"q": "How are the breathing apparatus teams organised in a major fire?", "o": ["One team in and one ready outside, with a set time to come out", "Two teams in together, each entering the space from a different side", "One team in, relieved by the next only when the air is running low", "Three teams rotating continuously until the fire has been put out"], "a": 0, "why": "One BA team goes in with one ready outside, and a time to come out is set and held to."}, {"q": "Why must the Master command a fire from outside the fight itself?", "o": ["Because the muster list gives the attack team to the Chief Officer", "Because breathing apparatus may not be worn by the Master on board", "Because only from there does he see the whole picture and decide", "Because the fixed system can be released from the bridge alone"], "a": 2, "why": "The Master commands the fight from a place where he sees the whole picture; when he joined the attack the ship lost its leader and nobody decided the bigger questions, such as the head count before releasing fixed gas."}], "flood": [{"q": "Why is a half-full flooded compartment more dangerous than a completely full one?", "o": ["Because the weight of the water is carried higher up in the ship", "Because the free surface effect takes away the stability remaining", "Because the water can work its way into the adjacent compartment", "Because the trim changes faster than the list can be corrected"], "a": 1, "why": "Flooding kills not through weight but through free surface, which is the first enemy; a ship that sinks has usually capsized first."}, {"q": "Which regulation requires the damage control plan and booklet to be provided on board?", "o": ["SOLAS II-1/19", "SOLAS II-2/10", "SOLAS III/17-1", "SOLAS V/31"], "a": 0, "why": "SOLAS Chapter II-1 Part B-1 covers damage stability, and the damage control plan and booklet are required by SOLAS II-1/19."}, {"q": "A list develops after flooding; what is the risk in ballasting the opposite side to correct it?", "o": ["The ship may be driven over the permissible deadweight for the draught", "The cross-flooding arrangement will no longer operate as it was designed", "The longitudinal strength limits may be exceeded at the midship section", "The new free surface can take away the GM that is left to the ship"], "a": 3, "why": "Do not simply add water to correct a list, since you can lose the GM you have left; added ballast on the opposite side grew the free surface and the heel got worse."}], "mefail": [{"q": "What lights and shapes are shown by a vessel not under command?", "o": ["Two all-round red lights, or two balls in a vertical line", "Three all-round red lights, or a ball, diamond and ball shape", "Two all-round red lights, or a single black diamond shape", "A red light over a white, or two cones with apexes together"], "a": 0, "why": "COLREG Rules 3(f) and 27 — not under command is shown by two red lights or two balls, and the condition is also passed at once on VHF."}, {"q": "On losing steering, what is done in the steering gear room?", "o": ["The hydraulic pumps are stopped until the fault has been traced", "A man is stationed there with communications on emergency steering", "The rudder is secured amidships with the locking arrangement fitted", "The emergency generator is started to supply the steering motors"], "a": 1, "why": "Change over to emergency steering and station a man in the steering gear room with communications. SOLAS V/26 covers steering gear and emergency steering."}, {"q": "Why do you call for a tug earlier than it seems necessary after a propulsion failure?", "o": ["Because the charter party requires the charterer to be consulted first", "Because the tug cannot be released once the main engine is restarted", "Because VTS will not accept a request made from inside the fairway", "Because an unused tug is cheaper than a grounding"], "a": 3, "why": "Call for a tug early, not once it is too late; an unused tug is cheaper than a grounding."}], "absdec": [{"q": "Why do you stay with the ship for as long as you reasonably can?", "o": ["Because the Flag State must authorise the abandonment beforehand", "Because the ship is safer than the lifeboat while she floats and shelters", "Because salvage cannot be claimed once the crew have left her", "Because the distress alert holds good only while she is still manned"], "a": 1, "why": "The ship is safer than the lifeboat as long as she floats and gives shelter; she is left once there is no reasonable hope left of keeping her afloat or safe."}, {"q": "What goes out before the survival craft are launched?", "o": ["A Pan-Pan message to the ships in the area and to the coast station", "A report to the company and to the P&I correspondent of the owner", "The distress alert: DSC, EPIRB, SART and the position", "A notice of deviation to the charterer and to the port agent"], "a": 2, "why": "The distress alert goes out before, not after: DSC, EPIRB, SART and the position. SOLAS Chapter III and the IAMSAR Manual."}, {"q": "Who takes the decision to abandon ship?", "o": ["The company, acting on the advice of the designated person ashore", "The Flag State, once the distress alert has reached the authority", "The Master together with the senior officers at the muster station", "The Master alone, on his overriding authority"], "a": 3, "why": "The decision is the Master's alone, and his overriding authority under ISM Code Element 5 is its foundation; nobody in the office can see the ship."}], "sarpob": [{"q": "When does a ship become On-Scene Coordinator at a search and rescue incident?", "o": ["On arriving first on scene, until the RCC appoints one", "On being nominated by the rescue centre of the coastal State", "On recovering the first casualty from the water on scene", "On establishing communications with the aircraft on scene"], "a": 0, "why": "The first ship on scene is On-Scene Coordinator until the RCC appoints one; the ship organises rather than waits."}, {"q": "Which regulation requires a ship-specific plan and procedures for recovery of persons from the water?", "o": ["SOLAS V/33", "SOLAS III/17-1", "SOLAS V/7", "SOLAS III/8"], "a": 1, "why": "SOLAS III/17-1 requires a ship-specific recovery plan and procedures to recover a person from the water."}, {"q": "Why start the search without waiting for instructions from the rescue centre?", "o": ["Because the RCC cannot direct a merchant ship under SOLAS V/33", "Because the datum cannot be calculated once the drift has set in", "Because the search area grows with every hour that passes", "Because the first ship on scene must report before any pattern begins"], "a": 2, "why": "Waiting for an order from the RCC wastes time and the search area grows with every hour that passes; the duty to respond is under SOLAS V/33."}], "pollinc": [{"q": "What is done first in an oil spill on board?", "o": ["The affected deck is washed down before the oil can spread further", "Photographs are taken of the affected area and of the sea surface", "The company and the P&I Club are informed by telephone at once", "The source is stopped and the spread contained"], "a": 3, "why": "Stop the source and contain the spread before any cleaning; nothing is washed over the side and cleaning is not started without permission."}, {"q": "Which spills must be reported to the coastal State?", "o": ["Every spill, however small the leak", "Only those above the quantity stated in the SOPEP", "Only those that reach the water outside the ship", "Only those beyond the ship's own means of cleaning"], "a": 0, "why": "Report at once to the coastal State and to everyone on the SOPEP contact list, however small the leak. MARPOL Annex I Regulations 37 and Protocol I make reporting an obligation, not an option."}, {"q": "Why does putting things right before reporting weigh so heavily against the Master?", "o": ["Because the Oil Record Book entry can no longer be made in time", "Because the samples required by the coastal State are destroyed", "Because concealment is what turns an incident into a criminal case", "Because the P&I Club withdraws cover once the cleaning has begun"], "a": 2, "why": "The quantity does not decide how heavy the case is; honesty and the speed of reporting do, and fixing everything first to make the report look clean is what turns an incident into a crime."}], "emgcomm": [{"q": "Which signal is used for an urgency message concerning the safety of a ship or of a person?", "o": ["Mayday", "Pan-Pan", "Securite", "Mayday Relay"], "a": 1, "why": "Pan-Pan is urgency, Mayday distress and Securite safety; a distress has priority over all other communications. SOLAS Chapter IV covers GMDSS."}, {"q": "What belongs in the content of a distress message?", "o": ["Identity, position, nature of the emergency, assistance and persons", "Identity, last port, next port, cargo on board and the agent's name", "Position, course and speed, weather on scene and the time of alert", "Identity, position, the contact details of the company and the Flag"], "a": 0, "why": "The content is identity, position, nature of the emergency, assistance required and the number of persons, with the DSC alert sent first and then voice on Channel 16 or the appropriate frequency."}, {"q": "Why is only one person appointed to report off the ship in an emergency?", "o": ["Because the GMDSS equipment may be worked by one operator only", "Because the Flag State requires every report to come from the Master", "Because two accounts that differ cost the ship its credibility", "Because each message must be logged by the person who sent it"], "a": 2, "why": "One voice to the outside: when the Chief Engineer reported to the office and the Master to the Flag, the two accounts differed and the ship lost its credibility."}], "offlog": [{"q": "Which of these belongs in the Official Logbook rather than the deck logbook?", "o": ["Courses steered and the engine movements made in pilotage waters", "Births, deaths, marriages, discipline, drills and inspections", "Hourly weather, the barometric pressure and the state of the sea", "Cargo quantities loaded and the sequence of the work in the holds"], "a": 1, "why": "The Official Logbook records births, deaths, marriages, discipline, drills, inspections and the main events; it is required by the Flag State and carries legal force."}, {"q": "How is an error in the Official Logbook corrected?", "o": ["The page is taken out and rewritten, and the Master signs the new one", "The entry is erased and the correct figure written in its place", "One line is drawn through it, the correct entry written and signed", "A note is made on the next clear page referring back to the error"], "a": 2, "why": "No erasures and no torn-out pages: one line through the error, write the correct entry, and sign; some entries also require a witness as the Flag State lays down."}, {"q": "An event belonging in the Official Logbook was entered in the deck log; what is the effect?", "o": ["The entry stands, provided that the Master countersigns both books", "The deck log entry may be transcribed later in front of a witness", "Both books are produced together and the record is then complete", "In court the wrong book is as good as no record at all"], "a": 3, "why": "The Official Logbook carries legal force and is not the deck logbook; in court the wrong book is as good as no record."}], "crewdocs": [{"q": "What must be checked on the certificate of competency of a newly joined officer?", "o": ["That the home country issued it and the rank matches his contract", "That it carries the endorsement of the ship's Flag State as well", "That it bears the company stamp and the number of the manning agent", "That the issuing authority appears on the IMO list for STCW parties"], "a": 1, "why": "Check the Certificate of Competency and the endorsement of the ship's Flag State, not only that of the home country. STCW Regulation I/2 and I/10 cover recognition of certificates."}, {"q": "How far ahead is the company told that a crew certificate is about to expire?", "o": ["3 months before expiry, with the tracker attached to the report", "1 month before expiry, on the monthly crew report of the ship", "6 months before expiry, from the expiry tracker kept on board", "At the first crew change following the date of the expiry"], "a": 2, "why": "Keep an expiry tracker and tell the company 6 months before anything expires."}, {"q": "Why are crew certificates checked on joining rather than on sailing day?", "o": ["Because a missing certificate can become a detention", "Because the manning agent cannot be reached after sailing", "Because a flag endorsement is issued only while in port", "Because the Safe Manning Document is reissued at each change"], "a": 0, "why": "Check on joining, not on sailing day, because a missing certificate can become a detention; an endorsement that expired at sea left the manning short and the ship was detained at the next port."}], "mlchours": [{"q": "What are the minimum hours of rest required of a seafarer?", "o": ["Not less than 8 hours in any 24 hours and 72 hours in any 7 days", "Not less than 10 hours in any 24 hours and 77 hours in any 7 days", "Not less than 10 hours in any 24 hours and 70 hours in any 7 days", "Not less than 12 hours in any 24 hours and 84 hours in any 7 days"], "a": 1, "why": "MLC 2006 Standard A2.3 and STCW Code Section A-VIII/1 — not less than 10 hours of rest in any 24 hours and 77 hours in any 7 days."}, {"q": "How may the 10 hours of rest in any 24 hours be divided?", "o": ["Into no more than 2 periods, one of them of at least 6 hours", "Into no more than 3 periods, one of them of at least 6 hours", "Into no more than 2 periods, one of them of at least 8 hours", "Into any number of periods of not less than 2 hours each"], "a": 0, "why": "Rest may be split into no more than 2 periods, one of which must be not less than 6 hours, and the interval between two rest periods must not exceed 14 hours."}, {"q": "Why is a dressed-up rest hour record more dangerous than an admitted breach?", "o": ["Because the collective agreement allows a breach to be recorded", "Because compensatory rest cannot be given once the record is closed", "Because it will not match the bell book and the record of the drills", "Because PSC compares the record with the Safe Manning Document"], "a": 2, "why": "Where a breach cannot be avoided, record it with the reason and fix the schedule; an altered record did not match the bell book or the drill record and the inspector saw it."}], "discip": [{"q": "What must be done before any disciplinary decision is taken?", "o": ["The permission of the company must be obtained in writing", "The entry must be prepared in the Official Logbook beforehand", "The penalty must be agreed with the head of department first", "Both sides must be heard and the statements taken"], "a": 3, "why": "Investigate first: hear both sides and take statements before you decide, and give the person concerned a chance to explain."}, {"q": "Where is the disciplinary procedure you must follow written down?", "o": ["In the SMS and the collective bargaining agreement", "In the Official Logbook instructions of the Flag State", "In ISM Code Element 5 and the Master's standing orders", "In the seafarer's employment agreement and nowhere else"], "a": 0, "why": "Follow the procedure in the SMS and the collective agreement and do not invent your own rules; MLC 2006 Standard A5.1.5 covers onboard complaint procedures."}, {"q": "A rating is caught in a clear breach; why must he still be heard before a penalty is given?", "o": ["Because the witness to the logbook entry must hear him first", "Because the company cannot approve a penalty without his statement", "Because an unheard penalty becomes a case against the ship", "Because repatriation may only follow a recorded admission"], "a": 2, "why": "Giving the person concerned a chance to explain is the most important step; punishment on the spot with no hearing became a union case in which the ship, not the rating, was in the wrong."}], "medrep": [{"q": "What is TMAS?", "o": ["The telemedical advice service giving free medical advice by radio", "The shore unit of the rescue centre that coordinates every medevac", "The WHO guide listing the required contents of the medical locker", "The company doctor who certifies seafarers as fit for sea service"], "a": 0, "why": "TMAS is the free medical advice by radio; the advice is followed and every piece of it logged. MLC 2006 Regulation 4.1 covers medical care on board."}, {"q": "How is a helicopter medevac arranged?", "o": ["Directly with the nearest hospital, through the local port agent", "Through the RCC, with its own preparation and its own risk", "Through the company, which charters the aircraft for the ship", "Through the pilot station of the coastal State on VHF"], "a": 1, "why": "Medevac by helicopter or boat carries its own preparation and risk and is worked through the RCC."}, {"q": "Why is an early decision on deviation better than waiting to see whether the patient worsens?", "o": ["Because the charterer has to approve a deviation before it begins", "Because TMAS advice lapses if it is not acted on the same day", "Because the hours lost can never be recovered", "Because the P&I Club will not cover a late deviation"], "a": 2, "why": "Decide early on a deviation because the hours lost can never be recovered; waiting a day left the ship far from any hospital by the time the decision came."}], "cashstores": [{"q": "How are controlled drugs kept and recorded on board?", "o": ["In the medical locker, with the quantity checked at each inspection", "Locked under two keys, with every dose recorded and two signatures", "In the Master's safe, issued against the patient's written request", "With the bonded stores, sealed and declared to customs in port"], "a": 1, "why": "Controlled drugs are locked under two keys, with every dose recorded and two signatures."}, {"q": "What is the rule for bonded stores while the ship is in port?", "o": ["They are sealed, every issue is logged and the declaration kept ready", "They are issued only against the signature of the customs officer", "They are counted at the end of each port call and then declared", "They are landed ashore and returned once the ship has sailed"], "a": 0, "why": "Bonded stores are sealed while in port, every issue is logged and the customs declaration is kept ready; with no signed record of the stores issued, a shortfall became a fine and an accusation."}, {"q": "Why must the person who holds the cash not also be the only person who records it?", "o": ["Because MLC requires the wages account to be audited every month", "Because the daily balance has to be signed by two of the officers", "Because customs will not accept the declaration of one officer alone", "Because without a check in place one person can face an accusation"], "a": 3, "why": "Keep the records separate from the money, since one person should not both hold and record without a check; cash, bonded stores and controlled drugs are the three easiest sources of an accusation and the records are the defence."}], "cmdhand": [{"q": "What belongs in the written handover note on a change of command?", "o": ["Condition of the ship, open defects, certificates and surveys due", "Standing orders, bridge checklists and the passage plan now in use", "Crew appraisals, notes on promotion and the overtime records held", "Class survey status and the last Port State inspection report"], "a": 0, "why": "The written handover note covers the condition of the ship, open defects, certificates and the surveys coming due, with the commercial and crew positions alongside. ISM Code Element 6 and the SMS handover procedure."}, {"q": "What is counted together by the outgoing and the incoming Master?", "o": ["The cargo remaining on board, the bunkers and the fresh water", "Cash, bonded stores, keys, controlled drugs and the documents", "The certificates, the nautical publications and the chart folios", "The lifesaving appliances, the deck stores and the spare parts"], "a": 1, "why": "Cash, bonded stores, keys, controlled drugs and the documents are counted together, and both Masters sign the handover with a copy to the company."}, {"q": "Why is a walk round the whole ship needed on top of the written handover?", "o": ["Because the company requires a joint inspection report at each change", "Because the certificates must be sighted in their original folders", "Because paper alone does not show the true condition of the ship", "Because the minimum overlap period cannot otherwise be justified"], "a": 2, "why": "Walk the whole ship together and do not rely on paper alone; a short handover taken because the flight was waiting left an open claim that nobody knew about."}], "ordlib": [{"q": "Which limits belong in the navigation section of the Master's standing orders?", "o": ["CPA and TCPA, under keel clearance, speed, lookout and calling the Master", "Anchor circle, engine notice and the signs that the anchor is dragging", "Gangway watch, draught monitoring, mooring and the control of access", "ISPS level, watchkeeping in a piracy area and the citadel procedure"], "a": 0, "why": "Navigation orders cover CPA and TCPA, UKC, speed, lookout and when to call the Master; the others are the anchoring, port and cargo, and security orders."}, {"q": "When are the Master's standing orders signed and reviewed?", "o": ["At the start of each voyage, by the officer of the watch on duty", "Once a year, when the Master's review of the SMS is carried out", "Signed by every officer and reviewed at each crew or route change", "Signed by the Chief Officer and filed together with the passage plan"], "a": 2, "why": "The standing orders are signed by every officer and reviewed at every crew change or change of route. SOLAS V/34-1 and STCW Code A-VIII/2."}, {"q": "Why do standing orders copied from a previous ship lose their force?", "o": ["Because the officers will not sign orders issued by another Master", "Because the limits in them do not suit the present ship and route", "Because the SMS requires the company to approve any new orders", "Because they must follow the format laid down by the Flag State"], "a": 1, "why": "Standing orders are a living document, not a template to copy; the orders brought from the last ship carried limits that did not suit the present ship and route."}], "metsynop": [{"q": "What does the spacing of the isobars on a synoptic chart tell you?", "o": ["The air temperature", "The strength of the wind", "The height of the sea", "The rate of rainfall"], "a": 1, "why": "Close isobars mean a steep pressure gradient and strong wind; widely spaced isobars mean light wind."}, {"q": "What weather is normally found in a high pressure area?", "o": ["Rising air, cloud and rain", "Settled weather, light wind and often poor visibility", "Strong wind and heavy swell", "Rapid frontal passage"], "a": 1, "why": "Air sinks in a high, which suppresses cloud and gives settled conditions, light wind and frequently haze or fog."}, {"q": "Why is the prognosis chart compared with the analysis chart?", "o": ["To check the chart datum", "To see the speed and direction in which the systems move", "To obtain the tidal stream", "To confirm the ship's position"], "a": 1, "why": "The analysis shows the present position and the prognosis the forecast one; the difference gives the movement and the rate of deepening."}], "metbuys": [{"q": "In the northern hemisphere, where is the centre of the low when you face the wind?", "o": ["Directly ahead", "On your right, slightly behind", "On your left, slightly behind", "Directly astern"], "a": 1, "why": "Buys Ballot's Law: facing the wind in the northern hemisphere, the low lies on the right hand and slightly behind."}, {"q": "In which direction does the wind circulate around a low in the southern hemisphere?", "o": ["Clockwise", "Anticlockwise", "Directly inwards", "Directly outwards"], "a": 0, "why": "Circulation around a low is anticlockwise in the northern hemisphere and clockwise in the southern."}, {"q": "What barometric fall over 3 hours is treated as significant?", "o": ["1 hPa", "3 hPa", "8 hPa", "12 hPa"], "a": 1, "why": "A fall of 3 hPa in 3 hours is significant; 5 hPa in 3 hours calls for action."}], "metfronts": [{"q": "Which sequence belongs to an approaching warm front?", "o": ["Cumulonimbus, squall, sharp veer, temperature drop", "Cirrus, lowering cloud, steady rain, veering wind, rising temperature", "Clear sky, rising pressure, light wind", "Fog, steady pressure, no wind change"], "a": 1, "why": "A warm front has a shallow slope, so the cloud lowers gradually ahead of steady rain and the temperature rises as it passes."}, {"q": "What happens to the pressure immediately after a cold front passes?", "o": ["It falls steadily", "It rises", "It stays level for 6 hours", "It falls then rises after 12 hours"], "a": 1, "why": "The pressure rises behind a cold front as the colder, denser air arrives."}, {"q": "By how much can a squall on a cold front exceed the forecast mean wind?", "o": ["About 2 knots", "About 5 knots", "20 knots or more", "It never exceeds the forecast"], "a": 2, "why": "Cold front squalls can exceed the forecast mean wind by 20 knots or more, which is why the deck is secured before arrival."}], "mettrs": [{"q": "Where in a tropical revolving storm are the strongest wind and the worst sea found?", "o": ["In the eye", "In the eye wall", "In the outer rain bands", "Ahead of the storm in the swell"], "a": 1, "why": "The eye is comparatively calm; the eye wall surrounding it carries the strongest wind and the heaviest sea."}, {"q": "Which is the earliest warning sign of a tropical revolving storm?", "o": ["A long low swell from an unusual direction", "A sudden wind shift", "Heavy continuous rain", "A rise in sea temperature"], "a": 0, "why": "The long low swell runs ahead of the system and arrives well before the wind, pointing back towards the centre."}, {"q": "What pressure departure from the normal for the area is treated as a warning?", "o": ["3 hPa or more below normal", "10 hPa above normal", "1 hPa below normal", "Any change at all"], "a": 0, "why": "A reading 3 hPa or more below the normal for the area and the season is one of the classical warning signs."}], "mettrsav": [{"q": "In the northern hemisphere, which half of a tropical revolving storm is the dangerous semicircle?", "o": ["The left-hand half facing the direction of travel", "The right-hand half facing the direction of travel", "The half astern of the centre", "The half ahead of the centre"], "a": 1, "why": "In the northern hemisphere the right-hand semicircle, facing the direction of travel, is the dangerous one; the storm's speed adds to the wind there."}, {"q": "In the northern hemisphere dangerous semicircle, where should the wind be brought?", "o": ["On the starboard quarter", "On the starboard bow", "Right astern", "On the port beam"], "a": 1, "why": "Bring the wind on the starboard bow and make as much way as possible to open the distance from the track."}, {"q": "A veering wind in the northern hemisphere tells you that the ship is where?", "o": ["In the navigable semicircle", "In the dangerous semicircle", "Directly on the track", "Clear of the system"], "a": 1, "why": "A veering wind indicates the dangerous semicircle; a backing wind indicates the navigable one, and a steady wind with falling pressure means you are near the track."}], "metroute": [{"q": "What is the standing of a shore weather routeing recommendation?", "o": ["A binding instruction from the company", "Advice that the Master may depart from", "An order from the charterer", "A requirement of SOLAS"], "a": 1, "why": "Routeing is advice. The Master may always depart from it for safety and records the reason, under ISM Code Element 5."}, {"q": "What does a routeing recommendation assume about the ship?", "o": ["Her stated performance", "Her cargo value", "Her flag", "Her class notation"], "a": 0, "why": "The advice is calculated from the ship's stated performance curve; a fouled hull or a derated engine makes it wrong."}, {"q": "Why are the routeing messages kept on file?", "o": ["They are required by class", "They support the ship in a speed and consumption or cargo damage claim", "They replace the passage plan", "They are needed for the Official Logbook"], "a": 1, "why": "The messages are evidence of the weather encountered and the advice given, which matters in performance and cargo claims."}], "metwaves": [{"q": "What does significant wave height mean?", "o": ["The highest wave recorded", "The mean of the highest third of the waves", "The mean of all waves", "Twice the swell height"], "a": 1, "why": "Significant wave height is the mean of the highest third; individual waves can reach nearly twice that figure."}, {"q": "What is the fastest way to break a synchronous roll?", "o": ["Ballast the ship down", "Change course or speed to alter the encounter period", "Increase the rudder angle", "Transfer fuel forward"], "a": 1, "why": "Synchronous rolling occurs when the encounter period matches the natural roll period; changing course or speed changes the encounter period at once. MSC.1/Circ.1228 gives the guidance."}, {"q": "Which three factors govern the height to which a wind sea builds?", "o": ["Wind speed, fetch and duration", "Wind speed, air pressure and latitude", "Fetch, salinity and depth", "Duration, tide and current"], "a": 0, "why": "Wave height grows with wind speed, the fetch over which the wind blows, and how long it blows for."}], "metfog": [{"q": "Which type of fog forms when warm moist air flows over a colder sea?", "o": ["Radiation fog", "Advection fog", "Frontal fog", "Steam fog"], "a": 1, "why": "Advection fog is the commonest sea fog and the most persistent, formed by warm moist air cooling over a colder sea surface."}, {"q": "What observation gives the earliest warning of advection fog?", "o": ["The barometer rising", "The air temperature falling towards the dew point over a colder sea", "The wind backing", "The swell increasing"], "a": 1, "why": "When the air temperature approaches the dew point and the sea is colder still, the air will cool to saturation and fog forms."}, {"q": "Where is sea fog most often met?", "o": ["Where a cold current meets warm air", "In the centre of a tropical high", "Downwind of a desert coast", "In the trade wind belt"], "a": 0, "why": "Cold current and warm air together give persistent advection fog — the Grand Banks, the Kuril and northern Japan, and the Benguela coast."}], "metice": [{"q": "Which combination causes dangerous freezing spray?", "o": ["Sea below about 5 degrees Celsius, air well below freezing, wind over 15 knots", "Sea at 10 degrees Celsius with calm air", "Air at 0 degrees Celsius with no wind", "Warm sea with cold rain"], "a": 0, "why": "Freezing spray needs cold sea, air well below freezing and enough wind to throw spray over the ship."}, {"q": "Why is ice on masts and rigging more dangerous than the same weight low down?", "o": ["It is harder to see", "It raises the centre of gravity and reduces GM", "It freezes the radar", "It adds windage only"], "a": 1, "why": "Weight high up raises G, which cuts the const RK = { to:["THIRD OFFICER","to"], so:["SECOND OFFICER","so"], co:["CHIEF OFFICER","co"], ma:["MASTER","ma"] };
let cur = null;

/* ---------- progress store ---------- */
const PK = "ec_kup_prog";
let PR = {};
try { PR = JSON.parse(localStorage.getItem(PK) || "{}") || {}; } catch(e){ PR = {}; }
function save(){ try { localStorage.setItem(PK, JSON.stringify(PR)); } catch(e){} }
function mark(id, patch){ PR[id] = Object.assign({}, PR[id], patch); save(); }
function stateOf(id){ const p = PR[id]; return !p ? "" : (p.best >= 2 ? "pass" : "seen"); }
let RECALL = false;
const $ = i => document.getElementById(i);
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
function b(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); }
function renderList(f){
  const q = (f || "").toLowerCase().trim();
  let h = "";
  for(const r of ["to", "so", "co", "ma"]){
    const items = T.filter(t => t.r === r && (!q || (t.t + " " + t.g + " " + t.lead).toLowerCase().includes(q)));
    if(!items.length) continue;
    const all = T.filter(t => t.r === r);
    const pass = all.filter(t => stateOf(t.id) === "pass").length;
    h += `<div class="rk ${RK[r][1]}">${RK[r][0]} · ${items.length}</div>`;
    h += `<div class="prog"><span>${pass}/${all.length}</span><span class="bar"><i style="width:${Math.round(pass / all.length * 100)}%"></i></span></div>`;
    let g = "";
    for(const t of items){ if(t.g !== g){ g = t.g; h += `<div class="rk" style="color:#7d929c;letter-spacing:.1em;padding:9px 10px 3px">${esc(g)}</div>`; }
      h += `<button class="tp ${cur === t.id ? "on" : ""} ${stateOf(t.id)}" data-id="${t.id}">${esc(t.t)}<i class="dot"></i></button>`; }
  }
  $("list").innerHTML = h || `<div class="empty">No matching topic.</div>`;
  $("list").querySelectorAll(".tp").forEach(e => e.onclick = () => open(e.dataset.id));
  const done = T.filter(t => stateOf(t.id) === "pass").length;
  $("cnt").textContent = done ? done + " / " + T.length + " PASSED" : T.length + " TOPICS";
}

/* ---------- quiz ---------- */
function quizHTML(id){
  const qs = Q[id];
  if(!qs || !qs.length) return "";
  return `<div class="quiz" id="quiz">
    <div class="qh"><b>CHECK YOURSELF</b><span class="sp"></span><span class="sc" id="qsc">0 / ${qs.length}</span></div>
    ${qs.map((x, i) => `<div class="qi" data-q="${i}">
      <p class="qt"><span>${i + 1}</span>${esc(x.q)}</p>
      ${x.o.map((o, j) => `<button class="op" data-q="${i}" data-o="${j}">${esc(o)}</button>`).join("")}
      <div class="slot"></div></div>`).join("")}
    <div class="qdone" id="qdone" style="display:none"></div>
  </div>`;
}
function wireQuiz(id){
  const qs = Q[id]; if(!qs) return;
  const answered = new Array(qs.length).fill(null);
  const box = $("quiz"); if(!box) return;
  box.querySelectorAll(".op").forEach(btn => btn.onclick = () => {
    const qi = +btn.dataset.q, oi = +btn.dataset.o;
    if(answered[qi] !== null) return;
    answered[qi] = oi;
    const q = qs[qi], ok = oi === q.a;
    const row = box.querySelector(`.qi[data-q="${qi}"]`);
    row.querySelectorAll(".op").forEach(b2 => {
      const j = +b2.dataset.o;
      b2.disabled = true;
      if(j === q.a) b2.classList.add("right");
      else if(j === oi) b2.classList.add("wrong");
      if(j === q.a) b2.innerHTML += '<span class="tick">✓</span>';
      else if(j === oi) b2.innerHTML += '<span class="tick">✕</span>';
    });
    row.querySelector(".slot").innerHTML = `<div class="why ${ok ? "" : "no"}">${esc(q.why)}</div>`;
    const score = answered.reduce((n, a, i2) => n + (a === qs[i2].a ? 1 : 0), 0);
    const tried = answered.filter(a => a !== null).length;
    $("qsc").textContent = score + " / " + qs.length;
    if(tried === qs.length){
      const prev = (PR[id] || {}).best || 0;
      mark(id, { best: Math.max(prev, score), tries: ((PR[id] || {}).tries || 0) + 1 });
      const verdict = score === qs.length ? "All correct — this one is solid."
        : score >= 2 ? "Passed. Read the explanations on what you missed."
        : "Below the mark. Read the lesson again and retake it.";
      const d = $("qdone");
      d.style.display = "flex";
      d.innerHTML = `<b>${score} / ${qs.length}</b><span>${verdict}</span><span style="flex:1"></span>
        <button class="again" id="qagain">Retake</button>`;
      $("qagain").onclick = () => { open(id); setTimeout(() => { const q2 = $("quiz"); if(q2) q2.scrollIntoView({ behavior:"smooth", block:"start" }); }, 60); };
      renderList($("q").value);
    }
  });
}
function open(id){
  const t = T.find(x => x.id === id); if(!t) return;
  cur = id; location.hash = id;
  $("doc").innerHTML = `
    <h1>${esc(t.t)}</h1>
    <p class="kick">${RK[t.r][0]} · ${esc(t.g)}</p>
    <p class="lead">${b(t.lead)}</p>
    ${t.ani && ANI[t.ani] ? `<figure class="ani">${ANI[t.ani].svg}<figcaption>${esc(ANI[t.ani].cap)}</figcaption></figure>` : ""}
    <h3>WHAT IT COVERS</h3>
    <div class="${RECALL ? "veil" : ""}"><ul>${t.pts.map(p => `<li>${b(p)}</li>`).join("")}</ul></div>
    ${t.ref ? `<div class="${RECALL ? "veil" : ""}"><div class="ref">${b(t.ref)}</div></div>` : ""}
    <h3>KNOWLEDGE · UNDERSTANDING · PROFICIENCY</h3>
    <div class="kup">
      <div class="kc"><h4>K · KNOWLEDGE</h4><p>${b(t.k)}</p></div>
      <div class="kc u"><h4>U · UNDERSTANDING</h4><p>${b(t.u)}</p></div>
      <div class="kc p"><h4>P · PROFICIENCY</h4><p>${b(t.p)}</p></div>
    </div>
    ${t.err ? `<div class="watch">${b(t.err)}</div>` : ""}
    ${t.stcw ? `<h3>COMPETENCE</h3><p style="font-size:14.3px;color:#cfdde3;max-width:70ch">${b(t.stcw)}</p>` : ""}
    ${quizHTML(t.id)}`;
  $("doc").querySelectorAll(".veil").forEach(v => v.onclick = () => v.classList.add("show"));
  wireQuiz(t.id);
  $("doc").scrollTop = 0; renderList($("q").value);
}
$("q").oninput = () => renderList($("q").value);
$("recall").onclick = () => {
  RECALL = !RECALL;
  $("recall").classList.toggle("on", RECALL);
  if(cur) open(cur);
};
$("reset").onclick = () => {
  if(!confirm("Clear every score and progress mark on this device?")) return;
  PR = {}; save(); renderList($("q").value); if(cur) open(cur);
};
renderList("");
function fromHash(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(h && h !== cur && T.find(x => x.id === h)){ open(h); return true; }
  return false;
}
window.addEventListener("hashchange", fromHash);
if(!fromHash() && T.length) open(T[0].id);
</script></body></html>
