T.push({"id": "reserve", "r": "so", "g": "GMDSS", "t": "Reserve Source of Energy", "lead": "Kapag nawala ang main at emergency power, dapat **tumatakbo pa rin ang radio**. Iyon ang trabaho ng reserve source of energy.", "pts": ["Dapat kayang buhayin ang **VHF at ang MF o HF o Inmarsat** nang sabay.", "**1 oras** kung may emergency source of power ang barko; **6 na oras** kung wala.", "Karaniwan itong **baterya**, at may automatic changeover kapag nawala ang main supply.", "**Lingguhan**: suriin ang kalagayan ng baterya kung walang charger test facility.", "**Buwanan**: secure ang koneksyon, malinis ang terminal, at suriin ang kalagayan ng battery compartment.", "**Taunan**: capacity o discharge test ayon sa maker at sa flag requirement."], "ref": "SOLAS IV/13. Ang pagsusuri ng reserve source of energy ay naitatala sa radio log.", "k": "Sabihin ang kinakailangang oras ng supply para sa iyong barko at kung saan nakalagay ang baterya.", "u": "Ipaliwanag kung bakit 6 na oras kung walang emergency source, at kung bakit hindi sapat ang boltahe lamang bilang sukat ng kalagayan.", "p": "Isagawa ang lingguhan at buwanang pagsusuri, itala ang resulta, at iulat ang anumang mababang reading.", "err": "Ang pag-check ng boltahe lang nang hindi tinitingnan ang kakayahang magdala ng load. Puwedeng mataas ang boltahe pero mabilis bumagsak sa load.", "stcw": "STCW Table A-IV/2 — maintain radio services and equipment."});
T.push({"id": "radiolog", "r": "so", "g": "GMDSS", "t": "Radio Logbook and Records", "lead": "Ang radio log ang **patunay** na ligtas at tama ang operasyon ng radyo. Sa imbestigasyon o PSC, ito ang unang tinitingnan.", "pts": ["Itala ang **distress, urgency at safety** na natanggap o naipadala.", "Itala ang mga **required test**: araw-araw, lingguhan at buwanan.", "Itala ang **pangalan ng GMDSS operator** na nakatalaga at ang certificate number.", "Itala ang **posisyon ng barko** nang hindi bababa sa isang beses kada araw.", "Itala ang anumang **pagkasira at pag-aayos** ng radio equipment.", "Lagdaan ng **Master** at ng operator; itago ayon sa haba ng panahong hinihingi ng flag."], "ref": "SOLAS IV/17 at ITU Radio Regulations. Ang records ay dapat makita sa radio station at nakahanda para sa inspeksyon.", "k": "Ipakita kung saan itinatala ang lingguhang DSC test at kung sinong lumalagda.", "u": "Ipaliwanag kung bakit mahalaga ang araw-araw na posisyon at kung paano ito nakakatulong sa SAR.", "p": "Punan ang radio log para sa isang linggo, kasama ang lahat ng test, at ipasuri sa Master.", "stcw": "STCW Table A-IV/2 — maintain records of radio communications."});
T.push({"id": "gmdsstests", "r": "so", "g": "GMDSS", "t": "GMDSS Daily, Weekly and Monthly Tests", "lead": "Hindi sapat na nakakabit ang radyo. May **nakatakdang pagsusuri** araw-araw, linggo-linggo at buwan-buwan.", "pts": ["**Araw-araw**: internal test ng DSC nang walang radiation; suriin ang printer at ang reserve battery voltage.", "**Lingguhan**: DSC test call sa coast station kung nasa saklaw; suriin ang reserve source of energy kung walang charger test.", "**Buwanan**: on-load battery check, kalagayan ng antenna at insulator, pagsusuri ng EPIRB at SART nang hindi pinapaandar.", "Ang **EPIRB** ay may self-test; huwag itong ilantad sa tubig o hayaang mag-transmit.", "Lahat ng resulta ay **nakatala sa radio log** na may petsa at pirma.", "Ang depekto ay **iniuulat agad** at may alternatibong paraan ng komunikasyon hanggang maayos."], "ref": "SOLAS IV/15.9 at ang flag administration guidance. Ang hindi nagawang lingguhang test ay karaniwang PSC deficiency.", "k": "Ilista ang araw-araw, lingguhan at buwanang test at kung sino ang gumagawa.", "u": "Ipaliwanag kung bakit walang radiation ang daily test at kung bakit hindi puwedeng basta i-activate ang EPIRB para subukan.", "p": "Isagawa ang isang linggong siklo ng test, itala, at maghanda ng defect report para sa isang nabigong test.", "err": "Ang pag-activate ng EPIRB para subukan. Nagdudulot ito ng false distress at pag-iimbestiga ng SAR authority.", "stcw": "STCW Table A-IV/2 — maintain radio services."});
T.push({"id": "navchk", "r": "so", "g": "Bridge Records", "t": "Navigation Equipment Checklists", "lead": "Ang checklist ang nagsisiguro na walang nalilimutan kapag abala o pagod. Hindi ito papel lang, **gabay ito sa paggawa**.", "pts": ["May hiwalay na checklist para sa **pre-departure, pre-arrival, pilotage at heavy weather**.", "Ginagawa ito **habang sinusuri**, hindi pagkatapos.", "Ang bawat item ay may **malinaw na pass o fail**, hindi tsek lang.", "Ang nabigong item ay may **defect entry** at pansamantalang hakbang.", "Nilalagdaan ng **opisyal na gumawa**, at hindi puwedeng ibang tao ang pumirma.", "Nire-review ng **Master** bago ang maniobra."], "ref": "SOLAS V/19 at ang ISM Code Element 7 — procedures for key shipboard operations. Ang checklist ay bahagi ng SMS.", "k": "Sabihin kung aling checklist ang gagamitin sa pagdating, pag-alis, at bago ang pilotage.", "u": "Ipaliwanag kung bakit mapanganib ang pre-filled na checklist at kung paano ito nakikita sa audit.", "p": "Isagawa ang isang pre-departure checklist sa totoong equipment at magsumite ng defect entry para sa isang pumalyang item.", "err": "Pinupunan ang checklist nang nakaupo sa chart table. Ito ang pinakakaraniwang puna sa internal audit.", "stcw": "STCW Table A-II/1 — maintain a safe navigational watch."});
T.push({"id": "prearr", "r": "so", "g": "Bridge Records", "t": "Pre-Arrival and Pre-Departure Tests", "lead": "Bago ang bawat maniobra, sinusubukan ang mga bagay na kailangan mong pagkatiwalaan sa susunod na oras.", "pts": ["**Steering gear**: subukan ang buong lock-to-lock, lahat ng power unit, ang remote at ang emergency steering, **sa loob ng 12 oras bago umalis**.", "**Telegraph at engine order**: subukan ahead at astern kasama ang engine room.", "**Whistle, nav lights, signal lights at searchlight**.", "**Radar, ECDIS, gyro, magnetic compass, echo sounder, speed log at AIS**.", "**Internal communication**: bridge to engine room, bridge to forward at aft station.", "**Bridge clocks at recorders** na magkatugma ang oras."], "ref": "SOLAS V/26 — steering gear testing and drills. Ang emergency steering drill ay isinasagawa nang hindi bababa sa isang beses kada tatlong buwan.", "k": "Ilista ang mga test na kailangan sa loob ng 12 oras bago umalis.", "u": "Ipaliwanag kung bakit kailangang subukan ang lahat ng steering power unit at hindi isa lang.", "p": "Pamunuan ang pre-departure test kasama ang engine room, itala ang oras at resulta, at iulat sa Master.", "stcw": "STCW Table A-II/1 — maintain a safe navigational watch; A-II/2 — control the operation of the ship."});
T.push({"id": "navdefect", "r": "so", "g": "Bridge Records", "t": "Navigation Defect Reporting", "lead": "Ang sirang equipment ay hindi lang problema sa pagkukumpuni. Ito ay **panganib na dapat pamahalaan** habang hindi pa naaayos.", "pts": ["**Itala agad**: ano ang sira, kailan napansin, at ano ang epekto sa paglalayag.", "**Iulat kay Master**, at kung kinakailangan, sa company, flag at class.", "Maglagay ng **mitigation**: halimbawa, dagdag na lookout kapag isang radar lang ang gumagana.", "I-update ang **passage plan** kung naaapektuhan ang kakayahan ng barko.", "Ipasok sa **planned maintenance system** at subaybayan hanggang sarado.", "Kapag naayos, **subukan at itala** bago ibalik sa serbisyo."], "ref": "SOLAS V/16 at ISM Code Element 9 — reports and analysis of non-conformities. Ang pagkasira ng nav equipment ay maaaring kailanganing iulat sa Administration.", "k": "Sabihin kung kanino iniuulat ang isang sirang gyro at kung saan ito itinatala.", "u": "Ipaliwanag kung bakit hindi sapat ang pag-uulat lamang, at kung bakit kailangan ng pansamantalang hakbang.", "p": "Gumawa ng kumpletong defect report para sa isang sirang radar, kasama ang mitigation at ang mungkahing pag-aayos.", "err": "Iniulat pero hindi nabago ang paraan ng pagbabantay. Nananatiling pareho ang panganib hangga't walang dagdag na hakbang.", "stcw": "STCW Table A-II/1 — maintain a safe navigational watch."});
T.push({"id": "cargoplan", "r": "co", "g": "Cargo Operations", "t": "Cargo Planning and Stowage", "lead": "Ang cargo plan ang **kasunduan** ng barko, terminal at charterer kung ano ang ikakarga, saan, at sa anong pagkakasunod.", "pts": ["**Quantity at distribution** bawat hold, nakasalig sa hydrostatic at stability limit.", "**Stress check**: shear force at bending moment sa bawat yugto, hindi lang sa huli.", "**Draught at trim** sa pag-alis, kasama ang air draught para sa tulay at crane.", "**Segregation** ng magkaibang cargo at ng dangerous goods.", "**Deadweight calculation**: bunker, fresh water, ballast, constant at cargo.", "Nilalagdaan ng **Master** bago simulan ang operasyon."], "ref": "SOLAS VI/2 at VI/5, at ang Code of Safe Practice for Cargo Stowage and Securing. Para sa bulk, ang IMSBC Code ang gabay.", "k": "Basahin ang cargo plan at sabihin ang tonnage bawat hold, ang final draught at ang trim.", "u": "Ipaliwanag kung bakit kailangang suriin ang stress sa bawat yugto at hindi lang sa huling kondisyon.", "p": "Gumawa ng loading plan para sa isang tiyak na cargo at i-verify ito sa loading computer, kasama ang bawat intermediate stage.", "err": "Tama ang final condition pero lumampas ang bending moment sa gitna ng pagkarga. Doon nasisira ang barko.", "stcw": "STCW Table A-II/2 — plan and ensure safe loading, stowage, securing, care and unloading of cargoes."});
T.push({"id": "loadseq", "r": "co", "g": "Cargo Operations", "t": "Loading and Discharging Sequence", "lead": "Ang pagkakasunod ang nagdidikta ng **stress, trim at list** habang ginagawa ang operasyon. Hindi lang ang dami ang mahalaga.", "pts": ["Hatiin ang operasyon sa **pours o stages**, bawat isa may target na tonnage.", "Pagsabayin ang **deballasting** sa pagkarga para hindi lumampas ang draught at stress.", "May **check point** sa bawat yugto: draught, list, stress at ullage.", "Nakasulat ang **maximum loading rate** at ang oras ng paghinto.", "May **contingency** kung tumigil ang ballast pump o nagbago ang rate ng terminal.", "Napagkasunduan at **nilagdaan kasama ang terminal** bago magsimula."], "ref": "SOLAS VI/7.3 at ang BLU Code (Code of Practice for the Safe Loading and Unloading of Bulk Carriers). Ang loading plan ay dapat nasa barko at napagkasunduan.", "k": "Basahin ang sequence at sabihin ang tonnage at ballast condition sa bawat yugto.", "u": "Ipaliwanag kung bakit mapanganib ang mabilis na pagkarga sa isang hold habang mabagal ang deballasting.", "p": "Isagawa ang isang sequence sa loading computer, ihinto sa bawat yugto, at ikumpara ang kalkulado at ang aktuwal na draught.", "err": "Hindi inihinto ang pagkarga nang nasa check point. Pagdating sa dulo, huli na para iwasto ang stress.", "stcw": "STCW Table A-II/2 — cargo handling and stowage."});
T.push({"id": "cargotrim", "r": "co", "g": "Cargo Operations", "t": "Cargo Distribution and Trim", "lead": "Ang distribusyon ang nagtatakda ng **trim, stress at stability**. Magkaiba ang pinakamainam para sa bawat isa, kaya may kompromiso.", "pts": ["**Alternate hold loading** ay nagbibigay ng mas mataas na GM pero mas mataas din ang stress.", "**Homogeneous loading** ay mas magaan sa istruktura pero mas mababa ang GM.", "Ang **trim by the stern** ay karaniwang kailangan para sa propeller immersion at steering.", "Ang **hogging at sagging** ay nakikita sa pagkakaiba ng mean draught at ng midship draught.", "Ang **air draught** ay nababawasan kapag mas malalim ang barko.", "Ang **final trim** ay dapat nasa loob ng limitasyon ng trim table at ng loading manual."], "ref": "Ang loading manual at ang approved stability booklet ng barko. Para sa bulk carrier, ang alternate loading ay pinapayagan lamang kung nakasaad sa loading manual.", "k": "Mula sa isang loading condition, sabihin ang trim, ang mean draught at kung hogging o sagging.", "u": "Ipaliwanag kung bakit hindi puwedeng basta gayahin ang alternate loading sa barkong hindi ito pinapayagan.", "p": "Mag-ayos ng distribusyon para makuha ang target na trim nang hindi lumalampas sa stress at GM limit.", "stcw": "STCW Table A-II/2 — stowage and securing; trim and stability."});
T.push({"id": "loadcomp", "r": "co", "g": "Cargo Operations", "t": "Loading Computer and Instrument Use", "lead": "Ang loading computer ay **kasangkapan, hindi hukom**. Tama lang ang sagot nito kung tama ang ipinasok at kung na-verify ito.", "pts": ["**Approved** ito ng class at may takdang **annual test** gamit ang test conditions sa manual.", "Ipasok ang **tunay na bunker, fresh water at constant**, hindi ang nakasanayan.", "Suriin ang **ballast tank sounding** at hindi ang ipinapalagay na laman.", "Ikumpara ang kalkuladong draught sa **binasang draught** sa gilid ng barko.", "Itago ang **printout** ng final condition bilang bahagi ng records.", "Kapag malayo ang pagkakaiba, hanapin ang mali bago ituloy ang pagkarga."], "ref": "SOLAS II-1/5-1 at ang class requirement para sa loading instrument. Ang annual verification gamit ang test conditions ay sapilitan.", "k": "Sabihin kailan huling na-test ang loading computer at saan nakatala ang resulta.", "u": "Ipaliwanag kung bakit ang maliit na mali sa constant o sa ballast ay nagiging malaking mali sa GM.", "p": "Mag-input ng isang buong kondisyon, i-print, at i-verify ito laban sa aktuwal na draught at sa manual calculation.", "err": "Pinaniwalaan ang computer kahit 20 cm ang layo sa binasang draught. May mali sa input, hindi sa barko.", "stcw": "STCW Table A-II/2 — use of stability and stress tables, diagrams and stress calculating equipment."});
T.push({"id": "sscl", "r": "co", "g": "Cargo Operations", "t": "Ship–Shore Safety Checklist", "lead": "Ang Ship–Shore Safety Checklist ang **nakasulat na kasunduan** sa mga bagay na dapat handa bago at habang nagkakarga.", "pts": ["Pinupunan **nang magkasama** ng barko at terminal, hindi padala-dala.", "May mga item na may **R (re-check)** na may takdang pagitan ng pag-uulit.", "Kasama ang **komunikasyon, emergency signal, access at mooring**.", "Kasama ang **oil spill equipment** at scupper plug kung kinakailangan.", "Ang hindi sumasang-ayong item ay **hindi tinatakpan**; ihinto ang operasyon hangga't hindi naaayos.", "Nilalagdaan ng parehong panig at **itinatago** kasama ang cargo records."], "ref": "SOLAS VI/7 at ang BLU Code Appendix. Para sa tanker, ang ISGOTT ang kaukulang checklist.", "k": "Sabihin kung aling item ang may re-check interval at kung gaano kadalas.", "u": "Ipaliwanag kung bakit mali ang pagpirma sa buong checklist bago pa nasuri ang lahat.", "p": "Isagawa ang checklist kasama ang terminal representative at itala ang isang hindi pagsang-ayon at ang naging solusyon.", "stcw": "STCW Table A-II/2 — safe loading and unloading operations."});
T.push({"id": "holdprep", "r": "co", "g": "Cargo Operations", "t": "Cargo Hold Preparation", "lead": "Ang paghahanda ng hold ang madalas na dahilan ng **rejection** sa daungan. Nakadepende ang antas ng linis sa susunod na cargo.", "pts": ["**Grain clean**: walang amoy, walang nakaraang cargo, tuyo at pintado kung kinakailangan.", "**Normal clean**: walang nakaraang cargo, walang kalat, puwede ang maliit na mantsa.", "**Shovel clean at load on top**: ayon sa kasunduan sa charterer.", "Suriin ang **bilge well, strum box at non-return valve**.", "Suriin ang **tanktop, frame, ladder at hatch coaming** kung may dents o corrosion.", "**Hold dry** bago magkarga; sukatin ang moisture kung sensitibo ang cargo."], "ref": "Ang hold cleanliness standard ay nasa charter party, hindi sa SOLAS. Ang pagsusuri ay ginagawa ng draft surveyor o ng independent inspector.", "k": "Sabihin ang antas ng linis na hinihingi ng susunod na cargo at ang pamantayan nito.", "u": "Ipaliwanag kung bakit ang maliit na natirang cargo ay sapat na para tanggihan ang hold sa grain loading.", "p": "Pamunuan ang paglilinis at ang pre-loading inspection, at maghanda ng hold condition report na may litrato.", "err": "Tuyong-tuyo ang hatch pero basa ang bilge. Lumalabas ito sa inspection at nagdudulot ng delay.", "stcw": "STCW Table A-II/2 — care of cargo during the voyage."});
T.push({"id": "cargodam", "r": "co", "g": "Cargo Operations", "t": "Cargo Damage Prevention", "lead": "Karamihan ng claim ay hindi dahil sa bagyo kundi sa **mga bagay na maiiwasan**: tubig, init, amoy at maling pag-aalaga.", "pts": ["**Hatch cover weathertightness**: ultrasonic o hose test bago ang biyahe.", "**Ventilation** ayon sa tamang panuntunan para sa uri ng cargo.", "**Sweat prevention**: subaybayan ang dew point sa loob at labas.", "**Pre-loading at pre-discharge survey**, may litrato at petsa.", "**Mate's receipt remarks** kung may depekto na ang cargo bago ikarga.", "**Letter of protest** kapag may ginawa ang terminal na makakasira sa cargo o sa barko."], "ref": "Hague-Visby Rules Article III — ang carrier ay dapat maging maingat sa pagkarga, pag-aalaga at pagbaba ng cargo. Ang tamang rekord ang panangga ng barko sa claim.", "k": "Pangalanan ang mga pangunahing sanhi ng cargo damage at ang paraan ng pag-iwas sa bawat isa.", "u": "Ipaliwanag kung bakit ang maingat na mate's receipt remark ay mas mahalaga kaysa sa pagtatalo pagkatapos.", "p": "Magsagawa ng pre-loading survey, magtala ng depekto, at maghanda ng letter of protest kung kinakailangan.", "stcw": "STCW Table A-II/2 — care of cargo during the voyage."});
T.push({"id": "cargodoc", "r": "co", "g": "Cargo Operations", "t": "Cargo Documentation", "lead": "Ang dokumento ang **nag-iisang bakas** ng nangyari. Kapag may claim makalipas ang isang taon, ito lang ang matitira.", "pts": ["**Mate's receipt** na may tamang remarks at petsa.", "**Bill of lading**: huwag lagdaan ang clean B/L kung may depekto ang cargo.", "**Cargo manifest at stowage plan** na tugma sa aktuwal.", "**Draft survey report** kung ang dami ay batay sa draught.", "**Statement of facts at time sheet** para sa laytime.", "**Letters of protest** na may petsa, oras at pangalan ng tumanggap."], "ref": "Hague-Visby Rules at ang charter party. Ang pagpirma ng clean bill of lading sa may depektong cargo ay maaaring mag-alis ng proteksyon ng insurer.", "k": "Ilista ang dokumentong ihahanda sa pag-alis at kung sino ang pumipirma.", "u": "Ipaliwanag ang panganib ng pagpirma ng clean B/L kapalit ng letter of indemnity.", "p": "Maghanda ng kumpletong set ng cargo document para sa isang biyahe at ipasuri sa Master.", "err": "Pinirmahan ang clean B/L dahil nagmamadali ang agent. Ang barko ang mananagot sa claim pagkatapos.", "stcw": "STCW Table A-II/2 — cargo documentation."});
T.push({"id": "imsbc", "r": "co", "g": "Bulk Cargoes", "t": "IMSBC Code Basics", "lead": "Ang IMSBC Code ang **batas** sa pagdadala ng solid bulk cargo. Dito nakasulat ang panganib at ang hinihinging pag-iingat ng bawat cargo.", "pts": ["May **individual schedule** ang bawat cargo, naka-alpabeto ayon sa Bulk Cargo Shipping Name.", "Ang **shipper ay dapat magbigay** ng cargo declaration bago magkarga.", "Nakasaad sa schedule ang **angle of repose, stowage factor, hazard at ventilation**.", "May **loading, carriage at discharge precautions** ang bawat schedule.", "Ang cargo na **wala sa Code** ay kailangan ng tripartite agreement at pahintulot ng flag.", "May **emergency schedule** para sa sunog at sa pagkalasing ng hangin."], "ref": "SOLAS VI/1 at ang IMSBC Code, sapilitan mula 2011. Ang cargo declaration ay kinakailangan bago magsimula ang pagkarga.", "k": "Hanapin ang schedule ng isang cargo at sabihin ang grupo, stowage factor at hazard nito.", "u": "Ipaliwanag kung bakit hindi puwedeng tanggapin ang cargo na walang deklarasyon ng shipper.", "p": "Suriin ang isang cargo declaration, ihambing sa schedule, at ilista ang mga kinakailangang hakbang bago magkarga.", "stcw": "STCW Table A-II/2 — carriage of dangerous and hazardous cargoes."});
T.push({"id": "groups", "r": "co", "g": "Bulk Cargoes", "t": "Group A, B and C Cargoes", "lead": "Tatlong grupo ang solid bulk cargo sa IMSBC Code, at **magkaiba ang panganib** ng bawat isa.", "pts": ["**Group A**: maaaring maging likido (liquefy) kung lumampas ang moisture sa TML. Halimbawa: iron ore fines, nickel ore, concentrates.", "**Group B**: may chemical hazard. Halimbawa: coal (methane at self-heating), DRI (hydrogen), seed cake.", "**Group C**: hindi lumilikido at walang chemical hazard, pero may ibang panganib pa rin gaya ng shifting at dust.", "May cargo na **A at B** nang sabay, kaya dalawang hanay ng pag-iingat ang kailangan.", "Ang **grupo ang nagdidikta** ng kinakailangang certificate at monitoring.", "Ang grupo ay nakasulat sa **schedule**, hindi hinuhulaan."], "ref": "IMSBC Code Section 1.7 at ang individual schedules. Ang Group A ay nangangailangan ng certificate ng moisture content at ng TML.", "k": "Sabihin ang grupo ng tatlong karaniwang cargo at ang pangunahing panganib ng bawat isa.", "u": "Ipaliwanag kung bakit ang isang cargo ay maaaring Group A at B nang sabay, at ano ang ibig sabihin niyon sa operasyon.", "p": "Mula sa cargo declaration, tukuyin ang grupo at ilista ang mga certificate at monitoring na kailangan.", "stcw": "STCW Table A-II/2 — carriage of bulk cargoes."});
T.push({"id": "tml", "r": "co", "g": "Bulk Cargoes", "t": "TML and Moisture Content", "lead": "Para sa Group A cargo, isang bilang ang naghahati sa ligtas at delikado: ang **moisture content laban sa TML**.", "pts": ["**TML** (Transportable Moisture Limit) ay 90 % ng flow moisture point.", "Ang **actual moisture content** ay dapat **mas mababa** sa TML sa oras ng pagkarga.", "Ang **TML certificate** ay may bisa na hanggang anim na buwan; ang **moisture certificate** ay hanggang pitong araw, at mas maikli kung umulan.", "Ang **can test** ay panimulang pagsubok lamang, hindi kapalit ng laboratory test.", "Kapag umulan habang nasa stockpile, **bago ang sampling** ang kailangan.", "Kapag may duda, **ihinto ang pagkarga** at kumonsulta sa Master at sa company."], "ref": "IMSBC Code Section 4 at 7. Ang pagkarga ng Group A cargo na lampas sa TML ay isa sa pangunahing sanhi ng pagkalubog ng bulk carrier.", "k": "Sabihin ang ibig sabihin ng TML at FMP at kung gaano katagal may bisa ang bawat certificate.", "u": "Ipaliwanag kung bakit mapanganib ang liquefaction kahit mukhang tuyo ang ibabaw ng cargo.", "p": "Isagawa ang can test sa isang sample, itala ang resulta, at maghanda ng ulat kung ito ay nabigo.", "err": "Tinanggap ang certificate na dalawang linggo nang luma matapos ang malakas na ulan. Hindi na ito totoo.", "stcw": "STCW Table A-II/2 — precautions for cargoes which may liquefy."});
T.push({"id": "liquefy", "r": "co", "g": "Bulk Cargoes", "t": "Cargo Liquefaction Risk", "lead": "Ang liquefaction ay kapag ang basang cargo ay **kumikilos na parang likido** dahil sa vibration. Nagiging free surface ito at dumudulas ang barko.", "pts": ["Nangyayari sa **Group A** cargo na lampas sa TML ang moisture.", "Ang **vibration at rolling** ang nagdudulot; hindi ito nakikita sa simula.", "Ang unang senyales ay **tubig sa ibabaw** at ang cargo na nagiging patag.", "Ang epekto ay **free surface at wet base**, kaya mabilis mawala ang stability.", "Ang barko ay maaaring **bumaligtad nang walang babala** matapos ang matinding list.", "Ang tanging ligtas na hakbang ay **huwag ikarga** ang cargo na lampas sa TML."], "ref": "IMSBC Code Section 7. Ang specially constructed o fitted cargo ship ay ang tanging eksepsiyon, at ito ay nangangailangan ng pahintulot ng Administration.", "k": "Ilarawan ang mga senyales ng liquefaction at ang cargo na madalas apektado.", "u": "Ipaliwanag kung bakit hindi kayang ayusin ng trimming o ng ballast ang liquefaction kapag nagsimula na.", "p": "Sa inspeksyon ng hold habang nasa biyahe, kilalanin ang senyales at ihanda ang ulat at ang mungkahing aksyon sa Master.", "stcw": "STCW Table A-II/2 — cargoes which may liquefy."});
T.push({"id": "coaldri", "r": "co", "g": "Bulk Cargoes", "t": "Coal, DRI and Concentrates", "lead": "Tatlong cargo na madalas dalhin ng bulk carrier, at **tatlong magkaibang panganib**.", "pts": ["**Coal**: naglalabas ng methane at maaaring mag-self-heat. Kailangan ng surface ventilation lamang, hindi through ventilation.", "Sukatin ang **methane, oxygen at carbon monoxide** araw-araw sa coal.", "Ang **tumataas na CO** ay senyales ng self-heating; isara ang hatch at huwag mag-ventilate.", "**DRI**: nagri-react sa tubig at naglalabas ng hydrogen. Kailangan ng inert gas sa ilang uri.", "**Concentrates**: Group A, kaya TML at moisture ang pangunahing alalahanin.", "Lahat ng ito ay may **sariling schedule** sa IMSBC Code na dapat sundin nang eksakto."], "ref": "IMSBC Code, mga schedule para sa COAL at DIRECT REDUCED IRON. Ang gas monitoring ng coal ay araw-araw at naitatala.", "k": "Sabihin ang pangunahing panganib ng coal, DRI at concentrates at ang kaukulang monitoring.", "u": "Ipaliwanag kung bakit ang pag-ventilate ng coal na nag-se-self-heat ay nagpapalala sa sunog.", "p": "Magsagawa ng araw-araw na gas monitoring sa coal, itala, at sabihin ang aksyon kapag tumaas ang CO.", "err": "Binuksan ang hatch para palamigin ang umiinit na coal. Nakadagdag ito ng oxygen at lumala ang init.", "stcw": "STCW Table A-II/2 — carriage of hazardous bulk cargoes."});
T.push({"id": "vent3c", "r": "co", "g": "Bulk Cargoes", "t": "Cargo Ventilation · the 3-Degree Rule", "lead": "Ang **3-degree rule** ay simpleng panuntunan para sa cargo na may sariling halumigmig, gaya ng butil at kahoy.", "pts": ["Ikumpara ang **average cargo temperature noong ikinarga** sa **kasalukuyang outside air temperature**.", "Kung ang labas ay **3 °C o higit na mas malamig** kaysa sa cargo noong ikinarga, **mag-ventilate**.", "Kung mas mainit ang labas, **huwag mag-ventilate**, dahil magdadala ito ng halumigmig papasok.", "Itala ang **temperatura at ang desisyon** sa bawat pagsusuri.", "Ihinto ang ventilation sa **ulan, spray at malakas na alon**.", "Hindi ito ginagamit sa cargo na ipinagbabawal ang ventilation, gaya ng coal na nag-se-self-heat."], "ref": "Ang 3-degree rule at ang dew point rule ay nasa IMSBC Code Appendix at sa P&I club guidance. Ang pagpili ng panuntunan ay depende sa uri ng cargo.", "k": "Sabihin kailan dapat mag-ventilate gamit ang 3-degree rule.", "u": "Ipaliwanag kung bakit magdudulot ng ship sweat ang maling desisyon.", "p": "Mag-log ng isang linggo ng ventilation decision gamit ang rule, at ipaliwanag ang bawat desisyon.", "stcw": "STCW Table A-II/2 — care of cargo during the voyage."});
T.push({"id": "ventdp", "r": "co", "g": "Bulk Cargoes", "t": "Cargo Ventilation · the Dew Point Rule", "lead": "Ang dew point rule ay mas tiyak. Ikinukumpara nito ang **dew point sa loob ng hold** at sa **labas**.", "pts": ["Kung ang **dew point sa labas ay mas mababa** kaysa sa loob, **mag-ventilate**.", "Kung mas mataas ang labas, **huwag**, dahil bubuo ng sweat sa cargo o sa bodega.", "**Ship sweat**: namumuo sa malamig na istruktura kapag mainit at basa ang hangin sa loob.", "**Cargo sweat**: namumuo sa malamig na cargo kapag pinasok ng mainit at basang hangin.", "Kailangan ng **whirling hygrometer** o kalibradong metro sa loob at labas.", "Itala ang **dry bulb, wet bulb, dew point at desisyon** sa bawat pagsusuri."], "ref": "IMSBC Code Appendix at ang P&I club carriage advice. Ang ventilation record ay karaniwang hinihingi sa cargo claim.", "k": "Kalkulahin ang dew point mula sa dry at wet bulb reading gamit ang table.", "u": "Ipaliwanag ang pagkakaiba ng ship sweat at cargo sweat at kung alin ang mas mapanganib para sa bawat cargo.", "p": "Mag-log ng isang biyahe ng dew point reading at ventilation decision, at ipaliwanag ang isang araw na hindi nag-ventilate.", "err": "Nag-ventilate dahil maaraw at maganda ang panahon. Kung mataas ang dew point sa labas, sinira nito ang cargo.", "stcw": "STCW Table A-II/2 — care of cargo during the voyage."});
T.push({"id": "gasfum", "r": "co", "g": "Bulk Cargoes", "t": "Gas Monitoring and Fumigation", "lead": "May cargo na naglalabas ng gas at may cargo na nilalagyan ng lason. **Pareho silang nakakamatay** kung walang tamang pamamaraan.", "pts": ["**Gas monitoring**: oxygen, methane, carbon monoxide at hydrogen sulphide ayon sa cargo.", "Gumamit ng **fixed sampling point**; huwag magbukas ng hatch para lang sumukat.", "**Calibrate** ang metro bago gamitin at itala ang resulta.", "**Fumigation in transit** ay may nakasulat na plano, warning sign at nakatalagang tao.", "Ang **fumigant** ay karaniwang phosphine; walang amoy sa mababang konsentrasyon pero nakakamatay.", "Bawal ang **enclosed space entry** hangga't walang gas-free certificate at permit."], "ref": "IMO MSC.1/Circ.1264 — Recommendations on the safe use of pesticides in ships. Ang fumigated hold ay itinuturing na enclosed space na may lason.", "k": "Sabihin kung anong gas ang susukatin para sa coal at para sa DRI, at gaano kadalas.", "u": "Ipaliwanag kung bakit mas mapanganib ang fumigant kaysa sa inaakala, at kung bakit hindi sapat ang amoy bilang babala.", "p": "Magsagawa ng gas monitoring round, itala, at pamunuan ang pagpaplano ng isang fumigation in transit.", "err": "Pumasok sa hold na may natitirang fumigant dahil 'maliwanag at mukhang malinis'. Ito ay isa sa pinakakaraniwang sanhi ng pagkamatay sa barko.", "stcw": "STCW Table A-II/2 — carriage of dangerous and hazardous cargoes."});
T.push({"id": "trimlist", "r": "co", "g": "Stability and Structure", "t": "Trim and List Correction", "lead": "Ang list ay **pahalang** na kiling at ang trim ay **pahaba**. Magkaiba ang sanhi at magkaiba ang lunas.", "pts": ["Ang list ay dahil sa **G na nasa gilid**, o sa **negative GM** na nagdudulot ng loll.", "Unahin: alamin kung **list o loll** bago gumalaw. Magkasalungat ang tamang aksyon.", "Sa list, **ilipat o magdagdag ng timbang sa kabilang panig**, dahan-dahan at isa-isa.", "Sa loll, **huwag** magdagdag sa mataas na panig; **punuin muna ang slack tank** para mabawasan ang free surface.", "Ang trim ay inaayos sa pamamagitan ng **ballast sa fore o aft peak**, isinasaalang-alang ang MCTC at LCF.", "Suriin ang **stress** pagkatapos ng bawat paglipat, hindi lang ang kiling."], "ref": "IMO Intact Stability Code 2008. Ang negative GM ay hindi pinahihintulutan sa anumang kondisyon ng paglalayag.", "k": "Sabihin ang pagkakaiba ng list at loll at kung paano ito makikilala sa ugali ng barko.", "u": "Ipaliwanag kung bakit mapanganib ang pag-ballast sa mataas na panig kapag ang barko ay naka-loll.", "p": "Mag-ayos ng list sa loading computer at ipakita ang epekto sa GM, stress at draught sa bawat hakbang.", "err": "Binalastre ang mataas na panig ng barkong naka-loll. Dumulas ito papunta sa kabila nang mas malaki at delikado.", "stcw": "STCW Table A-II/2 — maintain seaworthiness of the ship."});
T.push({"id": "damstab", "r": "co", "g": "Stability and Structure", "t": "Damage Stability Awareness", "lead": "Ang damage stability ay kung **mananatiling nakalutang at tuwid** ang barko kapag pumasok ang tubig sa isa o higit pang compartment.", "pts": ["**Permeability**: hindi lahat ng espasyo ay puno ng tubig; iba-iba ang porsiyento ayon sa gamit.", "**Subdivision at watertight door**: ang bawat bukas na pinto ay nagpapalaki ng apektadong espasyo.", "Ang barko ay may **damage stability booklet** na nagsasaad ng pinahihintulutang kondisyon.", "Ang **cross-flooding** ay sinadyang pagpapantay para bawasan ang list.", "Ang **downflooding angle** ang hangganan bago pumasok ang tubig sa ibang espasyo.", "Sa aktuwal na damage, **unang gawain ay tukuyin kung aling compartment** at huwag magmadaling mag-ballast."], "ref": "SOLAS Chapter II-1 Parts B-1 at B-2. Para sa bulk carrier, ang SOLAS XII ay may karagdagang kailangan sa hold flooding.", "k": "Hanapin sa booklet ang pinahihintulutang damage condition ng iyong barko.", "u": "Ipaliwanag kung bakit mas mapanganib ang nakabukas na watertight door kaysa sa inaakala.", "p": "Mula sa isang flooding scenario, tukuyin ang apektadong compartment at ang inaasahang list at draught.", "stcw": "STCW Table A-II/2 — maintain seaworthiness; damage control."});
T.push({"id": "hwballast", "r": "co", "g": "Stability and Structure", "t": "Heavy Weather Ballasting", "lead": "Sa masamang panahon, ang layunin ay **sapat na GM, mababang stress at malalim na propeller**, nang hindi nagiging stiff ang barko.", "pts": ["Ang **masyadong mataas na GM** ay nagdudulot ng mabilis at matigas na roll na nakakasira ng cargo at istruktura.", "Ang **masyadong mababang GM** ay nagdudulot ng mabagal na roll at panganib ng synchronous rolling.", "**Punuin o iwanang walang laman** ang tangke; iwasan ang slack para walang free surface.", "Isaalang-alang ang **slamming at propeller emergence** kung masyadong magaan sa unahan.", "Suriin ang **stress** kapag nag-ballast habang may cargo.", "Ang pagbabago ng ballast sa gitna ng bagyo ay **mapanganib**; gawin ito bago dumating."], "ref": "IMO MSC.1/Circ.1228 — Revised guidance to the master for avoiding dangerous situations in adverse weather and sea conditions.", "k": "Sabihin ang rolling period ng barko at kung ano ang ibig sabihin nito tungkol sa GM.", "u": "Ipaliwanag kung bakit hindi laging mas mabuti ang mas mataas na GM.", "p": "Maghanda ng heavy weather ballast plan bago ang isang bagyo at ipaliwanag ang bawat pagbabago sa Master.", "err": "Nag-ballast nang nasa gitna na ng bagyo. Ang paglipat ng tubig ay nagdagdag ng free surface sa pinakamasamang sandali.", "stcw": "STCW Table A-II/2 — maintain seaworthiness."});
T.push({"id": "grain", "r": "co", "g": "Stability and Structure", "t": "Grain Stability Basics", "lead": "Ang butil ay **dumudulas**. Kapag kumiling ang barko, lumilipat ang ibabaw ng cargo at hindi na ito bumabalik.", "pts": ["Ang barko ay dapat may **document of authorization** para magdala ng grain.", "Ang kalkulasyon ay gumagamit ng **volumetric heeling moment** mula sa grain loading booklet.", "Tatlong pamantayan: **GM hindi bababa sa 0.30 m**, **heel hindi lalampas sa 12° o sa deck immersion**, at **residual area hindi bababa sa 0.075 m-radian**.", "Ang **filled compartment, trimmed** ay may mas maliit na heeling moment kaysa sa partly filled.", "Ang **untrimmed ends** ay may mas malaking void at mas malaking paglipat.", "Ang grain loading plan ay **isinusumite at inaaprubahan** bago magkarga."], "ref": "SOLAS VI/9 at ang International Grain Code. Ang document of authorization ay dapat nasa barko.", "k": "Sabihin ang tatlong pamantayan ng grain stability at ang limitasyon ng bawat isa.", "u": "Ipaliwanag kung bakit mas malaki ang panganib ng partly filled compartment kaysa sa puno at trimmed.", "p": "Kalkulahin ang grain heeling moment at ang resultang angle of heel para sa isang kondisyon at ihambing sa limitasyon.", "stcw": "STCW Table A-II/2 — grain loading and the International Grain Code."});
T.push({"id": "hatch", "r": "co", "g": "Ship Maintenance", "t": "Hatch Covers and Weathertight Integrity", "lead": "Ang hatch cover ang **pangunahing depensa** ng cargo laban sa dagat. Karamihan ng wet damage claim ay dito nagsisimula.", "pts": ["**Rubber packing**: suriin ang permanent set, hiwa at tigas; ang tamang compression ay karaniwang 3 hanggang 5 mm.", "**Compression bar**: tuwid, walang kalawang, at walang baluktot na bahagi.", "**Drain channel at non-return valve**: malinis at bukas.", "**Cleats at wedges**: kumpleto, nakaayos at may tamang higpit.", "Pagsubok: **hose test** kung walang cargo, **ultrasonic test** kung may cargo o kung mas tiyak ang kailangan.", "**Chalk test** ay para sa pagtatama ng upo lamang, hindi patunay ng weathertightness."], "ref": "SOLAS II-1/11 at Load Line Convention Regulation 16. Ang ultrasonic tightness test ay tinatanggap ng karamihan ng class at P&I club.", "k": "Pangalanan ang bahagi ng hatch cover sealing system at ang tungkulin ng bawat isa.", "u": "Ipaliwanag kung bakit hindi sapat ang chalk test bilang patunay na hindi papasok ang tubig.", "p": "Magsagawa ng ultrasonic test sa isang hatch, basahin ang resulta, at maghanda ng repair list.", "err": "Hinigpitan ang cleats para tumigil ang tagas. Ang sobrang higpit ay sumisira sa packing at lumalala ang tagas.", "stcw": "STCW Table A-II/2 — maintain seaworthiness of the ship."});
T.push({"id": "ventair", "r": "co", "g": "Ship Maintenance", "t": "Ventilators, Air Pipes and Closing Devices", "lead": "Ang mga butas sa deck ang **pinaka-malamang na pasukan ng tubig**. Maliliit sila pero sila ang nagpapalubog ng barko.", "pts": ["**Air pipe head**: suriin ang float ball, ang gauze at ang katawan kung may kalawang o butas.", "**Ventilator**: ang closing appliance ay dapat kumpleto at kayang isara nang mahigpit.", "**Sounding pipe cap**: may tamang gasket at laging nakasara maliban kung ginagamit.", "**Weathertight door at hatch**: suriin ang gasket, dog at hinge.", "**Scupper at freeing port**: malinis at malayang gumagalaw.", "Lahat ng ito ay nasa **load line survey** at madalas puntahan ng PSC."], "ref": "Load Line Convention Regulations 17 hanggang 21 at IACS UR P3. Ang sira o nawawalang air pipe head ay karaniwang detainable deficiency.", "k": "Ilista ang mga opening na dapat suriin bago umalis at ang kalagayan nilang hinahanap.", "u": "Ipaliwanag kung paano nagdudulot ng progressive flooding ang isang sirang air pipe head sa masamang panahon.", "p": "Magsagawa ng weather deck closing appliance inspection at maghanda ng ulat na may litrato at mungkahing pagkukumpuni.", "stcw": "STCW Table A-II/2 — maintain seaworthiness."});
T.push({"id": "tankinsp", "r": "co", "g": "Ship Maintenance", "t": "Ballast Tank and Void Inspection", "lead": "Ang loob ng tangke ang **hindi nakikita** pero dito nagsisimula ang pinakamalalang problema ng istruktura.", "pts": ["Ito ay **enclosed space entry**; kailangan ng permit, gas test at standby man.", "Hanapin ang **coating breakdown**: porsiyento ng saklaw at kung saan matindi.", "Hanapin ang **pitting**: lalim at dalas; may limitasyon ang class.", "Suriin ang **weld seam, bracket at longitudinal** kung may bitak.", "Suriin ang **anode**: natitirang laki at kung nakakabit pa.", "I-record na may **larawan at sketch** at ipasok sa planned maintenance system."], "ref": "SOLAS II-1/3-6 — access to and within spaces; at ang Enhanced Survey Programme (ESP) para sa bulk carrier at tanker.", "k": "Sabihin ang hakbang bago pumasok sa isang ballast tank at kung ano ang susukatin.", "u": "Ipaliwanag kung bakit ang coating breakdown ay nagiging structural problem at hindi lang cosmetic.", "p": "Pamunuan ang isang tank inspection kasama ang permit, at magsumite ng ulat na may lokasyon ng bawat depekto.", "err": "Pumasok nang hindi sinusukat ang oxygen dahil 'bukas naman ang manhole nang magdamag'. Pinakakaraniwang sanhi ng pagkamatay sa barko.", "stcw": "STCW Table A-II/2 — maintain seaworthiness; enclosed space entry."});
T.push({"id": "corrosion", "r": "co", "g": "Ship Maintenance", "t": "Corrosion and Coating Condition", "lead": "Ang kalawang ay hindi lang pangit. Binabawasan nito ang **kapal ng bakal**, at may hangganan iyon.", "pts": ["**General corrosion**: pantay na pagnipis sa malawak na bahagi.", "**Grooving corrosion**: sa gilid ng weld at sa tagpo ng bakal.", "**Pitting**: malalim at maliit; mapanganib sa tanktop.", "**Coating condition**: GOOD, FAIR o POOR ayon sa ESP; ang POOR ay nagdadagdag ng survey requirement.", "**Anode** at impressed current ang panangga sa loob ng tangke.", "Ang **thickness measurement** ay ginagawa ng approved firm at inihahambing sa renewal criteria."], "ref": "IACS at ang Enhanced Survey Programme. Ang substantial corrosion ay karaniwang 75 hanggang 100 % ng allowable diminution.", "k": "Sabihin ang pagkakaiba ng GOOD, FAIR at POOR coating condition.", "u": "Ipaliwanag kung bakit mas mabilis lumala ang grooving corrosion kaysa sa general corrosion.", "p": "Magsagawa ng coating survey sa isang tangke, ilarawan ang kalagayan, at maghanda ng mungkahing maintenance plan.", "stcw": "STCW Table A-II/2 — maintain seaworthiness."});
T.push({"id": "mooring", "r": "co", "g": "Deck Equipment", "t": "Mooring Equipment and Ropes", "lead": "Ang mooring ay isa sa **pinaka-mapanganib** na gawain sa deck. Karamihan ng malubhang aksidente ay dahil sa pumutok na lubid.", "pts": ["**Snap-back zone**: markahan ang deck at ipaliwanag sa lahat; huwag tumayo sa linya ng lubid.", "**Line management plan**: bawat lubid ay may talaan ng edad, gamit at kondisyon.", "**MBL, SWL at LDBF**: alamin ang kakayahan ng bawat lubid at ng bitt.", "Suriin ang **winch brake holding capacity**; i-test ayon sa takdang panahon.", "Iwasan ang **mixed moorings** ng iba't ibang materyal sa parehong serbisyo.", "**Tails at shackles** ay may sariling buhay at palitan."], "ref": "SOLAS II-1/3-8 at MSC.1/Circ.1620 — Guidelines for inspection and maintenance of mooring equipment. Ang mooring arrangement plan ay sapilitan sa mga bagong barko.", "k": "Ipakita sa deck kung saan ang snap-back zone at sabihin ang MBL ng isang lubid.", "u": "Ipaliwanag kung bakit mapanganib ang paghahalo ng bagong at lumang lubid sa parehong serbisyo.", "p": "Pamunuan ang isang mooring operation, magsagawa ng toolbox talk, at magsumite ng line inspection record.", "err": "Tumayo sa loob ng snap-back zone dahil 'maikli lang ang gagawin'. Ang pumutok na lubid ay mas mabilis kaysa sa reaksyon ng tao.", "stcw": "STCW Table A-II/2 — mooring and anchoring operations."});
T.push({"id": "anchorgear", "r": "co", "g": "Deck Equipment", "t": "Anchors and Windlass", "lead": "Ang anchor gear ay hindi para sa lahat ng kondisyon. May **hangganan** ito, at ang pag-alam niyon ang nagliligtas sa barko.", "pts": ["Ang **anchoring equipment** ay idinisenyo para sa **mababaw na tubig at katamtamang panahon**, hindi para sa bagyo.", "**Equipment number** ang batayan ng laki ng anchor at haba ng chain.", "Suriin ang **brake lining, hydraulic system at bitter end release**.", "Ang **chain** ay sinusukat ang pagkanipis at ina-ranggo tuwing drydock.", "**Walk back** kapag malalim; huwag basta i-let go nang may gravity sa malalim na tubig.", "Ang **chain stopper** ang nagdadala ng load habang nakaangkla, hindi ang windlass brake."], "ref": "IACS UR A1 at A2 — anchoring equipment. Ang kagamitan ay para sa temporary mooring sa harbour o protektadong lugar.", "k": "Sabihin ang laki ng anchor at ang bilang ng shackle ng barko, at kung saan nakatala.", "u": "Ipaliwanag kung bakit nasisira ang windlass kapag ito ang nagdadala ng load sa halip na ang chain stopper.", "p": "Pamunuan ang anchoring operation, kasama ang walk back sa malalim na tubig at ang tamang pagbabantay ng cable.", "stcw": "STCW Table A-II/2 — mooring and anchoring."});
T.push({"id": "cranes", "r": "co", "g": "Deck Equipment", "t": "Cranes, Derricks and Lifting Gear", "lead": "Ang lifting gear ay may **certificate at register**. Walang sertipiko, walang pag-aangat.", "pts": ["**Register of lifting appliances** at ang kaukulang certificate para sa bawat gamit.", "**Annual thorough examination** at **five-yearly load test** ayon sa ILO at class.", "Suriin ang **wire rope**: putol na strand, kink, kalawang at pagkanipis.", "Suriin ang **sheave, brake, limit switch at emergency stop** bago gamitin.", "Ang **SWL** ay nakamarka at hindi lalampasan; isaalang-alang ang radius.", "**Walang taong papasok sa ilalim** ng nakataas na load."], "ref": "ILO Convention 152 at ang Code of Safe Working Practices. Ang cargo gear register ay madalas tinitingnan ng PSC.", "k": "Hanapin sa register ang huling test ng isang crane at ang SWL nito.", "u": "Ipaliwanag kung bakit nagbabago ang SWL ayon sa radius ng boom.", "p": "Magsagawa ng pre-use inspection ng isang crane at pamunuan ang isang lifting operation na may toolbox talk.", "stcw": "STCW Table A-II/2 — cargo handling equipment."});
T.push({"id": "pms", "r": "co", "g": "Deck Equipment", "t": "Planned Maintenance and Defect Control", "lead": "Ang PMS ang nagpapatunay na ang barko ay **inaalagaan ayon sa plano**, hindi kapag nasira na.", "pts": ["Bawat kagamitan ay may **job, interval at responsibleng tao**.", "Ang **overdue job** ay dapat may paliwanag at bagong petsa, hindi basta binubura.", "Ang **critical equipment** ay may hiwalay na listahan at mas mahigpit na pagsubaybay.", "Ang **spare parts** ay sinusubaybayan laban sa minimum level.", "Ang **defect** ay may ticket mula sa pagkakatuklas hanggang sa pagsasara.", "Ang **record** ay katibayan sa PSC, class at vetting."], "ref": "ISM Code Element 10 — maintenance of the ship and equipment. Ang critical equipment ay dapat natukoy at may regular na testing.", "k": "Ipakita sa PMS ang susunod na due job para sa isang kagamitan at ang huling nagawa.", "u": "Ipaliwanag kung bakit mas malaking problema ang maraming overdue kaysa sa isang sirang makina.", "p": "Mag-close ng isang PMS job na may ebidensya at magbukas ng defect ticket na may mitigation.", "stcw": "STCW Table A-II/2 — monitor and control compliance with legislative requirements."});
T.push({"id": "bwmp", "r": "co", "g": "Environment", "t": "Ballast Water Management Plan", "lead": "Ang ballast water ay nagdadala ng **buhay na organismo** sa ibang dagat. May batas na tungkol dito at may rekord na dapat itago.", "pts": ["Ang barko ay may **approved Ballast Water Management Plan** at **Ballast Water Record Book**.", "**D-1 standard**: ballast water exchange, hindi bababa sa 95 % volumetric.", "**D-2 standard**: treatment sa pamamagitan ng BWTS, may limitasyon sa bilang ng organismo.", "May **International Ballast Water Management Certificate** ang barko.", "Ang **bawat operasyon** ay itinatala: petsa, posisyon, dami at paraan.", "May mga **port na may sariling dagdag na patakaran**, kaya suriin bago dumating."], "ref": "IMO Ballast Water Management Convention, ipinatupad noong 2017. Mula 2024, karamihan ng barko ay nasa D-2 standard na.", "k": "Ipakita ang Ballast Water Record Book at ang huling entry.", "u": "Ipaliwanag ang pagkakaiba ng D-1 at D-2 at kung bakit lumipat ang mundo sa D-2.", "p": "Magtala ng isang buong ballast operation sa record book at i-verify laban sa plano.", "stcw": "STCW Table A-II/2 — monitor and control compliance with legislative requirements."});
T.push({"id": "bwts", "r": "co", "g": "Environment", "t": "BWTS Operation and Records", "lead": "Ang BWTS ay makinang nagpapatay ng organismo sa ballast water. Dapat itong **gamitin at itala**, hindi lang naka-install.", "pts": ["Dalawang karaniwang uri: **UV** at **electrochlorination**.", "May **operating limit**: turbidity, temperatura, salinity at flow rate.", "Ang **by-pass** ay pinapayagan lamang sa emergency at dapat **itala at iulat**.", "Suriin ang **filter backwash, sensor at alarm** bago gamitin.", "Ang **Total Residual Oxidant** ay sinusukat sa ilang sistema bago mag-discharge.", "Ang **contingency measure** ay nakasulat kapag nabigo ang sistema."], "ref": "BWM Convention Regulation D-2 at BWMS Code. Ang MEPC.1/Circ.862 ay naglalaman ng contingency measures kapag nabigo ang sistema.", "k": "Sabihin ang uri ng BWTS ng barko at ang operating limit nito.", "u": "Ipaliwanag kung bakit hindi gumagana ang UV system sa maputik na tubig at ano ang gagawin.", "p": "Patakbuhin ang BWTS sa isang ballast operation, itala ang parameter, at maghanda ng ulat kapag nag-alarm.", "err": "Na-by-pass ang sistema nang hindi iniulat. Ito ay malubhang paglabag na may malaking multa.", "stcw": "STCW Table A-II/2 — pollution prevention."});
T.push({"id": "bwexch", "r": "co", "g": "Environment", "t": "Ballast Exchange and Contingency", "lead": "Kapag hindi magamit ang treatment system, may **pamalit na paraan** at may paraan ng pag-uulat.", "pts": ["**Sequential method**: ubusin ang tangke bago punuin muli; pinakamalinis pero may stress at stability effect.", "**Flow-through**: palitan habang umaapaw; kailangan ng tatlong beses ng volume.", "**Dilution**: papasok sa itaas, lalabas sa ilalim nang sabay.", "Gawin ito **200 nm mula sa pinakamalapit na lupa at 200 m ang lalim** kung maaari.", "Suriin ang **stress, stability at sloshing** sa bawat hakbang.", "Kapag nabigo ang BWTS, **iulat agad** sa port State bago dumating."], "ref": "BWM Convention Regulation B-4 at MEPC.1/Circ.862 on contingency measures.", "k": "Pangalanan ang tatlong paraan ng ballast exchange at ang kailangan ng bawat isa.", "u": "Ipaliwanag kung bakit mas mapanganib ang sequential method sa masamang panahon.", "p": "Maghanda ng exchange plan na may stress at stability check sa bawat yugto.", "stcw": "STCW Table A-II/2 — pollution prevention."});
T.push({"id": "garbage", "r": "co", "g": "Environment", "t": "Garbage Management", "lead": "Ang basura ay may **tiyak na uri, tiyak na lalagyan at tiyak na rekord**. Hindi basta itinatapon.", "pts": ["Ang barko ay may **Garbage Management Plan** at **Garbage Record Book**.", "**Walang plastik** ang itinatapon sa dagat, kailanman.", "Ang **food waste** ay may distansyang kailangan: 3 nm kung dinurog, 12 nm kung hindi.", "May **espesyal na lugar** na mas mahigpit, gaya ng Mediterranean at Baltic.", "Ang **cargo residue** ay may sariling patakaran at may hazard to marine environment classification.", "Ang **receipt mula sa reception facility** ay itinatago kasama ang record book."], "ref": "MARPOL Annex V at MEPC.295(71). Ang Garbage Record Book ay sapilitan para sa barkong 400 GT pataas o may 15 tao pataas.", "k": "Sabihin ang distansya ng pagtatapon para sa dinurog at hindi dinurog na food waste.", "u": "Ipaliwanag kung bakit mas mahigpit ang special area at kung paano malalaman kung nasa loob ka nito.", "p": "Magtala ng isang linggo ng garbage disposal sa record book at i-verify ang klasipikasyon ng bawat uri.", "stcw": "STCW Table A-II/2 — pollution prevention."});
T.push({"id": "sopep", "r": "co", "g": "Environment", "t": "SOPEP and Oil Spill Preparedness", "lead": "Ang SOPEP ang **plano kapag may tumapon na langis**. Ang unang limang minuto ang pinakamahalaga.", "pts": ["Ang barko ay may **approved SOPEP** at **SOPEP locker** na may kumpletong laman.", "**Unang hakbang**: ihinto ang operasyon, bigyan ng babala, at pigilan ang pagkalat.", "**Pag-uulat**: coastal State, flag, company at terminal, gamit ang nakahandang format.", "Ang **scupper plug** ay nakalagay bago magsimula ang bunkering o cargo transfer.", "**Oil Record Book** ay napupunan para sa bawat operasyon at bawat insidente.", "May **drill** nang regular at may talaan ng bawat isa."], "ref": "MARPOL Annex I Regulation 37 — Shipboard Oil Pollution Emergency Plan. Ang pag-uulat ay ayon sa Article 8 at Protocol I.", "k": "Ipakita ang laman ng SOPEP locker at ang listahan ng kontak sa plano.", "u": "Ipaliwanag kung bakit mas mahalaga ang mabilis na pag-uulat kaysa sa paglilinis muna.", "p": "Pamunuan ang isang oil spill drill, gamitin ang reporting format, at magsumite ng ulat pagkatapos.", "stcw": "STCW Table A-II/2 — prevent pollution of the marine environment."});
T.push({"id": "annexvvi", "r": "co", "g": "Environment", "t": "MARPOL Annex V and VI Awareness", "lead": "Ang Annex V ay tungkol sa **basura**, at ang Annex VI ay tungkol sa **usok at hangin**. Pareho silang may rekord at may inspeksyon.", "pts": ["**Annex VI**: sulphur limit na 0.50 % sa mundo at 0.10 % sa Emission Control Area.", "**Fuel changeover** bago pumasok sa ECA, may talaan ng oras at posisyon.", "**Bunker Delivery Note** at ang sample ay itinatago ng 12 buwan.", "**EEXI at CII** ang bagong sukatan ng kahusayan at paglabas ng carbon.", "**SEEMP** ang plano para sa energy efficiency, may Part III na para sa CII.", "**Ozone depleting substances record** at ang listahan ng refrigerant."], "ref": "MARPOL Annex VI Regulations 14, 18 at 22. Ang CII rating mula A hanggang E ay sinisimulan noong 2023.", "k": "Sabihin ang sulphur limit sa loob at labas ng ECA at kung saan nakatala ang changeover.", "u": "Ipaliwanag kung bakit kailangang itago ang bunker sample at kung kailan ito ginagamit.", "p": "Magsagawa ng fuel changeover, itala ang oras at posisyon, at i-verify ang kalkulasyon ng changeover time.", "stcw": "STCW Table A-II/2 — pollution prevention."});
T.push({"id": "decklog", "r": "co", "g": "Safety Management", "t": "Deck Log and Record Book Entries", "lead": "Ang log book ay **legal na dokumento**. Ang isinulat doon ay magiging ebidensya pagkalipas ng maraming taon.", "pts": ["Isulat **habang nangyayari**, hindi sa dulo ng watch o ng araw.", "Gumamit ng **tinta**, huwag burahin; isang guhit lang sa mali at lagdaan.", "Itala ang **oras, posisyon, panahon at pangyayari** nang tiyak.", "Itala ang **drills, tests at inspections** na may resulta.", "Itala ang **order ng Master** at kung kailan ito tinupad.", "Lagdaan ng **opisyal na nagtala**, at hindi ng ibang tao."], "ref": "SOLAS V/28 — record of navigational activities. Ang oil, garbage at ballast record book ay may sariling kinakailangan sa MARPOL.", "k": "Ipakita ang tamang paraan ng pagwawasto ng maling entry.", "u": "Ipaliwanag kung bakit ang pagsulat pagkatapos ng shift ay nagpapahina sa halaga ng log bilang ebidensya.", "p": "Punan ang deck log para sa isang buong watch, kasama ang isang insidente at ang pagwawasto ng isang entry.", "err": "Binura o tinakpan ng correction fluid ang mali. Nawawala ang tiwala sa buong log book kapag ganito.", "stcw": "STCW Table A-II/2 — monitor and control compliance with legislative requirements."});
T.push({"id": "deckplan", "r": "co", "g": "Safety Management", "t": "Deck Work Planning", "lead": "Ang maayos na pagpaplano ang pagkakaiba ng **produktibong araw** at ng aksidente.", "pts": ["Magsimula sa **weekly plan** at hatiin sa araw-araw na gawain.", "Tingnan ang **panahon, ang port call at ang oras ng pahinga** bago magtalaga.", "Tukuyin kung alin ang nangangailangan ng **permit to work**.", "Itugma ang **tao sa gawain**: karanasan, sertipiko at pisikal na kakayahan.", "Maglaan ng **oras para sa toolbox talk** at para sa paglilinis pagkatapos.", "I-review sa **dulo ng araw** kung ano ang natapos at kung ano ang nabago."], "ref": "ISM Code Element 7 at ang Code of Safe Working Practices for Merchant Seafarers. Ang work and rest hours ay nasa MLC 2006 at STCW.", "k": "Gumawa ng weekly deck plan na nakaayos ayon sa prayoridad.", "u": "Ipaliwanag kung bakit ang pagmamadali sa dulo ng araw ang madalas na sandali ng aksidente.", "p": "Pamunuan ang isang araw ng deck work mula sa pagpaplano hanggang sa pag-review, at itala ang pagbabago.", "stcw": "STCW Table A-II/2 — organise and manage the crew."});
T.push({"id": "ptw", "r": "co", "g": "Safety Management", "t": "Permit to Work System", "lead": "Ang permit ay hindi papel. Ito ay **kasunduan** na nasuri ang panganib at naihanda ang proteksyon bago magsimula.", "pts": ["Kailangan ng permit sa **enclosed space, hot work, aloft, overside at electrical isolation**.", "Ang permit ay may **takdang oras** at nagtatapos kapag natapos ang shift.", "**Isolation at lock-out tag-out** bago magsimula, at i-verify ito.", "May **nakatalagang standby man** sa mga gawaing may permit.", "Ang permit ay **nilalagdaan ng gumawa, ng nagsuri at ng Master** kung kinakailangan.", "**Isara ang permit** pagkatapos; walang bukas na permit na walang gawain."], "ref": "ISM Code Element 7 at ang Code of Safe Working Practices. Ang enclosed space entry permit ay may sariling mahigpit na format.", "k": "Ilista ang mga gawaing nangangailangan ng permit sa iyong barko.", "u": "Ipaliwanag kung bakit nagtatapos ang permit sa pagtatapos ng shift kahit hindi pa tapos ang gawain.", "p": "Maghanda at isara ang isang hot work permit, kasama ang fire watch at ang post-work check.", "err": "Pinahaba ang permit sa susunod na araw nang hindi muling sinusuri. Nagbago na ang kondisyon pero luma pa rin ang pagsusuri.", "stcw": "STCW Table A-II/2 — ensure compliance with pollution prevention and safety requirements."});
T.push({"id": "riskassess", "r": "co", "g": "Safety Management", "t": "Risk Assessment and Toolbox Meeting", "lead": "Ang risk assessment ay **pag-iisip bago kumilos**. Ang toolbox talk ang nagdadala nito sa taong gagawa.", "pts": ["Tukuyin ang **hazard**, ang **sino ang maaaring masaktan**, at ang **umiiral na control**.", "Bigyan ng **likelihood at severity** at kunin ang resultang antas ng panganib.", "Magdagdag ng **control** hanggang katanggap-tanggap ang panganib.", "Sundin ang **hierarchy of control**: alisin, palitan, engineering, administrative, PPE.", "Ang **toolbox talk** ay bago magsimula, sa lugar ng gawain, at may pagkakataong magtanong.", "**Dynamic risk assessment**: ihinto ang gawain kapag nagbago ang kondisyon."], "ref": "ISM Code Element 1.2.2 — assess all identified risks. Ang stop work authority ay nasa SMS ng karamihan ng kumpanya.", "k": "Punan ang isang risk assessment form para sa isang karaniwang gawain sa deck.", "u": "Ipaliwanag kung bakit ang PPE ang pinakamahinang control at bakit huli ito sa hierarchy.", "p": "Pamunuan ang isang toolbox talk, ipaliwanag ang panganib at ang control, at itala ang mga dumalo.", "stcw": "STCW Table A-II/2 — application of leadership and managerial skills."});
T.push({"id": "enclosed", "r": "co", "g": "Safety Management", "t": "Enclosed Space Entry", "lead": "Ang enclosed space ang **pinaka-nakamamatay** na lugar sa barko. Karamihan ng namamatay ay ang mga tumutulong, hindi ang unang pumasok.", "pts": ["**Enclosed space** ay may limitadong pasukan, hindi idinisenyo para pagtrabahuhan, at may mahinang bentilasyon.", "**Walang pumapasok** nang walang permit, gas test at standby man.", "Sukatin sa **lahat ng antas**: oxygen 20.8 %, flammable gas wala pang 1 % LEL, toxic gas sa ilalim ng limitasyon.", "**Patuloy na ventilation** habang may tao sa loob.", "**Komunikasyon** tuwing nakatakdang pagitan, at agad na signal kapag may mali.", "**Rescue plan at kagamitan** ay nakahanda bago pumasok; bawal ang pasok nang walang BA sa pagsagip."], "ref": "SOLAS III/19.3.6 — enclosed space entry and rescue drills, kada dalawang buwan. IMO Resolution A.1050(27) ang gabay sa pamamaraan.", "k": "Sabihin ang limitasyon ng oxygen, flammable at toxic gas bago pumasok.", "u": "Ipaliwanag kung bakit mas maraming namamatay sa pagsagip kaysa sa unang pumasok.", "p": "Pamunuan ang enclosed space entry drill, kasama ang gas test, komunikasyon at ang pagsagip gamit ang BA.", "err": "Pumasok para sumagip nang walang BA. Ito ang pinakakaraniwang paraan ng pagdami ng biktima.", "stcw": "STCW Table A-II/2 — enclosed space entry and rescue."});
T.push({"id": "crewsup", "r": "co", "g": "Safety Management", "t": "Crew Supervision and Training", "lead": "Ang Chief Officer ang **nagtuturo at nagbabantay** sa deck crew. Ang antas ng kanilang trabaho ay sumasalamin sa pamumuno.", "pts": ["**Familiarization** sa pagsakay bago bigyan ng gawain.", "**On-the-job training** na may malinaw na pamantayan at pagsusuri.", "**Drill** ayon sa iskedyul at may tunay na pagsasanay, hindi pirma lang.", "**Appraisal** na patas at may ebidensya.", "Ang **cadet** ay may training record book na nire-review nang regular.", "Tukuyin ang **mahinang bahagi** at bigyan ng dagdag na pagsasanay."], "ref": "ISM Code Element 6 — resources and personnel; STCW Regulation I/14 at MLC 2006 sa training at familiarization.", "k": "Ipakita ang training matrix ng deck department at ang mga kulang.", "u": "Ipaliwanag kung bakit nasasayang ang drill na walang pagtuturo at pagsusuri.", "p": "Magsagawa ng on-the-job training sa isang gawain, suriin ang resulta, at itala sa training record.", "stcw": "STCW Table A-II/2 — application of leadership and teamworking skills."});
T.push({"id": "pscprep", "r": "co", "g": "Safety Management", "t": "PSC, Flag and Class Preparation", "lead": "Ang inspeksyon ay hindi pagsusulit kundi **pagpapakita ng normal na kalagayan**. Ang handa ay walang kinakabahan.", "pts": ["Suriin ang **certificates at surveys** na malapit nang mag-expire.", "Suriin ang **madalas na deficiency**: fire doors, ventilation closing, lifeboat, ISM records, charts.", "Isagawa ang **self-inspection** gamit ang PSC checklist bago dumating.", "Ihanda ang **crew**: alam nila ang muster list at ang kanilang gawain.", "Ang **deficiency** ay may action plan at petsa ng pagkukumpuni.", "Ang **detention** ay karaniwang dahil sa ISM failure, hindi sa isang sirang bagay."], "ref": "Paris MoU at Tokyo MoU Concentrated Inspection Campaigns. Ang ISM-related detention ay nagdudulot ng mas mahabang pagkaantala.", "k": "Ilista ang limang pinakakaraniwang deficiency sa iyong uri ng barko.", "u": "Ipaliwanag kung bakit ang maraming maliit na deficiency ay nagiging ISM finding.", "p": "Pamunuan ang isang self-inspection bago ang port call at maghanda ng action plan sa bawat natagpuan.", "stcw": "STCW Table A-II/2 — monitor and control compliance with legislative requirements."});
T.push({"id": "smsimpl", "r": "co", "g": "Safety Management", "t": "SMS Implementation", "lead": "Ang SMS ay hindi libro sa istante. Ito ang **paraan ng paggawa** sa barko, at dapat sundin at mapatunayan.", "pts": ["Alamin ang **mga procedure na sakop ng iyong tungkulin** at kung saan nakalagay.", "**Non-conformity**: kapag hindi nasunod ang procedure; iulat at itama.", "**Near miss**: iulat kahit walang nasaktan; dito nanggagaling ang pinakamahalagang aral.", "**Internal audit** nang hindi bababa sa isang beses kada taon.", "**Management review** at ang feedback sa opisina.", "Ang **procedure na hindi gumagana** ay dapat ipabago, hindi basta hindi sundin."], "ref": "ISM Code Elements 5, 7, 9 at 12. Ang ISM Code ay ipinatutupad sa pamamagitan ng Document of Compliance at Safety Management Certificate.", "k": "Hanapin ang procedure para sa isang karaniwang gawain at sabihin kung sino ang responsable.", "u": "Ipaliwanag ang pagkakaiba ng non-conformity, major non-conformity at observation.", "p": "Magsumite ng near miss report at magmungkahi ng pagbabago sa isang procedure na hindi praktikal.", "err": "Hindi nag-uulat ng near miss dahil walang nasira. Nawawala ang pagkakataong matuto bago mangyari ang totoong aksidente.", "stcw": "STCW Table A-II/2 — monitor and control compliance; safety management."});
T.push({"id": "cohandover", "r": "co", "g": "Safety Management", "t": "Handover to Relieving Chief Officer", "lead": "Ang handover ang **pinaka-delikadong sandali** sa buhay ng barko. Dito nawawala ang impormasyon.", "pts": ["**Nakasulat na handover note**, hindi usapan lang.", "Kalagayan ng **cargo, ballast, stability at ang susunod na operasyon**.", "**Bukas na defect**, ang mitigation, at ang inaasahang pagkukumpuni.", "**Darating na survey at certificate** na malapit nang mag-expire.", "**Kalagayan ng crew**: bago, may problema, may training na kailangan.", "**Magkasamang paglibot** sa deck, sa hold at sa tangke bago bumaba."], "ref": "ISM Code Element 6.3 at ang company handover procedure. Karaniwang hinihingi ang nakalagdaang handover note ng parehong opisyal.", "k": "Ilista ang laman ng handover note at kung sino ang pumipirma.", "u": "Ipaliwanag kung bakit hindi sapat ang verbal handover kahit magaling ang dalawang opisyal.", "p": "Maghanda ng kumpletong handover note at pamunuan ang magkasamang paglibot.", "stcw": "STCW Table A-II/2 — application of leadership and managerial skills."});
T.push({"id": "charterers", "r": "ma", "g": "Commercial and Communication", "t": "Charterers and Owners Messages", "lead": "Ang Master ay nasa gitna ng **may-ari at ng umuupa**. Magkaiba ang kanilang interes at magkaiba ang kanilang awtoridad.", "pts": ["Ang **owner** ang may hawak ng barko, crew at seaworthiness.", "Ang **charterer** ang nagbibigay ng **employment order**: saan pupunta at anong cargo.", "Ang Master ay **sumusunod sa charterer sa employment**, pero **hindi kailanman sa kaligtasan**.", "Ang **utos na labag sa kaligtasan** ay tinatanggihan nang nakasulat, may paliwanag.", "**Kopyahin ang owner** sa lahat ng mahalagang mensahe mula sa charterer.", "Itago ang **lahat ng korespondensya**; ito ang ebidensya sa hindi pagkakaunawaan."], "ref": "Ang employment at indemnity clause ng charter party. Ang overriding duty ng Master sa kaligtasan ay kinikilala ng SOLAS V/34-1 at ng ISM Code 5.2.", "k": "Sabihin kung sino ang nag-uutos sa employment at sino ang may huling salita sa kaligtasan.", "u": "Ipaliwanag kung bakit ang pagsunod sa hindi ligtas na utos ay hindi nagpoprotekta sa Master kahit may nakasulat na utos.", "p": "Sumulat ng tugon sa isang utos na hindi ligtas, na magalang, malinaw, at may dahilan at alternatibo.", "err": "Sumunod sa utos na pumasok sa daungang hindi kayang tanggapin ang draught ng barko. Ang Master pa rin ang mananagot.", "stcw": "STCW Table A-II/2 — maintain the safety and security of the ship, crew and passengers."});
T.push({"id": "agents", "r": "ma", "g": "Commercial and Communication", "t": "Agents and Port Correspondence", "lead": "Ang agent ang **kamay ng barko sa lupa**. Ang kalinawan ng iyong hiling ang nagtatakda ng bilis ng serbisyo.", "pts": ["Magpadala ng **pre-arrival message** nang maaga, kumpleto at nakaayos.", "Linawin **sino ang nagbabayad** sa bawat serbisyo bago ito hingin.", "Ang **appointment letter** ang nagsasabi kung ang agent ay para sa owner o sa charterer.", "Lahat ng **hiling ay nakasulat**; ang usapan sa telepono ay kinukumpirma sa email.", "**Disbursement account** ay sinusuri bago lagdaan.", "Ang **agent ay hindi kapalit ng desisyon ng Master** sa kaligtasan at sa dokumento."], "ref": "Ang agency agreement at ang charter party. Ang port disbursement ay karaniwang pinag-uusapan ng owner at agent, pero ang Master ang nagpapatunay ng serbisyong natanggap.", "k": "Ilista ang laman ng isang kumpletong pre-arrival message.", "u": "Ipaliwanag kung bakit mahalagang malaman kung kaninong agent ang kaharap mo.", "p": "Maghanda ng pre-arrival package at suriin ang isang disbursement account bago lagdaan.", "stcw": "STCW Table A-II/2 — commercial and port operations."});
T.push({"id": "norsof", "r": "ma", "g": "Commercial and Communication", "t": "NOR, SOF and Letters of Protest", "lead": "Tatlong dokumentong nagtatakda ng **pera at oras**. Ang mali rito ay nagiging milyon-milyong pagtatalo.", "pts": ["**Notice of Readiness**: ang barko ay nasa lugar, handa sa lahat ng paraan, at nasa loob ng laycan.", "Ang NOR ay ipinapadala **isang beses at sa tamang oras**; may readiness requirement sa charter party.", "**Statement of Facts**: tuloy-tuloy na talaan ng oras ng bawat pangyayari, kasama ang paghinto at ang dahilan.", "**Letter of Protest**: isinusulat kapag may ginawa ang kabilang panig na makakasama sa barko o sa cargo.", "Ang LOP ay may **petsa, oras, pangalan ng tumanggap**, at itinatago ang kopya kahit tumanggi silang pumirma.", "**Laytime** ang nagsisimula pagkatapos ng NOR at ng turn time; ang demurrage ay nakasalalay dito."], "ref": "Ang charter party laytime clause at ang Voylayrules. Ang maling NOR ay maaaring maging dahilan para hindi magsimula ang laytime.", "k": "Sabihin ang tatlong kondisyon bago magpadala ng NOR.", "u": "Ipaliwanag kung bakit ang maagang NOR ay maaaring ituring na invalid at ano ang epekto nito sa demurrage.", "p": "Maghanda ng NOR, isang SOF para sa isang port call, at isang letter of protest para sa isang pagkaantala.", "err": "Nagpadala ng NOR habang hindi pa tapos ang hold cleaning. Hindi valid ang NOR at nawala ang laytime.", "stcw": "STCW Table A-II/2 — commercial management."});
T.push({"id": "lop", "r": "ma", "g": "Commercial and Communication", "t": "Letters of Indemnity Awareness", "lead": "Ang **letter of indemnity** ay pangakong sasagutin ka kapag may problema. Ang panganib: madalas itong walang halaga kapag kailangan na.", "pts": ["Madalas hinihingi para sa **clean bill of lading** sa may depektong cargo, o para sa **discharge without original B/L**.", "Ang **pagpirma ng clean B/L** na alam mong may depekto ang cargo ay maaaring ituring na panloloko.", "Ang **P&I cover ay karaniwang nawawala** sa ganitong sitwasyon.", "Ang LOI ay **hindi binding sa third party** gaya ng tunay na may-ari ng cargo.", "**Huwag tatanggap** ng LOI nang walang malinaw na pahintulot ng owner at ng P&I club.", "Ang tamang tugon ay **claused bill of lading** na may tunay na remarks."], "ref": "P&I club guidance. Ang pagdadala nang walang original bill of lading at ang clean B/L laban sa LOI ay kabilang sa mga pangunahing dahilan ng pagkawala ng cover.", "k": "Sabihin ang dalawang karaniwang sitwasyon kung saan hinihingi ang LOI.", "u": "Ipaliwanag kung bakit mawawala ang P&I cover kahit may LOI na pinirmahan ng malaking kumpanya.", "p": "Sumulat ng tugon sa hiling ng LOI, nagtatanggi nang magalang at nagmumungkahi ng claused B/L, at iulat ito sa owner.", "stcw": "STCW Table A-II/2 — commercial and legal responsibilities."});
T.push({"id": "claims", "r": "ma", "g": "Commercial and Communication", "t": "Cargo Claims and Reservations", "lead": "Ang claim ay nananalo o natatalo sa **ebidensyang nakolekta noong panahon mismo**, hindi sa paliwanag pagkatapos.", "pts": ["**Mag-survey bago at pagkatapos** ng operasyon, may larawan na may petsa.", "**Mate's receipt remarks** ang pinakamalakas na depensa laban sa claim sa kondisyon ng cargo.", "**Letter of protest** sa bawat pangyayaring makakaapekto sa cargo.", "**Ventilation at temperature log** na kumpleto at tuloy-tuloy.", "Humiling ng **joint survey** kapag may natagpuang pinsala.", "**Iulat agad sa P&I club** at sundin ang kanilang tagubilin."], "ref": "Hague-Visby Rules Article III at IV. Ang notice of loss or damage ay karaniwang kailangang ibigay sa loob ng tatlong araw mula sa paghahatid.", "k": "Ilista ang ebidensyang kokolektahin kapag may natagpuang pinsala sa cargo.", "u": "Ipaliwanag kung bakit mas mahalaga ang tuloy-tuloy na log kaysa sa magandang paliwanag pagkatapos.", "p": "Pamunuan ang pagkolekta ng ebidensya sa isang cargo damage at maghanda ng ulat para sa P&I club.", "stcw": "STCW Table A-II/2 — commercial and legal responsibilities."});
T.push({"id": "increp", "r": "ma", "g": "Commercial and Communication", "t": "Incident and Accident Reports", "lead": "Ang layunin ng ulat ay **maiwasang maulit**, hindi maghanap ng sisihin. Pero dapat itong tumpak at kumpleto.", "pts": ["**Agarang pag-uulat** sa company, flag at kung kinakailangan sa coastal State.", "**Panatilihin ang lugar** kung ligtas, at kumuha ng larawan bago galawin.", "Kolektahin ang **salaysay ng bawat saksi** nang hiwalay at habang sariwa.", "**Preserve** ang VDR data; may limitadong oras bago ito ma-overwrite.", "Gumamit ng **root cause analysis**, hindi lang ang agarang sanhi.", "Ang **corrective action** ay may responsable at may petsa."], "ref": "SOLAS XI-1/6 at ang Casualty Investigation Code. Ang VDR data ay dapat i-preserve agad pagkatapos ng insidente.", "k": "Sabihin kung kanino iniuulat ang isang serious marine casualty at gaano kabilis.", "u": "Ipaliwanag kung bakit mahalaga ang pag-preserve ng VDR data sa unang oras.", "p": "Maghanda ng kumpletong incident report na may timeline, root cause at corrective action.", "err": "Hindi na-save ang VDR dahil abala sa iba. Nawala ang pinakamahalagang ebidensya sa loob ng 12 hanggang 48 oras.", "stcw": "STCW Table A-II/2 — respond to emergencies; investigate casualties."});
T.push({"id": "perfrep", "r": "ma", "g": "Commercial and Communication", "t": "Performance, Speed and Consumption Reports", "lead": "Ang performance report ang **batayan ng claim** tungkol sa bilis at gastos sa gasolina. Ang tumpak na datos ang panangga ng barko.", "pts": ["Itala ang **noon report**: posisyon, distansya, bilis, consumption at ROB.", "Itala ang **panahon**: hangin, alon at agos, gamit ang karaniwang sukatan.", "Ang **good weather period** ang ginagamit sa pagsusuri ng warranty, kaya tumpak ang Beaufort at Douglas scale.", "Ang **slip at RPM** ay nagsasabi ng kalagayan ng katawan at propeller.", "**Hull fouling** ay dahilan ng pagbaba ng performance; itala ang huling paglilinis.", "Ang **pagkakaiba ng barko at ng weather router** ay maaaring maging pagtatalo; itago ang sariling obserbasyon."], "ref": "Ang speed and consumption warranty ng charter party. Ang BIMCO at ang weather routing company ay may sariling pamantayan sa good weather.", "k": "Punan ang isang noon report nang kumpleto at tumpak.", "u": "Ipaliwanag kung bakit ang maling pagtaya ng Beaufort force ay maaaring magdulot ng performance claim.", "p": "Suriin ang isang buwan ng noon report, tukuyin ang trend sa slip, at maghanda ng paliwanag sa pagbaba ng performance.", "stcw": "STCW Table A-II/2 — monitor and control performance."});
T.push({"id": "email", "r": "ma", "g": "Commercial and Communication", "t": "Professional Email Writing", "lead": "Karamihan ng away sa dagat ay nagsisimula sa **maling pagkakasulat**, hindi sa maling gawa.", "pts": ["Isang **paksa kada email**, at malinaw ang subject line.", "**Unang talata ang pinakamahalaga**: ano ang nangyari at ano ang kailangan.", "Gumamit ng **katotohanan at oras**, huwag ng damdamin.", "**Huwag sumagot habang galit**; isulat, iwanan, basahin ulit.", "**Kopyahin ang tamang tao**, huwag ang lahat.", "Tandaan: **ang email ay ebidensya** at mababasa sa korte pagkalipas ng limang taon."], "ref": "Walang regulasyon dito, pero ang korespondensya ay kabilang sa dokumentong hinihingi sa claim at sa imbestigasyon.", "k": "Sumulat ng malinaw na subject line at unang talata para sa tatlong karaniwang sitwasyon.", "u": "Ipaliwanag kung bakit lumalala ang sitwasyon kapag emosyonal ang sulat kahit tama ka.", "p": "Sumulat ng tugon sa isang mahirap na email ng charterer, na matatag pero magalang at nakabatay sa katotohanan.", "stcw": "STCW Table A-II/2 — use of leadership and managerial skills."});
T.push({"id": "command", "r": "ma", "g": "Leadership", "t": "Command Presence", "lead": "Ang command presence ay hindi lakas ng boses. Ito ay **katiyakan na may namumuno** kahit magulo ang sitwasyon.", "pts": ["**Kalmado sa panganib**: ang tono mo ang tono ng tulay.", "**Malinaw na utos**: isang tao, isang gawain, at kinukumpirma ng tumanggap.", "**Nakikita ka** sa mahahalagang sandali: pagpasok, paglabas, masamang panahon.", "**Pare-pareho** sa pamantayan, hindi nagbabago ayon sa kausap.", "**Inaamin ang pagkakamali**; pinatatatag nito ang tiwala, hindi pinapahina.", "**Ang tahimik na opisyal ay maaaring may nakikitang mali**; hilingin ang kanilang opinyon."], "ref": "STCW Code Section A-II/2 at ang Bridge Resource Management principles. Ang ISM Code 5 ay nagsasaad ng Master's responsibility and authority.", "k": "Ilarawan ang mga ugali ng mabuting command presence at ang mga senyales ng kabaligtaran.", "u": "Ipaliwanag kung bakit ang pagsigaw ay nagpapabagal sa tugon ng koponan sa emergency.", "p": "Pamunuan ang isang maniobra o drill, magbigay ng malinaw na utos, at magsagawa ng debrief pagkatapos.", "stcw": "STCW Table A-II/2 — use leadership and managerial skills."});
T.push({"id": "sitlead", "r": "ma", "g": "Leadership", "t": "Situational Leadership", "lead": "Walang iisang paraan ng pamumuno. Ang tamang paraan ay nakasalalay sa **tao at sa sitwasyon**.", "pts": ["**Directing**: bago at walang karanasan; sabihin nang eksakto.", "**Coaching**: may kaunting kakayahan; ipaliwanag ang dahilan.", "**Supporting**: may kakayahan pero kulang sa tiwala sa sarili; tumulong at hikayatin.", "**Delegating**: bihasa at may tiwala; ibigay ang gawain at ang awtoridad.", "Sa **emergency**, bumalik sa directing kahit bihasa ang koponan.", "Ang **maling antas** ay nagdudulot ng alinman sa pagkalito o ng sama ng loob."], "ref": "STCW Code A-II/2 — knowledge of personnel management techniques. Ang modelo ay karaniwang tinuturo sa Management Level course.", "k": "Tukuyin ang antas ng pamumuno na angkop sa tatlong magkakaibang miyembro ng koponan.", "u": "Ipaliwanag kung bakit nakakasama ang delegating sa taong hindi pa handa, at ang directing sa bihasa.", "p": "Pumili ng angkop na paraan para sa tatlong tauhan sa isang tunay na gawain, at suriin ang resulta.", "stcw": "STCW Table A-II/2 — personnel management."});
T.push({"id": "delegate", "r": "ma", "g": "Leadership", "t": "Delegation and Accountability", "lead": "Puwede mong **ipagkatiwala ang gawain**, pero hindi mo maipapasa ang **pananagutan**.", "pts": ["Sabihin ang **layunin, hangganan at takdang oras**, hindi lang ang gawain.", "Ibigay ang **awtoridad** kasama ng gawain; walang silbi ang utos na walang kapangyarihan.", "Magtakda ng **check point**, hindi palaging nakatingin.", "**Huwag kunin pabalik** ang gawain sa unang pagkakamali; ituro muna.", "Ang **resulta ay sa koponan**, ang **pananagutan ay sa iyo**.", "**Itala** kung sino ang itinalaga; mahalaga ito sa imbestigasyon."], "ref": "ISM Code Element 5 at 6 — responsibility, authority and resources. Ang Master ay may overriding authority na hindi maipapasa.", "k": "Sabihin ang pagkakaiba ng pagtatalaga ng gawain at ng pagpapasa ng pananagutan.", "u": "Ipaliwanag kung bakit nabibigo ang delegasyon kapag kulang ang awtoridad.", "p": "Magtalaga ng isang mahalagang gawain nang may malinaw na hangganan, subaybayan, at magbigay ng feedback.", "stcw": "STCW Table A-II/2 — leadership and managerial skills."});
T.push({"id": "conflict", "r": "ma", "g": "Leadership", "t": "Conflict Resolution", "lead": "Sa barko, **hindi puwedeng umalis** ang nag-aaway. Kailangang ayusin, hindi iwasan.", "pts": ["Kumilos **nang maaga**; ang maliit na alitan ay lumalaki sa loob ng maliit na espasyo.", "Pakinggan ang **bawat panig nang hiwalay** bago pagsamahin.", "Ihiwalay ang **tao sa problema**; pag-usapan ang kilos, hindi ang pagkatao.", "Hanapin ang **tunay na dahilan**: pagod, hindi patas na trabaho, kultura, o personal na problema sa bahay.", "Magtakda ng **malinaw na kasunduan** at subaybayan ito.", "**Itala** ang seryosong usapin; ang harassment at bullying ay may hiwalay na pamamaraan."], "ref": "MLC 2006 Regulation 4.3 at ang shipboard complaint procedure. Ang bawat barko ay may nakasulat na pamamaraan ng reklamo.", "k": "Sabihin ang hakbang ng shipboard complaint procedure ng iyong kumpanya.", "u": "Ipaliwanag kung bakit lumalala ang alitan kapag binalewala, at bakit mapanganib ito sa kaligtasan.", "p": "Pamunuan ang isang usapan sa pagitan ng dalawang nag-aaway at magtala ng kasunduan at ng follow-up.", "stcw": "STCW Table A-II/2 — personnel management and training."});
T.push({"id": "coach", "r": "ma", "g": "Leadership", "t": "Coaching Junior Officers", "lead": "Ang trabaho ng Master ay hindi lang magpatakbo ng barko kundi **gumawa ng susunod na Master**.", "pts": ["Bigyan ng **tunay na gawain** na may tamang antas ng hamon.", "**Ipaliwanag ang dahilan** ng desisyon, hindi lang ang desisyon.", "Hayaang **gumawa sila ng maliliit na pagkakamali** sa ligtas na sitwasyon.", "**Debrief** pagkatapos ng maniobra: ano ang naging maayos, ano ang susunod na gagawin.", "**Purihin sa publiko, iwasto nang pribado**.", "**Itala** ang pag-unlad sa appraisal at sa training record."], "ref": "STCW Regulation I/6 at ang company training policy. Ang on-board training ay bahagi ng ISM Element 6.", "k": "Ilarawan ang istruktura ng isang mabuting debrief pagkatapos ng maniobra.", "u": "Ipaliwanag kung bakit hindi natututo ang opisyal na laging kinukuhanan ng gawain.", "p": "Pamunuan ang isang pagsasanay ng Second Officer sa isang maniobra, mula sa briefing hanggang sa debrief.", "stcw": "STCW Table A-II/2 — training and personnel management."});
