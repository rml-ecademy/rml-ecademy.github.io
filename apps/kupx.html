T.push({"id": "fatigue", "r": "ma", "g": "Leadership", "t": "Fatigue and Workload Management", "lead": "Ang pagod ay **panganib sa kaligtasan**, hindi kahinaan. Ang pamamahala nito ay tungkulin ng Master.", "pts": ["**Minimum rest**: 10 oras sa bawat 24 oras at 77 oras sa bawat 7 araw.", "Ang 10 oras ay maaaring hatiin sa **dalawa lamang**, at ang isa ay dapat **hindi bababa sa 6 na oras**.", "Ang **record of rest hours** ay totoo; ang pinalamutian ay paglabag at nagtatago ng panganib.", "Tukuyin ang **mabibigat na araw**: port call, inspection, bunkering at masamang panahon.", "**Baguhin ang plano** kaysa pilitin ang pagod na koponan.", "Ang **senyales ng pagod** ay mabagal na reaksyon, maling pagbasa at pagkamaikli ng pasensya."], "ref": "STCW Code Section A-VIII/1 at MLC 2006 Standard A2.3. Ang record of hours of work or rest ay sapilitan at inspeksyonado ng PSC.", "k": "Sabihin ang minimum rest hours at kung paano ito maaaring hatiin.", "u": "Ipaliwanag kung bakit mas mapanganib ang maling rest record kaysa sa aminin ang kakulangan ng tao.", "p": "Suriin ang rest hour record ng isang linggo, tukuyin ang paglabag, at mag-ayos ng bagong plano.", "err": "Pinalamutian ang rest hours para pumasa sa inspeksyon. Itinatago nito ang tunay na panganib at paglabag sa MLC.", "stcw": "STCW Table A-II/2 — fitness for duty and fatigue management."});
T.push({"id": "culture", "r": "ma", "g": "Leadership", "t": "Cultural Awareness", "lead": "Sa barkong may iba't ibang lahi, ang **hindi pagkakaunawaan** ay madalas hindi sa wika kundi sa kultura.", "pts": ["**Power distance**: may kulturang hindi kumukontra sa nakatataas kahit may nakikitang mali.", "**Direct at indirect**: may nagsasabi nang tuwiran, may nagpapahiwatig lamang.", "**Oo** ay hindi laging pagsang-ayon; minsan ito ay 'narinig ko'.", "Gumamit ng **closed-loop communication**: ulitin ang utos pabalik.", "Igalang ang **pananampalataya at pagkain**; madali itong ayusin at malaki ang epekto sa moral.", "Ang **working language** ay kailangang malinaw sa lahat, at nakatala."], "ref": "SOLAS V/14.3 — ang working language ay itinatakda at naitatala sa log book. Ang Bridge Resource Management ay tumatalakay sa cultural barriers.", "k": "Ilarawan kung paano makikita ang power distance sa tulay.", "u": "Ipaliwanag kung bakit mapanganib ang pag-asa sa 'oo' nang walang read-back.", "p": "Magsagawa ng briefing gamit ang closed-loop communication at suriin kung naunawaan talaga.", "stcw": "STCW Table A-II/2 — effective communication on board."});
T.push({"id": "motiv", "r": "ma", "g": "Leadership", "t": "Crew Motivation and Discipline", "lead": "Ang moral ay **gawa, hindi suwerte**. Ang disiplina ay para sa kaligtasan, hindi para sa parusa.", "pts": ["**Pagkain, tulog at internet** ang tatlong pinakamalaking tunay na dahilan ng moral.", "**Patas na pagtatalaga** ng mabibigat at mababaw na gawain.", "**Kilalanin ang mabuting gawa** sa harap ng iba, nang tiyak at hindi pangkalahatan.", "Ang **disiplina ay nakatakda**: babala, nakasulat na babala, at pormal na hakbang.", "**Pare-pareho** sa lahat; ang paborito ang pumapatay ng moral.", "**Itala** ang bawat hakbang; kailangan ito kapag umabot sa dismissal."], "ref": "MLC 2006 at ang company disciplinary procedure. Ang hindi makatarungang parusa ay maaaring maging reklamo sa flag o sa labour authority.", "k": "Sabihin ang hakbang ng disciplinary procedure ng iyong kumpanya.", "u": "Ipaliwanag kung bakit mas mabisa ang pare-parehong pamantayan kaysa sa mabigat na parusa.", "p": "Pamunuan ang isang pormal na babala, kasama ang pagsulat, ang usapan at ang follow-up.", "stcw": "STCW Table A-II/2 — personnel management."});
T.push({"id": "mpx", "r": "ma", "g": "Leadership", "t": "Master–Pilot Relationship", "lead": "Ang pilot ay **tagapayo na may lokal na kaalaman**. Ang Master pa rin ang **nananagot** sa barko.", "pts": ["**Master–Pilot Exchange** bago ang maniobra: plano, limitasyon ng barko, tug at berthing.", "Ibigay ang **pilot card** na tumpak at napapanahon.", "Ang **pilot ay hindi pumapalit sa bridge team**; nananatili ang watchkeeping at ang monitoring.", "**Magsalita** kapag may nakitang panganib; gamitin ang malinaw na pananalita.", "Kapag hindi ligtas ang maniobra, **kunin ang kontrol** at itala.", "**Itala** ang oras ng pagsakay at pagbaba ng pilot at ang mga pangunahing utos."], "ref": "SOLAS V/34-1 — ang Master ay hindi pinipigilan ng sinuman sa paggawa ng desisyon para sa kaligtasan. IMO Resolution A.960 ang gabay sa Master-Pilot exchange.", "k": "Ilista ang laman ng Master–Pilot Exchange at ng pilot card.", "u": "Ipaliwanag kung bakit nananatili ang pananagutan ng Master kahit may pilot sa tulay.", "p": "Isagawa ang isang Master–Pilot Exchange, subaybayan ang maniobra, at magsalita sa isang pagkakataong lumihis sa plano.", "err": "Tahimik na pinanood ang maling maniobra dahil 'pilot naman ang nagpapatakbo'. Ang Master pa rin ang mananagot.", "stcw": "STCW Table A-II/2 — Master–Pilot relationship; bridge resource management."});
T.push({"id": "challenge", "r": "ma", "g": "Leadership", "t": "Challenge-and-Response Culture", "lead": "Ang pinakamagandang depensa sa pagkakamali ay ang **kasamang handang magsalita**.", "pts": ["Sabihin sa briefing na **inaasahan ang pagtatanong**, at tuparin ito.", "Gumamit ng **nakatakdang pananalita**: 'Kapitan, nag-aalala ako dahil…'.", "**Two-challenge rule**: kung dalawang beses nang nagtanong at walang sagot, kumilos para sa kaligtasan.", "**Pasalamatan ang nagtanong** kahit mali siya; kapag hindi, huling tanong na iyon.", "Ang **junior at ratings** ay kailangang maramdaman na kasali rin sila.", "Pagkatapos ng maniobra, **tanungin kung may napansing mali** at talakayin nang walang sisihan."], "ref": "Bridge Resource Management at ang STCW Code A-VIII/2 sa bridge teamwork. Ang maraming aksidente ay may saksing nakakita ngunit hindi nagsalita.", "k": "Bigkasin ang nakatakdang pananalita sa pagtatanong at ipaliwanag ang two-challenge rule.", "u": "Ipaliwanag kung bakit nananahimik ang koponan kahit nakikita nila ang panganib.", "p": "Magsagawa ng briefing na hayagang naghihikayat ng pagtatanong, at magbigay ng positibong tugon sa isang tanong.", "stcw": "STCW Table A-II/2 — bridge resource management."});
T.push({"id": "planreview", "r": "ma", "g": "Command Decisions", "t": "Passage Plan Review and Approval", "lead": "Ang passage plan ay ginagawa ng Second Officer pero **inaaprubahan ng Master**. Ang pirma ay pananagutan.", "pts": ["Suriin ang **appraisal**: lahat ba ng chart, publication at impormasyon ay nagamit.", "Suriin ang **UKC sa bawat kritikal na bahagi**, hindi lang sa pinakamababaw.", "Suriin ang **no-go area, abort point at point of no return**.", "Suriin ang **contingency**: anchorage, ligtas na lugar at alternatibong ruta.", "Tiyaking **berth to berth**, kasama ang pilotage at ang paglapit.", "**Ipaliwanag ang plano sa buong bridge team** bago umalis, hindi ipadala lang."], "ref": "SOLAS V/34 at IMO Resolution A.893(21) — Guidelines for voyage planning. Ang plano ay berth to berth.", "k": "Ilista ang apat na yugto ng passage planning at kung ano ang sakop ng bawat isa.", "u": "Ipaliwanag kung bakit kailangan ang abort point bago pa pumasok sa makitid na daanan.", "p": "Suriin at aprubahan ang isang buong passage plan at pamunuan ang briefing sa bridge team.", "err": "Pinirmahan ang plano nang hindi tinitingnan ang pilotage stage. Doon madalas nangyayari ang grounding.", "stcw": "STCW Table A-II/2 — plan a voyage and conduct navigation."});
T.push({"id": "restvis", "r": "ma", "g": "Command Decisions", "t": "Restricted Visibility Decisions", "lead": "Sa makapal na ulap, hindi nagiging ligtas ang barko dahil sa radar. Nagiging ligtas ito sa **tamang desisyon at bilis**.", "pts": ["**Safe speed** ayon sa Rule 6; ang kakayahang huminto sa loob ng nakikitang distansya.", "**Sound signals** ayon sa Rule 35 at ang mga agwat nito.", "**Dagdag na lookout** at manual steering.", "**Ipaalam sa engine room** at ihanda ang makina para sa maniobra.", "Rule 19: ang maagang pagbabago ay **huwag paikot pakaliwa** sa barkong nasa unahan ng beam, at **huwag palapit** sa barkong nasa beam o likod.", "**Itala** ang oras ng pagpasok sa ulap at ang bawat hakbang na ginawa."], "ref": "COLREGs Rules 5, 6, 19 at 35. Ang Rule 19 ay naiiba sa Rule 17; walang stand-on vessel sa restricted visibility.", "k": "Bigkasin ang tatlong pangunahing bahagi ng Rule 19 at ang karaniwang sound signals.", "u": "Ipaliwanag kung bakit walang stand-on vessel sa restricted visibility at kung ano ang ibig sabihin nito sa maniobra.", "p": "Pamunuan ang tulay sa pagpasok sa makapal na ulap, kasama ang briefing, ang pagbabago ng bilis at ang pagtatala.", "stcw": "STCW Table A-II/2 — maintain safe navigation; COLREGs."});

function renderList(f){
