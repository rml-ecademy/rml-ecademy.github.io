separately while memory is fresh", "Statements taken once the company investigator arrives", "Statements written jointly and signed by all witnesses"], "a": 1, "why": "Each witness statement is taken separately and while memory is fresh, so the accounts are not shaped by one another."}, {"q": "Why is it not enough to record only the immediate cause of an incident?", "o": ["The flag State calls for the immediate cause in a separate report", "The immediate cause cannot be established without the VDR data", "Root cause analysis is what stops the event happening again", "The P&I club will not open a file on the immediate cause alone"], "a": 2, "why": "A report exists to stop it happening again, so root cause analysis is used and not only the immediate cause, with every corrective action given a named person and a date."}], "perfrep": [{"q": "Which figures are entered in the noon report?", "o": ["Draft, trim, slip, ROB and the date of the last hull cleaning", "Position, weather, bunker prices and the ETA last given", "Speed, consumption, cargo quantity and the port charges", "Position, distance, speed, consumption and ROB"], "a": 3, "why": "The noon report records position, distance, speed, consumption and ROB, and it is the basis of any claim on speed and fuel."}, {"q": "Which scales are used to record the weather for a warranty analysis?", "o": ["Beaufort for the wind and Douglas for the sea", "Douglas for the wind and Beaufort for the sea", "Beaufort for the sea and the swell direction only", "Douglas for the current and Beaufort for the swell"], "a": 0, "why": "The good weather period is what warranty analysis uses, so the Beaufort scale for wind and the Douglas scale for sea must be recorded correctly."}, {"q": "Why should the ship keep its own weather observations when a weather router is employed?", "o": ["The router's data is not accepted by the charterer's analyst", "A difference between ship and router can turn into a dispute", "The router does not work to the Beaufort and Douglas scales", "Only the ship's own figures are entered in the official log"], "a": 1, "why": "A difference between the ship and the weather router can turn into a dispute, so the ship keeps its own observations as its shield."}], "email": [{"q": "How many subjects should a single professional email carry?", "o": ["As many as the one port call happens to cover", "Two at most, with the second one summarised", "One, with a clear subject line", "Three, listed in order of urgency"], "a": 2, "why": "One subject per email, with a clear subject line, keeps the correspondence usable when it is called for in a claim."}, {"q": "What belongs in the first paragraph of a professional email?", "o": ["The background and the history of the matter", "The parties copied and the reference numbers", "A greeting and the previous correspondence", "What happened and what you need"], "a": 3, "why": "The first paragraph carries the weight: what happened and what you need, stated in facts and times."}, {"q": "What is the correct handling of an email that has made you angry?", "o": ["Write it, leave it, and read it again before sending", "Reply at once while the facts are clear in your mind", "Send it to the owner and let them answer it for you", "Reply briefly and copy everyone in the company office"], "a": 0, "why": "You never reply while angry: write it, leave it, read it again, remembering that an email is evidence and will be read in court five years later."}], "command": [{"q": "How should an order be given on the bridge?", "o": ["To the watch as a group, so that all are aware", "One person, one task, repeated back by the taker", "To the senior officer present, who then passes it on", "Loudly, so that nobody can claim not to have heard"], "a": 1, "why": "Clear orders mean one person, one task, repeated back by the person who takes it, which is the Bridge Resource Management standard in STCW Code Section A-II/2."}, {"q": "Which instrument sets out the Master's responsibility and authority?", "o": ["STCW Regulation I/6", "SOLAS V/34-1", "ISM Code 5", "STCW Code A-VIII/2"], "a": 2, "why": "ISM Code 5 sets out the Master's responsibility and authority."}, {"q": "What is the effect of a Master admitting a mistake in front of the bridge team?", "o": ["It weakens the standing of the command", "It invites argument over later decisions", "It is better left for the debrief instead", "It builds trust rather than weakening it"], "a": 3, "why": "Admitting a mistake builds trust rather than weakening it, and it keeps the team willing to speak up."}], "sitlead": [{"q": "Which style of leadership suits a crew member who is able but short of confidence?", "o": ["Supporting", "Directing", "Coaching", "Delegating"], "a": 0, "why": "Supporting is for the person who is able but short of confidence; they are helped and encouraged rather than instructed."}, {"q": "Which style is used in an emergency, even with an experienced team?", "o": ["Supporting", "Directing", "Delegating", "Coaching"], "a": 1, "why": "In an emergency you go back to directing even with an experienced team, as STCW Code A-II/2 personnel management requires."}, {"q": "What follows when the wrong level of leadership is applied to a person?", "o": ["The task is completed but the record is left incomplete", "Authority passes to the next senior officer on board", "It brings either confusion or resentment", "The standard rises but morale slowly falls away"], "a": 2, "why": "The wrong level brings either confusion or resentment: delegating harms a person who is not yet ready, and directing harms an experienced one."}], "delegate": [{"q": "What must be stated when a task is delegated?", "o": ["The task, the tools and the person who will check it", "The task, the deadline and the entry in the deck log", "The task, the reporting line and the next inspection", "The aim, the limits and the deadline"], "a": 3, "why": "You state the aim, the limits and the deadline, not just the task, and you give the authority along with it."}, {"q": "What can the Master never hand over?", "o": ["The accountability and the overriding authority", "The authority to order work on deck", "The record of who was assigned the task", "The checking of a subordinate's work"], "a": 0, "why": "Under ISM Code Element 5 and 6 the Master holds an overriding authority that cannot be handed over; the result belongs to the team but the accountability belongs to you."}, {"q": "What is the right action when an officer given a delegated task makes a first mistake?", "o": ["Take the task back and complete it yourself", "Teach first rather than take the task back", "Hand the task to a more experienced officer", "Reduce the limits and watch the work throughout"], "a": 1, "why": "You do not take the task back at the first mistake; you teach first, and keep the agreed check point instead of watching all the time."}], "conflict": [{"q": "Which instrument governs the shipboard complaint procedure?", "o": ["ISM Code Element 5", "STCW Code A-VIII/2", "MLC 2006 Regulation 4.3", "SOLAS XI-1/6"], "a": 2, "why": "MLC 2006 Regulation 4.3 and the shipboard complaint procedure apply, and every ship carries a written complaint procedure."}, {"q": "What is the correct sequence when handling a quarrel between two crew members?", "o": ["Bring them together at once, then speak to each alone", "Record it first, then refer it to the company office", "Warn both in writing, then hear each one separately", "Hear each side separately, then bring them together"], "a": 3, "why": "Each side is heard separately before the parties are brought together, and the agreement reached is then set out clearly and followed up."}, {"q": "What should be looked for behind a quarrel on board?", "o": ["The real cause: fatigue, unfair work sharing or culture", "The rank of each party and the previous warnings given", "The wording of the complaint and the witnesses to it", "The clause of the company procedure that applies to it"], "a": 0, "why": "You look for the real cause, which is usually fatigue, unfair work sharing, culture or trouble at home, and separate the person from the problem."}], "coach": [{"q": "Which regulation covers the on-board training of junior officers?", "o": ["STCW Regulation II/1", "STCW Regulation I/6", "SOLAS V/14.3", "MLC 2006 Standard A2.3"], "a": 1, "why": "STCW Regulation I/6 and the company training policy apply, and on-board training forms part of ISM Element 6."}, {"q": "What does a good debrief after a manoeuvre cover?", "o": ["Who was at fault and what the record will show", "The next manoeuvre and the orders for it", "What went well and what to do next time", "The departure from the plan and what it cost"], "a": 2, "why": "The debrief after a manoeuvre covers what went well and what to do next time, and the progress is recorded in the appraisal and the training record."}, {"q": "Where should praise and correction each be given?", "o": ["Both in private, so that rank is not undermined", "Both at the debrief with the whole team present", "Correction in public and praise in the appraisal", "Praise in public and correction in private"], "a": 3, "why": "The rule is praise in public, correct in private, which keeps the officer willing to take on real work at the right level of challenge."}], "fatigue": [{"q": "What are the minimum hours of rest for a seafarer?", "o": ["10 hours in any 24 hours and 77 hours in any 7 days", "8 hours in any 24 hours and 70 hours in any 7 days", "10 hours in any 24 hours and 70 hours in any 7 days", "12 hours in any 24 hours and 77 hours in any 7 days"], "a": 0, "why": "STCW Code Section A-VIII/1 and MLC 2006 Standard A2.3 set a minimum of 10 hours in any 24 hours and 77 hours in any 7 days."}, {"q": "How may the 10 hours of rest be divided?", "o": ["Into three periods, one of not less than 4 hours", "Into two periods only, one of not less than 6 hours", "Into two periods only, each of not less than 5 hours", "Into three periods, one of not less than 6 hours"], "a": 1, "why": "The 10 hours can be split into two periods only, and one of them must be not less than 6 hours."}, {"q": "Why is a dressed-up record of rest hours worse than reporting a shortage of people?", "o": ["It is corrected by PSC at the next inspection in any case", "It moves the breach from the Master across to the company", "It is a breach and it hides the real danger on board", "It invalidates the watch schedule for the whole voyage"], "a": 2, "why": "The record of rest hours is kept true; a dressed-up record is a breach of MLC and it hides the danger instead of dealing with it."}], "culture": [{"q": "Which regulation requires the working language to be established and recorded?", "o": ["STCW Code A-VIII/2", "MLC 2006 Regulation 4.3", "SOLAS II-2/10.3", "SOLAS V/14.3"], "a": 3, "why": "SOLAS V/14.3 requires the working language to be established and recorded in the log book."}, {"q": "How is an order confirmed as understood on a mixed-nationality bridge?", "o": ["By closed-loop communication, with the order repeated back", "By a 'yes' from the officer who has taken the order", "By an entry made in the bell book by that officer", "By asking a senior rating to pass it on in his language"], "a": 0, "why": "Closed-loop communication is used, with the order repeated back, because a 'yes' is not always agreement and sometimes only means 'I heard you'."}, {"q": "How does high power distance show itself on the bridge?", "o": ["Orders are questioned openly and at some length", "Nobody contradicts a senior, even on seeing an error", "The working language drifts to the majority tongue", "Juniors report only to an officer of their own rank"], "a": 1, "why": "Where power distance is high, nobody contradicts a senior even when they can see an error, which is why Bridge Resource Management treats it as a barrier."}], "motiv": [{"q": "What are the three biggest real drivers of morale on board?", "o": ["Pay, leave rotation and the prospect of promotion", "Rank structure, fair watches and regular shore leave", "Food, sleep and internet", "Recreation, training and the payment of overtime"], "a": 2, "why": "Food, sleep and internet are the three biggest real drivers of morale, and morale is built rather than lucky."}, {"q": "What is the set path that discipline follows?", "o": ["Verbal caution, log entry, then repatriation", "Written warning, meeting, then flag State report", "Investigation, written warning, then dismissal", "Warning, written warning, then formal action"], "a": 3, "why": "Discipline follows a set path of warning, written warning, then formal action, with every step recorded under the company disciplinary procedure."}, {"q": "Why does a consistent standard work better than a heavy punishment?", "o": ["The same standard for everyone, since favourites kill morale", "A heavy punishment has to be approved by the flag State", "A consistent standard removes the need to keep records", "A heavy punishment may be given only after three warnings"], "a": 0, "why": "Discipline is for safety and not for punishment, and the same standard for everyone holds morale, since an unjust punishment can become a complaint to the flag State or the labour authority."}], "mpx": [{"q": "Which IMO Resolution gives the guidance on the Master-Pilot exchange?", "o": ["IMO Resolution A.893(21)", "IMO Resolution A.960", "IMO MSC.1/Circ.1228", "IMO MSC.1/Circ.1318"], "a": 1, "why": "IMO Resolution A.960 gives the guidance on the Master-Pilot exchange."}, {"q": "What is covered in the Master-Pilot Exchange before the manoeuvre?", "o": ["The pilotage dues, the tug hire and the berthing prospects", "The draft, the ballast condition and the stowage plan", "The plan, the ship's limitations, the tugs and the berthing", "The appraisal stage of the passage plan and the no-go areas"], "a": 2, "why": "The Master-Pilot Exchange covers the plan, the ship's limitations, the tugs and the berthing, and an accurate pilot card is handed over."}, {"q": "What should the Master do when the pilot's manoeuvre is no longer safe?", "o": ["Advise the pilot and let him continue the manoeuvre", "Call port control and ask for a second pilot to attend", "Stop the engines and wait for the pilot's decision", "Take the con and record that it was taken"], "a": 3, "why": "SOLAS V/34-1 provides that nobody shall restrain the Master from taking a decision for safety; when the manoeuvre is not safe you take the con and record it."}], "challenge": [{"q": "What is the two-challenge rule?", "o": ["If you have asked twice and got no answer, act for safety", "Any order is challenged twice before it is carried out", "Two officers must agree before a challenge is raised", "A challenge is repeated twice and then entered in the log"], "a": 0, "why": "Under the two-challenge rule, if you have asked twice and got no answer you act for safety, as Bridge Resource Management and STCW Code A-VIII/2 on bridge teamwork intend."}, {"q": "What set form of words is used on the bridge to raise a challenge?", "o": ["'Captain, I must put this on the record…'", "'Captain, I am concerned because…'", "'Captain, I do not agree with this…'", "'Captain, I request a change of plan…'"], "a": 1, "why": "The set form of words is 'Captain, I am concerned because…', which gives everyone a safe and recognised way to speak up."}, {"q": "Why should the officer who challenges be thanked even when he turns out to be wrong?", "o": ["It satisfies the requirement to record every challenge", "It moves the responsibility back to the Master", "Otherwise that was the last question they will ask", "It keeps the bridge team inside the standing orders"], "a": 2, "why": "You thank the one who challenges even when they are wrong, because if you do not, that was their last question."}], "planreview": [{"q": "Which IMO Resolution gives the guidelines for voyage planning?", "o": ["IMO Resolution A.960", "IMO MSC.1/Circ.1228", "IMO MSC.1/Circ.1318", "IMO Resolution A.893(21)"], "a": 3, "why": "SOLAS V/34 and IMO Resolution A.893(21) — Guidelines for voyage planning — govern the plan, which is berth to berth."}, {"q": "Where must the under keel clearance be checked when the plan is reviewed?", "o": ["At every critical point, not only at the shallowest", "At the shallowest point of the whole passage", "At each waypoint where the course is altered", "At the berth and at the standby anchorage only"], "a": 0, "why": "The Master checks the UKC at every critical point and not only at the shallowest, along with the no-go areas, the abort point and the point of no return."}, {"q": "A passage plan is signed without the pilotage stage being examined; why is that serious?", "o": ["The pilot will not accept a plan he has not seen himself", "That is the stage where groundings usually happen", "The plan then covers the ocean passage only", "The port may then refuse the pilotage exemption"], "a": 1, "why": "The plan is berth to berth and must include the pilotage and the approach, because that is where groundings usually happen."}], "restvis": [{"q": "Which COLREG Rule governs the sound signals used in restricted visibility?", "o": ["Rule 5", "Rule 6", "Rule 35", "Rule 19"], "a": 2, "why": "COLREGs Rule 35 sets the sound signals and the intervals between them in or near an area of restricted visibility."}, {"q": "Under Rule 19, which early alteration is to be avoided for a vessel forward of the beam?", "o": ["An alteration of course to starboard", "A reduction of speed without any alteration", "An alteration that opens the range steadily", "An alteration of course to port"], "a": 3, "why": "COLREGs Rule 19 provides that in an early alteration you do not turn to port for a vessel forward of the beam, and do not close a vessel abeam or abaft the beam."}, {"q": "What follows for your manoeuvring from there being no stand-on vessel in restricted visibility?", "o": ["Each vessel must act; you cannot hold your course and speed", "The vessel with the other on its starboard side keeps clear", "The vessel being overtaken stands on until finally past", "The vessel with the greater draft holds its course and speed"], "a": 0, "why": "Rule 19 differs from Rule 17: there is no stand-on vessel in restricted visibility, so each vessel must act, at a safe speed under Rule 6."}], "hwnav": [{"q": "What does the 1-2-3 rule express?", "o": ["The reduction of speed at three stages of a storm", "The forecast error of a storm at 24, 48 and 72 hours", "The distance to keep from the storm centre in miles", "The three semicircles of a tropical revolving storm"], "a": 1, "why": "The 1-2-3 rule covers the forecast error of a storm at 24, 48 and 72 hours, and is used with the dangerous and navigable semicircles."}, {"q": "Which IMO circular gives revised guidance to the master for avoiding dangerous situations?", "o": ["IMO MSC.1/Circ.1318", "IMO Resolution A.960", "IMO MSC.1/Circ.1228", "IMO Resolution A.893(21)"], "a": 2, "why": "IMO MSC.1/Circ.1228 — Revised guidance to the master for avoiding dangerous situations."}, {"q": "What is the remedy for synchronous or parametric rolling?", "o": ["Hold the course and reduce the rudder angle used", "Ballast down and keep the speed constant", "Put the sea on the quarter and hold the speed", "Change the speed or the heading"], "a": 3, "why": "Synchronous and parametric rolling are avoided by changing the speed or the heading, and the reason for the decision is recorded."}], "anchordec": [{"q": "What scope of cable is normally used in moderate weather?", "o": ["5 to 7 times the depth of water", "3 to 4 times the depth of water", "8 to 10 times the depth of water", "2 to 3 times the depth of water"], "a": 0, "why": "The scope is normally 5 to 7 times the depth in moderate weather, and more in bad weather."}, {"q": "Up to what current and wind is the anchoring equipment designed to hold?", "o": ["48 knots of current and 11 knots of wind", "11 knots of current and 48 knots of wind", "21 knots of current and 60 knots of wind", "15 knots of current and 40 knots of wind"], "a": 1, "why": "IACS UR A1 provides that the anchoring equipment is for temporary mooring in harbour and sheltered areas, up to 11 knots of current and 48 knots of wind on good holding ground."}, {"q": "What is the right decision when a storm is closing in on the anchorage?", "o": ["Stay with more cable out and the engine on standby", "Stay and put the second anchor underfoot as well", "Get out to sea, which is nearly always safer", "Shift to the inner anchorage and veer more cable"], "a": 2, "why": "The anchor gear cannot hold a ship in a storm, so getting out to sea is nearly always safer than staying at the anchorage."}], "colav": [{"q": "Which limits should the Master set in the standing orders for collision avoidance?", "o": ["The minimum rudder angle and the speed to be used", "The range scale and the vector length on the ARPA", "The distance at which the engine is put on standby", "A CPA and TCPA limit matched to the area and traffic"], "a": 3, "why": "The standing orders set a CPA and TCPA limit matched to the area and the traffic, together with a clear statement of when the Master is to be called."}, {"q": "Which kind of avoiding action is the safer one?", "o": ["Early action with a large alteration", "A small alteration repeated as needed", "A reduction of speed held to the last", "A late alteration once the aspect is clear"], "a": 0, "why": "Under COLREGs Rules 7, 8, 15, 16 and 17, early action and a large alteration are safer than a small, late one."}, {"q": "Why do many companies forbid a VHF agreement to pass clear?", "o": ["It cannot be recorded for the investigation afterwards", "It cannot be relied on to keep clear; follow the COLREGs", "It is not permitted inside a traffic separation scheme", "It keeps the officer away from the radar for too long"], "a": 1, "why": "A VHF agreement is not to be relied on to keep clear; the COLREGs are followed instead, and many collisions happen in good weather and broad daylight."}], "standorders": [{"q": "What is the difference between standing orders and night orders?", "o": ["Standing orders are the company's, night orders the Master's", "Standing orders cover the bridge, night orders the engine room", "Standing orders are permanent, night orders are for that night", "Standing orders are signed, night orders are only initialled"], "a": 2, "why": "Standing orders are permanent and night orders are for that night; they are two different documents, and standing orders form part of the SMS under STCW Code Section A-VIII/2."}, {"q": "Who signs the standing orders, and for what purpose?", "o": ["The Master alone, as the author of the orders", "The officer of the watch at the end of each watch", "The chief officer, for the whole deck department", "Every watch officer, as proof of reading and understanding"], "a": 3, "why": "The standing orders are signed by every watch officer as proof that they were read and understood, and are examined in audits."}, {"q": "Why is an order such as 'be careful' worthless in an investigation?", "o": ["It is neither specific nor measurable", "It forms no part of the safety management system", "It cannot be signed by the watch officers", "It is not covered by STCW Code A-VIII/2"], "a": 0, "why": "Orders must be specific and measurable, not 'be careful', and they are updated whenever the area, traffic, weather or equipment changes."}], "ffeport": [{"q": "What spare provision is required for the portable fire extinguishers carried?", "o": ["50 per cent for the first 10 extinguishers and 100 per cent of the rest", "100 per cent for the first 10 extinguishers and 50 per cent of the rest", "One spare charge for every extinguisher carried, up to a limit of 60", "50 per cent of the total number carried, not exceeding 10 in all"], "a": 1, "why": "SOLAS II-2/10.3 and FSS Code Chapter 4 require a spare charge or an additional extinguisher for 100 per cent of the first 10 extinguishers and 50 per cent of the rest, not exceeding 60."}, {"q": "What do the letters PASS stand for when an extinguisher is used?", "o": ["Pull, Approach, Spray, Secure", "Point, Aim, Squeeze, Stand clear", "Pull, Aim at the base, Squeeze, Sweep", "Pin out, Aim high, Spray, Sweep"], "a": 2, "why": "PASS is Pull, Aim at the base of the fire, Squeeze, Sweep, and you back away without turning your back on the fire."}, {"q": "Why is a CO₂ extinguisher weighed instead of being read off a pressure gauge?", "o": ["The gauge reads the propellant and not the agent", "A gauge cannot be fitted to a high pressure cylinder", "The gauge is checked only at the annual service", "The gauge can read full while the charge is low"], "a": 3, "why": "With CO₂ only the weight tells the truth, and more than 10 per cent below the stamped weight means the extinguisher needs a recharge."}], "ffehyd": [{"q": "What is the maximum length of a fire hose in the machinery space?", "o": ["15 m", "20 m", "25 m", "18 m"], "a": 0, "why": "Under SOLAS II-2/10.2 the hose is not more than 15 m in the machinery space, 20 m in other spaces and 25 m on the open deck of wide ships."}, {"q": "How must any part of the ship be reachable with water from the fire main?", "o": ["By one jet from the nearest hydrant", "By two jets from two different hydrants", "By two jets taken from the same hydrant", "By three jets run from the fire main"], "a": 1, "why": "Any part of the ship must be reachable by two jets from two different hydrants, and the fire main must hold the pressure at the furthest hydrant with two jets running."}, {"q": "Why is the spray setting used as you close in on a fire?", "o": ["It carries further than the jet at the same pressure", "It uses less water and keeps the bilges clear", "It is your shield against the heat", "It breaks up the surface of a burning liquid"], "a": 2, "why": "The dual purpose nozzle gives jet and spray; the spray is your shield against the heat while the jet reaches far."}], "ffepump": [{"q": "What is the minimum capacity of the emergency fire pump?", "o": ["25 per cent of the total required of the fire pumps", "80 per cent of the capacity of one main fire pump", "60 per cent of the total required of the fire pumps", "40 per cent of the total required of the fire pumps"], "a": 3, "why": "Under SOLAS II-2/10.2.2 the capacity is not less than 40 per cent of the total required of the fire pumps, and it must deliver two jets at the required pressure."}, {"q": "How must it be possible to start the emergency fire pump?", "o": ["With no power on the main switchboard and in cold conditions", "From the engine control room with the generator running", "From the bridge once the main switchboard is isolated", "By hand from the fire station with the fans stopped"], "a": 0, "why": "It must be startable with no power on the main switchboard and in cold conditions, which is what PSC asks for without entering the engine room."}, {"q": "Why is an emergency fire pump worthless if it shares its source of power with the main pumps?", "o": ["It could not then deliver two jets at the required pressure", "A fire in the machinery space would take both pumps out", "The weekly test would not show up a fault in the priming", "PSC will not accept a pump that is not driven by diesel"], "a": 1, "why": "SOLAS II-2/10.2.2 requires the emergency fire pump, its sea suction, its fuel and its source of power to be outside the space served by the main fire pumps, because that space may itself be on fire."}], "ffeco2": [{"q": "What proportion of the CO₂ must be discharged within 2 minutes in a machinery space?", "o": ["65 per cent", "75 per cent", "85 per cent", "95 per cent"], "a": 2, "why": "SOLAS II-2/10.4 and FSS Code Chapter 5 require 85 per cent to be discharged within 2 minutes."}, {"q": "What is the most important step before fixed CO₂ is released into a space?", "o": ["Stopping the fans and the fuel pumps to the space", "Sounding the alarm and running the time delay", "Opening the valve to the space at the control cabinet", "A complete head count of everybody on board"], "a": 3, "why": "A complete head count before release is the most important step; the alarm and the delay are there so that everybody can get clear."}, {"q": "Why is opening the machinery space early more dangerous than waiting several hours?", "o": ["A sudden rush of air sets the fire alight again", "The remaining CO₂ is lost before it has worked", "The concentration must be measured by the BA team", "The piping and the nozzles must be checked first"], "a": 0, "why": "The space is not opened until it has cooled and the BA team is ready, because a sudden rush of air sets it alight again, and you only get to use fixed CO₂ once."}], "ffedet": [{"q": "How many sources of power must the fire detection and alarm system have?", "o": ["One, backed by the emergency generator on demand", "Two, one of them the emergency source", "Three, including a battery sited on the bridge", "Two, both taken from the main switchboard"], "a": 1, "why": "SOLAS II-2/7 and FSS Code Chapter 9 require two sources of power, one of them the emergency source, with a visual and audible signal on the bridge."}, {"q": "Which type of detector is fitted in the galley and the other hot spaces?", "o": ["Smoke detectors", "Flame detectors", "Heat detectors", "Manual call points"], "a": 2, "why": "Heat detectors go in the galley and the hot spaces, smoke detectors in the accommodation and corridors, and flame detectors in the machinery space."}, {"q": "What must be done when a detection zone has to be isolated?", "o": ["Test the remaining zones and enter the result in the log", "Isolate it only while hot work is going on in the space", "Report it to the company and await their written approval", "Tell the others, record it, and post a fire watch"], "a": 3, "why": "A zone is never isolated without telling anyone and without recording it, and once it is isolated a fire watch is posted."}], "ffedoor": [{"q": "Against what angle of inclination must a door in an A-class division be able to close?", "o": ["25 degrees", "15 degrees", "30 degrees", "20 degrees"], "a": 0, "why": "SOLAS II-2/9 requires doors in A-class divisions to be self-closing and able to close against a 25 degree angle of inclination."}, {"q": "How often should every fire door be tried for closing?", "o": ["At every port State control inspection", "At every fire drill", "Once a month, with the result recorded", "At the annual safety equipment survey"], "a": 1, "why": "Every fire door is tried for closing at every fire drill, not only at an inspection."}, {"q": "Why is a single wedged fire door a serious matter?", "o": ["It will fail the next inspection of the accommodation", "It damages the closer and the latch over time", "Smoke can then spread through the whole accommodation", "It cannot then be released remotely from the bridge"], "a": 2, "why": "Structural fire protection under SOLAS II-2/9 holds the fire in one place, and at night it is the smoke that kills first, not the flame."}], "ffedamp": [{"q": "From where must ventilation openings be closable?", "o": ["From the bridge fire control panel", "From the fire control station only", "From inside the space they serve", "From outside the space they serve"], "a": 3, "why": "SOLAS II-2/5.2 and II-2/9.7 require ventilation openings to be closable from outside the space they serve, and the remote stop for a fan sits outside that space."}, {"q": "What does a shutdown of the machinery space cover?", "o": ["The fans, fuel pumps, purifiers and quick-closing valves", "The fans, the main engine and the emergency generator", "The fans, the dampers and the fire main isolating valve", "The fans, the bilge pumps and the boiler fuel heaters"], "a": 0, "why": "A machinery space shutdown covers the fans, fuel pumps, purifiers and quick-closing valves, since fire lives on air and the ventilation is cut first."}, {"q": "Why must every damper be operated by hand at an inspection?", "o": ["To prove the remote stop and the damper work together", "Many are seized with paint or rust and will not move", "To confirm the marking matches the space it serves", "The grease in the galley duct jams the blade in place"], "a": 1, "why": "Many dampers are seized with paint or rust, so one that is only stamped as checked and never operated will not move in a real fire."}], "ffeba": [{"q": "What is the minimum air capacity of a self-contained breathing apparatus carried for fire fighting?", "o": ["Not less than 600 litres or 15 minutes of air", "Not less than 1,200 litres or 30 minutes of air", "Not less than 1,800 litres or 45 minutes of air", "Not less than 2,400 litres or 60 minutes of air"], "a": 1, "why": "The SCBA cylinder must hold not less than 1,200 litres or 30 minutes of air and carry a low-pressure warning whistle, under SOLAS II-2/10.10 and FSS Code Chapter 3."}, {"q": "How many sets of fireman's outfit are required on a normal cargo ship and how are they stowed?", "o": ["1 set stowed at the fire control station", "2 sets stowed together in the fire locker", "Not less than 2 sets stowed in 2 separate locations", "4 sets stowed one on each deck level"], "a": 2, "why": "SOLAS II-2/10.10 requires not less than 2 sets of fireman's outfit, kept in 2 separate locations so that one fire cannot cut you off from both."}, {"q": "Why must an EEBD never be used to enter a smoke-filled enclosed space?", "o": ["Its hood is not approved for use with a lifeline", "It carries no rigid helmet or non-conductive gloves", "It is issued only to the engine room watchkeepers", "It holds about 10 minutes of air and gives no warning"], "a": 3, "why": "An EEBD carries roughly 10 minutes of air for escape only and sounds no warning as it runs out; under SOLAS II-2/13 it is a means of escape, not fire-fighting equipment."}], "ffeisc": [{"q": "What are the flange dimensions of the international shore connection?", "o": ["Outside 178 mm, inside 64 mm, bolt circle 132 mm, four 19 mm holes", "Outside 132 mm, inside 64 mm, bolt circle 178 mm, four 19 mm holes", "Outside 178 mm, inside 89 mm, bolt circle 132 mm, four 25 mm holes", "Outside 160 mm, inside 76 mm, bolt circle 120 mm, six 19 mm holes"], "a": 0, "why": "The ISC flange has an outside diameter of 178 mm, inside 64 mm, a bolt circle of 132 mm and four holes of 19 mm, to FSS Code Chapter 2."}, {"q": "What must a complete international shore connection set contain?", "o": ["4 bolts, 4 washers, 4 nuts and 2 gaskets", "8 bolts, 8 washers, 4 nuts and 1 gasket", "4 bolts, 8 washers, 2 nuts and 2 gaskets", "4 bolts, 8 washers, 4 nuts and 1 gasket"], "a": 3, "why": "The set is 4 bolts, 8 washers, 4 nuts and 1 gasket rated for fire main pressure, with an adaptor on the ship's side for her own hydrant coupling (SOLAS II-2/10.2.1.7)."}, {"q": "Where must the international shore connection be stowed, and why?", "o": ["In the engine room locker with the fire main spares", "On both sides of the ship and easy to reach", "At the fire control station under the Master's key", "In the forecastle store beside the mooring gear"], "a": 1, "why": "It must be stowed on both sides and easy to reach; kept in an engine room locker it is unreachable in the very fire where the shore supply is needed."}], "muster": [{"q": "When must the muster list be prepared and when revised?", "o": ["At the start of each voyage leg and monthly thereafter", "Within 24 hours of any new crew joining the ship", "Before the ship sails, and revised whenever the crew changes", "At each annual safety equipment survey by the Flag"], "a": 2, "why": "SOLAS III/8 and III/37 require the muster list to be prepared before the ship sails, and revised or a new one issued whenever the crew changes."}, {"q": "What must appear against every person named on the muster list?", "o": ["A specific duty and a named substitute for his absence", "His rank, nationality and date of joining the ship", "His cabin number and the lifejacket size issued", "A signature confirming he has attended a drill"], "a": 0, "why": "Under SOLAS III/8 every person is named with a specific duty, and a substitute is named for when he is absent."}, {"q": "Why is a muster list still carrying a man who has signed off a serious finding?", "o": ["It shows the Master's signature was never obtained", "It means all the cabin cards must be reprinted", "It proves the alarm signals were never explained", "It is an instant deficiency and leaves a duty unmanned"], "a": 3, "why": "An out-of-date muster list is an instant deficiency to a PSC officer and, worse, leaves an emergency duty with nobody to carry it out."}], "absdrill": [{"q": "How often must the lifeboat be lowered and manoeuvred in the water?", "o": ["At least once a month with the crew on board", "At least once every 3 months", "At least once every 6 months, weather permitting", "At least once every 12 months at the annual survey"], "a": 1, "why": "SOLAS III/19.3 requires the lifeboat to be lowered and manoeuvred in the water at least once every 3 months; the rescue boat is lowered monthly."}, {"q": "A ship sails with more than 25 per cent of her crew newly joined; when is the abandon ship drill held?", "o": ["Before the pilot disembarks at the fairway buoy", "Within the same calendar month as sailing", "At the next port of call after arrival", "Within 24 hours of sailing"], "a": 3, "why": "Where more than 25 per cent of the crew are new, the drill is held within 24 hours of sailing (SOLAS III/19.3)."}, {"q": "Why is running the same scenario at the same davit every month poor practice?", "o": ["The drill stops being conducted as if it were real", "It wears out one set of falls faster than the other", "It prevents the rescue boat being lowered monthly", "It makes the logbook entry impossible to complete"], "a": 0, "why": "SOLAS III/19.3 requires each drill to be conducted as if it were a real emergency as far as practicable; change the hour, run it at night and move the seat of the fire."}], "firedrill": [{"q": "How often must a fire drill be held for every crew member?", "o": ["Once every 2 months", "Once every 3 months", "Once a month", "Once every 10 days while in port"], "a": 2, "why": "A fire drill is held once a month for every crew member, together with the abandon ship drill where appropriate (SOLAS III/19.3.4)."}, {"q": "Which elements must a fire drill include?", "o": ["A gas test of each protected space before CO2 release", "Reporting to stations, starting a pump, checking communications", "Lowering the rescue boat and recovering a casualty from the water", "Pressure testing the whole fire main to its design pressure"], "a": 1, "why": "SOLAS III/19.3.4 states that a fire drill includes reporting to muster stations, starting a fire pump, and checking the fireman's equipment and the means of communication."}, {"q": "Why is the time taken to form the BA team a better measure than the time to extinguish?", "o": ["Because the BA cylinder gives only 10 minutes of air", "Because the fire pump cannot start until BA is ready", "Because PSC records only the BA team timing", "Because the delay in getting men in decides how far it spreads"], "a": 3, "why": "Timing the formation of the BA team shows how long until water is on the seat of the fire, and that delay is what lets the fire grow."}], "encdrill": [{"q": "How often must an enclosed space entry and rescue drill be held?", "o": ["At least once every 2 months", "At least once a month", "At least once every 3 months", "At least once every 6 months"], "a": 0, "why": "SOLAS III/19.3.6 requires an enclosed space entry and rescue drill at least once every two months; see also IMO Resolution A.1050(27)."}, {"q": "What must the rescuer wear to recover a casualty from a tank?", "o": ["An EEBD, since the entry will be brief", "A filter respirator with a full face mask", "An SCBA, never an EEBD", "No apparatus once the space has been ventilated"], "a": 2, "why": "The rescuer wears an SCBA; the EEBD is for escape only and gives no protection for entry (SOLAS III/19.3.6)."}, {"q": "Why do more men die attempting the rescue than on the first entry?", "o": ["Because the permit is issued only to the first man in", "Because they enter without apparatus to help a shipmate", "Because the atmosphere worsens after the first entry", "Because the attendant leaves to raise the alarm"], "a": 1, "why": "The would-be rescuer goes in unprotected on instinct, and within 30 seconds there are 2 casualties inside instead of 1."}], "mobresp": [{"q": "Which turn is used when nobody saw the man fall or it happened at night?", "o": ["The Anderson turn", "The Scharnov turn", "A single 180 degree turn to starboard", "The Williamson turn"], "a": 3, "why": "The Williamson turn is used when the fall was not seen or at night, because it brings the ship back down the same track (SOLAS III/17-1 and the IAMSAR Manual Volume III)."}, {"q": "What is the very first action in a man overboard situation?", "o": ["Shout and throw the lifebuoy with light and smoke", "Press the MOB button on the GPS and the ECDIS", "Broadcast the position on VHF Channel 16", "Call out the rescue boat crew for the lee side"], "a": 0, "why": "The marker goes into the water immediately and close to the man, before anything is turned."}, {"q": "Why is a dedicated observer detailed at once?", "o": ["To take the bearing needed for the Scharnov turn", "To confirm the MOB mark has been laid on the ECDIS", "To keep sight of the man with no other duty", "To relay the VHF broadcast while the Master is called"], "a": 2, "why": "Sight of the man is lost when everyone becomes busy with the turn, so one man's only duty is to look."}], "emgsteer": [{"q": "How often is an emergency steering drill held?", "o": ["At least once a month", "At least once every 3 months", "At least once every 6 months", "Within 12 hours before every departure"], "a": 1, "why": "SOLAS V/26 requires the emergency steering drill at least once every 3 months, while the steering gear itself is tested within 12 hours before departure."}, {"q": "When must the steering gear be tested before the ship sails?", "o": ["Within 48 hours before departure", "At the pilot station on leaving the port", "Within 12 hours before departure", "Immediately after the pilot disembarks"], "a": 2, "why": "SOLAS V/26 requires the steering gear to be tested within 12 hours before departure, covering full movement, the indicators and the remote control systems."}, {"q": "Why are communications with the steering gear room critical in local manual steering?", "o": ["Every order must be passed and acknowledged by voice", "The emergency compass repeater will not work without them", "The changeover of power units is done from the bridge", "The response time cannot otherwise be logged"], "a": 0, "why": "In local control the helm follows orders passed from the bridge, so communications never tested in a noisy steering gear room mean nobody hears a thing on the day."}], "sopepdrill": [{"q": "Which regulation requires the Shipboard Oil Pollution Emergency Plan?", "o": ["MARPOL Annex I Regulation 17", "MARPOL Annex II Regulation 37", "MARPOL Annex VI Regulation 14", "MARPOL Annex I Regulation 37"], "a": 3, "why": "The plan is required by MARPOL Annex I Regulation 37 and carries the list of contacts, including the coastal State and the authorities."}, {"q": "What is the first action on discovering an oil spill during bunkering?", "o": ["Plug the scuppers and spread absorbent on deck", "Stop the operation at once and shut the valve", "Photograph the spill and estimate the quantity", "Report to the terminal and the coastal State"], "a": 1, "why": "Stopping the operation and shutting the valve comes before any clean-up or reporting."}, {"q": "Why must oil on deck never be hosed over the side?", "o": ["The wash water blocks the scupper plugs", "It wastes the absorbent in the SOPEP locker", "It turns an incident into a far more serious case", "It makes the quantity harder to estimate later"], "a": 2, "why": "Washing down discharges the oil and destroys the evidence, and that is the moment an incident becomes a criminal case."}], "drillrec": [{"q": "What does SOLAS require to be entered in the logbook about drills?", "o": ["The dates of musters and drills, and details of any not fully done", "Only those drills attended by every member of the ship's crew", "A monthly summary of all drills countersigned by the company", "The serial numbers of each item of equipment used in the drill"], "a": 0, "why": "SOLAS III/19.5 requires the dates of musters and drills, and details of drills not fully carried out, to be entered in the logbook prescribed by the Administration."}, {"q": "A drill could not be completed; what goes into the record?", "o": ["Nothing, until the drill has been repeated in full", "A note that the drill was held as planned", "The next month's planned date instead", "Which part was done and why the rest was not"], "a": 3, "why": "SOLAS III/19.5 expects details of drills not fully carried out, so the entry states which part was done and the reason the rest was not."}, {"q": "Why must the participants be named rather than recorded as 'all crew'?", "o": ["Because the Master must countersign each name", "Because the names prove the monthly requirement was met", "Because PSC compares them with the rest hours record", "Because photographs are otherwise not accepted"], "a": 1, "why": "The names are what prove every crew member met the monthly requirement; 'all crew' proves nothing to an auditor."}], "lookout": [{"q": "When may the OOW act as sole lookout?", "o": ["At any time while the radar is in full working order", "On any watch while the ship is in open water", "In daylight only, when safe and with help immediately available", "At night in clear weather with light traffic"], "a": 2, "why": "Under COLREG Rule 5 and STCW Code A-VIII/2 Part 4-1 the OOW may be sole lookout in daylight only, after assessing the risk, and must always be ready to call for extra hands."}, {"q": "What is the correct scan pattern on a bridge watch?", "o": ["Eyes, radar, ECDIS, speed and helm, back to the eyes", "ECDIS, radar, AIS, then the eyes at intervals", "Radar and AIS continuously, eyes only on the targets", "Eyes ahead, then the ECDIS for the rest of the leg"], "a": 0, "why": "The scan runs eyes, radar, ECDIS, speed and helm and back to the eyes, systematically over the full horizon and astern; do not live on the screen."}, {"q": "Why is fixating on a single target one of the commonest causes of collision?", "o": ["The radar loses the target while the eyes are on it", "The AIS data for that target becomes unreliable", "The bearing of a fixated target is read wrongly", "A second target closes unseen while all eyes are on one"], "a": 3, "why": "In many collisions everyone watched a single target while a second one hit them, and a small craft with no AIS shows up to the eye only."}], "colregapp": [{"q": "Which rule tells you that a steady bearing with decreasing range means risk of collision?", "o": ["Rule 5", "Rule 7", "Rule 8", "Rule 13"], "a": 1, "why": "COLREG Rule 7 requires all available means to be used, and a steady bearing with decreasing range means risk of collision exists."}, {"q": "What does Rule 8 require of an action taken to avoid collision?", "o": ["A small alteration, repeated as the range closes", "A reduction of speed in preference to a course change", "An alteration agreed with the other vessel on VHF", "Early and large action, apparent on radar and to the eye"], "a": 3, "why": "COLREG Rule 8 requires action that is early, large and apparent on radar and to the eye; a course change shows up better than a speed change."}, {"q": "Why is there no stand-on vessel in restricted visibility?", "o": ["Rule 19 applies and neither vessel may hold on", "Rule 17 is suspended once a fog signal is sounded", "Rule 15 decides the case on the radar bearing alone", "Rule 13 governs every encounter made by radar"], "a": 0, "why": "COLREG Rule 19 governs conduct in restricted visibility, where there is no stand-on vessel and the rules are different."}], "tostand": [{"q": "What do the Master's standing orders define for the officer of the watch?", "o": ["The passage plan for the voyage in hand", "The watch rotation and the rest hour limits", "The limit of the OOW's authority to act alone", "The company's policy on port state inspections"], "a": 2, "why": "Under STCW Code A-VIII/2 and SOLAS V/34-1 the Master lays down the instructions; inside them the OOW decides, outside them he calls the Master."}, {"q": "What must the officer of the watch do with the standing orders on joining?", "o": ["File them with the passage plan on the chart table", "Read and sign them, and sign again whenever they change", "Copy the CPA limits into the night order book", "Hand them to the lookout for his briefing"], "a": 1, "why": "The orders are read and signed on joining and again whenever they change, which is the record that the OOW knows his limits."}, {"q": "Why is an early call to the Master better than an independent decision?", "o": ["It transfers responsibility for the watch to the Master", "It avoids any entry having to be made in the logbook", "It satisfies the standing orders whatever the outcome", "It is correct use of the bridge resource while sea room remains"], "a": 3, "why": "Calling is not weakness but correct use of the bridge resource; waiting leaves no time and no sea room in which to avoid."}], "nightord": [{"q": "What is the difference between standing orders and night orders?", "o": ["Night orders cover that night only and add to the standing orders", "Night orders replace the standing orders while in force", "Standing orders apply in port and night orders at sea", "Standing orders are signed and night orders are not"], "a": 0, "why": "Night orders apply to that night only — this passage, this weather and the Master's particular concern — and they do not replace the standing orders."}, {"q": "When must the night orders be read?", "o": ["At the midnight change of watch each day", "At any convenient moment during the watch", "Before the watch starts, and signed after reading", "With the logbook entry at the end of the watch"], "a": 2, "why": "They are read before the watch starts, not halfway through it, and signed afterwards as the proof of understanding (STCW Code A-VIII/2)."}, {"q": "An order in the night order book is not clear; what do you do?", "o": ["Carry out your own best interpretation and record it", "Ask the Master at once, before he turns in", "Wait and raise it at the next change of watch", "Note the doubt in the logbook and proceed"], "a": 1, "why": "Anything unclear is asked at once, before the Master turns in; your signature on the night orders says you understood the order."}], "brlog": [{"q": "Which regulation covers records of navigational activities?", "o": ["SOLAS V/19", "SOLAS V/26", "SOLAS V/34-1", "SOLAS V/28"], "a": 3, "why": "SOLAS V/28 — Records of navigational activities — requires the records to be kept for the period required by the Administration."}, {"q": "An entry in the bridge logbook is found to be wrong; how is it put right?", "o": ["One line through it, write the correction, and sign", "Cover it over neatly and rewrite the whole page", "Erase the figure and insert the right one", "Leave it and note the change at the end of the watch"], "a": 0, "why": "Nothing is covered over and nothing erased: one line through the error, the correction written in, and signed."}, {"q": "Why is writing up the whole watch at the end of it from memory unacceptable?", "o": ["The Master cannot countersign an entry that was made late", "The times are then written in the wrong tense throughout", "The times will not match the VDR and the record loses value", "Opinion inevitably replaces fact in an entry written late"], "a": 2, "why": "A record written from memory gives vague times that do not match the VDR, and a vague time is the first thing attacked in an investigation (SOLAS V/28)."}], "posmon": [{"q": "How many independent methods of position fixing should be in use?", "o": ["One, provided it is a differential GPS", "At least 2, such as GPS with a radar fix or visual bearings", "Two GPS receivers working from separate antennas", "Three, with the mean taken as the ship's position"], "a": 1, "why": "At least 2 independent methods are used — GPS with a radar fix, or visual bearings — so that a faulty source is caught (SOLAS V/19)."}, {"q": "Who sets the position fixing interval for a leg of the passage?", "o": ["The OOW, according to the traffic he finds", "The pilot, once he has boarded", "It is set in the approved passage plan", "The ECDIS, from the safety contour in use"], "a": 2, "why": "The fixing interval is part of the approved passage plan under IMO Resolution A.893(21); it is not picked at will on the bridge."}, {"q": "Why is a single GPS position dangerous even when it looks correct?", "o": ["A wrong datum alone shifts the position several hundred metres", "The GPS does not refresh at the planned fix interval", "Parallel indexing cannot be run alongside a GPS fix", "The cross-track error is not shown with a GPS fix"], "a": 0, "why": "The GPS must be cross-checked against a radar range from a known object, and a chart datum differing from the GPS datum shifts the position by several hundred metres."}], "pilotsup": [{"q": "Which resolution covers the Master–Pilot Exchange?", "o": ["IMO Resolution A.893(21)", "IMO Resolution A.1045(27)", "IMO Resolution A.601(15)", "IMO Resolution A.960(23)"], "a": 3, "why": "SOLAS V/23 covers pilot transfer arrangements and IMO Resolution A.960(23) covers the Master–Pilot Exchange."}, {"q": "Which duty is most often dropped once the pilot is on the bridge?", "o": ["Repeating back the pilot's helm and engine orders", "Fixing the ship's position at the planned interval", "Keeping the bell book of engine movements", "Watching the under keel clearance in the channel"], "a": 1, "why": "Position fixing continues while the pilot is on board and is the thing most often dropped; the pilot's arrival does not remove the duties of the Master or the OOW."}, {"q": "The OOW can see the ship heading towards shoal water while the pilot has the conn; what should he do?", "o": ["Note it in the bell book and tell the Master later", "Alter the course himself without saying anything", "Speak up at once and challenge what he sees", "Wait for the pilot to order the next course change"], "a": 2, "why": "Silence on the bridge is the biggest hazard in pilotage, and respect for the pilot is no reason to keep quiet while the Master remains responsible."}], "anchwatch": [{"q": "How is the anchor circle set on the ECDIS?", "o": ["Radius equal to the cable paid out plus the ship's length", "Radius equal to 6 times the charted depth of water", "Radius equal to the length of cable paid out only", "Radius equal to twice the ship's overall length"], "a": 0, "why": "The anchor circle radius is the cable paid out plus the ship's length, with the alarm set; a radius set too big makes the alarm come far too late."}, {"q": "Which lights and shapes does a vessel at anchor display?", "o": ["Two black balls forward by day and two anchor lights by night", "A black cone by day and one white light by night", "Three black balls by day and three all-round red lights", "An anchor ball by day and an anchor light by night"], "a": 3, "why": "COLREG Rule 30 requires the anchor ball by day and the anchor light by night for a vessel at anchor."}, {"q": "Which signs show that the ship is dragging before the alarm sounds?", "o": ["A rising rate of swing and an increase in the wind", "A beam bearing that stops changing and the cable juddering", "The anchor ball swinging and the cable going slack", "A steady GPS position with the heading changing"], "a": 1, "why": "Dragging shows as a beam bearing that stops changing, the cable juddering and the ship moving outside the anchor circle; the GPS anchor alarm alone comes too late."}], "lsainv": [{"q": "What is Form E?", "o": ["The checklist used for the annual safety equipment survey", "The liferaft service report from the service station", "The Record of Equipment listing the LSA and FFE required", "The company inventory of pyrotechnics and spare charges"], "a": 2, "why": "Form E is the Record of Equipment attached to the Safety Equipment Certificate under SOLAS I/12, and it lists the LSA and FFE required for the ship."}, {"q": "How far ahead should the expiry tracker for LSA and FFE be set?", "o": ["6 months ahead of the expiry date", "1 month ahead of the expiry date", "In the month in which the item expires", "At the next annual survey after expiry"], "a": 0, "why": "The tracker runs 6 months ahead, not in the month of expiry, so the order is raised before pyrotechnics or batteries run out."}, {"q": "Why can one missing lifejacket become a detainable deficiency?", "o": ["Because the liferaft service report then lapses", "Because the lifejacket lights must all be renewed", "Because the Flag must be notified within 24 hours", "Because the ship no longer carries what Form E lists"], "a": 3, "why": "What the Record of Equipment (Form E) lists is what must be on board, nothing short, so a shortfall is a failure against the Safety Equipment Certificate under SOLAS I/12."}], "seqpms": [{"q": "Which of these is a weekly item in the safety equipment PMS?", "o": ["The davit load test and the hook release gear", "The lifeboat engine, emergency lighting and fire pump", "All fire hoses, extinguishers and BA sets", "The hydrostatic test of the SCBA cylinders"], "a": 1, "why": "Weekly items are the lifeboat engine, emergency lighting, the alarm system, the fire pump and a test of one detector; hoses, extinguishers and BA sets are monthly (SOLAS III/20)."}, {"q": "Which regulation covers operational readiness, maintenance and inspection of LSA?", "o": ["SOLAS II-2/14", "SOLAS II-2/10.10", "SOLAS I/12", "SOLAS III/20"], "a": 3, "why": "SOLAS III/20 covers operational readiness, maintenance and inspections of LSA, while SOLAS II-2/14 covers the FFE maintenance plan."}, {"q": "Why is a generic checklist not enough for safety equipment maintenance?", "o": ["Every make calls for something different in its own manual", "PSC accepts only the company's own printed forms", "A generic list cannot carry a signature and a date", "Class requires the list to name every serial number"], "a": 0, "why": "The maker's manual is used instead of a generic list because every make calls for something different; see also MSC.1/Circ.1432."}], "defrep": [{"q": "Which ISM Code element covers reports and analysis of non-conformities and accidents?", "o": ["Element 7", "Element 8", "Element 9", "Element 10"], "a": 2, "why": "ISM Code Element 9 covers reports and analysis of non-conformities, accidents and hazardous occurrences; Element 10 covers maintenance of the ship and equipment."}, {"q": "What must accompany the report of a failed item of safety equipment?", "o": ["A repair quotation from an approved yard ashore", "A temporary safeguard such as a fire watch or isolation", "A note that repair will follow at the next port", "The Flag State's written approval of the deviation"], "a": 1, "why": "A temporary safeguard — fire watch, isolation, warning notice or a ban on use — goes in place at once alongside the report (ISM Code Element 10)."}, {"q": "Why is an unreported defect treated more seriously than the defect itself?", "o": ["Because the defect list then carries no number for it", "Because the company cannot then claim on insurance", "Because the certificate is suspended automatically", "Because it puts the whole safety management system in doubt"], "a": 3, "why": "A defect held over turns a small item into a big question about the whole system, which is exactly what ISM Code Element 9 reporting exists to prevent."}], "pscchk": [{"q": "Under which instruments is Port State Control carried out?", "o": ["SOLAS I/19, with MARPOL and the Paris and Tokyo MOU", "SOLAS I/12, with the Safety Equipment Certificate", "SOLAS V/28 and the Administration's own records", "ISM Code Element 9 and the company's internal audits"], "a": 0, "why": "Port State Control is carried out under SOLAS I/19, MARPOL and the Paris and Tokyo MOU, whose procedures list the detainable deficiencies."}, {"q": "Which record is often the first one a PSC officer examines?", "o": ["The bridge logbook for the previous passage", "The liferaft and davit service reports", "The rest hours against the logbook and overtime record", "The Garbage Record Book for the last 3 ports"], "a": 2, "why": "Rest hours must be consistent with the logbook and the overtime record, and this is often looked at first."}, {"q": "Why does a rushed clean-up on the last night before an inspection fail?", "o": ["The paint is still wet when the inspector comes on board", "An inspector can tell yesterday's work from routine order", "It leaves no time to check the certificates and records", "The crew then have no rest hours left to show the inspector"], "a": 1, "why": "The ship is prepared every day and the checklist is only a reminder; an inspector can tell what was done yesterday from what is done routinely."}], "flagsup": [{"q": "Which regulations cover survey and inspection?", "o": ["SOLAS I/12 and I/19", "SOLAS III/20 and II-2/14", "SOLAS V/23 and V/26", "SOLAS I/6 and I/7"], "a": 3, "why": "SOLAS I/6 and I/7 cover survey and inspection, with Class acting as a Recognised Organization for the Flag in many statutory surveys."}, {"q": "What preparation does the previous survey report call for?", "o": ["Evidence that every earlier observation has been closed out", "A fresh copy signed by the company superintendent", "A translation into the surveyor's working language", "Its replacement by the current PMS printout"], "a": 0, "why": "The first thing a surveyor looks for is whether the old observations were closed out, so the last report and the actions taken on it are made ready."}, {"q": "Why is declaring a defect early better than letting the surveyor find it?", "o": ["The survey can then be postponed to the next port", "A declared defect is not entered in the report", "It keeps the true condition and the repair plan credible", "Class then carries the cost of the repair work"], "a": 2, "why": "You state the true condition and the repair plan rather than over-promise, because credibility is what the whole survey rests on (SOLAS I/6 and I/7)."}], "signage": [{"q": "Which resolution covers escape route signs and equipment location markings?", "o": ["IMO Resolution A.760(18), which remains in force", "IMO Resolution A.1116(30), which superseded A.760(18)", "IMO Resolution A.1050(27)", "IMO Resolution A.1045(27)"], "a": 1, "why": "IMO Resolution A.1116(30) covers escape route signs and equipment location markings and superseded A.760(18); means of escape are in SOLAS II-2/13."}, {"q": "How are escape routes in the accommodation marked?", "o": ["By painted arrows at each deck landing", "By a plan posted at the stairway entrance", "By low-location lighting or photoluminescent marking", "By illuminated exit boxes on the emergency circuit"], "a": 2, "why": "SOLAS II-2/13 requires escape routes to be marked with low-location lighting or photoluminescent marking in the accommodation."}, {"q": "Why does an IMO symbol matter more than wording on a safety sign?", "o": ["It carries one meaning worldwide whatever language the crew speak", "It survives painting and weathering better than lettering", "It is the only marking that Port State Control accepts", "It can be read in smoke because it is photoluminescent"], "a": 0, "why": "In smoke and confusion nobody reads — they look for a symbol — and IMO symbols have one meaning worldwide, whatever language the crew speaks."}], "squat": [{"q": "How does squat vary with the ship's speed?", "o": ["In direct proportion to the speed", "With the cube of the speed", "With the speed through the water only", "With the square of the speed"], "a": 3, "why": "Squat grows with the square of the speed, so halving the speed cuts squat by roughly 4 times."}, {"q": "What is the most effective remedy against squat in a shallow channel?", "o": ["Trimming the ship by the stern before entry", "Slowing down", "Using more rudder to hold the track", "Taking a tug on the quarter"], "a": 1, "why": "The most effective remedy is to slow down: halving the speed cuts squat by roughly 4 times."}, {"q": "What happens to the ship under bank effect?", "o": ["The bow is drawn to the bank and the stern pushed away", "Bow and stern are both drawn bodily towards the bank", "The stern is drawn to the bank and the bow pushed away", "The ship is set bodily off the bank with no turning effect"], "a": 2, "why": "Under bank effect the stern is drawn towards the bank and the bow pushed away, and it becomes a sheer if it is not countered early."}], "pilotarr": [{"q": "At what height from the water must a combination ladder be used?", "o": ["More than 9 m", "More than 5 m", "More than 12 m", "More than 15 m"], "a": 0, "why": "Where the height from the water is more than 9 m a combination ladder with an accommodation ladder is used, under SOLAS V/23 and IMO Resolution A.1045(27) as amended by Resolution A.1108(29)."}, {"q": "What must be ready at the pilot transfer position?", "o": ["A safety harness, a fall arrester and a boarding net", "Two heaving lines, a boat rope and a spare ladder", "A rescue boat lowered to the water and a swimmer", "Manropes, a lifebuoy with light, a heaving line and a stretcher"], "a": 3, "why": "Manropes, a lifebuoy with self-igniting light, a heaving line and a stretcher are ready at the position, with a responsible officer in radio contact with the bridge (SOLAS V/23)."}, {"q": "Why are joins and shackles in the middle of a pilot ladder prohibited?", "o": ["They stop the ladder being stowed on its reel", "The ladder must be one continuous length to the point of access", "They make the ladder's marking and record invalid", "They catch on the bottom platform of the accommodation ladder"], "a": 1, "why": "The ladder must be one continuous length to the point of access with no joins and no shackles in the middle, under IMO Resolution A.1045(27) as amended by Resolution A.1108(29)."}], "emgman": [{"q": "Which resolution covers the provision and display of manoeuvring information?", "o": ["IMO Resolution A.893(21)", "IMO Resolution A.960(23)", "IMO Resolution A.601(15)", "IMO Resolution A.1050(27)"], "a": 2, "why": "IMO Resolution A.601(15) covers the provision and display of manoeuvring information, and with SOLAS V/28 requires the pilot card, wheelhouse poster and manoeuvring booklet to be displayed."}, {"q": "Where do the ship's head reach and turning circle figures come from?", "o": ["The manoeuvring booklet and the wheelhouse poster", "The passage plan prepared for the voyage", "The Record of Equipment attached to the certificate", "The VDR record of the last emergency turn"], "a": 0, "why": "The manoeuvring booklet and the wheelhouse poster are where the figures come from, and they are read before they are needed (IMO Resolution A.601(15))."}, {"q": "Why is an early emergency turn usually better than a crash stop?", "o": ["A crash stop risks serious damage to the main engine", "The rudder is unaffected by the loading condition", "Astern power of that order is not available on every ship", "Early full rudder works better than braking at the last moment"], "a": 3, "why": "Early full rudder works better than braking at the last moment, and the true head reach laden can be nearly double the trial figure taken in ballast."}], "charter": [{"q": "Under a time charter, who pays for the bunkers and the port costs?", "o": ["The owner, while the charterer pays the freight rate", "The charterer, who also orders the routing", "The owner and the charterer in equal shares", "The charterer for bunkers and the owner for port costs"], "a": 1, "why": "On a time charter the charterer hires the ship by the day, pays for bunkers and port costs and orders the routing; on a voyage charter the owner pays these."}, {"q": "Which charter party form is commonly used for a voyage charter?", "o": ["NYPE", "BALTIME", "BARECON", "GENCON"], "a": 3, "why": "GENCON is the common voyage charter form, while NYPE and BALTIME are time charter forms."}, {"q": "A charterer's employment order would put the ship in danger; what does the Master do?", "o": ["Refuse it, because an unsafe order is never followed", "Comply and record his objection in the logbook", "Comply, since the charterer is paying for the time", "Ask the owner to amend the charter party first"], "a": 0, "why": "On time charter the Master follows the charterer's employment orders but never an order that is unsafe; safety never sits below commerce."}], "laytime": [{"q": "At what rate is despatch usually paid?", "o": ["At the same rate as demurrage", "At twice the demurrage rate", "At about half the demurrage rate", "At the daily hire rate of the charter"], "a": 2, "why": "Demurrage is the penalty for running over laytime and despatch the reward for finishing early, usually at half the demurrage rate."}, {"q": "When does laytime start to run?", "o": ["On the ship's arrival at the pilot station", "After the NOR and the turn time set in the charter party", "When the first parcel of cargo is loaded", "On receipt of free pratique from the authorities"], "a": 1, "why": "Laytime starts after the NOR and the turn time set in the charter party, and the laytime rules themselves are in the charter party."}, {"q": "Why does a Statement of Facts reading 'rain stopped work' with no times fail the owner?", "o": ["The charterer may then refuse the whole time sheet", "The exception moves to the SHEX provision instead", "The agent must then sign the SOF in the Master's place", "The exception cannot be counted and the money is lost"], "a": 3, "why": "The calculation rests on the Statement of Facts and the time sheet, so without the exact times of every stoppage the exception cannot be counted and the owner loses the money."}], "nor": [{"q": "On what does a valid Notice of Readiness depend?", "o": ["The ship being genuinely ready in every respect and arrived", "The ship having berthed and opened her hatches for survey", "The agent confirming that a berth is available for her", "The charterer accepting it in writing within 24 hours of tender"], "a": 0, "why": "The ship must be genuinely ready in every respect — physically, legally and in her documents — and be an arrived ship at the place the charter party names."}, {"q": "How must the Notice of Readiness be tendered?", "o": ["By VHF to the port control on arrival", "Verbally to the terminal foreman at the berth", "In writing, to the right person, within the stated hours", "By email to the charterer at any hour of the day"], "a": 2, "why": "The NOR is tendered in the right manner and at the right time — in writing, to the right person, within the stated hours — with a copy and the proof of receipt kept."}, {"q": "The NOR was tendered before free pratique was granted; what is the effect?", "o": ["Laytime runs from the tender but the turn time doubles", "It is invalid, and the clock starts only on a valid NOR", "The charterer must accept it subject to a reservation", "The time counts as demurrage from the moment of tender"], "a": 1, "why": "Free pratique and customs clearance are needed before the NOR is valid where the agreement requires them; an invalid NOR means the clock starts days later, as in The Happy Day."}], "sof": [{"q": "Which entries must always appear on the Statement of Facts for a port call?", "o": ["Berthing and completion of cargo only, with the agent's remarks", "Arrival drafts, cargo quantity and the stowage plan as loaded", "Arrival, NOR, berthing, start and completion of cargo, with exact times", "Hire rate, laytime allowed and the demurrage due under the charter"], "a": 2, "why": "The SOF is the hour-by-hour history of the port call and must record every event with its exact time. It works together with the laytime provisions of the charter party."}, {"q": "What do you do when the terminal disagrees with the times you have entered on the Statement of Facts?", "o": ["Sign under reservation, stating the times the ship recorded", "Refuse to sign and let the agent settle it with the charterer", "Enter 'about' against the disputed times so both versions fit", "Sign as presented and send a letter of protest after sailing"], "a": 0, "why": "Where the terminal disagrees the SOF is signed under reservation. Refusing to sign leaves the ship with no record of its own position, and 'about' or 'approx' weakens the whole document."}, {"q": "Why is it wrong to sign the Statement of Facts quickly because the ship is in a hurry to sail?", "o": ["Because the agent cannot countersign a document signed at short notice", "Because laytime does not begin to count until all parties have signed", "Because the charterer is entitled to 24 hours to review the document", "Because times contradicting the deck and cargo logs are looked for first"], "a": 3, "why": "The SOF must match the deck log and the cargo log, because the other side looks for contradictions first. A ship signed in haste and carried times that did not match her own logbook."}], "bunkers": [{"q": "What must the Bunker Delivery Note show on completion of bunkering?", "o": ["Flash point, viscosity and the loading port of the barge", "Sulphur content, density and the quantity delivered", "Cetane index, ash content and the price agreed per tonne", "Water content, pour point and the supplier's tax number"], "a": 1, "why": "MARPOL Annex VI Regulation 18 requires a Bunker Delivery Note showing sulphur content, density and quantity, with the copy and the representative sample retained on board for the prescribed period."}, {"q": "Which tanks are gauged at the bunker survey before and after delivery?", "o": ["Only the tanks nominated to receive the new bunker", "The receiving tanks and the settling tanks in use", "Every tank on board, including those not being bunkered", "The receiving tanks and the daily service tanks only"], "a": 2, "why": "The bunker survey before and after requires every tank to be gauged, including those not being bunkered, so the ROB figures cannot be challenged."}, {"q": "When must a letter of protest be raised for a short delivery of bunkers?", "o": ["Within 3 days of completion, once the figures are checked ashore", "On arrival at the next port, together with the noon reports", "After the laboratory result on the retained sample is received", "At once, before the ship sails, as soon as there is any doubt"], "a": 3, "why": "Protest at once for short delivery or any doubt over quality and do not wait until you sail. A ship that waited 3 days lost the right because the protest came too late."}], "speedclaim": [{"q": "What is normally taken as good weather in a speed and consumption warranty?", "o": ["Up to Beaufort 4 and Douglas 3, subject to the agreement", "Up to Beaufort 6 and Douglas 4, subject to the agreement", "Up to Beaufort 3 and Douglas 2, in all loaded conditions", "Up to Beaufort 5 and Douglas 3, in the ballast condition only"], "a": 0, "why": "Good weather is usually up to Beaufort 4 and Douglas 3, but it turns on the agreement. The clause is found in the performance clause of the charter party, usually on the NYPE form."}, {"q": "What must a noon report contain if it is to stand as evidence in a performance claim?", "o": ["Bunkers ROB, cargo quantity and the ETA at the next port", "Engine revolutions, slip and the running hours of the main engine", "Draft, trim, displacement and the propeller pitch in use", "Time, distance, speed, consumption, wind, sea and current"], "a": 3, "why": "The noon report is the evidence in the fight and must give time, distance, speed, consumption, wind, sea and current, with the current and the ship's own slip recorded."}, {"q": "Why does consistency in reporting matter more than a good-looking speed figure?", "o": ["Because the weather routing company accepts averaged figures only", "Because the warranty is an average over the voyage, not over one day", "Because an improved figure becomes the charterer's evidence against the ship", "Because the owner reports the same figures separately to the class society"], "a": 2, "why": "A sudden change in the way the ship reports is noticed immediately, and a figure improved to avoid questions was used by the charterer as evidence against the ship."}], "delredel": [{"q": "What is measured and recorded at an on-hire survey?", "o": ["Condition of holds and equipment and the ROB of each grade of bunker", "Hull thickness, coating condition and the cargo gear test records", "Draft survey figures and the quantity of cargo remaining on board", "Crew certificates, manning levels and the open defect list of the ship"], "a": 0, "why": "The on-hire and off-hire survey records the condition of holds and equipment and the exact ROB of each grade of bunker."}, {"q": "Who pays for the bunkers remaining on board at delivery under a time charter?", "o": ["The owner, who keeps title to them until the ship is redelivered", "The charterer buys them, and the owner buys them back at redelivery", "They are shared equally between owner and charterer at market price", "The charterer pays nothing for them until they have been consumed"], "a": 1, "why": "The bunkers on delivery are bought by the charterer and on redelivery bought back by the owner, at the agreed price; the clauses cover bunkers on delivery and redelivery (BOD and BOR)."}, {"q": "Why are photographs taken at both the on-hire and the off-hire survey?", "o": ["Because class requires a photographic record of hold coatings at docking", "Because the independent surveyor cannot sign the report without them", "Because the charterer is entitled to a copy before the redelivery notice", "Because they are the strongest evidence when old damage is charged later"], "a": 3, "why": "Photographing everything at both surveys is the strongest evidence in a dispute over hold condition. With no photographs at delivery, old damage was charged to the charterer, who refused to pay."}], "bol": [{"q": "What are the three functions of the Bill of Lading?", "o": ["A customs declaration, a cargo manifest and a record of stowage", "A receipt for the cargo, evidence of the contract and a document of title", "A receipt for the cargo, a freight invoice and a delivery order", "Evidence of the contract, a mate's receipt and an insurance policy"], "a": 1, "why": "The Bill of Lading is a receipt for the cargo, evidence of the contract and a document of title. In most jurisdictions it falls under the Hague-Visby Rules."}, {"q": "Where do the remarks on a Bill of Lading come from?", "o": ["The surveyor's report issued after the completion of loading", "The shipper's own declaration of the condition of the goods", "The Mate's Receipt, the first record of the cargo condition", "The cargo manifest prepared by the agent before departure"], "a": 2, "why": "The Mate's Receipt is the first record of cargo condition and the remarks on the B/L come from it; quantity, marks and description must agree with what was actually received."}, {"q": "What protection does a letter of indemnity give when a clean B/L is signed against defective cargo?", "o": ["It transfers the liability to the shipper once the cargo is discharged", "It holds good provided the Master notes the defects in the deck log", "It is accepted by the P&I Club if the owner approves it in writing", "None, since it is normally unenforceable and carries no P&I cover"], "a": 3, "why": "A letter of indemnity for a clean B/L against defective cargo is normally unenforceable and carries no P&I cover; on the claim the ship paid and the insurance gave no cover."}], "pscstrat": [{"q": "What tells y
