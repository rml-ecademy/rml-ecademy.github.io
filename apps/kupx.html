, "why": "A2 is the area within MF DSC coverage, typically out to 100 nm, lying outside A1 (SOLAS Chapter IV, Regulation 2 and 8 to 11)."}, {"q": "On a voyage crossing A1, A2 and A3, what fixes the radio equipment the ship must carry?", "o": ["The area in which the ship will spend the longest time", "The area declared on the ship's Safety Radio Certificate", "The furthest sea area that the voyage reaches", "The area in which the port of departure lies"], "a": 2, "why": "The carriage requirement follows the furthest sea area on the voyage (SOLAS Chapter IV, Regulation 2 and 8 to 11)."}, {"q": "What is the primary means of distress alerting in sea area A4?", "o": ["HF radio, the other means not being available there", "Inmarsat, which gives coverage above 70° N", "MF DSC, which gives the longest ground-wave range", "VHF DSC, working through the nearest coast station"], "a": 0, "why": "A4 lies outside Inmarsat geostationary coverage, so HF is the primary means (SOLAS Chapter IV, Regulation 2 and 8 to 11)."}], "distmsg": [{"q": "How old at most may the position carried in a distress alert be?", "o": ["30 minutes", "1 hour", "2 hours", "4 hours"], "a": 3, "why": "A distress alert must carry a position with a time stamp no more than 4 hours old (SOLAS Chapter IV and the IAMSAR Manual Volume III)."}, {"q": "The main engine has failed with the ship in a safe position and nobody in danger; which priority do you use?", "o": ["MAYDAY, the ship having lost its propulsion", "PAN-PAN, the situation being serious but not life-threatening", "SECURITE, as the safety of navigation is affected", "A routine call to the coast station, there being no danger"], "a": 1, "why": "PAN-PAN is the urgency signal for a serious situation with no immediate danger to life, such as loss of main engine in a safe position (SOLAS Chapter IV)."}, {"q": "What is done immediately after a DSC distress alert has been sent by accident?", "o": ["Switch off the DSC and inform the Master at the end of the watch", "Wait for the coast station to acknowledge before taking any action", "Cancel it at once on the same means and frequency, then report it", "Send a SECURITE message to all stations explaining the error"], "a": 2, "why": "A false alert is cancelled at once on the same means and frequency and then reported; an uncancelled alert can draw a full SAR response and a penalty (SOLAS Chapter IV and the IAMSAR Manual Volume III)."}], "reserve": [{"q": "For how long must the reserve source of energy supply the radio installation on a ship that has an emergency source of power?", "o": ["1 hour", "3 hours", "6 hours", "12 hours"], "a": 0, "why": "SOLAS IV/13 requires 1 hour where the ship has an emergency source of power and 6 hours where it does not."}, {"q": "What must the reserve source of energy be able to supply?", "o": ["The VHF alone, that being the primary distress means", "The MF or HF installation alone, the VHF having its own battery", "The whole bridge, including the navigation equipment", "The VHF and the MF, HF or Inmarsat installation at the same time"], "a": 3, "why": "The reserve source must power the VHF together with the MF, HF or Inmarsat installation simultaneously (SOLAS IV/13)."}, {"q": "Why is a healthy voltage reading not proof that the reserve battery is fit for service?", "o": ["Because the reading is taken before the automatic changeover operates", "Because voltage can read high and still collapse once load is applied", "Because the required reading alters with the temperature of the compartment", "Because the charger masks the true reading while it remains connected"], "a": 1, "why": "Condition is proved by the monthly on-load check and the annual capacity or discharge test, not by voltage alone, and the results are entered in the radio log (SOLAS IV/13)."}], "radiolog": [{"q": "How often must the ship's position be entered in the radio log?", "o": ["At the start of every watch", "At least once every 4 hours", "At least once each day", "Only when distress traffic has been handled"], "a": 2, "why": "SOLAS IV/17 and the ITU Radio Regulations require the ship's position to be recorded at least once each day, which assists SAR."}, {"q": "Who signs the radio log?", "o": ["The Master and the radio operator", "The designated GMDSS operator alone", "The officer of the watch, for his own entries only", "The Master alone, on behalf of the ship"], "a": 0, "why": "The log is signed by the Master and the operator and retained for the period the flag requires (SOLAS IV/17 and the ITU Radio Regulations)."}, {"q": "Besides the required tests and distress traffic, what else must be entered in the radio log?", "o": ["The daily consumption of the reserve battery", "Copies of all routine commercial traffic handled", "The serial numbers of the EPIRB and the SART", "Any breakdown and repair of radio equipment"], "a": 3, "why": "Breakdowns and repairs of radio equipment are recorded in the log, which is held at the radio station ready for inspection (SOLAS IV/17 and the ITU Radio Regulations)."}], "gmdsstests": [{"q": "Which DSC test is carried out daily?", "o": ["A DSC test call to a coast station within range", "An internal DSC test carried out without radiation", "An on-load check of the reserve source of energy", "A self-test of the EPIRB and an inspection of the SART"], "a": 1, "why": "The daily test is an internal DSC test without radiation, together with a check of the printer and the reserve battery voltage (SOLAS IV/15.9)."}, {"q": "At what interval are the on-load battery check and the inspection of antennas and insulators carried out?", "o": ["Daily", "Weekly", "Monthly", "Quarterly"], "a": 2, "why": "The on-load battery check, the condition of antennas and insulators and the inspection of EPIRB and SART are monthly items (SOLAS IV/15.9)."}, {"q": "Why is an EPIRB never activated as a means of testing it?", "o": ["Because it transmits a false distress and brings a SAR investigation", "Because activation takes the battery below its required capacity", "Because the beacon then has to be re-registered with the flag", "Because water in the test circuit damages the hydrostatic release"], "a": 0, "why": "The EPIRB has its own self-test and must never be allowed to transmit; activation produces a false distress and an investigation by the SAR authority (SOLAS IV/15.9)."}], "navchk": [{"q": "Who signs a completed navigation equipment checklist?", "o": ["The Master, who reviews it before the manoeuvre", "The officer of the watch at the time of departure", "Any deck officer, on behalf of the bridge team", "The officer who actually carried out the checks"], "a": 3, "why": "The checklist is signed by the officer who did the work and nobody else can sign for it; the Master reviews it before the manoeuvre (SOLAS V/19 and ISM Code Element 7)."}, {"q": "How is each item on the checklist to be marked?", "o": ["With a tick to show that the item was sighted", "With a clear pass or fail against each item", "With a signature against each heading of the list", "With the time at which the item was checked"], "a": 1, "why": "Every item receives a clear pass or fail rather than a tick, and a failed item gets a defect entry and an interim measure (SOLAS V/19 and ISM Code Element 7)."}, {"q": "Why is a checklist filled in at the chart table after the event such a serious audit finding?", "o": ["Because the Master cannot countersign entries made after the manoeuvre", "Because the checklist then falls outside the SMS document control system", "Because the equipment was never actually checked, so the record is false", "Because the times entered will not agree with the bridge movement book"], "a": 2, "why": "The checklist must be completed while checking, so a pre-filled or back-filled list proves nothing and is the most common internal audit finding (SOLAS V/19 and ISM Code Element 7)."}], "prearr": [{"q": "Within what period before departure must the steering gear be tested?", "o": ["Within 12 hours before departure", "Within 24 hours before departure", "Within 48 hours before departure", "At any time during the port stay"], "a": 0, "why": "SOLAS V/26 requires the steering gear to be tested within 12 hours before departure, including the power units, the remote and the emergency steering."}, {"q": "How often must the emergency steering drill be carried out?", "o": ["Once every month", "Once every 2 months", "Once every 6 months", "Once every 3 months"], "a": 3, "why": "The emergency steering drill is carried out at least once every 3 months (SOLAS V/26)."}, {"q": "Why must every steering gear power unit be tested and not only the one in use?", "o": ["Because the rudder angle indicator is fed from one unit only", "Because a fault in a standby unit only shows when that unit is run", "Because the test must show the full lock-to-lock time on each unit", "Because class requires each unit to be logged separately after testing"], "a": 1, "why": "SOLAS V/26 requires all power units to be tested; a standby unit that is never run can be defective without anyone knowing until it is needed."}], "navdefect": [{"q": "Where is a navigation equipment defect tracked until it is closed out?", "o": ["In the deck logbook, until the repair has been made", "In the bridge order book, for the duration of the voyage", "In the planned maintenance system, tracked until closed", "In the radio log, with the Master's signature against it"], "a": 2, "why": "The defect is entered in the planned maintenance system and tracked until closed, then tested and recorded before return to service (SOLAS V/16 and ISM Code Element 9)."}, {"q": "With only one radar serviceable, what must go with the defect report?", "o": ["An interim measure, such as an extra lookout, with the plan updated", "A request to the terminal to delay the ship until repairs are done", "A note in the deck log that the second radar is under repair", "A report to class, to be made at the next scheduled survey"], "a": 0, "why": "Mitigation such as an extra lookout must be put in place and the passage plan updated where the ship's capability is affected (SOLAS V/16 and ISM Code Element 9)."}, {"q": "Why is reporting a navigation defect not enough on its own?", "o": ["Because the company cannot approve a repair without a class inspection", "Because the Administration must be informed before the ship may sail", "Because the entry has no effect until the equipment is tested again", "Because the risk stays the same until a mitigating measure is in place"], "a": 3, "why": "A defect is a risk to be managed for as long as it is unrepaired, so an interim measure is needed in addition to the report (SOLAS V/16 and ISM Code Element 9)."}], "cargoplan": [{"q": "Who signs the cargo plan before cargo operations begin?", "o": ["The Chief Officer, as the officer responsible for cargo", "The Master, before operations start", "The terminal representative and the Chief Officer jointly", "The charterer's surveyor, acting for the owner"], "a": 1, "why": "The cargo plan is signed by the Master before operations start (SOLAS VI/2 and VI/5)."}, {"q": "At what point in the operation must shear force and bending moment be checked?", "o": ["In the final departure condition, once all cargo is on board", "In the arrival and the departure conditions, taken together", "At every stage of the operation, not only in the final condition", "At the stage at which the deepest draught is reached"], "a": 2, "why": "Stress must be checked at every stage, since the limits can be exceeded midway even where the final condition is correct (SOLAS VI/2 and VI/5)."}, {"q": "The departure condition is within limits, but the bending moment went over the limit midway through loading; what does that mean?", "o": ["The ship can be damaged at that stage, so every stage must be checked", "The excess is acceptable while the ship lies alongside and static", "It matters only where the excess remains at the time of departure", "The loading computer corrects for it by the final stage of loading"], "a": 0, "why": "Structural damage occurs at the stage where the limit is exceeded, which is why the plan is checked stage by stage (SOLAS VI/2 and VI/5)."}], "loadseq": [{"q": "What must each stage of the loading sequence carry?", "o": ["A separate stability calculation approved by the Master", "An entry in the statement of facts signed by the terminal", "A revised maximum loading rate agreed with the terminal", "A check point for draught, list, stress and ullage"], "a": 3, "why": "Every stage has a check point at which draught, list, stress and ullage are confirmed (SOLAS VI/7.3 and the BLU Code)."}, {"q": "Why is fast loading into one hold dangerous while deballasting is running slow?", "o": ["It raises the air draught beyond the limit for the loading gear", "Stress and draught exceed their limits before ballast catches up", "It causes the cargo to shift towards the after end of the hold", "It takes GM below the minimum stated in the loading manual"], "a": 1, "why": "Deballasting must be matched to the loading rate so that draught and stress stay within limits (SOLAS VI/7.3 and the BLU Code)."}, {"q": "Which instrument sets the requirement for an agreed loading and unloading plan on a bulk carrier?", "o": ["The IMSBC Code, through the individual cargo schedule", "The Grain Code, through its intact stability criteria", "The BLU Code, through the agreed loading plan", "The CSS Code, through the securing arrangements"], "a": 2, "why": "SOLAS VI/7.3 and the BLU Code require the loading plan to be on board and agreed with the terminal before the start."}], "cargotrim": [{"q": "What is the effect of alternate hold loading compared with homogeneous loading?", "o": ["A higher GM, but higher stress on the structure", "A lower GM, with the stress spread more evenly", "A higher GM, with lower stress than homogeneous loading", "A lower GM, but a greater trim by the stern"], "a": 0, "why": "Alternate hold loading gives a higher GM but also higher stress, whereas homogeneous loading is easier on the structure and gives a lower GM (ship's loading manual and approved stability booklet)."}, {"q": "How is hogging or sagging identified from the draught readings?", "o": ["From the difference between the forward and the after draught", "From the difference between the calculated and the read draught", "From the trim compared with the figure in the trim table", "From the difference between the mean draught and the midship draught"], "a": 3, "why": "Hogging and sagging show in the difference between the mean draught and the midship draught (ship's loading manual and approved stability booklet)."}, {"q": "Why can an alternate loading pattern not simply be copied from a similar ship?", "o": ["Because the stability booklet gives GM limits for one condition only", "Because it is permitted only where the ship's own loading manual allows it", "Because the trim by the stern required differs from one ship to another", "Because class approval is given for each voyage rather than each ship"], "a": 1, "why": "On a bulk carrier, alternate loading is permitted only where the ship's own loading manual states it (ship's loading manual and approved stability booklet)."}], "loadcomp": [{"q": "How often must the loading instrument be verified using the test conditions in its manual?", "o": ["At each intermediate survey", "Every 6 months", "Annually", "At each special survey, every 5 years"], "a": 2, "why": "Annual verification using the test conditions is mandatory for the approved loading instrument (SOLAS II-1/5-1 and the class requirement)."}, {"q": "The calculated draught differs from the draught read at the ship's side by 20 cm; what do you do?", "o": ["Find the error in the input before loading goes any further", "Accept the computer figure, the instrument being class approved", "Apply the difference as a correction to the final condition", "Carry on loading and read the draughts again at the next stage"], "a": 0, "why": "Where the difference is large the error must be found before loading continues; the fault is in the input, not in the ship (SOLAS II-1/5-1 and the class requirement)."}, {"q": "Which figures must be entered into the loading computer as measured rather than assumed?", "o": ["The departure condition taken from the last similar voyage", "The ballast figures given in the terminal's loading plan", "The constant as stated in the approved stability booklet", "The actual bunkers, fresh water, constant and tank soundings"], "a": 3, "why": "The actual bunkers, fresh water and constant must be entered and the ballast tanks sounded rather than assumed, since a small input error becomes a large error in GM (SOLAS II-1/5-1)."}], "sscl": [{"q": "What does an item marked R on the Ship-Shore Safety Checklist mean?", "o": ["It is the responsibility of the terminal alone", "It must be re-checked at the stated repeat interval", "It is a recommendation rather than a requirement", "It applies only to tankers working under ISGOTT"], "a": 1, "why": "Items carrying an R are re-check items with a set repeat interval (SOLAS VI/7 and the BLU Code Appendix)."}, {"q": "How is the Ship-Shore Safety Checklist to be completed?", "o": ["By the ship first, then passed to the terminal for signature", "By the terminal, with the ship countersigning on completion", "Jointly by ship and terminal at the same time", "By the Chief Officer, for review by the Master afterwards"], "a": 2, "why": "The checklist is completed together by ship and terminal and never passed back and forth, then signed by both sides and retained with the cargo records (SOLAS VI/7 and the BLU Code Appendix)."}, {"q": "An item on the checklist cannot be agreed with the terminal; what is the correct action?", "o": ["Stop the operation until that item has been put right", "Note the disagreement and continue under the terminal's instruction", "Mark it not applicable and record the reason in the remarks", "Refer it to the agent and start work on the remaining holds"], "a": 0, "why": "An item that cannot be agreed is never papered over; the operation stops until it is put right (SOLAS VI/7 and the BLU Code Appendix)."}], "holdprep": [{"q": "What does the normal clean standard of hold preparation require?", "o": ["No odour, no residue of the last cargo, dry and painted as required", "No previous cargo, with the holds washed down using fresh water", "Residue of the previous cargo accepted as agreed with the charterer", "No previous cargo and no loose debris, with light staining accepted"], "a": 3, "why": "Normal clean means no previous cargo and no loose debris, with light staining accepted; grain clean is the higher standard requiring no odour or residue."}, {"q": "Where is the standard of hold cleanliness for the next cargo set out?", "o": ["In SOLAS Chapter VI", "In the charter party", "In the IMSBC Code schedule", "In the ship's SMS cargo manual"], "a": 1, "why": "The hold cleanliness standard sits in the charter party and not in SOLAS, and the inspection is done by a draft surveyor or an independent inspector."}, {"q": "The hatch square and tanktop are bone dry but the bilge well is found wet; what follows?", "o": ["The inspector accepts the hold provided the bilges are pumped out", "Cargo may be loaded on top once the bilge covers have been sealed", "The hold is rejected at the inspection and the ship loses time", "Only that hold is downgraded to the shovel clean standard"], "a": 2, "why": "Bilge wells, strum boxes and non-return valves form part of the inspection, so a wet bilge is enough for the hold to be rejected and time to be lost."}], "cargodam": [{"q": "How is the weathertightness of the hatch covers proved before the voyage?", "o": ["By an ultrasonic test or a hose test before the voyage", "By a chalk test on the compression bar of each hatch", "By measuring the dew point inside and outside the hold", "By a visual check of the gaskets and cleats before sailing"], "a": 0, "why": "Hatch cover weathertightness is checked by ultrasonic or hose test before the voyage, water ingress being a leading cause of cargo claims (Hague-Visby Rules Article III)."}, {"q": "What is monitored in order to prevent sweat damage to the cargo?", "o": ["The cargo temperature against the sea water temperature", "The relative humidity measured in the ventilation trunk", "The moisture content at the surface of the cargo", "The dew point inside and outside the hold"], "a": 3, "why": "Sweat is prevented by monitoring the dew point inside and outside the hold and ventilating to the correct rule for the cargo (Hague-Visby Rules Article III)."}, {"q": "Why is a carefully written mate's receipt remark worth more than an argument after the event?", "o": ["It transfers responsibility for the cargo to the terminal", "It records the condition of the cargo at the time of loading", "It allows a clean bill of lading to be signed with cover in place", "It removes the need for a pre-loading survey with photographs"], "a": 1, "why": "The remark is the contemporaneous record that the cargo was already defective when loaded, and such records are the ship's defence against a claim (Hague-Visby Rules Article III)."}], "cargodoc": [{"q": "What is the consequence of signing a clean bill of lading for cargo that is defective?", "o": ["The laytime calculation becomes unenforceable", "The mate's receipt is superseded and loses its effect", "The insurer's cover can be removed from the ship", "The charterer may refuse to pay the freight due"], "a": 2, "why": "Signing a clean bill of lading for defective cargo can remove the insurer's cover (Hague-Visby Rules and the charter party)."}, {"q": "Which documents are the basis of the laytime calculation?", "o": ["The statement of facts and the time sheet", "The cargo manifest and the stowage plan", "The draft survey report and the mate's receipt", "The bill of lading and the letter of protest"], "a": 0, "why": "The statement of facts and the time sheet are the records kept for laytime (Hague-Visby Rules and the charter party)."}, {"q": "What must be recorded on a letter of protest for it to be of use later?", "o": ["The clause of the charter party being relied upon", "The signatures of both the Master and the ship's agent", "The quantity in dispute and the rate being claimed", "The date, time and name of the person who received it"], "a": 3, "why": "A letter of protest carries the date, time and the name of the person who received it, since the documents are the only trace when a claim arrives later (Hague-Visby Rules and the charter party)."}], "imsbc": [{"q": "How are the individual cargo schedules in the IMSBC Code arranged?", "o": ["By group, with the Group A cargoes placed first", "Alphabetically by Bulk Cargo Shipping Name", "By stowage factor, with the lightest cargo first", "By UN number, in the manner of the IMDG Code"], "a": 1, "why": "Every cargo has an individual schedule, listed alphabetically by Bulk Cargo Shipping Name (SOLAS VI/1 and the IMSBC Code)."}, {"q": "What must the shipper provide before loading of a solid bulk cargo starts?", "o": ["A certificate of the angle of repose of the cargo", "A trimming plan agreed with the loading terminal", "A cargo declaration for the cargo offered", "A tripartite agreement signed by the flag State"], "a": 2, "why": "The shipper must provide a cargo declaration before loading starts (SOLAS VI/1 and the IMSBC Code, mandatory since 2011)."}, {"q": "A cargo is offered that has no schedule in the IMSBC Code; what is required before it can be carried?", "o": ["A tripartite agreement and the permission of the flag State", "The schedule for the nearest similar cargo listed in the Code", "A letter of indemnity from the shipper and the charterer", "Approval from the loading terminal and the port authority"], "a": 0, "why": "A cargo not listed in the Code needs a tripartite agreement and the permission of the flag (SOLAS VI/1 and the IMSBC Code)."}], "groups": [{"q": "Which group of the IMSBC Code covers cargoes that may liquefy?", "o": ["Group C, cargoes that shift and give off dust", "Group B, cargoes presenting a chemical hazard", "Groups B and C together, where moisture is present", "Group A, cargoes that may liquefy above the TML"], "a": 3, "why": "Group A covers cargoes that can liquefy where the moisture goes above the TML, such as iron ore fines, nickel ore and concentrates (IMSBC Code Section 1.7)."}, {"q": "Into which group do coal and direct reduced iron fall, and for what reason?", "o": ["Group A, because their moisture content can rise in the hold", "Group B, because they present a chemical hazard", "Group C, because they neither liquefy nor react", "Groups A and C, because they shift as well as react"], "a": 1, "why": "Group B is the chemical hazard group, covering coal for methane and self-heating and DRI for hydrogen (IMSBC Code Section 1.7)."}, {"q": "What certification does a Group A cargo require?", "o": ["A certificate of the angle of repose and the stowage factor", "A declaration of the self-heating characteristics of the cargo", "A certificate of moisture content and of the TML", "A tripartite agreement endorsed by the flag State"], "a": 2, "why": "Group A requires a certificate of moisture content and of the TML (IMSBC Code Section 1.7 and the individual schedules)."}], "tml": [{"q": "How is the Transportable Moisture Limit defined?", "o": ["90 per cent of the flow moisture point", "95 per cent of the flow moisture point", "The moisture content at which the cargo begins to flow", "80 per cent of the saturated moisture content"], "a": 0, "why": "TML is 90 per cent of the flow moisture point, and the actual moisture content must be below it at the time of loading (IMSBC Code Section 4 and 7)."}, {"q": "What is the maximum validity of the TML certificate and of the moisture content certificate?", "o": ["TML up to 12 months and moisture content up to 14 days", "TML up to 6 months and moisture content up to 30 days", "TML up to 3 months and moisture content up to 7 days", "TML up to 6 months and moisture content up to 7 days"], "a": 3, "why": "The TML certificate is valid for up to 6 months and the moisture certificate for up to 7 days, and less where it has rained (IMSBC Code Section 4 and 7)."}, {"q": "Heavy rain has fallen on the stockpile and the moisture certificate is 2 weeks old; what do you do?", "o": ["Load on, the certificate being valid for up to 6 months", "Require fresh sampling, the certificate no longer holding good", "Accept the figure if a can test on deck shows no free moisture", "Reduce the loading rate and monitor the surface during the voyage"], "a": 1, "why": "Where rain has fallen on the stockpile fresh sampling is required, and the can test is only a first indication, never a substitute for a laboratory test (IMSBC Code Section 4 and 7)."}], "liquefy": [{"q": "What is the first sign of liquefaction in a hold?", "o": ["A list that builds up slowly towards one side", "A rise in the temperature at the cargo surface", "Water appearing at the surface and the cargo going flat", "Cracking and settling of the cargo around the hatch square"], "a": 2, "why": "The first sign is water at the surface with the cargo going flat; nothing shows at the start, and vibration and rolling bring it on (IMSBC Code Section 7)."}, {"q": "Why can trimming or ballasting not put liquefaction right once it has started?", "o": ["The cargo acts as a free surface on a wet base and stability goes quickly", "The cargo must be discharged before any trim adjustment can be made", "Ballasting raises the centre of gravity and increases the rolling", "Trimming is effective only where the moisture is below the TML"], "a": 0, "why": "Liquefied cargo gives a free surface and a wet base, so stability is lost quickly and the ship can capsize without warning after a heavy list (IMSBC Code Section 7)."}, {"q": "What is the only exception to the rule against carrying Group A cargo above its TML?", "o": ["A ship whose holds are fitted with longitudinal bulkheads", "A ship whose loading manual permits alternate hold loading", "A ship carrying the cargo in no more than two of its holds", "A specially constructed or fitted ship, with flag permission"], "a": 3, "why": "A specially constructed or fitted cargo ship is the only exception and it requires the permission of the Administration (IMSBC Code Section 7)."}], "coaldri": [{"q": "Which gases are measured daily in a hold loaded with coal?", "o": ["Methane, hydrogen and carbon dioxide", "Methane, oxygen and carbon monoxide", "Oxygen, hydrogen sulphide and carbon dioxide", "Hydrogen, oxygen and carbon monoxide"], "a": 1, "why": "Methane, oxygen and carbon monoxide are measured daily in coal, and the results recorded (IMSBC Code, schedule for COAL)."}, {"q": "Carbon monoxide readings are rising in a coal cargo; what is the correct action?", "o": ["Open the hatch in order to cool the surface of the cargo", "Increase surface ventilation until the readings fall again", "Close the hatches and stop all ventilation of the hold", "Start through ventilation and continue the daily monitoring"], "a": 2, "why": "Rising CO is the sign of self-heating, so the hatches are closed and the hold is not ventilated; opening up feeds in oxygen and makes the heating worse (IMSBC Code, schedule for COAL)."}, {"q": "What is the principal hazard of direct reduced iron?", "o": ["It reacts with water and gives off hydrogen", "It liquefies where its moisture exceeds the TML", "It gives off methane and needs surface ventilation", "It is a Group C cargo and needs only a dry hold"], "a": 0, "why": "DRI reacts with water and gives off hydrogen, and some types require inert gas (IMSBC Code, schedule for DIRECT REDUCED IRON)."}], "vent3c": [{"q": "Under the 3-degree rule, when is the hold ventilated?", "o": ["When the outside air is 3 °C or more warmer than the cargo at loading", "When the cargo temperature has risen by 3 °C since loading", "When the dew point outside is 3 °C below the dew point in the hold", "When the outside air is 3 °C or more colder than the cargo at loading"], "a": 3, "why": "Ventilate where the present outside air is 3 °C or more colder than the average cargo temperature at loading; where the air is warmer, ventilating carries moisture in (IMSBC Code Appendix)."}, {"q": "Which two temperatures are compared when the 3-degree rule is applied?", "o": ["The present cargo temperature and the present outside air temperature", "The average cargo temperature at loading and the present outside air", "The sea water temperature and the temperature within the hold space", "The dew point in the hold and the present outside air temperature"], "a": 1, "why": "The rule compares the average cargo temperature at the time of loading with the present outside air temperature (IMSBC Code Appendix)."}, {"q": "On which cargo is the 3-degree rule not used?", "o": ["In the tropics, where the dew point rule is applied instead", "On timber deck cargo, which is ventilated continuously at sea", "On cargo where ventilation is prohibited, such as self-heating coal", "On grain and timber, for which the dew point rule is used instead"], "a": 2, "why": "The rule is for cargo carrying its own moisture, such as grain and timber, and is not used where ventilation is prohibited, as with self-heating coal (IMSBC Code Appendix)."}], "ventdp": [{"q": "Which readings must be entered in the ventilation record at every check?", "o": ["Dry bulb, relative humidity and the sea temperature only", "Dry bulb, wet bulb, dew point and the decision taken", "Wet bulb, dew point and the hold temperature only", "Dry bulb, dew point and the wind direction only"], "a": 1, "why": "Dry bulb, wet bulb, dew point and the ventilation decision are recorded at every check, following the IMSBC Code Appendix and P&I club carriage advice, because a cargo claim normally calls for the ventilation record."}, {"q": "When is it correct to ventilate a hold under the dew point rule?", "o": ["When the outside air is dry and the weather is fine and sunny", "When the dew point outside the hold is higher than inside", "When the outside dry bulb reading is lower than inside", "When the dew point outside the hold is lower than inside"], "a": 3, "why": "Ventilate only when the outside dew point is lower than the dew point inside; if outside is higher, sweat will form on the cargo or in the hold."}, {"q": "Why is fine, sunny weather not by itself a reason to open up the ventilators?", "o": ["The outside dew point may be high, so ventilating will wet the cargo", "Sunlight raises the hold temperature and starts ship sweat at once", "A whirling hygrometer cannot be read reliably in direct sunshine", "Fine weather normally makes the wet bulb reading unreliable"], "a": 0, "why": "A common mistake is ventilating because the weather looks fine; the outside dew point was high and the cargo was ruined."}], "gasfum": [{"q": "Which substance is normally used as the fumigant for a cargo fumigated in transit?", "o": ["Carbon monoxide", "Hydrogen sulphide", "Phosphine", "Methane"], "a": 2, "why": "The fumigant is normally phosphine, odourless at low concentration but lethal, as covered by IMO MSC.1/Circ.1264."}, {"q": "How should a gas reading be taken from a hold under fumigation in transit?", "o": ["Through a fixed sampling point, with the meter calibrated beforehand", "By opening the hatch a short way and lowering the meter on a line", "From the ventilator outlet after an hour of forced ventilation", "By a standby man inside the hold wearing breathing apparatus"], "a": 0, "why": "Use a fixed sampling point and never open a hatch just to take a reading; the meter is calibrated before use and the result recorded."}, {"q": "Why is a fumigated hold still treated as lethal when it looks clean and bright?", "o": ["Residual dust from the fumigant irritates the lungs for several days", "Phosphine has a strong smell that masks a low oxygen content", "The gas settles in the bilges and is released when the bilge is pumped", "Phosphine is odourless at low concentration, so smell gives no warning"], "a": 3, "why": "Smell is not a warning because phosphine is odourless at low concentration; under IMO MSC.1/Circ.1264 no entry is permitted until a gas-free certificate and a permit are issued."}], "trimlist": [{"q": "What must be established first on a ship that is leaning to one side?", "o": ["Whether the free surface in the slack tanks has been corrected", "Whether the ship is listed or lolled, because the cure differs", "Whether the MCTC and LCF allow the ballast to be moved", "Whether the stress limits permit a transfer to be started"], "a": 1, "why": "Decide whether it is list or loll before moving anything, because the correct action is the opposite in each case."}, {"q": "What is the correct first step on a ship that has lolled?", "o": ["Add ballast on the high side slowly, one tank at a time", "Transfer ballast from the low side to the fore or aft peak", "Fill the slack tank first to remove the free surface", "Press up the high side tank and then check the trim"], "a": 2, "why": "For loll, fill the slack tank first to cut the free surface; weight is not added on the high side."}, {"q": "Why is ballasting the high side of a lolled ship dangerous?", "o": ["She will flop over to the other side at a bigger angle", "The added weight raises G further and the stress rises", "The trim changes and the propeller is likely to emerge", "The free surface in the filled tank increases the heel"], "a": 0, "why": "A lolled ship ballasted on the high side flops over to the other side at a bigger and more dangerous angle; under the IMO Intact Stability Code 2008 negative GM is not permitted in any seagoing condition."}], "damstab": [{"q": "What does the downflooding angle represent?", "o": ["The angle at which cross-flooding begins to equalise the list", "The angle at which the damage stability booklet limits the list", "The angle at which permeability of the flooded space changes", "The angle at which water begins to enter another space"], "a": 3, "why": "The downflooding angle is the limit before water enters another space, under SOLAS Chapter II-1 Parts B-1 and B-2."}, {"q": "What is the first action when the ship is flooding after damage?", "o": ["Start cross-flooding to bring the ship upright again", "Identify which compartment is affected before ballasting", "Close every watertight door and sound the general alarm", "Compare the draught with the damage stability booklet"], "a": 1, "why": "In real damage, first identify which compartment is involved and do not rush into ballasting."}, {"q": "Why is an open watertight door far more serious than it first appears?", "o": ["It prevents cross-flooding from equalising the list", "It raises the permeability of the space to 100 per cent", "It enlarges the flooded volume beyond the assumed case", "It lowers the downflooding angle below the booklet limit"], "a": 2, "why": "Every open door enlarges the flooded volume, so the ship is no longer in a condition permitted by the damage stability booklet; SOLAS Chapter II-1 Parts B-1 and B-2 apply."}], "hwballast": [{"q": "What is the effect of too high a GM in heavy weather?", "o": ["A fast, hard roll that damages cargo and structure", "A slow roll with the risk of synchronous rolling", "A deeper propeller and a greater risk of slamming", "A larger free surface effect in the slack tanks"], "a": 0, "why": "Too high a GM gives a fast, hard roll that damages cargo and structure, while too low a GM gives a slow roll and the risk of synchronous rolling."}, {"q": "How should the ballast tanks be left when the ship is prepared for heavy weather?", "o": ["Slack at about half, so that ballast can be adjusted later", "Pressed up forward and slack aft to keep the propeller deep", "Slack in the double bottom and full in the topside tanks", "Either full or empty, so that there is no free surface"], "a": 3, "why": "Fill the tank or leave it empty and avoid slack tanks, so there is no free surface, as covered by IMO MSC.1/Circ.1228."}, {"q": "Why should a ballast change not be left until the storm has arrived?", "o": ["The pumps cannot hold suction once the ship begins to roll", "The moving water adds free surface at the worst moment", "The stress readings cannot be taken while the ship is rolling", "The propeller emerges as soon as the forward tanks are filled"], "a": 1, "why": "Changing ballast in the middle of a storm is dangerous because the moving water adds free surface at the worst possible moment; IMO MSC.1/Circ.1228 requires it to be done before the weather arrives."}], "grain": [{"q": "What are the grain stability criteria the ship must satisfy?", "o": ["GM not less than 0.15 m, heel not more than 12°, area not less than 0.075 m-radian", "GM not less than 0.30 m, heel not more than 15°, area not less than 0.030 m-radian", "GM not less than 0.30 m, heel not more than 12°, area not less than 0.075 m-radian", "GM not less than 0.45 m, heel not more than 10°, area not less than 0.100 m-radian"], "a": 2, "why": "The 3 criteria are GM not less than 0.30 m, heel not more than 12° or deck immersion, and residual area not less than 0.075 m-radian, under SOLAS VI/9 and the International Grain Code."}, {"q": "What must be in place before grain loading starts?", "o": ["A document of authorization and an approved grain loading plan", "A volumetric heeling moment table approved by the terminal", "A trimming certificate issued by the attending loading surveyor", "A stability letter endorsed by the port State authority"], "a": 0, "why": "The ship must hold a document of authorization, and the grain loading plan is submitted and approved before loading, under SOLAS VI/9 and the International Grain Code."}, {"q": "Why is a partly filled compartment more dangerous than one filled and trimmed?", "o": ["The grain settles unevenly and alters the ship's trim", "The free surface of the grain lowers GM below 0.30 m", "The volumetric heeling moment cannot be calculated for it", "The void above the grain allows a bigger shift of surface"], "a": 3, "why": "A filled compartment, trimmed, has a smaller heeling moment, while untrimmed ends leave a bigger void and allow a bigger shift that does not come back."}], "hatch": [{"q": "What is the correct compression of the hatch cover rubber packing?", "o": ["3 to 5 mm", "5 to 8 mm", "1 to 2 mm", "8 to 10 mm"], "a": 0, "why": "Correct compression of the rubber packing is normally 3 to 5 mm, and the packing is also checked for permanent set, cuts and hardening under SOLAS II-1/11 and Load Line Convention Regulation 16."}, {"q": "Which test is used to check hatch cover tightness with cargo in the hold?", "o": ["Hose test", "Chalk test", "Ultrasonic test", "Air pressure test"], "a": 2, "why": "The hose test is for an empty hold; the ultrasonic test is used with cargo on board or when a firmer answer is needed, and it is accepted by most class societies and P&I clubs."}, {"q": "A hatch cover is leaking, so why is tightening the cleats the wrong answer?", "o": ["The cleats are not designed to carry any part of the sealing load", "Over-tightening crushes the packing and the leak gets worse", "The compression bar lifts and the drain channel then blocks", "The non-return valves are forced open by the extra load"], "a": 1, "why": "Over-tightening the cleats crushes the rubber packing, so the leak gets worse rather than better."}], "ventair": [{"q": "Which parts of an air pipe head are examined during the deck round?", "o": ["The dog, the hinge and the gasket seating face", "The gauze, the hinge and the closing appliance", "The float ball, the cap and the sounding pipe gasket", "The float ball, the gauze and the body for wasting"], "a": 3, "why": "On the air pipe head, check the float ball, the gauze and the body for wasting or holes, under Load Line Convention Regulations 17 to 21 and IACS UR P3."}, {"q": "What is the usual consequence of a missing or damaged air pipe head at a port State inspection?", "o": ["An observation to be entered in the planned maintenance system", "A detainable deficiency under the load line requirements", "A deficiency to be rectified within three months by class", "A recommendation closed out at the next load line survey"], "a": 1, "why": "A damaged or missing air pipe head is normally a detainable deficiency, and these openings come under the load line survey, under Load Line Convention Regulations 17 to 21 and IACS UR P3."}, {"q": "How does one damaged air pipe head lead to the loss of a ship in heavy weather?", "o": ["Water enters the tank on deck and flooding spreads", "The tank cannot be vented, so the plating buckles inward", "The gauze blocks and the ballast pump loses its suction", "The float ball jams and the sounding pipe cannot be used"], "a": 0, "why": "A damaged air pipe head lets water into the tank through a deck opening, and that is how progressive flooding starts in heavy weather."}], "tankinsp": [{"q": "What is recorded about pitting found during a ballast tank inspection?", "o": ["The coating grade and the area affected as a percentage", "The location and the remaining thickness of the anodes", "The depth and the frequency, against the limits class sets", "The length of the affected weld seam and the crack width"], "a": 2, "why": "Pitting is recorded by depth and frequency, and class sets the limits, in line with the Enhanced Survey Programme (ESP)."}, {"q": "What must be in place before you enter a ballast tank?", "o": ["A gas-free certificate from the terminal and a rescue team", "A permit, a risk assessment and continuous ventilation only", "A gas test, breathing apparatus and the Master in attendance", "A permit, a gas test and a standby man at the entrance"], "a": 3, "why": "A ballast tank is an enclosed space, so a permit, a gas test and a standby man are required; SOLAS II-1/3-6 covers access to and within spaces."}, {"q": "Why is coating breakdown a structural matter and not a cosmetic one?", "o": ["It blocks the drains and traps water on the tank top", "Bare steel corrodes and loses thickness over time", "It makes the anodes waste faster than they are designed to", "It hides cracks in the weld seams and in the brackets"], "a": 1, "why": "Once the coating breaks down the bare steel corrodes and loses thickness, which is why the percentage of area affected and the worst locations are recorded under the Enhanced Survey Programme (ESP)."}], "corrosion": [{"q": "What proportion of the allowable diminution is normally called substantial corrosion?", "o": ["75 to 100 per cent", "50 to 75 per cent", "25 to 50 per cent", "100 to 125 per cent"], "a": 0, "why": "Substantial corrosion is normally 75 to 100 per cent of the allowable diminution, under IACS and the Enhanced Survey Programme."}, {"q": "Who carries out thickness measurement, and what is the result compared with?", "o": ["The Chief Officer, compared with the last survey report", "The attending surveyor, compared with the as-built scantlings", "An approved firm, compared with the renewal criteria", "The class society, compared with the coating condition grade"], "a": 2, "why": "Thickness measurement is done by an approved firm and compared against the renewal criteria, under IACS and the Enhanced Survey Programme."}, {"q": "Why does grooving corrosion become serious faster than general corrosion?", "o": ["It spreads evenly, so a wide area of plate is lost at once", "It attacks only the coating and leaves the steel sound", "It is found only on the tanktop, where the loads are highest", "It is local and deep, so thickness is lost in one line"], "a": 3, "why": "General corrosion is even thinning over a wide area, while grooving corrosion runs along weld edges and plate joints and cuts the thickness locally."}], "mooring": [{"q": "Which rope capacity figures must the officer in charge of mooring know?", "o": ["SWL, LDBF and the winch brake rendering setting", "MBL, SWL and LDBF for the rope and for the bitt", "MBL, LDBF and the age recorded in the line plan", "MBL, SWL and the tail and shackle replacement interval"], "a": 1, "why": "Know the MBL, SWL and LDBF of each rope and of the bitt, under SOLAS II-1/3-8 and MSC.1/Circ.1620."}, {"q": "What must be done about the snap-back zone before mooring starts?", "o": ["It is marked on the deck and everyone is briefed on it", "It is kept clear of ropes until the winch brake is tested", "It is recorded in the line management plan for each rope", "It is checked against the mooring arrangement plan"], "a": 0, "why": "The snap-back zone is marked on the deck and everyone is briefed, and nobody stands in line with a rope; MSC.1/Circ.1620 gives the guidelines."}, {"q": "Why should new and old ropes not be mixed in the same service?", "o": ["The older rope stretches first and the winch brake renders", "The line management records cannot be kept for both together", "They share the load unevenly, so one rope parts first", "The tails and shackles then carry different replacement dates"], "a": 2, "why": "Mixed moorings in the same service share the load unevenly, so one line takes more than its share and parts, and most serious mooring accidents come from a rope that parted."}], "anchorgear": [{"q": "What determines the size of the anchor and the length of the chain?", "o": ["The ship's summer deadweight and her service speed", "The holding power needed at the deepest anchorage used", "The windlass brake capacity stated by the maker", "The equipment number calculated for the ship"], "a": 3, "why": "The equipment number sets the anchor size and the chain length, under IACS UR A1 and A2."}, {"q": "How is the anchor put down in deep water?", "o": ["Let go under gravity, with the brake controlling the run", "Let go on the brake with the chain stopper engaged", "Walked back on the windlass to the required scope", "Lowered to the bottom and then veered on the brake"], "a": 2, "why": "Walk back in deep water and never simply let go under gravity when it is deep, under IACS UR A1 and A2."}, {"q": "Why must the chain stopper be used once the ship is lying at anchor?", "o": ["It carries the load, which the brake is not made to hold", "It allows the cable to be ranged without the brake slipping", "It keeps the bitter end release clear of the riding load", "It stops the brake lining wearing against the drum"], "a": 0, "why": "The chain stopper carries the load at anchor, not the windlass brake, which is damaged if it is left to hold the ship; IACS UR A1 and A2 apply."}], "cranes": [{"q": "At what intervals is the ship's lifting gear examined and load tested?", "o": ["Thorough examination every 6 months and a load test every 4 years", "Thorough examination every year and a load test every 5 years", "Thorough examination every year and a load test every 2 years", "Thorough examination every 2 years and a load test every 5 years"], "a": 1, "why": "An annual thorough examination and a five-yearly load test are required under ILO Convention 152 and the Code of Safe Working Practices."}, {"q": "What is checked on a crane immediately before it is used?", "o": ["The register entries, the certificate and the SWL marking", "The wire rope lubrication and the slew bearing clearance", "The load test record and the last thorough examination", "The sheaves, brake, limit switches and emergency stop"], "a": 3, "why": "Before use, check the sheaves, brake, limit switches and emergency stop, along with the wire rope for broken strands, kinks and wasting."}, {"q": "Why does the safe working load of a crane change while the boom is worked?", "o": ["The wire rope loses diameter as it passes over the sheaves", "The limit switches cut the hoist speed at a longer reach", "The SWL depends on the radius at which the load is lifted", "The brake holding capacity falls as the boom is lowered"], "a": 2, "why": "The SWL is marked and never exceeded, and allowance must be made for the radius, under ILO Convention 152 and the Code of Safe Working Practices."}], "pms": [{"q": "What does every item of equipment in the planned maintenance system carry?", "o": ["A job, an interval and a responsible person", "A defect ticket, a spare part list and a date", "A criticality rating and a class survey record", "An interval, a spare level and a test certificate"], "a": 0, "why": "Every item of equipment has a job, an interval and a responsible person, under ISM Code Element 10."}, {"q": "How is a job that has gone overdue in the PMS handled correctly?", "o": ["Close it and raise a defect ticket in its place", "Record an explanation and set a new due date", "Delete it and let the next interval generate it again", "Transfer it to the critical equipment list for monitoring"], "a": 1, "why": "An overdue job needs an explanation and a new date, and is never simply deleted, under ISM Code Element 10."}, {"q": "Why is a long overdue list a bigger problem than one broken machine?", "o": ["It shows that the spare parts are below the minimum levels", "It means the critical equipment list has not been reviewed", "It stops the defect tickets from being closed in order", "It shows the ship is not being maintained to a plan"], "a": 3, "why": "The PMS proves the ship is maintained to a plan and not only when something breaks, and the record is the evidence for PSC, class and vetting; ISM Code Element 10 applies."}], "bwmp": [{"q": "What is the volumetric requirement for ballast water exchange under the D-1 standard?", "o": ["Not less than 85 per cent", "Not less than 90 per cent", "Not less than 95 per cent", "Not less than 300 per cent"], "a": 2, "why": "The D-1 standard is ballast water exchange of not less than 95 per cent volumetric, under the IMO Ballast Water Management Convention."}, {"q": "What is entered in the Ballast Water Record Book for every operation?", "o": ["Date, position, quantity and method", "Date, tank, salinity and the officer on watch", "Position, quantity, pump used and time taken", "Date, position, organism count and method"], "a": 0, "why": "Every operation is recorded with the date, position, quantity and method, under the IMO Ballast Water Management Convention."}, {"q": "Why did the industry move from the D-1 standard to the D-2 standard?", "o": ["Exchange at sea is now forbidden by most coastal States", "Exchange only dilutes, while treatment limits organism numbers", "Exchange cannot be recorded accurately in the record book", "Exchange calls for 3 times the volume of every tank treated"], "a": 1, "why": "D-1 is exchange, while D-2 is treatment through a BWTS with limits on organism numbers, and from 2024 most ships are on the D-2 standard."}], "bwts": [{"q": "Which parameters set the operating limits of a ballast water treatment system?", "o": ["Tank volume, pump rate, pipe diameter and temperature", "Turbidity, organism count, salinity and residual oxidant", "Temperature, salinity, residual oxidant and backwash rate", "Turbidity, temperature, salinity and flow rate"], "a": 3, "why": "Each type has operating limits of turbidity, temperature, salinity and flow rate, under BWM Convention Regulation D-2 and the BWMS Code."}, {"q": "Under what conditions may the treatment system be by-passed?", "o": ["When the turbidity is above the system's stated limit", "When the port State has given permission before arrival", "In an emergency only, and it is recorded and reported", "When the sequential exchange method is used instead"], "a": 2, "why": "A by-pass is allowed only in an emergency and must be recorded and reported; by-passing without reporting is a serious violation with a heavy fine, and MEPC.1/Circ.862 sets out the contingency measures."}, {"q": "Why does a UV system fail to perform in muddy water?", "o": ["High turbidity blocks the light from reaching the organisms", "Suspended solids neutralise the residual oxidant produced", "The low salinity of river water stops the lamps striking", "The sensors read the sediment as a high organism count"], "a": 0, "why": "A UV system is limited by turbidity, so it does not work in muddy water, and the written contingency measures then apply as set out in MEPC.1/Circ.862."}], "bwexch": [{"q": "How much water must pass through the tank when ballast is exchanged by the flow-through method?", "o": ["2 times the tank volume", "3 times the tank volume", "95 per cent of the tank volume", "5 times the tank volume"], "a": 1, "why": "The flow-through method replaces the water while overflowing and needs 3 times the tank volume, under BWM Convention Regulation B-4."}, {"q": "Where should ballast exchange be carried out where practicable?", "o": ["100 nm from the nearest land in 200 m of water", "200 nm from the nearest land in 50 m of water", "50 nm from the nearest land in 200 m of water", "200 nm from the nearest land in 200 m of water"], "a": 3, "why": "Exchange is carried out 200 nm from the nearest land in 200 m of water where practicable, under BWM Convention Regulation B-4."}, {"q": "Why is the sequential method the most risky of the three in heavy weather?", "o": ["It needs 3 times the volume and takes far longer to finish", "It mixes treated and untreated water inside the same tank", "The tank is emptied first, so stress and stability suffer", "The water overflowing on deck blocks the freeing ports"], "a": 2, "why": "The sequential method empties the tank before refilling, which gives the cleanest result but brings stress and stability effects, so stress, stability and sloshing are checked at every step."}], "garbage": [{"q": "What are the discharge distances for food waste?", "o": ["3 nm if comminuted and 12 nm if not", "12 nm if comminuted and 25 nm if not", "3 nm if comminuted and 25 nm if not", "12 nm if comminuted and 3 nm if not"], "a": 0, "why": "Food waste may be discharged 3 nm from land if comminuted and 12 nm if not, under MARPOL Annex V and MEPC.295(71)."}, {"q": "Which ships are required to keep a Garbage Record Book?", "o": ["A ship of 400 GT and above, or carrying 10 persons and above", "A ship of 400 GT and above, or carrying 15 persons and above", "A ship of 500 GT and above, or carrying 15 persons and above", "A ship of 150 GT and above, or carrying 12 persons and above"], "a": 1, "why": "The Garbage Record Book is mandatory for a ship of 400 GT and above, or carrying 15 persons and above, under MARPOL Annex V and MEPC.295(71)."}, {"q": "What must be kept with the Garbage Record Book after garbage is landed ashore?", "o": ["The port State inspection form for the reception facility", "The agent's confirmation that the facility was an approved one", "The hazard to the marine environment classification of the load", "The receipt from the reception facility"], "a": 3, "why": "The receipt from the reception facility is kept with the record book, under MARPOL Annex V and MEPC.295(71)."}], "sopep": [{"q": "What does the ship carry in addition to an approved SOPEP?", "o": ["A bunkering checklist and the terminal's own response plan", "An Oil Record Book Part III for emergency transfers", "A SOPEP locker with the full inventory", "A coastal State reporting certificate for every voyage"], "a": 2, "why": "The ship carries an approved SOPEP and a SOPEP locker holding the full inventory, under MARPOL Annex I Regulation 37."}, {"q": "What are the first actions when oil is spilled during a transfer?", "o": ["Stop the operation, raise the alarm and contain the spread", "Fit the scupper plugs, tell the terminal and start cleaning", "Record it in the Oil Record Book and call the flag State", "Open the SOPEP locker, brief the team and sound the tanks"], "a": 0, "why": "The first actions are to stop the operation, raise the alarm and contain the spread, under MARPOL Annex I Regulation 37; the first 5 minutes matter most."}, {"q": "Why is prompt reporting given priority over starting the clean-up?", "o": ["The clean-up cannot be recorded until the report has gone", "Reporting the coastal State, flag, company and terminal is a duty", "The Oil Record Book entry must be made before any action", "The terminal will not release the SOPEP locker until told"], "a": 1, "why": "Reporting to the coastal State, flag, company and terminal using the prepared format is a requirement in its own right and does not wait for the clean-up; reporting follows Article 8 and Protocol I."}], "annexvvi": [{"q": "What are the sulphur limits worldwide and inside an Emission Control Area?", "o": ["0.50 per cent worldwide and 0.50 per cent in an ECA", "1.50 per cent worldwide and 0.50 per cent in an ECA", "0.10 per cent worldwide and 0.05 per cent in an ECA", "0.50 per cent worldwide and 0.10 per cent in an ECA"], "a": 3, "why": "Annex VI sets a sulphur limit of 0.50 per cent worldwide and 0.10 per cent in an Emission Control Area, under MARPOL Annex VI Regulations 14, 18 and 22."}, {"q": "What is recorded when the fuel is changed over for an Emission Control Area?", "o": ["The quantity left and the sulphur content of each tank", "The time and the position of the changeover", "The bunker delivery note number and the sample seal", "The CII rating and the matching SEEMP Part III entry"], "a": 1, "why": "Fuel changeover is carried out before entering an ECA with the time and position recorded, under MARPOL Annex VI Regulations 14, 18 and 22."}, {"q": "For how long are the Bunker Delivery Note and the fuel sample kept on board?", "o": ["3 months", "6 months", "12 months", "24 months"], "a": 2, "why": "The Bunker Delivery Note and the sample are kept for 12 months, under MARPOL Annex VI Regulations 14, 18 and 22."}], "decklog": [{"q": "How is a wrong entry in the deck log book corrected?", "o": ["One line through the error, then sign it", "Cover it neatly and write the correct entry alongside", "Erase it and enter the correction at the end of the watch", "Leave it and ask the Master to endorse the correct entry"], "a": 0, "why": "Entries are made in ink and never erased; put one line through the error and sign it, because the log book is a legal document."}, {"q": "Who signs an entry in the deck log book?", "o": ["The officer of the watch and the Master together", "The Chief Officer, after checking the entries each day", "The Master alone, once the day's entries are complete", "The officer who made the entry, and nobody else"], "a": 3, "why": "The entry is signed by the officer who made it, nobody else; SOLAS V/28 covers the record of navigational activities."}, {"q": "Why does writing up the log after the watch weaken it as evidence?", "o": ["The record of navigational activities must carry the Master's order", "It is no longer a record made as the events happened", "The ink entries can no longer be corrected with one line", "The positions and the weather must come from the chart record"], "a": 1, "why": "The log is written as it happens, not at the end of the watch or the day, because what is written there becomes evidence many years later; SOLAS V/28 applies."}], "deckplan": [{"q": "What must be considered before deck work is assigned to a man?", "o": ["The permit to work, the toolbox talk and the weekly plan", "The weather, the stores on hand and the time in port", "The weather, the port call and the rest hours", "The rest hours, the overtime record and the appraisal"], "a": 2, "why": "Look at the weather, the port call and rest hours before assigning anyone; work and rest hours sit in MLC 2006 and STCW."}, {"q": "How is the deck work plan built up?", "o": ["From the PMS due list, job by job, each morning", "From the weekly plan, broken down into daily jobs", "From the daily jobs, collected into a weekly summary", "From the permit to work register for the coming week"], "a": 1, "why": "Start with the weekly plan and break it down into daily jobs, then review at the end of the day; ISM Code Element 7 applies."}, {"q": "Why is the end of the working day the usual moment for an accident?", "o": ["Men rush to finish and the care taken earlier falls away", "The toolbox talk given in the morning has expired by then", "The permit to work has to be closed before the shift ends", "The review of the day's work has not yet been carried out"], "a": 0, "why": "Rushing at the end of the day is the usual moment for an accident, which is why time is allowed for the toolbox talk and for clearing up afterwards; ISM Code Element 7 and the Code of Safe Working Practices for Merchant Seafarers apply."}], "ptw": [{"q": "Which jobs on board require a permit to work?", "o": ["Hot work, work aloft, tank cleaning, painting overside and bunkering", "Enclosed space entry, hot work, mooring, heavy lifts and bunkering", "Hot work, electrical isolation, bunkering, painting and work aloft", "Enclosed space entry, hot work, work aloft, overside work and isolation"], "a": 3, "why": "A permit is needed for enclosed space entry, hot work, work aloft, overside work and electrical isolation, under ISM Code Element 7 and the Code of Safe Working Practices."}, {"q": "What is done once the permit work has been completed?", "o": ["The permit is closed, so none is left open with no work going on", "The permit is held open until the same job resumes next day", "The permit is signed by the Master and filed for the audit", "The standby man reports and the isolation is left in place"], "a": 0, "why": "Close the permit afterwards, because no permit stays open with no work going on; ISM Code Element 7 applies."}, {"q": "Why does a permit end when the shift ends, even with the job unfinished?", "o": ["The standby man posted for the work goes off duty then", "The Master's signature is only valid for one working day", "Conditions change, so the assessment must be made again", "The isolation and lock-out tag-out have to be removed nightly"], "a": 2, "why": "A permit carries a time limit and ends when the shift ends; carrying it over to the next day leaves an old assessment covering changed conditions."}], "riskassess": [{"q": "What is the correct order of the hierarchy of control?", "o": ["Eliminate, engineering, substitute, PPE, administrative", "Eliminate, substitute, engineering, administrative, PPE", "Substitute, eliminate, administrative, engineering, PPE", "Engineering, eliminate, substitute, PPE, administrative"], "a": 1, "why": "The hierarchy of control runs eliminate, substitute, engineering, administrative, PPE; ISM Code Element 1.2.2 requires all identified risks to be assessed."}, {"q": "When and where is the toolbox talk given?", "o": ["At the morning meeting, before the day's plan is issued", "At the worksite, once the first stage of the work is done", "At the worksite, before work starts, with questions invited", "In the ship's office, with the risk assessment signed off"], "a": 2, "why": "The toolbox talk comes before work starts, at the worksite, with a chance to ask questions."}, {"q": "Why does PPE come last in the hierarchy of control?", "o": ["It is the most expensive control to maintain on board", "It is only required when the risk level is still high", "It is the control the company is least able to verify", "It protects one man and leaves the hazard in place"], "a": 3, "why": "PPE is the weakest control because the hazard remains, and controls are added from the top of the hierarchy until the risk is acceptable; ISM Code Element 1.2.2 applies."}], "enclosed": [{"q": "What atmosphere readings are required before an enclosed space is entered?", "o": ["Oxygen 20.8 per cent, flammable gas under 1 per cent LEL", "Oxygen 19.5 per cent, flammable gas under 5 per cent LEL", "Oxygen 21.0 per cent, flammable gas under 10 per cent LEL", "Oxygen 20.8 per cent, flammable gas under 5 per cent LEL"], "a": 0, "why": "Measure at all levels for oxygen 20.8 per cent, flammable gas under 1 per cent LEL and toxic gas below the limit; IMO Resolution A.1050(27) gives the guidance on procedure."}, {"q": "How often must the enclosed space entry and rescue drill be held?", "o": ["Every month", "Every 2 months", "Every 3 months", "Every 6 months"], "a": 1, "why": "SOLAS III/19.3.6 requires enclosed space entry and rescue drills every 2 months."}, {"q": "Why do more people die in the rescue than on the first entry?", "o": ["The rescue party enters before the space has been ventilated", "The standby man loses communication with the man inside", "Rescuers go in without BA when they see a man collapse", "The rescue equipment is not rigged until the alarm is raised"], "a": 2, "why": "Going in to rescue without breathing apparatus is the most common way one casualty becomes several, and no rescuer enters without BA; IMO Resolution A.1050(27) applies."}], "crewsup": [{"q": "When does familiarization take place for a man joining the ship?", "o": ["During the first drill after he has settled in on board", "Within the first week, once his watch pattern has been set", "At his first appraisal, measured against the training matrix", "On joining, before any job is handed over to him"], "a": 3, "why": "Familiarization is carried out on joining, before any job is handed over, under ISM Code Element 6 and STCW Regulation I/14."}, {"q": "What record is kept for the cadet, and how is it handled?", "o": ["A training record book, reviewed regularly", "An appraisal form, signed at the end of the contract", "A familiarization checklist, filed with the muster list", "A training matrix entry, updated after every drill"], "a": 0, "why": "The cadet has a training record book that is reviewed regularly, in line with STCW Regulation I/14 and MLC 2006 on training and familiarization."}, {"q": "Why is a drill that is only signed off a waste of time?", "o": ["The training matrix cannot then show the gaps in the department", "Without teaching and assessment nothing is actually learnt", "The record is not evidence unless the Master countersigns it", "The weak areas only come out during an appraisal interview"], "a": 1, "why": "Drills are held on schedule and with real practice, not just a signature, so a drill without teaching and assessment is wasted; ISM Code Element 6 applies."}], "pscprep": [{"q": "Which items make up the list of common deficiencies checked before an inspection?", "o": ["Mooring ropes, hatch packing, cargo gear register, pumps, charts", "Lifeboat, bilge alarms, cargo gear register, fire pumps, stores", "Fire doors, ventilation closing, lifeboat, ISM records, charts", "Fire doors, lifejackets, garbage record book, muster list, bilges"], "a": 2, "why": "The common deficiencies to check are the fire doors, the ventilation closing, the lifeboat, the ISM records and the charts."}, {"q": "What is done before the port call to prepare for a port State inspection?", "o": ["An action plan is prepared for every deficiency expected", "The certificates close to expiry are renewed by the office", "The crew are briefed on the inspector's likely questions", "A self-inspection is run using the PSC checklist"], "a": 3, "why": "Run a self-inspection with the PSC checklist before arrival, and prepare the crew so they know the muster list and their own duties; the Paris MoU and Tokyo MoU Concentrated Inspection Campaigns set the focus."}, {"q": "Why does a collection of small deficiencies become an ISM finding?", "o": ["Together they show the management system is not working", "Each one is recorded separately against the same certificate", "The inspector must raise an ISM item once five are found", "They cannot all be closed within the given repair date"], "a": 0, "why": "A detention usually comes from an ISM failure rather than one broken item, and an ISM-related detention causes a much longer delay."}], "smsimpl": [{"q": "How often must the internal audit be carried out?", "o": ["At least once every 6 months", "At least once every 12 months", "At least once every 24 months", "At least once every 36 months"], "a": 1, "why": "An internal audit is held at least once every 12 months, under ISM Code Elements 5, 7, 9 and 12."}, {"q": "What is the correct action when a procedure in the SMS does not work in practice?", "o": ["Record a non-conformity each time it cannot be followed", "Follow it as written and report the difficulty at the audit", "Have it changed, rather than quietly ignoring it", "Raise it at the management review once the audit is closed"], "a": 2, "why": "A procedure that does not work must be changed, not quietly ignored, under ISM Code Elements 5, 7, 9 and 12."}, {"q": "Why is a near miss reported when nobody was hurt and nothing was broken?", "o": ["A non-conformity is raised if the report is not made", "The report is needed as evidence for the internal audit", "The procedure involved cannot be changed without it", "It is the chance to learn before a real accident"], "a": 3, "why": "A near miss is reported even when nobody was hurt because the most valuable lessons come from there, and not reporting throws away the chance to learn before the real accident happens."}], "cohandover": [{"q": "What form does the handover to the relieving Chief Officer take?", "o": ["A written note, signed by both officers", "A verbal briefing, with the Master in attendance", "An entry in the deck log signed by the reliever", "A checklist held in the planned maintenance system"], "a": 0, "why": "A written handover note is required, not just a conversation, and a note signed by both officers is normally required under ISM Code Element 6.3."}, {"q": "What is done on board before the outgoing Chief Officer goes ashore?", "o": ["A full inspection of the holds and tanks by the reliever", "A joint walk round the deck, the holds and the tanks", "A survey of the open defects with the Master attending", "A handover of the permits to work still open on board"], "a": 1, "why": "A joint walk round the deck, the holds and the tanks is made before you go ashore, under ISM Code Element 6.3 and the company handover procedure."}, {"q": "Why is a verbal handover not enough even between two competent officers?", "o": ["The company procedure requires the Master to countersign it", "The relieving officer cannot assess the open defects himself", "Information is lost, and nothing is left to check against", "The surveys coming up are not known to the outgoing officer"], "a": 2, "why": "The handover is where information disappears, so a written note covering cargo, ballast, stability, defects, surveys and crew is required under ISM Code Element 6.3."}], "charterers": [{"q": "Who gives the employment orders, and who has the last word on safety?", "o": ["The owner gives the employment orders and the charterer decides safety", "The charterer gives the employment orders and the owner decides safety", "The owner gives both the employment orders and the safety decision", "The charterer gives the employment orders and the Master decides safety"], "a": 3, "why": "The charterer gives the employment orders, but the Master follows the charterer on employment and never on safety; the Master's overriding duty is recognised in SOLAS V/34-1 and ISM Code 5.2."}, {"q": "How is an order that is against the safety of the ship handled?", "o": ["Refused in writing, with the reason stated", "Carried out, with the owner copied on the message", "Referred to the owner for a decision before replying", "Noted in the log and queried with the charterer by phone"], "a": 0, "why": "An order against safety is refused in writing with the reason stated, and the owner is copied on every important message from the charterer."}, {"q": "Why does a written order from the charterer not protect the Master who obeys it?", "o": ["The charterer's authority ends once the ship has been loaded", "The Master remains responsible for the safety of the ship", "The owner has not countersigned the order in writing", "The correspondence is not admissible evidence in a dispute"], "a": 1, "why": "The Master's overriding duty to safety is recognised in SOLAS V/34-1 and ISM Code 5.2, so following an unsafe order, such as entering a port that cannot take the ship's draught, still leaves the Master responsible."}], "agents": [{"q": "Who certifies that the port services charged in the disbursement account were actually received?", "o": ["The Master", "The port agent", "The charterer's broker", "The owner's accounts office"], "a": 0, "why": "Port disbursements are normally settled between owner and agent, but the Master certifies the services actually received, and the account is checked before it is signed."}, {"q": "Which document tells you whether the agent is working for the owner or for the charterer?", "o": ["The pre-arrival message", "The appointment letter", "The disbursement account", "The statement of facts"], "a": 1, "why": "The appointment letter establishes whose agent you are dealing with, which follows from the agency agreement and the charter party."}, {"q": "A service has just been ordered with the agent by telephone; what is the correct next step?", "o": ["Note it in the deck log and wait for the invoice", "Ask the agent to confirm it verbally on arrival", "Confirm the request to the agent by email", "Leave it until the disbursement account is presented"], "a": 2, "why": "Every request goes in writing, and telephone talk is confirmed by email so the record of what was ordered is complete."}], "norsof": [{"q": "What three conditions must be satisfied before a Notice of Readiness is tendered?", "o": ["Alongside the berth, holds cleaned and the bill of lading signed", "Inside the laycan, pilot on board and cargo documents ready", "At the place, cargo gear tested and the agent duly appointed", "At the place, ready in every respect and inside the laycan"], "a": 3, "why": "The charter party laytime clause and the Voylayrules require the ship to be at the place, ready in every respect and inside the laycan."}, {"q": "When does laytime begin to run?", "o": ["After the NOR and the turn time", "When the first line goes ashore", "When the vessel enters the port limits", "When the holds are passed by the surveyor"], "a": 0, "why": "Laytime starts after the NOR and the turn time, and demurrage hangs on it."}, {"q": "A NOR was tendered while hold cleaning was still unfinished; what is the consequence?", "o": ["The NOR stands and laytime runs from the next working day", "The NOR is invalid and the laytime is lost", "The NOR becomes valid once the holds pass the survey", "The NOR is suspended until the charterer accepts it"], "a": 1, "why": "An invalid NOR can stop laytime from starting at all, so the tender must be made once and at the right time."}], "lop": [{"q": "In which two situations is a letter of indemnity most commonly demanded?", "o": ["A disputed draft survey and a short loading claimed by the shipper", "A late NOR tender and a mate's receipt left unsigned by the officer", "A clean bill of lading over damaged cargo and discharge without an original B/L", "A berth shift ordered by the terminal and a change of the discharge port"], "a": 2, "why": "An LOI is often demanded for a clean bill of lading over damaged cargo, or for discharge without the original bill of lading."}, {"q": "What is the correct response to a demand for a clean bill of lading over damaged cargo?", "o": ["Sign it clean and record the damage in the deck log instead", "Sign it clean once the charterer's letter of indemnity is held", "Sign it clean and issue a letter of protest to the shipper", "Issue a claused bill of lading carrying the true remarks"], "a": 3, "why": "The right answer is a claused bill of lading carrying the true remarks; signing a clean B/L over cargo known to be damaged can be treated as fraud."}, {"q": "Why is an LOI from a large and reputable company still of little use to the Master?", "o": ["It does not bind a third party such as the true cargo owner", "It is valid only in the country in which it was issued", "It lapses once the vessel has sailed from the load port", "It must be countersigned by the flag State to take effect"], "a": 0, "why": "The LOI is not binding on a third party such as the true cargo owner, and P&I cover is normally lost in that situation."}], "claims": [{"q": "Within what time must notice of loss or damage normally be given?", "o": ["Within 24 hours of completion of discharge", "Within three days of delivery", "Within seven days of delivery", "Within one month of the date of the B/L"], "a": 1, "why": "Under the Hague-Visby Rules Article III and IV, notice of loss or damage normally has to be given within three days of delivery."}, {"q": "What is the correct first action once cargo damage is discovered?", "o": ["Record it in the log and report at the end of the port call", "Ask the receiver to accept the cargo under written reservation", "Call for a joint survey and report to the P&I club at once", "Wait for the charterer to appoint a surveyor before acting"], "a": 2, "why": "A joint survey is called for as soon as damage is found, and the P&I club is informed at once so their instructions can be followed."}, {"q": "Which record gives the strongest defence against a claim on the condition of the cargo?", "o": ["The chief officer's night orders for the operation", "The agent's cargo tally sheets for each hatch", "The draft survey worked on arrival and on departure", "The remarks entered on the mate's receipt"], "a": 3, "why": "Mate's receipt remarks are the strongest defence against a claim on cargo condition, because a claim is won on the evidence gathered at the time."}], "increp": [{"q": "How quickly must the VDR data be preserved after an incident?", "o": ["Immediately after the incident", "Within 24 hours of the incident", "Before the next port of call", "Before the investigator boards"], "a": 0, "why": "SOLAS XI-1/6 and the Casualty Investigation Code require VDR data to be preserved immediately after an incident, as there is limited time before it is overwritten."}, {"q": "How are witnesses to be handled when evidence is gathered after an accident?", "o": ["Brought together so that the accounts can be reconciled", "Each statement taken
