<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECADEMY · Deck Knowledge · KUP</title>
<style>
:root{--bg:#070d11;--panel:#101b21;--panel2:#0c161b;--line:#22343d;--line2:#2d4350;--tx:#e9f1f4;--mut:#93a9b3;
 --acc:#45d9a0;--hi:#f2c14e;--red:#ff5a6a;--blue:#56b8e6;--r:12px;--sh:0 10px 28px rgba(0,0,0,.42)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;color:var(--tx);display:flex;flex-direction:column;font:16px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
 background:radial-gradient(1100px 620px at 18% -8%,#16303c 0%,transparent 62%),radial-gradient(900px 560px at 92% 4%,#17242e 0%,transparent 58%),var(--bg)}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;flex-wrap:wrap;background:linear-gradient(180deg,#0a1217,#070d11);border-bottom:1px solid var(--line)}
header b{letter-spacing:.16em;color:var(--red)}
header .sub{color:var(--mut);font-size:13.5px}
header .sp{flex:1}
.pill{font:700 11px Arial;letter-spacing:.12em;padding:4px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--mut)}
main{flex:1;display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:16px;padding:16px;min-height:0}
@media(max-width:900px){main{grid-template-columns:1fr;padding:12px}aside{max-height:36vh}}
aside{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--r);
 padding:10px;overflow-y:auto;box-shadow:var(--sh)}
.rk{font:800 10.5px Arial;letter-spacing:.16em;color:var(--acc);padding:12px 10px 6px}
.rk.co{color:var(--hi)} .rk.ma{color:var(--blue)} .rk.to{color:#ff9b6a}
.tp{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:9px;color:#cfdde3;
 padding:9px 11px;font:inherit;font-size:14.3px;cursor:pointer;transition:all .13s}
.tp:hover{background:rgba(255,255,255,.04);border-color:var(--line)}
.tp.on{background:rgba(86,184,230,.12);border-color:#36677f;color:#fff;font-weight:600}
.tp small{display:block;color:var(--mut);font-size:12px;font-weight:400}
article{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--r);
 padding:24px 26px;overflow-y:auto;box-shadow:var(--sh)}
h1{margin:0 0 4px;font-size:27px;line-height:1.2;letter-spacing:-.01em}
.kick{color:var(--mut);font-size:13.5px;margin:0 0 16px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.lead{font-size:18.5px;font-weight:600;line-height:1.5;margin:0 0 14px;max-width:66ch}
h3{margin:22px 0 8px;font-size:12px;letter-spacing:.15em;color:var(--acc);font-weight:800}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#doc>*{animation:rise .42s cubic-bezier(.22,.9,.3,1) both}
#doc>*:nth-child(1){animation-delay:.00s}#doc>*:nth-child(2){animation-delay:.04s}
#doc>*:nth-child(3){animation-delay:.08s}#doc>*:nth-child(4){animation-delay:.12s}
#doc>*:nth-child(5){animation-delay:.16s}#doc>*:nth-child(6){animation-delay:.20s}
#doc>*:nth-child(7){animation-delay:.24s}#doc>*:nth-child(8){animation-delay:.28s}
#doc>*:nth-child(9){animation-delay:.32s}#doc>*:nth-child(n+10){animation-delay:.36s}
.kick{position:relative}
.kick::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:92px;background:var(--acc);
 transform-origin:left;animation:wipe .55s .18s cubic-bezier(.22,.9,.3,1) both}
#doc li{animation:rise .36s both}
#doc li:nth-child(1){animation-delay:.16s}#doc li:nth-child(2){animation-delay:.21s}
#doc li:nth-child(3){animation-delay:.26s}#doc li:nth-child(4){animation-delay:.31s}
#doc li:nth-child(5){animation-delay:.36s}#doc li:nth-child(n+6){animation-delay:.41s}
.kc{transition:transform .18s,border-color .18s,background .18s}
.kc:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.05)}
@media (prefers-reduced-motion:reduce){#doc>*,#doc li,.kick::after{animation:none}}
ul{margin:0 0 6px;padding-left:20px;max-width:68ch}
li{margin:7px 0}
li b{color:var(--hi)}
.kup{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:10px 0 4px}
.kc{border:1px solid var(--line);border-radius:11px;padding:13px 15px;background:rgba(255,255,255,.025)}
.kc h4{margin:0 0 6px;font:800 11px Arial;letter-spacing:.14em;color:var(--blue)}
.kc.u h4{color:var(--hi)} .kc.p h4{color:var(--acc)}
.kc p{margin:0;font-size:14.3px;color:#dbe7eb}
.ref{border-left:3px solid var(--blue);background:linear-gradient(90deg,rgba(86,184,230,.10),rgba(86,184,230,.02));
 padding:12px 15px;border-radius:0 9px 9px 0;font-size:14.3px;margin:16px 0;max-width:72ch}
.ref::before{content:"RULE AND REFERENCE";display:block;font:800 10.5px Arial;letter-spacing:.16em;color:var(--blue);margin-bottom:5px}
.watch{border-left:3px solid #e0533f;background:linear-gradient(90deg,rgba(224,83,63,.12),rgba(224,83,63,.02));
 padding:12px 15px;border-radius:0 9px 9px 0;font-size:14.3px;margin:16px 0;max-width:72ch}
.watch::before{content:"COMMON MISTAKE";display:block;font:800 10.5px Arial;letter-spacing:.16em;color:#ff8a78;margin-bottom:5px}
.foot{text-align:center;padding:7px;color:#9b8a62;font-size:11px;background:#070d11}
.empty{color:var(--mut);padding:40px 10px;text-align:center}
mark{background:none;color:var(--hi);font-weight:700}
.srch{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--tx);font:inherit;font-size:14px;margin-bottom:4px}
/* ---- progress rail ---- */
.tp{position:relative;padding-right:30px}
.tp .dot{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:9px;height:9px;border-radius:50%;
 border:1.5px solid #3b505c;transition:all .2s}
.tp.pass .dot{background:var(--acc);border-color:var(--acc);box-shadow:0 0 8px rgba(69,217,160,.55)}
.tp.seen .dot{background:#5c7280;border-color:#5c7280}
.prog{display:flex;align-items:center;gap:8px;padding:4px 10px 8px;font:700 10.5px Arial;letter-spacing:.1em;color:var(--mut)}
.prog .bar{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#56b8e6);width:0;transition:width .5s cubic-bezier(.22,.9,.3,1)}
.hdbtn{background:none;border:1px solid var(--line2);color:var(--mut);border-radius:999px;font:700 11px Arial;
 letter-spacing:.1em;padding:5px 11px;cursor:pointer;transition:all .15s}
.hdbtn:hover{color:var(--tx);border-color:var(--acc)}
.hdbtn.on{color:#06231a;background:var(--acc);border-color:var(--acc)}
/* ---- recall mode ---- */
.veil{position:relative;cursor:pointer}
.veil>*{filter:blur(6px);opacity:.42;pointer-events:none;transition:all .35s}
.veil::after{content:"TAP TO REVEAL";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 font:800 11px Arial;letter-spacing:.18em;color:var(--hi);background:rgba(7,13,17,.28);border-radius:10px}
.veil.show>*{filter:none;opacity:1;pointer-events:auto}
.veil.show::after{display:none}
/* ---- animated figures ---- */
figure.ani{margin:16px 0 18px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0b161c;max-width:72ch}
figure.ani svg.fig{display:block;width:100%;height:auto}
figure.ani figcaption{padding:9px 14px;font-size:12.6px;color:#9fb3bd;background:rgba(255,255,255,.028);border-top:1px solid var(--line)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(22px)}}
@keyframes gust{0%{opacity:0;transform:translateX(-14px)}25%{opacity:1}100%{opacity:0;transform:translateX(26px)}}
@keyframes dashmove{to{stroke-dashoffset:-44}}
@keyframes rainfall{0%{opacity:0;transform:translateY(-16px)}40%{opacity:.9}100%{opacity:0;transform:translateY(26px)}}
@keyframes cld{0%,100%{transform:translateX(0)}50%{transform:translateX(-26px)}}
@keyframes swellw{0%,100%{transform:translateX(0) scaleY(1)}50%{transform:translateX(18px) scaleY(1.25)}}
@keyframes slide{to{transform:translateX(640px)}}
@keyframes slide2{to{transform:translateX(440px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
@keyframes fogroll{0%{opacity:.25;transform:translateX(-16px)}50%{opacity:1}100%{opacity:.25;transform:translateX(16px)}}
@keyframes sink{0%,100%{transform:translateY(0)}55%{transform:translateY(17px) rotate(.8deg)}}
@keyframes spdbar{0%,100%{width:46px}55%{width:180px}}
@keyframes ukcp{0%,100%{opacity:.4}55%{opacity:1}}
@keyframes drawp{to{stroke-dashoffset:0}}
@keyframes ping{0%{r:9;opacity:.9}100%{r:26;opacity:0}}
@keyframes stepglow{0%,70%,100%{opacity:.34}12%,48%{opacity:1}}
@keyframes heel{0%,100%{transform:rotate(0)}50%{transform:rotate(5.5deg)}}
@keyframes slosh{0%,100%{transform:translateX(0) skewX(0)}50%{transform:translateX(13px) skewX(-5deg)}}
@keyframes clockw{0%{width:0}100%{width:560px}}
@keyframes clockd{0%{cx:40px}100%{cx:600px}}
@keyframes pinpull{0%,55%{transform:translate(0,0);opacity:1}75%,100%{transform:translate(26px,-16px);opacity:0}}
@keyframes jet{0%,50%{opacity:0;stroke-dasharray:0 200}70%{opacity:.6}100%{opacity:.5;stroke-dasharray:200 0}}
@keyframes flamed{0%,55%{transform:scale(1)}100%{transform:scale(.3);opacity:.25}}
@keyframes restb{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.spin{animation:spin 9s linear infinite}
.spin-s{animation:spin 16s linear infinite}
.drift{animation:drift 11s ease-in-out infinite}
.wgust{animation:gust 2.6s ease-in-out infinite}
.wgust.d1{animation-delay:.6s}.wgust.d2{animation-delay:1.2s}
.dash{stroke-dasharray:6 5;animation:dashmove 1.6s linear infinite}
.rain{animation:rainfall 1.5s linear infinite}
.rain.hard{animation-duration:.9s}
.rain.d0{animation-delay:0s}.rain.d1{animation-delay:.3s}.rain.d2{animation-delay:.65s}
.cldrift{animation:cld 14s ease-in-out infinite}
.swellw{animation:swellw 4.2s ease-in-out infinite;transform-origin:center}
.wavemove{animation:slide 3.4s linear infinite}
.swellmove{animation:slide2 6.5s linear infinite}
.bob{animation:bob 3.4s ease-in-out infinite;transform-origin:320px 150px}
.fogroll{animation:fogroll 7s ease-in-out infinite}
.sink{animation:sink 6s ease-in-out infinite;transform-origin:320px 120px}
.spdbar{animation:spdbar 6s ease-in-out infinite}
.ukc{animation:ukcp 6s ease-in-out infinite}
.draw{stroke-dasharray:900;stroke-dashoffset:900;animation:drawp 7s linear infinite}
.ping{animation:ping 2.2s ease-out infinite}
.step{animation:stepglow 7s linear infinite;opacity:.34}
.step.s0{animation-delay:0s}.step.s1{animation-delay:1.1s}.step.s2{animation-delay:2.2s}
.step.s3{animation-delay:3.3s}.step.s4{animation-delay:4.4s}.step.s5{animation-delay:5.5s}
.heel{animation:heel 5.5s ease-in-out infinite}
.slosh{animation:slosh 5.5s ease-in-out infinite}
.clock{animation:clockw 7s linear infinite}
.clockdot{animation:clockd 7s linear infinite}
.escR,.escL{animation:gust 3.4s ease-in-out infinite}
.escL{animation-delay:1.1s}
.pin{animation:pinpull 5s ease-in-out infinite}
.jet{animation:jet 5s ease-in-out infinite}
.flame{animation:flamed 5s ease-in-out infinite;transform-origin:430px 150px}
.restbar{transform-origin:left;animation:restb 1.1s cubic-bezier(.22,.9,.3,1) both}
.restbar.d1{animation-delay:.5s}
@media (prefers-reduced-motion:reduce){figure.ani *{animation:none !important}}
/* ---- quiz ---- */
.quiz{margin:22px 0 4px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.022);overflow:hidden}
.quiz .qh{display:flex;align-items:center;gap:10px;padding:11px 15px;background:rgba(86,184,230,.07);border-bottom:1px solid var(--line)}
.quiz .qh b{font:800 11px Arial;letter-spacing:.16em;color:var(--blue)}
.quiz .qh .sp{flex:1}
.quiz .qh .sc{font:700 12px Arial;color:var(--mut)}
.qi{padding:14px 15px;border-bottom:1px solid rgba(255,255,255,.05)}
.qi:last-child{border-bottom:0}
.qi .qt{font-weight:600;font-size:15px;margin:0 0 10px;display:flex;gap:9px;align-items:flex-start}
.qi .qt span{flex:none;width:21px;height:21px;border-radius:50%;background:rgba(86,184,230,.16);color:var(--blue);
 font:800 11px Arial;display:flex;align-items:center;justify-content:center;margin-top:2px}
.op{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 13px;border-radius:9px;cursor:pointer;
 border:1px solid var(--line);background:rgba(0,0,0,.2);color:#dbe7eb;font:inherit;font-size:14.2px;transition:all .16s}
.op:hover:not(:disabled){border-color:var(--line2);background:rgba(255,255,255,.05);transform:translateX(3px)}
.op:disabled{cursor:default}
.op.right{border-color:var(--acc);background:rgba(69,217,160,.14);color:#eafff6}
.op.wrong{border-color:#e0533f;background:rgba(224,83,63,.13);color:#ffe6e2}
.op .tick{float:right;font-weight:800}
.why{margin:8px 0 0;padding:10px 13px;border-left:3px solid var(--acc);border-radius:0 8px 8px 0;
 background:rgba(69,217,160,.07);font-size:13.8px;color:#cfe7de;animation:rise .3s both}
.why.no{border-left-color:#e0533f;background:rgba(224,83,63,.07);color:#f0d6d1}
.qdone{padding:13px 15px;font-size:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(255,255,255,.03)}
.qdone b{font-size:17px}
.qdone .again{background:none;border:1px solid var(--line2);color:var(--mut);border-radius:8px;padding:6px 12px;
 cursor:pointer;font:inherit;font-size:13px}
.qdone .again:hover{color:var(--tx);border-color:var(--acc)}
</style></head><body>
<header><b>ECADEMY</b><span class="sub">Deck Knowledge · Knowledge, Understanding and Proficiency</span><span class="sp"></span>
<button class="hdbtn" id="recall" title="Hide the bullets and the reference, then tap to reveal">RECALL MODE</button>
<button class="hdbtn" id="reset" title="Clear your scores on this device">RESET</button>
<span class="pill" id="cnt"></span></header>
<main>
  <aside><input class="srch" id="q" placeholder="Search a topic…"><div id="list"></div></aside>
  <article id="doc"><div class="empty">Select a topic from the list.</div></article>
</main>

T.push({"id": "tides", "r": "so", "g": "Charts and Publications", "t": "Tide Tables and Tidal Streams", "lead": "The tide tells you **how high the water is** and when. Under-keel clearance and the time of entry both depend on it.", "pts": ["**Standard port**: read the time and height of HW and LW directly.", "**Secondary port**: time and height differences are added or subtracted.", "**Interpolation**: use the tidal curve for a time between HW and LW.", "**Chart datum** is the baseline of charted depth; the tide is added to it.", "**Tidal stream atlas and diamonds** give the direction and rate of the current, not the height.", "Put the **tidal window** and the latest departure time into the passage plan."], "ref": "SOLAS V/34 and the ship's UKC policy. Minimum UKC is normally stated in the SMS, not in SOLAS, so follow the company requirement.", "k": "Find HW and LW for one standard port and one secondary port on a given date.", "u": "Explain why charted depth alone is not enough, and how UKC changes within a tidal window.", "p": "Calculate the height of tide at a given time and the resulting UKC, then state whether it is safe to proceed.", "err": "Standard port times were used at a secondary port with no correction, or zone time and summer time were forgotten.", "stcw": "STCW Table A-II/1 — tides and tidal streams."});
T.push({"id": "alrs", "r": "so", "g": "Charts and Publications", "t": "Radio Signals and Admiralty Publications", "lead": "The **List of Radio Signals** tells you how to communicate and where to get information at sea.", "pts": ["**Volume 1**: coast radio stations and maritime radio services.", "**Volume 2**: radio aids to navigation, differential GNSS and legal time.", "**Volume 3**: maritime safety information, NAVTEX and SafetyNET.", "**Volume 4**: meteorological observation stations.", "**Volume 5**: GMDSS, including the sea areas and distress procedures.", "**Volume 6**: pilot services, VTS and port operations."], "ref": "SOLAS V/27 and Chapter IV. ALRS Volume 5 is the usual reference for GMDSS and for identifying the sea area.", "k": "State which volume to use for VTS reporting, for the NAVTEX station list, and for pilot services.", "u": "Explain why the ALRS must be kept updated, especially when a VTS frequency or a NAVTEX schedule changes.", "p": "Before entering a port, take the VTS reporting point and frequency from Volume 6 and put them into the passage plan.", "stcw": "STCW Table A-II/1 — use of nautical publications; A-IV/2 — GMDSS."});
T.push({"id": "tandp", "r": "so", "g": "Charts and Publications", "t": "Temporary and Preliminary Notices", "lead": "A **T** notice is a temporary change and a **P** notice is advance warning of a change to come. Neither one is inked permanently onto the chart.", "pts": ["**T (Temporary)**: for example, an unlit buoy or a temporary dredging area.", "**P (Preliminary)**: for example, a new berth under construction or a light due to be replaced.", "These are never inked in permanently; use **pencil or an overlay** on the paper chart.", "On ECDIS they show as the **T and P layer**, which must be switched ON.", "The **Annual Summary of NtM** states which ones remain in force.", "Once a change becomes permanent it is issued as an **ordinary correction** and the T or P is withdrawn."], "ref": "SOLAS V/27. At PSC inspection, one common check is whether the ship's record shows which T and P notices are still in force.", "k": "Explain the difference between T and P and state where the list of in-force notices is found.", "u": "Explain why these are not drawn in permanently and why a forgotten T notice is a danger.", "p": "Using the Annual Summary, audit the ship's T and P file and withdraw the expired ones.", "err": "The T and P layer was left OFF on the ECDIS, so the temporary hazard was never seen.", "stcw": "STCW Table A-II/1 — maintain charts and publications."});
T.push({"id": "chartinv", "r": "so", "g": "Charts and Publications", "t": "Chart and Publication Inventory", "lead": "The inventory proves that the ship holds the **correct and sufficient** charts and publications for the voyage it intends to make.", "pts": ["**Chart catalogue** and folio list for the regions to be transited.", "**Status of each chart**: edition, last correction, and whether it has been withdrawn.", "**ENC permit list** with the expiry of each cell.", "**Publication list** with the edition year of each one.", "Reviewed on every **new voyage order** and before inspection.", "Any shortfall is **put right at once** by ordering through the agent or the chart supplier."], "ref": "SOLAS V/19.2.1.4 and V/27. Charts and publications must be adequate for the **intended voyage**, not just for the usual route.", "k": "Check the inventory to find whether the ship holds charts for a new destination.", "u": "Explain why a withdrawn chart cannot be used even when it still looks perfectly good.", "p": "Build a gap list for a new voyage order and prepare the order for what is missing.", "stcw": "STCW Table A-II/1 — nautical publications."});
T.push({"id": "seaareas", "r": "so", "g": "GMDSS", "t": "GMDSS Sea Areas", "lead": "The **sea area** dictates what radio equipment the ship must carry and how it can call for help.", "pts": ["**A1**: within VHF coverage of a coast station fitted with DSC, typically 20 to 30 nm.", "**A2**: within MF DSC coverage, typically out to 100 nm, outside A1.", "**A3**: within Inmarsat geostationary coverage, roughly 70° N to 70° S, outside A1 and A2.", "**A4**: outside all of these, typically the polar regions; **HF** is the primary means.", "The **carriage requirement** follows the furthest sea area on the voyage.", "The limits of each area are listed in **ALRS Volume 5**."], "ref": "SOLAS Chapter IV, Regulation 2 and 8 to 11. A ship trading in A3 must carry VHF, MF or HF and Inmarsat, or else HF kept available at all times.", "k": "State which sea areas the next voyage crosses and what equipment is required there.", "u": "Explain why VHF DSC is not enough in mid-ocean, and why HF is needed in A4.", "p": "From the passage plan, identify the sea areas to be crossed and verify that all required equipment works before departure.", "stcw": "STCW Table A-IV/2 — GMDSS radio operation."});
T.push({"id": "distmsg", "r": "so", "g": "GMDSS", "t": "Distress, Urgency and Safety Messages", "lead": "Three levels of priority: **MAYDAY** for distress, **PAN-PAN** for urgency, and **SECURITE** for safety. Each carries a different weight and a different correct use.", "pts": ["**MAYDAY**: grave danger to the ship or to a person, with immediate assistance required.", "**PAN-PAN**: a serious situation but no immediate danger to life — for example, loss of main engine in a safe position.", "**SECURITE**: a warning about the safety of navigation or about the weather.", "On DSC, send the **alert** first, then follow it with **voice or telex** on the matching frequency.", "A MAYDAY contains: name and callsign, **position**, nature of the distress, assistance needed, number of persons.", "A **false alert** is cancelled at once on the same means and frequency, and then reported."], "ref": "SOLAS Chapter IV and the IAMSAR Manual Volume III. A distress alert must carry a position with a time stamp no more than 4 hours old.", "k": "Speak the correct MAYDAY format and state the correct frequency to use after the DSC alert.", "u": "Explain why sending a MAYDAY in a PAN-PAN situation is wrong, and what a false alert does to SAR.", "p": "Carry out the full DSC distress sequence on the simulator, including the follow-up voice call and the cancellation of a false alert.", "err": "An accidental alert was never cancelled. An uncancelled false alert can draw a full SAR response and a penalty.", "stcw": "STCW Table A-IV/2 — transmit and receive distress, urgency and safety communications."});
T.push({"id": "reserve", "r": "so", "g": "GMDSS", "t": "Reserve Source of Energy", "lead": "When main and emergency power are both lost, the **radio must still run**. That is the job of the reserve source of energy.", "pts": ["It must be able to power the **VHF and the MF or HF or Inmarsat** at the same time.", "**1 hour** where the ship has an emergency source of power; **6 hours** where it does not.", "It is normally a **battery**, with automatic changeover when the main supply fails.", "**Weekly**: check the condition of the battery where there is no charger test facility.", "**Monthly**: connections secure, terminals clean, and the battery compartment in good condition.", "**Annually**: capacity or discharge test to the maker's instructions and the flag requirement."], "ref": "SOLAS IV/13. Testing of the reserve source of energy is recorded in the radio log.", "k": "State the required supply duration for your ship and where the battery is installed.", "u": "Explain why 6 hours applies where there is no emergency source, and why voltage alone is not a measure of condition.", "p": "Carry out the weekly and monthly checks, record the results, and report any low reading.", "err": "Only voltage was checked, with no test of the ability to carry load. Voltage can read high and still collapse under load.", "stcw": "STCW Table A-IV/2 — maintain radio services and equipment."});
T.push({"id": "radiolog", "r": "so", "g": "GMDSS", "t": "Radio Logbook and Records", "lead": "The radio log is the **proof** that radio operation was safe and correct. In an investigation or at PSC, it is the first thing looked at.", "pts": ["Record all **distress, urgency and safety** traffic received or sent.", "Record the **required tests**: daily, weekly and monthly.", "Record the **name of the designated GMDSS operator** and the certificate number.", "Record the **ship's position** at least once each day.", "Record any **breakdown and repair** of radio equipment.", "Signed by the **Master** and the operator; retained for the period the flag requires."], "ref": "SOLAS IV/17 and the ITU Radio Regulations. The records must be held at the radio station and ready for inspection.", "k": "Show where the weekly DSC test is recorded and who signs for it.", "u": "Explain why the daily position entry matters and how it helps SAR.", "p": "Fill in the radio log for one week, with every test included, and submit it to the Master for checking.", "stcw": "STCW Table A-IV/2 — maintain records of radio communications."});
T.push({"id": "gmdsstests", "r": "so", "g": "GMDSS", "t": "GMDSS Daily, Weekly and Monthly Tests", "lead": "Having the radio fitted is not enough. There are **scheduled tests** daily, weekly and monthly.", "pts": ["**Daily**: internal DSC test without radiation; check the printer and the reserve battery voltage.", "**Weekly**: DSC test call to a coast station when in range; check the reserve source of energy where there is no charger test.", "**Monthly**: on-load battery check, condition of antennas and insulators, inspection of EPIRB and SART without activating them.", "The **EPIRB** has a self-test; never expose it to water or let it transmit.", "Every result is **entered in the radio log** with date and signature.", "A defect is **reported at once**, with an alternative means of communication in place until the repair."], "ref": "SOLAS IV/15.9 and flag administration guidance. A weekly test that was not carried out is a common PSC deficiency.", "k": "List the daily, weekly and monthly tests and who carries out each one.", "u": "Explain why the daily test is done without radiation, and why an EPIRB must never simply be activated as a test.", "p": "Carry out one full week of the test cycle, record it, and prepare a defect report for one failed test.", "err": "An EPIRB was activated as a test. That produces a false distress and an investigation by the SAR authority.", "stcw": "STCW Table A-IV/2 — maintain radio services."});
T.push({"id": "navchk", "r": "so", "g": "Bridge Records", "t": "Navigation Equipment Checklists", "lead": "The checklist makes sure nothing is forgotten when you are busy or tired. It is not just paper; it is a **working guide**.", "pts": ["Separate checklists for **pre-departure, pre-arrival, pilotage and heavy weather**.", "Completed **while checking**, not afterwards.", "Every item gets a clear **pass or fail**, not just a tick.", "A failed item gets a **defect entry** and an interim measure.", "Signed by the **officer who did the work**; nobody else can sign for it.", "Reviewed by the **Master** before the manoeuvre."], "ref": "SOLAS V/19 and ISM Code Element 7 — procedures for key shipboard operations. The checklist forms part of the SMS.", "k": "State which checklist to use on arrival, on departure, and before pilotage.", "u": "Explain why a pre-filled checklist is dangerous and how an audit finds it.", "p": "Carry out one pre-departure checklist on the real equipment and raise a defect entry for one item that fails.", "err": "The checklist was filled in while sitting at the chart table. This is the most common finding in internal audits.", "stcw": "STCW Table A-II/1 — maintain a safe navigational watch."});
T.push({"id": "prearr", "r": "so", "g": "Bridge Records", "t": "Pre-Arrival and Pre-Departure Tests", "lead": "Before every manoeuvre, you test the things you will have to trust in the next hour.", "pts": ["**Steering gear**: test full lock-to-lock, all power units, the remote and the emergency steering, **within 12 hours before departure**.", "**Telegraph and engine orders**: test ahead and astern together with the engine room.", "**Whistle, navigation lights, signal lights and searchlight**.", "**Radar, ECDIS, gyro, magnetic compass, echo sounder, speed log and AIS**.", "**Internal communications**: bridge to engine room, bridge to forward and aft stations.", "**Bridge clocks and recorders** all showing the same time."], "ref": "SOLAS V/26 — steering gear testing and drills. The emergency steering drill is carried out at least once every 3 months.", "k": "List the tests required within 12 hours before departure.", "u": "Explain why every steering power unit must be tested and not just one.", "p": "Lead the pre-departure test with the engine room, record the times and results, and report to the Master.", "stcw": "STCW Table A-II/1 — maintain a safe navigational watch; A-II/2 — control the operation of the ship."});
T.push({"id": "navdefect", "r": "so", "g": "Bridge Records", "t": "Navigation Defect Reporting", "lead": "Broken equipment is not only a repair problem. It is a **risk to be managed** for as long as it stays unrepaired.", "pts": ["**Record it at once**: what failed, when it was noticed, and the effect on navigation.", "**Report to the Master**, and where required, to the company, the flag and class.", "Put **mitigation** in place: an extra lookout, for instance, when only one radar works.", "Update the **passage plan** where the ship's capability is affected.", "Enter it in the **planned maintenance system** and track it until closed.", "Once repaired, **test it and record it** before returning it to service."], "ref": "SOLAS V/16 and ISM Code Element 9 — reports and analysis of non-conformities. Failure of navigation equipment can require a report to the Administration.", "k": "State who a failed gyro is reported to and where the failure is recorded.", "u": "Explain why reporting alone is not enough, and why an interim measure is needed.", "p": "Produce a complete defect report for a failed radar, with the mitigation and the proposed repair.", "err": "The defect was reported but the watch routine never changed. The risk stays exactly the same until an extra measure is in place.", "stcw": "STCW Table A-II/1 — maintain a safe navigational watch."});
T.push({"id": "cargoplan", "r": "co", "g": "Cargo Operations", "t": "Cargo Planning and Stowage", "lead": "The cargo plan is the **agreement** between ship, terminal and charterer on what is loaded, where, and in what order.", "pts": ["**Quantity and distribution** per hold, worked against the hydrostatic and stability limits.", "**Stress check**: shear force and bending moment at every stage, not only at the end.", "**Draught and trim** on departure, including air draught for bridges and cranes.", "**Segregation** of different cargoes and of dangerous goods.", "**Deadweight calculation**: bunkers, fresh water, ballast, constant and cargo.", "Signed by the **Master** before operations start."], "ref": "SOLAS VI/2 and VI/5, and the Code of Safe Practice for Cargo Stowage and Securing. For bulk, the IMSBC Code is the guide.", "k": "Read the cargo plan and state the tonnage per hold, the final draught and the trim.", "u": "Explain why stress must be checked at every stage and not only in the final condition.", "p": "Produce a loading plan for a given cargo and verify it on the loading computer, including every intermediate stage.", "err": "The final condition was correct but the bending moment went over the limit midway through loading. That is where the ship gets damaged.", "stcw": "STCW Table A-II/2 — plan and ensure safe loading, stowage, securing, care and unloading of cargoes."});
T.push({"id": "loadseq", "r": "co", "g": "Cargo Operations", "t": "Loading and Discharging Sequence", "lead": "The sequence dictates the **stress, trim and list** while the operation runs. Quantity alone is not what matters.", "pts": ["Break the operation into **pours or stages**, each one with a target tonnage.", "Match **deballasting** to the loading rate so draught and stress stay within limits.", "Set a **check point** at every stage: draught, list, stress and ullage.", "Write down the **maximum loading rate** and the stop times.", "Hold a **contingency** for a ballast pump failure or a change in the terminal's rate.", "Agreed and **signed with the terminal** before the start."], "ref": "SOLAS VI/7.3 and the BLU Code (Code of Practice for the Safe Loading and Unloading of Bulk Carriers). The loading plan must be on board and agreed.", "k": "Read the sequence and state the tonnage and ballast condition at each stage.", "u": "Explain why loading fast into one hold while deballasting runs slow is dangerous.", "p": "Run one sequence on the loading computer, stop at every stage, and compare the calculated draught with the actual draught.", "err": "Loading was never stopped at the check point. By the final stage it was too late to correct the stress.", "stcw": "STCW Table A-II/2 — cargo handling and stowage."});
T.push({"id": "cargotrim", "r": "co", "g": "Cargo Operations", "t": "Cargo Distribution and Trim", "lead": "Distribution sets the **trim, stress and stability**. The best answer differs for each of the three, so a compromise is needed.", "pts": ["**Alternate hold loading** gives a higher GM but also higher stress.", "**Homogeneous loading** is easier on the structure but gives a lower GM.", "**Trim by the stern** is normally needed for propeller immersion and steering.", "**Hogging and sagging** show up in the difference between the mean draught and the midship draught.", "**Air draught** reduces as the ship floats deeper.", "**Final trim** must stay within the limits of the trim table and the loading manual."], "ref": "The ship's loading manual and approved stability booklet. On a bulk carrier, alternate loading is permitted only where the loading manual states it.", "k": "From a given loading condition, state the trim, the mean draught and whether the ship is hogging or sagging.", "u": "Explain why alternate loading cannot simply be copied onto a ship that is not approved for it.", "p": "Adjust the distribution to reach a target trim without exceeding the stress and GM limits.", "stcw": "STCW Table A-II/2 — stowage and securing; trim and stability."});
T.push({"id": "loadcomp", "r": "co", "g": "Cargo Operations", "t": "Loading Computer and Instrument Use", "lead": "The loading computer is a **tool, not a judge**. Its answer is right only when the input is right and the result has been verified.", "pts": ["It is **approved** by class and has a required **annual test** using the test conditions in the manual.", "Enter the **actual bunkers, fresh water and constant**, not the figures you are used to.", "Check the **ballast tank soundings** instead of assuming what is in the tanks.", "Compare the calculated draught with the **draught read** at the ship's side.", "Keep the **printout** of the final condition as part of the records.", "Where the difference is large, find the error before loading goes on."], "ref": "SOLAS II-1/5-1 and the class requirement for loading instruments. Annual verification using the test conditions is mandatory.", "k": "State when the loading computer was last tested and where the result is recorded.", "u": "Explain why a small error in the constant or in the ballast becomes a large error in GM.", "p": "Input one full condition, print it, and verify it against the actual draught and a manual calculation.", "err": "The computer was trusted even with a 20 cm difference from the read draught. The error was in the input, not in the ship.", "stcw": "STCW Table A-II/2 — use of stability and stress tables, diagrams and stress calculating equipment."});
T.push({"id": "sscl", "r": "co", "g": "Cargo Operations", "t": "Ship–Shore Safety Checklist", "lead": "The Ship–Shore Safety Checklist is the **written agreement** on what must be ready before and during cargo work.", "pts": ["Completed **together** by ship and terminal, never passed back and forth.", "Some items carry an **R (re-check)** with a set repeat interval.", "Covers **communications, emergency signals, access and mooring**.", "Covers **oil spill equipment** and scupper plugs where required.", "An item that cannot be agreed is **never papered over**; stop the operation until it is put right.", "Signed by both sides and **retained** with the cargo records."], "ref": "SOLAS VI/7 and the BLU Code Appendix. On a tanker, ISGOTT provides the corresponding checklist.", "k": "State which items carry a re-check interval and how often they are repeated.", "u": "Explain why signing the whole checklist before everything has been checked is wrong.", "p": "Carry out the checklist with the terminal representative and record one disagreement and how it was resolved.", "stcw": "STCW Table A-II/2 — safe loading and unloading operations."});
T.push({"id": "holdprep", "r": "co", "g": "Cargo Operations", "t": "Cargo Hold Preparation", "lead": "Hold preparation is a frequent cause of **rejection** in port. The standard of cleanliness depends on the next cargo.", "pts": ["**Grain clean**: no odour, no residue of the previous cargo, dry and painted where required.", "**Normal clean**: no previous cargo, no loose debris, light staining accepted.", "**Shovel clean and load on top**: as agreed with the charterer.", "Check the **bilge wells, strum boxes and non-return valves**.", "Check the **tanktop, frames, ladders and hatch coamings** for dents or corrosion.", "**Hold dry** before loading; measure the moisture where the cargo is sensitive."], "ref": "The hold cleanliness standard sits in the charter party, not in SOLAS. The inspection is carried out by a draft surveyor or an independent inspector.", "k": "State the standard of cleanliness the next cargo calls for and what that standard means.", "u": "Explain why a small amount of residue is enough to have a hold rejected for grain loading.", "p": "Lead the cleaning and the pre-loading inspection, and prepare a hold condition report with photographs.", "err": "The hatch was bone dry but the bilge was wet. The inspection finds it and the ship loses time.", "stcw": "STCW Table A-II/2 — care of cargo during the voyage."});
T.push({"id": "cargodam", "r": "co", "g": "Cargo Operations", "t": "Cargo Damage Prevention", "lead": "Most claims come not from heavy weather but from **avoidable things**: water, heat, odour and poor care.", "pts": ["**Hatch cover weathertightness**: ultrasonic or hose test before the voyage.", "**Ventilation** to the correct rule for the type of cargo.", "**Sweat prevention**: monitor the dew point inside and outside.", "**Pre-loading and pre-discharge surveys**, with photographs and dates.", "**Mate's receipt remarks** where the cargo is already defective before loading.", "**Letter of protest** when the terminal does something that will damage the cargo or the ship."], "ref": "Hague-Visby Rules Article III — the carrier must exercise care in the loading, handling and discharge of the cargo. Proper records are the ship's defence against a claim.", "k": "Name the main causes of cargo damage and the way each one is prevented.", "u": "Explain why a carefully written mate's receipt remark is worth more than an argument after the event.", "p": "Carry out a pre-loading survey, record the defects, and prepare a letter of protest where required.", "stcw": "STCW Table A-II/2 — care of cargo during the voyage."});
T.push({"id": "cargodoc", "r": "co", "g": "Cargo Operations", "t": "Cargo Documentation", "lead": "The documents are the **only trace** of what happened. When a claim arrives a year later, they are all that is left.", "pts": ["**Mate's receipt** with the correct remarks and date.", "**Bill of lading**: never sign a clean B/L where the cargo is defective.", "**Cargo manifest and stowage plan** matching what is actually on board.", "**Draft survey report** where the quantity is based on draught.", "**Statement of facts and time sheet** for laytime.", "**Letters of protest** with the date, time and name of the person who received them."], "ref": "Hague-Visby Rules and the charter party. Signing a clean bill of lading for defective cargo can remove the insurer's cover.", "k": "List the documents to be prepared on departure and state who signs each one.", "u": "Explain the risk of signing a clean B/L against a letter of indemnity.", "p": "Prepare a complete set of cargo documents for one voyage and submit them to the Master for checking.", "err": "A clean B/L was signed because the agent was in a hurry. The ship carries the claim afterwards.", "stcw": "STCW Table A-II/2 — cargo documentation."});
T.push({"id": "imsbc", "r": "co", "g": "Bulk Cargoes", "t": "IMSBC Code Basics", "lead": "The IMSBC Code is the **law** on carrying solid bulk cargo. It sets out the hazard of each cargo and the precautions it demands.", "pts": ["Every cargo has an **individual schedule**, listed alphabetically by Bulk Cargo Shipping Name.", "The **shipper must provide** a cargo declaration before loading.", "The schedule states the **angle of repose, stowage factor, hazard and ventilation**.", "Each schedule carries its own **loading, carriage and discharge precautions**.", "A cargo **not listed in the Code** needs a tripartite agreement and the permission of the flag.", "**Emergency schedules** cover fire and a poisoned atmosphere."], "ref": "SOLAS VI/1 and the IMSBC Code, mandatory since 2011. The cargo declaration is required before loading starts.", "k": "Find the schedule for one cargo and state its group, stowage factor and hazard.", "u": "Explain why a cargo cannot be accepted without the shipper's declaration.", "p": "Check one cargo declaration against the schedule and list the steps required before loading.", "stcw": "STCW Table A-II/2 — carriage of dangerous and hazardous cargoes."});
T.push({"id": "groups", "r": "co", "g": "Bulk Cargoes", "t": "Group A, B and C Cargoes", "lead": "Solid bulk cargoes fall into three groups in the IMSBC Code, and **each group carries a different hazard**.", "pts": ["**Group A**: can liquefy where the moisture goes above the TML. Examples: iron ore fines, nickel ore, concentrates.", "**Group B**: chemical hazard. Examples: coal (methane and self-heating), DRI (hydrogen), seed cake.", "**Group C**: does not liquefy and has no chemical hazard, but still carries other risks such as shifting and dust.", "Some cargoes are **A and B** at the same time, so both sets of precautions apply.", "The **group dictates** which certificates and what monitoring are required.", "The group is written in the **schedule**; it is never guessed."], "ref": "IMSBC Code Section 1.7 and the individual schedules. Group A requires a certificate of moisture content and of the TML.", "k": "State the group of three common cargoes and the main hazard of each.", "u": "Explain why a cargo can be Group A and B at the same time, and what that means for the operation.", "p": "From a cargo declaration, identify the group and list the certificates and monitoring required.", "stcw": "STCW Table A-II/2 — carriage of bulk cargoes."});
T.push({"id": "tml", "r": "co", "g": "Bulk Cargoes", "t": "TML and Moisture Content", "lead": "For Group A cargo, one number separates safe from dangerous: the **moisture content against the TML**.", "pts": ["**TML** (Transportable Moisture Limit) is 90 % of the flow moisture point.", "The **actual moisture content** must be **below** the TML at the time of loading.", "The **TML certificate** is valid for up to 6 months; the **moisture certificate** for up to 7 days, and less where it has rained.", "The **can test** is a first indication only, never a substitute for a laboratory test.", "Where rain has fallen on the stockpile, **fresh sampling** is required.", "In any doubt, **stop loading** and consult the Master and the company."], "ref": "IMSBC Code Section 4 and 7. Loading Group A cargo above its TML is one of the main causes of bulk carrier losses.", "k": "State what TML and FMP mean and how long each certificate stays valid.", "u": "Explain why liquefaction is dangerous even when the surface of the cargo looks dry.", "p": "Carry out a can test on one sample, record the result, and prepare a report where it fails.", "err": "A certificate 2 weeks old was accepted after heavy rain. By then it no longer told the truth.", "stcw": "STCW Table A-II/2 — precautions for cargoes liable to liquefaction."});
T.push({"id": "liquefy", "r": "co", "g": "Bulk Cargoes", "t": "Cargo Liquefaction Risk", "lead": "Liquefaction is wet cargo **behaving like a liquid** under vibration. It turns into a free surface and the ship slides.", "pts": ["It happens in **Group A** cargo whose moisture is above the TML.", "**Vibration and rolling** bring it on; nothing shows at the start.", "The first sign is **water at the surface** and the cargo going flat.", "The effect is a **free surface and a wet base**, so stability goes quickly.", "The ship can **capsize without warning** after a heavy list.", "The only safe step is to **refuse to load** cargo above its TML."], "ref": "IMSBC Code Section 7. A specially constructed or fitted cargo ship is the only exception, and that requires the permission of the Administration.", "k": "Describe the signs of liquefaction and the cargoes most often affected.", "u": "Explain why trimming or ballast cannot put liquefaction right once it has started.", "p": "Inspect the holds during the voyage, identify the signs, and prepare the report and recommended action for the Master.", "stcw": "STCW Table A-II/2 — cargoes liable to liquefaction."});
T.push({"id": "coaldri", "r": "co", "g": "Bulk Cargoes", "t": "Coal, DRI and Concentrates", "lead": "Three cargoes a bulk carrier often carries, and **three different hazards**.", "pts": ["**Coal**: gives off methane and can self-heat. It needs surface ventilation only, never through ventilation.", "Measure **methane, oxygen and carbon monoxide** daily in coal.", "**Rising CO** is the sign of self-heating; close the hatches and do not ventilate.", "**DRI**: reacts with water and gives off hydrogen. Some types need inert gas.", "**Concentrates**: Group A, so the TML and the moisture are the main concern.", "All three have their **own schedule** in the IMSBC Code, to be followed exactly."], "ref": "IMSBC Code, the schedules for COAL and DIRECT REDUCED IRON. Gas monitoring of coal is daily and recorded.", "k": "State the main hazard of coal, DRI and concentrates and the monitoring each one needs.", "u": "Explain why ventilating self-heating coal makes the fire worse.", "p": "Carry out daily gas monitoring on a coal cargo, record it, and state the action to take when CO rises.", "err": "The hatch was opened to cool down heating coal. That fed in oxygen and the heating got worse.", "stcw": "STCW Table A-II/2 — carriage of hazardous bulk cargoes."});
T.push({"id": "vent3c", "r": "co", "g": "Bulk Cargoes", "t": "Cargo Ventilation · the 3-Degree Rule", "lead": "The **3-degree rule** is a simple rule for cargo that carries its own moisture, such as grain and timber.", "pts": ["Compare the **average cargo temperature at the time of loading** with the **present outside air temperature**.", "Where the outside air is **3 °C or more colder** than the cargo was at loading, **ventilate**.", "Where the outside air is warmer, **do not ventilate**, because that carries moisture in.", "Record the **temperatures and the decision** at every check.", "Stop ventilation in **rain, spray and heavy seas**.", "It is not used on cargo where ventilation is prohibited, such as self-heating coal."], "ref": "The 3-degree rule and the dew point rule are in the IMSBC Code Appendix and in P&I club guidance. Which rule applies depends on the type of cargo.", "k": "State when to ventilate using the 3-degree rule.", "u": "Explain why a wrong decision produces ship sweat.", "p": "Log one week of ventilation decisions using the rule, and explain each decision.", "stcw": "STCW Table A-II/2 — care of cargo during the voyage."});
T.push({"id": "ventdp", "r": "co", "g": "Bulk Cargoes", "t": "Cargo Ventilation · the Dew Point Rule", "lead": "The dew point rule is more precise. It compares the **dew point inside the hold** with the **dew point outside**.", "pts": ["If the **outside dew point is lower** than inside, **ventilate**.", "If outside is higher, **do not**, because sweat will form on the cargo or in the hold.", "**Ship sweat**: forms on cold structure when the air inside is warm and moist.", "**Cargo sweat**: forms on cold cargo when warm, moist air enters.", "You need a **whirling hygrometer** or a calibrated meter inside and outside.", "Record **dry bulb, wet bulb, dew point and the decision** at every check."], "ref": "IMSBC Code Appendix and P&I club carriage advice. A cargo claim normally calls for the ventilation record.", "k": "Calculate the dew point from dry and wet bulb readings using the table.", "u": "Explain the difference between ship sweat and cargo sweat, and which one is more dangerous for each cargo.", "p": "Carry out one voyage of dew point readings and ventilation decisions in the log, and explain one day when you did not ventilate.", "err": "Ventilated because the weather was sunny and fine. The outside dew point was high, and it ruined the cargo.", "stcw": "STCW Table A-II/2 — care of cargo during the voyage."});
T.push({"id": "gasfum", "r": "co", "g": "Bulk Cargoes", "t": "Gas Monitoring and Fumigation", "lead": "Some cargoes give off gas and some cargoes are dosed with poison. **Both kill** without the right procedure.", "pts": ["**Gas monitoring**: oxygen, methane, carbon monoxide and hydrogen sulphide, according to the cargo.", "Use a **fixed sampling point**; never open a hatch just to take a reading.", "**Calibrate** the meter before use and record the result.", "**Fumigation in transit** needs a written plan, warning signs and a named responsible person.", "The **fumigant** is normally phosphine; odourless at low concentration but lethal.", "No **enclosed space entry** until a gas-free certificate and a permit are issued."], "ref": "IMO MSC.1/Circ.1264 — Recommendations on the safe use of pesticides in ships. Treat a fumigated hold as a poisoned enclosed space.", "k": "State which gases to measure for coal and for DRI, and how often.", "u": "Explain why a fumigant is more dangerous than people assume, and why smell is not a warning.", "p": "Carry out a gas monitoring round, record it, and lead the planning of a fumigation in transit.", "err": "Entered a hold with residual fumigant because it 'looked bright and clean'. This is one of the most common causes of death on board.", "stcw": "STCW Table A-II/2 — carriage of dangerous and hazardous cargoes."});
T.push({"id": "trimlist", "r": "co", "g": "Stability and Structure", "t": "Trim and List Correction", "lead": "List is **transverse** heel and trim is **longitudinal**. Different causes, different cures.", "pts": ["List comes from **G off the centreline**, or from **negative GM** that produces loll.", "First: decide whether it is **list or loll** before you move anything. The correct action is the opposite in each case.", "For list, **shift or add weight on the other side**, slowly and one step at a time.", "For loll, **do not** add weight on the high side; **fill the slack tank first** to cut the free surface.", "Correct trim with **ballast in the fore or aft peak**, allowing for MCTC and LCF.", "Check **stress** after every transfer, not just the heel."], "ref": "IMO Intact Stability Code 2008. Negative GM is not permitted in any seagoing condition.", "k": "State the difference between list and loll, and how to recognise each from the ship's behaviour.", "u": "Explain why ballasting the high side is dangerous when the ship is lolled.", "p": "Carry out a list correction on the loading computer and show the effect on GM, stress and draught at every step.", "err": "Ballasted the high side of a lolled ship. She flopped over to the other side at a bigger and more dangerous angle.", "stcw": "STCW Table A-II/2 — maintain seaworthiness of the ship."});
T.push({"id": "damstab", "r": "co", "g": "Stability and Structure", "t": "Damage Stability Awareness", "lead": "Damage stability is whether the ship **stays afloat and upright** when water enters one or more compartments.", "pts": ["**Permeability**: not every space floods solid; the percentage changes with the use of the space.", "**Subdivision and watertight doors**: every open door enlarges the flooded volume.", "The ship carries a **damage stability booklet** that states the permitted conditions.", "**Cross-flooding** is deliberate equalising to reduce the list.", "The **downflooding angle** is the limit before water enters another space.", "In real damage, **first identify which compartment**, and do not rush into ballasting."], "ref": "SOLAS Chapter II-1 Parts B-1 and B-2. For a bulk carrier, SOLAS XII adds further requirements on hold flooding.", "k": "Find the permitted damage condition for your ship in the booklet.", "u": "Explain why an open watertight door is far more dangerous than people assume.", "p": "Carry out an assessment of a flooding scenario: identify the affected compartment and the expected list and draught.", "stcw": "STCW Table A-II/2 — maintain seaworthiness; damage control."});
T.push({"id": "hwballast", "r": "co", "g": "Stability and Structure", "t": "Heavy Weather Ballasting", "lead": "In heavy weather the aim is **enough GM, low stress and a deep propeller**, without making the ship stiff.", "pts": ["**Too high a GM** gives a fast, hard roll that damages cargo and structure.", "**Too low a GM** gives a slow roll and the risk of synchronous rolling.", "**Fill the tank or leave it empty**; avoid slack tanks, so there is no free surface.", "Allow for **slamming and propeller emergence** if the ship is too light forward.", "Check **stress** when ballasting with cargo on board.", "Changing ballast in the middle of a storm is **dangerous**; do it before the weather arrives."], "ref": "IMO MSC.1/Circ.1228 — Revised guidance to the master for avoiding dangerous situations in adverse weather and sea conditions.", "k": "State the ship's rolling period and what it tells you about GM.", "u": "Explain why a higher GM is not always better.", "p": "Prepare a heavy weather ballast plan before a storm and explain every change to the Master.", "err": "Ballasted when already in the middle of the storm. The moving water added free surface at the worst possible moment.", "stcw": "STCW Table A-II/2 — maintain seaworthiness.", "ani": "fsm"});
T.push({"id": "grain", "r": "co", "g": "Stability and Structure", "t": "Grain Stability Basics", "lead": "Grain **flows**. When the ship heels, the cargo surface shifts and it does not come back.", "pts": ["The ship must hold a **document of authorization** to carry grain.", "The calculation uses the **volumetric heeling moment** from the grain loading booklet.", "3 criteria: **GM not less than 0.30 m**, **heel not more than 12° or deck immersion**, and **residual area not less than 0.075 m-radian**.", "A **filled compartment, trimmed** has a smaller heeling moment than a partly filled one.", "**Untrimmed ends** leave a bigger void and allow a bigger shift.", "The grain loading plan is **submitted and approved** before loading."], "ref": "SOLAS VI/9 and the International Grain Code. The document of authorization must be on board.", "k": "State the 3 grain stability criteria and the limit for each.", "u": "Explain why a partly filled compartment is more dangerous than one filled and trimmed.", "p": "Carry out a grain heeling moment calculation for one condition, find the resulting angle of heel, and compare it with the limit.", "stcw": "STCW Table A-II/2 — grain loading and the International Grain Code."});
T.push({"id": "hatch", "r": "co", "g": "Ship Maintenance", "t": "Hatch Covers and Weathertight Integrity", "lead": "The hatch cover is the cargo's **main defence** against the sea. Most wet damage claims start here.", "pts": ["**Rubber packing**: check for permanent set, cuts and hardening; correct compression is normally 3 to 5 mm.", "**Compression bar**: straight, free of wasting, with no bent sections.", "**Drain channels and non-return valves**: clean and clear.", "**Cleats and wedges**: complete, aligned and correctly tensioned.", "Testing: **hose test** with the hold empty, **ultrasonic test** with cargo on board or when you need a firmer answer.", "A **chalk test** only proves the seating line, not weathertightness."], "ref": "SOLAS II-1/11 and Load Line Convention Regulation 16. Most class societies and P&I clubs accept the ultrasonic tightness test.", "k": "Name the parts of the hatch cover sealing system and the job each one does.", "u": "Explain why a chalk test is not proof that water will stay out.", "p": "Carry out an ultrasonic test on one hatch, read the results, and prepare a repair list.", "err": "Tightened the cleats to stop a leak. Over-tightening crushed the packing and the leak got worse.", "stcw": "STCW Table A-II/2 — maintain seaworthiness of the ship."});
T.push({"id": "ventair", "r": "co", "g": "Ship Maintenance", "t": "Ventilators, Air Pipes and Closing Devices", "lead": "Deck openings are the **most likely way for water to get in**. They are small, but they are what sinks ships.", "pts": ["**Air pipe head**: check the float ball, the gauze and the body for wasting or holes.", "**Ventilator**: the closing appliance must be complete and able to seal tight.", "**Sounding pipe cap**: correct gasket, kept closed except when in use.", "**Weathertight doors and hatches**: check the gasket, the dogs and the hinges.", "**Scuppers and freeing ports**: clean and moving freely.", "All of this comes under the **load line survey**, and PSC looks at it often."], "ref": "Load Line Convention Regulations 17 to 21 and IACS UR P3. A damaged or missing air pipe head is normally a detainable deficiency.", "k": "List the openings to check before departure and the condition you are looking for.", "u": "Explain how one damaged air pipe head leads to progressive flooding in heavy weather.", "p": "Inspect the weather deck closing appliances and prepare a report with photographs and repair proposals.", "stcw": "STCW Table A-II/2 — maintain seaworthiness."});
T.push({"id": "tankinsp", "r": "co", "g": "Ship Maintenance", "t": "Ballast Tank and Void Inspection", "lead": "The inside of a tank is **out of sight**, but the worst structural problems start there.", "pts": ["This is an **enclosed space entry**; you need a permit, a gas test and a standby man.", "Look for **coating breakdown**: the percentage of area affected and where it is worst.", "Look for **pitting**: depth and frequency; class sets the limits.", "Check the **weld seams, brackets and longitudinals** for cracks.", "Check the **anodes**: how much is left and whether they are still attached.", "Record it with **photographs and sketches** and enter it in the planned maintenance system."], "ref": "SOLAS II-1/3-6 — access to and within spaces; and the Enhanced Survey Programme (ESP) for bulk carriers and tankers.", "k": "State the steps before entering a ballast tank and what you will measure.", "u": "Explain why coating breakdown becomes a structural problem and not just a cosmetic one.", "p": "Lead a tank inspection with the permit in place and submit a report giving the location of every defect.", "err": "Entered without measuring oxygen because 'the manhole was open all night'. This is the most common cause of death on board.", "stcw": "STCW Table A-II/2 — maintain seaworthiness; enclosed space entry."});
T.push({"id": "corrosion", "r": "co", "g": "Ship Maintenance", "t": "Corrosion and Coating Condition", "lead": "Rust is not only ugly. It cuts the **thickness of the steel**, and that has a limit.", "pts": ["**General corrosion**: even thinning over a wide area.", "**Grooving corrosion**: along weld edges and at the joints between plates.", "**Pitting**: deep and local; dangerous on the tanktop.", "**Coating condition**: GOOD, FAIR or POOR under the ESP; POOR adds survey requirements.", "**Anodes** and impressed current protect the inside of the tank.", "**Thickness measurement** is done by an approved firm and compared against the renewal criteria."], "ref": "IACS and the Enhanced Survey Programme. Substantial corrosion is normally 75 to 100 % of the allowable diminution.", "k": "State the difference between GOOD, FAIR and POOR coating condition.", "u": "Explain why grooving corrosion gets worse faster than general corrosion.", "p": "Carry out a coating survey in one tank, describe the condition, and prepare a proposed maintenance plan.", "stcw": "STCW Table A-II/2 — maintain seaworthiness."});
T.push({"id": "mooring", "r": "co", "g": "Deck Equipment", "t": "Mooring Equipment and Ropes", "lead": "Mooring is one of the **most dangerous** jobs on deck. Most serious accidents come from a rope that parted.", "pts": ["**Snap-back zone**: mark the deck and brief everyone; never stand in line with a rope.", "**Line management plan**: every rope has a record of age, service and condition.", "**MBL, SWL and LDBF**: know the capacity of each rope and of the bitt.", "Check the **winch brake holding capacity**; test it at the set intervals.", "Avoid **mixed moorings** of different materials in the same service.", "**Tails and shackles** have their own working life and replacement."], "ref": "SOLAS II-1/3-8 and MSC.1/Circ.1620 — Guidelines for inspection and maintenance of mooring equipment. The mooring arrangement plan is mandatory on new ships.", "k": "Point out the snap-back zone on deck and state the MBL of one rope.", "u": "Explain why mixing new and old ropes in the same service is dangerous.", "p": "Lead a mooring operation, run a toolbox talk, and submit the line inspection record.", "err": "Stood inside the snap-back zone because 'it was only a short job'. A rope that parts moves faster than a man can react.", "stcw": "STCW Table A-II/2 — mooring and anchoring operations."});
T.push({"id": "anchorgear", "r": "co", "g": "Deck Equipment", "t": "Anchors and Windlass", "lead": "Anchor gear is not built for every condition. It has **limits**, and knowing them saves the ship.", "pts": ["**Anchoring equipment** is designed for **shallow water and moderate weather**, not for a storm.", "**Equipment number** sets the anchor size and the chain length.", "Check the **brake lining, hydraulic system and bitter end release**.", "The **chain** is gauged for wear and ranged at every drydock.", "**Walk back** in deep water; never simply let go under gravity when it is deep.", "The **chain stopper** carries the load at anchor, not the windlass brake."], "ref": "IACS UR A1 and A2 — anchoring equipment. The gear is for temporary mooring in harbour or in a sheltered place.", "k": "State your ship's anchor size and number of shackles, and where it is recorded.", "u": "Explain why the windlass is damaged when it carries the load instead of the chain stopper.", "p": "Lead an anchoring operation, including walking back in deep water and proper watching of the cable.", "stcw": "STCW Table A-II/2 — mooring and anchoring."});
T.push({"id": "cranes", "r": "co", "g": "Deck Equipment", "t": "Cranes, Derricks and Lifting Gear", "lead": "Lifting gear comes with a **certificate and a register**. No certificate, no lift.", "pts": ["**Register of lifting appliances** and the matching certificate for every item.", "**Annual thorough examination** and **five-yearly load test** under ILO and class rules.", "Check the **wire rope**: broken strands, kinks, wasting and loss of diameter.", "Check the **sheaves, brake, limit switches and emergency stop** before use.", "The **SWL** is marked and never exceeded; allow for the radius.", "**Nobody goes underneath** a suspended load."], "ref": "ILO Convention 152 and the Code of Safe Working Practices. PSC looks at the cargo gear register often.", "k": "Find the last test of one crane in the register, together with its SWL.", "u": "Explain why the SWL changes with the radius of the boom.", "p": "Carry out a pre-use inspection of one crane and lead a lifting operation with a toolbox talk.", "stcw": "STCW Table A-II/2 — cargo handling equipment."});
T.push({"id": "pms", "r": "co", "g": "Deck Equipment", "t": "Planned Maintenance and Defect Control", "lead": "The PMS proves the ship is **maintained to a plan**, not only when something breaks.", "pts": ["Every item of equipment has a **job, an interval and a responsible person**.", "An **overdue job** needs an explanation and a new date; never just delete it.", "**Critical equipment** has its own list and tighter monitoring.", "**Spare parts** are tracked against minimum levels.", "A **defect** carries a ticket from discovery through to closing.", "The **record** is your evidence for PSC, class and vetting."], "ref": "ISM Code Element 10 — maintenance of the ship and equipment. Critical equipment must be identified and tested regularly.", "k": "Show the next due job for one item in the PMS and the last one completed.", "u": "Explain why a long overdue list is a bigger problem than one broken machine.", "p": "Carry out the closing of one PMS job with evidence, and open a defect ticket with its mitigation.", "stcw": "STCW Table A-II/2 — monitor and control compliance with legislative requirements."});
T.push({"id": "bwmp", "r": "co", "g": "Environment", "t": "Ballast Water Management Plan", "lead": "Ballast water carries **live organisms** into another sea. There is law on this, and records to keep.", "pts": ["The ship carries an **approved Ballast Water Management Plan** and a **Ballast Water Record Book**.", "**D-1 standard**: ballast water exchange, not less than 95 % volumetric.", "**D-2 standard**: treatment through a BWTS, with limits on organism numbers.", "The ship holds an **International Ballast Water Management Certificate**.", "**Every operation** is recorded: date, position, quantity and method.", "Some **ports add their own rules**, so check before arrival."], "ref": "IMO Ballast Water Management Convention, in force since 2017. From 2024, most ships are on the D-2 standard.", "k": "Show the Ballast Water Record Book and the latest entry.", "u": "Explain the difference between D-1 and D-2 and why the industry moved to D-2.", "p": "Carry out the recording of one complete ballast operation in the record book and verify it against the plan.", "stcw": "STCW Table A-II/2 — monitor and control compliance with legislative requirements."});
T.push({"id": "bwts", "r": "co", "g": "Environment", "t": "BWTS Operation and Records", "lead": "The BWTS is the machine that kills organisms in ballast water. It must be **used and recorded**, not just installed.", "pts": ["Two common types: **UV** and **electrochlorination**.", "Each has **operating limits**: turbidity, temperature, salinity and flow rate.", "A **by-pass** is allowed only in an emergency and must be **recorded and reported**.", "Check the **filter backwash, sensors and alarms** before use.", "**Total Residual Oxidant** is measured on some systems before discharge.", "**Contingency measures** are written down for a system failure."], "ref": "BWM Convention Regulation D-2 and the BWMS Code. MEPC.1/Circ.862 sets out the contingency measures when the system fails.", "k": "State the type of BWTS on your ship and its operating limits.", "u": "Explain why a UV system does not work in muddy water, and what to do instead.", "p": "Run the BWTS through one ballast operation, record the parameters, and prepare a report when it alarms.", "err": "By-passed the system without reporting it. That is a serious violation with a heavy fine.", "stcw": "STCW Table A-II/2 — pollution prevention."});
T.push({"id": "bwexch", "r": "co", "g": "Environment", "t": "Ballast Exchange and Contingency", "lead": "When the treatment system cannot be used, there are **alternative methods** and a way of reporting.", "pts": ["**Sequential method**: empty the tank before refilling; the cleanest result, but it brings stress and stability effects.", "**Flow-through**: replace while overflowing; needs 3 times the tank volume.", "**Dilution**: in at the top and out at the bottom at the same time.", "Do it **200 nm from the nearest land in 200 m of water** where practicable.", "Check **stress, stability and sloshing** at every step.", "If the BWTS fails, **report at once** to the port State before arrival."], "ref": "BWM Convention Regulation B-4 and MEPC.1/Circ.862 on contingency measures.", "k": "Name the 3 methods of ballast exchange and what each one requires.", "u": "Explain why the sequential method is more dangerous in heavy weather.", "p": "Prepare an exchange plan with a stress and stability check at every stage.", "stcw": "STCW Table A-II/2 — pollution prevention."});
T.push({"id": "garbage", "r": "co", "g": "Environment", "t": "Garbage Management", "lead": "Garbage has a **defined category, a defined bin and a defined record**. You do not just throw it over the side.", "pts": ["The ship carries a **Garbage Management Plan** and a **Garbage Record Book**.", "**No plastic** goes into the sea, ever.", "**Food waste** has a distance limit: 3 nm if comminuted, 12 nm if not.", "**Special areas** are stricter, such as the Mediterranean and the Baltic.", "**Cargo residues** have their own rules and a hazard to the marine environment classification.", "Keep the **receipt from the reception facility** with the record book."], "ref": "MARPOL Annex V and MEPC.295(71). The Garbage Record Book is mandatory for a ship of 400 GT and above, or carrying 15 persons and above.", "k": "State the discharge distance for comminuted and for uncomminuted food waste.", "u": "Explain why a special area is stricter and how you know you are inside one.", "p": "Carry out the recording of one week of garbage disposal in the record book and verify the classification of every category.", "stcw": "STCW Table A-II/2 — pollution prevention."});
T.push({"id": "sopep", "r": "co", "g": "Environment", "t": "SOPEP and Oil Spill Preparedness", "lead": "SOPEP is the **plan for when oil is spilled**. The first 5 minutes matter most.", "pts": ["The ship carries an **approved SOPEP** and a **SOPEP locker** with the full inventory.", "**First actions**: stop the operation, raise the alarm, and contain the spread.", "**Reporting**: coastal State, flag, company and terminal, using the prepared format.", "**Scupper plugs** are in place before bunkering or cargo transfer starts.", "The **Oil Record Book** is filled in for every operation and every incident.", "Run **drills** regularly and keep a record of each one."], "ref": "MARPOL Annex I Regulation 37 — Shipboard Oil Pollution Emergency Plan. Reporting follows Article 8 and Protocol I.", "k": "Show the contents of the SOPEP locker and the contact list in the plan.", "u": "Explain why fast reporting matters more than cleaning up first.", "p": "Lead an oil spill drill, use the reporting format, and submit a report afterwards.", "stcw": "STCW Table A-II/2 — prevent pollution of the marine environment."});
T.push({"id": "annexvvi", "r": "co", "g": "Environment", "t": "MARPOL Annex V and VI Awareness", "lead": "Annex V covers **garbage** and Annex VI covers **exhaust and air**. Both carry records and both get inspected.", "pts": ["**Annex VI**: sulphur limit of 0.50 % worldwide and 0.10 % in an Emission Control Area.", "**Fuel changeover** before entering an ECA, with the time and position recorded.", "**Bunker Delivery Note** and the sample are kept for 12 months.", "**EEXI and CII** are the new measures of efficiency and carbon output.", "**SEEMP** is the energy efficiency plan, with Part III for CII.", "**Ozone depleting substances record** and the refrigerant list."], "ref": "MARPOL Annex VI Regulations 14, 18 and 22. The CII rating from A to E started in 2023.", "k": "State the sulphur limit inside and outside an ECA, and where the changeover is recorded.", "u": "Explain why the bunker sample is kept, and when it is used.", "p": "Carry out a fuel changeover, record the time and position, and verify the changeover time calculation.", "stcw": "STCW Table A-II/2 — pollution prevention."});
T.push({"id": "decklog", "r": "co", "g": "Safety Management", "t": "Deck Log and Record Book Entries", "lead": "The log book is a **legal document**. What you write there becomes evidence many years later.", "pts": ["Write it **as it happens**, not at the end of the watch or the day.", "Use **ink** and never erase; one line through the error, then sign it.", "Record the **time, position, weather and event** precisely.", "Record **drills, tests and inspections** with their results.", "Record the **Master's orders** and when they were carried out.", "It is signed by the **officer who made the entry**, nobody else."], "ref": "SOLAS V/28 — record of navigational activities. The oil, garbage and ballast record books carry their own MARPOL requirements.", "k": "Show the correct way to correct a wrong entry.", "u": "Explain why writing up after the shift weakens the log as evidence.", "p": "Carry out the deck log entries for a full watch, including one incident and the correction of one entry.", "err": "Erased the mistake or covered it with correction fluid. Once that happens, the whole log book loses credibility.", "stcw": "STCW Table A-II/2 — monitor and control compliance with legislative requirements."});
T.push({"id": "deckplan", "r": "co", "g": "Safety Management", "t": "Deck Work Planning", "lead": "Good planning is the difference between a **productive day** and an accident.", "pts": ["Start with the **weekly plan** and break it down into daily jobs.", "Look at the **weather, the port call and rest hours** before you assign anyone.", "Identify which jobs need a **permit to work**.", "Match the **man to the job**: experience, certificate and physical capability.", "Allow **time for the toolbox talk** and for clearing up afterwards.", "Review at the **end of the day**: what was finished and what changed."], "ref": "ISM Code Element 7 and the Code of Safe Working Practices for Merchant Seafarers. Work and rest hours sit in MLC 2006 and STCW.", "k": "Build a weekly deck plan ordered by priority.", "u": "Explain why rushing at the end of the day is the usual moment for an accident.", "p": "Lead one day of deck work from planning through to review, and record what changed.", "stcw": "STCW Table A-II/2 — organise and manage the crew."});
T.push({"id": "ptw", "r": "co", "g": "Safety Management", "t": "Permit to Work System", "lead": "A permit is not paperwork. It is an **agreement** that the risk was assessed and the protection is in place before work starts.", "pts": ["A permit is needed for **enclosed space, hot work, work aloft, overside work and electrical isolation**.", "A permit carries a **time limit** and ends when the shift ends.", "**Isolation and lock-out tag-out** before work starts, then verify it.", "A **named standby man** is posted for permit work.", "The permit is **signed by the worker, by the checker and by the Master** when required.", "**Close the permit** afterwards; no permit stays open with no work going on."], "ref": "ISM Code Element 7 and the Code of Safe Working Practices. The enclosed space entry permit has its own strict format.", "k": "List the jobs on your ship that need a permit.", "u": "Explain why a permit ends at the end of the shift even when the job is not finished.", "p": "Carry out the preparation and closing of one hot work permit, including the fire watch and the post-work check.", "err": "Carried the permit over to the next day without reassessing. Conditions had changed, but the assessment was still the old one.", "stcw": "STCW Table A-II/2 — ensure compliance with pollution prevention and safety requirements."});
T.push({"id": "riskassess", "r": "co", "g": "Safety Management", "t": "Risk Assessment and Toolbox Meeting", "lead": "Risk assessment is **thinking before acting**. The toolbox talk carries that thinking to the man doing the job.", "pts": ["Identify the **hazard**, **who could be hurt**, and the **controls already in place**.", "Give it a **likelihood and a severity** and take the resulting risk level.", "Add **controls** until the risk is acceptable.", "Follow the **hierarchy of control**: eliminate, substitute, engineering, administrative, PPE.", "The **toolbox talk** comes before work starts, at the worksite, with a chance to ask questions.", "**Dynamic risk assessment**: stop the job when conditions change."], "ref": "ISM Code Element 1.2.2 — assess all identified risks. Stop work authority sits in the SMS of most companies.", "k": "Fill in a risk assessment form for one routine deck job.", "u": "Explain why PPE is the weakest control, and why it comes last in the hierarchy.", "p": "Lead a toolbox talk, explain the hazards and the controls, and record who attended.", "stcw": "STCW Table A-II/2 — application of leadership and managerial skills."});
T.push({"id": "enclosed", "r": "co", "g": "Safety Management", "t": "Enclosed Space Entry", "lead": "The enclosed space is the **deadliest** place on the ship. Most of those who die are the rescuers, not the first man in.", "pts": ["An **enclosed space** has limited access, is not designed for working in, and is poorly ventilated.", "**Nobody enters** without a permit, a gas test and a standby man.", "Measure at **all levels**: oxygen 20.8 %, flammable gas under 1 % LEL, toxic gas below the limit.", "**Continuous ventilation** while anyone is inside.", "**Communication** at set intervals, and an immediate signal when something goes wrong.", "**Rescue plan and equipment** ready before entry; no rescuer goes in without BA."], "ref": "SOLAS III/19.3.6 — enclosed space entry and rescue drills, every 2 months. IMO Resolution A.1050(27) gives the guidance on procedure.", "k": "State the oxygen, flammable gas and toxic gas limits before entry.", "u": "Explain why more people die in the rescue than on the first entry.", "p": "Lead an enclosed space entry drill, covering the gas test, the communication and the rescue using BA.", "err": "Went in to rescue without BA. That is the most common way one casualty becomes several.", "stcw": "STCW Table A-II/2 — enclosed space entry and rescue."});
T.push({"id": "crewsup", "r": "co", "g": "Safety Management", "t": "Crew Supervision and Training", "lead": "The Chief Officer **teaches and supervises** the deck crew. The standard of their work reflects his leadership.", "pts": ["**Familiarization** on joining, before any job is handed over.", "**On-the-job training** against a clear standard, with assessment.", "**Drills** on schedule and with real practice, not just a signature.", "**Appraisal** that is fair and backed by evidence.", "The **cadet** has a training record book reviewed regularly.", "Identify the **weak areas** and give extra training there."], "ref": "ISM Code Element 6 — resources and personnel; STCW Regulation I/14 and MLC 2006 on training and familiarization.", "k": "Show the deck department training matrix and the gaps in it.", "u": "Explain why a drill without teaching and assessment is wasted.", "p": "Carry out on-the-job training on one task, assess the result, and enter it in the training record.", "stcw": "STCW Table A-II/2 — application of leadership and teamworking skills."});
