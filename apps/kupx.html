T.push({"id": "pilotarr", "r": "ma", "g": "Ship Handling", "t": "Pilot Transfer Arrangement", "lead": "Pilots are still being killed on the climb. The **ladder and everything around it** are the Master's responsibility, not the bosun's alone.", "pts": ["**One continuous length of ladder** to the point of access, with no joins and no shackles in the middle.", "Where the height from the water is **more than 9 m, use a combination ladder** with an accommodation ladder.", "**Manropes, a lifebuoy with self-igniting light, a heaving line and a stretcher** ready at the position.", "**Adequate lighting at night**, both on the ladder and on deck; no discharge running down over the ladder.", "A **responsible officer** at the transfer position with radio communication to the bridge.", "**Check every step and the side ropes**; scrap any ladder showing signs of damage. You do not nurse it along."], "ref": "SOLAS V/23 and IMO Resolution A.1045(27) as amended by Resolution A.1108(29) — pilot transfer arrangements. The ladder carries its **own marking and record of manufacture**.", "k": "State the equipment required at the pilot transfer station and the height at which a combination ladder is needed.", "u": "Explain why shackles and joins in the middle of a ladder are prohibited.", "p": "Inspect the whole pilot transfer arrangement before the pilot arrives and correct what you find.", "err": "The ladder was sound but a discharge was running down beside it. The pilot's route was wet, slippery and dark.", "stcw": "STCW Table A-II/2 — pilot embarkation and disembarkation arrangements."});
T.push({"id": "emgman", "r": "ma", "g": "Ship Handling", "t": "Emergency Manoeuvres", "lead": "When it turns critical, **the manoeuvre is your last defence**. You must already know what your ship can do before that moment comes.", "pts": ["**Crash stop**: know your ship's true head reach, laden and in ballast.", "**Emergency turn**: early full rudder works better than braking at the last moment.", "**Beaching** as a last resort against sinking; pick a soft, shallow bottom.", "**Anchors as a brake** in harbour: hard on the cable, but sometimes the only means you have.", "**Protecting the ship after a collision**: do not pull clear at once if the other ship is plugging the hole.", "The **manoeuvring booklet and the wheelhouse poster** are where the figures come from; read them before you need them."], "ref": "SOLAS V/28 and IMO Resolution A.601(15) — Provision and display of manoeuvring information on board ships. The **pilot card, wheelhouse poster and manoeuvring booklet** must be displayed.", "k": "State the head reach and the turning circle of your ship, laden and in ballast.", "u": "Explain why avoiding with the rudder is usually better than a crash stop.", "p": "Carry out a crash stop and an emergency turn in the simulator and compare with the ship's recorded data.", "err": "He relied on figures taken at sea trials in ballast. Laden, the head reach was nearly double.", "stcw": "STCW Table A-II/2 — manoeuvre and handle a ship in all conditions."});
T.push({"id": "charter", "r": "ma", "g": "Chartering and Commerce", "t": "Voyage and Time Charter Basics", "lead": "The type of charter tells you **who pays for what** and to whom you report. It is the foundation of every commercial decision.", "pts": ["**Voyage charter**: the owner carries the cargo from A to B at a freight rate; **the owner pays for bunkers and port costs**.", "**Time charter**: the charterer hires the ship by the day; **the charterer pays for bunkers and port costs** and orders the routing.", "**Bareboat charter**: the whole ship is hired without crew; the liabilities are different again.", "On time charter the **Master follows the charterer's employment orders** but **never an order that is unsafe**.", "**Off-hire**: when the ship cannot be used because of a breakdown or a delay that is the ship's fault, hire stops.", "**Read the charter party clauses** that bear on the Master: notices, bunkers, speed and cargo documents."], "ref": "Common forms: **GENCON** for voyage charter, **NYPE and BALTIME** for time charter. The Master is normally part of the chain of command in the employment clause.", "k": "State the difference between voyage, time and bareboat charter and who pays for bunkers.", "u": "Explain why the Master can refuse a charterer's order even though the charter is signed.", "p": "Read the Master's clauses of a charter party and list your obligations at each port.", "err": "An unsafe order was obeyed because 'the charterer is paying'. Safety never sits below commerce.", "stcw": "STCW Table A-II/2 — commercial management and chartering awareness."});
T.push({"id": "laytime", "r": "ma", "g": "Chartering and Commerce", "t": "Laytime and Demurrage Awareness", "lead": "Laytime is the **time the charterer has bought** to load and discharge. Run over it and a payment called demurrage falls due.", "pts": ["**Laytime** starts after the NOR and the turn time set in the charter party.", "**Demurrage**: the penalty for running over; **despatch**: the reward for finishing early. Despatch is usually half the demurrage rate.", "**Weather working day**: time when work is impossible because of weather does not count, where the charter says so.", "**SHEX and SHINC**: Sundays and holidays excepted or included; a large difference in the final total.", "The **Statement of Facts and the time sheet** are what the calculation rests on; your record is the owner's case.", "**Record every stoppage**: rain, crane breakdown, no trucks, and whose fault it was."], "ref": "The laytime rules are in the charter party. BIMCO's **Laytime Definitions for Charter Parties** are also used as a reference where the agreement is unclear.", "k": "State when laytime starts and what demurrage and despatch mean.", "u": "Explain why the quality of your SOF decides whether the owner wins the claim.", "p": "Build a time sheet from a Statement of Facts and calculate the laytime used.", "err": "He wrote 'rain stopped work' with no exact times. The exception cannot be counted and the owner loses the money.", "stcw": "STCW Table A-II/2 — commercial operation and documentation.", "ani": "laytime"});
T.push({"id": "nor", "r": "ma", "g": "Chartering and Commerce", "t": "Notice of Readiness", "lead": "The **NOR** starts the laytime clock. Tender it wrongly and the daily money is gone.", "pts": ["The ship must be **genuinely ready in every respect**: physically, legally and in her documents.", "**Arrived ship**: at the place the charter party names — berth, port or anchorage as agreed.", "**Free pratique and customs clearance** where the agreement requires them before the NOR is valid.", "**Tendered in the right manner and at the right time**: in writing, to the right person, within the stated hours.", "**Keep a copy and the proof of receipt** — time, name and signature.", "If in doubt, **tender the NOR and re-tender daily** until it is accepted, and add a reservation."], "ref": "The requirements for an NOR are in the charter party. The leading rule comes from **The Happy Day** and other decisions on invalid NOR.", "k": "State the 4 conditions for a valid NOR.", "u": "Explain how millions in demurrage are lost through an NOR tendered too early.", "p": "Prepare and tender an NOR in port, complete with proof of receipt and the record.", "err": "The NOR was tendered while the ship was still waiting for free pratique. It was invalid, and the clock only started 2 days later.", "stcw": "STCW Table A-II/2 — commercial documentation and port procedures."});
T.push({"id": "sof", "r": "ma", "g": "Chartering and Commerce", "t": "Statement of Facts", "lead": "The **SOF** is the hour-by-hour history of the port call. It is the most important commercial document you will sign.", "pts": ["Record **every event with its exact time**: arrival, NOR, berthing, start and completion of cargo.", "**Every stoppage and its reason**: rain, broken equipment, no trucks, gang shift or waiting for the surveyor.", "**State whose account the stoppage falls to**; that decides who pays.", "**No blank times.** 'About' and 'approx' weaken the whole document.", "**Signature of ship, terminal and agent**; where the terminal disagrees, **sign under reservation**.", "**Match it to the deck log and the cargo log**; the other side looks for contradictions first."], "ref": "The SOF works together with the laytime provisions of the charter party. BIMCO publishes a standard SOF form accepted in many ports.", "k": "List the events that must always appear on the SOF.", "u": "Explain why signing under reservation is better than refusing to sign.", "p": "Build a complete SOF from the deck log of one port call and compare it with the terminal version.", "err": "Signed without checking because the ship was in a hurry to sail. The SOF carried times that did not match the ship's logbook.", "stcw": "STCW Table A-II/2 — port documentation and records."});
T.push({"id": "bunkers", "r": "ma", "g": "Chartering and Commerce", "t": "Bunkers and ROB Management", "lead": "Bunkers are the **largest cost** of the voyage and the most frequent subject of dispute. Your records protect the ship.", "pts": ["**Bunker survey before and after**: gauge every tank, including those not being bunkered.", "**Bunker Delivery Note** showing sulphur content, density and quantity; **keep the copy and the sample** for the required period.", "**MARPOL sample** sealed, signed and retained on board for the prescribed period.", "**Protest at once** for short delivery or any doubt over quality; do not wait until you sail.", "**ROB and consumption** must agree with the noon report and the engine log; that is the basis of any performance claim.", "**Compatibility** of the new bunker with what is already in the tank; incompatible oils turn into sludge."], "ref": "MARPOL Annex VI Regulation 18 — fuel oil availability and quality, including the required **Bunker Delivery Note and representative sample** retained on board.", "k": "State the contents of the Bunker Delivery Note and the retention period of the sample.", "u": "Explain why an early letter of protest is the only way to preserve the owner's rights.", "p": "Lead a bunkering operation: plan, survey, documents, sample and the recording of ROB.", "err": "Waited 3 days before protesting a short delivery. The right was lost because the protest came too late.", "stcw": "STCW Table A-II/2 — bunkering operations and MARPOL compliance."});
T.push({"id": "speedclaim", "r": "ma", "g": "Chartering and Commerce", "t": "Speed and Consumption Claims", "lead": "Under a time charter the charter party carries a **warranted speed and consumption**. When the ship falls short, there is a claim.", "pts": ["The **warranty** is normally an 'about' speed in **good weather** with stated wind and sea limits.", "**The definition of good weather matters most**: usually up to Beaufort 4 and Douglas 3, but it turns on the agreement.", "Your **noon report** is the evidence in the fight: time, distance, speed, consumption, wind, sea and current.", "**Be honest and consistent.** A sudden change in the way you report is noticed immediately.", "**Record the current and your own slip**; many claims are settled on that.", "The charterer uses a **weather routing company**; find out who it is and what data they use."], "ref": "Found in the performance clause of the charter party, usually on the **NYPE** form. Disputes normally turn on the definition of the good weather period.", "k": "State the contents of a noon report and the definition of good weather in your charter.", "u": "Explain why the consistency of your reports matters more than a good-looking figure.", "p": "Prepare a full set of noon reports for one voyage and assess performance against the warranty.", "err": "Improved the speed figure in the report to avoid questions. The charterer used it as evidence against the ship.", "stcw": "STCW Table A-II/2 — voyage performance reporting."});
T.push({"id": "delredel", "r": "ma", "g": "Chartering and Commerce", "t": "Delivery and Redelivery", "lead": "**Delivery and redelivery** mark the start and the end of the hire. The condition and the bunkers at that moment are what gets paid for.", "pts": ["**On-hire and off-hire survey**: condition of holds and equipment, and the exact ROB of each grade of bunker.", "The **bunkers on delivery are bought by the charterer**, and on redelivery bought back by the owner, at the agreed price.", "**Redelivery notice** as agreed: a fixed number of days before the date.", "**Condition of holds on redelivery**: normally 'as on delivery, fair wear and tear excepted'.", "**Appoint an independent surveyor** and make sure both sides sign the report.", "**Photograph everything** at both surveys; that is the strongest evidence in a dispute."], "ref": "Found in the delivery and redelivery clauses of the charter party. These normally include **bunkers on delivery and redelivery (BOD and BOR)** with an agreed price and quantity.", "k": "State what is measured and recorded at an on-hire and off-hire survey.", "u": "Explain why photographs matter in a dispute over hold condition.", "p": "Lead an off-hire survey: holds, equipment, bunkers and the signed report.", "err": "No photographs of the holds at delivery. At redelivery old damage was charged to the charterer, who refused to pay.", "stcw": "STCW Table A-II/2 — commercial handover and survey."});
T.push({"id": "bol", "r": "ma", "g": "Chartering and Commerce", "t": "Bills of Lading and Mate's Receipts", "lead": "The **Bill of Lading** is a receipt for the cargo, evidence of the contract and a **document of title**. Your signature on it carries legal weight.", "pts": ["The **Mate's Receipt** is the first record of cargo condition; the remarks on the B/L come from it.", "**Clean B/L**: no remark on condition. **Claused B/L**: the defects are written in.", "**Never sign a clean B/L when there are defects.** This is the single biggest risk a Master faces.", "Check **quantity, marks and description**; they must agree with what was actually received and with the Mate's Receipt.", "**Never sign an antedated or postdated B/L**; it can be treated as fraud.", "Under pressure, **tell the owner and the P&I Club at once** before signing anything."], "ref": "The B/L falls under the **Hague-Visby Rules** in most jurisdictions. A **letter of indemnity** for a clean B/L against defective cargo is normally **unenforceable** and carries no P&I cover.", "k": "State the three functions of the Bill of Lading and the difference between clean and claused.", "u": "Explain why a letter of indemnity gives no protection against a wrongly issued clean B/L.", "p": "Inspect a Mate's Receipt and the matching B/L, and write the correct clause for defective cargo.", "err": "Signed a clean B/L against an LOI because the shipper was in a hurry. On the claim the ship paid and the insurance gave no cover.", "stcw": "STCW Table A-II/2 — cargo documentation and legal responsibilities."});
T.push({"id": "pscstrat", "r": "ma", "g": "Inspections and Audits", "t": "PSC Preparation Strategy", "lead": "PSC is not an exam you cram for. **It is a picture of the day-to-day standard** of your ship.", "pts": ["Know the **target factor and the history** of the ship; that decides how hard the inspection will be.", "Know the year's **Concentrated Inspection Campaign** and prepare its subject well in advance.", "**Self-assessment before every port** using the checklist of the regional MOU.", "**Give every officer a task**: who escorts, who fetches the documents, who records.", "**Always escort the inspector**; never let him walk around alone.", "**Record every remark as it happens**, and ask at once what evidence is wanted."], "ref": "SOLAS I/19, MARPOL and the procedures of the **Paris MOU and Tokyo MOU**. Detainable deficiencies and the Ship Risk Profile are published on their respective websites.", "k": "State the main areas PSC inspects and the current CIC.", "u": "Explain how the history of the ship affects the frequency and depth of inspection.", "p": "Lead a full PSC self-assessment and assign the task of each officer.", "err": "Left the inspector alone in the engine room. He found something with nobody there to explain it.", "stcw": "STCW Table A-II/2 — ensure compliance with pollution prevention and safety requirements."});
T.push({"id": "flaginsp", "r": "ma", "g": "Inspections and Audits", "t": "Flag State Inspection", "lead": "The Flag State **issued the ship's certificates**. Their inspection confirms she still deserves them.", "pts": ["Normally carried out by a **Flag State Inspector or by a Recognised Organization** on their behalf.", "Checks **compliance with SOLAS, MARPOL, STCW, MLC and Load Line** all at once.", "**Manning and crew certificates** against the Minimum Safe Manning Document.", "**Implementation of the SMS**: not only whether the paper exists, but whether the work is actually done.", "**A Flag remark carries more weight** than a PSC remark, because the Flag can withdraw the certificate.", "Keep the **report and the evidence of closeout** from the previous inspection."], "ref": "SOLAS I/19 and the IMO Instruments Implementation Code (III Code), which sets the Flag State's responsibility for inspecting its own ships.", "k": "State the scope of a Flag State Inspection and who can carry it out.", "u": "Explain why a Flag remark carries more weight than a PSC remark.", "p": "Prepare for a Flag State Inspection: manning, certificates, SMS and the previous report.", "err": "A remark from last year was never closed out. That marks a weak system, not just one defect.", "stcw": "STCW Table A-II/2 — monitor and ensure compliance with legislative requirements."});
T.push({"id": "classsur", "r": "ma", "g": "Inspections and Audits", "t": "Class Surveys", "lead": "Class certifies the **strength and condition of the ship**. Lose class and you lose the insurance and the employment.", "pts": ["**Annual survey** every year, **intermediate** at the second or third, and **renewal or special survey** every 5 years.", "**Continuous survey** is the way the work is spread across the full 5 years instead of done all at once.", "**Docking survey** twice within 5 years, with a maximum interval laid down.", "**Enhanced Survey Programme** for bulk carriers and tankers: thickness measurement and close-up survey.", "**Condition of Class and Recommendations** carry a due date; overrunning it suspends class.", "Prepare **access, cleaning and ventilation** of tanks and holds before the surveyor arrives."], "ref": "SOLAS I/6 and I/10 and the rules of the Classification Society under IACS. The **Enhanced Survey Programme** is in IMO Resolution A.1049(27), ESP Code.", "k": "State the survey cycle of your ship and when the next one falls due.", "u": "Explain why insurance cover lapses once class is suspended.", "p": "Prepare for an intermediate survey: access, records, thickness measurement and the defect list.", "err": "A Condition of Class due date passed while the ship was at sea. That created an insurance problem on the next voyage.", "stcw": "STCW Table A-II/2 — survey, certification and class requirements."});
T.push({"id": "statcert", "r": "ma", "g": "Inspections and Audits", "t": "Statutory Certificates", "lead": "A ship sails on the strength of her **certificates**. One expired paper is enough to stop her sailing.", "pts": ["**Safety Construction, Safety Equipment and Safety Radio** for a cargo ship, each with its own survey.", "**Load Line, IOPP, IAPP, ISPP, Sewage and Garbage** under the Load Line Convention and MARPOL.", "**Safety Management Certificate** and **Document of Compliance** under the ISM Code.", "**International Ship Security Certificate** under ISPS, and the **Maritime Labour Certificate** under MLC.", "**Endorsement**: many certificates need an annual endorsement; one without it is treated as invalid.", "**Keep a tracker** of expiry dates and survey windows; the anniversary date is the key, not the expiry alone."], "ref": "SOLAS I/12 and I/14 — certificates are valid for no more than **5 years**, with a **window of 3 months** before and after the anniversary date for the annual survey.", "k": "List the statutory certificates of your ship and the expiry date of each one.", "u": "Explain why a certificate not endorsed within the window is treated as invalid.", "p": "Build a complete certificate tracker showing anniversary date, survey window and expiry.", "err": "The certificate ran to next year, but the annual endorsement fell outside the window. At PSC that is detainable.", "stcw": "STCW Table A-II/2 — statutory certification and survey requirements."});
T.push({"id": "ismoversee", "r": "ma", "g": "Inspections and Audits", "t": "ISM, ISPS and MLC Oversight", "lead": "Three systems, one truth: **do what is written and write what is done**. The Master leads all three.", "pts": ["**ISM**: the Master holds **overriding authority** for safety and pollution prevention. It is written into the SMS.", "**Master's review of the SMS** must be carried out and reported to the company at set intervals.", "**ISPS**: the SSO implements; the Master decides when security and safety conflict.", "**Declaration of Security** when the security level of the ship and the facility differ.", "**MLC**: contracts, wages, rest hours, food, accommodation and the **onboard complaint procedure**.", "All three carry **internal audit and external audit**; prepare the evidence, not just the paper."], "ref": "ISM Code Element 5 — Master's responsibility and authority; ISPS Code Part A; and MLC 2006 Title 5 for compliance and enforcement.", "k": "State the meaning of the Master's overriding authority and where it is written.", "u": "Explain how to resolve a conflict between a security requirement and a safety requirement.", "p": "Carry out the Master's review of the SMS and prepare a report with specific recommendations.", "err": "Signed the review without reading it. At audit an empty review becomes a major non-conformity.", "stcw": "STCW Table A-II/2 — ISM, ISPS and MLC implementation."});
T.push({"id": "deficresp", "r": "ma", "g": "Inspections and Audits", "t": "Deficiency Response and Rectification", "lead": "A remark is not the end of it. **The quality of your response** decides how long and how deep the next inspection will be.", "pts": ["**Understand the remark first** and its code before you answer; ask where it is unclear.", "**Immediate interim measures** to keep the ship safe while the repair is pending.", "**Root of the problem**, not only what was seen. Why did your own system miss it?", "**Corrective action** naming who does it and by when; **preventive action** so it does not happen again.", "**Evidence of closeout**: photographs before and after, invoice, records and signature.", "**Tell the company and the Flag or Class at once** where the remark affects a certificate."], "ref": "ISM Code Elements 9 and 10 — reports and analysis of non-conformities and maintenance of the ship. A detention has **its own release procedure** laid down by the MOU.", "k": "State the difference between corrective and preventive action.", "u": "Explain why repairing what was seen is not enough if the root cause was never found.", "p": "Write a complete corrective action report for a real remark, covering the root cause and the evidence.", "err": "Repaired a broken light and wrote only that. Nobody asked why the monthly inspection had missed it.", "stcw": "STCW Table A-II/2 — corrective action and continuous improvement."});
T.push({"id": "auditprep", "r": "ma", "g": "Inspections and Audits", "t": "Internal and External Audit Preparation", "lead": "An audit **examines the system**, not the person. The aim is to see whether what the SMS says actually works.", "pts": ["**Internal audit** by the company at set intervals; **external audit** by the Flag or the RO for the SMC and DOC.", "**Intermediate verification** of the SMC between the second and third anniversary.", "**Trail of evidence**: the auditor follows one task from the policy right through to the record.", "**Brief the crew**: not memorised answers, but **knowing where to find** the procedure.", "**Do not lie and do not pretend.** A lie that is discovered becomes a major finding.", "**Observation, non-conformity and major non-conformity** — know the difference and the time allowed to respond."], "ref": "ISM Code Elements 12 and 13 — company verification, review and evaluation, and certification and periodical verification. The **SMC is valid for 5 years** with an intermediate verification.", "k": "State the difference between an observation, a non-conformity and a major non-conformity.", "u": "Explain why it matters more that the crew know where to find the procedure than that they memorise it.", "p": "Lead the preparation for an internal audit: trail of evidence, records and the crew briefing.", "err": "Coached the crew on answers to the likely questions. The auditor noticed and the examination went deeper.", "stcw": "STCW Table A-II/2 — audit preparation and safety management verification."});
T.push({"id": "smsreview", "r": "ma", "g": "Inspections and Audits", "t": "Master's Review of the SMS", "lead": "The Master's review is the **voice of the ship in the office**. It is your chance to say what does not work in real life.", "pts": ["Carry it out at the **interval set by the SMS**, normally yearly or whenever there is a major change.", "**Specific and backed by evidence**: which procedure is hard to follow, where and why.", "**Propose a change**, do not just complain; set out what the wording should be.", "Include the **data**: near misses, non-conformities, defects and what the drills taught you.", "**Send it to the company and ask for a response**; a review with no answer breaks the cycle.", "**Follow the outcome** and tell the crew what changed because of their reports."], "ref": "ISM Code Element 5.1.5 — the Master shall **review the SMS and report its deficiencies to the shore-based management**. Element 12 covers the company's duty to respond.", "k": "State what a Master's review should contain and how often it is done.", "u": "Explain why crew trust breaks down when the company never answers the review.", "p": "Write a full Master's review with data, specific deficiencies and proposed changes.", "err": "Wrote that 'the SMS is adequate and effective'. One sentence, no data, and worth nothing at audit.", "stcw": "STCW Table A-II/2 — safety management system review."});
T.push({"id": "collground", "r": "ma", "g": "Emergency Command", "t": "Collision and Grounding Response", "lead": "After a collision or grounding, **the first hour** decides whether the ship is saved and how the Master is judged in the investigation.", "pts": ["**People first**: head count, injured, and the safety of the crew before any survey of damage.", "**Do not pull clear straight after a collision** while the other ship is plugging the hole; she could be the only thing holding back the flooding.", "**Assess the damage**: sound every tank and hold, and compare with the earlier records.", "**Damage stability and longitudinal strength** — a break can be more dangerous than the flooding.", "When grounded, **do not simply back off**; that can worsen the damage and the leak.", "**Report at once**: coastal State, company, Flag, Class and P&I. **Secure the VDR data immediately.**"], "ref": "SOLAS V/31 and V/33 for danger messages and the duty to assist, and MARPOL Protocol I for incident reporting. **The VDR data must be secured** before it is overwritten.", "k": "List the order of your actions in the first hour after a grounding.", "u": "Explain why backing off a grounding can be more dangerous than first holding position.", "p": "Lead a grounding scenario in the simulator from the first response through to the first report.", "err": "The VDR was overwritten because nobody saved it. The best evidence for the ship herself was lost.", "stcw": "STCW Table A-II/2 — respond to emergencies; damage control."});
T.push({"id": "fireexp", "r": "ma", "g": "Emergency Command", "t": "Fire and Explosion Command", "lead": "In a fire the Master's job is **to stay out of the flames**. It is **to command the fight** from a place where he sees the whole picture.", "pts": ["**Alarm, head count and boundary** before any attack. Find out whether anyone is missing.", "**Cut the air and the fuel**: dampers, fans, fuel pumps and quick-closing valves.", "**Boundary cooling** on every side, above and below the space; that is where the spread is stopped.", "**One BA team in, one ready outside**; set a time to come out and hold to it.", "**The fixed system decision**: when to release, and who confirms the head count. It cannot be undone.", "**Alter course and speed** to put the fire on the lee side and cut the air flowing over it."], "ref": "SOLAS Chapter II-2 and the muster list in SOLAS III/8. The **head count before releasing fixed gas** is the Master's most important decision in a machinery space fire.", "k": "State the order of command from the alarm through to the fixed system decision.", "u": "Explain why the Master must stay where he sees the whole picture, not inside the fight.", "p": "Lead a major fire scenario: response, boundary, BA teams and the CO₂ decision.", "err": "The Master joined the attack and the whole ship lost its leader. Nobody decided the bigger questions.", "stcw": "STCW Table A-II/2 — control emergency operations; fire fighting command."});
T.push({"id": "flood", "r": "ma", "g": "Emergency Command", "t": "Flooding and Loss of Stability", "lead": "Flooding kills **not through weight but through free surface**. A ship that sinks has usually capsized first.", "pts": ["**Sound every tank and hold** at once; compare with the last records to see where the water is entering.", "**Free surface effect** is the first enemy: a half-full space is more dangerous than a full one.", "**Use the damage stability booklet and the loading computer** in the damage condition, not the intact one.", "**Cross-flooding** only where it is designed in; otherwise it can worsen the list.", "**Do not simply add water** to correct a list; you can lose the GM you have left.", "**Prepare to abandon ship** while you fight the flooding; the two run side by side."], "ref": "SOLAS Chapter II-1 Part B-1 for damage stability and the **damage control plan and booklet** required by SOLAS II-1/19.", "k": "State where the damage control plan is kept and what it contains.", "u": "Explain why a half-full space is more dangerous than a completely full one.", "p": "Solve a damage scenario on the loading computer and decide on counter-flooding.", "err": "Added ballast on the opposite side to correct a list. Free surface grew and the heel got worse.", "stcw": "STCW Table A-II/2 — maintain seaworthiness; damage control."});
T.push({"id": "mefail", "r": "ma", "g": "Emergency Command", "t": "Main Engine and Steering Failure", "lead": "Losing the engine or the steering in the wrong place puts you **only minutes from grounding**. Speed of response is everything.", "pts": ["**Not Under Command signal** at once: two red lights or two balls, and a call on VHF.", "**Prepare the anchor** where the depth allows and the danger is close.", "**Change over to emergency steering** and station a man in the steering gear room with communications.", "**Tell VTS and the ships around you** your condition and what you intend to do.", "**Call for a tug early**, not once it is too late; an unused tug is cheaper than a grounding.", "**Use the momentum you have left** to take the ship clear of danger while you still have steering."], "ref": "COLREG Rules 3(f) and 27 for not under command, and SOLAS V/26 for steering gear and emergency steering.", "k": "State the correct lights and shapes for not under command and your first 5 steps.", "u": "Explain why you should call for a tug earlier than it seems necessary.", "p": "Lead a blackout scenario close to the coast: signals, anchor, tug and communications.", "err": "Waited for the engine room report before calling VTS. Lost 5 minutes that could have saved the ship.", "stcw": "STCW Table A-II/2 — respond to emergencies; loss of propulsion and steering."});
T.push({"id": "absdec", "r": "ma", "g": "Emergency Command", "t": "Abandon Ship Decision", "lead": "This is the **heaviest decision** a Master makes. Too early throws the ship away; too late kills.", "pts": ["The ship is **safer than the lifeboat** as long as she floats and gives shelter.", "Leave her once **there is no reasonable hope left** of keeping her afloat or safe.", "**Decide while there is still time** for an orderly launch; it is the panic launch that kills.", "**Distress alert before, not after**: DSC, EPIRB, SART and the position.", "**Full head count at the muster station**, and take water, radio and medicines.", "**Decide clearly and announce it clearly.** A Master's hesitation runs through the whole crew."], "ref": "SOLAS Chapter III and the IAMSAR Manual. The decision is **the Master's alone**, and his **overriding authority** under ISM Code Element 5 is its foundation.", "k": "State the sequence from the distress alert through to launching the survival craft.", "u": "Explain why staying with the ship as long as possible is safer.", "p": "Lead an abandon ship decision in the simulator and explain the grounds for every judgement.", "err": "Waited for an order from the office. Nobody in the office can see the ship; only the Master can decide.", "stcw": "STCW Table A-II/2 — organise and manage abandon ship."});
T.push({"id": "sarpob", "r": "ma", "g": "Emergency Command", "t": "SAR and Person Overboard", "lead": "Helping those in danger at sea is **an obligation, not a choice**. And in answering, you could be the On-Scene Coordinator.", "pts": ["**SOLAS V/33**: the Master must respond to a distress as far as he can do so safely.", "**On-Scene Coordinator** is the first ship on scene until the RCC appoints one; organise, do not wait.", "**Search pattern**: expanding square, sector search or parallel track; choose by the data and the number of ships.", "**Datum and drift**: calculate the set from wind and current since the incident happened.", "**Recovery plan**: SOLAS III/17-1 requires a plan and procedures to recover a person from the water.", "**Hypothermia**: have heat, blankets and first aid ready before the casualty arrives."], "ref": "SOLAS V/33 and Chapter V Regulation 7, together with **IAMSAR Manual Volume III**, which must be on the bridge. SOLAS III/17-1 requires a **ship-specific recovery plan**.", "k": "State the search patterns and when each one is used.", "u": "Explain the role of the On-Scene Coordinator and when it begins.", "p": "Lead a SAR scenario as OSC: datum, pattern, communications and recovery.", "err": "Waited for an order from the RCC before starting the search. The search area grows with every hour that passes.", "stcw": "STCW Table A-II/2 — co-ordinate search and rescue operations."});
T.push({"id": "pollinc", "r": "ma", "g": "Emergency Command", "t": "Pollution Incident Command", "lead": "In a spill, **the quantity does not decide how heavy the case is** — honesty and the speed of reporting do.", "pts": ["**Stop the source** and contain the spread before any cleaning.", "**Report at once to the coastal State** and to everyone on the SOPEP contact list, however small the leak.", "**Do not clean without permission** and never wash anything over the side.", "**Record and photograph everything**: time, quantity, place, weather and every step taken.", "**Protect the evidence**: tank soundings, Oil Record Book, alarm printouts and the samples.", "**Lawyer and P&I at once.** In many countries a spill is a criminal matter and the Master can go to prison."], "ref": "MARPOL Annex I Regulations 37 and **Protocol I** on reporting incidents involving harmful substances. Reporting is an obligation, not an option.", "k": "State who you call first and what data belongs in the first report.", "u": "Explain why concealment weighs heavier than the spill itself in the eyes of a court.", "p": "Lead an oil spill response: stopping, reporting, containment and the recording of evidence.", "err": "Fixed everything first so the report would look 'clean'. That is what turns an incident into a crime.", "stcw": "STCW Table A-II/2 — prevent, control and respond to pollution incidents."});
T.push({"id": "emgcomm", "r": "ma", "g": "Emergency Command", "t": "Emergency Communications and Reporting", "lead": "In an emergency, **the right message to the right person at the right time** counts as much as the action itself.", "pts": ["**Distress, Urgency and Safety**: Mayday, Pan-Pan and Securite. Know which one fits.", "**DSC alert first, then voice** on Channel 16 or on the appropriate frequency.", "**Content**: identity, position, nature of the emergency, assistance required and the number of persons.", "**Report to company, Flag, Class, P&I and charterer** — each one needs something different.", "**One voice to the outside.** Appoint one person to report so the accounts do not contradict.", "**Log every message**: time, to whom, and the exact content."], "ref": "SOLAS Chapter IV for GMDSS and the **IAMSAR Manual** for report formats. A distress has **priority over all other communications**.", "k": "State the difference between Mayday, Pan-Pan and Securite and when each is used.", "u": "Explain why several people reporting off the ship at the same time is dangerous.", "p": "Send a complete distress and follow-up report during a drill and log the whole exchange.", "err": "The Chief Engineer reported to the office and the Master to the Flag, and the two accounts differed. The ship lost its credibility.", "stcw": "STCW Table A-II/2 — use of GMDSS and emergency reporting."});
T.push({"id": "offlog", "r": "ma", "g": "Ship Administration", "t": "Official Logbook", "lead": "The **Official Logbook** is required by the Flag State and carries **legal force**. It is not the deck logbook.", "pts": ["It records **births, deaths, marriages, discipline, drills, inspections and the main events**.", "Enter the **load line and the draught on departure** and the checks the Flag requires.", "**No erasures and no torn-out pages.** One line through the error, write the correct entry, and sign.", "Some entries **require a witness**; follow what your Flag State lays down.", "**Master's signature** and, where required, that of another officer or the crew member concerned.", "**Retain it for the prescribed period** and produce it to anyone asking with proper authority."], "ref": "The contents of the Official Logbook are set by **Flag State law** and referred to by many conventions, including MLC 2006 for discipline and repatriation.", "k": "State the events that must be entered in the Official Logbook under your Flag.", "u": "Explain why one erased entry destroys the value of the whole logbook.", "p": "Write the correct entry for a disciplinary hearing and for a drill that was not completed.", "err": "Entered in the deck log what belonged in the Official Logbook. In court the wrong book is as good as no record.", "stcw": "STCW Table A-II/2 — statutory records and documentation."});
T.push({"id": "crewdocs", "r": "ma", "g": "Ship Administration", "t": "Crew Documents and Certifications", "lead": "The ship cannot sail where the crew **hold no valid certificates**. It is the Master's duty to check them before departure.", "pts": ["Match the crew against the **Minimum Safe Manning Document**: numbers, ranks and certificates.", "Check the **Certificate of Competency and the endorsement of the ship's Flag State**, not only that of the home country.", "**Mandatory courses**: basic safety, advanced fire fighting, survival craft, medical and the special ones for the ship type.", "**Medical certificate** valid, and **passport, seaman's book and visa** nowhere near expiry.", "**Check on joining, not on sailing day.** A missing certificate can become a detention.", "**Keep an expiry tracker** and tell the company 6 months before anything expires."], "ref": "STCW Regulation I/2 and I/10 — recognition of certificates. A **flag endorsement** is required when the certificate was issued by another country. SOLAS V/14 covers the manning requirement.", "k": "State what you check on the certificates of a newly joined officer.", "u": "Explain why a home-country certificate alone is not enough without a flag endorsement.", "p": "Carry out a full crew certificate audit against the Safe Manning Document and prepare a tracker.", "err": "An endorsement expired while the ship was at sea. Manning fell short and the ship was detained at the next port.", "stcw": "STCW Table A-II/2 — crew certification and manning compliance."});
T.push({"id": "mlchours", "r": "ma", "g": "Ship Administration", "t": "MLC Working and Rest Hours", "lead": "Fatigue causes accidents. Rest hours are **not just paperwork** — they are the safety of the ship.", "pts": ["**Not less than 10 hours of rest in any 24 hours**, and **77 hours in any 7 days**.", "Rest can be **split into no more than 2 periods**, and one of them must be **not less than 6 hours**.", "The interval between two rest periods must not exceed **14 hours**.", "**Arrange the drills** so that rest is not broken wherever that can be avoided, and where it is broken, give compensatory rest.", "**Record the truth.** A dressed-up rest hour record is one of the most common PSC findings.", "Where **a breach cannot be avoided**, record it and the reason, and fix the schedule."], "ref": "MLC 2006 Standard A2.3 and STCW Code Section A-VIII/1 — hours of rest. An **exception must be made through a collective agreement** and must not exceed the stated limits.", "k": "State the rest hour limits in any 24 hours and in any week.", "u": "Explain why a false record is more dangerous than an admitted breach.", "p": "Inspect one month of crew rest hour records, identify the breaches, and rebuild the schedule.", "err": "Altered the record to make it look acceptable. It did not match the bell book or the drill record, and the inspector saw it.", "stcw": "STCW Table A-II/2 — fatigue management and compliance with rest hour requirements.", "ani": "rest"});
T.push({"id": "discip", "r": "ma", "g": "Ship Administration", "t": "Disciplinary Procedures", "lead": "Discipline is **for safety and good order**, not for revenge. The procedure protects everyone, you included.", "pts": ["**Follow the procedure in the SMS and the collective agreement**; do not invent your own rules.", "**Investigate first**: hear both sides and take statements before you decide.", "**Give the person concerned a chance to explain**; that is the most important step.", "**Enter it in the Official Logbook** as the Flag requires, with a witness where needed.", "**Penalty proportionate** to the offence; an excessive one becomes a case against the ship.", "**Never decide while angry.** Let time pass, take advice from the company, and decide cold."], "ref": "MLC 2006 Standard A5.1.5 — onboard complaint procedures, together with the procedure in the SMS and the collective bargaining agreement. **Repatriation as a penalty** has its own rules.", "k": "State the steps of your disciplinary procedure and where it is written.", "u": "Explain why the person concerned must be heard before you decide, even when the facts look clear.", "p": "Carry out a disciplinary hearing with the correct procedure, a witness and a record.", "err": "Punished on the spot with no hearing. It became a union case, and the ship was in the wrong, not the rating.", "stcw": "STCW Table A-II/2 — apply leadership and managerial skills."});
T.push({"id": "medrep", "r": "ma", "g": "Ship Administration", "t": "Medical and Repatriation Decisions", "lead": "There is no doctor on board. The Master decides **whether what can be done on board is enough** or the patient must go ashore.", "pts": ["**Get TMAS advice** — the free medical advice by radio — and follow it; log every piece of advice.", "**Decide early on a deviation**; the hours lost can never be recovered.", "**Medevac** by helicopter or boat carries its own preparation and risk; work through the RCC.", "**Medical locker**: know the contents, the expiry dates and the correct record of controlled drugs.", "**Record everything**: symptoms, times, medicine given, quantity and the patient's response.", "**Repatriation** is a seafarer's right under MLC; never use it as a penalty or a tool."], "ref": "MLC 2006 Regulations 4.1 and 2.5 — medical care on board and repatriation. The WHO **International Medical Guide for Ships** and TMAS are the main references at sea.", "k": "State how to obtain TMAS advice and what has to be recorded.", "u": "Explain why an early decision on deviation is better than waiting to see whether it worsens.", "p": "Lead a medical emergency: assessment, TMAS, the deviation decision and the full record.", "err": "Waited a day to see whether he would get better. By the time the decision came, the ship was far from any hospital.", "stcw": "STCW Table A-II/2 — provide medical care on board; use of medical advice by radio."});
T.push({"id": "cashstores", "r": "ma", "g": "Ship Administration", "t": "Cash, Bonded Stores and Controlled Documents", "lead": "**Cash, bonded stores and controlled drugs** are the three easiest sources of an accusation. The records are your defence.", "pts": ["**Cash to Master**: log every receipt and every payment out, with the signature of the receiver and a daily balance.", "**Bonded stores**: sealed while in port, every issue logged, and the customs declaration ready.", "**Controlled drugs**: locked under two keys, every dose recorded, with two signatures.", "**Company alcohol policy**: enforce it on everyone alike and record the testing where it is required.", "**Count and sign at handover** for cash, stores and keys; with a record there is no suspicion.", "**Keep the records separate from the money.** One person should not both hold and record without a check."], "ref": "MLC 2006 for wages and allotments, and the customs law of each port for bonded stores. Controlled drugs fall under Flag State and company policy.", "k": "State how cash to Master and controlled drugs are recorded.", "u": "Explain why the person who holds must be separate from the person who records.", "p": "Carry out a full handover of cash, bonded stores and keys with a count and signatures.", "err": "No signed record of the bonded stores issued. At the customs inspection the shortfall became a fine and an accusation.", "stcw": "STCW Table A-II/2 — ship administration and record keeping."});
T.push({"id": "cmdhand", "r": "ma", "g": "Ship Administration", "t": "Handover and Takeover of Command", "lead": "Handing over command is **not passing the keys**. It is a full transfer of knowledge, responsibility and the standing of the ship.", "pts": ["**Written handover note**: condition of the ship, open defects, certificates and the surveys coming due.", "**Commercial**: charter, bunkers, claims, open letters of protest and the outstanding port matters.", "**Crew**: condition, issues, contracts, and the people who need watching.", "**Count together**: cash, bonded stores, keys, controlled drugs and the documents.", "**Walk the whole ship together**; do not rely on paper alone.", "**Both sign** the handover and send a copy to the company. That is where one man's responsibility ends and the other's begins."], "ref": "ISM Code Element 6 — resources and personnel, and the handover procedure in the SMS. Many companies require a **minimum overlap period**.", "k": "List the contents of a complete Master's handover note.", "u": "Explain why walking the ship together is needed on top of the written record.", "p": "Prepare a full handover package and lead a takeover including the count and the walk round.", "err": "A short handover because the flight was waiting. After he left, an open claim came to light that nobody knew about.", "stcw": "STCW Table A-II/2 — manage the handover of command responsibilities."});
T.push({"id": "ordlib", "r": "ma", "g": "Ship Administration", "t": "Master's Standing Orders Library", "lead": "Standing orders are a **living document**, not a template to copy. They are how the Master stays present even while asleep.", "pts": ["**Navigation orders**: CPA and TCPA, UKC, speed, lookout and when to call the Master.", "**Port and cargo orders**: gangway watch, draught monitoring, mooring and access control.", "**Anchoring orders**: anchor circle, engine notice, and the signs of dragging.", "**Heavy weather and restricted visibility orders**: speed, route and the precautions to take.", "**Security orders**: ISPS level, watchkeeping in a piracy area and the citadel procedure where one exists.", "**Signed by every officer** and **reviewed at every crew change or change of route**."], "ref": "SOLAS V/34-1 and STCW Code A-VIII/2 — the Master has the right to decide for safety, and the standing orders are how that is turned into daily practice.", "k": "State the groups of orders that belong in your standing orders library.", "u": "Explain why standing orders copied from another ship lose their force.", "p": "Write a complete set of standing orders for your ship and explain every limit in them.", "err": "Used the standing orders from his last ship. The limits in them did not suit the present ship and route.", "stcw": "STCW Table A-II/2 — apply leadership and managerial skills; standing instructions."});
T.push({"id": "metsynop", "r": "ma", "g": "Meteorology", "t": "Synoptic Charts and Weather Analysis", "ani": "synop", "lead": "A synoptic chart is **a photograph of the atmosphere at one moment**. Reading it is how you see the weather three days before it reaches you.", "pts": ["**Isobars** join points of equal pressure. Close together means strong wind; far apart means light wind.", "**Low (L)**: rising air, cloud, rain and strong wind. **High (H)**: sinking air, settled weather, light wind and often poor visibility.", "**Trough and ridge**: an extension of a low and of a high. Weather changes sharply at a trough.", "A **prognosis chart** shows the forecast position at 24, 48 and 72 hours — compare it with the analysis chart to see how fast the system moves.", "Watch the **movement and the deepening**: a low that deepens while approaching is far worse than one that fills.", "**Use several sources**: facsimile chart, NAVTEX, Inmarsat SafetyNET and the routeing provider; never one alone."], "ref": "SOLAS V/5 — meteorological services and warnings, and SOLAS V/34 for voyage planning. Weather information is received through the **GMDSS MSI services** required by SOLAS Chapter IV.", "k": "Read a synoptic chart and state the position, central pressure and direction of movement of each system.", "u": "Explain why isobar spacing tells you the wind speed before any forecast text does.", "p": "Plot the ship's position on a 48-hour prognosis chart and state the wind and sea you expect on passage.", "err": "Looked only at the present analysis chart. The low moved 400 miles in 24 hours and met the ship where nobody expected it.", "stcw": "STCW Table A-II/2 — forecast weather and oceanographic conditions."});
T.push({"id": "metbuys", "r": "ma", "g": "Meteorology", "t": "Pressure Systems and Buys Ballot's Law", "ani": "buys", "lead": "**Buys Ballot's Law** lets you find the centre of a low with nothing but the wind on your face. It still works when every chart has failed to arrive.", "pts": ["**Northern hemisphere**: face the wind, and the **low is on your right**, slightly behind.", "**Southern hemisphere**: face the wind, and the **low is on your left**, slightly behind.", "Wind blows **anticlockwise around a low in the northern hemisphere** and clockwise in the southern.", "**Surface friction** turns the wind across the isobars towards the low, about 10 to 20 degrees over the sea.", "**Barometric tendency** is the warning: a fall of **3 hPa in 3 hours** is significant; 5 hPa in 3 hours demands action.", "Correct the barometer for **height and for index error** before you trust the tendency."], "ref": "A classical rule of marine meteorology, still carried in the Mariner's Handbook and the Admiralty publications. Pressure tendency is a required entry in the **weather observation** sent under SOLAS V/5.", "k": "State Buys Ballot's Law for both hemispheres and the direction of circulation around a low.", "u": "Explain why the surface wind crosses the isobars instead of running parallel to them.", "p": "From the observed wind and the barometer tendency, estimate the bearing of the low and its likely movement.", "err": "Used the northern hemisphere rule south of the equator and steered straight into the centre of the system.", "stcw": "STCW Table A-II/2 — interpret meteorological information and apply it to the passage."});
T.push({"id": "metfronts", "r": "ma", "g": "Meteorology", "t": "Fronts and Frontal Weather", "ani": "fronts", "lead": "A front is **the boundary between two air masses**. Almost all of the sudden weather in temperate latitudes happens as a front passes over the ship.", "pts": ["**Warm front**: slow, shallow slope. Cirrus first, then lowering cloud, steady rain, and veering wind with rising temperature.", "**Cold front**: steep and fast. Cumulonimbus, heavy squalls, a sharp wind veer and a temperature drop; the pressure rises behind it.", "**Warm sector** between them: low cloud, drizzle, poor visibility and a steady wind.", "**Occlusion**: the cold front overtakes the warm one; a long band of rain and a slow improvement.", "The **wind veers at each front** in the northern hemisphere and backs in the southern.", "**Squalls on a cold front** can exceed the forecast mean wind by 20 knots or more — secure the deck before it arrives."], "ref": "Covered in the Mariner's Handbook and the Admiralty Meteorology for Mariners. The passage of a front is one of the standard observations reported under **SOLAS V/5**.", "k": "State the sequence of cloud, pressure, wind and visibility for a warm front and a cold front.", "u": "Explain why a cold front gives a short violent spell and a warm front a long dull one.", "p": "From a synoptic chart, predict the time of frontal passage and brief the deck on the preparations needed.", "err": "Treated a cold front as a shower. The squall arrived at 45 knots and the deck cargo lashings had not been checked.", "stcw": "STCW Table A-II/2 — forecast weather conditions and their effect on the ship."});
T.push({"id": "mettrs", "r": "ma", "g": "Meteorology", "t": "Tropical Revolving Storms", "ani": "trs", "lead": "A tropical revolving storm is **the one weather system that can sink a sound ship**. Avoidance is the only tactic; there is no riding it out.", "pts": ["Known as a **hurricane, typhoon or cyclone** by region; the structure is the same.", "**Eye** of light wind and low pressure, surrounded by the **eye wall** where the strongest wind and the worst sea are found.", "Circulation is **anticlockwise in the northern hemisphere**, clockwise in the southern.", "**Warning signs**: a long low swell from an unusual direction, a pressure 3 hPa or more below normal for the area, unusual cirrus, and a red threatening sky.", "The track usually moves **west then recurves polewards**; the point of recurvature is where forecasts are least reliable.", "Give it room: many companies require a minimum of **200 miles** off the forecast track, more where the forecast is uncertain."], "ref": "SOLAS V/31 and V/32 require the Master to report dangerous weather, and **SOLAS V/34** requires the passage plan to take it into account. Tropical storm warnings are broadcast as MSI under SOLAS Chapter IV.", "k": "State the structure of a tropical revolving storm and the signs of its approach.", "u": "Explain why the swell arrives long before the wind and what that tells you about the bearing of the centre.", "p": "From a storm warning, plot the forecast track, the danger area and the ship's position relative to both.", "err": "Held course because the wind was still moderate. The long swell had been running for 12 hours and the centre was already closing.", "stcw": "STCW Table A-II/2 — respond to and avoid heavy weather and tropical storms."});
T.push({"id": "mettrsav", "r": "ma", "g": "Meteorology", "t": "TRS Avoidance and the Dangerous Semicircle", "ani": "semi", "lead": "Half of a tropical storm will carry you into the centre, the other half will carry you clear. **Knowing which half you are in** is the whole skill.", "pts": ["**Northern hemisphere**: the **right-hand semicircle** facing the direction of travel is dangerous; the left is navigable.", "**Southern hemisphere**: the **left-hand semicircle** is dangerous; the right is navigable.", "In the dangerous semicircle the **storm's own speed adds to the wind**, and the wind tends to drive you towards the track.", "**Northern hemisphere, dangerous semicircle**: bring the wind on the **starboard bow** and make as much way as possible.", "**Northern hemisphere, navigable semicircle**: bring the wind on the **starboard quarter** and run with it.", "**Veering wind** in the northern hemisphere means you are in the dangerous semicircle; **backing wind** means the navigable one; steady wind with falling pressure means you are near the track."], "ref": "The classical rules of storm avoidance, carried in the Mariner's Handbook and in company heavy weather procedures. The Master's authority to deviate is protected by **ISM Code Element 5**.", "k": "State the dangerous semicircle and the action for each semicircle in both hemispheres.", "u": "Explain why a veering wind in the northern hemisphere tells you that you are in the dangerous half.", "p": "Given a storm warning and the ship's position, decide the avoiding course and justify it to the company.", "err": "Tried to cross ahead of the track to save a day. The storm recurved and the ship spent 20 hours in the eye wall.", "stcw": "STCW Table A-II/2 — manoeuvre the ship in heavy weather and avoid tropical storms."});
T.push({"id": "metroute", "r": "ma", "g": "Meteorology", "t": "Weather Routeing and Voyage Planning", "lead": "Weather routeing is **advice, not an order**. The Master chooses the route; the shore service only supplies the forecast behind it.", "pts": ["**Shore routeing** uses forecast models and the ship's own performance curve to suggest a track.", "**Onboard routeing software** does the same with the charts and forecasts held on board; keep it updated.", "The advice assumes the **ship's stated performance**; if the hull is fouled or the engine is derated, the advice is wrong.", "**The Master may always depart from the recommendation** for safety, and must record why.", "Balance **fuel, time and safety** — the shortest route is often the one that damages the cargo.", "Keep the **routeing messages in the file**; they matter in a speed and consumption claim and in a cargo damage claim."], "ref": "IMO Resolution A.528(13) — Recommendation on weather routeing, and SOLAS V/34 on voyage planning. The Master's **overriding authority** under ISM Code Element 5 covers any departure from the advice.", "k": "State what a weather routeing service provides and what it does not.", "u": "Explain why a routeing recommendation does not transfer any responsibility away from the Master.", "p": "Compare a routeing recommendation with your own passage plan and justify the route you decide to take.", "err": "Followed the recommended track into a rising sea because it came from the office. The responsibility stayed with the Master.", "stcw": "STCW Table A-II/2 — plan and conduct an ocean passage using meteorological information."});
T.push({"id": "metwaves", "r": "ma", "g": "Meteorology", "t": "Waves, Swell and Sea State", "ani": "waves", "lead": "The ship does not feel the wind, it feels the sea. **Wave height, period and direction** decide the motion, the slamming and the cargo damage.", "pts": ["**Sea** is raised by the local wind; **swell** has travelled from a distant system and keeps its own direction and period.", "Wave height grows with **wind speed, fetch and duration** — a gale over a short fetch raises less sea than a fresh breeze over an ocean.", "**Significant wave height** is the mean of the highest third; individual waves can reach nearly twice it.", "**Synchronous rolling** occurs when the encounter period matches the ship's natural roll period; **parametric rolling** builds in head or following seas.", "**Alter course or speed to change the encounter period** — this is the fastest cure for dangerous rolling.", "**Swell against wind sea** produces a confused, steep sea that is far harder on the ship than either alone."], "ref": "IMO **MSC.1/Circ.1228** — Revised guidance to the Master for avoiding dangerous situations in adverse weather and sea conditions, which covers synchronous and parametric rolling and the use of speed and course changes.", "k": "State the difference between sea and swell and what significant wave height means.", "u": "Explain how a change of course or speed breaks a synchronous roll.", "p": "From the forecast sea and swell, decide a course and speed that keeps the motion within acceptable limits.", "err": "Held course and speed through a following sea. Parametric rolling built within minutes and the deck cargo shifted.", "stcw": "STCW Table A-II/2 — manoeuvre the ship in heavy weather; MSC.1/Circ.1228."});
T.push({"id": "metfog", "r": "ma", "g": "Meteorology", "t": "Fog and Restricted Visibility", "ani": "fog", "lead": "Fog is forecastable. If you know **the water temperature and the dew point**, you know hours in advance whether you will be in it.", "pts": ["**Advection fog**: warm moist air flowing over a colder sea. The commonest sea fog and the most persistent.", "**Radiation fog**: forms over land on clear calm nights and drifts out over harbours and estuaries at dawn.", "**Frontal fog**: rain from a warm front falling through colder air at the surface.", "**Steam fog**: very cold air over much warmer water, seen in high latitudes.", "The warning sign is the **air temperature falling towards the dew point** while the sea temperature is lower still.", "Known fog areas: **cold current meeting warm air** — the Grand Banks, the Kuril and northern Japan, and the Benguela coast."], "ref": "COLREG Rule 19 governs conduct in restricted visibility, and SOLAS V/34 requires the passage plan to allow for it. Sea and air temperature are required entries in the **weather observation** under SOLAS V/5.", "k": "Name the types of fog and the conditions that form each one.", "u": "Explain how comparing the dew point with the sea temperature predicts advection fog.", "p": "From the observations, forecast the onset of fog and bring the bridge to restricted visibility routine in good time.", "err": "Waited for the visibility to drop before calling the Master and posting the lookout. By then the ship was already inside it.", "stcw": "STCW Table A-II/2 — forecast visibility and conduct the ship in restricted visibility."});
T.push({"id": "metice", "r": "ma", "g": "Meteorology", "t": "Ice Accretion and Cold Climate Weather", "lead": "Ice on deck is **weight in the worst possible place** — high up. It is one of the few hazards that can capsize a ship in hours.", "pts": ["**Freezing spray** is the main source: sea temperature below about 5 degrees Celsius, air well below freezing, and wind over 15 knots.", "Ice on masts, rigging and superstructure **raises the centre of gravity** and reduces GM quickly.", "**Reduce the spray**: alter course and speed so the ship takes the sea more easily, and seek the lee of land.", "**Clear the ice** from the highest points first, and keep the freeing ports and scuppers clear.", "The **loading condition must allow for an icing allowance** in the areas where it applies.", "Watch for **frozen valves, blocked air pipes and seized deck machinery** before you need them."], "ref": "The **Load Line Convention** sets the icing allowance areas, the **Polar Code** applies in polar waters, and **MSC.1/Circ.1228** covers the manoeuvring response to adverse weather.", "k": "State the conditions that cause freezing spray and the effect of ice on stability.", "u": "Explain why ice high on the ship is far more dangerous than the same weight of cargo low down.", "p": "Plan a passage in an icing area: loading allowance, course and speed policy, and the ice clearing plan.", "err": "Cleared the ice from the deck first because it was easiest to reach. The weight aloft is what takes the GM away.", "stcw": "STCW Table A-II/2 — maintain seaworthiness; heavy weather and ice."});
T.push({"id": "metobs", "r": "ma", "g": "Meteorology", "t": "Weather Observation and Reporting", "lead": "Every forecast you receive was built from observations sent by ships. **A ship that reports gets better forecasts back.**", "pts": ["The **Voluntary Observing Ship** scheme collects the reports that feed the forecast models.", "A standard observation carries **pressure and tendency, wind, air and sea temperature, dew point, visibility, cloud, sea and swell**.", "**Observe at the synoptic hours** — 0000, 0600, 1200 and 1800 UTC — so the data fits the model run.", "**Calibrate the instruments** and know the barometer's height correction and index error.", "**Dangerous weather must be reported** whatever the scheme: storm force wind, ice, a derelict or any other danger.", "**Keep the copy** of every report; it supports the ship in a weather damage or a speed claim."], "ref": "SOLAS V/31, V/32 and V/33 — danger messages and their required content, and SOLAS V/5 on meteorological services. The danger message is **compulsory**, the routine observation is voluntary.", "k": "List the elements of a standard weather observation and the synoptic hours.", "u": "Explain the difference between the voluntary observation and the compulsory danger message.", "p": "Take and transmit a full weather observation and a danger message in the correct format.", "err": "Did not report storm force wind because the ship was not a VOS member. The danger message is required of every ship.", "stcw": "STCW Table A-II/2 — record and report meteorological information."});
const Q = {"chartcorr": [{"q": "In what medium is a hand correction applied to a paper chart, and where is the Notice number entered?", "o": ["Black ink, with the Notice number in the top right corner", "Pencil, with the Notice number in the bottom right corner", "Magenta ink, with the Notice number in the bottom left corner", "Red ink, with the Notice number written alongside the title block"], "a": 2, "why": "Paper chart corrections are drawn by hand in magenta ink and the Notice number is written in the bottom left corner of the chart (SOLAS V/19.2.1.4 and V/27)."}, {"q": "After a weekly exchange set has been loaded, what must you confirm on the ECDIS before departure?", "o": ["That the update status shows the updates applied and no permit expired", "That the cells for the voyage have loaded into the chart folder", "That the update files were downloaded onto the ECDIS workstation", "That the chart correction log has been countersigned by the Master"], "a": 0, "why": "The ENC update status must be verified on the display, not merely that the cells loaded; an ECDIS without proper updates is not treated as compliant under SOLAS V/19.2.1.4 and V/27."}, {"q": "Why is a chart of a superseded edition unacceptable even when it has been hand-corrected to the latest Notice?", "o": ["Corrections to an old edition must be entered in pencil, not in magenta", "An old edition cannot be corrected and has to be replaced by the new chart", "The correction log cannot record Notices against a superseded edition", "An old edition is acceptable only where a block correction has been fitted"], "a": 1, "why": "A new edition replaces the chart; the old edition cannot be brought up to date by correction, so it is not adequate and up to date as SOLAS V/19.2.1.4 and V/27 require."}], "ntm": [{"q": "Which section of the Weekly Notices to Mariners carries corrections to the List of Lights?", "o": ["Section II", "Section III", "Section IV", "Section V"], "a": 3, "why": "Section V of the Weekly NtM carries corrections to the List of Lights, Section IV covering the Sailing Directions (SOLAS V/27)."}, {"q": "What does the Annual Summary of Notices to Mariners tell you?", "o": ["Which charts were given a new edition during the previous year", "Which T and P notices remain in force at the start of the year", "Which weekly notices were cancelled during the previous year", "Which publications are due for a new edition in the coming year"], "a": 1, "why": "The Annual Summary states which Temporary and Preliminary notices remain in force at the start of the year (SOLAS V/27)."}, {"q": "One Weekly NtM was skipped because there was no internet that week; what is the effect on the charts?", "o": ["The following week's notices repeat the corrections that were missed", "The charts stay compliant provided the Annual Summary is applied", "The corrections in that week were never applied, so the chart is out of date", "Only T and P notices are affected, as permanent corrections are cumulative"], "a": 2, "why": "Each correction carries its own year and number, for example 1234(T)/25, so the sequence must be followed; one missing week is enough to become a deficiency under SOLAS V/27."}], "saildir": [{"q": "At which stage of the passage plan are the Sailing Directions read?", "o": ["At the appraisal stage, before the plan is drawn up", "At the planning stage, once the tracks have been laid", "At the execution stage, on approaching the area", "At the monitoring stage, alongside the chart work"], "a": 0, "why": "SOLAS V/27 and V/34 require the appraisal to use all relevant information, including the Sailing Directions, so they are read before the plan is drawn up."}, {"q": "Which of the following is found in the Sailing Directions rather than on the chart?", "o": ["The charted depth alongside the berth to be used", "The characteristic and period of the landfall light", "The direction and rate of the stream at a tidal diamond", "Climatic tables giving the typical weather month by month"], "a": 3, "why": "Sailing Directions carry the written description a chart cannot show, including climatic tables and the typical weather month by month (SOLAS V/27 and V/34)."}, {"q": "How are the Sailing Directions kept up to date?", "o": ["Through Section II of the Weekly NtM and by block correction", "Through Section IV of the Weekly NtM and by new editions", "Through Section V of the Weekly NtM and by the Annual Summary", "Through the Annual Summary alone, as the volumes are reprinted yearly"], "a": 1, "why": "Sailing Directions are updated through Section IV of the Weekly NtM and by new editions (SOLAS V/27)."}], "lol": [{"q": "How many volumes does the Admiralty List of Lights and Fog Signals run to?", "o": ["6 volumes, numbered 1 to 6 by service", "9 volumes, lettered A to J by ocean", "12 volumes, lettered A to M by region", "15 volumes, numbered by hydrographic district"], "a": 2, "why": "The Admiralty List of Lights and Fog Signals runs to 12 volumes, lettered A to M by region (SOLAS V/27)."}, {"q": "Which range is the one printed against a light in the List of Lights?", "o": ["Nominal range", "Geographical range", "Luminous range", "Observed range"], "a": 0, "why": "Nominal range is the figure listed; geographical range is a separate matter and depends on the height of eye (SOLAS V/27)."}, {"q": "Why may a light be sighted at a distance well short of the range given in the List of Lights?", "o": ["Because the elevation listed is measured from chart datum, not from MHWS", "Because the characteristic and period alter with the state of the tide", "Because the sector limits in the list are given to the nearest degree only", "Because nominal range is listed, not the distance a light is actually seen"], "a": 3, "why": "The listed figure is nominal range; taking it as the exact sighting distance is wrong because geographical range depends on the height of eye (SOLAS V/27)."}], "tides": [{"q": "Where is the ship's minimum under-keel clearance requirement normally stated?", "o": ["In SOLAS V/34, as a mandatory figure for all ships", "In the ship's SMS, as a company requirement", "In the tide tables for the relevant standard port", "In the loading manual, alongside the trim table"], "a": 1, "why": "Minimum UKC is normally stated in the SMS and not in SOLAS, so the company requirement is the one to follow (SOLAS V/34 and the ship's UKC policy)."}, {"q": "How is the time and height of high water obtained for a secondary port?", "o": ["By reading HW and LW directly from its own daily page", "By interpolating between the two nearest standard ports", "By applying time and height differences to the standard port", "By adding the stream rate taken from the nearest tidal diamond"], "a": 2, "why": "At a secondary port the time and height differences are added to or subtracted from the standard port figures."}, {"q": "What do a tidal stream atlas and the tidal diamonds on a chart give you?", "o": ["The direction and rate of the current, not the height of tide", "The height of tide at a time between HW and LW", "The time and height of HW and LW at a secondary port", "The depth below chart datum at the position of the diamond"], "a": 0, "why": "The tidal stream atlas and diamonds give the direction and rate of the current; the height of tide comes from the tide tables and the tidal curve."}], "alrs": [{"q": "Which volume of the List of Radio Signals covers pilot services, VTS and port operations?", "o": ["Volume 1, coast radio stations and radio services", "Volume 3, maritime safety information and NAVTEX", "Volume 5, GMDSS and distress procedures", "Volume 6, pilot services, VTS and port operations"], "a": 3, "why": "ALRS Volume 6 covers pilot services, VTS and port operations (SOLAS V/27)."}, {"q": "Which volume of the List of Radio Signals would you use to identify the ship's GMDSS sea area?", "o": ["Volume 2, radio aids to navigation and legal time", "Volume 5, GMDSS and distress procedures", "Volume 3, NAVTEX and SafetyNET services", "Volume 4, meteorological observation stations"], "a": 1, "why": "ALRS Volume 5 is the usual reference for GMDSS and for identifying the sea area (SOLAS V/27 and Chapter IV)."}, {"q": "Why must the List of Radio Signals be kept corrected rather than treated as a standing reference?", "o": ["Because the volumes are listed in the chart catalogue and checked at PSC", "Because the limits of the sea areas are redefined in each new edition", "Because VTS frequencies and NAVTEX schedules change between editions", "Because the distress frequencies are reallocated by the ITU each year"], "a": 2, "why": "The ALRS must be kept updated because details such as a VTS frequency or a NAVTEX schedule change (SOLAS V/27 and Chapter IV)."}], "tandp": [{"q": "How is a Temporary notice shown on a paper chart?", "o": ["In pencil or on an overlay, and never inked in permanently", "In magenta ink, with the notice number entered in the margin", "As a block correction pasted over the affected area", "Not shown at all, being recorded only in the T and P file"], "a": 0, "why": "T and P notices are never inked in permanently; pencil or an overlay is used on the paper chart (SOLAS V/27)."}, {"q": "What is required for T and P notices to be seen on the ECDIS?", "o": ["They come with the weekly exchange set and need no further action", "They appear only once the Annual Summary has been loaded", "They are entered by hand as mariner's objects on the display", "The T and P layer must be switched on for them to be displayed"], "a": 3, "why": "On ECDIS the T and P notices show as a separate layer which must be switched on; leaving it off means the temporary hazard is never seen (SOLAS V/27)."}, {"q": "What becomes of a Preliminary notice once the change it warns of is permanent?", "o": ["It remains in force until the chart receives a new edition", "It is issued as an ordinary correction and the notice is withdrawn", "It is carried into the next Annual Summary as still in force", "It is re-issued as a Temporary notice until the chart is reprinted"], "a": 1, "why": "Once a change becomes permanent it is issued as an ordinary correction and the T or P notice is withdrawn (SOLAS V/27)."}], "chartinv": [{"q": "What must the ENC permit list in the inventory show for each cell?", "o": ["The edition number of the cell", "The last notice applied to the cell", "The expiry date of the permit for the cell", "The scale band to which the cell belongs"], "a": 2, "why": "The inventory holds an ENC permit list showing the expiry of each cell, since an expired permit leaves the ship without that chart (SOLAS V/19.2.1.4 and V/27)."}, {"q": "For what must the ship's charts and publications be adequate?", "o": ["The intended voyage, and not only the ship's usual route", "The trading area stated on the ship's certificates", "The regions held in the ship's folio at delivery", "The route agreed with the charterer in the voyage orders"], "a": 0, "why": "SOLAS V/19.2.1.4 and V/27 require charts and publications to be adequate and up to date for the intended voyage, not just the usual route."}, {"q": "Why can a withdrawn chart not be used even though it is still in good condition?", "o": ["Because the correction log cannot be continued once a chart is withdrawn", "Because the folio list is reissued whenever a chart is withdrawn", "Because a withdrawn chart may be used for planning but not for navigation", "Because it is no longer maintained by notices, so it cannot be up to date"], "a": 3, "why": "A withdrawn chart receives no further corrections, so it cannot satisfy the requirement in SOLAS V/19.2.1.4 and V/27 for charts that are adequate and up to date."}], "seaareas": [{"q": "What is the typical extent of GMDSS sea area A2?", "o": ["Out to about 30 nm, within VHF DSC coverage of a coast station", "Out to about 100 nm within MF DSC coverage, outside A1", "Out to about 200 nm within HF coverage, outside A1", "Between about 70° N and 70° S, within Inmarsat coverage"], "a": 1
