T.push({"id": "pscstrat", "r": "ma", "g": "Inspections and Audits", "t": "PSC Preparation Strategy", "lead": "Ang PSC ay hindi pagsusulit na nireredyu. **Larawan ito ng araw-araw na pamantayan** ng barko mo.", "pts": ["Alamin ang **target factor at ang kasaysayan** ng barko; nagdedesisyon ito kung gaano katindi ang inspeksiyon.", "Alamin ang **Concentrated Inspection Campaign** ng taon at ihanda nang maaga ang paksa nito.", "**Self-assessment bago ang bawat daungan** gamit ang checklist ng MOU ng rehiyon.", "**Bigyan ng tungkulin ang bawat opisyal**: sino ang sasama, sino ang kukuha ng dokumento, sino ang magtatala.", "**Samahan lagi ang inspektor**; huwag siyang pabayaang maglibot nang mag-isa.", "**Magtala ng bawat puna habang nangyayari**, at magtanong agad kung ano ang hinihinging ebidensiya."], "ref": "SOLAS I/19, MARPOL at ang mga pamamaraan ng **Paris MOU at Tokyo MOU**. Ang mga detainable deficiency at ang Ship Risk Profile ay nakalathala sa kani-kanilang website.", "k": "Sabihin ang mga pangunahing lugar na sinusuri ng PSC at ang kasalukuyang CIC.", "u": "Ipaliwanag kung paano nakakaapekto ang kasaysayan ng barko sa dalas at bigat ng inspeksiyon.", "p": "Pamunuan ang isang buong PSC self-assessment at itakda ang tungkulin ng bawat opisyal.", "err": "Iniwan ang inspektor sa engine room nang mag-isa. Nakakita siya ng bagay na walang nakapagpaliwanag.", "stcw": "STCW Table A-II/2 — ensure compliance with pollution prevention and safety requirements."});
T.push({"id": "flaginsp", "r": "ma", "g": "Inspections and Audits", "t": "Flag State Inspection", "lead": "Ang Flag State ang **nagbigay ng sertipiko** ng barko. Ang kanilang inspeksiyon ay pagpapatunay na karapat-dapat pa rin ito.", "pts": ["Karaniwang isinasagawa ng **Flag State Inspector o ng Recognised Organization** sa ngalan nila.", "Sinusuri ang **pagsunod sa SOLAS, MARPOL, STCW, MLC at Load Line** nang sabay-sabay.", "**Manning at sertipiko ng tripulante** laban sa Minimum Safe Manning Document.", "**Pagpapatupad ng SMS**: hindi lang kung may papel, kundi kung ginagawa ba ito.", "**Ang puna ng Flag ay mas mabigat** kaysa sa puna ng PSC dahil sila ang maaaring magbawi ng sertipiko.", "Magtabi ng **ulat at ng katibayan ng pagsasara** ng nakaraang inspeksiyon."], "ref": "SOLAS I/19 at ang IMO Instruments Implementation Code (III Code) na nagtatakda ng responsibilidad ng Flag State sa pagsusuri ng kanilang mga barko.", "k": "Sabihin ang saklaw ng Flag State Inspection at kung sino ang maaaring magsagawa nito.", "u": "Ipaliwanag kung bakit mas mabigat ang puna ng Flag kaysa sa puna ng PSC.", "p": "Maghanda para sa Flag State Inspection: manning, sertipiko, SMS at ang nakaraang ulat.", "err": "Hindi naisara ang isang puna mula sa nakaraang taon. Nagiging palatandaan ito ng mahinang sistema, hindi lang ng isang depekto.", "stcw": "STCW Table A-II/2 — monitor and ensure compliance with legislative requirements."});
T.push({"id": "classsur", "r": "ma", "g": "Inspections and Audits", "t": "Class Surveys", "lead": "Ang Class ang nagpapatunay sa **lakas at kalagayan ng barko**. Kapag nawala ang class, nawawala ang insurance at ang trabaho.", "pts": ["**Annual survey** bawat taon, **intermediate** sa ikalawa o ikatlo, at **renewal o special survey** bawat limang taon.", "**Continuous survey** ang paraan ng paghahati ng gawain sa buong limang taon imbes na sabay-sabay.", "**Docking survey** dalawang beses sa loob ng limang taon, may pinakamahabang pagitan na itinakda.", "**Enhanced Survey Programme** para sa bulk carrier at tanker: thickness measurement at close-up survey.", "**Condition of Class at Recommendation** ay may takdang petsa; ang paglampas ay nagsususpinde ng class.", "Maghanda ng **access, paglilinis at bentilasyon** ng tangke at bodega bago dumating ang surveyor."], "ref": "SOLAS I/6 at I/10 at ang mga panuntunan ng Classification Society sa ilalim ng IACS. Ang **Enhanced Survey Programme** ay nasa IMO Resolution A.1049(27), ESP Code.", "k": "Sabihin ang siklo ng survey ng iyong barko at kung kailan ang susunod.", "u": "Ipaliwanag kung bakit nawawala ang saklaw ng insurance kapag nasuspinde ang class.", "p": "Maghanda para sa isang intermediate survey: access, tala, thickness measurement at ang listahan ng depekto.", "err": "Nalampasan ang petsa ng isang Condition of Class habang nasa dagat. Nagkaroon ng problema sa insurance sa susunod na biyahe.", "stcw": "STCW Table A-II/2 — survey, certification and class requirements."});
T.push({"id": "statcert", "r": "ma", "g": "Inspections and Audits", "t": "Statutory Certificates", "lead": "Ang barko ay naglalayag sa bisa ng kanyang **sertipiko**. Isang expired na papel ay sapat para hindi makaalis.", "pts": ["**Safety Construction, Safety Equipment at Safety Radio** para sa cargo ship, bawat isa may sariling survey.", "**Load Line, IOPP, IAPP, ISPP, Sewage at Garbage** sa ilalim ng Load Line Convention at MARPOL.", "**Safety Management Certificate** at **Document of Compliance** sa ilalim ng ISM Code.", "**International Ship Security Certificate** sa ilalim ng ISPS, at ang **Maritime Labour Certificate** sa ilalim ng MLC.", "**Endorsement**: maraming sertipiko ang kailangang i-endorso taun-taon; ang walang endorso ay itinuturing na walang bisa.", "**Magtago ng tracker** ng expiry at ng window ng survey; ang anniversary date ang susi, hindi ang expiry lang."], "ref": "SOLAS I/12 at I/14 — ang mga sertipiko ay may bisang hindi hihigit sa **limang taon**, at may **window na tatlong buwan** bago at pagkatapos ng anniversary date para sa annual survey.", "k": "Ilista ang mga statutory certificate ng iyong barko at ang petsa ng pag-expire ng bawat isa.", "u": "Ipaliwanag kung bakit itinuturing na hindi wasto ang sertipikong hindi na-endorso sa takdang panahon.", "p": "Bumuo ng kumpletong certificate tracker na may anniversary date, survey window at expiry.", "err": "Wasto ang sertipiko hanggang sa susunod na taon pero lumampas sa window ang annual endorsement. Sa PSC, ito ay detainable.", "stcw": "STCW Table A-II/2 — statutory certification and survey requirements."});
T.push({"id": "ismoversee", "r": "ma", "g": "Inspections and Audits", "t": "ISM, ISPS and MLC Oversight", "lead": "Tatlong sistema, iisang katotohanan: **gawin ang nakasulat at isulat ang ginawa**. Ang Master ang nangunguna sa tatlo.", "pts": ["**ISM**: ang Master ang may **overriding authority** sa kaligtasan at sa pagpigil ng polusyon. Nakasulat ito sa SMS.", "**Master's review of the SMS** ay hinihinging isagawa at iulat sa kumpanya nang pana-panahon.", "**ISPS**: ang SSO ang nagpapatupad; ang Master ang nagpapasya kapag may salungatan sa pagitan ng seguridad at kaligtasan.", "**Declaration of Security** kapag magkaiba ang security level ng barko at ng pasilidad.", "**MLC**: kontrata, sahod, rest hours, pagkain, tirahan at ang **onboard complaint procedure**.", "Ang tatlo ay may **internal audit at external audit**; ihanda ang katibayan, hindi lang ang papel."], "ref": "ISM Code Element 5 — Master's responsibility and authority; ISPS Code Part A; at ang MLC 2006 Title 5 para sa compliance and enforcement.", "k": "Sabihin ang kahulugan ng overriding authority ng Master at kung saan ito nakasulat.", "u": "Ipaliwanag kung paano lulutasin ang salungatan sa pagitan ng hinihingi ng seguridad at ng kaligtasan.", "p": "Isagawa ang Master's review ng SMS at maghanda ng ulat na may tiyak na rekomendasyon.", "err": "Nilagdaan ang review nang hindi nagbabasa. Sa audit, ang walang lamang review ang nagiging major non-conformity.", "stcw": "STCW Table A-II/2 — ISM, ISPS and MLC implementation."});
T.push({"id": "deficresp", "r": "ma", "g": "Inspections and Audits", "t": "Deficiency Response and Rectification", "lead": "Ang puna ay hindi katapusan. Ang **kalidad ng tugon mo** ang nagpapasya kung gaano katagal at kalalim ang susunod na inspeksiyon.", "pts": ["**Unawain muna ang puna** at ang kodigo nito bago tumugon; magtanong kung malabo.", "**Agad na pansamantalang hakbang** para maging ligtas habang hindi pa naaayos.", "**Ugat ng problema**, hindi lang ang nakita. Bakit hindi ito napansin ng sariling sistema?", "**Corrective action** na may tiyak na gagawa at takdang petsa; **preventive action** para hindi na maulit.", "**Katibayan ng pagsasara**: litrato bago at pagkatapos, invoice, tala at pirma.", "**Ipaalam agad sa kumpanya at sa Flag o Class** kung ang puna ay nakakaapekto sa sertipiko."], "ref": "ISM Code Elements 9 at 10 — reports and analysis of non-conformities at maintenance of the ship. Ang detention ay may **sariling pamamaraan ng pagpapalaya** na itinakda ng MOU.", "k": "Sabihin ang pagkakaiba ng corrective at preventive action.", "u": "Ipaliwanag kung bakit hindi sapat ang pag-aayos ng nakita kung hindi hinanap ang ugat nito.", "p": "Sumulat ng kumpletong corrective action report para sa isang tunay na puna, kasama ang ugat at ang katibayan.", "err": "Inayos ang isang sirang ilaw, iyon lang ang isinulat. Hindi tinanong kung bakit hindi ito napansin ng buwanang inspeksiyon.", "stcw": "STCW Table A-II/2 — corrective action and continuous improvement."});
T.push({"id": "auditprep", "r": "ma", "g": "Inspections and Audits", "t": "Internal and External Audit Preparation", "lead": "Ang audit ay **pagsusuri sa sistema**, hindi sa tao. Ang layunin ay makita kung gumagana ang sinasabi ng SMS.", "pts": ["**Internal audit** ng kumpanya sa itinakdang pagitan; **external audit** ng Flag o ng RO para sa SMC at DOC.", "**Intermediate verification** ng SMC sa pagitan ng ikalawa at ikatlong anibersaryo.", "**Trail of evidence**: ang auditor ay sumusunod sa isang gawain mula sa patakaran hanggang sa tala.", "**Ihanda ang tripulante**: hindi memoryado ang sagot, kundi **alam kung saan hahanapin** ang pamamaraan.", "**Huwag magsinungaling at huwag magpanggap.** Ang natuklasang kasinungalingan ay nagiging major finding.", "**Observation, non-conformity at major non-conformity** — alamin ang pagkakaiba at ang takdang panahon ng pagtugon."], "ref": "ISM Code Elements 12 at 13 — company verification, review and evaluation, at certification and periodical verification. Ang **SMC ay may bisang limang taon** na may intermediate verification.", "k": "Sabihin ang pagkakaiba ng observation, non-conformity at major non-conformity.", "u": "Ipaliwanag kung bakit mas mahalagang alam ng tripulante kung saan hahanapin ang pamamaraan kaysa kabisaduhin ito.", "p": "Pamunuan ang paghahanda sa isang internal audit: trail of evidence, tala at ang briefing ng tripulante.", "err": "Tinuruan ang tripulante ng sagot sa mga posibleng tanong. Nahalata ng auditor at naging mas malalim ang pagsusuri.", "stcw": "STCW Table A-II/2 — audit preparation and safety management verification."});
T.push({"id": "smsreview", "r": "ma", "g": "Inspections and Audits", "t": "Master's Review of the SMS", "lead": "Ang Master's review ay ang **tinig ng barko sa opisina**. Ito ang pagkakataong sabihin kung ano ang hindi gumagana sa totoong buhay.", "pts": ["Isagawa sa **itinakdang pagitan** ng SMS, karaniwang taun-taon o kapag may malaking pagbabago.", "**Tiyak at may ebidensiya**: aling pamamaraan ang mahirap sundin, saan at bakit.", "**Magmungkahi ng pagbabago**, huwag lang magreklamo; ilagay kung ano ang dapat na nakasulat.", "Isama ang **datos**: near miss, non-conformity, defect at ang mga natutunan sa drill.", "**Ipadala sa kumpanya at humingi ng tugon**; ang review na walang tugon ay sira ang siklo.", "**Sundan ang resulta** at ipaalam sa tripulante kung ano ang nagbago dahil sa kanilang ulat."], "ref": "ISM Code Element 5.1.5 — ang Master ay dapat **magsuri ng SMS at mag-ulat ng kakulangan nito sa shore-based management**. Element 12 naman ang pananagutan ng kumpanya na tumugon.", "k": "Sabihin kung ano ang dapat laman ng Master's review at kung gaano kadalas ito.", "u": "Ipaliwanag kung bakit nasisira ang tiwala ng tripulante kapag walang tugon ang kumpanya sa review.", "p": "Isulat ang isang buong Master's review na may datos, tiyak na kakulangan at panukalang pagbabago.", "err": "Isinulat na 'ang SMS ay sapat at mabisa'. Isang pangungusap, walang datos, at walang halaga sa audit.", "stcw": "STCW Table A-II/2 — safety management system review."});
T.push({"id": "collground", "r": "ma", "g": "Emergency Command", "t": "Collision and Grounding Response", "lead": "Pagkatapos ng banggaan o sadsad, ang **unang isang oras** ang nagpapasya kung maliligtas ang barko at kung paano titingnan ang Master sa imbestigasyon.", "pts": ["**Tao muna**: head count, sugatan, at ang kaligtasan ng tripulante bago ang anumang pagsusuri.", "**Huwag agad lumayo pagkatapos ng banggaan** kung ang ibang barko ang tumatagos; ito ang maaaring pumipigil sa pagbaha.", "**Suriin ang pinsala**: sounding ng lahat ng tangke at bodega, at ihambing sa dating tala.", "**Damage stability at longitudinal strength** — maaaring mas mapanganib ang bali kaysa sa pagbaha.", "Sa sadsad, **huwag basta umurong**; maaaring ito ang magpapalala ng pinsala at ng pagtagas.", "**Agad na pag-uulat**: coastal State, kumpanya, Flag, Class at P&I. **Pangalagaan ang VDR data agad.**"], "ref": "SOLAS V/31 at V/33 para sa danger messages at obligasyon ng pagtulong, at MARPOL Protocol I para sa pag-uulat ng insidente. Ang **VDR data ay dapat mapangalagaan** bago ito ma-overwrite.", "k": "Ilista ang pagkakasunod ng iyong aksiyon sa unang isang oras pagkatapos ng sadsad.", "u": "Ipaliwanag kung bakit maaaring mas mapanganib ang pag-urong sa sadsad kaysa sa paghinto muna.", "p": "Pamunuan ang isang grounding scenario sa simulator mula sa unang tugon hanggang sa unang ulat.", "err": "Na-overwrite ang VDR dahil walang nag-save. Nawala ang pinakamahusay na katibayan para sa barko mismo.", "stcw": "STCW Table A-II/2 — respond to emergencies; damage control."});
T.push({"id": "fireexp", "r": "ma", "g": "Emergency Command", "t": "Fire and Explosion Command", "lead": "Ang trabaho ng Master sa sunog ay **hindi pumasok sa apoy**. Ito ay **pamunuan ang laban** mula sa isang lugar kung saan nakikita niya ang buong larawan.", "pts": ["**Alarma, head count at boundary** bago ang anumang pag-atake. Alamin kung may nawawala.", "**Putulin ang hangin at ang gatong**: damper, fan, fuel pump at quick-closing valve.", "**Boundary cooling** sa lahat ng gilid, sa itaas at sa ibaba ng lugar; dito napipigilan ang paglaganap.", "**Isang BA team sa loob, isang handa sa labas**; magtakda ng oras ng paglabas at sundin ito.", "**Desisyon sa fixed system**: kailan ipapalabas, at sino ang nagpapatunay ng head count. Hindi ito maibabalik.", "**Pagbabago ng ruta at bilis** para ilagay ang apoy sa lee side at bawasan ang hangin na dumadaan dito."], "ref": "SOLAS Chapter II-2 at ang muster list sa SOLAS III/8. Ang **head count bago ang paglabas ng fixed gas** ay ang pinakamahalagang desisyon ng Master sa sunog sa machinery space.", "k": "Sabihin ang pagkakasunod ng utos mula sa alarma hanggang sa desisyon sa fixed system.", "u": "Ipaliwanag kung bakit kailangang nasa isang lugar ang Master na nakikita ang buong larawan, hindi sa loob ng laban.", "p": "Pamunuan ang isang malaking fire scenario: tugon, boundary, BA team at ang desisyon sa CO₂.", "err": "Pumasok ang Master sa laban at nawalan ng pamumuno ang buong barko. Walang nagdesisyon sa mas malaking tanong.", "stcw": "STCW Table A-II/2 — control emergency operations; fire fighting command."});
T.push({"id": "flood", "r": "ma", "g": "Emergency Command", "t": "Flooding and Loss of Stability", "lead": "Ang pagbaha ay nakamamatay **hindi dahil sa bigat kundi dahil sa free surface**. Ang barkong lumulubog ay kadalasang tumataob muna.", "pts": ["**Sounding ng lahat ng tangke at bodega** agad; ihambing sa huling tala para makita ang pumapasok.", "**Free surface effect** ang unang kaaway: ang kalahating puno ay mas mapanganib kaysa sa punong-puno.", "**Gamitin ang damage stability booklet at ang loading computer** sa damage condition, hindi sa intact.", "**Cross-flooding** kapag ito ay nasa disenyo; kung hindi, maaaring palalain ang list.", "**Huwag basta magdagdag ng tubig** para itama ang list; maaaring mawala ang natitirang GM.", "**Ihanda ang abandon ship** habang nilalabanan ang pagbaha; dalawang bagay ito nang sabay."], "ref": "SOLAS Chapter II-1 Part B-1 para sa damage stability at ang **damage control plan at booklet** na hinihingi ng SOLAS II-1/19.", "k": "Sabihin kung nasaan ang damage control plan at ano ang laman nito.", "u": "Ipaliwanag kung bakit mas mapanganib ang kalahating punong espasyo kaysa sa punong-puno.", "p": "Lutasin ang isang damage scenario gamit ang loading computer at magpasya tungkol sa counter-flooding.", "err": "Nagdagdag ng ballast sa kabilang gilid para itama ang list. Dumami ang free surface at lumala ang pagkiling.", "stcw": "STCW Table A-II/2 — maintain seaworthiness; damage control."});
T.push({"id": "mefail", "r": "ma", "g": "Emergency Command", "t": "Main Engine and Steering Failure", "lead": "Ang pagkawala ng makina o ng timon sa maling lugar ay **ilang minuto lang ang layo mula sa sadsad**. Ang bilis ng tugon ang lahat.", "pts": ["**Not Under Command signal** agad: dalawang pulang ilaw o dalawang bola, at ang pagtawag sa VHF.", "**Ihanda ang angkla** kapag may sapat na lalim at kapag malapit sa panganib.", "**Lumipat sa emergency steering** at magtalaga ng tauhan sa steering gear room na may komunikasyon.", "**Ipaalam sa VTS at sa mga nakapaligid na barko** ang iyong kalagayan at ang iyong iniisip na gagawin.", "**Tumawag ng tugboat nang maaga**, hindi kapag huli na; mas mura ang hindi ginamit na tug kaysa sa sadsad.", "**Gamitin ang natitirang momentum** para ilayo ang barko sa panganib habang may timon pa."], "ref": "COLREG Rules 3(f) at 27 para sa not under command, at SOLAS V/26 para sa steering gear at emergency steering.", "k": "Sabihin ang tamang ilaw at tanda ng not under command at ang unang limang hakbang mo.", "u": "Ipaliwanag kung bakit mas maaga dapat tumawag ng tugboat kaysa sa tila kailangan.", "p": "Pamunuan ang isang blackout scenario malapit sa baybayin: senyas, angkla, tug at komunikasyon.", "err": "Hinintay ang ulat ng engine room bago nag-ulat sa VTS. Nawala ang limang minutong maaaring nakaligtas sa barko.", "stcw": "STCW Table A-II/2 — respond to emergencies; loss of propulsion and steering."});
T.push({"id": "absdec", "r": "ma", "g": "Emergency Command", "t": "Abandon Ship Decision", "lead": "Ito ang **pinakamabigat na desisyon** ng Master. Masyadong maaga ay sayang; masyadong huli ay nakamamatay.", "pts": ["Ang barko ay **mas ligtas kaysa sa lifeboat** hangga't maaari itong lumutang at magbigay ng silong.", "Iwanan ang barko kapag **wala nang maaasahang pag-asa** na mapanatili itong lumulutang o ligtas.", "**Magpasya habang may sapat pang oras** para sa maayos na pagbaba; ang panic na paglulunsad ang pumapatay.", "**Distress alert bago, hindi pagkatapos**: DSC, EPIRB, SART at ang posisyon.", "**Kumpletong head count sa muster station** at ang pagdadala ng tubig, radyo at gamot.", "**Magpasya nang malinaw at ipahayag nang malinaw.** Ang pag-aalinlangan ng Master ay dumadaloy sa buong tripulante."], "ref": "SOLAS Chapter III at ang IAMSAR Manual. Ang desisyon ay **tanging sa Master**, at ang kanyang **overriding authority** sa ilalim ng ISM Code Element 5 ang pundasyon nito.", "k": "Sabihin ang pagkakasunod mula sa distress alert hanggang sa paglulunsad ng survival craft.", "u": "Ipaliwanag kung bakit mas ligtas manatili sa barko hangga't maaari.", "p": "Pamunuan ang isang abandon ship decision sa simulator at ipaliwanag ang bawat batayan ng iyong desisyon.", "err": "Naghintay ng utos mula sa opisina. Walang nasa opisina ang nakakakita ng barko; ang Master lang ang makakapagpasya.", "stcw": "STCW Table A-II/2 — organise and manage abandon ship."});
T.push({"id": "sarpob", "r": "ma", "g": "Emergency Command", "t": "SAR and Person Overboard", "lead": "Ang pagtulong sa nanganganib sa dagat ay **obligasyon, hindi pagpili**. At sa pagsagot, maaaring ikaw ang On-Scene Coordinator.", "pts": ["**SOLAS V/33**: ang Master ay dapat tumugon sa distress hangga't kaya niyang gawin nang ligtas.", "**On-Scene Coordinator** ang unang dumating hangga't walang itinalaga ang RCC; mag-organisa, huwag maghintay.", "**Search pattern**: expanding square, sector search o parallel track; pumili ayon sa datos at sa dami ng barko.", "**Datum at drift**: kalkulahin ang lipat dahil sa hangin at agos mula nang mangyari ang insidente.", "**Recovery plan**: SOLAS III/17-1 ay humihingi ng plano at pamamaraan para makabawi ng tao mula sa tubig.", "**Hypothermia**: ihanda ang init, ang kumot at ang unang lunas bago pa dumating ang biktima."], "ref": "SOLAS V/33 at Chapter V Regulation 7, kasama ang **IAMSAR Manual Volume III** na dapat nasa bridge. Ang SOLAS III/17-1 ang humihingi ng **ship-specific recovery plan**.", "k": "Sabihin ang mga search pattern at kung kailan ginagamit ang bawat isa.", "u": "Ipaliwanag ang tungkulin ng On-Scene Coordinator at kung kailan ito nagsisimula.", "p": "Pamunuan ang isang SAR scenario bilang OSC: datum, pattern, komunikasyon at recovery.", "err": "Naghintay ng utos mula sa RCC bago nagsimulang maghanap. Lumalaki ang search area tuwing lumilipas ang oras.", "stcw": "STCW Table A-II/2 — co-ordinate search and rescue operations."});
T.push({"id": "pollinc", "r": "ma", "g": "Emergency Command", "t": "Pollution Incident Command", "lead": "Sa pagtagas, **hindi ang dami ang nagpapasya sa bigat ng kaso** kundi ang katapatan at ang bilis ng pag-uulat.", "pts": ["**Itigil ang pinagmumulan** at pigilan ang paglaganap bago ang anumang paglilinis.", "**Agad na pag-uulat sa coastal State** at sa lahat ng nasa SOPEP contact list, kahit maliit ang tagas.", "**Huwag maglinis nang walang pahintulot** at huwag kailanman maghugas papuntang dagat.", "**Itala at litratuhan ang lahat**: oras, dami, lugar, panahon at ang bawat hakbang na ginawa.", "**Pangalagaan ang katibayan**: tangke sounding, Oil Record Book, alarm printout at ang mga sample.", "**Abugado at P&I agad.** Sa maraming bansa, ang pagtagas ay usaping kriminal at maaaring makulong ang Master."], "ref": "MARPOL Annex I Regulations 37 at ang **Protocol I** tungkol sa pag-uulat ng insidenteng kinasasangkutan ng mapaminsalang sustansiya. Ang pag-uulat ay obligasyon, hindi opsiyon.", "k": "Sabihin kung sino ang unang tatawagan at anong datos ang dapat nasa unang ulat.", "u": "Ipaliwanag kung bakit mas mabigat ang pagtatago kaysa sa pagtagas mismo sa mata ng korte.", "p": "Pamunuan ang isang oil spill response: pagtigil, pag-uulat, pagpigil at ang pagtatala ng katibayan.", "err": "Inayos muna ang lahat bago nag-ulat para 'malinis' ang ulat. Ito ang nagpapalit ng insidente tungo sa krimen.", "stcw": "STCW Table A-II/2 — prevent, control and respond to pollution incidents."});
T.push({"id": "emgcomm", "r": "ma", "g": "Emergency Command", "t": "Emergency Communications and Reporting", "lead": "Sa emerhensiya, **ang tamang mensahe sa tamang tao sa tamang oras** ay kasinghalaga ng aksiyon mismo.", "pts": ["**Distress, Urgency at Safety**: Mayday, Pan-Pan at Securite. Alamin kung alin ang akma.", "**DSC alert muna, tapos ang voice** sa Channel 16 o sa kaukulang frequency.", "**Nilalaman**: pagkakakilanlan, posisyon, uri ng emerhensiya, tulong na kailangan at bilang ng tao.", "**Ulat sa kumpanya, Flag, Class, P&I at charterer** — magkakaiba ang kailangan ng bawat isa.", "**Isang tinig lang sa labas.** Magtalaga ng isang taong mag-uulat para hindi magkasalungatan.", "**Magtala ng bawat mensahe**: oras, kanino, at ang eksaktong nilalaman."], "ref": "SOLAS Chapter IV para sa GMDSS at ang **IAMSAR Manual** para sa porma ng ulat. Ang distress ay may **priority sa lahat ng iba pang komunikasyon**.", "k": "Sabihin ang pagkakaiba ng Mayday, Pan-Pan at Securite at kung kailan gagamitin.", "u": "Ipaliwanag kung bakit mapanganib ang maraming nag-uulat nang sabay sa labas ng barko.", "p": "Magpadala ng kumpletong distress at follow-up report sa drill at itala ang buong palitan.", "err": "Nag-ulat ang Chief Engineer sa opisina at ang Master sa Flag, magkaiba ang sinabi. Nawala ang kredibilidad ng barko.", "stcw": "STCW Table A-II/2 — use of GMDSS and emergency reporting."});
T.push({"id": "offlog", "r": "ma", "g": "Ship Administration", "t": "Official Logbook", "lead": "Ang **Official Logbook** ay hinihingi ng Flag State at may **bisang legal**. Iba ito sa deck logbook.", "pts": ["Nakatala rito ang **kapanganakan, kamatayan, kasal, disiplina, drill, inspeksiyon at mga pangunahing pangyayari**.", "Itala ang **load line at draft sa pag-alis** at ang mga pagsusuri na hinihingi ng Flag.", "**Walang burahan at walang pahinang pinunit.** Isang guhit lang sa mali, isulat ang tama, at lagdaan.", "May mga entry na **hinihinging may saksi**; sundin ang itinakda ng iyong Flag State.", "**Pirma ng Master** at, kung kailangan, ng isa pang opisyal o ng crew member na kasangkot.", "**Itago ayon sa itinakdang panahon** at ibigay sa kinauukulan kapag hiniling nang may tamang awtoridad."], "ref": "Ang nilalaman ng Official Logbook ay itinatakda ng **batas ng Flag State** at tinutukoy ng maraming kombensiyon, kabilang ang MLC 2006 para sa disiplina at repatriation.", "k": "Sabihin ang mga pangyayaring dapat itala sa Official Logbook sa ilalim ng iyong Flag.", "u": "Ipaliwanag kung bakit nagiging walang halaga ang buong logbook kapag may isang binurang entry.", "p": "Isulat ang tamang entry para sa isang disciplinary hearing at para sa isang drill na hindi natapos.", "err": "Isinulat sa deck log ang dapat nasa Official Logbook. Sa korte, ang maling libro ay pumapantay sa walang tala.", "stcw": "STCW Table A-II/2 — statutory records and documentation."});
T.push({"id": "crewdocs", "r": "ma", "g": "Ship Administration", "t": "Crew Documents and Certifications", "lead": "Ang barko ay hindi makaaalis kung ang tripulante ay **walang wastong sertipiko**. Pananagutan ng Master na masuri ito bago umalis.", "pts": ["Itugma ang tripulante sa **Minimum Safe Manning Document**: bilang, ranggo at sertipiko.", "Suriin ang **Certificate of Competency at ang endorsement ng Flag State** ng barko, hindi lang ng sariling bansa.", "**Mandatory courses**: basic safety, advanced fire fighting, survival craft, medical at ang mga espesyal ayon sa uri ng barko.", "**Medical certificate** na wasto, at ang **passport, seaman's book at visa** na hindi malapit nang mag-expire.", "**Suriin pagsakay, hindi sa araw ng pag-alis.** Ang kulang na sertipiko ay maaaring maging detention.", "**Magtago ng tracker ng expiry** at ipaalam sa kumpanya anim na buwan bago mag-expire."], "ref": "STCW Regulation I/2 at I/10 — recognition of certificates. Ang **flag endorsement** ay hinihingi kapag ang sertipiko ay ibinigay ng ibang bansa. SOLAS V/14 ang manning requirement.", "k": "Sabihin kung ano ang sinusuri sa sertipiko ng isang bagong sakay na opisyal.", "u": "Ipaliwanag kung bakit hindi sapat ang sertipiko ng sariling bansa nang walang flag endorsement.", "p": "Magsagawa ng buong crew certificate audit laban sa Safe Manning Document at maghanda ng tracker.", "err": "Nag-expire ang endorsement habang nasa dagat. Nagkulang ang manning at na-detain ang barko sa susunod na daungan.", "stcw": "STCW Table A-II/2 — crew certification and manning compliance."});
T.push({"id": "mlchours", "r": "ma", "g": "Ship Administration", "t": "MLC Working and Rest Hours", "lead": "Ang pagod ay sanhi ng aksidente. Ang rest hours ay **hindi papel lang** — ito ang kaligtasan ng barko.", "pts": ["**Hindi bababa sa sampung oras na pahinga sa bawat dalawampu't apat na oras**, at **pitumpu't pitong oras sa bawat pitong araw**.", "Ang pahinga ay maaaring **hatiin sa dalawang bahagi lamang**, at ang isa rito ay **hindi bababa sa anim na oras**.", "Hindi dapat lalampas sa **labing-apat na oras** ang pagitan ng dalawang panahon ng pahinga.", "**Ang drill ay dapat ayusin** para hindi maputol ang pahinga hangga't maaari, at kung naputol, may bawing pahinga.", "**Itala ang totoo.** Ang pinalamutian na rest hour record ay isa sa pinakamadalas na natutuklasan sa PSC.", "Kapag **hindi maiiwasan ang paglabag**, itala ito at ang dahilan, at ayusin ang iskedyul."], "ref": "MLC 2006 Standard A2.3 at STCW Code Section A-VIII/1 — hours of rest. Ang **exception ay dapat sa pamamagitan ng collective agreement** at hindi lumalampas sa itinakdang hangganan.", "k": "Sabihin ang hangganan ng rest hours sa bawat dalawampu't apat na oras at sa bawat linggo.", "u": "Ipaliwanag kung bakit mas mapanganib ang maling tala kaysa sa inamin na paglabag.", "p": "Suriin ang isang buwang rest hour record ng tripulante, tukuyin ang paglabag, at mag-ayos ng iskedyul.", "err": "Binago ang tala para maging kaaya-aya. Hindi tugma sa bell book at sa drill record, at nakita ito ng inspektor.", "stcw": "STCW Table A-II/2 — fatigue management and compliance with rest hour requirements."});

const RK = { to:["THIRD OFFICER","to"], so:["SECOND OFFICER","so"], co:["CHIEF OFFICER","co"], ma:["MASTER","ma"] };
let cur = null;
const $ = i => document.getElementById(i);
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
function b(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); }
function renderList(f){
  const q = (f || "").toLowerCase().trim();
  let h = "";
  for(const r of ["to", "so", "co", "ma"]){
    const items = T.filter(t => t.r === r && (!q || (t.t + " " + t.g + " " + t.lead).toLowerCase().includes(q)));
    if(!items.length) continue;
    h += `<div class="rk ${RK[r][1]}">${RK[r][0]} · ${items.length}</div>`;
    let g = "";
    for(const t of items){ if(t.g !== g){ g = t.g; h += `<div class="rk" style="color:#7d929c;letter-spacing:.1em;padding:9px 10px 3px">${esc(g)}</div>`; }
      h += `<button class="tp ${cur === t.id ? "on" : ""}" data-id="${t.id}">${esc(t.t)}</button>`; }
  }
  $("list").innerHTML = h || `<div class="empty">Walang tugma.</div>`;
  $("list").querySelectorAll(".tp").forEach(e => e.onclick = () => open(e.dataset.id));
  $("cnt").textContent = T.length + " TOPICS";
}
function open(id){
  const t = T.find(x => x.id === id); if(!t) return;
  cur = id; location.hash = id;
  $("doc").innerHTML = `
    <h1>${esc(t.t)}</h1>
    <p class="kick">${RK[t.r][0]} · ${esc(t.g)}</p>
    <p class="lead">${b(t.lead)}</p>
    <h3>WHAT IT COVERS</h3><ul>${t.pts.map(p => `<li>${b(p)}</li>`).join("")}</ul>
    ${t.ref ? `<div class="ref">${b(t.ref)}</div>` : ""}
    <h3>KNOWLEDGE · UNDERSTANDING · PROFICIENCY</h3>
    <div class="kup">
      <div class="kc"><h4>K · KNOWLEDGE</h4><p>${b(t.k)}</p></div>
      <div class="kc u"><h4>U · UNDERSTANDING</h4><p>${b(t.u)}</p></div>
      <div class="kc p"><h4>P · PROFICIENCY</h4><p>${b(t.p)}</p></div>
    </div>
    ${t.err ? `<div class="watch">${b(t.err)}</div>` : ""}
    ${t.stcw ? `<h3>COMPETENCE</h3><p style="font-size:14.3px;color:#cfdde3;max-width:70ch">${b(t.stcw)}</p>` : ""}`;
  $("doc").scrollTop = 0; renderList($("q").value);
}
$("q").oninput = () => renderList($("q").value);
renderList("");
function fromHash(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(h && h !== cur && T.find(x => x.id === h)){ open(h); return true; }
  return false;
}
window.addEventListener("hashchange", fromHash);
if(!fromHash() && T.length) open(T[0].id);
</script></body></html>
