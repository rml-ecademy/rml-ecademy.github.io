T.push({"id": "fatigue", "r": "ma", "g": "Leadership", "t": "Fatigue and Workload Management", "lead": "Ang pagod ay **panganib sa kaligtasan**, hindi kahinaan. Ang pamamahala nito ay tungkulin ng Master.", "pts": ["**Minimum rest**: 10 oras sa bawat 24 oras at 77 oras sa bawat 7 araw.", "Ang 10 oras ay maaaring hatiin sa **dalawa lamang**, at ang isa ay dapat **hindi bababa sa 6 na oras**.", "Ang **record of rest hours** ay totoo; ang pinalamutian ay paglabag at nagtatago ng panganib.", "Tukuyin ang **mabibigat na araw**: port call, inspection, bunkering at masamang panahon.", "**Baguhin ang plano** kaysa pilitin ang pagod na koponan.", "Ang **senyales ng pagod** ay mabagal na reaksyon, maling pagbasa at pagkamaikli ng pasensya."], "ref": "STCW Code Section A-VIII/1 at MLC 2006 Standard A2.3. Ang record of hours of work or rest ay sapilitan at inspeksyonado ng PSC.", "k": "Sabihin ang minimum rest hours at kung paano ito maaaring hatiin.", "u": "Ipaliwanag kung bakit mas mapanganib ang maling rest record kaysa sa aminin ang kakulangan ng tao.", "p": "Suriin ang rest hour record ng isang linggo, tukuyin ang paglabag, at mag-ayos ng bagong plano.", "err": "Pinalamutian ang rest hours para pumasa sa inspeksyon. Itinatago nito ang tunay na panganib at paglabag sa MLC.", "stcw": "STCW Table A-II/2 — fitness for duty and fatigue management."});
T.push({"id": "culture", "r": "ma", "g": "Leadership", "t": "Cultural Awareness", "lead": "Sa barkong may iba't ibang lahi, ang **hindi pagkakaunawaan** ay madalas hindi sa wika kundi sa kultura.", "pts": ["**Power distance**: may kulturang hindi kumukontra sa nakatataas kahit may nakikitang mali.", "**Direct at indirect**: may nagsasabi nang tuwiran, may nagpapahiwatig lamang.", "**Oo** ay hindi laging pagsang-ayon; minsan ito ay 'narinig ko'.", "Gumamit ng **closed-loop communication**: ulitin ang utos pabalik.", "Igalang ang **pananampalataya at pagkain**; madali itong ayusin at malaki ang epekto sa moral.", "Ang **working language** ay kailangang malinaw sa lahat, at nakatala."], "ref": "SOLAS V/14.3 — ang working language ay itinatakda at naitatala sa log book. Ang Bridge Resource Management ay tumatalakay sa cultural barriers.", "k": "Ilarawan kung paano makikita ang power distance sa tulay.", "u": "Ipaliwanag kung bakit mapanganib ang pag-asa sa 'oo' nang walang read-back.", "p": "Magsagawa ng briefing gamit ang closed-loop communication at suriin kung naunawaan talaga.", "stcw": "STCW Table A-II/2 — effective communication on board."});
T.push({"id": "motiv", "r": "ma", "g": "Leadership", "t": "Crew Motivation and Discipline", "lead": "Ang moral ay **gawa, hindi suwerte**. Ang disiplina ay para sa kaligtasan, hindi para sa parusa.", "pts": ["**Pagkain, tulog at internet** ang tatlong pinakamalaking tunay na dahilan ng moral.", "**Patas na pagtatalaga** ng mabibigat at mababaw na gawain.", "**Kilalanin ang mabuting gawa** sa harap ng iba, nang tiyak at hindi pangkalahatan.", "Ang **disiplina ay nakatakda**: babala, nakasulat na babala, at pormal na hakbang.", "**Pare-pareho** sa lahat; ang paborito ang pumapatay ng moral.", "**Itala** ang bawat hakbang; kailangan ito kapag umabot sa dismissal."], "ref": "MLC 2006 at ang company disciplinary procedure. Ang hindi makatarungang parusa ay maaaring maging reklamo sa flag o sa labour authority.", "k": "Sabihin ang hakbang ng disciplinary procedure ng iyong kumpanya.", "u": "Ipaliwanag kung bakit mas mabisa ang pare-parehong pamantayan kaysa sa mabigat na parusa.", "p": "Pamunuan ang isang pormal na babala, kasama ang pagsulat, ang usapan at ang follow-up.", "stcw": "STCW Table A-II/2 — personnel management."});
T.push({"id": "mpx", "r": "ma", "g": "Leadership", "t": "Master–Pilot Relationship", "lead": "Ang pilot ay **tagapayo na may lokal na kaalaman**. Ang Master pa rin ang **nananagot** sa barko.", "pts": ["**Master–Pilot Exchange** bago ang maniobra: plano, limitasyon ng barko, tug at berthing.", "Ibigay ang **pilot card** na tumpak at napapanahon.", "Ang **pilot ay hindi pumapalit sa bridge team**; nananatili ang watchkeeping at ang monitoring.", "**Magsalita** kapag may nakitang panganib; gamitin ang malinaw na pananalita.", "Kapag hindi ligtas ang maniobra, **kunin ang kontrol** at itala.", "**Itala** ang oras ng pagsakay at pagbaba ng pilot at ang mga pangunahing utos."], "ref": "SOLAS V/34-1 — ang Master ay hindi pinipigilan ng sinuman sa paggawa ng desisyon para sa kaligtasan. IMO Resolution A.960 ang gabay sa Master-Pilot exchange.", "k": "Ilista ang laman ng Master–Pilot Exchange at ng pilot card.", "u": "Ipaliwanag kung bakit nananatili ang pananagutan ng Master kahit may pilot sa tulay.", "p": "Isagawa ang isang Master–Pilot Exchange, subaybayan ang maniobra, at magsalita sa isang pagkakataong lumihis sa plano.", "err": "Tahimik na pinanood ang maling maniobra dahil 'pilot naman ang nagpapatakbo'. Ang Master pa rin ang mananagot.", "stcw": "STCW Table A-II/2 — Master–Pilot relationship; bridge resource management."});
T.push({"id": "challenge", "r": "ma", "g": "Leadership", "t": "Challenge-and-Response Culture", "lead": "Ang pinakamagandang depensa sa pagkakamali ay ang **kasamang handang magsalita**.", "pts": ["Sabihin sa briefing na **inaasahan ang pagtatanong**, at tuparin ito.", "Gumamit ng **nakatakdang pananalita**: 'Kapitan, nag-aalala ako dahil…'.", "**Two-challenge rule**: kung dalawang beses nang nagtanong at walang sagot, kumilos para sa kaligtasan.", "**Pasalamatan ang nagtanong** kahit mali siya; kapag hindi, huling tanong na iyon.", "Ang **junior at ratings** ay kailangang maramdaman na kasali rin sila.", "Pagkatapos ng maniobra, **tanungin kung may napansing mali** at talakayin nang walang sisihan."], "ref": "Bridge Resource Management at ang STCW Code A-VIII/2 sa bridge teamwork. Ang maraming aksidente ay may saksing nakakita ngunit hindi nagsalita.", "k": "Bigkasin ang nakatakdang pananalita sa pagtatanong at ipaliwanag ang two-challenge rule.", "u": "Ipaliwanag kung bakit nananahimik ang koponan kahit nakikita nila ang panganib.", "p": "Magsagawa ng briefing na hayagang naghihikayat ng pagtatanong, at magbigay ng positibong tugon sa isang tanong.", "stcw": "STCW Table A-II/2 — bridge resource management."});
T.push({"id": "planreview", "r": "ma", "g": "Command Decisions", "t": "Passage Plan Review and Approval", "lead": "Ang passage plan ay ginagawa ng Second Officer pero **inaaprubahan ng Master**. Ang pirma ay pananagutan.", "pts": ["Suriin ang **appraisal**: lahat ba ng chart, publication at impormasyon ay nagamit.", "Suriin ang **UKC sa bawat kritikal na bahagi**, hindi lang sa pinakamababaw.", "Suriin ang **no-go area, abort point at point of no return**.", "Suriin ang **contingency**: anchorage, ligtas na lugar at alternatibong ruta.", "Tiyaking **berth to berth**, kasama ang pilotage at ang paglapit.", "**Ipaliwanag ang plano sa buong bridge team** bago umalis, hindi ipadala lang."], "ref": "SOLAS V/34 at IMO Resolution A.893(21) — Guidelines for voyage planning. Ang plano ay berth to berth.", "k": "Ilista ang apat na yugto ng passage planning at kung ano ang sakop ng bawat isa.", "u": "Ipaliwanag kung bakit kailangan ang abort point bago pa pumasok sa makitid na daanan.", "p": "Suriin at aprubahan ang isang buong passage plan at pamunuan ang briefing sa bridge team.", "err": "Pinirmahan ang plano nang hindi tinitingnan ang pilotage stage. Doon madalas nangyayari ang grounding.", "stcw": "STCW Table A-II/2 — plan a voyage and conduct navigation."});
T.push({"id": "restvis", "r": "ma", "g": "Command Decisions", "t": "Restricted Visibility Decisions", "lead": "Sa makapal na ulap, hindi nagiging ligtas ang barko dahil sa radar. Nagiging ligtas ito sa **tamang desisyon at bilis**.", "pts": ["**Safe speed** ayon sa Rule 6; ang kakayahang huminto sa loob ng nakikitang distansya.", "**Sound signals** ayon sa Rule 35 at ang mga agwat nito.", "**Dagdag na lookout** at manual steering.", "**Ipaalam sa engine room** at ihanda ang makina para sa maniobra.", "Rule 19: ang maagang pagbabago ay **huwag paikot pakaliwa** sa barkong nasa unahan ng beam, at **huwag palapit** sa barkong nasa beam o likod.", "**Itala** ang oras ng pagpasok sa ulap at ang bawat hakbang na ginawa."], "ref": "COLREGs Rules 5, 6, 19 at 35. Ang Rule 19 ay naiiba sa Rule 17; walang stand-on vessel sa restricted visibility.", "k": "Bigkasin ang tatlong pangunahing bahagi ng Rule 19 at ang karaniwang sound signals.", "u": "Ipaliwanag kung bakit walang stand-on vessel sa restricted visibility at kung ano ang ibig sabihin nito sa maniobra.", "p": "Pamunuan ang tulay sa pagpasok sa makapal na ulap, kasama ang briefing, ang pagbabago ng bilis at ang pagtatala.", "stcw": "STCW Table A-II/2 — maintain safe navigation; COLREGs."});
T.push({"id": "hwnav", "r": "ma", "g": "Command Decisions", "t": "Heavy Weather Navigation Decisions", "lead": "Sa bagyo, ang mga desisyon ay tungkol sa **pag-iwas, pagbabago ng ruta at pagbabago ng bilis**, hindi sa katapangan.", "pts": ["**Tropical revolving storm**: alamin ang dangerous semicircle at ang navigable semicircle.", "**1-2-3 rule** para sa forecast error ng bagyo sa 24, 48 at 72 oras.", "Iwasan ang **synchronous rolling** at ang **parametric rolling**; baguhin ang bilis o ang heading.", "**Broaching** ang panganib sa following sea; iwasan ang bilis na katugma ng alon.", "Ang **pagbabago ng ruta nang maaga** ay mas mura kaysa sa pinsala.", "**Itala ang dahilan** ng bawat desisyon; ito ang depensa sa performance claim."], "ref": "IMO MSC.1/Circ.1228 — Revised guidance to the master for avoiding dangerous situations. Ang karagatan ay may sariling storm warning service.", "k": "Ipaliwanag ang dangerous at navigable semicircle at ang 1-2-3 rule.", "u": "Ipaliwanag ang pagkakaiba ng synchronous at parametric rolling at ang lunas sa bawat isa.", "p": "Magplano ng pag-iwas sa isang tropical storm, kasama ang ruta, bilis at ang oras ng desisyon, at itala ang dahilan.", "stcw": "STCW Table A-II/2 — manoeuvre and handle a ship in all conditions."});
T.push({"id": "anchordec", "r": "ma", "g": "Command Decisions", "t": "Anchoring Decisions", "lead": "Ang pag-angkla ay mukhang simple hanggang sa **madulas ang angkla** sa hatinggabi at malakas ang hangin.", "pts": ["**Pumili ng lugar**: lalim, uri ng sahig, saklaw ng pag-ikot at kalapitan sa iba.", "**Scope**: karaniwang 5 hanggang 7 beses ng lalim sa katamtamang panahon, mas marami sa masama.", "**Pamamaraan**: walk back sa malalim na tubig; let go lamang sa mababaw at mahinang panahon.", "**Anchor watch**: tiyak na bearing, radar range at GPS anchor alarm.", "**Senyales ng pagdulas**: pagbabago ng bearing, pag-vibrate ng cable, at pagkawala ng tensyon.", "**Handa ang makina** sa maikling abiso kapag masama ang panahon."], "ref": "IACS UR A1 — ang anchoring equipment ay para sa temporary mooring sa harbour at protektadong lugar, hanggang 11 knots ng agos at 48 knots ng hangin sa magandang holding ground.", "k": "Kalkulahin ang kinakailangang scope para sa isang lalim at sabihin ang anchor watch procedure.", "u": "Ipaliwanag kung bakit hindi kayang hawakan ng anchor gear ang bagyo at ano ang dapat gawin bago ito dumating.", "p": "Pamunuan ang isang anchoring operation, magtalaga ng anchor watch, at magpasya kung kailan aalis sa anchorage.", "err": "Nanatili sa anchorage habang papalapit ang bagyo. Ang paglayo sa dagat ay halos palaging mas ligtas.", "stcw": "STCW Table A-II/2 — manoeuvre the ship; anchoring operations."});
T.push({"id": "colav", "r": "ma", "g": "Command Decisions", "t": "Collision Avoidance Oversight", "lead": "Ang trabaho ng Master ay hindi gumawa ng bawat pag-iwas kundi **tiyaking tama ang pamantayan** ng buong koponan.", "pts": ["Magtakda ng **CPA at TCPA limit** sa standing orders, ayon sa lugar at trapiko.", "**Maagang pagkilos at malaking pagbabago** ang mas ligtas kaysa sa maliit at huli.", "**Huwag umasa sa VHF agreement** para sa pag-iwas; sundin ang COLREGs.", "Suriin kung ang opisyal ay **nananatiling stand-on** nang masyadong matagal.", "Tiyaking **tama ang paggamit ng ARPA at AIS** at alam ang limitasyon nila.", "**Tawagin ako** ang pinakamahalagang bahagi ng standing orders; gawing malinaw kung kailan."], "ref": "COLREGs Rules 7, 8, 15, 16 at 17. Ang maraming banggaan ay nangyayari sa magandang panahon at sa maliwanag na araw.", "k": "Sabihin ang CPA at TCPA limit sa iyong standing orders at kung kailan tatawagin ang Master.", "u": "Ipaliwanag kung bakit mapanganib ang VHF agreement at kung bakit ipinagbabawal ng maraming kumpanya.", "p": "Suriin ang pag-iwas ng isang watch officer sa simulator at magbigay ng debrief na may tiyak na puna.", "stcw": "STCW Table A-II/2 — maintain safe navigation; COLREGs."});
T.push({"id": "standorders", "r": "ma", "g": "Command Decisions", "t": "Master's Standing and Night Orders", "lead": "Ang standing orders ay **permanente** at ang night orders ay **para sa gabing iyon**. Dalawa itong magkaibang kasulatan.", "pts": ["**Standing orders**: pangkalahatang pamantayan, CPA limit, kailan tatawagin, at paggamit ng equipment.", "**Night orders**: ang partikular na alalahanin para sa gabing iyon, ang ruta at ang panahon.", "Dapat **tiyak at masusukat**, hindi 'mag-ingat ka'.", "**Lagdaan ng bawat watch officer** bilang patunay na nabasa at naunawaan.", "I-update kapag **nagbago ang kondisyon**: lugar, trapiko, panahon o kagamitan.", "Ang pinakamahalagang linya: **tawagin ako kapag may duda, anuman ang oras**."], "ref": "STCW Code Section A-VIII/2 at SOLAS V/34-1. Ang standing orders ay bahagi ng SMS at sinusuri sa audit.", "k": "Sabihin ang pagkakaiba ng standing at night orders at kung sino ang pumipirma.", "u": "Ipaliwanag kung bakit walang silbi ang malabong utos gaya ng 'mag-ingat' sa isang imbestigasyon.", "p": "Sumulat ng standing orders at ng night orders para sa isang partikular na tawid, at ipaliwanag ang bawat limitasyon.", "err": "Pareho ang night orders sa bawat gabi. Hindi na ito binabasa at nawawalan ng halaga.", "stcw": "STCW Table A-II/2 — maintain a safe navigational watch; leadership."});
T.push({"id": "ffeport", "r": "to", "g": "Fire Fighting Equipment", "t": "Portable Fire Extinguishers", "lead": "Ang portable extinguisher ang **unang sandata** sa maliit na sunog. Walang silbi ito kung mali ang uri, kulang ang laman, o hindi marunong ang gagamit.", "pts": ["**CO₂** para sa electrical at sa likidong nasusunog. Walang residue, pero nawawalan ng bisa sa hangin at mapanganib sa saradong lugar.", "**Dry powder** para sa halos lahat ng uri; malakas pero maruming maglinis at pansamantala lang kung mainit pa ang bagay.", "**Foam** para sa likido; tinatakpan ang ibabaw para hindi makalanghap ng hangin. Huwag sa live electrical.", "**Water** para sa solidong materyal lamang. Huwag sa langis at sa kuryente.", "**Buwanang pagsusuri**: presyon, selyo, pin, hose, bigat, petsa ng huling serbisyo at madaling abutin ang lugar.", "**Taunang serbisyo** ng tauhang sanay, at **hydrostatic test** ayon sa gawa. Ang CO₂ ay **tinitimbang**, hindi binabasa sa gauge.", "Gamitin ang **PASS**: Pull, Aim sa base ng apoy, Squeeze, Sweep. Tumalikod nang hindi tinatalikuran ang apoy."], "ref": "SOLAS II-2/10.3 at FSS Code Chapter 4. Dapat may **spare charge o karagdagang extinguisher** para sa 100 porsiyento ng unang sampung extinguisher at 50 porsiyento ng iba pa, hindi hihigit sa animnapu.", "k": "Itugma ang uri ng extinguisher sa klase ng sunog at sabihin ang laman ng bawat isa.", "u": "Ipaliwanag kung bakit hindi sapat ang pressure gauge para sa CO₂ at kung bakit ito tinitimbang.", "p": "Magsagawa ng buwanang inspeksiyon ng isang extinguisher, timbangin ang CO₂, at itala ang resulta sa checklist.", "err": "Puno ang gauge pero kulang ang laman. Sa CO₂, ang **bigat lang** ang nagsasabi ng totoo. Kapag mas mababa ng sampung porsiyento sa nakatatak na bigat, kailangan na ng recharge.", "stcw": "STCW Table A-VI/3 — advanced fire fighting; use of fire-extinguishing equipment."});
T.push({"id": "ffehyd", "r": "to", "g": "Fire Fighting Equipment", "t": "Fire Hydrants, Hoses and Nozzles", "lead": "Ang fire main ang gulugod ng paglaban sa sunog. Dapat **anumang bahagi ng barko ay maaabot ng dalawang jet** mula sa dalawang magkaibang hydrant.", "pts": ["**Hydrant**: dapat madaling buksan, hindi kinakalawang at hindi nakaharang. Isang valve, isang hose.", "**Hose**: nakakabit na sa hydrant kasama ang nozzle sa loob ng accommodation at sa machinery space, handa agad.", "**Haba**: hindi hihigit sa labinlimang metro sa machinery space, dalawampung metro sa ibang espasyo, at dalawampu't limang metro sa bukas na kubyerta ng malalapad na barko.", "**Nozzle**: dual purpose, **jet at spray**. Ang spray ang pananggalang sa init; ang jet ang umaabot sa malayo.", "**Sukat ng nozzle**: labindalawa, labing-anim at labinsiyam na milimetro. Sa accommodation sapat na ang labindalawa.", "Suriin ang **gasket, coupling at hose para sa butas**; subukan nang may presyon, hindi lang tingnan."], "ref": "SOLAS II-2/10.2 at FSS Code Chapter 2. Ang fire main ay dapat may sapat na presyon sa pinakamalayong hydrant habang dalawang jet ang bukas.", "k": "Sabihin ang haba ng hose sa bawat espasyo at ang dalawang paraan ng paggamit ng nozzle.", "u": "Ipaliwanag kung kailan spray at kung kailan jet ang gagamitin, at kung bakit mas ligtas ang spray sa paglapit.", "p": "Maglatag ng hose mula sa hydrant, buksan ang presyon, at ipakita ang paglipat mula jet patungong spray.", "err": "Nakatiklop ang hose nang matagal sa iisang tupi hanggang pumutok ito sa unang presyon. Palitan ang tupi tuwing inspeksiyon.", "stcw": "STCW Table A-VI/3 — fire-fighting appliances and their location on board."});
T.push({"id": "ffepump", "r": "to", "g": "Fire Fighting Equipment", "t": "Fire Pumps and Emergency Fire Pump", "lead": "Walang tubig, walang laban. Ang **emergency fire pump** ang sagot kapag ang machinery space mismo ang nasusunog.", "pts": ["**Main fire pumps**: pinapaandar mula sa machinery space, nagbibigay ng presyon sa fire main.", "**Emergency fire pump**: nasa **labas ng machinery space**, may sariling makina at sariling panggatong, at may hiwalay na sea suction.", "Dapat kayang maghatid ng **dalawang jet** ang emergency pump sa kinakailangang presyon.", "Ang kapasidad nito ay hindi bababa sa **apatnapung porsiyento** ng kabuuang hinihingi sa mga fire pump.", "Kailangang **kayang paandarin kahit walang kuryente sa main switchboard** at sa malamig na kondisyon.", "**Lingguhang pagsubok** ng lahat ng pump; itala sa logbook. Suriin ang priming at ang sea chest."], "ref": "SOLAS II-2/10.2.2. Ang emergency fire pump, ang kanyang sea suction, ang panggatong at ang pinagmulan ng kuryente nito ay dapat **nasa labas ng espasyong pinagsisilbihan ng main fire pumps**.", "k": "Sabihin kung nasaan ang emergency fire pump sa iyong barko at kung paano ito pinapaandar.", "u": "Ipaliwanag kung bakit walang halaga ang emergency pump kung pareho ang pinanggagalingan ng kuryente nito at ng main pump.", "p": "Paandarin ang emergency fire pump nang mag-isa, abutin ang presyon sa pinakamalayong hydrant, at itala.", "err": "Sa PSC, hinihiling na paandarin ito **nang hindi gumagamit ng main power at nang hindi pumapasok sa engine room**. Doon maraming nabibigo.", "stcw": "STCW Table A-VI/3 — fire-fighting systems and their operation."});
T.push({"id": "ffeco2", "r": "to", "g": "Fire Fighting Equipment", "t": "Fixed CO₂ Fire-Extinguishing System", "lead": "Ang fixed CO₂ ang huling pananggalang sa machinery space. **Isang beses lang ito gagamitin** — walang pangalawang pagkakataon.", "pts": ["**Dalawang hiwalay na kontrol**: isa para buksan ang valve papunta sa espasyo, isa para palabasin ang gas. Hindi aksidenteng maaalpasan.", "**Alarma at pagkaantala** bago lumabas ang gas, para makalabas ang lahat ng tao.", "**Kumpletong head count bago ipalabas** — ito ang pinakamahalagang hakbang.", "**Isara ang lahat ng bukana**: dampers, skylight, pinto at ventilator. Patayin ang fan at ang fuel pump.", "Ang machinery space ay **hindi bubuksan hanggang lumamig** at hanggang hindi handa ang BA team; ang biglang hangin ay nagpapasiklab ulit.", "**Taunang inspeksiyon** ng hose, nozzle at pipe; **timbangin o suriin ang antas ng cylinder** sa itinakdang pagitan."], "ref": "SOLAS II-2/10.4 at FSS Code Chapter 5. Para sa machinery space, ang dami ng CO₂ ay sapat para sa bahaging itinakda ng gross volume at ang **walumpu't limang porsiyento ay dapat lumabas sa loob ng dalawang minuto**. Ang maintenance ay nasa MSC.1/Circ.1318.", "k": "Sabihin ang pagkakasunod ng paglabas ng CO₂ mula sa alarma hanggang sa pag-iwan ng espasyo.", "u": "Ipaliwanag kung bakit mas mapanganib ang maagang pagbubukas ng pinto kaysa sa paghihintay ng ilang oras.", "p": "Pamunuan ang isang CO₂ release drill nang walang tunay na paglabas: head count, pagsasara, alarma at pagtatala.", "err": "Nakalimutan ang isang ventilation damper. Umaalis ang gas, bumababa ang konsentrasyon, at buhay pa ang apoy.", "stcw": "STCW Table A-VI/3 — fixed fire-extinguishing installations."});
T.push({"id": "ffedet", "r": "to", "g": "Fire Fighting Equipment", "t": "Fire Detection and Alarm System", "lead": "Ang maagang pagtuklas ang pinakamurang paraan ng paglaban sa sunog. Ang panel sa bridge ang **mata ng barko**.", "pts": ["**Smoke detector** sa accommodation at sa daanan; **heat detector** sa galley at sa mainit na lugar; **flame detector** sa machinery space.", "**Manual call point** sa bawat labasan at sa daanan; alam ng lahat kung nasaan ang pinakamalapit.", "**Zone**: ang panel ay nagsasabi kung aling bahagi, hindi lang kung may sunog. Alamin ang mapa ng zone.", "Ang **fault alarm** ay dapat **kakaiba ang tunog** sa fire alarm, para hindi mapagkamalan.", "**Lingguhang pagsubok** ng isang seksiyon o detector; itala kung alin ang sinubukan.", "**Huwag i-isolate ang zone nang hindi nagpapaalam** at nang hindi nagtatala; kung na-isolate, maglagay ng fire watch."], "ref": "SOLAS II-2/7 at FSS Code Chapter 9. Ang sistema ay dapat may **dalawang pinagmulan ng kuryente**, isa rito ay emergency source, at dapat nagbibigay ng visual at audible na senyas sa bridge.", "k": "Basahin ang panel: zone, uri ng alarma at kung fault o fire ang ipinapakita.", "u": "Ipaliwanag kung bakit mapanganib ang nakasanayang pag-isolate ng zone dahil sa paulit-ulit na false alarm.", "p": "Magsagawa ng lingguhang pagsubok ng isang detector, itala, at ipaliwanag ang tugon sa isang tunay na alarma.", "err": "Na-isolate ang zone ng galley dahil maingay tuwing nagluluto, at hindi na naibalik. Doon nagsimula ang sunog.", "stcw": "STCW Table A-VI/3 — fire detection systems and alarms."});
T.push({"id": "ffedoor", "r": "to", "g": "Fire Fighting Equipment", "t": "Fire Doors and Self-Closing Devices", "lead": "Ang **structural fire protection** ang humahawak sa sunog sa isang lugar. Ang bukas na fire door ay butas sa pananggalang.", "pts": ["Ang mga **A-class at B-class division** ay humahadlang sa init at usok sa itinakdang bilang ng minuto.", "Ang fire door ay dapat **kusang sumasara**; bawal ang kalso, kable o gancho na pumipigil dito.", "May **remote release mula sa bridge** ang mga hold-open device na ikinakabit sa sistema.", "Suriin ang **gasket, hinge at latch**; dapat sumasara nang buong-buo at kumakapit.", "**Huwag butasan ang division** para sa kable o tubo nang walang tamang penetration seal.", "Subukang isara ang lahat ng fire door sa **bawat fire drill**, hindi lang sa inspeksiyon."], "ref": "SOLAS II-2/9 — fire integrity of bulkheads and decks. Ang mga pinto sa A-class division ay dapat **self-closing** at kayang isara laban sa dalawampu't limang digri na pagkiling.", "k": "Ituro ang mga fire door sa iyong accommodation at sabihin kung aling division ang binabantayan nila.", "u": "Ipaliwanag kung bakit kahit isang nakakalsong pinto ay sapat para kumalat ang usok sa buong tirahan.", "p": "Lakarin ang accommodation, suriin ang bawat fire door, at itama ang nakitang kalso o sirang closer.", "err": "Nakakalso ang pinto dahil maingay o mabigat. Sa gabi, ang usok ang unang pumapatay, hindi ang apoy.", "stcw": "STCW Table A-VI/3 — structural fire protection and containment."});
T.push({"id": "ffedamp", "r": "to", "g": "Fire Fighting Equipment", "t": "Fire Dampers and Ventilation Shutdowns", "lead": "Ang sunog ay nabubuhay sa hangin. Ang **pagputol ng bentilasyon** ang unang hakbang bago anumang pag-apula.", "pts": ["Ang **damper** ay nagsasara ng duct para hindi dumaan ang apoy at usok sa ibang espasyo.", "Ang **remote stop** ng fan ay nasa labas ng espasyong pinagsisilbihan nito; alamin kung nasaan.", "Bawat kontrol ay dapat **malinaw na nakamarka** kung aling espasyo at kung aling fan ang hinahawakan.", "Ang mga **galley exhaust duct** ay may sariling damper at kailangang **regular na linisin ang grasa**.", "Kasama sa machinery space shutdown ang **fan, fuel pump, purifier at quick-closing valve**.", "**Subukan ang damper nang pisikal** sa inspeksiyon; marami ang nakabara sa pintura o kalawang."], "ref": "SOLAS II-2/5.2 at II-2/9.7 — ventilation systems. Ang mga bukana ng bentilasyon ay dapat **maisasara mula sa labas** ng espasyong pinagsisilbihan nila.", "k": "Ituro ang remote stop at ang damper ng machinery space at ng galley sa iyong barko.", "u": "Ipaliwanag kung bakit walang bisa ang CO₂ kung may isang damper na bukas pa.", "p": "Isagawa ang buong ventilation shutdown ng machinery space sa drill at itala ang oras na inabot.", "err": "Tinatak lang ang damper na sinuri pero hindi pinaandar. Sa totoong sunog, hindi ito gumalaw.", "stcw": "STCW Table A-VI/3 — closing of openings and stopping of ventilation."});
T.push({"id": "ffeba", "r": "to", "g": "Fire Fighting Equipment", "t": "EEBD, SCBA and Fireman's Outfit", "lead": "Ang **EEBD ay pantakas lamang** at hindi panlaban sa sunog. Ang **SCBA** ang ginagamit sa pagpasok. Dalawang magkaibang kagamitan, dalawang magkaibang layunin.", "pts": ["**EEBD**: humigit-kumulang sampung minutong hangin, para lang makalabas. **Bawal gamitin sa paglaban sa sunog o sa pagpasok sa enclosed space.**", "Nasa accommodation at machinery space ang EEBD, **nakamarka at hindi nakaharang**, may tanda ng daan palabas.", "**SCBA**: cylinder na hindi bababa sa isanlibo't dalawandaang litro o tatlumpung minutong hangin; may **low-pressure warning whistle**.", "**Fireman's outfit**: protective clothing, boots at gloves na hindi kumukuryente, **matigas na helmet**, safety lamp na tatlong oras, **fire axe** at lifeline.", "Hindi bababa sa **dalawang set** ng fireman's outfit sa karaniwang cargo ship, nakatago sa **dalawang magkahiwalay na lugar**.", "**Suriin ang presyon buwan-buwan**; subukan ang face seal; itala ang petsa ng hydrostatic test ng cylinder."], "ref": "SOLAS II-2/10.10 at FSS Code Chapter 3. Ang EEBD ay sakop ng II-2/13 bilang **means of escape** — hindi ito fire-fighting equipment.", "k": "Sabihin ang pagkakaiba ng EEBD at SCBA at kung kailan gagamitin ang bawat isa.", "u": "Ipaliwanag kung bakit nakamamatay ang paggamit ng EEBD sa pagpasok sa enclosed space.", "p": "Isuot ang buong fireman's outfit at SCBA sa loob ng itinakdang oras, suriin ang presyon, at sumali sa BA team drill.", "err": "Ginamit ang EEBD para sumilip sa espasyong may usok. Sampung minuto lang ang hangin at walang babala kung kailan mauubos.", "stcw": "STCW Table A-VI/3 — breathing apparatus and personal equipment."});
T.push({"id": "ffeisc", "r": "to", "g": "Fire Fighting Equipment", "t": "International Shore Connection", "lead": "Kapag nasa daungan at wala nang presyon ang barko, ang **ISC** ang tanging paraan para makapagbigay ng tubig ang pantalan sa fire main.", "pts": ["**Isang pamantayang flange** na kasya sa anumang barko at anumang daungan sa mundo.", "Panlabas na diyametro **178 mm**, panloob na **64 mm**, bolt circle **132 mm**, apat na butas na **19 mm**.", "Kasama sa set: **apat na bolt, walong washer, apat na nut at isang gasket** na kayang tumagal sa presyon ng fire main.", "Dapat **itinatago sa magkabilang gilid at madaling abutin**, hindi nakakandado sa loob ng locker na nasa engine room.", "May **adaptor** sa gawi ng barko para ikabit sa sariling hydrant coupling.", "Suriin kung **kumpleto ang bolt at gasket** — madalas itong nawawala sa paglipas ng panahon."], "ref": "SOLAS II-2/10.2.1.7 at FSS Code Chapter 2 — hindi bababa sa isang international shore connection para sa barkong **500 gross tonnage pataas**.", "k": "Sabihin ang sukat ng ISC at kung ano ang dapat kasama sa set.", "u": "Ipaliwanag kung bakit kailangan ng iisang pamantayang sukat sa buong mundo.", "p": "Hanapin ang ISC sa barko, suriin ang kabuuan ng set, at ipakita kung saan ito ikakabit.", "err": "Nasa engine room locker ang ISC. Kapag nasusunog ang engine room, hindi na ito maaabot — doon lang ito kailangan.", "stcw": "STCW Table A-VI/3 — fire-fighting appliances and international shore connection."});
T.push({"id": "muster", "r": "to", "g": "Drills and Emergencies", "t": "Muster List and Emergency Duties", "lead": "Ang **muster list** ang nagsasabi kung sino ang gagawa ng ano sa emerhensiya. Walang iisipin, basahin lang at kilosin.", "pts": ["Nakasulat ang **alarm signal** ng bawat emerhensiya at kung saan ang muster station.", "**Bawat tao ay may pangalan at tiyak na tungkulin**, at may **kapalit** kung wala siya.", "Nakasaad ang tungkulin sa **pagsasara ng pinto, damper at valve**, at sa paghahanda ng survival craft.", "Dapat **nakapaskil sa bridge, sa engine control room at sa accommodation**, nakikita ng lahat.", "**Pirmado ng Master** at **ina-update bago umalis** kapag may nagbago sa tripulante.", "May sariling **cabin card** ang bawat tao: alarma, muster station, tungkulin at numero ng lifeboat."], "ref": "SOLAS III/8 at III/37 — ang muster list ay dapat **naihanda bago umalis ang barko**, at kung may nagbago sa tripulante, dapat itong baguhin o gumawa ng bago.", "k": "Hanapin ang sarili mong pangalan sa muster list at sabihin ang iyong tungkulin sa bawat uri ng alarma.", "u": "Ipaliwanag kung bakit kailangan ng kapalit sa bawat tungkulin at kung ano ang mangyayari kung wala.", "p": "I-update ang muster list pagkatapos ng crew change at ipaliwanag ang bagong tungkulin sa mga dumating.", "err": "Luma ang muster list at nakasulat pa ang pangalan ng umuwing tauhan. Sa PSC, agad itong deficiency.", "stcw": "STCW Table A-VI/1 — emergency procedures; muster and drills."});
T.push({"id": "absdrill", "r": "to", "g": "Drills and Emergencies", "t": "Abandon Ship Drill", "lead": "Hindi ang pag-iwan sa barko ang unang pagpipilian. Pero kapag kailangan na, **ang drill lang ang magpapabilis** ng lahat.", "pts": ["**Bawat tripulante ay dapat sumali sa abandon ship drill isang beses sa isang buwan.**", "Kung mahigit **dalawampu't limang porsiyento** ng tripulante ay bago, isagawa ang drill **sa loob ng dalawampu't apat na oras** mula sa pag-alis.", "Kasama sa drill: pagtawag sa muster station, head count, pagsusuot ng **lifejacket at immersion suit**, at pagpapaandar ng makina ng lifeboat.", "Ang **lifeboat ay dapat ibaba at patakbuhin sa tubig nang hindi bababa sa isang beses kada tatlong buwan**.", "Ang **rescue boat ay ibinababa buwan-buwan** hangga't maaari.", "Para sa **free-fall lifeboat**, may **simulated launching** at tunay na paglulunsad ayon sa itinakdang pagitan."], "ref": "SOLAS III/19.3 — drills. Ang bawat drill ay dapat **isagawa na parang totoong emerhensiya** hangga't maaari.", "k": "Sabihin ang dalas ng abandon ship drill at ang dalas ng paglulunsad ng lifeboat sa tubig.", "u": "Ipaliwanag kung bakit may panuntunan tungkol sa dalawampu't limang porsiyentong bagong tripulante.", "p": "Pamunuan ang isang abandon ship drill: alarma, muster, head count, kagamitan at debrief.", "err": "Paulit-ulit ang parehong senaryo at parehong davit. Ibahin ang oras, ang gabi, at ang lugar ng sunog.", "stcw": "STCW Table A-VI/1 — survival techniques; abandon ship procedures."});
T.push({"id": "firedrill", "r": "to", "g": "Drills and Emergencies", "t": "Fire Drill", "lead": "Ang fire drill ay hindi palabas para sa logbook. Ito ang **tanging pagsasanay** bago ang totoong sunog.", "pts": ["**Isang beses sa isang buwan** para sa bawat tripulante, kasabay ng abandon ship drill kung nararapat.", "**Ibahin ang senaryo**: galley, engine room, cargo hold, paint locker, cabin sa gabi, at sa daungan.", "Subukan ang **tunay na kagamitan**: fire pump, emergency pump, hose, BA set at fire doors.", "**Suriin ang oras**: gaano katagal bago nabuo ang BA team at bago nagkaroon ng tubig sa lugar.", "**Tawagin ang head count** at ang boundary cooling, hindi lang ang pag-apula.", "**Debrief pagkatapos**: isang bagay na mahusay, isang bagay na dapat ayusin, at sino ang gagawa."], "ref": "SOLAS III/19.3.4 — kasama sa fire drill ang pag-uulat sa muster station, pagpapaandar ng fire pump, pagsusuri ng kagamitan ng fireman at ng **means of communication**.", "k": "Sabihin ang mga bahagi ng isang kumpletong fire drill at ang dalas nito.", "u": "Ipaliwanag kung bakit mas mahalaga ang oras ng pagbuo ng BA team kaysa sa oras ng pag-apula.", "p": "Magdisenyo at pamunuan ang isang fire drill sa bagong lugar, sukatin ang oras, at magbigay ng debrief.", "err": "Laging alas-diyes ng umaga at laging sa parehong lugar. Alam na ng lahat ang mangyayari, kaya walang natututunan.", "stcw": "STCW Table A-VI/1 at A-VI/3 — fire prevention and fire fighting."});
T.push({"id": "encdrill", "r": "to", "g": "Drills and Emergencies", "t": "Enclosed Space Entry and Rescue Drill", "lead": "Karamihan sa namamatay sa enclosed space ay **hindi ang unang pumasok kundi ang sumaklolo**. Doon papasok ang drill.", "pts": ["**Isagawa ang enclosed space entry at rescue drill nang hindi bababa sa bawat dalawang buwan.**", "Kasama sa drill: **pagsusuri sa permit, pagsubok ng atmospera, komunikasyon at harness**.", "**Pagsasanay sa paglabas ng biktima** gamit ang rescue harness, tripod at stretcher sa makitid na bukana.", "**Walang pumapasok nang walang permit** at walang nag-iisang pumapasok; may bantay sa labas lagi.", "Ang **sumasaklolo ay nagsusuot ng SCBA**, hindi EEBD; ang EEBD ay pantakas lamang.", "Subukan ang **tunay na komunikasyon** mula sa loob ng tangke papuntang bridge, hindi lang ipinalagay."], "ref": "SOLAS III/19.3.6 — enclosed space entry and rescue drills, hindi bababa sa isang beses kada dalawang buwan. Tingnan din ang IMO Resolution A.1050(27).", "k": "Sabihin ang dalas ng drill at ang mga gas na sinusuri bago pumasok.", "u": "Ipaliwanag kung bakit mas marami ang namamatay sa pagsaklolo kaysa sa unang pagpasok.", "p": "Pamunuan ang isang rescue drill: permit, gas test, harness, paglabas ng biktima at first aid.", "err": "Nakita ang nahandusay na kasama at agad tumalon sa loob. Dalawa na ang biktima sa loob ng tatlumpung segundo.", "stcw": "STCW Table A-VI/1 — enclosed space entry and rescue."});
T.push({"id": "mobresp", "r": "to", "g": "Drills and Emergencies", "t": "Man Overboard Response", "lead": "Ang unang tatlumpung segundo ang nagdedesisyon. **Marker, posisyon at mata sa tao** — bago pa ang anumang pag-ikot.", "pts": ["**Sumigaw at ihagis agad ang lifebuoy na may light at smoke** sa tabi ng nahulog.", "Pindutin ang **MOB button** sa GPS at sa ECDIS para markahan ang posisyon.", "**Magtalaga ng tagamasid** na walang ibang gawain kundi tingnan ang tao.", "**Williamson turn** kung hindi nakita ang paghulog o sa gabi; bumabalik sa parehong track.", "**Anderson turn** kung agad nakita at mabilis ang barko sa pagbalik; **Scharnov turn** kung matagal nang nahulog.", "**Ipaalam sa VHF Channel 16**, buhayin ang rescue boat crew, at ihanda ang recovery sa lee side."], "ref": "SOLAS V/ at ang IAMSAR Manual Volume III. Tatlong pamamaraan ng pag-ikot ang karaniwang ginagamit; ang pagpili ay nakadepende sa **kung kailan napansin ang paghulog**.", "k": "Ilarawan ang tatlong pamamaraan ng pag-ikot at kung kailan ginagamit ang bawat isa.", "u": "Ipaliwanag kung bakit ang Williamson turn ang pinili kapag hindi nakita kung kailan nahulog ang tao.", "p": "Isagawa ang buong MOB response sa simulator o sa drill, kasama ang pagbaba ng rescue boat at pagbawi.", "err": "Nawala ang mata sa tao dahil lahat ay abala sa pag-ikot. Isang tao lang ang tungkulin ay tumingin.", "stcw": "STCW Table A-II/1 — respond to a navigational emergency; search and rescue."});
T.push({"id": "emgsteer", "r": "to", "g": "Drills and Emergencies", "t": "Emergency Steering Drill", "lead": "Kapag nawala ang timon sa bridge, may **lokal na kontrol sa steering gear room**. Pero walang silbi iyon kung walang nagsanay.", "pts": ["**Isagawa ang emergency steering drill nang hindi bababa sa bawat tatlong buwan.**", "Kasama ang **direct control sa steering gear room**, ang komunikasyon sa bridge, at ang paggamit ng **emergency compass repeater**.", "Dapat alam ng tauhan ang **paglipat mula sa isang power unit patungo sa isa pa**.", "**Subukan ang steering gear sa loob ng labindalawang oras bago umalis**: full movement, indicators, at ang mga remote control system.", "Ang **daan papunta sa steering gear room ay dapat malinaw**, may ilaw at may instruksiyon na nakapaskil.", "Itala ang **oras ng pagtugon** mula sa utos sa bridge hanggang sa paggalaw ng timon."], "ref": "SOLAS V/26 — steering gear testing and drills. Ang **emergency steering drill** ay hindi bababa sa isang beses kada tatlong buwan, at **ang pagsubok ay sa loob ng labindalawang oras bago umalis**.", "k": "Sabihin ang dalas ng pagsubok at ng drill, at kung nasaan ang lokal na kontrol.", "u": "Ipaliwanag kung bakit kritikal ang komunikasyon sa pagitan ng bridge at steering gear room sa manual steering.", "p": "Pamunuan ang isang emergency steering drill, sukatin ang oras ng pagtugon, at itala sa logbook.", "err": "Hindi nasubukan ang komunikasyon dahil maingay ang steering gear room. Sa totoong pagkakataon, walang narinig.", "stcw": "STCW Table A-II/1 — steering gear and emergency steering arrangements."});
T.push({"id": "sopepdrill", "r": "to", "g": "Drills and Emergencies", "t": "Oil Spill and SOPEP Drill", "lead": "Ang unang sampung minuto ng pagtagas ang nagpapasya kung ito ay **maliit na insidente o malaking kaso**.", "pts": ["**Itigil agad ang operasyon** at isara ang valve; ang pagtigil ang unang hakbang bago ang anumang paglilinis.", "**Ipaalam agad**: Master, duty officer, terminal at ang mga tao sa SOPEP contact list.", "**Gamitin ang SOPEP locker**: absorbent, scupper plug, sawdust, drum at protective gear.", "**Isara ang scupper** bago magsimula ang bunkering, hindi kapag may tumagas na.", "**Litratuhan at itala ang lahat**: oras, dami, kalagayan ng panahon at ang mga hakbang na ginawa.", "**Huwag maghugas papuntang dagat.** Ang paglilinis gamit ang tubig ay nagpapalala ng kaso."], "ref": "MARPOL Annex I Regulation 37 — Shipboard Oil Pollution Emergency Plan. Ang plano ay may **listahan ng tatawagan**, kasama ang coastal State at ang mga kinauukulan.", "k": "Sabihin ang laman ng SOPEP locker at kung sino ang unang tatawagan sa iyong barko.", "u": "Ipaliwanag kung bakit mas mabigat ang parusa sa pagtatangkang itago ang tagas kaysa sa tagas mismo.", "p": "Pamunuan ang isang SOPEP drill sa bunkering station at kumpletuhin ang initial report form.", "err": "Hinugasan ang kubyerta bago dumating ang terminal representative. Doon nagiging kriminal na kaso ang insidente.", "stcw": "STCW Table A-II/1 — prevention of pollution of the marine environment."});
T.push({"id": "drillrec", "r": "to", "g": "Drills and Emergencies", "t": "Drill Records and Evidence", "lead": "Sa imbestigasyon at sa PSC, **kung walang tala, hindi ito nangyari**. Ang talaan ang katibayan ng pagsasanay.", "pts": ["Itala sa **logbook** ang petsa, oras, senaryo, sinong sumali at ang kagamitang ginamit.", "Kung **hindi naisagawa ang buong drill**, itala kung **anong bahagi lang ang nagawa at kung bakit**.", "**Pangalan ng sumali**, hindi 'lahat ng tripulante'. Ang pangalan ang nagpapatunay ng pagsunod sa buwanang hinihingi.", "Isama ang **debrief**: ano ang natuklasan, anong aksiyon, sino ang may hawak at kailan ang takdang petsa.", "**Litrato** ng drill ay malakas na katibayan, lalo na sa paggamit ng BA at sa paglulunsad ng bangka.", "Siguraduhing **tugma ang tala sa maintenance record** at sa checklist; hindi puwedeng magkasalungat."], "ref": "SOLAS III/19.5 — ang petsa ng muster at ng drill, at ang detalye ng mga drill na hindi buong naisagawa, ay **itatala sa logbook na itinakda ng Administration**.", "k": "Sabihin kung anong detalye ang dapat laman ng drill entry sa logbook.", "u": "Ipaliwanag kung bakit mas mabuti ang pagtatalang hindi kumpleto ang drill kaysa sa pagsulat ng hindi totoo.", "p": "Isulat ang buong drill record ng isang fire drill, kasama ang debrief at ang follow-up action.", "err": "Kinopya ang nakaraang buwan at pinalitan lang ang petsa. Nakikita ito agad sa audit at sumisira sa tiwala sa lahat ng iba pang tala.", "stcw": "STCW Table A-VI/1 — records of training and drills."});
T.push({"id": "lookout", "r": "to", "g": "Bridge Watchkeeping", "t": "Lookout and Situational Awareness", "lead": "Ang **lookout** ay hindi lang pagtingin sa labas. Ito ang **buong larawan** ng nangyayari sa paligid at kung ano ang mangyayari sa susunod na sampung minuto.", "pts": ["**Lahat ng pandama at lahat ng kagamitan**: mata, tainga, radar, AIS at VHF nang sabay.", "Ang **OOW ay maaaring maging nag-iisang lookout sa araw lamang**, at kung ligtas, at kailangang may **agad na makakatulong** kapag tumawag.", "**Sa gabi, sa makapal na ulap at sa mataas na trapiko, dapat may hiwalay na lookout.**", "**Sistematikong pagsuyod**: buong abot-tanaw, hindi lang sa unahan; tingnan din ang likuran.", "**Scan pattern**: mata, radar, ECDIS, bilis at timon, pabalik sa mata. Huwag mananatili sa screen.", "**Iwasan ang nakatuon sa isang bagay lamang.** Sa maraming banggaan, nakatutok ang lahat sa iisang target habang ang pangalawa ang tumama."], "ref": "COLREG Rule 5 at STCW Code A-VIII/2 Part 4-1. Ang OOW ay maaaring iwan ang lookout sa araw lamang matapos tasahin ang panganib at **laging handang muling tumawag ng dagdag na tao**.", "k": "Sabihin kung kailan maaaring mag-isa ang OOW bilang lookout at kailan hindi.", "u": "Ipaliwanag kung bakit ang nakatuon sa iisang target ay isa sa pinakamadalas na sanhi ng banggaan.", "p": "Magsagawa ng isang buong watch na may maayos na scan pattern at tamang pag-uulat ng bawat target.", "err": "Nakatutok sa ECDIS habang nag-aayos ng waypoint. Ang maliit na bangkang walang AIS ay nakikita lang ng mata.", "stcw": "STCW Table A-II/1 — maintain a safe navigational watch; COLREGs."});
T.push({"id": "colregapp", "r": "to", "g": "Bridge Watchkeeping", "t": "COLREG Application on Watch", "lead": "Hindi sapat ang kabisaduhin ang COLREGs. Ang mahalaga ay **mabilis mong matukoy ang sitwasyon** at **maaga kang kumilos**.", "pts": ["**Rule 7**: gamitin ang lahat ng paraan; ang **steady bearing na lumalapit** ay panganib ng banggaan.", "**Rule 8**: maaga, malaki at **nakikita sa radar at sa mata**. Ang maliit na pagbabago ay mapanganib.", "**Rule 13 overtaking**, **Rule 14 head-on**, **Rule 15 crossing** — alamin muna kung alin bago kumilos.", "**Rule 16 give-way**: maagang kumilos nang malinaw. **Rule 17 stand-on**: panatilihin, pero kumilos kapag malinaw na hindi kumikilos ang isa.", "**Rule 19** sa restricted visibility: **walang stand-on vessel** doon; iba ang panuntunan.", "**Huwag umasa sa VHF** para pumili ng paraan ng pag-iwas; maraming banggaan ang nagmula sa maling pagkakaintindi sa radyo."], "ref": "COLREG 1972 Rules 5 hanggang 19. Ang **pagbabago ng course ay mas nakikita kaysa sa pagbabago ng bilis**, at ang malaking pagbabago ang pinakamalinaw na mensahe.", "k": "Tukuyin ang sitwasyon mula sa ilaw at sa bearing, at sabihin kung sino ang give-way.", "u": "Ipaliwanag kung bakit walang stand-on vessel sa restricted visibility sa ilalim ng Rule 19.", "p": "Isagawa ang isang serye ng traffic encounter sa simulator at ipaliwanag ang bawat desisyon.", "err": "Maliit na alteration ng limang digri. Hindi ito nakikita sa radar ng kabila at madalas nauuwi sa huling-sandaling pagliko.", "stcw": "STCW Table A-II/1 — COLREGs and safe navigational watch."});
T.push({"id": "tostand", "r": "to", "g": "Bridge Watchkeeping", "t": "Master's Standing Orders · Following Them", "lead": "Ang standing orders ang **hangganan ng iyong awtoridad**. Sa loob nito, ikaw ang magdedesisyon; sa labas, tawagin ang Master.", "pts": ["Basahin at **lagdaan** ang standing orders sa simula ng iyong kontrata at tuwing may pagbabago.", "Alamin ang **CPA at TCPA limit** at huwag hintaying malapit na bago kumilos.", "Alamin ang eksaktong **listahan kung kailan tatawagin ang Master** at sundin ito nang literal.", "**Kapag may duda, tawagin.** Walang Master na nagalit sa tawag; marami na ang nagalit sa hindi pagtawag.", "Ang pagtawag ay **hindi kahinaan**; ito ang tamang paggamit ng bridge resource.", "**Itala sa logbook** kung kailan tinawag ang Master at kung anong oras siya dumating sa bridge."], "ref": "STCW Code A-VIII/2 at SOLAS V/34-1 — ang Master ang nagtatakda ng mga tagubilin, at ang OOW ay may tungkuling sundin ang mga ito.", "k": "Sabihin mula sa memorya ang limang pagkakataong tatawagin mo ang Master.", "u": "Ipaliwanag kung bakit ang maagang pagtawag ay mas mabuting desisyon kaysa sa maling independiyenteng aksiyon.", "p": "Sa isang watch sa simulator, kilalanin ang tamang sandali ng pagtawag at gawin ang buong handover sa Master.", "err": "Naghintay pa dahil ayaw gisingin ang Master. Kapag dumating siya, kulang na ang oras at puwersa para umiwas.", "stcw": "STCW Table A-II/1 — maintain a safe navigational watch; bridge resource management."});
T.push({"id": "nightord", "r": "to", "g": "Bridge Watchkeeping", "t": "Night Orders", "lead": "Ang **night orders** ay para sa gabing iyon lamang: ang partikular na ruta, ang panahon, at ang partikular na alalahanin ng Master.", "pts": ["Basahin **bago magsimula ang watch**, hindi sa gitna nito.", "Hanapin ang **tiyak na utos**: bilis, UKC, oras ng pagbabago ng course, at ang lugar na dapat bantayan.", "**Lagdaan** pagkatapos basahin; ito ang patunay na naunawaan mo.", "Kung may **hindi malinaw, magtanong agad** sa Master bago siya matulog.", "**Itala kung ano ang nangyari** kaugnay ng utos; halimbawa, kung bakit hindi nasunod ang itinakdang oras.", "Ang night orders ay **hindi pumapalit** sa standing orders; nagdadagdag lang ito."], "ref": "Bahagi ng SMS at ng STCW Code A-VIII/2. Sa imbestigasyon, ang **pirma sa night orders** ang unang hinahanap bilang katibayan ng handover.", "k": "Sabihin ang pagkakaiba ng standing orders at ng night orders.", "u": "Ipaliwanag kung bakit kailangang magtanong agad imbes na hulaan ang ibig sabihin ng utos.", "p": "Basahin ang isang night order, ipaliwanag ito sa iyong lookout, at itala ang pagsunod sa buong watch.", "err": "Pinirmahan nang hindi binabasa. Kapag may nangyari, ang pirma mo ang nagsasabing alam mo raw ang utos.", "stcw": "STCW Table A-II/1 — watch handover and Master's instructions."});
T.push({"id": "brlog", "r": "to", "g": "Bridge Watchkeeping", "t": "Bridge Logbook Entries", "lead": "Ang logbook ay **legal na dokumento**. Pagkalipas ng dalawang taon, ito na lang ang natitirang alaala ng barko.", "pts": ["Isulat ang **oras, posisyon, course, bilis, panahon at estado ng dagat** sa itinakdang pagitan.", "Itala ang **bawat pagbabago ng course at bilis** at ang dahilan nito.", "Itala ang **pagtawag sa Master**, ang pagdating niya sa bridge, at ang paglipat ng conning.", "**Walang ipinapantakip at walang binubura.** Kung may mali, isang guhit lang, isulat ang tama, at lagdaan.", "Isulat ang **nakita at ginawa**, hindi ang opinyon. 'Nakita ang target sa 6 na milya, lumiko ng dalawampung digri pakanan.'", "**Panahunan at buo ang oras** — ang hindi malinaw na oras ang unang inaatake sa imbestigasyon."], "ref": "SOLAS V/28 — Records of navigational activities. Ang mga tala ay dapat **itago hangga't itinatakda ng Administration**, at kasama rito ang mga detalyeng mahalaga sa kaligtasan ng paglalayag.", "k": "Ilista ang mga bagay na dapat palaging nakatala sa bridge logbook.", "u": "Ipaliwanag kung bakit hindi tinatanggap ang binurang entry bilang katibayan.", "p": "Isulat ang kumpletong entry ng isang insidente mula pansin hanggang sa resolusyon.", "err": "Isinulat ang buong watch sa dulo ng watch mula sa alaala. Hindi tugma ang oras sa VDR at nawawala ang bisa ng tala.", "stcw": "STCW Table A-II/1 — keep records of navigational activities."});
T.push({"id": "posmon", "r": "to", "g": "Bridge Watchkeeping", "t": "Position Monitoring", "lead": "Hindi sapat na alam mo kung nasaan ka. Kailangang alam mo rin kung **tama ba ang pinagkukunan mo** ng posisyon.", "pts": ["Gumamit ng **hindi bababa sa dalawang magkaibang paraan**: GPS at radar fix, o visual bearing.", "**Itakda ang pagitan ng fix** ayon sa panganib: mas madalas sa baybayin at sa makitid na daanan.", "**Parallel index** sa radar ang pinakamabilis na paraan para makitang lumilihis ka sa track.", "**Cross-check ang GPS** sa radar range mula sa kilalang bagay; kapag hindi tugma, huwag paniwalaan ang GPS.", "**Markahan ang cross-track error** at ang limitasyon nito sa passage plan.", "Suriin ang **datum ng chart at ng GPS**; ang maling datum ay naglilipat ng posisyon ng ilang daang metro."], "ref": "SOLAS V/19 at ang passage plan sa ilalim ng A.893(21). Ang **position fixing interval** ay bahagi ng naaprubahang plano, hindi ito pinipili na lang sa bridge.", "k": "Sabihin ang itinakdang pagitan ng fix sa bawat bahagi ng iyong kasalukuyang biyahe.", "u": "Ipaliwanag kung bakit mapanganib ang pag-asa sa iisang GPS kahit tila tama ang ipinapakita nito.", "p": "Magsagawa ng isang oras na coastal navigation na may radar fix, visual bearing at parallel index.", "err": "Tiningnan lang ang ECDIS at ipinalagay na tama. Walang nakapansin na lumipat ang barko palabas ng track dahil sa agos.", "stcw": "STCW Table A-II/1 — determine position by all available means."});
T.push({"id": "pilotsup", "r": "to", "g": "Bridge Watchkeeping", "t": "Pilotage Support", "lead": "Ang pilot ay **tagapayo**; ang Master pa rin ang may pananagutan. Ang tungkulin mo ay **bantayan ang plano**, hindi tumahimik.", "pts": ["**Master–Pilot Exchange** bago magsimula: plano, bilis, tugboat, berth at emerhensiya.", "**Ipagpatuloy ang position fixing** habang may pilot; ito ang pinakamadalas na nakakaligtaan.", "**Ulitin ang bawat utos** ng pilot at itala ang helm at engine order sa bell book.", "**Magsalita kapag may nakitang mali.** Ang katahimikan sa bridge ang pinakamalaking panganib sa pilotage.", "Suriin ang **pilot ladder**: tamang haba, maayos na baitang, manrope, lifebuoy at ilaw.", "Bantayan ang **UKC at ang no-go area** kahit sabihin ng pilot na ligtas."], "ref": "SOLAS V/23 para sa pilot transfer arrangements at ang IMO Resolution A.960(23) para sa Master–Pilot Exchange. Ang pagdating ng pilot ay **hindi nag-aalis ng tungkulin** ng Master at ng OOW.", "k": "Sabihin ang laman ng Master–Pilot Exchange at ang kaligtasan sa pilot ladder.", "u": "Ipaliwanag kung bakit hindi nawawala ang pananagutan ng Master kapag may pilot sa bridge.", "p": "Isagawa ang buong pilotage watch: exchange, monitoring, bell book at hamon kung may mali.", "err": "Hindi nagsalita ang OOW kahit nakita niyang papasok sa mababaw. Ang paggalang sa pilot ay hindi dahilan para manahimik.", "stcw": "STCW Table A-II/1 — bridge resource management; pilotage."});
T.push({"id": "anchwatch", "r": "to", "g": "Bridge Watchkeeping", "t": "Anchor Watch", "lead": "Ang nakaangkla na barko ay **gumagalaw pa rin**. Ang anchor watch ay tunay na watch, hindi pahinga.", "pts": ["**Anchor circle** sa ECDIS: ang radius ay haba ng kadena at ang haba ng barko; magtakda ng alarma.", "**Regular na fix** gamit ang visual bearing o radar sa nakapirming bagay, hindi lang GPS.", "Bantayan ang **direksiyon at lakas ng hangin at agos**, at ang pag-ikot ng barko.", "**Senyas ng dragging**: hindi nagbabago ang bearing sa gilid, nanginginig ang kadena, at lumalayo sa anchor circle.", "Panatilihing **handa ang makina** ayon sa utos ng Master; alamin ang notice time.", "**Tamang ilaw at tanda**: anchor ball sa araw, anchor light sa gabi. Bantayan ang VHF at ang paligid."], "ref": "COLREG Rule 30 para sa ilaw at tanda ng nakaangkla, at ang STCW Code A-VIII/2 Part 4-1 para sa watch sa anchorage.", "k": "Sabihin ang tamang ilaw at tanda ng nakaangkla at ang paraan ng pagtakda ng anchor circle.", "u": "Ipaliwanag kung paano makikilala ang dragging bago pa tumunog ang alarma.", "p": "Magsagawa ng anchor watch na may fix, anchor circle at tamang pagtatala; tukuyin ang dragging sa simulator.", "err": "Umasa lang sa GPS anchor alarm. Tumunog lang ito nang huli, dahil malaki ang itinakdang radius.", "stcw": "STCW Table A-II/1 — maintain a safe navigational watch at anchor."});
T.push({"id": "lsainv", "r": "to", "g": "Safety Administration", "t": "LSA and FFE Inventory and Certificates", "lead": "Ang **Safety Equipment Certificate** ay may kasamang **Record of Equipment**. Ang nakalagay doon ang dapat na nasa barko — hindi kulang.", "pts": ["Ang **Form E** ang listahan ng LSA at FFE na hinihingi sa iyong barko; ito ang dapat mong basehan.", "Itugma ang **tunay na bilang** sa listahan: lifebuoy, lifejacket, immersion suit, extinguisher, BA set at spare charge.", "Bantayan ang **petsa ng expiry**: pyrotechnics, EPIRB battery at HRU, inflatable liferaft at lifejacket light.", "**Annual at five-yearly service** ng liferaft, davit, hook at inflatable lifejacket, gawa ng aprubadong service station.", "**Itabi ang service report** at ang sertipiko; ito ang hinihingi muna ng PSC bago pa ang kagamitan.", "**Maglagay ng tracker** ng petsa ng expiry anim na buwan bago, hindi sa buwan mismo ng pag-expire."], "ref": "SOLAS I/ at ang Safety Equipment Certificate kasama ang **Record of Equipment (Form E)**. Ang servicing ng inflatable appliances ay nasa SOLAS III/20 at sa MSC.1/Circ.1206.", "k": "Hanapin ang Form E ng iyong barko at itugma ang isang pahina sa aktuwal na kagamitan.", "u": "Ipaliwanag kung bakit ang isang kulang na lifejacket ay maaaring maging detainable deficiency.", "p": "Magsagawa ng buong LSA at FFE inventory, maghanda ng expiry tracker, at tukuyin ang mga malapit nang mag-expire.", "err": "Na-expire ang pyrotechnics habang nasa dagat dahil hindi naihanda ang order. Dapat anim na buwan bago pa ang pag-order.", "stcw": "STCW Table A-II/1 — monitor compliance with legislative requirements."});
T.push({"id": "seqpms", "r": "to", "g": "Safety Administration", "t": "Safety Equipment PMS", "lead": "Ang **planned maintenance** ang nagpapanatiling buhay ng kagamitan. Ang inspeksiyon ay nakikita lang ang sira; ang PMS ang pumipigil nito.", "pts": ["**Lingguhan**: lifeboat engine, emergency lighting, alarm system, fire pump at ang pagsubok ng isang detector.", "**Buwanan**: lifeboat at davit, lifejacket, extinguisher, BA set, EEBD at ang lahat ng fire hose.", "**Taunan at bawat limang taon**: liferaft, davit load test, hook release gear, inflatable lifejacket at hydrostatic test.", "**Gumamit ng maker's manual**, hindi ng pangkalahatang listahan; magkaiba ang hinihingi ng bawat gawa.", "**Spare parts**: itago ang itinakdang bilang at bantayan ang stock bago pa maubos.", "**Ang tala ay bahagi ng gawain**, hindi karagdagan. Walang tala, walang maintenance sa mata ng PSC."], "ref": "SOLAS III/20 para sa operational readiness, maintenance and inspections ng LSA, at SOLAS II-2/14 para sa maintenance plan ng FFE. Tingnan din ang MSC.1/Circ.1432.", "k": "Sabihin ang lingguhan, buwanan at taunang hinihingi para sa LSA at FFE.", "u": "Ipaliwanag kung bakit hindi sapat ang pangkalahatang checklist kung may sariling manual ang gawa.", "p": "Bumuo ng isang buwang PMS schedule para sa LSA at FFE at isagawa ang isang linggong bahagi nito.", "err": "Nakasulat na nagawa, pero walang pirma at walang nakitang palatandaan ng gawain. Sa audit, ito ay itinuturing na hindi nagawa.", "stcw": "STCW Table A-II/1 — ensure compliance with maintenance requirements."});
T.push({"id": "defrep", "r": "to", "g": "Safety Administration", "t": "Defect Reporting", "lead": "Ang sirang kagamitan ay hindi kasalanan. Ang **hindi pag-uulat** nito ang kasalanan.", "pts": ["**Iulat agad**: ano ang sira, kailan napansin, at ano ang epekto sa kaligtasan.", "**Magtakda ng pansamantalang pananggalang**: fire watch, isolation, babala, o pagbabawal sa paggamit.", "**Ipaalam sa kumpanya** kung ang sira ay nakakaapekto sa sertipiko o sa pagpapatakbo.", "**Itala sa defect list** na may numero, petsa, katayuan at ang may hawak.", "**Sundan ang katayuan** hanggang sa maayos; ang bukas na defect na walang galaw ay masama sa audit.", "Kung may **conditional o short-term certificate**, alamin ang takdang petsa at ihanda ang pagkukumpuni bago pa ito."], "ref": "ISM Code Element 9 — reports and analysis of non-conformities, accidents and hazardous occurrences, at Element 10 — maintenance of the ship and equipment.", "k": "Sabihin ang laman ng isang maayos na defect report.", "u": "Ipaliwanag kung bakit mas mabigat ang hindi naiulat na sira kaysa sa sira mismo.", "p": "Sumulat ng defect report para sa isang hindi gumaganang fire detector, kasama ang pansamantalang hakbang.", "err": "Hinintay ang susunod na port dahil 'maliit lang'. Pagdating ng PSC, ang maliit na sira ay naging malaking tanong sa buong sistema.", "stcw": "STCW Table A-II/1 — report defects and deficiencies."});
T.push({"id": "pscchk", "r": "to", "g": "Safety Administration", "t": "PSC Preparation Checklist", "lead": "Hindi inihahanda ang barko sa araw ng PSC. **Araw-araw itong inihahanda**; ang checklist ay paalala lang.", "pts": ["**Sertipiko**: wasto, hindi expired, at magkakatugma ang pangalan, numero at petsa.", "**Drill at tala**: kumpleto ang buwanan at tatlong-buwanang hinihingi at pirmado.", "**LSA at FFE**: maabot, nakamarka, walang kalawang at hindi expired.", "**Accommodation at galley**: malinis, walang nakakalsong fire door, at walang nakaharang na escape route.", "**Oil Record Book at Garbage Record Book**: walang blangko at walang pagkakasalungat.", "**Rest hours**: tugma sa logbook at sa overtime record; madalas itong unang hinahanap."], "ref": "Ang Port State Control ay isinasagawa sa ilalim ng SOLAS I/19, MARPOL at ng Paris at Tokyo MOU. Ang mga **detainable deficiency** ay nakalista sa mga pamamaraan ng MOU.", "k": "Ilista ang unang sampung bagay na titingnan ng isang PSC officer pagsakay.", "u": "Ipaliwanag kung bakit ang kalinisan at kaayusan ang unang bumubuo ng impresyon tungkol sa buong barko.", "p": "Magsagawa ng self-inspection gamit ang PSC checklist at ayusin ang nakita bago dumating ang inspektor.", "err": "Nagmadaling maglinis sa huling gabi. Nakikita agad ng inspektor ang kaibahan ng ginawa kahapon at ng nakagawian.", "stcw": "STCW Table A-II/1 — monitor compliance with legislative requirements."});
T.push({"id": "flagsup", "r": "to", "g": "Safety Administration", "t": "Flag State and Class Inspection Support", "lead": "Ang trabaho mo sa survey ay **ihanda ang kagamitan at ang tala**, at samahan ang surveyor nang handang sumagot.", "pts": ["Alamin ang **uri ng survey**: annual, intermediate, renewal o occasional, at kung ano ang saklaw nito.", "**Ihanda ang access**: tangke, bodega, void at ang kagamitang susuriin; linisin at bentilahan nang maaga.", "**Ihanda ang tala**: PMS, drill record, calibration at ang nakaraang report at ang mga aksiyon dito.", "**Samahan ang surveyor** at magtala ng bawat puna habang nangyayari; huwag umasa sa alaala.", "**Huwag mangako nang labis.** Sabihin ang totoong kalagayan at ang plano ng pagkukumpuni.", "**Isara ang bawat puna** nang may katibayan: litrato, invoice at bagong tala."], "ref": "SOLAS I/6 at I/7 — survey and inspection. Ang Class ay kumikilos bilang Recognised Organization para sa Flag sa maraming statutory survey.", "k": "Sabihin ang mga uri ng survey at kung ano ang inihahanda sa bawat isa.", "u": "Ipaliwanag kung bakit mas mabuti ang maagang pag-amin ng sira kaysa sa matuklasan ito ng surveyor.", "p": "Maghanda para sa isang annual safety equipment survey: access, tala at listahan ng alam nang depekto.", "err": "Nakalimutan ang nakaraang report. Ang unang hinahanap ng surveyor ay kung naisara ang dating puna.", "stcw": "STCW Table A-II/1 — survey and certification support."});
T.push({"id": "signage", "r": "to", "g": "Safety Administration", "t": "Safety Signage and IMO Symbols", "lead": "Sa usok at sa gulo, **hindi nagbabasa ang tao — tumitingin siya ng simbolo**. Doon mahalaga ang tamang karatula.", "pts": ["**IMO symbols** ang pamantayan; iisa ang kahulugan sa buong mundo, anuman ang wika ng tripulante.", "**Escape route** na may **low-location lighting** o photoluminescent na marka sa accommodation.", "Markahan ang **lahat ng LSA at FFE station** at ang laman nito, nakikita mula sa malayo.", "**Muster station at embarkation point** na malinaw at hindi nakaharang.", "**Remote stop, damper at valve** na may karatula kung aling espasyo ang hawak nila.", "**Palitan ang kupas na karatula.** Ang hindi nababasang karatula ay parang walang karatula."], "ref": "SOLAS II-2/13 para sa means of escape at ang IMO Resolution A.1116(30) — Escape route signs and equipment location markings, na humalili sa A.760(18).", "k": "Kilalanin ang mga karaniwang IMO symbol ng LSA at FFE nang walang teksto.", "u": "Ipaliwanag kung bakit mas mahalaga ang simbolo kaysa sa salita sa isang tripulanteng iba-iba ang wika.", "p": "Lakarin ang accommodation, tukuyin ang kulang o kupas na karatula, at maghanda ng listahan ng papalitan.", "err": "Tinakpan ng bagong pintura ang photoluminescent strip. Sa gabi at sa usok, nawala ang daan palabas.", "stcw": "STCW Table A-VI/1 — escape routes and safety signs."});
T.push({"id": "squat", "r": "ma", "g": "Ship Handling", "t": "Shallow Water, Bank Effect and Squat", "lead": "Sa mababaw na tubig, **nagbabago ang ugali ng barko**. Bumababa ito, bumabagal ang pagtugon, at nagiging mailap ang timon.", "pts": ["**Squat**: bumababa ang barko at nagbabago ang trim habang tumatakbo sa mababaw; lumalaki ito sa **parisukat ng bilis**.", "Ang **pinakamabisang lunas ay pagbagal.** Ang paghati ng bilis ay humigit-kumulang **apat na beses na pagliit** ng squat.", "Sa **mababaw na tubig, bumabagal ang pagtugon ng timon** at lumalaki ang turning circle.", "**Bank effect**: hinihila ang likuran papalapit sa pampang at itinutulak ang unahan palayo; nagiging sheer ito kung hindi maagang iniwasan.", "**Interaction** sa pagsalubong at pag-abante sa makitid na daanan: maagang kumilos at bawasan ang bilis.", "Ang **squat ng full-bodied na bulk carrier ay mas malaki** kaysa sa payat na barko sa parehong bilis."], "ref": "Bahagi ng UKC policy sa SMS at ng passage planning sa ilalim ng IMO Resolution A.893(21). Maraming kumpanya ang nagtatakda ng **minimum UKC bilang porsiyento ng draft** sa mababaw na lugar.", "k": "Sabihin ang mga sanhi ng squat at kung paano ito nagbabago sa bilis.", "u": "Ipaliwanag kung bakit nagbabago ang pag-uugali ng timon at ng makina sa mababaw na tubig.", "p": "Magplano ng pagdaan sa isang mababaw na kanal: UKC, bilis, tugboat at ang mga abort point.", "err": "Binilisan ang pagtakbo para maabot ang tide window. Ang dagdag na squat ang umubos sa natitirang UKC.", "stcw": "STCW Table A-II/2 — manoeuvre the ship; shallow water effects."});
T.push({"id": "pilotarr", "r": "ma", "g": "Ship Handling", "t": "Pilot Transfer Arrangement", "lead": "Namamatay pa rin ang mga pilot sa pag-akyat. Ang **hagdan at ang paligid nito** ay pananagutan ng Master, hindi ng bosun lamang.", "pts": ["**Isang tuluy-tuloy na hagdan** hanggang sa punto ng pagsakay, walang pagdudugtong at walang shackle sa gitna.", "Kapag ang distansya mula tubig ay **mahigit siyam na metro, gumamit ng combination ladder** na may accommodation ladder.", "**Manrope, lifebuoy na may self-igniting light, heaving line at stretcher** na handa sa lugar.", "**Sapat na ilaw sa gabi**, parehong sa hagdan at sa kubyerta; walang discharge na umaagos sa hagdan.", "**Responsableng opisyal** sa transfer point na may radyo sa bridge.", "**Suriin ang bawat baitang at ang side rope**; itapon ang hagdang may palatandaan ng pagkasira. Hindi ito pinupursige."], "ref": "SOLAS V/23 at ang IMO Resolution A.1045(27) sinusugan ng Resolution A.1108(29) — pilot transfer arrangements. Ang hagdan ay may **sariling marka at tala ng pagkakagawa**.", "k": "Sabihin ang hinihinging kagamitan sa pilot transfer station at ang taas kung kailan kailangan ang combination ladder.", "u": "Ipaliwanag kung bakit ipinagbabawal ang shackle at ang pagdudugtong sa gitna ng hagdan.", "p": "Suriin ang buong pilot transfer arrangement bago dumating ang pilot at itama ang nakitang kakulangan.", "err": "Maayos ang hagdan pero may discharge na umaagos sa tabi nito. Basa, madulas at madilim ang dinadaanan ng pilot.", "stcw": "STCW Table A-II/2 — pilot embarkation and disembarkation arrangements."});
T.push({"id": "emgman", "r": "ma", "g": "Ship Handling", "t": "Emergency Manoeuvres", "lead": "Kapag kritikal na, **ang manoeuvre ang huling pananggalang**. Dapat alam mo na ang kaya ng barko mo bago pa dumating ang sandaling iyon.", "pts": ["**Crash stop**: alamin ang tunay na head reach ng barko mo sa laden at sa ballast.", "**Emergency turn**: ang maagang buong timon ay mas mabisa kaysa sa huling-sandaling pagpreno.", "**Beaching** bilang huling hakbang laban sa paglubog; pumili ng malambot at mababaw na lugar.", "**Anchor bilang panghinto** sa daungan: mapanganib sa kadena pero minsan ito ang tanging paraan.", "**Pagprotekta sa barko pagkatapos ng banggaan**: huwag agad lumayo kung ang kabila ang tumatagos.", "Ang **manoeuvring booklet at ang wheelhouse poster** ang pinagmumulan ng mga bilang; basahin bago kailanganin."], "ref": "SOLAS V/28 at ang IMO Resolution A.601(15) — Provision and display of manoeuvring information on board ships. Dapat nakapaskil ang **pilot card, wheelhouse poster at manoeuvring booklet**.", "k": "Sabihin ang head reach at ang turning circle ng iyong barko sa laden at sa ballast.", "u": "Ipaliwanag kung bakit kadalasang mas mabuti ang pag-iwas sa pamamagitan ng timon kaysa sa crash stop.", "p": "Isagawa ang crash stop at emergency turn sa simulator at ihambing sa nakatalang datos ng barko.", "err": "Umaasa sa bilang na nakasulat noong sea trial sa ballast. Sa laden, halos doble ang head reach.", "stcw": "STCW Table A-II/2 — manoeuvre and handle a ship in all conditions."});
T.push({"id": "charter", "r": "ma", "g": "Chartering and Commerce", "t": "Voyage and Time Charter Basics", "lead": "Ang uri ng charter ang nagsasabi **kung sino ang nagbabayad ng ano** at kung kanino ka mag-uulat. Ito ang pundasyon ng lahat ng komersiyal na desisyon.", "pts": ["**Voyage charter**: ang owner ang nagdadala ng kargamento mula A papuntang B sa isang freight rate; **owner ang nagbabayad ng bunker at port cost**.", "**Time charter**: inuupahan ng charterer ang barko sa bawat araw; **charterer ang nagbabayad ng bunker at port cost**, at siya ang nag-uutos ng ruta.", "**Bareboat charter**: ang buong barko ay inuupahan nang walang tripulante; iba ang pananagutan.", "Sa time charter, ang **Master ay sumusunod sa employment order ng charterer** pero **hindi kailanman sa utos na mapanganib**.", "**Off-hire**: kapag hindi magamit ang barko dahil sa sira o delay na kasalanan ng barko, huminto ang bayad.", "**Basahin ang charter party clauses** na kaugnay sa Master: notices, bunker, speed at cargo documents."], "ref": "Mga karaniwang porma: **GENCON** para sa voyage charter, **NYPE at BALTIME** para sa time charter. Ang Master ay karaniwang bahagi ng chain of command sa employment clause.", "k": "Sabihin ang pagkakaiba ng voyage, time at bareboat charter at kung sino ang nagbabayad ng bunker.", "u": "Ipaliwanag kung bakit maaaring tumanggi ang Master sa utos ng charterer kahit pinirmahan ang charter.", "p": "Basahin ang Master's clauses ng isang charter party at ilista ang iyong mga obligasyon sa bawat daungan.", "err": "Sinunod ang mapanganib na utos dahil 'charterer ang nagbayad'. Ang kaligtasan ay hindi kailanman nasa ilalim ng komersiyo.", "stcw": "STCW Table A-II/2 — commercial management and chartering awareness."});
T.push({"id": "laytime", "r": "ma", "g": "Chartering and Commerce", "t": "Laytime and Demurrage Awareness", "lead": "Ang laytime ay ang **oras na binili ng charterer** para magkarga at magbaba. Kapag lumampas, may bayad na tinatawag na demurrage.", "pts": ["**Laytime** ay nagsisimula matapos ang NOR at ang itinakdang turn time sa charter party.", "**Demurrage**: parusa sa paglampas; **despatch**: gantimpala kapag mas mabilis. Kalahati ng demurrage ang karaniwang despatch.", "**Weather working day**: hindi binibilang ang oras na hindi puwedeng magtrabaho dahil sa panahon, kung ganoon ang kasunduan.", "**SHEX at SHINC**: Sundays and holidays excepted o included; malaking kaibahan sa kabuuang bilang.", "Ang **Statement of Facts at ang time sheet** ang pinagbabatayan ng kalkulasyon; ang tala mo ang laban ng owner.", "**Itala ang bawat paghinto**: ulan, sirang crane, pagkawala ng truck, at kung kaninong kasalanan."], "ref": "Nasa charter party ang mga panuntunan ng laytime. Ginagamit din ang **Laytime Definitions for Charter Parties** ng BIMCO bilang sanggunian kapag hindi malinaw ang kasunduan.", "k": "Sabihin kung kailan nagsisimula ang laytime at ang kahulugan ng demurrage at despatch.", "u": "Ipaliwanag kung bakit ang kalidad ng SOF mo ang nagpapasya kung mananalo ang owner sa claim.", "p": "Gumawa ng time sheet mula sa isang SOF at kalkulahin ang laytime na nagamit.", "err": "Isinulat na 'rain stopped work' nang walang eksaktong oras. Hindi mabibilang ang exception at nalulugi ang owner.", "stcw": "STCW Table A-II/2 — commercial operation and documentation."});
T.push({"id": "nor", "r": "ma", "g": "Chartering and Commerce", "t": "Notice of Readiness", "lead": "Ang **NOR** ang nagpapasimula ng orasan ng laytime. Kapag mali ang pagbibigay nito, nawawala ang araw-araw na bayad.", "pts": ["Dapat **handa talaga ang barko sa lahat ng aspeto**: pisikal, legal at dokumentaryo.", "**Arrived ship**: nasa lugar na itinakda ng charter party — berth, port o anchorage ayon sa kasunduan.", "**Free pratique at customs clearance** kung hinihingi ng kasunduan bago maging wasto ang NOR.", "**Tendered sa tamang paraan at oras**: nakasulat, sa tamang tao, at sa loob ng itinakdang oras.", "**Panatilihin ang kopya at ang patunay ng pagtanggap** — oras, pangalan at pirma.", "Kapag may duda, **magbigay ng NOR at ulitin araw-araw** hanggang tanggapin, at maglagay ng reservation."], "ref": "Ang mga kinakailangan ng NOR ay nasa charter party. Ang kilalang panuntunan ay nagmumula sa kasong **The Happy Day** at sa iba pang desisyon tungkol sa invalid NOR.", "k": "Sabihin ang apat na kondisyon para maging wasto ang isang NOR.", "u": "Ipaliwanag kung bakit nawawala ang milyong demurrage dahil sa isang NOR na binigay nang maaga.", "p": "Maghanda at magbigay ng NOR sa isang daungan, kumpleto ang patunay ng pagtanggap at ang tala.", "err": "Binigay ang NOR habang naghihintay pa ng free pratique. Hindi wasto, at ang orasan ay nagsimula lang makalipas ang dalawang araw.", "stcw": "STCW Table A-II/2 — commercial documentation and port procedures."});
T.push({"id": "sof", "r": "ma", "g": "Chartering and Commerce", "t": "Statement of Facts", "lead": "Ang **SOF** ang oras-oras na kasaysayan ng pagtigil sa daungan. Ito ang pinakamahalagang komersiyal na dokumento na pipirmahan mo.", "pts": ["Itala ang **bawat pangyayari na may eksaktong oras**: pagdating, NOR, berthing, simula at katapusan ng kargada.", "**Bawat paghinto at ang dahilan**: ulan, sirang kagamitan, walang truck, shift ng gang o paghihintay sa surveyor.", "**Sabihin kung kaninong gawi ang dahilan** ng paghinto; ito ang nagdedesisyon kung sino ang magbabayad.", "**Hindi puwedeng blangko** ang oras; ang 'about' at 'approx' ay nagpapahina sa buong dokumento.", "**Pirma ng barko, ng terminal at ng agent**; kung hindi sumasang-ayon ang terminal, **pumirma nang may reservation**.", "**Itugma sa deck log at sa cargo log**; ang pagkakasalungat ang unang hinahanap ng kabilang panig."], "ref": "Ang SOF ay ginagamit kasama ang laytime provisions ng charter party. Ang BIMCO ay may karaniwang porma ng SOF na tinatanggap sa maraming daungan.", "k": "Ilista ang mga pangyayaring dapat laging nasa SOF.", "u": "Ipaliwanag kung bakit mas mabuting pumirma nang may reservation kaysa tumangging pumirma.", "p": "Bumuo ng isang buong SOF mula sa deck log ng isang pagtigil at ihambing sa bersiyon ng terminal.", "err": "Pumirma nang walang pagsusuri dahil madaling umalis. Nasa SOF ang mga oras na hindi tugma sa logbook ng barko.", "stcw": "STCW Table A-II/2 — port documentation and records."});
T.push({"id": "bunkers", "r": "ma", "g": "Chartering and Commerce", "t": "Bunkers and ROB Management", "lead": "Ang bunker ang **pinakamalaking gastos** ng biyahe at ang pinakamadalas na pinagtatalunan. Ang tala mo ang proteksiyon ng barko.", "pts": ["**Bunker survey bago at pagkatapos**: sukatin ang lahat ng tangke, kasama ang hindi binunkeran.", "**Bunker Delivery Note** na may sulfur content, density at dami; **itabi ang kopya at ang sample** ayon sa itinakda.", "**MARPOL sample** na selyado, pirmado at itinatago sa barko sa itinakdang panahon.", "**Protest kaagad** kapag may kulang sa dami o may pagdududa sa kalidad; huwag hintaying makaalis.", "**ROB at consumption** na tugma sa noon report at sa engine log; ito ang batayan ng performance claim.", "**Compatibility** ng bagong bunker sa laman ng tangke; ang hindi magkatugmang langis ay nagiging putik."], "ref": "MARPOL Annex VI Regulation 18 — fuel oil availability and quality, kasama ang hinihinging **Bunker Delivery Note at representative sample** na itatago sa barko.", "k": "Sabihin ang laman ng Bunker Delivery Note at ang panahon ng pagtatago ng sample.", "u": "Ipaliwanag kung bakit ang maagang letter of protest ang tanging paraan upang mapanatili ang karapatan ng owner.", "p": "Pamunuan ang isang bunkering: plano, survey, dokumento, sample at ang pagtatala ng ROB.", "err": "Naghintay ng tatlong araw bago nagprotesta sa kulang na dami. Nawala na ang karapatan dahil huli ang protesta.", "stcw": "STCW Table A-II/2 — bunkering operations and MARPOL compliance."});
T.push({"id": "speedclaim", "r": "ma", "g": "Chartering and Commerce", "t": "Speed and Consumption Claims", "lead": "Sa time charter, may **ipinangakong bilis at konsumo** sa charter party. Kapag hindi naabot, may claim.", "pts": ["Ang **warranty** ay karaniwang 'about' na bilis sa **good weather** na may takdang hangin at alon.", "**Ang kahulugan ng good weather ang pinakamahalaga**: karaniwang hanggang Beaufort apat at Douglas tatlo, pero nakadepende sa kasunduan.", "Ang **noon report** mo ang datos ng laban: oras, distansya, bilis, konsumo, hangin, alon at agos.", "**Maging matapat at tuloy-tuloy.** Ang biglang pagbabago ng paraan ng pag-uulat ay agad napapansin.", "**Itala ang agos at ang sariling slip**; maraming claim ang nalulutas dito.", "Gumagamit ang charterer ng **weather routing company**; alamin kung sino at kung anong datos ang ginagamit nila."], "ref": "Nasa performance clause ng charter party, karaniwan sa porma ng **NYPE**. Ang pagtatalo ay karaniwang tungkol sa kahulugan ng good weather period.", "k": "Sabihin ang laman ng isang noon report at ang kahulugan ng good weather sa inyong charter.", "u": "Ipaliwanag kung bakit mas mahalaga ang pagkakatugma ng iyong ulat kaysa sa magandang bilang.", "p": "Maghanda ng buong hanay ng noon report para sa isang biyahe at tasahin ang performance laban sa warranty.", "err": "Pinaganda ang bilis sa ulat para hindi masita. Ginamit ito ng charterer bilang katibayan laban sa barko.", "stcw": "STCW Table A-II/2 — voyage performance reporting."});
T.push({"id": "delredel", "r": "ma", "g": "Chartering and Commerce", "t": "Delivery and Redelivery", "lead": "Ang **delivery at redelivery** ang simula at katapusan ng upa. Ang kondisyon at ang bunker sa sandaling iyon ang pinagbabayaran.", "pts": ["**On-hire at off-hire survey**: kondisyon ng bodega, kagamitan at ang eksaktong ROB ng bawat grado ng bunker.", "Ang **bunker sa delivery ay binibili ng charterer**, at sa redelivery ay binibili pabalik ng owner, sa itinakdang presyo.", "**Redelivery notice** ayon sa kasunduan: tiyak na bilang ng araw bago ang petsa.", "**Kondisyon ng bodega sa redelivery**: karaniwang 'as on delivery, fair wear and tear excepted'.", "**Magtalaga ng independiyenteng surveyor** at siguraduhing pumirma ang parehong panig sa ulat.", "**Litratuhan ang lahat** sa parehong survey; ito ang pinakamalakas na katibayan sa pagtatalo."], "ref": "Nasa delivery at redelivery clauses ng charter party. Karaniwang kasama ang **bunker on delivery at redelivery (BOD at BOR)** na may takdang presyo at dami.", "k": "Sabihin kung ano ang sinusukat at itinatala sa on-hire at off-hire survey.", "u": "Ipaliwanag kung bakit mahalaga ang litrato sa isang pagtatalo tungkol sa kondisyon ng bodega.", "p": "Pamunuan ang isang off-hire survey: bodega, kagamitan, bunker at ang pirmadong ulat.", "err": "Walang litrato ng bodega sa delivery. Sa redelivery, ang lumang pinsala ay sinisingil sa charterer na tumangging magbayad.", "stcw": "STCW Table A-II/2 — commercial handover and survey."});
T.push({"id": "bol", "r": "ma", "g": "Chartering and Commerce", "t": "Bills of Lading and Mate's Receipts", "lead": "Ang **Bill of Lading** ay resibo ng kargamento, katibayan ng kontrata at **dokumento ng pagmamay-ari**. Ang pirma mo rito ay may bigat na legal.", "pts": ["**Mate's Receipt** ang unang tala ng kondisyon ng kargamento; dito nagmumula ang remarks sa B/L.", "**Clean B/L**: walang puna tungkol sa kondisyon. **Claused B/L**: may nakasulat na depekto.", "**Huwag pumirma ng clean B/L kung may depekto.** Ito ang pinakamalaking panganib na hinaharap ng Master.", "Suriin ang **dami, marka at paglalarawan**; dapat tugma sa tunay na natanggap at sa Mate's Receipt.", "**Huwag pumirma ng antedated o postdated B/L**; ito ay maaaring ituring na pandaraya.", "Kapag may presyon, **ipaalam agad sa owner at sa P&I Club** bago pumirma ng anuman."], "ref": "Ang B/L ay saklaw ng **Hague-Visby Rules** sa karamihan ng hurisdiksiyon. Ang **letter of indemnity** para sa clean B/L sa may depektong kargamento ay karaniwang **hindi maipapatupad** at walang saklaw ang P&I.", "k": "Sabihin ang tatlong tungkulin ng Bill of Lading at ang kaibahan ng clean at claused.", "u": "Ipaliwanag kung bakit walang proteksiyon ang letter of indemnity sa isang maling clean B/L.", "p": "Suriin ang isang Mate's Receipt at ang kaukulang B/L, at isulat ang tamang clause para sa may depektong kargamento.", "err": "Pumirma ng clean B/L kapalit ng LOI dahil nagmamadali ang shipper. Sa claim, ang barko ang nagbabayad at walang saklaw ang insurance.", "stcw": "STCW Table A-II/2 — cargo documentation and legal responsibilities."});
