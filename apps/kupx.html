T.push({"id": "norsof", "r": "ma", "g": "Commercial and Communication", "t": "NOR, SOF and Letters of Protest", "lead": "Three documents that fix **money and time**. A mistake here turns into a million-dollar dispute.", "pts": ["**Notice of Readiness**: the ship is at the place, ready in every respect, and inside the laycan.", "Tender the NOR **once and at the right time**; the charter party sets the readiness requirement.", "**Statement of Facts**: an unbroken record of the time of every event, including each stoppage and its cause.", "**Letter of Protest**: written whenever the other side does something that will harm the ship or the cargo.", "The LOP carries the **date, time and name of the receiver**, and you keep the copy even if they refuse to sign.", "**Laytime** starts after the NOR and the turn time; demurrage hangs on it."], "ref": "The charter party laytime clause and the Voylayrules. An invalid NOR can stop laytime from starting at all.", "k": "State the three conditions to meet before tendering a NOR.", "u": "Explain why an early NOR can be held invalid and what that does to demurrage.", "p": "Prepare a NOR, a SOF for one port call, and a letter of protest for a delay.", "err": "A NOR was tendered while hold cleaning was still unfinished. The NOR was invalid and the laytime was lost.", "stcw": "STCW Table A-II/2 — commercial management."});
T.push({"id": "lop", "r": "ma", "g": "Commercial and Communication", "t": "Letters of Indemnity Awareness", "lead": "A **letter of indemnity** is a promise to cover you when trouble comes. The danger: it is often worthless by the time you need it.", "pts": ["Often demanded for a **clean bill of lading** over damaged cargo, or for **discharge without original B/L**.", "**Signing a clean B/L** when you know the cargo is damaged can be treated as fraud.", "**P&I cover is normally lost** in that situation.", "The LOI is **not binding on a third party** such as the true cargo owner.", "**Do not accept** an LOI without clear approval from the owner and from the P&I club.", "The right answer is a **claused bill of lading** carrying the true remarks."], "ref": "P&I club guidance. Delivery without an original bill of lading, and a clean B/L against an LOI, are among the main causes of loss of cover.", "k": "State two common situations in which an LOI is demanded.", "u": "Explain why P&I cover is lost even when a large company has signed the LOI.", "p": "Write a reply to an LOI request, refusing politely and offering a claused B/L, and report it to the owner.", "stcw": "STCW Table A-II/2 — commercial and legal responsibilities."});
T.push({"id": "claims", "r": "ma", "g": "Commercial and Communication", "t": "Cargo Claims and Reservations", "lead": "A claim is won or lost on the **evidence gathered at the time**, not on the explanation given afterwards.", "pts": ["**Survey before and after** the operation, with dated photographs.", "**Mate's receipt remarks** are the strongest defence against a claim on cargo condition.", "A **letter of protest** for every event that can affect the cargo.", "**Ventilation and temperature logs** kept complete and unbroken.", "Call for a **joint survey** as soon as damage is found.", "**Report to the P&I club at once** and follow their instructions."], "ref": "Hague-Visby Rules Article III and IV. Notice of loss or damage normally has to be given within three days of delivery.", "k": "List the evidence to collect when cargo damage is found.", "u": "Explain why an unbroken log counts for more than a good explanation afterwards.", "p": "Lead the evidence gathering on a cargo damage case and prepare the report for the P&I club.", "stcw": "STCW Table A-II/2 — commercial and legal responsibilities."});
T.push({"id": "increp", "r": "ma", "g": "Commercial and Communication", "t": "Incident and Accident Reports", "lead": "A report exists to **stop it happening again**, not to find someone to blame. But it has to be accurate and complete.", "pts": ["**Immediate reporting** to the company, to the flag State and, where required, to the coastal State.", "**Preserve the scene** when it is safe, and photograph it before anything is moved.", "Take **each witness statement** separately and while memory is fresh.", "**Preserve** the VDR data; there is limited time before it is overwritten.", "Use **root cause analysis**, not only the immediate cause.", "Every **corrective action** has a named person and a date."], "ref": "SOLAS XI-1/6 and the Casualty Investigation Code. VDR data must be preserved immediately after an incident.", "k": "State to whom a serious marine casualty is reported and how quickly.", "u": "Explain why preserving the VDR data in the first hour matters.", "p": "Prepare a complete incident report with a timeline, root cause and corrective action.", "err": "The VDR was not saved because everyone was busy elsewhere. The most important evidence was lost within 12 to 48 hours.", "stcw": "STCW Table A-II/2 — respond to emergencies; investigate casualties."});
T.push({"id": "perfrep", "r": "ma", "g": "Commercial and Communication", "t": "Performance, Speed and Consumption Reports", "lead": "The performance report is the **basis of any claim** on speed and fuel. Accurate data is the ship's shield.", "pts": ["Record the **noon report**: position, distance, speed, consumption and ROB.", "Record the **weather**: wind, sea and current, using the standard scales.", "The **good weather period** is what warranty analysis uses, so get the Beaufort and Douglas scale right.", "**Slip and RPM** tell you the state of the hull and the propeller.", "**Hull fouling** drives performance down; record the date of the last cleaning.", "A **difference between ship and weather router** can turn into a dispute; keep your own observations."], "ref": "The speed and consumption warranty of the charter party. BIMCO and the weather routing company each have their own standard for good weather.", "k": "Fill in a noon report completely and accurately.", "u": "Explain how a wrong estimate of Beaufort force can bring on a performance claim.", "p": "Review one month of noon reports, identify the trend in slip, and prepare an explanation for the drop in performance.", "stcw": "STCW Table A-II/2 — monitor and control performance."});
T.push({"id": "email", "r": "ma", "g": "Commercial and Communication", "t": "Professional Email Writing", "lead": "Most disputes at sea start with **bad writing**, not with bad work.", "pts": ["One **subject per email**, with a clear subject line.", "**The first paragraph carries the weight**: what happened and what you need.", "Use **facts and times**, not feelings.", "**Never reply while angry**; write it, leave it, read it again.", "**Copy the right people**, not everyone.", "Remember: **an email is evidence** and will be read in court five years later."], "ref": "No regulation covers this, but correspondence is among the documents called for in a claim and in an investigation.", "k": "Write a clear subject line and opening paragraph for three common situations.", "u": "Explain why an emotional letter makes things worse even when you are right.", "p": "Write a reply to a difficult charterer's email that is firm, polite and built on facts.", "stcw": "STCW Table A-II/2 — use of leadership and managerial skills."});
T.push({"id": "command", "r": "ma", "g": "Leadership", "t": "Command Presence", "lead": "Command presence is not a loud voice. It is the **certainty that someone is in charge** even when the situation is a mess.", "pts": ["**Calm in danger**: your tone becomes the tone of the bridge.", "**Clear orders**: one person, one task, repeated back by the person who takes it.", "**You are seen** at the moments that matter: arrival, departure, heavy weather.", "**Consistent** on standards, not shifting with who you are talking to.", "**Admit a mistake**; it builds trust rather than weakening it.", "**The quiet officer is often the one who sees the error**; ask for their view."], "ref": "STCW Code Section A-II/2 and the Bridge Resource Management principles. ISM Code 5 sets out the Master's responsibility and authority.", "k": "Describe the habits of good command presence and the signs of the opposite.", "u": "Explain why shouting slows the team's response in an emergency.", "p": "Lead a manoeuvre or a drill, give clear orders, and run a debrief afterwards.", "stcw": "STCW Table A-II/2 — use leadership and managerial skills."});
T.push({"id": "sitlead", "r": "ma", "g": "Leadership", "t": "Situational Leadership", "lead": "There is no single way to lead. The right way depends on **the person and the situation**.", "pts": ["**Directing**: new and inexperienced; tell them exactly what to do.", "**Coaching**: some ability; explain the reason.", "**Supporting**: able but short of confidence; help and encourage.", "**Delegating**: skilled and trusted; hand over the task and the authority.", "In an **emergency**, go back to directing even with an experienced team.", "The **wrong level** brings either confusion or resentment."], "ref": "STCW Code A-II/2 — knowledge of personnel management techniques. The model is normally taught on the Management Level course.", "k": "Identify the level of leadership that suits three different team members.", "u": "Explain why delegating harms a person who is not yet ready, and why directing harms an experienced one.", "p": "Choose the right approach for three crew members on a real task, and review the result.", "stcw": "STCW Table A-II/2 — personnel management."});
T.push({"id": "delegate", "r": "ma", "g": "Leadership", "t": "Delegation and Accountability", "lead": "You can **hand over the task**, but you cannot hand over the **accountability**.", "pts": ["State the **aim, the limits and the deadline**, not just the task.", "Give the **authority** along with the task; an order without power is useless.", "Set a **check point** instead of watching all the time.", "**Do not take the task back** at the first mistake; teach first.", "The **result belongs to the team**, the **accountability belongs to you**.", "**Record** who was assigned; it matters in an investigation."], "ref": "ISM Code Element 5 and 6 — responsibility, authority and resources. The Master holds an overriding authority that cannot be handed over.", "k": "State the difference between delegating a task and passing on accountability.", "u": "Explain why delegation fails when the authority is withheld.", "p": "Delegate an important task with clear limits, monitor it, and give feedback.", "stcw": "STCW Table A-II/2 — leadership and managerial skills."});
T.push({"id": "conflict", "r": "ma", "g": "Leadership", "t": "Conflict Resolution", "lead": "On a ship, the people in a quarrel **cannot walk away**. It has to be settled, not avoided.", "pts": ["Act **early**; a small quarrel grows fast in a small space.", "Hear **each side separately** before you bring them together.", "Separate **the person from the problem**; talk about the behaviour, not the character.", "Look for the **real cause**: fatigue, unfair work sharing, culture, or trouble at home.", "Set a **clear agreement** and follow it up.", "**Record** the serious cases; harassment and bullying have their own procedure."], "ref": "MLC 2006 Regulation 4.3 and the shipboard complaint procedure. Every ship carries a written complaint procedure.", "k": "State the steps of your company's shipboard complaint procedure.", "u": "Explain why a quarrel gets worse when it is ignored, and why that is a safety danger.", "p": "Lead a meeting between two people in conflict and record the agreement and the follow-up.", "stcw": "STCW Table A-II/2 — personnel management and training."});
T.push({"id": "coach", "r": "ma", "g": "Leadership", "t": "Coaching Junior Officers", "lead": "The Master's job is not only to run the ship but to **make the next Master**.", "pts": ["Give them **real work** pitched at the right level of challenge.", "**Explain the reason** behind a decision, not only the decision.", "Let them **make small mistakes** in a safe situation.", "**Debrief** after a manoeuvre: what went well, what to do next time.", "**Praise in public, correct in private**.", "**Record** the progress in the appraisal and in the training record."], "ref": "STCW Regulation I/6 and the company training policy. On-board training forms part of ISM Element 6.", "k": "Describe the structure of a good debrief after a manoeuvre.", "u": "Explain why an officer whose work is always taken over never learns.", "p": "Lead the training of a Second Officer on a manoeuvre, from the briefing through to the debrief.", "stcw": "STCW Table A-II/2 — training and personnel management."});
T.push({"id": "fatigue", "r": "ma", "g": "Leadership", "t": "Fatigue and Workload Management", "lead": "Fatigue is a **safety hazard**, not a weakness. Managing it is the Master's duty.", "pts": ["**Minimum rest**: 10 hours in any 24 hours and 77 hours in any 7 days.", "The 10 hours can be split into **two periods only**, and one of them must be **not less than 6 hours**.", "The **record of rest hours** is kept true; a dressed-up record is a breach and hides the danger.", "Identify the **heavy days**: port call, inspection, bunkering and bad weather.", "**Change the plan** rather than push a tired team.", "The **signs of fatigue** are slow reaction, misreading and a short temper."], "ref": "STCW Code Section A-VIII/1 and MLC 2006 Standard A2.3. The record of hours of work or rest is compulsory and is inspected by PSC.", "k": "State the minimum rest hours and how they can be split.", "u": "Explain why a false rest record is more dangerous than admitting you are short of people.", "p": "Review one week of rest hour records, identify the breach, and build a new plan.", "err": "Rest hours were dressed up to pass an inspection. That hides the real danger and breaches MLC.", "stcw": "STCW Table A-II/2 — fitness for duty and fatigue management."});
T.push({"id": "culture", "r": "ma", "g": "Leadership", "t": "Cultural Awareness", "lead": "On a ship of mixed nationalities, **misunderstanding** usually comes not from the language but from the culture.", "pts": ["**Power distance**: in some cultures nobody contradicts a senior, even when they see an error.", "**Direct and indirect**: some people say it straight, others only hint at it.", "**Yes** is not always agreement; sometimes it means 'I heard you'.", "Use **closed-loop communication**: have the order repeated back.", "Respect **faith and food**; both are easy to arrange and both move morale.", "The **working language** has to be clear to everyone, and it is recorded."], "ref": "SOLAS V/14.3 — the working language is established and recorded in the log book. Bridge Resource Management deals with cultural barriers.", "k": "Describe how power distance shows itself on the bridge.", "u": "Explain why relying on a 'yes' without a read-back is dangerous.", "p": "Run a briefing using closed-loop communication and check whether it was really understood.", "stcw": "STCW Table A-II/2 — effective communication on board."});
T.push({"id": "motiv", "r": "ma", "g": "Leadership", "t": "Crew Motivation and Discipline", "lead": "Morale is **built, not lucky**. Discipline is there for safety, not for punishment.", "pts": ["**Food, sleep and internet** are the three biggest real drivers of morale.", "**Fair sharing** of the heavy work and the light work.", "**Recognise good work** in front of others, specifically and not in general terms.", "**Discipline follows a set path**: warning, written warning, then formal action.", "**The same for everyone**; favourites kill morale.", "**Record** every step; you need it when it reaches dismissal."], "ref": "MLC 2006 and the company disciplinary procedure. An unjust punishment can become a complaint to the flag State or to the labour authority.", "k": "State the steps of your company's disciplinary procedure.", "u": "Explain why a consistent standard works better than a heavy punishment.", "p": "Lead a formal warning, covering the writing, the meeting and the follow-up.", "stcw": "STCW Table A-II/2 — personnel management."});
T.push({"id": "mpx", "r": "ma", "g": "Leadership", "t": "Master–Pilot Relationship", "lead": "The pilot is an **adviser with local knowledge**. The Master still **carries the responsibility** for the ship.", "pts": ["**Master–Pilot Exchange** before the manoeuvre: plan, ship's limitations, tugs and berthing.", "Hand over a **pilot card** that is accurate and up to date.", "The **pilot does not replace the bridge team**; watchkeeping and monitoring go on.", "**Speak up** when you see a danger; use plain words.", "When the manoeuvre is not safe, **take the con** and record it.", "**Record** the pilot's boarding and disembarking times and the main orders."], "ref": "SOLAS V/34-1 — nobody shall restrain the Master from taking a decision for safety. IMO Resolution A.960 gives the guidance on the Master-Pilot exchange.", "k": "List the contents of the Master–Pilot Exchange and of the pilot card.", "u": "Explain why the Master's responsibility remains even with a pilot on the bridge.", "p": "Carry out a Master–Pilot Exchange, monitor the manoeuvre, and speak up on one occasion where it departs from the plan.", "err": "A wrong manoeuvre was watched in silence because 'the pilot is driving'. The Master still answers for it.", "stcw": "STCW Table A-II/2 — Master–Pilot relationship; bridge resource management."});
T.push({"id": "challenge", "r": "ma", "g": "Leadership", "t": "Challenge-and-Response Culture", "lead": "The best defence against an error is a **shipmate ready to speak up**.", "pts": ["Say at the briefing that **questions are expected**, and then live up to it.", "Use a **set form of words**: 'Captain, I am concerned because…'.", "**Two-challenge rule**: if you have asked twice and got no answer, act for safety.", "**Thank the one who challenges** even when they are wrong; if you do not, that was their last question.", "**Juniors and ratings** have to feel they are part of it too.", "After the manoeuvre, **ask whether anyone saw anything wrong** and talk it through without blame."], "ref": "Bridge Resource Management and STCW Code A-VIII/2 on bridge teamwork. Many accidents had a witness who saw it and said nothing.", "k": "State the set form of words for a challenge and explain the two-challenge rule.", "u": "Explain why a team stays silent even when it can see the danger.", "p": "Run a briefing that openly invites challenge, and answer one challenge positively.", "stcw": "STCW Table A-II/2 — bridge resource management."});
T.push({"id": "planreview", "r": "ma", "g": "Command Decisions", "t": "Passage Plan Review and Approval", "lead": "The passage plan is made by the Second Officer but **approved by the Master**. The signature is accountability.", "pts": ["Check the **appraisal**: were all the charts, publications and information used.", "Check the **UKC at every critical point**, not only at the shallowest.", "Check the **no-go areas, the abort point and the point of no return**.", "Check the **contingencies**: anchorage, safe place and alternative route.", "Make sure it is **berth to berth**, including the pilotage and the approach.", "**Explain the plan to the whole bridge team** before departure; do not just circulate it."], "ref": "SOLAS V/34 and IMO Resolution A.893(21) — Guidelines for voyage planning. The plan is berth to berth.", "k": "List the four stages of passage planning and what each one covers.", "u": "Explain why an abort point is needed before you enter a narrow channel.", "p": "Review and approve a complete passage plan and lead the bridge team briefing.", "err": "A plan was signed without looking at the pilotage stage. That is where groundings usually happen.", "stcw": "STCW Table A-II/2 — plan a voyage and conduct navigation."});
T.push({"id": "restvis", "r": "ma", "g": "Command Decisions", "t": "Restricted Visibility Decisions", "lead": "In thick fog a ship is not made safe by radar. It is made safe by the **right decision and the right speed**.", "pts": ["**Safe speed** under Rule 6; the ability to stop within the distance you can see.", "**Sound signals** under Rule 35 and the intervals between them.", "**Extra lookout** and hand steering.", "**Inform the engine room** and have the engine ready for manoeuvring.", "Rule 19: in an early alteration, **do not turn to port** for a vessel forward of the beam, and **do not close** a vessel abeam or abaft the beam.", "**Record** the time you entered the fog and every action you took."], "ref": "COLREGs Rules 5, 6, 19 and 35. Rule 19 differs from Rule 17; there is no stand-on vessel in restricted visibility.", "k": "State the three main parts of Rule 19 and the usual sound signals.", "u": "Explain why there is no stand-on vessel in restricted visibility and what that means for your manoeuvring.", "p": "Lead the bridge into thick fog, covering the briefing, the reduction of speed and the record.", "stcw": "STCW Table A-II/2 — maintain safe navigation; COLREGs."});
T.push({"id": "hwnav", "r": "ma", "g": "Command Decisions", "t": "Heavy Weather Navigation Decisions", "lead": "In a storm the decisions are about **avoidance, change of route and change of speed**, not about courage.", "pts": ["**Tropical revolving storm**: know the dangerous semicircle and the navigable semicircle.", "**1-2-3 rule** for the forecast error of a storm at 24, 48 and 72 hours.", "Avoid **synchronous rolling** and **parametric rolling**; change the speed or the heading.", "**Broaching** is the danger in a following sea; avoid a speed that matches the waves.", "**An early change of route** costs less than the damage.", "**Record the reason** for every decision; that is your defence against a performance claim."], "ref": "IMO MSC.1/Circ.1228 — Revised guidance to the master for avoiding dangerous situations. Each ocean has its own storm warning service.", "k": "Describe the dangerous and navigable semicircles and the 1-2-3 rule.", "u": "Explain the difference between synchronous and parametric rolling and the remedy for each.", "p": "Plan the avoidance of a tropical storm, covering route, speed and the time of decision, and record the reason.", "stcw": "STCW Table A-II/2 — manoeuvre and handle a ship in all conditions."});
T.push({"id": "anchordec", "r": "ma", "g": "Command Decisions", "t": "Anchoring Decisions", "lead": "Anchoring looks simple until the **anchor drags** at midnight with the wind up.", "pts": ["**Choose the place**: depth, nature of the bottom, swinging room and how close others are.", "**Scope**: normally 5 to 7 times the depth in moderate weather, more in bad weather.", "**Method**: walk back in deep water; let go only in shallow water and light weather.", "**Anchor watch**: a fixed bearing, radar range and the GPS anchor alarm.", "**Signs of dragging**: a change of bearing, the cable vibrating, and loss of tension.", "**Engine ready** at short notice when the weather is bad."], "ref": "IACS UR A1 — the anchoring equipment is for temporary mooring in harbour and sheltered areas, up to 11 knots of current and 48 knots of wind on good holding ground.", "k": "Calculate the scope needed for a given depth and state the anchor watch procedure.", "u": "Explain why the anchor gear cannot hold a ship in a storm and what to do before it arrives.", "p": "Lead an anchoring operation, set the anchor watch, and decide when to leave the anchorage.", "err": "The ship stayed at the anchorage with a storm closing in. Getting out to sea is nearly always safer.", "stcw": "STCW Table A-II/2 — manoeuvre the ship; anchoring operations."});
T.push({"id": "colav", "r": "ma", "g": "Command Decisions", "t": "Collision Avoidance Oversight", "lead": "The Master's job is not to make every alteration but to **make sure the whole team keeps the standard**.", "pts": ["Set a **CPA and TCPA limit** in the standing orders, matched to the area and the traffic.", "**Early action and a large alteration** are safer than a small, late one.", "**Do not rely on a VHF agreement** to keep clear; follow the COLREGs.", "Check whether the officer is **standing on** for far too long.", "Make sure **ARPA and AIS are used properly** and that their limitations are known.", "**Call me** is the most important line in the standing orders; make it clear when."], "ref": "COLREGs Rules 7, 8, 15, 16 and 17. Many collisions happen in good weather and in broad daylight.", "k": "State the CPA and TCPA limits in your standing orders and when the Master is to be called.", "u": "Explain why a VHF agreement is dangerous and why many companies forbid it.", "p": "Review a watch officer's collision avoidance in the simulator and give a debrief with specific points.", "stcw": "STCW Table A-II/2 — maintain safe navigation; COLREGs."});
T.push({"id": "standorders", "r": "ma", "g": "Command Decisions", "t": "Master's Standing and Night Orders", "lead": "Standing orders are **permanent** and night orders are **for that night**. They are two different documents.", "pts": ["**Standing orders**: the general standard, the CPA limit, when to call, and the use of equipment.", "**Night orders**: the particular concerns for that night, the route and the weather.", "They must be **specific and measurable**, not 'be careful'.", "**Signed by every watch officer** as proof that it was read and understood.", "Update them when **the conditions change**: area, traffic, weather or equipment.", "The most important line: **call me when in doubt, at any hour**."], "ref": "STCW Code Section A-VIII/2 and SOLAS V/34-1. Standing orders form part of the SMS and are examined in audits.", "k": "State the difference between standing and night orders and who signs them.", "u": "Explain why a vague order such as 'be careful' is worthless in an investigation.", "p": "Write standing orders and night orders for one particular passage, and explain each limit.", "err": "The night orders were the same every night. Nobody read them any more and they lost all value.", "stcw": "STCW Table A-II/2 — maintain a safe navigational watch; leadership."});
T.push({"id": "ffeport", "r": "to", "g": "Fire Fighting Equipment", "t": "Portable Fire Extinguishers", "lead": "The portable extinguisher is the **first weapon** against a small fire. It is useless when the type is wrong, the charge is low, or the user does not know how.", "pts": ["**CO₂** for electrical fires and for burning liquid. No residue, but it loses its effect in open air and is dangerous in a closed space.", "**Dry powder** for almost every class; powerful but dirty to clean up, and only temporary while the object is still hot.", "**Foam** for liquid; it blankets the surface so no air gets in. Not on live electrical.", "**Water** for solid material only. Not on oil and not on electricity.", "**Monthly check**: pressure, seal, pin, hose, weight, date of the last service, and clear access to the place.", "**Annual service** by a trained person, and a **hydrostatic test** as the maker requires. CO₂ is **weighed**, not read off a gauge.", "Use **PASS**: Pull, Aim at the base of the fire, Squeeze, Sweep. Back away without turning your back on the fire."], "ref": "SOLAS II-2/10.3 and FSS Code Chapter 4. There must be a **spare charge or an additional extinguisher** for 100 per cent of the first 10 extinguishers and 50 per cent of the rest, not exceeding 60.", "k": "Match the type of extinguisher to the class of fire and state what each one contains.", "u": "Explain why a pressure gauge is not enough for CO₂ and why it is weighed instead.", "p": "Carry out the monthly inspection of one extinguisher, weigh the CO₂, and record the result on the checklist.", "err": "The gauge read full but the charge was low. With CO₂, only the **weight** tells the truth. More than 10 per cent below the stamped weight means it needs a recharge.", "stcw": "STCW Table A-VI/3 — advanced fire fighting; use of fire-extinguishing equipment."});
T.push({"id": "ffehyd", "r": "to", "g": "Fire Fighting Equipment", "t": "Fire Hydrants, Hoses and Nozzles", "lead": "The fire main is the backbone of fire fighting. **Any part of the ship must be reachable by two jets** from two different hydrants.", "pts": ["**Hydrant**: easy to open, not corroded and not obstructed. One valve, one hose.", "**Hose**: kept connected to the hydrant with its nozzle inside the accommodation and in the machinery space, ready for immediate use.", "**Length**: not more than 15 m in the machinery space, 20 m in other spaces, and 25 m on the open deck of wide ships.", "**Nozzle**: dual purpose, **jet and spray**. The spray is your shield against the heat; the jet reaches far.", "**Nozzle sizes**: 12, 16 and 19 mm. In the accommodation 12 mm is enough.", "Check the **gasket, coupling and hose for holes**; test it under pressure, do not just look at it."], "ref": "SOLAS II-2/10.2 and FSS Code Chapter 2. The fire main must hold enough pressure at the furthest hydrant with two jets running.", "k": "State the hose length for each space and the two ways the nozzle is used.", "u": "Explain when to use spray and when to use jet, and why spray is safer as you close in.", "p": "Run out a hose from the hydrant, put the pressure on, and demonstrate the change from jet to spray.", "err": "A hose was left folded on the same crease for a long time until it burst on the first pressure. Change the fold at every inspection.", "stcw": "STCW Table A-VI/3 — fire-fighting appliances and their location on board."});
T.push({"id": "ffepump", "r": "to", "g": "Fire Fighting Equipment", "t": "Fire Pumps and Emergency Fire Pump", "lead": "No water, no fight. The **emergency fire pump** is the answer when the machinery space itself is on fire.", "pts": ["**Main fire pumps**: driven from the machinery space, giving pressure to the fire main.", "**Emergency fire pump**: sited **outside the machinery space**, with its own prime mover, its own fuel and a separate sea suction.", "The emergency pump must deliver **two jets** at the required pressure.", "Its capacity is not less than **40 per cent** of the total required of the fire pumps.", "It must be **startable with no power on the main switchboard** and in cold conditions.", "**Weekly testing** of every pump; record it in the logbook. Check the priming and the sea chest."], "ref": "SOLAS II-2/10.2.2. The emergency fire pump, its sea suction, its fuel and its source of power must all be **outside the space served by the main fire pumps**.", "k": "State where the emergency fire pump is on your ship and how it is started.", "u": "Explain why the emergency pump is worthless when it shares its source of power with the main pump.", "p": "Start the emergency fire pump single-handed, reach the pressure at the furthest hydrant, and record it.", "err": "At a PSC inspection you are asked to start it **without using main power and without entering the engine room**. That is where many ships fail.", "stcw": "STCW Table A-VI/3 — fire-fighting systems and their operation."});
T.push({"id": "ffeco2", "r": "to", "g": "Fire Fighting Equipment", "t": "Fixed CO₂ Fire-Extinguishing System", "lead": "Fixed CO₂ is the last line of defence in the machinery space. **You get to use it once** — there is no second chance.", "pts": ["**Two separate controls**: one to open the valve to the space, one to release the gas. It cannot go off by accident.", "**An alarm and a delay** before the gas comes out, so that everybody can get clear.", "**A complete head count before release** — this is the most important step.", "**Close every opening**: dampers, skylights, doors and ventilators. Stop the fans and the fuel pumps.", "The machinery space is **not opened until it has cooled** and until the BA team is ready; a sudden rush of air sets it alight again.", "**Annual inspection** of hoses, nozzles and piping; **weigh or level-check the cylinders** at the set intervals."], "ref": "SOLAS II-2/10.4 and FSS Code Chapter 5. For a machinery space the quantity of CO₂ covers the prescribed proportion of the gross volume, and **85 per cent must be discharged within 2 minutes**. The maintenance is in MSC.1/Circ.1318.", "k": "State the CO₂ release sequence from the alarm to the evacuation of the space.", "u": "Explain why opening the door early is more dangerous than waiting several hours.", "p": "Lead a CO₂ release drill with no actual discharge: head count, closing up, alarm and recording.", "err": "One ventilation damper was forgotten. The gas leaks away, the concentration falls, and the fire is still alive.", "stcw": "STCW Table A-VI/3 — fixed fire-extinguishing installations."});
T.push({"id": "ffedet", "r": "to", "g": "Fire Fighting Equipment", "t": "Fire Detection and Alarm System", "lead": "Early detection is the cheapest way to fight a fire. The panel on the bridge is the **eyes of the ship**.", "pts": ["**Smoke detectors** in the accommodation and the corridors; **heat detectors** in the galley and the hot spaces; **flame detectors** in the machinery space.", "**Manual call points** at every exit and in the corridors; everyone knows where the nearest one is.", "**Zones**: the panel tells you which part, not just that there is a fire. Learn the zone plan.", "The **fault alarm** must **sound different** from the fire alarm, so the two are never confused.", "**Weekly testing** of one section or detector; record which one was tested.", "**Do not isolate a zone without telling anyone** and without recording it; once it is isolated, post a fire watch."], "ref": "SOLAS II-2/7 and FSS Code Chapter 9. The system must have **two sources of power**, one of them the emergency source, and must give a visual and audible signal on the bridge.", "k": "Read the panel: the zone, the type of alarm, and whether it shows fault or fire.", "u": "Explain why habitually isolating a zone because of repeated false alarms is dangerous.", "p": "Carry out the weekly test of one detector, record it, and explain the response to a real alarm.", "err": "The galley zone was isolated because it went off every time somebody cooked, and it was never put back. That is where the fire started.", "stcw": "STCW Table A-VI/3 — fire detection systems and alarms."});
T.push({"id": "ffedoor", "r": "to", "g": "Fire Fighting Equipment", "t": "Fire Doors and Self-Closing Devices", "lead": "**Structural fire protection** is what holds a fire in one place. An open fire door is a hole in that defence.", "pts": ["**A-class and B-class divisions** hold back heat and smoke for a set number of minutes.", "A fire door must be **self-closing**; no wedge, wire or hook is allowed to hold it open.", "Hold-open devices tied into the system have a **remote release from the bridge**.", "Check the **gasket, hinges and latch**; the door must close fully and hold.", "**Do not pierce a division** for a cable or a pipe without the proper penetration seal.", "Try closing every fire door at **every fire drill**, not only at an inspection."], "ref": "SOLAS II-2/9 — fire integrity of bulkheads and decks. Doors in A-class divisions must be **self-closing** and able to close against a 25 degree angle of inclination.", "k": "Point out the fire doors in your accommodation and state which division each one protects.", "u": "Explain why a single wedged door is enough to let smoke spread through the whole accommodation.", "p": "Walk the accommodation, check every fire door, and correct any wedge or broken closer you find.", "err": "A door was wedged because it was noisy or heavy. At night it is the smoke that kills first, not the flame.", "stcw": "STCW Table A-VI/3 — structural fire protection and containment."});
T.push({"id": "ffedamp", "r": "to", "g": "Fire Fighting Equipment", "t": "Fire Dampers and Ventilation Shutdowns", "lead": "Fire lives on air. **Cutting the ventilation** is the first step before any attempt to put it out.", "pts": ["A **damper** closes the duct so that fire and smoke cannot pass into another space.", "The **remote stop** for a fan sits outside the space it serves; know where it is.", "Every control must be **clearly marked** with the space and the fan it operates.", "**Galley exhaust ducts** have their own damper and need **regular cleaning of the grease**.", "A machinery space shutdown covers the **fans, fuel pumps, purifiers and quick-closing valves**.", "**Operate the damper by hand** at an inspection; many are seized with paint or rust."], "ref": "SOLAS II-2/5.2 and II-2/9.7 — ventilation systems. Ventilation openings must be **closable from outside** the space they serve.", "k": "Point out the remote stop and the damper for the machinery space and for the galley on your ship.", "u": "Explain why CO₂ has no effect when one damper is still open.", "p": "Carry out a full ventilation shutdown of the machinery space during a drill and record the time taken.", "err": "The damper was only stamped as checked but never operated. In a real fire it did not move.", "stcw": "STCW Table A-VI/3 — closing of openings and stopping of ventilation."});
T.push({"id": "ffeba", "r": "to", "g": "Fire Fighting Equipment", "t": "EEBD, SCBA and Fireman's Outfit", "lead": "An **EEBD is for escape only** and is not a fire-fighting device. The **SCBA** is what you wear to enter. Two different sets of kit, two different purposes.", "pts": ["**EEBD**: roughly 10 minutes of air, enough only to get out. **Never use it to fight fire or to enter an enclosed space.**", "EEBDs are sited in the accommodation and machinery space, **marked and unobstructed**, with the escape route signed.", "**SCBA**: cylinder of not less than 1,200 litres or 30 minutes of air; fitted with a **low-pressure warning whistle**.", "**Fireman's outfit**: protective clothing, non-conductive boots and gloves, **rigid helmet**, a 3-hour safety lamp, **fire axe** and lifeline.", "Not less than **2 sets** of fireman's outfit on a normal cargo ship, stowed in **2 separate locations**.", "**Check pressure monthly**; test the face seal; record the cylinder hydrostatic test date."], "ref": "SOLAS II-2/10.10 and FSS Code Chapter 3. The EEBD sits under II-2/13 as a **means of escape** — it is not fire-fighting equipment.", "k": "State the difference between an EEBD and an SCBA and when each one is used.", "u": "Explain why using an EEBD to enter an enclosed space kills.", "p": "Don the full fireman's outfit and SCBA within the set time, check pressures, and take part in a BA team drill.", "err": "A man used an EEBD to take a quick look into a smoke-filled space. It holds only 10 minutes of air and gives no warning when it is running out.", "stcw": "STCW Table A-VI/3 — breathing apparatus and personal equipment."});
T.push({"id": "ffeisc", "r": "to", "g": "Fire Fighting Equipment", "t": "International Shore Connection", "lead": "Alongside, with no pressure left on board, the **ISC** is the only way the shore can put water into your fire main.", "pts": ["**One standard flange** that fits any ship and any port in the world.", "Outside diameter **178 mm**, inside **64 mm**, bolt circle **132 mm**, four holes of **19 mm**.", "The set includes **4 bolts, 8 washers, 4 nuts and 1 gasket** rated for fire main pressure.", "It must be **stowed on both sides and easy to reach**, not locked inside a locker in the engine room.", "An **adaptor** on the ship's side suits it to your own hydrant coupling.", "Check that the **bolts and gasket are complete** — these go missing over time."], "ref": "SOLAS II-2/10.2.1.7 and FSS Code Chapter 2 — not less than one international shore connection for ships of **500 gross tonnage and above**.", "k": "State the ISC dimensions and what the set must contain.", "u": "Explain why one worldwide standard size is needed.", "p": "Locate the ISC on board, check the set is complete, and show where it is connected.", "err": "The ISC was kept in an engine room locker. With the engine room on fire you cannot reach it — and that is the one place you need it.", "stcw": "STCW Table A-VI/3 — fire-fighting appliances and international shore connection."});
T.push({"id": "muster", "r": "to", "g": "Drills and Emergencies", "t": "Muster List and Emergency Duties", "lead": "The **muster list** tells every man what he does in an emergency. Nothing to work out — read it and move.", "pts": ["It states the **alarm signal** for each emergency and where the muster station is.", "**Every person is named with a specific duty**, and a **substitute** is named for when he is absent.", "It covers duties for **closing doors, dampers and valves**, and for preparing the survival craft.", "It must be **posted on the bridge, in the engine control room and in the accommodation**, in plain view.", "**Signed by the Master** and **updated before departure** whenever the crew changes.", "Each person also has a **cabin card**: alarm, muster station, duty and lifeboat number."], "ref": "SOLAS III/8 and III/37 — the muster list must be **prepared before the ship sails**, and if the crew changes it must be revised or a new one issued.", "k": "Find your own name on the muster list and state your duty for each type of alarm.", "u": "Explain why every duty needs a substitute and what happens when there is none.", "p": "Update the muster list after a crew change and brief the joiners on their new duties.", "err": "The muster list was out of date and still carried the name of a man who had signed off. To a PSC officer that is an instant deficiency.", "stcw": "STCW Table A-VI/1 — emergency procedures; muster and drills."});
T.push({"id": "absdrill", "r": "to", "g": "Drills and Emergencies", "t": "Abandon Ship Drill", "lead": "Leaving the ship is never the first option. But once it is the only option, **only the drill makes it quick**.", "pts": ["**Every crew member must take part in an abandon ship drill once a month.**", "If more than **25 per cent** of the crew are new, hold the drill **within 24 hours** of sailing.", "The drill covers mustering, head count, donning **lifejackets and immersion suits**, and starting the lifeboat engine.", "The **lifeboat must be lowered and manoeuvred in the water at least once every 3 months**.", "The **rescue boat is lowered monthly** as far as is practicable.", "For a **free-fall lifeboat**, run **simulated launching** plus a live launch at the required interval."], "ref": "SOLAS III/19.3 — drills. Each drill must be **conducted as if it were a real emergency** as far as practicable.", "k": "State how often an abandon ship drill is held and how often the lifeboat is launched into the water.", "u": "Explain the reason behind the 25 per cent new-crew rule.", "p": "Lead an abandon ship drill: alarm, muster, head count, equipment and debrief.", "err": "The same scenario and the same davit every time. Change the hour, run it at night, and move the seat of the fire.", "stcw": "STCW Table A-VI/1 — survival techniques; abandon ship procedures."});
T.push({"id": "firedrill", "r": "to", "g": "Drills and Emergencies", "t": "Fire Drill", "lead": "A fire drill is not a show for the logbook. It is the **only rehearsal** you get before the real fire.", "pts": ["**Once a month** for every crew member, held together with the abandon ship drill where appropriate.", "**Vary the scenario**: galley, engine room, cargo hold, paint locker, a cabin at night, and in port.", "Use the **real equipment**: fire pump, emergency pump, hoses, BA sets and fire doors.", "**Time it**: how long to form the BA team, and how long until water is on the seat of the fire.", "**Call the head count** and the boundary cooling, not just the attack.", "**Debrief afterwards**: one thing done well, one thing to fix, and who owns it."], "ref": "SOLAS III/19.3.4 — a fire drill includes reporting to muster stations, starting a fire pump, and checking the fireman's equipment and the **means of communication**.", "k": "List the parts of a complete fire drill and how often it is held.", "u": "Explain why the time to form the BA team matters more than the time to extinguish.", "p": "Design and lead a fire drill in a new location, time it, and deliver the debrief.", "err": "Always 10:00 and always the same compartment. Everyone knows what is coming, so nobody learns anything.", "stcw": "STCW Table A-VI/1 and A-VI/3 — fire prevention and fire fighting."});
T.push({"id": "encdrill", "r": "to", "g": "Drills and Emergencies", "t": "Enclosed Space Entry and Rescue Drill", "lead": "Most deaths in enclosed spaces are **not the first man in but the man who went to help**. That is where the drill earns its place.", "pts": ["**Hold an enclosed space entry and rescue drill at least once every 2 months.**", "The drill covers **checking the permit, testing the atmosphere, communications and harness**.", "**Practise recovering the casualty** with a rescue harness, tripod and stretcher through a narrow opening.", "**Nobody enters without a permit** and nobody enters alone; there is always an attendant outside.", "The **rescuer wears an SCBA**, never an EEBD; the EEBD is for escape only.", "Test **real communications** from inside the tank to the bridge — do not assume they work."], "ref": "SOLAS III/19.3.6 — enclosed space entry and rescue drills, at least once every two months. See also IMO Resolution A.1050(27).", "k": "State how often the drill is held and which gases are tested before entry.", "u": "Explain why more men die attempting the rescue than on the first entry.", "p": "Lead a rescue drill: permit, gas test, harness, casualty recovery and first aid.", "err": "A man saw his shipmate collapse and jumped straight in. Within 30 seconds there were 2 casualties inside.", "stcw": "STCW Table A-VI/1 — enclosed space entry and rescue."});
T.push({"id": "mobresp", "r": "to", "g": "Drills and Emergencies", "t": "Man Overboard Response", "lead": "The first 30 seconds decide the outcome. **Marker, position and eyes on the man** — before you turn anything.", "pts": ["**Shout and throw the lifebuoy with light and smoke** immediately, close to the man.", "Press the **MOB button** on the GPS and on the ECDIS to mark the position.", "**Detail a dedicated observer** with no other job than to keep sight of the man.", "**Williamson turn** when the fall was not seen or at night; it brings you back down the same track.", "**Anderson turn** when the fall was seen at once and the ship turns quickly; **Scharnov turn** when some time has passed.", "**Broadcast on VHF Channel 16**, call out the rescue boat crew, and prepare recovery on the lee side."], "ref": "SOLAS III/17-1 and the IAMSAR Manual Volume III. 3 turn methods are in common use; the choice depends on **when the fall was noticed**.", "k": "Describe the 3 turn methods and when each one is used.", "u": "Explain why the Williamson turn is chosen when nobody saw the man fall.", "p": "Carry out the full MOB response in the simulator or in a drill, including lowering the rescue boat and recovery.", "err": "They lost sight of the man because everyone was busy with the turn. One man's only duty is to look.", "stcw": "STCW Table A-II/1 — respond to a navigational emergency; search and rescue."});
T.push({"id": "emgsteer", "r": "to", "g": "Drills and Emergencies", "t": "Emergency Steering Drill", "lead": "When the bridge loses the helm, there is **local control in the steering gear room**. That is worth nothing if nobody has practised it.", "pts": ["**Hold an emergency steering drill at least once every 3 months.**", "It covers **direct control in the steering gear room**, communications with the bridge, and use of the **emergency compass repeater**.", "The crew must know how to **change over from one power unit to the other**.", "**Test the steering gear within 12 hours before departure**: full movement, indicators, and the remote control systems.", "The **route to the steering gear room must be clear**, lit, and have the instructions posted.", "Record the **response time** from the bridge order to movement of the rudder."], "ref": "SOLAS V/26 — steering gear testing and drills. The **emergency steering drill** is held at least once every 3 months, and **testing is within 12 hours before departure**.", "k": "State how often the tests and the drill are held, and where local control is.", "u": "Explain why communications between the bridge and the steering gear room are critical in manual steering.", "p": "Lead an emergency steering drill, measure the response time, and enter it in the logbook.", "err": "Communications were never tested because the steering gear room is noisy. On the real day, nobody heard a thing.", "stcw": "STCW Table A-II/1 — steering gear and emergency steering arrangements."});
T.push({"id": "sopepdrill", "r": "to", "g": "Drills and Emergencies", "t": "Oil Spill and SOPEP Drill", "lead": "The first 10 minutes of a spill decide whether it stays **a small incident or becomes a big case**.", "pts": ["**Stop the operation at once** and shut the valve; stopping comes before any clean-up.", "**Report immediately**: Master, duty officer, terminal and everyone on the SOPEP contact list.", "**Use the SOPEP locker**: absorbent, scupper plugs, sawdust, drums and protective gear.", "**Plug the scuppers** before bunkering starts, not after oil is on deck.", "**Photograph and record everything**: time, quantity, weather conditions and the actions taken.", "**Never hose it over the side.** Washing down with water makes the case far worse."], "ref": "MARPOL Annex I Regulation 37 — Shipboard Oil Pollution Emergency Plan. The plan carries the **list of contacts**, including the coastal State and the authorities.", "k": "List the contents of the SOPEP locker and state who you call first on your ship.", "u": "Explain why the penalty for trying to conceal a spill is heavier than for the spill itself.", "p": "Lead a SOPEP drill at the bunker station and complete the initial report form.", "err": "They washed the deck down before the terminal representative arrived. That is the moment an incident turns into a criminal case.", "stcw": "STCW Table A-II/1 — prevention of pollution of the marine environment."});
T.push({"id": "drillrec", "r": "to", "g": "Drills and Emergencies", "t": "Drill Records and Evidence", "lead": "To an investigator and to PSC, **no record means it never happened**. The record is the evidence that you trained.", "pts": ["Enter in the **logbook** the date, time, scenario, who took part and which equipment was used.", "If the **full drill was not completed**, record **which part was done and why** the rest was not.", "**Name those who took part**, not 'all crew'. The names are what prove you met the monthly requirement.", "Include the **debrief**: what was found, what action follows, who holds it and the target date.", "**Photographs** of a drill are strong evidence, especially of BA use and boat launching.", "Make sure the **record agrees with the maintenance record** and the checklist; they must not contradict each other."], "ref": "SOLAS III/19.5 — the dates of musters and drills, and details of drills not fully carried out, are **entered in the logbook prescribed by the Administration**.", "k": "State what detail a drill entry in the logbook must contain.", "u": "Explain why recording an incomplete drill is better than writing something untrue.", "p": "Write the full drill record for a fire drill, including the debrief and the follow-up action.", "err": "Someone copied last month's entry and changed only the date. An auditor spots it at once, and it destroys trust in every other record.", "stcw": "STCW Table A-VI/1 — records of training and drills."});
T.push({"id": "lookout", "r": "to", "g": "Bridge Watchkeeping", "t": "Lookout and Situational Awareness", "lead": "**Lookout** is more than looking outside. It is the **whole picture** of what is around you and what it will be in the next 10 minutes.", "pts": ["**Every sense and every aid**: eyes, ears, radar, AIS and VHF together.", "The **OOW can be sole lookout in daylight only**, when it is safe, and **help must be immediately available** when called.", "**At night, in thick weather and in heavy traffic, post a separate lookout.**", "**Scan systematically**: the full horizon, not only ahead; look astern as well.", "**Scan pattern**: eyes, radar, ECDIS, speed and helm, back to the eyes. Do not live on the screen.", "**Avoid fixating on one thing.** In many collisions everyone watched a single target while a second one hit them."], "ref": "COLREG Rule 5 and STCW Code A-VIII/2 Part 4-1. The OOW can be sole lookout in daylight only, after assessing the risk, and **must always be ready to call for extra hands**.", "k": "State when the OOW is permitted to keep lookout alone and when he is not.", "u": "Explain why fixating on a single target is one of the commonest causes of collision.", "p": "Keep a full watch with a proper scan pattern and correct reporting of every target.", "err": "He was head-down in the ECDIS adjusting a waypoint. A small craft with no AIS shows up to the eye only.", "stcw": "STCW Table A-II/1 — maintain a safe navigational watch; COLREGs."});
T.push({"id": "colregapp", "r": "to", "g": "Bridge Watchkeeping", "t": "COLREG Application on Watch", "lead": "Knowing the COLREGs by heart is not enough. What counts is that you **read the situation fast** and **act early**.", "pts": ["**Rule 7**: use all available means; a **steady bearing with decreasing range** means risk of collision.", "**Rule 8**: early, large and **apparent on radar and to the eye**. Small alterations are dangerous.", "**Rule 13 overtaking**, **Rule 14 head-on**, **Rule 15 crossing** — identify which one applies before you act.", "**Rule 16 give-way**: act early and clearly. **Rule 17 stand-on**: hold on, but act when it is plain the other is not acting.", "**Rule 19** in restricted visibility: there is **no stand-on vessel** there; the rules are different.", "**Do not use VHF** to agree a method of avoidance; many collisions started with a misunderstanding on the radio."], "ref": "COLREG 1972 Rules 5 to 19. A **course change shows up better than a speed change**, and a large change is the clearest message you can send.", "k": "Identify the situation from the lights and the bearing, and state who is the give-way vessel.", "u": "Explain why there is no stand-on vessel in restricted visibility under Rule 19.", "p": "Carry out a series of traffic encounters in the simulator and justify every decision.", "err": "A token alteration of 5 degrees. The other ship cannot see it on radar, and it usually ends in a last-minute swing.", "stcw": "STCW Table A-II/1 — COLREGs and safe navigational watch."});
T.push({"id": "tostand", "r": "to", "g": "Bridge Watchkeeping", "t": "Master's Standing Orders · Following Them", "lead": "The standing orders are **the limit of your authority**. Inside them you decide; outside them you call the Master.", "pts": ["Read and **sign** the standing orders when you join and again whenever they change.", "Know the **CPA and TCPA limits** and do not wait until it is close before acting.", "Know the exact **list of occasions for calling the Master** and follow it to the letter.", "**When in doubt, call.** No Master was ever angry at being called; plenty have been angry at not being called.", "Calling is **not weakness**; it is correct use of the bridge resource.", "**Enter in the logbook** when the Master was called and the time he arrived on the bridge."], "ref": "STCW Code A-VIII/2 and SOLAS V/34-1 — the Master lays down the instructions, and the OOW has a duty to comply with them.", "k": "State from memory 5 occasions on which you will call the Master.", "u": "Explain why an early call is a better decision than a wrong independent action.", "p": "On a simulator watch, identify the right moment to call and carry out a full handover to the Master.", "err": "He waited because he did not want to wake the Master. By the time the Master came up, there was no time and no sea room left to avoid.", "stcw": "STCW Table A-II/1 — maintain a safe navigational watch; bridge resource management."});
T.push({"id": "nightord", "r": "to", "g": "Bridge Watchkeeping", "t": "Night Orders", "lead": "**Night orders** apply to that night only: this passage, this weather, and the Master's particular concern.", "pts": ["Read them **before the watch starts**, not halfway through it.", "Look for the **specific orders**: speed, UKC, time of course change, and the area to watch.", "**Sign** them after reading; the signature is the proof that you understood.", "If **anything is unclear, ask at once** — before the Master turns in.", "**Record what happened** against the orders; for example, why a given time was not met.", "Night orders **do not replace** the standing orders; they add to them."], "ref": "Part of the SMS and of STCW Code A-VIII/2. In an investigation, the **signature on the night orders** is the first thing looked for as evidence of handover.", "k": "State the difference between standing orders and night orders.", "u": "Explain why you must ask at once instead of guessing what an order means.", "p": "Read a night order, brief your lookout on it, and record compliance through the watch.", "err": "He signed without reading. When something goes wrong, your signature says you knew the order.", "stcw": "STCW Table A-II/1 — watch handover and Master's instructions."});
T.push({"id": "brlog", "r": "to", "g": "Bridge Watchkeeping", "t": "Bridge Logbook Entries", "lead": "The logbook is a **legal document**. After 2 years it is the only memory the ship has left.", "pts": ["Write the **time, position, course, speed, weather and sea state** at the set interval.", "Record **every change of course and speed** and the reason for it.", "Record the **call to the Master**, his arrival on the bridge, and the transfer of the conn.", "**Nothing covered over, nothing erased.** If it is wrong, one line through it, write the correction, and sign.", "Write **what you saw and what you did**, not opinion. 'Target observed at 6 miles, altered 20 degrees to starboard.'", "**Tense and full times** — a vague time is the first thing attacked in an investigation."], "ref": "SOLAS V/28 — Records of navigational activities. The records must be **kept for the period required by the Administration**, and must include the details important to the safety of navigation.", "k": "List the items that must always be recorded in the bridge logbook.", "u": "Explain why an erased entry is not accepted as evidence.", "p": "Write a complete entry for one incident, from first observation through to resolution.", "err": "He wrote up the whole watch at the end of it from memory. The times did not match the VDR and the record lost all its value.", "stcw": "STCW Table A-II/1 — keep records of navigational activities."});
T.push({"id": "posmon", "r": "to", "g": "Bridge Watchkeeping", "t": "Position Monitoring", "lead": "Knowing where you are is not enough. You also have to know whether **the source of that position is sound**.", "pts": ["Use **at least 2 independent methods**: GPS and a radar fix, or visual bearings.", "**Set the fix interval** by the risk: more often on the coast and in narrow channels.", "**Parallel indexing** on radar is the fastest way to see that you are drifting off the track.", "**Cross-check the GPS** against a radar range from a known object; if they disagree, do not believe the GPS.", "**Mark the cross-track error** and its limit on the passage plan.", "Check the **chart datum against the GPS datum**; the wrong datum shifts your position by several hundred metres."], "ref": "SOLAS V/19 and the passage plan under A.893(21). The **position fixing interval** is part of the approved plan — it is not picked at will on the bridge.", "k": "State the required fix interval for each leg of your current voyage.", "u": "Explain why relying on a single GPS is dangerous even when it looks correct.", "p": "Carry out an hour of coastal navigation using radar fixes, visual bearings and parallel indexing.", "err": "He looked at the ECDIS and assumed it was right. Nobody noticed the ship had been set out of the track by the current.", "stcw": "STCW Table A-II/1 — determine position by all available means."});
T.push({"id": "pilotsup", "r": "to", "g": "Bridge Watchkeeping", "t": "Pilotage Support", "lead": "The pilot is an **adviser**; the Master remains responsible. Your job is to **monitor the plan**, not to go quiet.", "pts": ["**Master–Pilot Exchange** before you start: plan, speed, tugs, berth and emergencies.", "**Keep fixing the position** while the pilot is on board; this is the thing most often dropped.", "**Repeat back every order** from the pilot and log helm and engine orders in the bell book.", "**Speak up when you see something wrong.** Silence on the bridge is the biggest hazard in pilotage.", "Check the **pilot ladder**: correct length, sound steps, manropes, lifebuoy and lighting.", "Watch the **UKC and the no-go areas** even when the pilot says it is safe."], "ref": "SOLAS V/23 for pilot transfer arrangements and IMO Resolution A.960(23) for the Master–Pilot Exchange. The pilot's arrival **does not remove the duties** of the Master or the OOW.", "k": "State the content of the Master–Pilot Exchange and the safety checks on the pilot ladder.", "u": "Explain why the Master's responsibility does not pass to the pilot on the bridge.", "p": "Carry out a full pilotage watch: exchange, monitoring, bell book, and challenge when something is wrong.", "err": "The OOW said nothing although he could see the ship heading into shoal water. Respect for the pilot is no reason to keep quiet.", "stcw": "STCW Table A-II/1 — bridge resource management; pilotage."});
T.push({"id": "anchwatch", "r": "to", "g": "Bridge Watchkeeping", "t": "Anchor Watch", "lead": "A ship at anchor is **still moving**. An anchor watch is a real watch, not a rest period.", "pts": ["**Anchor circle** on the ECDIS: radius equal to the cable paid out plus the ship's length; set the alarm.", "**Fix regularly** by visual bearings or radar on a fixed object, not by GPS alone.", "Watch the **direction and strength of the wind and current**, and how the ship swings.", "**Signs of dragging**: a beam bearing that stops changing, the cable juddering, and the ship moving outside the anchor circle.", "Keep the **engine at the readiness** the Master ordered; know the notice time.", "**Correct lights and shapes**: anchor ball by day, anchor light by night. Keep a VHF watch and watch around you."], "ref": "COLREG Rule 30 for the lights and shapes of a vessel at anchor, and STCW Code A-VIII/2 Part 4-1 for the watch at anchor.", "k": "State the correct lights and shapes for a vessel at anchor and how to set the anchor circle.", "u": "Explain how to recognise dragging before the alarm sounds.", "p": "Keep an anchor watch with fixes, an anchor circle and proper records; identify dragging in the simulator.", "err": "He relied on the GPS anchor alarm alone. It went off far too late, because the radius had been set too big.", "stcw": "STCW Table A-II/1 — maintain a safe navigational watch at anchor."});
T.push({"id": "lsainv", "r": "to", "g": "Safety Administration", "t": "LSA and FFE Inventory and Certificates", "lead": "The **Safety Equipment Certificate** comes with a **Record of Equipment**. What is listed there is what must be on board — nothing short.", "pts": ["**Form E** is the list of LSA and FFE required for your ship; work from it.", "Match the **actual count** to the list: lifebuoys, lifejackets, immersion suits, extinguishers, BA sets and spare charges.", "Watch the **expiry dates**: pyrotechnics, EPIRB battery and HRU, inflatable liferafts and lifejacket lights.", "**Annual and 5-yearly servicing** of liferafts, davits, hooks and inflatable lifejackets, by an approved service station.", "**Keep the service report** and the certificate; PSC asks for these before it looks at the equipment.", "**Run an expiry tracker** set 6 months ahead, not in the month the item expires."], "ref": "SOLAS I/12 and the Safety Equipment Certificate with its **Record of Equipment (Form E)**. Servicing of inflatable appliances is in SOLAS III/20 and MSC.1/Circ.1206.", "k": "Find your ship's Form E and match one page of it against the actual equipment.", "u": "Explain why one missing lifejacket can become a detainable deficiency.", "p": "Carry out a full LSA and FFE inventory, build the expiry tracker, and identify what is close to expiry.", "err": "The pyrotechnics expired at sea because the order was never raised. That order should go in 6 months ahead.", "stcw": "STCW Table A-II/1 — monitor compliance with legislative requirements."});
T.push({"id": "seqpms", "r": "to", "g": "Safety Administration", "t": "Safety Equipment PMS", "lead": "**Planned maintenance** is what keeps the equipment alive. An inspection only finds the fault; the PMS prevents it.", "pts": ["**Weekly**: lifeboat engine, emergency lighting, alarm system, fire pump and a test of one detector.", "**Monthly**: lifeboat and davit, lifejackets, extinguishers, BA sets, EEBDs and all fire hoses.", "**Annual and 5-yearly**: liferafts, davit load test, hook release gear, inflatable lifejackets and hydrostatic tests.", "**Use the maker's manual**, not a generic list; every make calls for something different.", "**Spare parts**: hold the required quantity and watch the stock before it runs out.", "**The record is part of the job**, not an extra. No record, no maintenance in the eyes of PSC."], "ref": "SOLAS III/20 for operational readiness, maintenance and inspections of LSA, and SOLAS II-2/14 for the FFE maintenance plan. See also MSC.1/Circ.1432.", "k": "State the weekly, monthly and annual requirements for LSA and FFE.", "u": "Explain why a generic checklist is not enough when the maker supplies its own manual.", "p": "Build a one-month PMS schedule for LSA and FFE and carry out one week of it.", "err": "The job was signed off as done, but with no signature and no sign of any work. In an audit that counts as not done.", "stcw": "STCW Table A-II/1 — ensure compliance with maintenance requirements."});
T.push({"id": "defrep", "r": "to", "g": "Safety Administration", "t": "Defect Reporting", "lead": "Broken equipment is not a fault of yours. **Not reporting it** is.", "pts": ["**Report at once**: what has failed, when it was noticed, and the effect on safety.", "**Put a temporary safeguard in place**: fire watch, isolation, warning notice, or a ban on use.", "**Tell the company** if the defect affects a certificate or the ship's operation.", "**Enter it in the defect list** with a number, date, status and the person holding it.", "**Follow the status** through to repair; an open defect with no movement looks bad in an audit.", "If a **conditional or short-term certificate** is issued, know the deadline and have the repair ready before it."], "ref": "ISM Code Element 9 — reports and analysis of non-conformities, accidents and hazardous occurrences, and Element 10 — maintenance of the ship and equipment.", "k": "State what a proper defect report must contain.", "u": "Explain why an unreported defect is treated more seriously than the defect itself.", "p": "Write a defect report for a fire detector that has failed, including the temporary measure.", "err": "They held it over to the next port because it was 'only small'. When PSC came aboard, that small defect became a big question about the whole system.", "stcw": "STCW Table A-II/1 — report defects and deficiencies."});
T.push({"id": "pscchk", "r": "to", "g": "Safety Administration", "t": "PSC Preparation Checklist", "lead": "You do not prepare the ship on the day PSC arrives. **You prepare her every day**; the checklist is only a reminder.", "pts": ["**Certificates**: valid, not expired, with name, number and dates all agreeing.", "**Drills and records**: monthly and 3-monthly requirements complete and signed.", "**LSA and FFE**: accessible, marked, free of rust and in date.", "**Accommodation and galley**: clean, no fire door wedged open, no escape route blocked.", "**Oil Record Book and Garbage Record Book**: no blanks and no contradictions.", "**Rest hours**: consistent with the logbook and the overtime record; this is often looked at first."], "ref": "Port State Control is carried out under SOLAS I/19, MARPOL and the Paris and Tokyo MOU. The **detainable deficiencies** are listed in the MOU procedures.", "k": "List the first 10 things a PSC officer will look at on boarding.", "u": "Explain why cleanliness and good order set the first impression of the whole ship.", "p": "Carry out a self-inspection with the PSC checklist and correct the findings before the inspector arrives.", "err": "A rushed clean-up on the last night. An inspector sees the difference between what was done yesterday and what is done routinely.", "stcw": "STCW Table A-II/1 — monitor compliance with legislative requirements."});
T.push({"id": "flagsup", "r": "to", "g": "Safety Administration", "t": "Flag State and Class Inspection Support", "lead": "Your job at a survey is to **have the equipment and the records ready**, and to escort the surveyor prepared to answer.", "pts": ["Know the **type of survey**: annual, intermediate, renewal or occasional, and what it covers.", "**Prepare access**: tanks, holds, voids and the equipment to be examined; clean and ventilate well in advance.", "**Prepare the records**: PMS, drill records, calibrations, and the last report with the actions taken on it.", "**Escort the surveyor** and write down every observation as it is made; do not rely on memory.", "**Do not over-promise.** State the true condition and the repair plan.", "**Close out every observation** with evidence: photographs, invoices and a fresh record."], "ref": "SOLAS I/6 and I/7 — survey and inspection. Class acts as a Recognised Organization for the Flag in many statutory surveys.", "k": "State the types of survey and what is prepared for each one.", "u": "Explain why declaring a defect early is better than having the surveyor find it.", "p": "Prepare for an annual safety equipment survey: access, records and a list of known defects.", "err": "They forgot the previous report. The first thing a surveyor looks for is whether the old observations were closed out.", "stcw": "STCW Table A-II/1 — survey and certification support."});
T.push({"id": "signage", "r": "to", "g": "Safety Administration", "t": "Safety Signage and IMO Symbols", "lead": "In smoke and confusion **nobody reads — they look for a symbol**. That is why the right sign matters.", "pts": ["**IMO symbols** are the standard; one meaning worldwide, whatever language the crew speaks.", "**Escape routes** marked with **low-location lighting** or photoluminescent marking in the accommodation.", "Mark **every LSA and FFE station** and its contents, legible from a distance.", "**Muster stations and embarkation points** clearly marked and unobstructed.", "**Remote stops, dampers and valves** labelled with the space each one serves.", "**Replace faded signs.** A sign you cannot read is the same as no sign at all."], "ref": "SOLAS II-2/13 for means of escape and IMO Resolution A.1116(30) — Escape route signs and equipment location markings, which superseded A.760(18).", "k": "Identify the common IMO symbols for LSA and FFE without any text.", "u": "Explain why a symbol matters more than words to a crew of mixed nationalities.", "p": "Walk the accommodation, identify missing or faded signs, and prepare a replacement list.", "err": "A coat of fresh paint went over the photoluminescent strip. At night and in smoke, the way out disappeared.", "stcw": "STCW Table A-VI/1 — escape routes and safety signs."});
T.push({"id": "squat", "r": "ma", "g": "Ship Handling", "t": "Shallow Water, Bank Effect and Squat", "lead": "In shallow water **the ship behaves differently**. She sinks lower, answers more slowly, and the helm turns sluggish.", "pts": ["**Squat**: the ship sinks bodily and changes trim while running in shallow water; it grows with the **square of the speed**.", "The **most effective remedy is to slow down.** Halving the speed cuts squat by roughly **4 times**.", "In **shallow water the rudder response slows** and the turning circle grows.", "**Bank effect**: the stern is drawn towards the bank and the bow pushed away; it becomes a sheer if you do not counter it early.", "**Interaction** when meeting and overtaking in a narrow channel: act early and reduce speed.", "**Squat on a full-bodied bulk carrier is greater** than on a fine-formed ship at the same speed."], "ref": "Part of the UKC policy in the SMS and of passage planning under IMO Resolution A.893(21). Many companies set a **minimum UKC as a percentage of draft** in shallow areas.", "k": "State the causes of squat and how it changes with speed.", "u": "Explain why the rudder and the engine behave differently in shallow water.", "p": "Plan a transit of a shallow channel: UKC, speed, tugs and the abort points.", "err": "She was pushed on to make the tide window. The extra squat ate up what was left of the UKC.", "stcw": "STCW Table A-II/2 — manoeuvre the ship; shallow water effects."});
T.push({"id": "pilotarr", "r": "ma", "g": "Ship Handling", "t": "Pilot Transfer Arrangement", "lead": "Pilots are still being killed on the climb. The **ladder and everything around it** are the Master's responsibility, not the bosun's alone.", "pts": ["**One continuous length of ladder** to the point of access, with no joins and no shackles in the middle.", "Where the height from the water is **more than 9 m, use a combination ladder** with an accommodation ladder.", "**Manropes, a lifebuoy with self-igniting light, a heaving line and a stretcher** ready at the position.", "**Adequate lighting at night**, both on the ladder and on deck; no discharge running down over the ladder.", "A **responsible officer** at the transfer position with radio communication to the bridge.", "**Check every step and the side ropes**; scrap any ladder showing signs of damage. You do not nurse it along."], "ref": "SOLAS V/23 and IMO Resolution A.1045(27) as amended by Resolution A.1108(29) — pilot transfer arrangements. The ladder carries its **own marking and record of manufacture**.", "k": "State the equipment required at the pilot transfer station and the height at which a combination ladder is needed.", "u": "Explain why shackles and joins in the middle of a ladder are prohibited.", "p": "Inspect the whole pilot transfer arrangement before the pilot arrives and correct what you find.", "err": "The ladder was sound but a discharge was running down beside it. The pilot's route was wet, slippery and dark.", "stcw": "STCW Table A-II/2 — pilot embarkation and disembarkation arrangements."});
T.push({"id": "emgman", "r": "ma", "g": "Ship Handling", "t": "Emergency Manoeuvres", "lead": "When it turns critical, **the manoeuvre is your last defence**. You must already know what your ship can do before that moment comes.", "pts": ["**Crash stop**: know your ship's true head reach, laden and in ballast.", "**Emergency turn**: early full rudder works better than braking at the last moment.", "**Beaching** as a last resort against sinking; pick a soft, shallow bottom.", "**Anchors as a brake** in harbour: hard on the cable, but sometimes the only means you have.", "**Protecting the ship after a collision**: do not pull clear at once if the other ship is plugging the hole.", "The **manoeuvring booklet and the wheelhouse poster** are where the figures come from; read them before you need them."], "ref": "SOLAS V/28 and IMO Resolution A.601(15) — Provision and display of manoeuvring information on board ships. The **pilot card, wheelhouse poster and manoeuvring booklet** must be displayed.", "k": "State the head reach and the turning circle of your ship, laden and in ballast.", "u": "Explain why avoiding with the rudder is usually better than a crash stop.", "p": "Carry out a crash stop and an emergency turn in the simulator and compare with the ship's recorded data.", "err": "He relied on figures taken at sea trials in ballast. Laden, the head reach was nearly double.", "stcw": "STCW Table A-II/2 — manoeuvre and handle a ship in all conditions."});
T.push({"id": "charter", "r": "ma", "g": "Chartering and Commerce", "t": "Voyage and Time Charter Basics", "lead": "The type of charter tells you **who pays for what** and to whom you report. It is the foundation of every commercial decision.", "pts": ["**Voyage charter**: the owner carries the cargo from A to B at a freight rate; **the owner pays for bunkers and port costs**.", "**Time charter**: the charterer hires the ship by the day; **the charterer pays for bunkers and port costs** and orders the routing.", "**Bareboat charter**: the whole ship is hired without crew; the liabilities are different again.", "On time charter the **Master follows the charterer's employment orders** but **never an order that is unsafe**.", "**Off-hire**: when the ship cannot be used because of a breakdown or a delay that is the ship's fault, hire stops.", "**Read the charter party clauses** that bear on the Master: notices, bunkers, speed and cargo documents."], "ref": "Common forms: **GENCON** for voyage charter, **NYPE and BALTIME** for time charter. The Master is normally part of the chain of command in the employment clause.", "k": "State the difference between voyage, time and bareboat charter and who pays for bunkers.", "u": "Explain why the Master can refuse a charterer's order even though the charter is signed.", "p": "Read the Master's clauses of a charter party and list your obligations at each port.", "err": "An unsafe order was obeyed because 'the charterer is paying'. Safety never sits below commerce.", "stcw": "STCW Table A-II/2 — commercial management and chartering awareness."});
T.push({"id": "laytime", "r": "ma", "g": "Chartering and Commerce", "t": "Laytime and Demurrage Awareness", "lead": "Laytime is the **time the charterer has bought** to load and discharge. Run over it and a payment called demurrage falls due.", "pts": ["**Laytime** starts after the NOR and the turn time set in the charter party.", "**Demurrage**: the penalty for running over; **despatch**: the reward for finishing early. Despatch is usually half the demurrage rate.", "**Weather working day**: time when work is impossible because of weather does not count, where the charter says so.", "**SHEX and SHINC**: Sundays and holidays excepted or included; a large difference in the final total.", "The **Statement of Facts and the time sheet** are what the calculation rests on; your record is the owner's case.", "**Record every stoppage**: rain, crane breakdown, no trucks, and whose fault it was."], "ref": "The laytime rules are in the charter party. BIMCO's **Laytime Definitions for Charter Parties** are also used as a reference where the agreement is unclear.", "k": "State when laytime starts and what demurrage and despatch mean.", "u": "Explain why the quality of your SOF decides whether the owner wins the claim.", "p": "Build a time sheet from a Statement of Facts and calculate the laytime used.", "err": "He wrote 'rain stopped work' with no exact times. The exception cannot be counted and the owner loses the money.", "stcw": "STCW Table A-II/2 — commercial operation and documentation."});
