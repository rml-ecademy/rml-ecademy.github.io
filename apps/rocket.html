<!doctype html>
<html lang="en"><head><script>window.ECADEMY_START = window.ECADEMY_START || (location.hash.slice(1) || undefined);</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECADEMY Rocket Parachute Flare Training</title>
<style>
:root{--bg:#0d1417;--panel:#121b1f;--line:#2a3a41;--tx:#e6eef0;--mut:#9fb2b8;--acc:#5ee6a8;--hi:#f2c14e}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#0a1013;color:var(--tx);font:16px/1.55 "Segoe UI",Arial,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#070b0d;border-bottom:1px solid var(--line);flex-wrap:wrap}header b{letter-spacing:.14em;color:#ff5a6a}header .sub{color:var(--mut);font-size:13px}header .sp{flex:1}
.btn{background:#1a252a;color:#e8f0f2;border:1px solid #3e535c;border-radius:4px;padding:7px 14px;cursor:pointer;font:600 13.5px "Segoe UI",Arial;letter-spacing:.02em}.btn:hover{border-color:#8fb3bf}.btn.on{background:#21404a;border-color:#7fd6ee;color:#fff}
.btn.big{font-size:15px;padding:9px 22px}.btn.go{background:#1f5a3f;border-color:#3f9a6f}.btn:disabled{opacity:.4;cursor:default}
.steps{display:flex;gap:4px;padding:8px 14px;overflow-x:auto;background:#0c1316;border-bottom:1px solid var(--line)}
.steps button{flex:0 0 auto;background:transparent;border:1px solid #2a3a41;color:#b9c8cc;border-radius:3px;padding:5px 11px;font:600 12.5px "Segoe UI",Arial;cursor:pointer;white-space:nowrap;position:relative}
.steps button.on{background:#e8eef0;color:#0b1215;border-color:#e8eef0}.steps button.ok{border-color:#3f9a6f}.steps button.ok::after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:#5ee6a8}
main{flex:1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(340px,1fr);gap:12px;padding:12px;min-height:0}
@media(max-width:980px){main{grid-template-columns:1fr}}
.stage{background:#05090b;border:1px solid var(--line);border-radius:6px;position:relative;overflow:hidden;min-height:440px;display:flex;align-items:center;justify-content:center}
.stage svg,.stage canvas{max-width:100%;max-height:100%;display:block}
.text{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 20px;overflow-y:auto}
.text h2{margin:0 0 2px;font-size:24px;color:#fff;font-weight:700}.text .kick{color:var(--mut);font-size:13.5px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.text p{margin:8px 0}.text b{color:var(--hi);font-weight:700}
.lead{font-size:19px;font-weight:600;color:#fff;line-height:1.45}
.key{border-left:4px solid var(--hi);background:#1a1a12;padding:9px 12px;margin:12px 0;font-size:15px}.key::before{content:"KEY POINT";display:block;font:800 11px Arial;letter-spacing:.14em;color:var(--hi);margin-bottom:3px}
.warn{border-left:4px solid #e0533f;background:#211112;padding:9px 12px;margin:12px 0;font-size:15px}.warn::before{content:"CAUTION";display:block;font:800 11px Arial;letter-spacing:.14em;color:#ff7a66;margin-bottom:3px}
.note{border-left:4px solid #4fa3c7;background:#0f1d24;padding:9px 12px;margin:12px 0;font-size:14.5px}
table.cmp{width:100%;border-collapse:collapse;font-size:14.5px;margin:8px 0}table.cmp th,table.cmp td{border:1px solid #2a3a41;padding:6px 8px;text-align:left;vertical-align:top}table.cmp th{background:#18242a;color:#dfe8ea;font-weight:700}table.cmp td:first-child{color:var(--mut);width:28%}
.part{display:flex;gap:10px;align-items:flex-start;padding:6px 4px;border-bottom:1px solid #22313a;cursor:pointer;font-size:14.5px}.part i{font:700 12px Arial;font-style:normal;border:1.5px solid #9fb2b8;color:#dfe8ea;border-radius:50%;width:22px;height:22px;flex:0 0 22px;display:grid;place-items:center}.part.on{background:#18262c}.part.seen i{background:#2f7a55;border-color:#5ee6a8}
.ctrl{position:absolute;left:10px;right:10px;bottom:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;background:rgba(5,9,11,.92);border:1px solid #2a3a41;border-radius:4px;padding:7px;font-size:14px}
.ctrl input[type=range]{width:220px}
.chk{list-style:none;margin:8px 0;padding:0;counter-reset:c}.chk li{padding:8px 10px 8px 40px;position:relative;border:1px solid #2a3a41;border-radius:4px;margin:5px 0;font-size:14.5px;cursor:pointer}
.chk li::before{counter-increment:c;content:counter(c);position:absolute;left:9px;top:8px;width:21px;height:21px;border-radius:50%;border:1.5px solid #6f8790;color:#dfe8ea;font:700 11px Arial;display:grid;place-items:center}
.chk li.done{border-color:#2f7a55;background:#0e2219;color:#bfe8d2}.chk li.done::before{background:#2f7a55;border-color:#5ee6a8}.chk li.now{border-color:var(--hi);background:#1e1a0c}
.q{border:1px solid #2a3a41;border-radius:4px;padding:10px;margin:10px 0}.q h4{margin:0 0 6px;font-size:15px}.q label{display:block;padding:6px 8px;border-radius:3px;cursor:pointer;font-size:14.5px;border:1px solid transparent}.q label:hover{border-color:#3e535c}
.q label.right{background:#0e2219;border-color:#2f7a55}.q label.wrong{background:#2a1214;border-color:#a33}.q .why{display:none;font-size:13.5px;color:#cfe;margin-top:6px}
nav{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:9px 14px;background:#070b0d;border-top:1px solid var(--line)}
.foot{text-align:center;padding:5px;color:#c9b27a;font-size:11px;background:#070b0d}
.prog{flex:1;height:5px;background:#1d2a30;border-radius:3px;overflow:hidden;max-width:420px}.prog i{display:block;height:100%;background:#5ee6a8}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#0f2a1f;border:1px solid #3f9a6f;color:#d9ffe9;padding:8px 16px;border-radius:4px;font-weight:600;z-index:60;display:none;font-size:14px}
.cap{position:absolute;left:12px;top:10px;font:600 12px Arial;color:#8fa6ad;letter-spacing:.06em}
</style></head><body>
<header><b>ECADEMY</b><span>ROCKET PARACHUTE FLARE TRAINING</span><span class="sub">Long-range pyrotechnic distress signal · basic course</span><span class="sp"></span><span class="sub" id="pct"></span><button class="btn" id="reset">START AGAIN</button></header>
<div class="steps" id="steps"></div>
<main><div class="stage" id="stage"></div><div class="text" id="text"></div></main>
<nav><button class="btn big" id="back">&#9664; BACK</button><div class="prog"><i id="pbar"></i></div><button class="btn big go" id="next">NEXT &#9654;</button></nav>
<div class="foot">TRAINING ONLY · ECADEMY RP-1 is a generic training model, not a real product · follow the instructions on the rocket, SOLAS and your company SMS</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const $ = id => document.getElementById(id), D2R = Math.PI / 180;
const ST = {i:0, seen:{}, parts:{}, fire:0, quiz:{}, insp:0, hl:0, launchT:0, cloud:false};

// ============ per-pixel shaded rocket parachute flare (ECADEMY RP-1, modelled on a typical SOLAS rocket parachute flare) ============
const RW = 170, RH = 640, RCX = 85, RS = 2;
function rRad(y, o) { // y 0 = top

  else { if (y < 54) return 0; if (y < 64) return 28; }

  if (!bot) { if (y < 600) return 32 - ((y - 476) % 40 < 3 ? 1.6 : 0); if (y < 616) return 32 - (y - 600) * .15; if (y < 622) return 29.6 * Math.sqrt(Math.max(0, 1 - Math.pow((y - 616) / 6, 2))); return 0; }

function rLab() { const c = document.createElement("canvas"); c.width = 420; c.height = 1300; const g = c.getContext("2d"); g.fillStyle = "#e8460e"; g.fillRect(0, 0, 420, 1300);
  g.save(); g.translate(150, 650); g.rotate(-Math.PI / 2); g.fillStyle = "#111"; g.textAlign = "center"; g.font = "900 58px Arial"; g.fillText("ROCKET PARACHUTE FLARE", 0, -40); g.font = "800 30px Arial"; g.fillText("RED  ·  SOLAS  ·  ECADEMY RP-1", 0, 4); g.font = "600 26px Arial"; g.fillText("300 m  ·  30 000 cd  ·  40 s  ·  TRAINING MODEL", 0, 44);
  g.font = "900 40px Arial"; g.fillText("▲  THIS END UP  ▲", 0, 110); g.restore();
  g.fillStyle = "#fff"; g.fillRect(290, 50, 110, 1200); g.fillStyle = "#111"; g.save(); g.translate(345, 650); g.rotate(-Math.PI / 2); g.textAlign = "center"; g.font = "700 21px Arial";
  g.fillText("1 REMOVE TOP CAP   2 REMOVE BOTTOM CAP   3 HOLD FIRMLY, POINT UP", 0, -22); g.fillText("4 PULL / SQUEEZE TRIGGER   KEEP CLEAR OF TOP   EXPIRY 06 / 2029", 0, 10); g.fillText("IN STRONG WIND OR LOW CLOUD: AIM SLIGHTLY DOWNWIND", 0, 42); g.restore();

    for (let px = 0; px < W; px++) { const x = px / RS - RCX; if (Math.abs(x) >= r) continue; const sx = x / r, phi = Math.asin(sx), n = nrm([sx, -dr, Math.cos(phi)]);
      let alb = [.88, .26, .04], spec = .4, gl = 45;
      if (m === "cap" || m === "bcap") { alb = [.78, .14, .03]; spec = .55; gl = 60; if (m === "cap" && Math.floor((phi + 1.6) * 16) % 2 === 0 && y > 16 && y < 58) alb = alb.map(a => a * .8); }
      else if (m === "band") alb = y < 70 ? [.92, .9, .86] : [.12, .12, .12];
      else if (m === "label") { if (Math.abs(phi) < 1.1) { const tx = Math.floor((phi / 1.1 * .5 + .5) * 419), ty = Math.floor((y - 76) / 394 * 1299), ti = (ty * 420 + tx) * 4; alb = [RL.data[ti] / 255, RL.data[ti + 1] / 255, RL.data[ti + 2] / 255]; spec = .25; gl = 30; } }

      else if (m === "trigger") { alb = [.85, .7, .1]; spec = .5; } else if (m === "seal") { alb = [.55, .5, .45]; spec = .1; }
      const d1 = Math.max(0, dt(n, L1)), d2 = Math.max(0, dt(n, L2)), sp = Math.pow(Math.max(0, dt(n, HV)), gl), rim = Math.pow(1 - n[2], 3);

      d[k + 3] = Math.abs(x) > r - .7 ? 255 * (r - Math.abs(x)) / .7 : 255; } }
  g.putImageData(id, 0, 0); g.scale(RS, RS);
  if (o.botCap === false) { const gr = g.createLinearGradient(RCX + 30, 0, RCX + 52, 0); gr.addColorStop(0, "#b8920c"); gr.addColorStop(.5, "#ffe25a"); gr.addColorStop(1, "#8a6a00"); g.fillStyle = gr; g.beginPath(); g.moveTo(RCX + 28, 500); g.lineTo(RCX + 46, o.lever ? 492 : 506); g.lineTo(RCX + 48, o.lever ? 552 : 548); g.lineTo(RCX + 28, 556); g.closePath(); g.fill(); g.strokeStyle = "#5a4400"; g.lineWidth = 1; g.stroke(); }
  RC[key] = c.toDataURL(); return RC[key]; }

// ============ particles ============
const PS = []; let LAST = 0;
function emitSmoke(x, y, vx, vy, n, spread = 20, col = "200,195,190", life = 3) { for (let k = 0; k < n; k++) PS.push({x:x + (Math.random() - .5) * 3, y:y + (Math.random() - .5) * 3, vx:vx + (Math.random() - .5) * spread, vy:vy + (Math.random() - .5) * spread, life:0, max:life * (.6 + Math.random() * .8), r:2 + Math.random() * 3, col, sm:true}); }
function emitFire(x, y, vx, vy, n) { for (let k = 0; k < n; k++) PS.push({x, y, vx:vx + (Math.random() - .5) * 40, vy:vy + (Math.random() - .5) * 40, life:0, max:.15 + Math.random() * .25, r:2 + Math.random() * 3, sm:false}); }
function stepPS(dt, wind) { for (let i = PS.length - 1; i >= 0; i--) { const p = PS[i]; p.life += dt; if (p.life > p.max) { PS.splice(i, 1); continue; } p.x += (p.vx + (p.sm ? wind : 0)) * dt; p.y += p.vy * dt; if (p.sm) { p.vx *= .97; p.vy *= .97; p.r += dt * 9; } } }
function drawPS(g, lightA) { g.save(); PS.filter(p => p.sm).forEach(p => { const a = (1 - p.life / p.max) * .35; const gr = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r); gr.addColorStop(0, `rgba(${p.col},${a})`); gr.addColorStop(1, `rgba(${p.col},0)`); g.fillStyle = gr; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill(); });
  g.globalCompositeOperation = "lighter"; PS.filter(p => !p.sm).forEach(p => { const f = p.life / p.max, gr = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 2.5); gr.addColorStop(0, `rgba(255,${240 - f * 120},${200 - f * 180},${1 - f})`); gr.addColorStop(1, "rgba(255,80,0,0)"); g.fillStyle = gr; g.beginPath(); g.arc(p.x, p.y, p.r * 2.5, 0, 7); g.fill(); }); g.restore(); }

  gr = g.createRadialGradient(x, y, 0, x, y, core); gr.addColorStop(0, `rgba(255,255,245,${a})`); gr.addColorStop(.4, `rgba(255,150,130,${a})`); gr.addColorStop(1, "rgba(255,30,20,0)"); g.fillStyle = gr; g.beginPath(); g.arc(x, y, core, 0, 7); g.fill(); g.restore(); }
// ============ launch scene ============
const STARS = Array.from({length:160}, (_, i) => [(i * 97.31) % 760, (i * 53.7) % 300, (i % 7) / 7]);
function sceneLaunch(c, now, dt) { const g = c.getContext("2d"), W = c.width, H = c.height, HZ = 360, t = ST.launchT ? (now - ST.launchT) / 1000 : -1, cloud = ST.cloud;
  // altitude scale: 0 m at HZ-10, 350 m at y=20
  const alt2y = a => HZ - 14 - a / 350 * (HZ - 50); const x0 = 470, wind = 18;

  STARS.forEach(([x, y, b]) => { g.fillStyle = `rgba(255,255,255,${(.2 + b * .6) * (1 - lightK * .7)})`; g.fillRect(x, y, b > .7 ? 1.5 : 1, b > .7 ? 1.5 : 1); });
  if (cloud) { const cb = alt2y(200); gr = g.createLinearGradient(0, 0, 0, cb + 10); gr.addColorStop(0, "rgba(40,44,52,1)"); gr.addColorStop(.8, "rgba(46,50,58,.96)"); gr.addColorStop(1, "rgba(46,50,58,0)"); g.fillStyle = gr; g.fillRect(0, 0, W, cb + 10);
    g.fillStyle = "#8fa6ad"; g.font = "11px Arial"; g.fillText("LOW CLOUD BASE ~200 m", 12, cb + 22); }

  for (let i = 0; i < 90; i++) { const f = i / 90, y = HZ + 2 + Math.pow(f, 1.8) * (H - HZ), w = 6 + f * 40, x = ((i * 131.7 + now / 1000 * (4 + f * 12)) % (W + 120)) - 60; g.strokeStyle = `rgba(${120 + lightK * 120},${120 - lightK * 60},${140 - lightK * 80},${.06 + f * .1 + lightK * .1})`; g.lineWidth = .5 + f * 1.4; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + w / 2, y - 1, x + w, y); g.stroke(); }
  if (lightK > 0) { g.save(); g.globalCompositeOperation = "lighter"; gr = g.createLinearGradient(fx - 30, HZ, fx + 30, H); gr.addColorStop(0, `rgba(255,60,40,${.25 * lightK})`); gr.addColorStop(1, "rgba(255,0,0,0)"); g.fillStyle = gr; g.beginPath(); g.moveTo(fx - 8, HZ); g.lineTo(fx + 8, HZ); g.lineTo(fx + 60, H); g.lineTo(fx - 60, H); g.fill(); g.restore(); }
  // far ship
  const sx = 110, seen = phase === "chute" && t - tc > 6; g.fillStyle = "#fff"; g.fillRect(sx, HZ - 10, 2, 2); g.fillRect(sx + 12, HZ - 15, 2, 2); g.fillStyle = seen ? "#e33" : "#2f2"; g.fillRect(sx + 6, HZ - 5, 2, 2); if (seen) { g.fillStyle = "#2f2"; g.fillRect(sx + 2, HZ - 5, 2, 2); }
  g.fillStyle = "#8fa6ad"; g.font = "11px Arial"; g.textAlign = "left"; g.fillText(seen ? "ship has seen the flare: alters course" : "ship far away (lights on the horizon)", sx - 20, HZ + 16);
  // liferaft
  const bx = 510, by = H - 40 + Math.sin(now / 900) * 2; gr = g.createRadialGradient(bx - 20, by - 50, 5, bx, by - 25, 90); gr.addColorStop(0, `rgb(${120 + lightK * 135},${50 + lightK * 40},${20})`); gr.addColorStop(1, "#1a0602"); g.fillStyle = gr; g.beginPath(); g.moveTo(bx - 80, by); g.quadraticCurveTo(bx - 78, by - 80, bx, by - 82); g.quadraticCurveTo(bx + 78, by - 80, bx + 80, by); g.closePath(); g.fill(); g.fillStyle = "#080808"; g.beginPath(); g.ellipse(bx, by + 5, 88, 14, 0, 0, 7); g.fill();
  // person holding rocket
  g.fillStyle = "#3a1406"; g.beginPath(); g.roundRect(bx - 66, by - 44, 24, 34, 6); g.fill(); g.fillStyle = "#2a1208"; g.beginPath(); g.arc(bx - 54, by - 52, 9, 0, 7); g.fill();
  if (phase === "ready" || phase === "climb" && t < .3) { g.strokeStyle = "#3a1406"; g.lineWidth = 8; g.lineCap = "round"; g.beginPath(); g.moveTo(bx - 50, by - 38); g.lineTo(x0 + 4, alt2y(0) + 20); g.stroke(); g.save(); g.translate(x0, alt2y(0)); g.rotate(cloud ? 45 * D2R : 3 * D2R); g.fillStyle = "#c83e0c"; g.fillRect(-5, -10, 10, 40); g.restore(); }
  // rocket climb trail
  if (phase === "climb") { emitSmoke(rx, ry + 6, 0, 20, 4, 10, "190,180,175", 3.5); emitFire(rx, ry + 4, 0, 120, 4); }
  stepPS(dt, wind); drawPS(g, lightK);
  if (phase === "climb") glow(g, rx, ry, 70, 9, 1);
  // parachute + candle
  if (phase === "chute" && flA > 0) { const cx = fx, cy = fy - 34; g.save(); g.globalAlpha = .55 + .4 * lightK; g.fillStyle = `rgba(${200 + 55 * lightK},${170},${160},.85)`; g.beginPath(); g.moveTo(cx - 18, cy); g.quadraticCurveTo(cx, cy - 18, cx + 18, cy); g.quadraticCurveTo(cx, cy - 5, cx - 18, cy); g.fill(); g.strokeStyle = "rgba(220,200,190,.7)"; g.lineWidth = .8; for (const k of [-18, -9, 0, 9, 18]) { g.beginPath(); g.moveTo(cx + k, cy); g.lineTo(fx, fy - 4); g.stroke(); } g.restore();
    if (Math.random() < .9) emitSmoke(fx, fy, 0, -6, 1, 6, "150,60,50", 5); glow(g, fx, fy, 160 * flA, 14 * flA * (1 + Math.sin(now / 40) * .06), flA); }
  // altimeter / timer HUD
  g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(W - 190, 10, 178, 74); g.strokeStyle = "#2a3a41"; g.strokeRect(W - 190, 10, 178, 74); g.font = "12px Consolas,monospace"; g.fillStyle = "#cfe"; g.textAlign = "left";
  const altNow = phase === "climb" ? apex * (1 - Math.pow(1 - t / tc, 2)) : phase === "chute" ? Math.max(0, apex - (t - tc) * desc) : 0;
  g.fillText(`ALTITUDE  ${altNow.toFixed(0).padStart(4)} m`, W - 182, 30); g.fillText(`BURN TIME ${phase === "chute" ? Math.min(burn, t - tc).toFixed(0).padStart(4) : "   0"} s`, W - 182, 48); g.fillText(`DESCENT   ${phase === "chute" ? desc.toFixed(1) : "  - "} m/s`, W - 182, 66);
  // scale
  g.strokeStyle = "rgba(160,190,200,.35)"; g.fillStyle = "#8fa6ad"; g.font = "10px Arial"; for (const a of [0, 100, 200, 300]) { const y = alt2y(a); g.beginPath(); g.moveTo(8, y); g.lineTo(26, y); g.stroke(); g.fillText(a + " m", 30, y + 3); }
  g.fillStyle = "#cfe"; g.font = "bold 12px Arial"; g.fillText("WIND", 380, 30); g.strokeStyle = "#cfe"; g.lineWidth = 2; g.beginPath(); g.moveTo(420, 26); g.lineTo(470, 26); g.lineTo(462, 21); g.moveTo(470, 26); g.lineTo(462, 31); g.stroke(); g.font = "11px Arial"; g.fillText("downwind", 476, 30);
  if (phase === "out" && t > tc + burn + 1.5) ST.launchT = 0; return phase; }
// ============ lessons ============
const L = [];
const TBL = `<table class="cmp"><tr><th>Location</th><th>Rocket parachute flares</th></tr><tr><td>On or near the navigation bridge</td><td><b>12</b> (SOLAS III/6.3)</td></tr><tr><td>Lifeboat</td><td><b>4</b></td></tr><tr><td>Liferaft, SOLAS A pack</td><td><b>4</b></td></tr><tr><td>Liferaft, SOLAS B pack</td><td><b>2</b></td></tr></table>`;
L.push({t:"1  What is a rocket parachute flare", stage:() => `<div style="display:flex;gap:36px;align-items:center">${rocketSVG({w:120})}<div style="max-width:300px;font:14px/1.7 Consolas,monospace;color:#dfe8ea;background:#060a0d;border:1px solid #3e535c;padding:12px"><div style="color:#8fa6ad;font-weight:700">SOLAS LSA CODE 3.1</div>Fired vertically: reaches<br>              ≥ 300 m<br>Colour        BRIGHT RED<br>Intensity     ≥ 30 000 cd<br>Burning time  ≥ 40 s<br>Descent rate  ≤ 5 m/s<br>Burns out     before reaching<br>              the sea</div></div>`,
 text:() => `<h2>What is a rocket parachute flare?</h2><div class="kick">A long-range pyrotechnic distress signal</div>
 <p class="lead">A rocket that climbs to at least <b>300 m</b>, then releases a <b>bright red flare on a small parachute</b>. It burns for at least <b>40 seconds</b> while it floats down slowly.</p>
 <p>Because it is so high, it can be seen from <b>much farther away</b> than a hand flare, over the horizon of a ship's lookout. Use it to <b>attract attention</b> of ships or aircraft that may not yet see you.</p>
 <h3 style="margin:14px 0 4px;font-size:15px;color:#fff">How many are required</h3>${TBL}
 <div class="key">Rocket parachute flare = <b>long range</b>, to be noticed. Red hand flare = <b>short range</b>, to guide the rescuer in. Orange smoke = <b>daytime</b>.</div>`});
const PARTS = [[1, "Top cap", "Sealed cap over the rocket end. Remove it first. The top end must point UP and away from you.", [85, 34], [210, 34]],
 [2, "Rocket end (THIS END UP)", "The rocket and the parachute flare leave from here. Never look into it or point it at anyone.", [85, 66], [-60, 66]],
 [3, "Instruction label and pictograms", "Short firing instructions and wind / low-cloud advice. Read them in drills.", [100, 260], [210, 260]],
 [4, "Expiry date", "Usually about 3 to 4 years. Replace before expiry; land expired flares for approved disposal.", [120, 420], [210, 420]],
 [5, "Bottom cap", "Covers the firing mechanism. Remove it only when ready to fire.", [85, 560], [-60, 560]],
 [6, "Firing lever / trigger", "Under the bottom cap. Hold the tube firmly with both hands and squeeze / pull the lever (method differs by maker).", [120, 520], [210, 520]]];
L.push({t:"2  The parts", stage:() => `<svg viewBox="-110 0 380 640" width="330" height="560"><image href="${rocketImg({botCap:false})}" width="${RW}" height="${RH}"/>${PARTS.map(([n, a, b, p, q]) => { const on = ST.hl === n, c = on ? "#f2c14e" : "#9fb2b8"; return `<g data-pp="${n}" style="cursor:pointer"><circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${c}"/><line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${c}" stroke-width="${on ? 2 : 1.2}"/><circle cx="${q[0]}" cy="${q[1]}" r="10" fill="#05090b" stroke="${c}" stroke-width="1.5"/><text x="${q[0]}" y="${q[1] + 4}" text-anchor="middle" font-family="Arial" font-weight="700" font-size="11" fill="${c}">${n}</text></g>`; }).join("")}</svg>`,
 text:() => `<h2>The parts</h2><div class="kick">Select each part (6 parts). Shown with the bottom cap removed.</div>${PARTS.map(([n, a, b]) => `<div class="part ${ST.parts[n] ? "seen" : ""} ${ST.hl === n ? "on" : ""}" data-p="${n}"><i>${n}</i><div><b>${a}</b><br>${b}</div></div>`).join("")}`,
 bind:() => { const pick = n => { ST.hl = n; ST.parts[n] = true; if (Object.keys(ST.parts).length === PARTS.length) mark(); show(); }; document.querySelectorAll("[data-p]").forEach(p => p.onclick = () => pick(+p.dataset.p)); document.querySelectorAll("[data-pp]").forEach(p => p.onclick = () => pick(+p.dataset.pp)); }});
const FIRE = [["Read the instructions on the tube.", {}], ["Remove the top cap. Keep the top pointing up and away.", {topCap:false}], ["Remove the bottom cap. The firing lever drops down.", {topCap:false, botCap:false}], ["Hold the tube firmly with both hands, at arm's length, on the lee side, pointing straight up (slightly downwind in strong wind).", {topCap:false, botCap:false}], ["Squeeze / pull the firing lever. Hold on: there is a recoil.", {topCap:false, botCap:false, lever:true}], ["Keep holding until the rocket has gone. Then drop the empty tube in the sea.", {topCap:false, botCap:false, lever:true}]];
L.push({t:"3  How to fire", stage:() => `<div style="display:flex;gap:30px;align-items:center"><div style="transform:rotate(${ST.fire >= 4 ? 0 : 8}deg)">${rocketSVG({w:120, ...FIRE[Math.max(0, Math.min(FIRE.length - 1, ST.fire))][1]})}</div><div style="font:600 15px Arial;color:#dfe8ea;max-width:270px;border-left:3px solid #f2c14e;padding-left:12px">${ST.fire === 0 ? "Ready. Both caps on." : FIRE[ST.fire - 1][0]}</div></div>`,
 text:() => `<h2>How to fire</h2><div class="kick">Select the steps in order.</div><ul class="chk">${FIRE.map((s, i) => `<li data-f="${i}" class="${ST.fire > i ? "done" : ST.fire === i ? "now" : ""}">${s[0]}</li>`).join("")}</ul>
 <div class="warn">Never fire a rocket inside the canopy or under rigging. In a lifeboat, fire it outside, clear of the canopy and people.</div>`,
 bind:() => document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { const i = +b.dataset.f; if (i !== ST.fire) return toast("Follow the steps in order."); ST.fire++; if (ST.fire === FIRE.length) mark(); show(); })});
L.push({t:"4  Launch and descent", anim:true, stage:() => `<canvas id="cv" width="760" height="460"></canvas><div class="ctrl"><button class="btn" data-l="fire">FIRE ROCKET</button><button class="btn ${ST.cloud ? "on" : ""}" data-l="cloud">${ST.cloud ? "LOW CLOUD: ON" : "LOW CLOUD: OFF"}</button><button class="btn" data-l="r">RESET</button></div>`,
 text:() => `<h2>What happens after firing</h2><div class="kick">Night, in the liferaft. A ship is far away.</div>
 <p><b>1.</b> The rocket climbs in about <b>4 to 5 seconds</b> to at least <b>300 m</b>.</p>
 <p><b>2.</b> At the top it ejects the <b>red flare</b> on a <b>parachute</b>.</p>
 <p><b>3.</b> The flare burns at least <b>40 s</b>, falling no faster than <b>5 m/s</b>. It burns out before it reaches the sea.</p>
 <p><b>4.</b> A ship that sees it will alter course towards it. Then use <b>hand flares</b> to guide it in.</p>
 <div class="key"><b>Low cloud?</b> Fire at about <b>45° downwind</b> so the flare stays <b>under</b> the cloud and can be seen. Try it with LOW CLOUD ON.</div>`,
 bind:() => document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { const v = b.dataset.l; if (v === "fire") { if (ST.launchT) return; ST.launchT = performance.now(); PS.length = 0; setTimeout(() => { if (ST.i === 3) mark(); }, 12000); } if (v === "cloud") { ST.cloud = !ST.cloud; ST.launchT = 0; PS.length = 0; show(); } if (v === "r") { ST.launchT = 0; PS.length = 0; } })});
L.push({t:"5  When to use it", stage:() => `<table class="cmp" style="max-width:640px"><tr><th>Situation</th><th>Best signal</th></tr><tr><td>Night, ship lights far away or none seen</td><td><b>Rocket parachute flare</b> (or two, a short time apart)</td></tr><tr><td>Night, ship or aircraft close and in sight</td><td><b>Red hand flare</b></td></tr><tr><td>Daytime, ship or aircraft in sight</td><td><b>Orange buoyant smoke</b></td></tr><tr><td>Aircraft overhead</td><td>Do not fire a rocket at or near an aircraft: use a hand flare or smoke</td></tr><tr><td>Low cloud</td><td>Rocket at about 45° downwind</td></tr></table>`,
 text:() => `<h2>When to use it</h2><div class="kick">Pyrotechnics are few: use the right one at the right time.</div>
 <p>Fire a rocket when there is a <b>chance that someone will see it</b>: a ship's lights on the horizon, the sound of an aircraft, or when rescue is expected in the area.</p>
 <p>If there is no reaction, wait a few minutes and fire a <b>second</b> one, so an observer can confirm what they saw.</p>
 <div class="warn">Never fire a rocket towards or near a helicopter or aircraft. It can hit or blind the crew.</div>`});
L.push({t:"6  Safety", stage:() => `<div style="display:flex;gap:30px;align-items:center">${rocketSVG({w:90})}<table class="cmp" style="max-width:440px"><tr><th>DO</th><th>DO NOT</th></tr><tr><td style="color:#bfe8d2;width:50%">Hold firmly with both hands, arms extended</td><td style="color:#ffb3a8">Hold it near your face or body</td></tr><tr><td style="color:#bfe8d2">Fire on the lee side, clear of canopy and rigging</td><td style="color:#ffb3a8">Fire inside the canopy or under a davit</td></tr><tr><td style="color:#bfe8d2">If it misfires: keep pointing up for 30 s, then throw it overboard downwind</td><td style="color:#ffb3a8">Look into the top end to check it</td></tr><tr><td style="color:#bfe8d2">Store dry, in the watertight container</td><td style="color:#ffb3a8">Use expired or damaged rockets</td></tr></table></div>`,
 text:() => `<h2>Safety</h2><div class="kick">A rocket is a projectile with a hot burning flare.</div>
 <p>There is a <b>recoil</b> when it fires. A tube held loosely can turn and send the rocket sideways.</p>
 <p>A <b>hang-fire</b> (late ignition) can happen: if nothing happens, keep it pointing up for at least <b>30 seconds</b>, then throw it into the sea, downwind.</p>
 <div class="warn">Fire distress rockets only in distress (or in an authorised drill with the coast authority informed). A red rocket starts a search and rescue operation.</div>`});
const INSP = [["Bridge: count 12 rocket parachute flares, stowed on or near the bridge in a watertight container.", null], ["Survival craft: lifeboat and SOLAS A pack 4, SOLAS B pack 2 (liferaft packs are checked at the annual service).", null], ["Check the expiry date of each rocket (usually 3 to 4 years).", null], ["Check tubes and caps: no damage, corrosion or water inside the container.", null], ["Record in the LSA inspection record; order replacements before expiry.", null], ["Land expired rockets ashore for approved disposal. Never throw them overboard or fire them for fun.", null]];
L.push({t:"7  Inspection and expiry", stage:() => `<div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;max-width:600px;justify-content:center">${Array.from({length:12}, () => rocketSVG({w:40})).join("")}</div>`,
 text:() => `<h2>Inspection and expiry</h2><div class="kick">Select each step in order.</div><ul class="chk">${INSP.map((s, i) => `<li data-n="${i}" class="${ST.insp > i ? "done" : ST.insp === i ? "now" : ""}">${s[0]}</li>`).join("")}</ul>${TBL}`,
 bind:() => document.querySelectorAll("[data-n]").forEach(li => li.onclick = () => { const i = +li.dataset.n; if (i !== ST.insp) return toast("Follow the steps in order."); ST.insp++; if (ST.insp === INSP.length) mark(); show(); })});
const QZ = [["A rocket parachute flare must reach at least...", ["100 m", "300 m", "1 000 m"], 1, "LSA Code 3.1: at least 300 m when fired vertically."],
 ["Its flare must burn for at least...", ["10 s", "40 s", "3 min"], 1, "At least 40 s, at least 30 000 cd, descent not more than 5 m/s."],
 ["How many rocket parachute flares on or near the bridge?", ["4", "6", "12"], 2, "SOLAS III/6.3: at least 12."],
 ["How many in a lifeboat or a SOLAS A pack liferaft?", ["2", "4", "6"], 1, "4 (SOLAS B pack: 2)."],
 ["With a low cloud base you should fire...", ["Straight up", "About 45° downwind", "Horizontally"], 1, "So the flare stays under the cloud."],
 ["When is a rocket the best choice?", ["A ship far away / not yet seen you", "A helicopter overhead", "Daytime with a ship close by"], 0, "Long range, to be noticed. Close in: hand flare; daytime: smoke."],
 ["The rocket does not fire. You should...", ["Look into the top end", "Keep it pointing up 30 s, then throw it overboard downwind", "Put it back in the box"], 1, "It may hang-fire."],
 ["Never fire a rocket...", ["Towards or near an aircraft", "At night", "From a liferaft"], 0, "It can hit or blind the aircrew."]];
L.push({t:"8  Quiz", stage:() => `<div style="text-align:center">${rocketSVG({w:100})}<div style="font:700 22px Arial;color:#fff;margin-top:6px" id="qs"></div></div>`,
 text:() => `<h2>Check your understanding</h2><div class="kick">Select one answer for each question.</div>${QZ.map((q, i) => `<div class="q"><h4>${i + 1}. ${q[0]}</h4>${q[1].map((o, j) => `<label data-q="${i}" data-o="${j}" class="${ST.quiz[i] != null ? (j === q[2] ? "right" : ST.quiz[i] === j ? "wrong" : "") : ""}">${String.fromCharCode(65 + j)}. ${o}</label>`).join("")}<div class="why" style="${ST.quiz[i] != null ? "display:block" : ""}">${q[3]}</div></div>`).join("")}`,
 bind:() => { document.querySelectorAll("[data-q]").forEach(l => l.onclick = () => { const i = +l.dataset.q; if (ST.quiz[i] != null) return; ST.quiz[i] = +l.dataset.o; if (Object.keys(ST.quiz).length === QZ.length) mark(); show(); }); qscore(); }});
L.push({t:"Real and simplified", stage:() => `<div style="text-align:center">${rocketSVG({w:120})}</div>`,
 text:() => `<h2>What is real in this training</h2><p><b>Real (SOLAS Chapter III, LSA Code 3.1 and 4.1.5 / 4.4.8, COLREG Annex IV):</b> rocket parachute flare in a water-resistant casing with brief instructions and illustrations; when fired vertically reaches at least 300 m; ejects a parachute flare burning bright red, at least 30 000 cd, at least 40 s, descent not more than 5 m/s; 12 on or near the navigation bridge, 4 in lifeboats and SOLAS A pack liferafts, 2 in SOLAS B pack; red rocket is a distress signal; replace before expiry and land expired pyrotechnics for disposal.</p>
 <p><b>Simplified:</b> the ECADEMY RP-1 is a <b>generic training model</b>, not a real product. Firing mechanisms (lever, pull cord, squeeze trigger) differ between makers. The animation compresses distances. Always follow the <b>instructions on the rocket</b>, SOLAS and your <b>company SMS</b>.</p>`});
function qscore() { const n = Object.keys(ST.quiz).length, ok = Object.entries(ST.quiz).filter(([i, o]) => QZ[i][2] === o).length; const e = $("qs"); if (e) e.textContent = n ? `Score ${ok} / ${QZ.length}${n === QZ.length ? (ok >= 6 ? "  Passed" : "  Review the lessons and try again") : ""}` : "Answer the questions"; }

  const n = Object.keys(ST.seen).length; $("pbar").style.width = (n / L.length * 100) + "%"; $("pct").textContent = `${n} of ${L.length} lessons completed`; }
function show() { const l = L[ST.i]; $("stage").innerHTML = l.stage(); $("text").innerHTML = l.text(); if (l.bind) l.bind(); steps(); $("back").disabled = ST.i === 0; $("next").innerHTML = ST.i === L.length - 1 ? "FINISH" : "NEXT &#9654;"; }

show(); requestAnimationFrame(anim);
window.RPT = {ST, go, L};
