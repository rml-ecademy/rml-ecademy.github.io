<!doctype html>
<html lang="en"><head><script>window.ECADEMY_START = window.ECADEMY_START || (location.hash.slice(1) || undefined);</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECADEMY Hand Flare Training</title>
<style>
:root{--bg:#0d1417;--panel:#121b1f;--line:#2a3a41;--tx:#e6eef0;--mut:#9fb2b8;--acc:#5ee6a8;--hi:#f2c14e}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#0a1013;color:var(--tx);font:16px/1.55 "Segoe UI",Arial,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#070b0d;border-bottom:1px solid var(--line);flex-wrap:wrap}header b{letter-spacing:.14em;color:#ff5a6a}header .sub{color:var(--mut);font-size:13px}header .sp{flex:1}
.btn{background:#1a252a;color:#e8f0f2;border:1px solid #3e535c;border-radius:4px;padding:7px 14px;cursor:pointer;font:600 13.5px "Segoe UI",Arial;letter-spacing:.02em}.btn:hover{border-color:#8fb3bf}.btn.on{background:#21404a;border-color:#7fd6ee;color:#fff}
.btn.big{font-size:15px;padding:9px 22px}.btn.go{background:#1f5a3f;border-color:#3f9a6f}.btn:disabled{opacity:.4;cursor:default}
.steps{display:flex;gap:4px;padding:8px 14px;overflow-x:auto;background:#0c1316;border-bottom:1px solid var(--line)}
.steps button{flex:0 0 auto;background:transparent;border:1px solid #2a3a41;color:#b9c8cc;border-radius:3px;padding:5px 11px;font:600 12.5px "Segoe UI",Arial;cursor:pointer;white-space:nowrap;position:relative}
.steps button.on{background:#e8eef0;color:#0b1215;border-color:#e8eef0}.steps button.ok{border-color:#3f9a6f}.steps button.ok::after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:#5ee6a8}
main{flex:1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(340px,1fr);gap:12px;padding:12px;min-height:0}
@media(max-width:980px){main{grid-template-columns:1fr}}
.stage{background:#05090b;border:1px solid var(--line);border-radius:6px;position:relative;overflow:hidden;min-height:440px;display:flex;align-items:center;justify-content:center}
.stage svg,.stage canvas{max-width:100%;max-height:100%;display:block}
.text{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 20px;overflow-y:auto}
.text h2{margin:0 0 2px;font-size:24px;color:#fff;font-weight:700}.text .kick{color:var(--mut);font-size:13.5px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.text p{margin:8px 0}.text b{color:var(--hi);font-weight:700}
.lead{font-size:19px;font-weight:600;color:#fff;line-height:1.45}
.key{border-left:4px solid var(--hi);background:#1a1a12;padding:9px 12px;margin:12px 0;font-size:15px}.key::before{content:"KEY POINT";display:block;font:800 11px Arial;letter-spacing:.14em;color:var(--hi);margin-bottom:3px}
.warn{border-left:4px solid #e0533f;background:#211112;padding:9px 12px;margin:12px 0;font-size:15px}.warn::before{content:"CAUTION";display:block;font:800 11px Arial;letter-spacing:.14em;color:#ff7a66;margin-bottom:3px}
.note{border-left:4px solid #4fa3c7;background:#0f1d24;padding:9px 12px;margin:12px 0;font-size:14.5px}
table.cmp{width:100%;border-collapse:collapse;font-size:14.5px;margin:8px 0}table.cmp th,table.cmp td{border:1px solid #2a3a41;padding:6px 8px;text-align:left;vertical-align:top}table.cmp th{background:#18242a;color:#dfe8ea;font-weight:700}table.cmp td:first-child{color:var(--mut);width:28%}
.part{display:flex;gap:10px;align-items:flex-start;padding:6px 4px;border-bottom:1px solid #22313a;cursor:pointer;font-size:14.5px}.part i{font:700 12px Arial;font-style:normal;border:1.5px solid #9fb2b8;color:#dfe8ea;border-radius:50%;width:22px;height:22px;flex:0 0 22px;display:grid;place-items:center}.part.on{background:#18262c}.part.seen i{background:#2f7a55;border-color:#5ee6a8}
.ctrl{position:absolute;left:10px;right:10px;bottom:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;background:rgba(5,9,11,.92);border:1px solid #2a3a41;border-radius:4px;padding:7px;font-size:14px}
.ctrl input[type=range]{width:220px}
.chk{list-style:none;margin:8px 0;padding:0;counter-reset:c}.chk li{padding:8px 10px 8px 40px;position:relative;border:1px solid #2a3a41;border-radius:4px;margin:5px 0;font-size:14.5px;cursor:pointer}
.chk li::before{counter-increment:c;content:counter(c);position:absolute;left:9px;top:8px;width:21px;height:21px;border-radius:50%;border:1.5px solid #6f8790;color:#dfe8ea;font:700 11px Arial;display:grid;place-items:center}
.chk li.done{border-color:#2f7a55;background:#0e2219;color:#bfe8d2}.chk li.done::before{background:#2f7a55;border-color:#5ee6a8}.chk li.now{border-color:var(--hi);background:#1e1a0c}
.q{border:1px solid #2a3a41;border-radius:4px;padding:10px;margin:10px 0}.q h4{margin:0 0 6px;font-size:15px}.q label{display:block;padding:6px 8px;border-radius:3px;cursor:pointer;font-size:14.5px;border:1px solid transparent}.q label:hover{border-color:#3e535c}
.q label.right{background:#0e2219;border-color:#2f7a55}.q label.wrong{background:#2a1214;border-color:#a33}.q .why{display:none;font-size:13.5px;color:#cfe;margin-top:6px}
nav{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:9px 14px;background:#070b0d;border-top:1px solid var(--line)}
.foot{text-align:center;padding:5px;color:#c9b27a;font-size:11px;background:#070b0d}
.prog{flex:1;height:5px;background:#1d2a30;border-radius:3px;overflow:hidden;max-width:420px}.prog i{display:block;height:100%;background:#5ee6a8}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#0f2a1f;border:1px solid #3f9a6f;color:#d9ffe9;padding:8px 16px;border-radius:4px;font-weight:600;z-index:60;display:none;font-size:14px}
.cap{position:absolute;left:12px;top:10px;font:600 12px Arial;color:#8fa6ad;letter-spacing:.06em}
</style></head><body>
<header><b>ECADEMY</b><span>RED HAND FLARE TRAINING</span><span class="sub">Pyrotechnic distress signal · basic course</span><span class="sp"></span><span class="sub" id="pct"></span><button class="btn" id="reset">START AGAIN</button></header>
<div class="steps" id="steps"></div>
<main><div class="stage" id="stage"></div><div class="text" id="text"></div></main>
<nav><button class="btn big" id="back">&#9664; BACK</button><div class="prog"><i id="pbar"></i></div><button class="btn big go" id="next">NEXT &#9654;</button></nav>
<div class="foot">TRAINING ONLY · ECADEMY HF-1 is a generic training model, not a real product · follow the instructions on the flare, SOLAS and your company SMS</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const $ = id => document.getElementById(id), D2R = Math.PI / 180;
const ST = {i:0, seen:{}, parts:{}, fire:0, quiz:{}, insp:0, hl:0, scen:null};
function toast(s) { const t = $("toast"); t.textContent = s; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 2200); }
// ============ per-pixel shaded red hand flare (ECADEMY HF-1, modelled on a typical SOLAS red hand flare) ============
const FW = 150, FH = 600, FCX = 75, FS = 2, VSQ = .72;
function fRad(y, o) { return fRad0(y, o) * 1.5; }
function fRad0(y, o) { // profile; y: 0 top
  const capOff = o.cap === false;
  if (!capOff) { if (y < 6) return 0; if (y < 10) return 19 + (y - 6) * .8; if (y < 52) return 22.5; if (y < 56) return 23.5; }
  else { if (y < 40) return 0; if (y < 46) return 8; if (y < 56) return 15; }
  if (y < 60) return 21; if (y < 330) return 20.5; if (y < 336) return 21.5 + (y - 330) * .2; if (y < 580) { const k = (y - 336) % 48; return 22.5 + (k < 6 ? -k * .6 : k > 42 ? -(48 - k) * .6 : 0) - (y - 336) / 244 * 1.2; } if (y < 592) return 21 - (y - 580) * .3; if (y < 596) return 17.4 * Math.sqrt(Math.max(0, 1 - Math.pow((y - 592) / 4, 2))); return 0; }
function fMat(y, o) { if (o.cap === false && y < 56) return y < 46 ? "striker" : "fuse"; if (y < 56) return "cap"; if (y < 72) return "band"; if (y < 334) return "label"; return "grip"; }
function labTex() { const c = document.createElement("canvas"); c.width = 360; c.height = 1050; const g = c.getContext("2d"); g.fillStyle = "#f05a12"; g.fillRect(0, 0, 360, 1050);
  g.save(); g.translate(180, 525); g.rotate(-Math.PI / 2); g.fillStyle = "#111"; g.textAlign = "center"; g.font = "900 54px Arial"; g.fillText("RED HAND FLARE", 0, -40); g.font = "800 30px Arial"; g.fillText("SOLAS  ·  ECADEMY HF-1", 0, 4); g.font = "600 24px Arial"; g.fillText("15 000 cd  ·  60 s  ·  TRAINING MODEL", 0, 42); g.restore();
  g.fillStyle = "#fff"; g.fillRect(250, 40, 90, 970); g.fillStyle = "#111"; g.font = "700 20px Arial"; g.save(); g.translate(300, 525); g.rotate(-Math.PI / 2); g.textAlign = "center"; g.fillText("1 REMOVE CAP  2 PULL / TWIST STRIKER  3 HOLD DOWNWIND", 0, -10); g.fillText("DO NOT LOOK AT FLAME  ·  EXPIRY 06 / 2029", 0, 22); g.restore();
  for (let k = 0; k < 3; k++) { g.fillStyle = "#111"; g.fillRect(262, 120 + k * 290, 66, 66); g.fillStyle = "#f05a12"; g.beginPath(); g.moveTo(295, 130 + k * 290); g.lineTo(318, 176 + k * 290); g.lineTo(272, 176 + k * 290); g.fill(); }
  g.fillStyle = "#111"; g.beginPath(); g.moveTo(60, 20); g.lineTo(80, 40); g.lineTo(40, 40); g.fill(); g.beginPath(); g.moveTo(60, 1030); g.lineTo(80, 1010); g.lineTo(40, 1010); g.fill(); return g.getImageData(0, 0, 360, 1050); }
let LT = null; const FCACHE = {};
function flareImg(o = {}) { const key = JSON.stringify(o); if (FCACHE[key]) return FCACHE[key]; if (!LT) LT = labTex();
  const W = FW * FS, H = FH * FS, c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d"), id = g.createImageData(W, H), d = id.data;
  const L1 = nrm([-.6, -.4, .7]), L2 = nrm([.7, -.1, .7]), HV = nrm([L1[0], L1[1], L1[2] + 1]);
  for (let py = 0; py < H; py++) { const y = py / FS, r = fRad(y, o); if (r <= 0) continue; const dr = fRad(y + .5, o) - fRad(y - .5, o), m = fMat(y, o);
    for (let px = 0; px < W; px++) { const x = px / FS - FCX; if (Math.abs(x) >= r) continue; const sx = x / r, phi = Math.asin(sx), n = nrm([sx, -dr, Math.cos(phi)]);
      let alb = [.9, .3, .05], spec = .35, gl = 40;
      if (m === "cap") { alb = [.86, .24, .04]; spec = .5; gl = 60; if ((Math.floor((phi + 1.6) * 14)) % 2 === 0 && y > 12 && y < 50) alb = alb.map(a => a * .82); }
      else if (m === "band") { alb = [.93, .9, .86]; if (y > 66) alb = [.85, .2, .05]; }
      else if (m === "label") { if (Math.abs(phi) < 1.05) { const tx = Math.floor((phi / 1.05 * .5 + .5) * 359), ty = Math.floor((y - 72) / 262 * 1049), ti = (ty * 360 + tx) * 4; alb = [LT.data[ti] / 255, LT.data[ti + 1] / 255, LT.data[ti + 2] / 255]; spec = .25; gl = 30; } }
      else if (m === "grip") { alb = [.92, .3, .05]; spec = .45; gl = 45; }
      else if (m === "striker") { alb = [.12, .12, .12]; spec = .2; } else if (m === "fuse") { alb = [.55, .5, .45]; spec = .1; }

      d[k + 3] = Math.abs(x) > r - .7 ? 255 * (r - Math.abs(x)) / .7 : 255; } }

function nrm(v) { const l = Math.hypot(...v) || 1; return v.map(a => a / l); } function dt(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function flareSVG(o = {}) { const w = o.w || 100, h = w * FH * VSQ / FW; return `<svg viewBox="0 0 ${FW} ${FH}" width="${w}" height="${h}" preserveAspectRatio="none"><defs><radialGradient id="fsh"><stop offset="0" stop-color="#000" stop-opacity=".6"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient></defs><ellipse cx="${FCX}" cy="${FH - 2}" rx="40" ry="6" fill="url(#fsh)"/><image href="${flareImg(o)}" width="${FW}" height="${FH}"/></svg>`; }

  g.globalCompositeOperation = "lighter"; PS.filter(p => !p.sm).forEach(p => { const f = p.life / p.max, gr = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 2.4); gr.addColorStop(0, `rgba(255,${230 - f * 160},${200 - f * 190},${1 - f})`); gr.addColorStop(.4, `rgba(255,40,20,${.7 * (1 - f)})`); gr.addColorStop(1, "rgba(255,0,0,0)"); g.fillStyle = gr; g.beginPath(); g.arc(p.x, p.y, p.r * 2.4, 0, 7); g.fill(); }); g.restore(); }

  gr = g.createRadialGradient(x, y - 4, 0, x, y - 4, 22 * scale * fl); gr.addColorStop(0, "rgba(255,255,240,1)"); gr.addColorStop(.35, "rgba(255,160,140,.95)"); gr.addColorStop(1, "rgba(255,30,20,0)"); g.fillStyle = gr; g.beginPath(); g.arc(x, y - 4, 22 * scale * fl, 0, 7); g.fill(); g.restore(); }

const RAFT_CACHE = {};
// k = 0 (dark night) .. 1 (lit by the red flare). Returns a shaded copy of the raft image.
function raftSprite(k) { if (!RAFT_IMG.complete || !RAFT_IMG.naturalWidth) return null; const key = Math.round(k * 10); if (RAFT_CACHE[key]) return RAFT_CACHE[key];
  const c = document.createElement("canvas"); c.width = RAFT_IMG.naturalWidth; c.height = RAFT_IMG.naturalHeight; const g = c.getContext("2d"); g.drawImage(RAFT_IMG, 0, 0);
  g.globalCompositeOperation = "source-atop"; g.fillStyle = `rgba(4,10,28,${.62 - .36 * k})`; g.fillRect(0, 0, c.width, c.height);
  if (k > 0) { g.fillStyle = `rgba(255,50,25,${.12 * k})`; g.fillRect(0, 0, c.width, c.height); const gr = g.createRadialGradient(300, 150, 20, 300, 150, 700); gr.addColorStop(0, `rgba(255,120,80,${.22 * k})`); gr.addColorStop(1, "rgba(255,120,80,0)"); g.fillStyle = gr; g.fillRect(0, 0, c.width, c.height); }
  RAFT_CACHE[key] = c; return c; }
// Raft riding a real swell, seen from slightly above: the water meets the lower tube along the near half of an ellipse
// (lowest at the front, rising to the sides), so the raft sits IN the water instead of on a flat line.
// Returns {bob, roll} so callers can place things held by the survivor.
function drawSeaRaft(g, W, H, rx, ry, X0, Y0, S, tt, k, spr) {
  const A = 6, iw = 792 * S, ih = 704 * S, a = iw * .47, d = ih * .12;
  const swell = px => A * (.62 * Math.sin(tt * 1.05 + px / 140) + .28 * Math.sin(tt * 2.3 + px / 48 + 1.3) + .10 * Math.sin(tt * 5.1 + px / 17));

const INSP = [["Check the quantity: lifeboat and SOLAS A pack = 6 red hand flares, 4 rocket parachute flares, 2 buoyant smoke signals; SOLAS B pack = 3, 2, 1. Bridge: 12 rocket parachute flares.", null], ["Check the expiry date on each flare (usually 3 to 4 years).", null], ["Check the container is watertight and not damaged; no corrosion or swelling.", null], ["Record the expiry dates in the LSA inspection record; order replacements before expiry.", null], ["Land expired pyrotechnics ashore through an approved disposal facility. Never throw them overboard.", null]];
L.push({t:"6  Inspection and expiry", stage:() => `<div style="display:flex;gap:16px;align-items:flex-end">${[0, 1, 2, 3, 4, 5].map(k => flareSVG({w:56})).join("")}</div>`,
 text:() => `<h2>Inspection and expiry</h2><div class="kick">Select each step in order.</div><ul class="chk">${INSP.map((s, i) => `<li data-n="${i}" class="${ST.insp > i ? "done" : ST.insp === i ? "now" : ""}">${s[0]}</li>`).join("")}</ul><h3 style="margin:12px 0 4px;font-size:15px;color:#fff">Required quantities</h3><table class="cmp"><tr><th>Location</th><th>Red hand flares</th><th>Rocket parachute flares</th><th>Buoyant smoke</th></tr><tr><td>Lifeboat</td><td><b>6</b></td><td>4</td><td>2</td></tr><tr><td>Liferaft, SOLAS A pack</td><td><b>6</b></td><td>4</td><td>2</td></tr><tr><td>Liferaft, SOLAS B pack</td><td><b>3</b></td><td>2</td><td>1</td></tr><tr><td>Bridge (ship)</td><td>-</td><td><b>12</b> (SOLAS III/6.3)</td><td>-</td></tr></table>`,
 bind:() => document.querySelectorAll("[data-n]").forEach(li => li.onclick = () => { const i = +li.dataset.n; if (i !== ST.insp) return toast("Follow the steps in order."); ST.insp++; if (ST.insp === INSP.length) mark(); show(); })});
const QZ = [["A red hand flare must burn for at least...", ["10 seconds", "1 minute", "5 minutes"], 1, "SOLAS LSA Code: at least 1 minute, at least 15 000 cd."],
 ["When should you use a hand flare?", ["As soon as you board the raft", "When a ship or aircraft is close enough to see it", "Every hour"], 1, "You have few flares. Use them when they can be seen."],
 ["On which side of the raft do you hold it?", ["Windward (wind in your face)", "Lee side (wind behind you)", "Inside the canopy"], 1, "Downwind, so smoke and hot drops blow away."],
 ["What daytime signal is better than a hand flare?", ["Orange smoke signal", "Torch", "Whistle"], 0, "Smoke is easier to see by day."],
 ["How many red hand flares are in a lifeboat or a SOLAS A pack liferaft?", ["2", "6", "12"], 1, "6 hand flares, 4 rocket parachute flares, 2 buoyant smoke signals. SOLAS B pack: 3, 2, 1."],
 ["How many rocket parachute flares must be carried on or near the bridge?", ["4", "6", "12"], 2, "SOLAS III/6.3: at least 12 rocket parachute flares on or near the navigation bridge."],
 ["A liferaft with a SOLAS B pack carries how many red hand flares?", ["3", "6", "4"], 0, "SOLAS B pack: 3 hand flares, 2 rocket parachute flares, 1 buoyant smoke signal."],
 ["A flare does not ignite. You should...", ["Look into the end to check it", "Hold it pointing away for about 30 s, then throw it into the sea", "Put it back in the bag"], 1, "It may still fire late (hang-fire)."],
 ["What do you do with expired flares?", ["Throw them overboard", "Land them ashore for approved disposal", "Keep them as spares"], 1, "Expired pyrotechnics are hazardous waste."]];
L.push({t:"7  Quiz", stage:() => `<div style="text-align:center">${flareSVG({w:90})}<div style="font:700 22px Arial;color:#fff;margin-top:6px" id="qs"></div></div>`,
 text:() => `<h2>Check your understanding</h2><div class="kick">Select one answer for each question.</div>${QZ.map((q, i) => `<div class="q"><h4>${i + 1}. ${q[0]}</h4>${q[1].map((o, j) => `<label data-q="${i}" data-o="${j}" class="${ST.quiz[i] != null ? (j === q[2] ? "right" : ST.quiz[i] === j ? "wrong" : "") : ""}">${String.fromCharCode(65 + j)}. ${o}</label>`).join("")}<div class="why" style="${ST.quiz[i] != null ? "display:block" : ""}">${q[3]}</div></div>`).join("")}`,
 bind:() => { document.querySelectorAll("[data-q]").forEach(l => l.onclick = () => { const i = +l.dataset.q; if (ST.quiz[i] != null) return; ST.quiz[i] = +l.dataset.o; if (Object.keys(ST.quiz).length === QZ.length) mark(); show(); }); qscore(); }});
L.push({t:"Real and simplified", stage:() => `<div style="text-align:center">${flareSVG({w:110})}</div>`,
 text:() => `<h2>What is real in this training</h2><p><b>Real (SOLAS Chapter III, LSA Code 3.2 and 4.1.5, COLREG Annex IV):</b> red hand flare at least 15 000 cd for at least 1 minute, still burning after 10 s immersed in 100 mm of water, not causing discomfort or danger when held as instructed; 6 hand flares, 4 rocket parachute flares and 2 buoyant smoke signals in lifeboats and SOLAS A pack liferafts (SOLAS B pack: 3, 2, 1); 12 rocket parachute flares on or near the bridge (SOLAS III/6.3); rocket parachute flare at least 300 m, 30 000 cd, 40 s; buoyant smoke at least 3 min; red flare is a distress signal; use downwind, at arm's length; replace before expiry and dispose of expired pyrotechnics ashore.</p>
 <p><b>Simplified:</b> the ECADEMY HF-1 is a <b>generic training model</b>, not a real product. Ignition methods (pull tab, twist cap, striker) differ between makers. Always follow the <b>instructions on the flare</b>, SOLAS and your <b>company SMS</b>.</p>`});
function qscore() { const n = Object.keys(ST.quiz).length, ok = Object.entries(ST.quiz).filter(([i, o]) => QZ[i][2] === o).length; const e = $("qs"); if (e) e.textContent = n ? `Score ${ok} / ${QZ.length}${n === QZ.length ? (ok >= 6 ? "  Passed" : "  Review the lessons and try again") : ""}` : "Answer the questions"; }
function mark() { if (!ST.seen[ST.i]) { ST.seen[ST.i] = true; toast(L[ST.i].t.replace(/^\d+\s+/, "") + ": completed"); } steps(); }
function steps() { $("steps").innerHTML = L.map((l, i) => `<button class="${i === ST.i ? "on" : ""} ${ST.seen[i] ? "ok" : ""}" data-s="${i}">${l.t}</button>`).join(""); document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => go(+b.dataset.s));
  const n = Object.keys(ST.seen).length; $("pbar").style.width = (n / L.length * 100) + "%"; $("pct").textContent = `${n} of ${L.length} lessons completed`; }
function show() { const l = L[ST.i]; $("stage").innerHTML = l.stage(); $("text").innerHTML = l.text(); if (l.bind) l.bind(); steps(); $("back").disabled = ST.i === 0; $("next").innerHTML = ST.i === L.length - 1 ? "FINISH" : "NEXT &#9654;"; }
function go(i) { if (![1, 2, 3, 5, 6].includes(ST.i)) ST.seen[ST.i] = true; ST.i = Math.max(0, Math.min(L.length - 1, i)); ST.fire = 0; PS.length = 0; show(); }
$("next").onclick = () => { if (ST.i === L.length - 1) { ST.seen[ST.i] = true; steps(); return toast("Hand flare training completed."); } go(ST.i + 1); };
$("back").onclick = () => go(ST.i - 1);
$("reset").onclick = () => { Object.assign(ST, {i:0, seen:{}, parts:{}, fire:0, quiz:{}, insp:0, hl:0}); PS.length = 0; show(); };
function anim(now) { const dt = Math.min(.05, (now - LAST) / 1000); LAST = now; const c = $("cv"); if (c) { if (ST.i === 2) sceneHand(c, now / 1000, dt); else if (ST.i === 3) sceneUse(c, now / 1000, dt); } requestAnimationFrame(anim); }
show(); requestAnimationFrame(anim);
window.HFT = {ST, go, L};

</script></body></html>
