<!doctype html>
<html lang="en"><head><script>window.ECADEMY_START = window.ECADEMY_START || (location.hash.slice(1) || undefined);</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECADEMY LSA Trainer</title>
<style>

.steps button{flex:0 0 auto;background:transparent;border:1px solid #2a3a41;color:#b9c8cc;border-radius:3px;padding:5px 11px;font:600 12.5px "Segoe UI",Arial;cursor:pointer;white-space:nowrap;position:relative}
.steps button.on{background:#e8eef0;color:#0b1215;border-color:#e8eef0}.steps button.ok{border-color:#3f9a6f}.steps button.ok::after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:#5ee6a8}
main{flex:1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(340px,1fr);gap:12px;padding:12px;min-height:0}

.stage svg,.stage canvas{max-width:100%;max-height:100%;display:block}
.text{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 20px;overflow-y:auto}
.text h2{margin:0 0 2px;font-size:24px;color:#fff;font-weight:700}.text .kick{color:var(--mut);font-size:13.5px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.text p{margin:8px 0}.text b{color:var(--hi);font-weight:700}
.lead{font-size:19px;font-weight:600;color:#fff;line-height:1.45}

.foot{text-align:center;padding:5px;color:#c9b27a;font-size:11px;background:#070b0d}

.h3{margin:14px 0 4px;font-size:15px;color:#fff}

const FFS = ["All persons aboard; check numbers against the muster list.", "Everyone seated facing aft, seat belts and shoulder harness fastened.", "Close and secure the hatch.", "Start the engine.", "Coxswain: check the water behind is clear; report ready to the bridge.", "Remove the lashing / safety pin; release the hook (hydraulic pump) as the manual."];
function ffScene(c, t, dt) { if (vidOr(c, "ff_launch")) return; const k = ST.k, ks = ST.v.ks ? (performance.now() - ST.v.ks) / 1000 : 0, V = SV(c, 20, -56, 6, t), S = ST.v.ff = ST.v.ff || {};
  V.spr("sd_stern", -50, 5); const A = ANCH.sd_stern, top = A && A.a ? A.a.top : [-51.5, 20.4]; const tx = top[0], tz = top[1] - 6, an = 35 * Math.PI / 180, dx = -Math.cos(an), dz = -Math.sin(an), nx = -Math.sin(an), nz = Math.cos(an);
  let s0 = 5, ox, oz, rot = 35, phase = 0;
  const onRamp = s => [tx + dx * s + nx * 0.3, tz + dz * s + nz * 0.3];
  if (k < FFS.length) { [ox, oz] = onRamp(s0); }
  else { const a = 9.81 * Math.sin(an), t1 = Math.sqrt(2 * (12 - s0) / a);
    if (ks < t1) { [ox, oz] = onRamp(s0 + 0.5 * a * ks * ks); phase = 1; }
    else { const v = a * t1, [x1, z1] = onRamp(12), u = ks - t1, vx = dx * v, vz = dz * v, zf = z1 + vz * u - 4.9 * u * u;
      if (zf > -1.5 && !S.t2) { ox = x1 + vx * u; oz = zf; rot = 35 + Math.min(18, u * 14); phase = 2; }
      else { if (!S.t2) { S.t2 = ks; S.x2 = x1 + vx * u; S.spl = 1; } const w = ks - S.t2; phase = 3;
        if (w < 1.4) { ox = S.x2 - w * 4; oz = -1.5 - 2.5 * Math.sin(Math.min(1, w / 1.4) * Math.PI) ; rot = 53 - 58 * Math.min(1, w / 1.2); }
        else { ox = S.x2 - 5.6 - (w - 1.4) * 2.8; oz = -0.55 + Math.sin(t * 2) * .05; rot = -2; phase = 4; } } } }

// ===================== ADMIN: muster station & emergency lighting, pyrotechnics expiry control, LSA inspection records =====================
let AC = null; function beep(f, d, at, vol = .25) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(); o.type = "square"; o.frequency.value = f; g.gain.value = 0; o.connect(g).connect(AC.destination); const t0 = AC.currentTime + at; g.gain.setValueAtTime(vol, t0); g.gain.setValueAtTime(0, t0 + d); o.start(t0); o.stop(t0 + d + .05); } catch (e) {} }

  ${[[60, 70], [100, 60], [140, 70], [70, 120], [130, 120]].map(([x, y]) => `<circle cx="${x}" cy="${y - 18}" r="9" fill="#fff"/><path d="M${x - 10} ${y + 22} L${x - 8} ${y - 6} Q${x} ${y - 10} ${x + 8} ${y - 6} L${x + 10} ${y + 22} Z" fill="#fff"/>`).join("")}
  <path d="M40 40 L160 40 L160 160 L40 160 Z" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="14 8"/><text x="100" y="186" text-anchor="middle" font-family="Arial" font-weight="900" font-size="16" fill="#fff">MUSTER STATION</text></svg>`; }
MODS.muster = {id:"muster", title:"MUSTER STATION & EMERGENCY LIGHTING", sub:"Alarm, muster list, muster stations and lighting", hero:w => ph("muster_hero", w * 1.4), L:[
 B.info("General alarm", () => `<div style="text-align:center">${ph("muster_hero", 420, "margin:0 auto")}<div style="margin-top:12px"><button class="btn" id="ga">PLAY GENERAL EMERGENCY ALARM</button></div><div style="font:600 30px Consolas,monospace;color:#f2c14e;margin-top:14px;letter-spacing:6px">• • • • • • • ▬▬▬</div></div>`,
  () => `<h2>General emergency alarm</h2>${kick("SOLAS III/6.4 and III/37")}<p class="lead"><b>Seven or more short blasts followed by one long blast</b> on the ship's whistle and the general alarm bells.</p><p>On this signal everyone goes to their <b>muster station</b>, wearing warm clothing and with their <b>lifejacket</b> (and immersion suit as instructed), and follows the <b>muster list</b>.</p>${keyBox("The abandon-ship order is given verbally by the master. The general alarm alone is not the order to abandon ship.")}`, {bind:() => { const b = $("ga"); if (b) b.onclick = () => { playGA(); mark(); }; }}),
 B.info("Muster list", () => `<div style="background:#f4f1e6;color:#111;padding:14px 16px;font:12px/1.5 Arial;max-width:520px;border:2px solid #333"><b style="font-size:15px">MUSTER LIST · MV ECADEMY TRAINER (sample)</b><br>General emergency alarm: 7 short + 1 long · Fire: continuous ringing · Man overboard: O (— — —)<table style="width:100%;border-collapse:collapse;margin-top:8px">${[["Master", "Bridge", "Overall command; communications"], ["Chief Officer", "Lifeboat / muster station", "In charge of muster station; head count"], ["2nd Officer", "Bridge", "GMDSS distress communications, EPIRB, SART"], ["3rd Officer", "Lifeboat", "Lifeboat preparation; brings SART, VHF"], ["Bosun", "Lifeboat", "Davit / release gear; bow lashing"], ["AB 1", "Liferaft (stbd)", "Liferaft launching"], ["Cook", "Muster station", "Extra provisions, blankets"]].map(r => `<tr>${r.map(c => `<td style="border:1px solid #999;padding:3px 5px">${c}</td>`).join("")}</tr>`).join("")}</table></div>`,
  () => `<h2>Muster list</h2>${kick("SOLAS III/8 and III/37")}<p>The <b>muster list</b> shows the general alarm signal, actions on alarm, how the order to abandon ship is given, and the <b>duties</b> and <b>muster station</b> of every crew member, with substitutes for key persons.</p><p>It is posted in conspicuous places: <b>bridge, engine room and crew accommodation</b>. Each crew member has the same instructions on their cabin card or lifejacket.</p>${keyBox("It is prepared before the ship sails and updated when the crew changes.")}`),
 B.info("Muster station and lighting", () => ph("muster_hero", 560), () => `<h2>Muster stations and emergency lighting</h2>${kick("SOLAS III/11")}${table(["Requirement", "Details"], [["Location", "Close to the embarkation stations; readily accessible from accommodation and work areas"], ["Space", "Ample room to marshal and instruct persons wearing lifejackets"], ["Lighting", "Muster and embarkation stations, alleyways, stairways and exits lit by the <b>emergency source of electrical power</b>"], ["Embarkation areas", "Survival craft and the water below lit, including where the craft is launched"], ["Signs", "IMO symbols for muster station, lifejackets, survival craft, directions"]])}${noteBox("At drills check the emergency lighting works when the main supply is off.")}`),
 B.steps("Response to alarm", "On hearing the general alarm", "Select each action in order.", ["Stop work safely; close doors and ports on the way.", "Dress warmly; take lifejacket (and immersion suit as instructed).", "Go to your muster station by the marked route; do not use lifts.", "Report for the head count; answer the roll call.", "Carry out your muster-list duty; wait for orders.", "Abandon ship only on the master's verbal order."], k => ph("muster_hero", 520), {after:keyBox("SOLAS III/19: every crew member takes part in at least one abandon-ship drill and one fire drill every month.")}),
 B.quiz([["General emergency alarm signal?", ["7 or more short + 1 long", "3 long", "1 long"], 0, "SOLAS III/37 / COLREG practice."], ["Where is the muster list posted?", ["Bridge, engine room, crew accommodation", "Only in the master's cabin", "On the funnel"], 0, "SOLAS III/37."], ["Muster stations must be lit by...", ["The emergency source of power", "Hand torches only", "Daylight"], 0, "SOLAS III/11."]]),
 B.real("SOLAS III/6.4, III/8, III/11, III/19, III/37: general emergency alarm 7 short + 1 long, muster list contents and posting, muster and embarkation stations lit by the emergency source, monthly drills.", "the muster list shown is a sample; your ship's list and duties will differ.")]};
// ---------- pyrotechnics expiry control ----------
const PYRO = [["Bridge", "Rocket parachute flare", 12, "2027-05"], ["Lifeboat No.1", "Rocket parachute flare", 4, "2026-11"], ["Lifeboat No.1", "Red hand flare", 6, "2026-09"], ["Lifeboat No.1", "Buoyant smoke signal", 2, "2028-02"], ["Bridge wing PORT", "MOB light + smoke", 1, "2027-01"], ["Bridge wing STBD", "MOB light + smoke", 1, "2026-10"], ["Bridge", "Line-throwing rocket", 4, "2026-12"], ["Liferafts (SOLAS A)", "Hand flares / rockets / smoke", "6/4/2 each", "see service cert"]];
function pyroStatus(exp, today) { if (!/^\d{4}-\d{2}$/.test(exp)) return ["LIFERAFT SERVICE", "#8fa6ad"]; const [y, m] = exp.split("-").map(Number), [ty, tm] = today.split("-").map(Number), d = (y - ty) * 12 + (m - tm); return d < 0 ? ["EXPIRED", "#ff8a6a"] : d <= 3 ? ["ORDER NOW (≤ 3 months)", "#f2c14e"] : ["OK", "#7dffa6"]; }

 B.info("Inventory", () => `<div style="width:100%;padding:10px"><div class="row" style="margin-bottom:8px;color:#cfe">Today (month): <input id="today" type="month" value="${ST.v.today || "2026-10"}" style="background:#071014;color:#fff;border:1px solid #3d5560;padding:3px"></div>${table(["Location", "Item", "Qty", "Expiry", "Status"], PYRO.map(r => { const [s, c] = pyroStatus(r[3], ST.v.today || "2026-10"); return [r[0], r[1], r[2], r[3], `<b style="color:${c}">${s}</b>`]; }))}</div>`,
  () => `<h2>Pyrotechnics inventory</h2>${kick("Sample inventory for MV ECADEMY TRAINER")}<p>Keep a list of <b>every pyrotechnic</b> on board with its location, quantity and <b>expiry date</b>. Check it at the monthly LSA inspection.</p><p>Change the month above: items within <b>3 months</b> of expiry must be ordered; expired items must be replaced.</p>${keyBox("Order early: dangerous goods take time to deliver to the ship.")}`, {bind:() => { const d = $("today"); if (d) d.onchange = () => { ST.v.today = d.value; show(); mark(); }; }}),
 B.info("Requirements", () => ph("pyro_hero", 520), () => `<h2>What must be carried</h2>${table(["Where", "Rocket parachute flares", "Red hand flares", "Buoyant smoke"], [["Bridge", "12", "-", "-"], ["Each lifeboat", "4", "6", "2"], ["Liferaft SOLAS A pack", "4", "6", "2"], ["Liferaft SOLAS B pack", "2", "3", "1"]])}${table(["Other", "Requirement"], [["MOB light + smoke", "At least 2 (bridge wings)"], ["Line-throwing appliance", "At least 4 projectiles"]])}`),
 B.steps("Replacing and disposal", "Replacing expired pyrotechnics", "Select each step in order.", ["Identify items expiring within 3 months at the monthly inspection.", "Requisition replacements through the company (dangerous goods).", "On delivery: check type, quantity and new expiry dates.", "Stow new items in the watertight containers; update the inventory.", "Keep expired items separately, clearly marked 'EXPIRED – DO NOT USE'.", "Land expired items ashore to an approved disposal facility; keep the receipt. Never throw them overboard or fire them."], k => ph(k >= 4 ? "pyro_exp" : "pyro_hero", 520)),
 B.quiz([["When should a replacement be ordered?", ["After it expires", "When within about 3 months of expiry (or as SMS)", "Never"], 1, "Delivery takes time."], ["What is done with expired flares?", ["Throw overboard", "Land ashore for approved disposal", "Fire them on New Year"], 1, "Expired pyrotechnics are hazardous."], ["How many rocket parachute flares on the bridge?", ["4", "12", "6"], 1, "SOLAS III/6.3."]]),
 B.real("SOLAS III/6.3, LSA Code 4.1.5 / 4.4.8 quantities; expired pyrotechnics replaced and disposed of ashore.", "the inventory and dates are fictional; the 3-month re-order window is a common company practice, follow your SMS.")]};

 B.quiz([["How long must lifeboat engines run at the weekly test?", ["At least 3 min", "1 h", "30 s"], 0, "SOLAS III/20.6."], ["The monthly inspection uses...", ["The checklist in the training manual / maintenance instructions", "Memory", "A photo"], 0, "SOLAS III/20.7 and III/36."], ["Inflatable liferafts are serviced every...", ["12 months", "5 years", "month"], 0, "SOLAS III/20.8."]]),
 B.real("SOLAS III/19, III/20 and III/36; MSC.402(96).", "checklists are samples; use the forms in your SMS.")]};
