<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>PSC Voice Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one card at a time, controls at the thumb; dark bridge-console palette */
:root{--bg:#0b1724;--panel:#132638;--panel2:#0f2030;--line:#22394f;--ink:#e6edf3;--mute:#a8bacb;--acc:#55d9f5;--btn:#0369a1;--ok:#3ecf8e;--bad:#ff6b6b;--amb:#ffc857;--disp:"Rajdhani","Segoe UI",sans-serif;--body:"Inter","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px}
.wrap{max-width:720px;margin:0 auto;padding-block:14px 120px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.brand{font:700 18px/1 var(--disp);letter-spacing:.12em}.brand b{color:var(--acc)}
.sub{color:var(--mute);font-size:13px}
.stats{margin-left:auto;display:flex;gap:6px;font:600 12px ui-monospace,monospace}
.stats span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.stats .ok{color:var(--ok)}.stats .bad{color:var(--bad)}
.bar{height:4px;background:var(--panel);border-radius:4px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tag{font:700 11px/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--amb);background:#2a2412;border-radius:4px;padding:5px 7px}
.tag.t{color:var(--acc);background:#0f2b38}
.q{font:600 20px/1.35 var(--body);margin:4px 0 14px;text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:12px 14px;border-radius:10px;font:500 15px/1.4 var(--body);cursor:pointer}
.opt b{font:700 15px var(--disp);color:var(--acc);min-width:18px}
.opt:hover{border-color:var(--acc)}.opt:focus-visible{outline:2px solid var(--acc)}
.opt.ok{border-color:var(--ok);background:#0f2e22}.opt.bad{border-color:var(--bad);background:#33171a}
.opt:disabled{cursor:default}
.ident{display:flex;gap:8px}.ident input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:12px;border-radius:10px;font:500 16px var(--body)}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--panel2);border-left:3px solid var(--amb);font-size:15px}
.fb .h{font:700 13px var(--disp);letter-spacing:.12em;margin-bottom:4px}
.fb.ok .h{color:var(--ok)}.fb.bad .h{color:var(--bad)}
.ref{color:var(--mute);font-size:12.5px;margin-top:6px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:#08121ccc;backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.dock .in{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:12px 14px;border-radius:10px;font:700 14px var(--body);cursor:pointer}
.btn.pri{background:var(--btn);border-color:var(--btn)}
.btn.mic{flex:1;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.mic.on{background:#7a1f2b;border-color:#c23a4b}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mute)}.mic.on .dot{background:#ff6b6b;animation:p 1s infinite}@keyframes p{50%{opacity:.3}}
.heard{color:var(--mute);font-size:13px;text-align:center;min-height:20px;margin-top:6px}
.help{margin-top:14px;color:var(--mute);font-size:13px}
.help code{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--ink)}
.end{text-align:center}.end .big{font:700 48px var(--disp);color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:600 13px var(--body);color:var(--ink);cursor:pointer}
.chip.on{border-color:var(--acc);color:var(--acc)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="wrap">
 <header><div class="brand"><b>E</b>CADEMY · PSC REVIEW</div><div class="stats"><span class="ok" id="sOk">✓ 0</span><span class="bad" id="sBad">✗ 0</span><span id="sLeft">0 left</span></div></header>
 <div class="sub" id="topicLine">Port State Control · random order · wrong answers come back</div>
 <div class="bar"><i id="prog"></i></div>
 <div class="chips" id="topics"></div>
 <main id="main"></main>
 <div class="help" id="help">Voice: tap <b>🎤 Speak</b>, then say the letter (<code>A</code>, <code>B</code>, <code>C</code>, <code>D</code>), <code>true</code> / <code>false</code>, or the answer itself. Commands: <code>repeat</code>, <code>next</code>, <code>skip</code>, <code>explain</code>, <code>score</code>, <code>stop</code>. <b>Hands-free</b> reads each question and listens automatically.</div>
</div>
<div class="dock"><div class="in">
 <button class="btn" id="bRead" title="Read aloud">🔊</button>
 <button class="btn mic" id="bMic"><span class="dot"></span><span id="micTxt">🎤 Speak</span></button>
 <button class="btn" id="bHands">Hands-free</button>
 <button class="btn pri" id="bNext">Next ▸</button>
</div><div class="heard" id="heard"></div></div>
<script>
/* ===== QUESTION BANK =====
   t: "mc" | "tf" | "id"; q: question; c: choices (mc); a: index (mc) | true/false (tf) | [accepted answers] (id); x: explanation; r: reference/topic */
const BANK = [
 {tp:"Basics", t:"mc", q:"Which IMO resolution sets the current Procedures for Port State Control?", c:["A.1155(32)","A.741(18)","MSC.1/Circ.1275","A.952(23)"], a:0, x:"Res. A.1155(32), Procedures for Port State Control, 2021, replaced A.1138(31). It is the PSCO's guide for initial and more detailed inspections and detention.", r:"IMO A.1155(32)"},
 {tp:"Basics", t:"mc", q:"Which SOLAS regulation gives a port State the right to control foreign ships?", c:["SOLAS I/19","SOLAS II-2/10","SOLAS V/19","SOLAS XI-1/2"], a:0, x:"SOLAS Chapter I, Regulation 19 (Control). Similar articles exist in MARPOL (Art. 5 & 6), Load Lines (Art. 21), STCW (I/4), Tonnage 69 (Art. 12) and MLC 2006 (Art. V).", r:"SOLAS I/19"},
 {tp:"Basics", t:"mc", q:"Which regional PSC agreement covers the Asia-Pacific region, including the Philippines?", c:["Tokyo MOU","Paris MOU","Indian Ocean MOU","Viña del Mar Agreement"], a:0, x:"The Tokyo MOU (signed 1993) covers Asia-Pacific. Paris MOU covers Europe and the North Atlantic; Indian Ocean MOU the Indian Ocean; Viña del Mar Latin America.", r:"Regional MOUs"},
 {tp:"Basics", t:"tf", q:"The United States Coast Guard is a full member of the Tokyo MOU.", a:false, x:"The USCG runs its own PSC programme and is not a member of any regional MOU (it is an observer in some).", r:"Regional MOUs"},
 {tp:"Basics", t:"mc", q:"Under the 'no more favourable treatment' principle, a ship whose flag State has NOT ratified a convention…", c:["is still inspected against that convention","is exempt from that convention","may only be inspected by its own flag","cannot be detained for that convention"], a:0, x:"Ships of non-Party flags receive no more favourable treatment: the PSCO applies the same requirements so they gain no advantage.", r:"No more favourable treatment"},
 {tp:"Inspection", t:"mc", q:"What does the PSCO check first in an initial inspection?", c:["Certificates and documents, and the general condition of the ship","Every fire damper on board","The cargo stowage plan only","The crew's personal belongings"], a:0, x:"Initial inspection: board, check certificates and documents, get an impression of overall condition, hygiene and crew. A more detailed inspection follows only with clear grounds.", r:"A.1155 · initial inspection"},
 {tp:"Inspection", t:"id", q:"What do you call the evidence that makes the PSCO go from an initial inspection to a more detailed inspection?", a:["clear grounds","clear ground"], x:"Clear grounds: e.g. invalid or missing certificates, evidence of serious deficiencies, crew unable to carry out essential duties, collision or grounding on the way, an alert from another authority.", r:"A.1155 · clear grounds"},
 {tp:"Inspection", t:"tf", q:"A crew that cannot communicate or perform a basic drill (e.g. start the emergency fire pump) can be clear grounds for a more detailed inspection.", a:true, x:"Operational control: if crew cannot carry out essential shipboard procedures, the PSCO has clear grounds, and it may become a detainable ISM issue.", r:"Operational requirements"},
 {tp:"Inspection", t:"mc", q:"The PSC inspection report has two parts. Which form lists the deficiencies with the action taken?", c:["Form B","Form A","Form C","Form D"], a:0, x:"Form A is the report of inspection (ship particulars, certificates). Form B lists each deficiency with its action code.", r:"A.1155 · report"},
 {tp:"Action codes", t:"mc", q:"Action code 17 means…", c:["Master instructed to rectify the deficiency before departure","Ship detained","Deficiency rectified","Rectify at next port"], a:0, x:"17 = rectify before departure. 10 = rectified; 15 = rectify at next port; 16 = rectify within 14 days; 30 = detainable deficiency / ship detained; 99 = other (specify).", r:"Action codes"},
 {tp:"Action codes", t:"mc", q:"Which action code is used for a detainable deficiency?", c:["30","17","15","99"], a:0, x:"Code 30 = grounds for detention. The ship cannot sail until the deficiency is rectified and the PSCO lifts the detention.", r:"Action codes"},
 {tp:"Action codes", t:"mc", q:"Action code 10 means…", c:["Deficiency rectified","Rectify within 14 days","Ship detained","Rectify at next port"], a:0, x:"Code 10 = rectified during the inspection, e.g. a missing entry made in the Oil Record Book in the PSCO's presence.", r:"Action codes"},
 {tp:"Action codes", t:"id", q:"Which action code means 'rectify deficiency at the next port'?", a:["15","fifteen","code 15"], x:"15 = at next port. 16 = within 14 days. 17 = before departure.", r:"Action codes"},
 {tp:"Detention", t:"mc", q:"When may the PSCO detain a ship?", c:["When deficiencies are clearly hazardous to safety, health or the environment","Whenever more than five deficiencies are found","Only when the ship has no P&I insurance","Only if the Master refuses to sign the report"], a:0, x:"Detention is for deficiencies that make the ship unsafe to proceed, a danger to health or the environment, regardless of how many items there are.", r:"A.1155 · detention"},
 {tp:"Detention", t:"tf", q:"After a detention, the port State informs the flag State (and the recognized organization if relevant).", a:true, x:"The flag Administration and, where relevant, the RO that issued the certificates are notified. The detention appears in the MOU database and on Equasis.", r:"Detention · notification"},
 {tp:"Detention", t:"tf", q:"A ship has no right to compensation even if it was unduly detained.", a:false, x:"SOLAS I/19(f) and other conventions: all possible efforts must be made to avoid undue detention; a ship unduly detained is entitled to compensation for loss or damage.", r:"SOLAS I/19(f)"},
 {tp:"Detention", t:"mc", q:"Which of these is a typical ground for detention?", c:["Emergency fire pump fails to deliver water","One missing signature in the deck log","A cabin light bulb not working","Dirty galley floor at lunchtime"], a:0, x:"Failure of essential equipment (emergency fire pump, emergency generator, lifeboat release, fire dampers, OWS) is a classic detainable deficiency.", r:"Detainable deficiencies"},
 {tp:"Detention", t:"mc", q:"Who can appeal a detention decision?", c:["The owner or operator, through the port State's appeal procedure","Only the crew's union","The cargo receiver","Nobody, it is final"], a:0, x:"Each port State has an appeal / complaint procedure; the MOUs also have a review panel for disputed detentions. The appeal does not lift the detention by itself.", r:"Appeals"},
 {tp:"Risk profile", t:"mc", q:"Under the Tokyo MOU New Inspection Regime, a High Risk Ship is due for a periodic inspection every…", c:["2 – 4 months","5 – 8 months","9 – 18 months","24 – 36 months"], a:0, x:"Tokyo MOU NIR windows: HRS 2–4 months, SRS 5–8 months, LRS 9–18 months after the last inspection.", r:"Tokyo MOU NIR"},
 {tp:"Risk profile", t:"mc", q:"Which factor does NOT affect the ship risk profile?", c:["The nationality of the Master","Ship type and age","Flag and RO performance","Company performance and the ship's own history of deficiencies and detentions"], a:0, x:"Risk profile: ship type, age, flag performance, RO performance, company performance, deficiencies and detentions in the last 36 months. The Master's nationality is not a factor.", r:"Ship risk profile"},
 {tp:"Risk profile", t:"id", q:"What public online database lets anyone check a ship's PSC inspection history?", a:["equasis"], x:"Equasis shows PSC inspections and detentions from the MOUs, along with flag, class and P&I information.", r:"Equasis"},
 {tp:"Risk profile", t:"tf", q:"A Concentrated Inspection Campaign (CIC) usually runs for three months and focuses on one area, such as fire safety or STCW.", a:true, x:"Tokyo and Paris MOUs run joint CICs, typically 1 September to 30 November, with a questionnaire on one topic.", r:"CIC"},
 {tp:"Certificates", t:"mc", q:"Under MLC 2006, which documents must a ship of 500 GT or more on international voyages carry?", c:["Maritime Labour Certificate and DMLC Part I and II","Only the crew list","Safety Management Certificate only","International Tonnage Certificate only"], a:0, x:"The MLC certificate with the Declaration of Maritime Labour Compliance, Part I (flag) and Part II (shipowner's measures).", r:"MLC 2006"},
 {tp:"Certificates", t:"tf", q:"An expired or invalid statutory certificate is clear grounds for a more detailed inspection.", a:true, x:"Missing or invalid certificates are listed in A.1155 as clear grounds, and can lead to detention.", r:"A.1155 · clear grounds"},
 {tp:"Certificates", t:"id", q:"Which document states the minimum number and grades of crew the ship must carry?", a:["minimum safe manning document","safe manning document","msmd","safe manning certificate"], x:"The Minimum Safe Manning Document issued by the flag State. The PSCO compares it with the crew list and the CoCs.", r:"SOLAS V/14"},
 {tp:"ISM", t:"mc", q:"When several deficiencies show the Safety Management System is not working, the PSCO may raise…", c:["An ISM-related deficiency, possibly a detainable major non-conformity","Nothing, ISM is only for the flag State","A fine for each crew member","A cargo deficiency"], a:0, x:"Many or serious deficiencies point to a failing SMS. The PSCO records an ISM deficiency; a major non-conformity can lead to detention and an additional audit.", r:"ISM Code"},
 {tp:"ISM", t:"tf", q:"Drills and maintenance that are recorded but obviously not done are an ISM failure.", a:true, x:"False records are among the most serious findings: they show the SMS exists only on paper.", r:"ISM Code"},
 {tp:"LSA / FFE", t:"mc", q:"How often must each crew member take part in at least one abandon-ship drill and one fire drill?", c:["Every month","Every week","Every 3 months","Every year"], a:0, x:"SOLAS III/19: every crew member at least one abandon-ship drill and one fire drill every month (within 24 h of leaving port if more than 25% of the crew have not done one).", r:"SOLAS III/19"},
 {tp:"LSA / FFE", t:"mc", q:"How often must each lifeboat be launched with its assigned crew and manoeuvred in the water?", c:["At least once every 3 months","Every month","Every year","Only at dry dock"], a:0, x:"SOLAS III/19.3.3.3: each lifeboat launched with crew and manoeuvred at least once every 3 months. Free-fall lifeboats: free-fall launch at least every 6 months (or 12 months with simulated launch).", r:"SOLAS III/19"},
 {tp:"LSA / FFE", t:"tf", q:"Fire dampers that do not close fully are a common PSC finding and can be detainable.", a:true, x:"Fire dampers, fire doors, quick-closing valves and remote stops are tested by PSCOs because they stop a fire from spreading.", r:"SOLAS II-2"},
 {tp:"LSA / FFE", t:"mc", q:"The PSCO asks to see the emergency fire pump working. What should happen?", c:["It starts and delivers two jets of water at the required pressure on deck","It starts and runs dry","It needs the main fire pump running first","The engineer shows only the maintenance record"], a:0, x:"The emergency fire pump must start independently and provide the required water pressure at the hydrants with the engine room lost.", r:"SOLAS II-2/10 · FSS 12"},
 {tp:"LSA / FFE", t:"id", q:"What is the international standard flange that lets a shore fire brigade pump water into the ship's fire main?", a:["international shore connection","isc"], x:"The international shore connection, kept on board with bolts, nuts and a gasket, ready for use on either side.", r:"SOLAS II-2/10.2.1.7"},
 {tp:"MARPOL", t:"mc", q:"What is the maximum oil content of the effluent from the Oily Water Separator under MARPOL Annex I?", c:["15 ppm","50 ppm","100 ppm","5 ppm"], a:0, x:"15 ppm, with an oil content meter that stops the discharge automatically when the limit is exceeded. PSCOs test the 3-way valve and the alarm.", r:"MARPOL Annex I"},
 {tp:"MARPOL", t:"mc", q:"Since 1 January 2020, the global sulphur limit for fuel oil outside an ECA is…", c:["0.50 % m/m","3.50 % m/m","0.10 % m/m","1.00 % m/m"], a:0, x:"MARPOL Annex VI, Reg. 14: 0.50 % globally; 0.10 % inside an Emission Control Area. PSCOs check the bunker delivery notes and fuel changeover records.", r:"MARPOL Annex VI"},
 {tp:"MARPOL", t:"tf", q:"Bunker delivery notes must be kept on board for at least three years.", a:true, x:"Annex VI Reg. 18: BDNs kept for 3 years, with the MARPOL sample retained at least 12 months.", r:"MARPOL Annex VI"},
 {tp:"MARPOL", t:"id", q:"Which record book must have an entry for every discharge of bilge water through the OWS?", a:["oil record book","orb","oil record book part i","oil record book part 1"], x:"Oil Record Book Part I (machinery space operations), signed by the officer in charge and each page by the Master.", r:"MARPOL Annex I"},
 {tp:"MARPOL", t:"mc", q:"Which documents does the PSCO check for MARPOL Annex V (garbage)?", c:["Garbage management plan, garbage record book and placards","Only the ballast water record book","Cargo manifest","Crew list"], a:0, x:"Annex V: garbage management plan, garbage record book (ships ≥ 400 GT or certified for 15+ persons) and placards (ships ≥ 12 m).", r:"MARPOL Annex V"},
 {tp:"Ballast water", t:"mc", q:"Ships are now required to meet which ballast water standard?", c:["D-2 performance standard","D-1 exchange only","No standard","D-4 prototype"], a:0, x:"The BWM Convention D-2 standard (treatment system) applies to all ships after the phase-in that ended in September 2024. PSCOs check the BWMP, record book and the BWTS working.", r:"BWM Convention"},
 {tp:"STCW / MLC", t:"tf", q:"Hours of rest records are checked by PSCOs under both STCW and MLC.", a:true, x:"Minimum 10 hours rest in any 24 h and 77 hours in any 7 days, records signed by the seafarer and the Master.", r:"STCW VIII/1 · MLC 2.3"},
 {tp:"STCW / MLC", t:"mc", q:"Minimum hours of rest required in any 7-day period?", c:["77 hours","70 hours","84 hours","56 hours"], a:0, x:"77 hours in any 7 days; 10 hours in any 24 h, which may be split into no more than two periods, one at least 6 hours long.", r:"STCW VIII/1"},
 {tp:"STCW / MLC", t:"tf", q:"An officer whose Certificate of Competency is valid but who has no flag State endorsement can still be a deficiency.", a:true, x:"STCW I/10: a foreign CoC must be endorsed by the flag State. Missing endorsements are a common STCW deficiency.", r:"STCW I/10"},
 {tp:"Navigation", t:"mc", q:"The PSCO asks the OOW to show the ECDIS. What is commonly checked?", c:["Charts up to date, safety settings correct, type-specific training certificates","The colour of the screen","The ECDIS serial number only","Nothing, ECDIS is not PSC"], a:0, x:"ENC update status, permits, safety contour and alarms, back-up arrangement, and generic plus type-specific ECDIS training for the officers.", r:"SOLAS V/19 · STCW"},
 {tp:"Navigation", t:"tf", q:"A passage plan only from berth to pilot station is acceptable.", a:false, x:"The passage plan covers berth to berth (SOLAS V/34, IMO A.893), including pilotage waters.", r:"SOLAS V/34"},
 {tp:"Master's role", t:"mc", q:"What should the Master do during a PSC inspection?", c:["Accompany the PSCO with a responsible officer, answer openly, and agree corrective actions","Refuse access until the agent arrives","Keep the PSCO in the office only","Sign the report without reading it"], a:0, x:"Cooperate, assign an officer, demonstrate equipment, keep a list of findings, and make sure each deficiency and action code is understood before signing.", r:"Master's role"},
 {tp:"Master's role", t:"tf", q:"If the Master disagrees with a deficiency, he can note it and the company can use the appeal or complaint procedure.", a:true, x:"Sign for receipt; disagreement goes through the company and the port State's complaint or appeal procedure.", r:"Appeals"}
];
/* ===== STATE ===== */
const $ = id => document.getElementById(id);
const TOPICS = [...new Set(BANK.map(q => q.tp))];
let on = new Set(TOPICS), deck = [], cur = null, answered = false, ok = 0, bad = 0, again = [], hands = false, total = 0;
const shuffle = a => { for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function build(){ deck = shuffle(BANK.filter(q => on.has(q.tp)).map(q => ({ ...q, ord: q.t === "mc" ? shuffle(q.c.map((_, i) => i)) : null }))); total = deck.length; ok = bad = 0; again = []; next(); }
function stats(){ $("sOk").textContent = "✓ " + ok; $("sBad").textContent = "✗ " + bad; $("sLeft").textContent = (deck.length + (cur && !answered ? 1 : 0)) + " left"; $("prog").style.width = total ? ((total - deck.length - (answered ? 0 : 1)) / total * 100) + "%" : "0"; }
function chips(){ $("topics").innerHTML = TOPICS.map(t => `<button class="chip ${on.has(t) ? "on" : ""}" data-t="${t}">${t}</button>`).join(""); document.querySelectorAll(".chip").forEach(c => c.onclick = () => { const t = c.dataset.t; on.has(t) ? on.delete(t) : on.add(t); if(!on.size) on = new Set(TOPICS); chips(); build(); }); }
function next(){ stopListen();
  if(!deck.length && again.length){ deck = shuffle(again.map(q => ({ ...q, ord: q.t === "mc" ? shuffle(q.c.map((_, i) => i)) : null }))); again = []; }
  if(!deck.length){ cur = null; finish(); return; }
  cur = deck.shift(); answered = false; render(); stats(); if(hands) speakQ(true); }
const L = "ABCD";
function render(){ const q = cur; let h = `<div class="card"><div class="meta"><span class="tag">${q.tp}</span><span class="tag t">${q.t === "mc" ? "Multiple choice" : q.t === "tf" ? "True or false" : "Identification"}</span></div><div class="q">${q.q}</div>`;
  if(q.t === "mc") h += `<div class="opts">${q.ord.map((ci, k) => `<button class="opt" data-k="${k}"><b>${L[k]}</b><span>${q.c[ci]}</span></button>`).join("")}</div>`;
  else if(q.t === "tf") h += `<div class="opts"><button class="opt" data-v="1"><b>T</b><span>True</span></button><button class="opt" data-v="0"><b>F</b><span>False</span></button></div>`;
  else h += `<form class="ident" id="idf"><input id="idi" autocomplete="off" placeholder="Type or say the answer"><button class="btn pri">Check</button></form>`;
  h += `<div id="fb"></div></div>`; $("main").innerHTML = h;
  document.querySelectorAll(".opt[data-k]").forEach(b => b.onclick = () => answerMC(+b.dataset.k));
  document.querySelectorAll(".opt[data-v]").forEach(b => b.onclick = () => answerTF(b.dataset.v === "1"));
  if($("idf")) $("idf").onsubmit = e => { e.preventDefault(); answerID($("idi").value); }; }
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
function lev(a, b){ const m = a.length, n = b.length, d = Array.from({ length:m + 1 }, (_, i) => [i, ...Array(n).fill(0)]); for(let j = 1; j <= n; j++) d[0][j] = j; for(let i = 1; i <= m; i++) for(let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[m][n]; }
function matchID(said){ const s = norm(said); return cur.a.some(x => { const t = norm(x); return s === t || s.includes(t) || (t.length > 4 && lev(s, t) <= Math.max(1, Math.floor(t.length / 6))); }); }
function correctText(){ const q = cur; return q.t === "mc" ? q.c[q.a] : q.t === "tf" ? (q.a ? "True" : "False") : q.a[0].replace(/\b\w/g, c => c.toUpperCase()); }
function result(good, picked){ if(answered) return; answered = true; good ? ok++ : (bad++, again.push(cur)); stats();
  const q = cur; $("fb").innerHTML = `<div class="fb ${good ? "ok" : "bad"}"><div class="h">${good ? "CORRECT" : "NOT QUITE · ANSWER: " + correctText().toUpperCase()}</div>${q.x}<div class="ref">${q.r}</div></div>`;
  if(q.t === "mc"){ document.querySelectorAll(".opt[data-k]").forEach(b => { const k = +b.dataset.k; b.disabled = true; if(q.ord[k] === q.a) b.classList.add("ok"); else if(k === picked) b.classList.add("bad"); }); }
  if(q.t === "tf"){ document.querySelectorAll(".opt[data-v]").forEach(b => { b.disabled = true; const v = b.dataset.v === "1"; if(v === q.a) b.classList.add("ok"); else if(v === picked) b.classList.add("bad"); }); }
  say((good ? "Correct. " : "Not quite. The answer is " + correctText() + ". ") + (hands || !good ? q.x : ""), () => { if(hands) setTimeout(next, 900); }); }
function answerMC(k){ result(cur.ord[k] === cur.a, k); }
function answerTF(v){ result(v === cur.a, v); }
function answerID(s){ if(!s.trim()) return; result(matchID(s)); }
function finish(){ const pct = ok + bad ? Math.round(ok / (ok + bad) * 100) : 0; $("main").innerHTML = `<div class="card end"><div class="big">${pct}%</div><p>${ok} correct, ${bad} to review. Every missed question came back until you got it right.</p><button class="btn pri" id="re">Start again · new random order</button></div>`; $("re").onclick = build; stats(); say(`Finished. ${ok} correct, ${bad} missed. ${pct} percent.`); }
/* ===== VOICE OUT ===== */
let voice = null; function pickVoice(){ const v = speechSynthesis.getVoices(); voice = v.find(x => /en-(GB|US|AU|PH)/i.test(x.lang) && /natural|google|samantha|daniel/i.test(x.name)) || v.find(x => /^en/i.test(x.lang)) || null; }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, done){ if(!("speechSynthesis" in window)){ done && done(); return; } speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text.replace(/≥/g, "at least").replace(/%/g, " percent").replace(/m\/m/g, "")); if(voice) u.voice = voice; u.rate = 1; u.onend = () => done && done(); u.onerror = () => done && done(); speechSynthesis.speak(u); }
function qText(){ const q = cur; let t = q.q + " "; if(q.t === "mc") t += q.ord.map((ci, k) => `${L[k]}. ${q.c[ci]}.`).join(" "); else if(q.t === "tf") t += "True or false?"; else t += "Say your answer."; return t; }
function speakQ(listenAfter){ if(!cur) return; say(qText(), () => { if(listenAfter && hands && !answered) listen(); }); }
/* ===== VOICE IN ===== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition; let rec = null, listening = false;
function stopListen(){ if(rec && listening){ try{ rec.abort(); }catch(_){} } listening = false; $("bMic").classList.remove("on"); $("micTxt").textContent = "🎤 Speak"; }
function listen(){ if(!SR){ $("heard").textContent = "Voice answers need Chrome (Android or PC). You can still tap or type."; return; } if(listening){ stopListen(); return; }
  speechSynthesis && speechSynthesis.cancel(); rec = new SR(); rec.lang = "en-US"; rec.interimResults = true; rec.maxAlternatives = 3; listening = true; $("bMic").classList.add("on"); $("micTxt").textContent = "Listening…";
  let final = "";
  rec.onresult = e => { let t = ""; for(const r of e.results){ t += r[0].transcript; if(r.isFinal) final = [...r].map(a => a.transcript); } $("heard").textContent = "Heard: " + t; };
  rec.onerror = e => { $("heard").textContent = e.error === "not-allowed" ? "Microphone blocked. Allow the mic for this page in the browser settings." : e.error === "no-speech" ? "Didn't hear anything. Tap Speak and try again." : "Voice error: " + e.error; };
  rec.onend = () => { listening = false; $("bMic").classList.remove("on"); $("micTxt").textContent = "🎤 Speak"; if(final) handle(Array.isArray(final) ? final : [final]); else if(hands && !answered) setTimeout(listen, 400); };
  try{ rec.start(); }catch(_){ stopListen(); } }
const LETTER = { a:0, ay:0, eh:0, "letter a":0, b:1, be:1, bee:1, "letter b":1, c:2, see:2, sea:2, si:2, "letter c":2, d:3, dee:3, the:3, "letter d":3 };
function handle(alts){ const s0 = norm(alts[0] || "");
  if(/\b(repeat|again|read)\b/.test(s0)) return speakQ(hands);
  if(/\b(next|skip|pass)\b/.test(s0)){ if(!answered && /skip|pass/.test(s0)){ again.push(cur); } return next(); }
  if(/\b(explain|why)\b/.test(s0)){ return say(cur ? cur.x : ""); }
  if(/\bscore\b/.test(s0)) return say(`${ok} correct, ${bad} wrong, ${deck.length} left.`, () => { if(hands && !answered) listen(); });
  if(/\b(stop|pause)\b/.test(s0)){ hands = false; $("bHands").classList.remove("pri"); return say("Hands-free off."); }
  if(!cur || answered) return;
  for(const s1 of alts.map(norm)){
    if(cur.t === "mc"){ const m = s1.match(/^(?:letter |answer |option |choice )?([a-d]|ay|eh|be|bee|see|sea|si|dee)$/) || s1.match(/\b(?:letter|answer|option|choice) ([a-d])\b/); if(m){ const k = LETTER[m[1]]; if(k != null) return answerMC(k); }
      const k2 = cur.ord.findIndex(ci => { const t = norm(cur.c[ci]); return t && (s1.includes(t) || (t.length > 6 && lev(s1, t) <= Math.floor(t.length / 5))); }); if(k2 >= 0) return answerMC(k2); }
    if(cur.t === "tf"){ if(/\b(true|tru|yes|correct)\b/.test(s1)) return answerTF(true); if(/\b(false|faults|no|wrong)\b/.test(s1)) return answerTF(false); }
    if(cur.t === "id"){ if(matchID(s1)){ if($("idi")) $("idi").value = alts[0]; return answerID(s1); } }
  }
  if(cur.t === "id"){ if($("idi")) $("idi").value = alts[0]; return answerID(alts[0]); }
  say("Sorry, I didn't catch that. Say A, B, C or D.", () => { if(hands) listen(); }); }
/* ===== CONTROLS ===== */
$("bRead").onclick = () => speakQ(false);
$("bMic").onclick = listen;
$("bNext").onclick = () => { if(cur && !answered) again.push(cur); next(); };
$("bHands").onclick = () => { hands = !hands; $("bHands").classList.toggle("pri", hands); if(hands){ if(!cur) build(); else if(answered) next(); else speakQ(true); } else { stopListen(); speechSynthesis && speechSynthesis.cancel(); } };
chips(); build();
</script></body></html>
