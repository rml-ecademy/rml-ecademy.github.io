<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECADEMY — Access Key Generator (PRIVATE)</title>
<style>
:root{--navy:#061622;--navy2:#0a2235;--cyan:#64ddff;--white:#f4fbff;--muted:#9fb8c7;--amber:#ffc857;--green:#5ee6a8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#0d3049,var(--navy));color:var(--white);font:15px/1.5 Inter,Segoe UI,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(980px,100%);background:linear-gradient(155deg,rgba(17,54,77,.75),rgba(5,25,39,.95));border:1px solid rgba(100,221,255,.22);border-radius:20px;padding:30px 28px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.brand{font:700 26px Georgia,serif}.brand b{color:var(--cyan)}.sub{color:var(--amber);font:600 .7rem/1 "Courier New",monospace;letter-spacing:.18em;text-transform:uppercase;margin:6px 0 22px}
label{display:block;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:14px 0 6px}
input,select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:#07192a;color:#fff;font-size:1rem}
button{margin-top:20px;width:100%;padding:13px;border:0;border-radius:12px;font-weight:700;font-size:1rem;cursor:pointer;color:#061622;background:linear-gradient(135deg,var(--cyan),#14b8d4)}
.out{margin-top:20px;display:none}.out.show{display:block}
.key{font:600 .95rem/1.5 "Courier New",monospace;word-break:break-all;background:#07192a;border:1px dashed rgba(100,221,255,.4);border-radius:12px;padding:14px;color:var(--green)}
.msg{margin-top:10px;white-space:pre-wrap;background:#07192a;border-radius:12px;padding:14px;font-size:.9rem;color:#dbe9f1}
.row{display:flex;gap:10px}.row button{flex:1}.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2)}
.warn{margin-top:18px;font-size:.78rem;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:26px}@media(max-width:860px){.grid{grid-template-columns:1fr}}
.hist h2{font-size:1.05rem;margin:0 0 4px}.hist .tools{display:flex;gap:8px;margin:10px 0}.hist .tools input{flex:1}.hist .tools button{margin:0;width:auto;padding:10px 14px;font-size:.85rem}
table{width:100%;border-collapse:collapse;font-size:.82rem}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.08);vertical-align:top}th{color:var(--muted);font-weight:600;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
td .pk{display:inline-block;padding:2px 7px;border-radius:999px;font:600 .68rem/1.4 "Courier New",monospace;background:rgba(100,221,255,.12);color:var(--cyan)}td .pk.C{background:rgba(255,200,87,.14);color:var(--amber)}td .pk.A{background:rgba(94,230,168,.14);color:var(--green)}
td .exp{color:var(--muted)}td .exp.soon{color:var(--amber)}td .exp.dead{color:#ff7b7b}
td button{margin:0;width:auto;padding:5px 9px;font-size:.72rem;background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,.15)}
.count{color:var(--muted);font-size:.8rem}
</style></head><body>
<div class="card">
<div class="grid"><div>
 <div class="brand"><b>E</b>CADEMY</div><div class="sub">Access Key Generator · private · huwag ipamahagi ang file na ito</div>
 <label>Uri ng code</label><select id="kind"><option value="personal">Personal — isang estudyante (naka-tali sa email)</option><option value="general">GENERAL — kahit sino, kahit anong email (para sa test / promo)</option></select>
 <label id="emailLbl">Email ng estudyante</label><input id="email" type="email" placeholder="juan.delacruz@gmail.com" autocomplete="off">
 <label id="nameLbl">Pangalan (lalabas sa hub)</label><input id="name" placeholder="Juan dela Cruz" autocomplete="off">
 <label>Package</label><select id="pkg"><option value="J">A · Junior Officers (3rd &amp; 2nd Mate)</option><option value="C" selected>B · Chief Mate</option><option value="A">C · All Access / Master</option></select>
 <div class="two"><div><label>Halaga na binayad (optional)</label><input id="amt" placeholder="2499"></div><div><label>GCash / Maya ref no. (optional)</label><input id="ref" placeholder="1234 5678 9012"></div></div>
 <label>Validity</label><select id="exp"><option value="h1">Trial · 1 hour</option><option value="d1">1 day</option><option value="d7">7 days</option><option value="m1">1 month</option><option value="m6">6 months</option><option value="m12" selected>12 months</option><option value="life">Lifetime</option></select>
 <button id="go">Generate access key</button>
 <div class="out" id="out">
  <label>Access key</label><div class="key" id="key"></div>
  <label>Mensahe para sa estudyante (copy &amp; send)</label><div class="msg" id="msg"></div>
  <div class="row"><button class="ghost" id="copyKey">Copy key</button><button class="ghost" id="copyMsg">Copy message</button></div>
 </div>
 <div class="warn">Ang key ay naka-tali sa email at package. Lahat ng na-generate ay automatic na nasa Student List sa kanan (nakasave sa browser ng computer na ito — i-export regularly bilang backup).</div>
</div>
<div class="hist">
 <h2>Student List</h2><div class="count" id="count"></div>
 <div class="tools"><input id="q" placeholder="Search name / email / package"><button class="ghost" id="exportCsv">Export CSV</button><button class="ghost" id="importCsv">Import</button><input type="file" id="importFile" accept=".csv" style="display:none"></div>
 <div style="max-height:620px;overflow:auto"><table><thead><tr><th>Date</th><th>Student</th><th>Pkg</th><th>Expiry</th><th>Paid</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</div></div>
</div>
<script>
const PRIV = {"kty": "EC", "crv": "P-256", "x": "MtUpDnnFjxjC0bFfCVLpxs0UxDuY_EydrGyNxfvh_HY", "y": "agGSXWmgRmBmzKcS0e3I5SYcB7tQwSI9MTbTTIacBoE", "d": "4dHw6N9vWIt5vzxRWx-G2L0ajrVGB5WsBg0jEgxdnWI"};
const HUB = 'https://rml-ecademy.github.io/';
const NAMES = {J:'Junior Officers', C:'Chief Mate', A:'All Access · Master'};
const fmtUntil = exp => exp==='9999999999' ? 'Lifetime access' : (/^\d{6}$/.test(exp) ? `Valid until ${exp.slice(0,4)}-${exp.slice(4)}` : 'Valid until ' + new Date(parseInt(exp)*1000).toLocaleString('en-PH',{dateStyle:'medium',timeStyle:'short'}));
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
document.getElementById('kind').onchange = () => { const gen = document.getElementById('kind').value==='general'; document.getElementById('email').disabled = gen; document.getElementById('email').value = gen ? '*' : ''; document.getElementById('emailLbl').textContent = gen ? 'Email — hindi kailangan (general code)' : 'Email ng estudyante'; document.getElementById('nameLbl').textContent = gen ? 'Pangalan ng code / grupo (hal. "Beta Tester")' : 'Pangalan (lalabas sa hub)'; };
async function gen(){
  const general = document.getElementById('kind').value==='general';
  const email = general ? '*' : document.getElementById('email').value.trim().toLowerCase();
  const name = document.getElementById('name').value.trim();
  const pkg = document.getElementById('pkg').value; const ev = document.getElementById('exp').value;
  if(!general && (!email || !email.includes('@'))) return alert('Ilagay ang email ng estudyante.');
  if(!name) return alert('Ilagay ang pangalan.');
  let exp='9999999999'; if(ev!=='life'){ const d=new Date(); if(ev[0]==='h') d.setHours(d.getHours()+parseInt(ev.slice(1))); else if(ev[0]==='d') d.setDate(d.getDate()+parseInt(ev.slice(1))); else d.setMonth(d.getMonth()+parseInt(ev.slice(1))); exp = String(Math.floor(d.getTime()/1000)); }
  const payload = new TextEncoder().encode(`${pkg}|${exp}|${email}|${name}`);
  const key = await crypto.subtle.importKey('jwk', PRIV, {name:'ECDSA', namedCurve:'P-256'}, false, ['sign']);
  const sig = await crypto.subtle.sign({name:'ECDSA', hash:'SHA-256'}, key, payload);
  const nameB = b64u(new TextEncoder().encode(name)).replace(/-/g,'.').replace(/_/g,'~');
  const k = `ECD-${pkg}${exp}-${nameB}-${b64u(sig)}`;
  document.getElementById('key').textContent = k;
  const until = fmtUntil(exp);
  document.getElementById('msg').textContent = general
    ? `You're invited to test ECADEMY — ${NAMES[pkg]} package.\n${until}\n\n1. Open ${HUB}\n2. Click "Log in" (top right)\n3. Email: your own email address\n4. Access key:\n${k}\n\nTry the simulators and tell me what you think!\n\nCaptain Rey · ECADEMY`
    : `Welcome aboard ECADEMY, ${name}!\n\nPackage: ${NAMES[pkg]}\n${until}${ev==='h1'?'\n(Trial access — 1 hour from the time this key was generated.)':''}\n\n1. Open ${HUB}\n2. Click "Log in" (top right)\n3. Email: ${email}\n4. Access key:\n${k}\n\nYour browser remembers the login. Use the same email + key on your phone or laptop.\n\nFair winds,\nCaptain Rey · ECADEMY`;
  document.getElementById('out').classList.add('show');
  const amt = document.getElementById('amt').value.trim(), ref = document.getElementById('ref').value.trim();
  const list = load(); const i = list.findIndex(r => r.email === email && r.pkg === pkg);
  const rec = { date: new Date().toISOString().slice(0,10), name, email, pkg, exp, amt, ref, key: k };
  if(i >= 0) list[i] = rec; else list.unshift(rec);
  save(list); render();
}
const HS = 'ecademy.students';
function load(){ try { return JSON.parse(localStorage.getItem(HS) || '[]'); } catch(e) { return []; } }
function save(l){ localStorage.setItem(HS, JSON.stringify(l)); }
function expCls(exp){ if(exp==='9999999999'||exp==='999912') return ''; let t; if(/^\d{6}$/.test(exp)) t=new Date(parseInt(exp.slice(0,4)),parseInt(exp.slice(4)),1).getTime(); else t=parseInt(exp)*1000; const left=t-Date.now(); if(left<0) return 'dead'; return left<7*864e5?'soon':''; }
function render(){
  const q = (document.getElementById('q').value || '').toLowerCase(); const list = load();
  const rows = list.filter(r => !q || (r.name+' '+r.email+' '+NAMES[r.pkg]).toLowerCase().includes(q));
  document.getElementById('count').textContent = list.length + ' students · ' + list.filter(r=>r.pkg==='J').length + ' Junior · ' + list.filter(r=>r.pkg==='C').length + ' Chief Mate · ' + list.filter(r=>r.pkg==='A').length + ' All Access';
  document.getElementById('rows').innerHTML = rows.map((r,i) => `<tr><td>${r.date}</td><td><b>${r.name}</b><br><span style="color:var(--muted)">${r.email==='*'?'GENERAL CODE · any email':r.email}</span></td><td><span class="pk ${r.pkg}">${NAMES[r.pkg]}</span></td><td><span class="exp ${expCls(r.exp)}">${fmtUntil(r.exp).replace('Valid until ','').replace(' access','')}</span></td><td>${r.amt?'₱'+r.amt:''}${r.ref?'<br><span style="color:var(--muted)">'+r.ref+'</span>':''}</td><td><button data-i="${list.indexOf(r)}" data-act="msg">Message</button> <button data-i="${list.indexOf(r)}" data-act="del">✕</button></td></tr>`).join('') || '<tr><td colspan="6" style="color:var(--muted)">Wala pang estudyante. Mag-generate ng unang key.</td></tr>';
}
document.getElementById('q').addEventListener('input', render);
document.getElementById('rows').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return; const list = load(); const r = list[+b.dataset.i];
  if(b.dataset.act === 'del'){ if(confirm('Remove ' + r.name + ' from the list? (Hindi nito pinapawalang-bisa ang key niya.)')){ list.splice(+b.dataset.i,1); save(list); render(); } return; }
  const until = fmtUntil(r.exp);
  const msg = r.email==='*' ? `You're invited to test ECADEMY — ${NAMES[r.pkg]} package.\n${until}\n\n1. Open ${HUB}\n2. Click "Log in" (top right)\n3. Email: your own email address\n4. Access key:\n${r.key}\n\nCaptain Rey · ECADEMY` : `Welcome aboard ECADEMY, ${r.name}!\n\nPackage: ${NAMES[r.pkg]}\n${until}\n\n1. Open ${HUB}\n2. Click "Log in" (top right)\n3. Email: ${r.email}\n4. Access key:\n${r.key}\n\nYour browser remembers the login. Use the same email + key on your phone or laptop.\n\nFair winds,\nCaptain Rey · ECADEMY`;
  navigator.clipboard.writeText(msg); b.textContent = 'Copied!'; setTimeout(() => b.textContent = 'Message', 1200);
});
document.getElementById('exportCsv').onclick = () => {
  const list = load(); const esc = v => '"' + String(v||'').replace(/"/g,'""') + '"';
  const csv = ['date,name,email,package,expiry,amount,ref,key'].concat(list.map(r => [r.date,r.name,r.email,NAMES[r.pkg],r.exp,r.amt,r.ref,r.key].map(esc).join(','))).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff'+csv], {type:'text/csv'})); a.download = 'ECADEMY_students_' + new Date().toISOString().slice(0,10) + '.csv'; a.click();
};
document.getElementById('importCsv').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange = async e => {
  const f = e.target.files[0]; if(!f) return; const text = await f.text(); const lines = text.replace(/^\ufeff/,'').split(/\r?\n/).slice(1).filter(Boolean);
  const parse = l => { const out=[]; let cur='', q=false; for(const ch of l){ if(ch==='"'){ q=!q; continue; } if(ch===',' && !q){ out.push(cur); cur=''; } else cur+=ch; } out.push(cur); return out; };
  const codeOf = n => Object.keys(NAMES).find(k => NAMES[k] === n) || 'J';
  const list = load(); let added = 0;
  for(const l of lines){ const [date,name,email,pkgName,exp,amt,ref,key] = parse(l); if(!email) continue; const pkg = codeOf(pkgName); if(!list.some(r => r.email===email && r.pkg===pkg)){ list.push({date,name,email,pkg,exp,amt,ref,key}); added++; } }
  save(list); render(); alert(added + ' students imported.'); e.target.value = '';
};
render();
document.getElementById('go').onclick = gen;
document.getElementById('copyKey').onclick = () => navigator.clipboard.writeText(document.getElementById('key').textContent);
document.getElementById('copyMsg').onclick = () => navigator.clipboard.writeText(document.getElementById('msg').textContent);
</script></body></html>
